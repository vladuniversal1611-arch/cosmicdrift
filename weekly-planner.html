* { box-sizing: border-box; margin: 0; padding: 0; }

body {

/* ─── Toolbar ─── */
.toolbar {

/* ─── Pages ─── */
.page {

  display: flex;
  flex-direction: column;
}

.page-left {

.page-right {

}

/* Red margin line */

  top: 0; bottom: 0;
  right: 0;
  width: 1px;
  background: var(--ruled-red);
  opacity: 0.4;
}

.page-right::before {

}

.task-cat-dot {

.task-remove {

}

.task-line:hover .task-remove { opacity: 1; }
.task-remove:hover { color: #E53E3E; }

.notes-section {

}

.notes-section:last-child { border-bottom: none; }

.notes-header {

.notes-title {

}

.notes-textarea {

.page-tabs {

        </div>
      </div>
      <button class="modal-save" id="saveBtn">Додати ✏️</button>
    </div>
  </div>
</div>

<script>
const DAYS_UA = ['Неділя','Понеділок','Вівторок','Середа','Четвер','П\'ятниця','Субота'];
const DAYS_SHORT = ['НД','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

let weekStart = getMonday(new Date());
let modalDay = '';
let selCat = 'work';

function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  dt.setDate(dt.getDate() - day + (day === 0 ? -6 : 1));
  dt.setHours(0,0,0,0);
  return dt;
}

function dk(d) { return d.toISOString().split('T')[0]; }

function load() { try { return JSON.parse(localStorage.getItem('wp2') || '{}'); } catch { return {}; } }
function save(d) { try { localStorage.setItem('wp2', JSON.stringify(d)); } catch {} }
function loadN() { try { return JSON.parse(localStorage.getItem('wp2n') || '{}'); } catch { return {}; } }
function saveN(n) { try { localStorage.setItem('wp2n', JSON.stringify(n)); } catch {} }

function days7() {
  const r = [];
  for (let i = 0; i < 7; i++) { const d = new Date(weekStart); d.setDate(d.getDate()+i); r.push(d); }
  return r;
}

function isToday(d) {
  const t = new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderTitle() {
  const dd = days7(), s = dd[0], e = dd[6];
  document.getElementById('weekTitle').textContent =
    s.getMonth() === e.getMonth()
      ? `${s.getDate()} – ${e.getDate()} ${MONTHS[s.getMonth()]} ${s.getFullYear()}`
      : `${s.getDate()} ${MONTHS[s.getMonth()]} – ${e.getDate()} ${MONTHS[e.getMonth()]} ${e.getFullYear()}`;
}

function renderTask(t, dayKey) {
  const dotCls = 'dot-' + (t.cat || 'work');
  return `<div class="task-line ${t.done ? 'done' : ''}">
    <div class="task-bullet ${t.done ? 'checked' : ''}" onclick="toggle('${dayKey}','${t.id}')"></div>
    <span class="task-cat-dot ${dotCls}"></span>
    <span class="task-label">${esc(t.text)}</span>
    ${t.time ? '<span class="task-time-badge">'+t.time+'</span>' : ''}
    <button class="task-remove" onclick="del('${dayKey}','${t.id}')">✕</button>
  </div>`;
}

function renderDay(d, data) {
  const key = dk(d);
  const tasks = data[key] || [];
  const today = isToday(d);
  return `<div class="day-row ${today ? 'is-today' : ''}">
    <div class="day-row-header" ondblclick="openModal('${key}')">
      <span class="day-number">${d.getDate()}</span>
      <span class="day-weekday">${DAYS_SHORT[d.getDay()]}</span>
      <button class="day-add-btn" onclick="openModal('${key}')">+</button>
    </div>
    <div class="day-tasks">
      ${tasks.map(t => renderTask(t, key)).join('')}
    </div>
  </div>`;
}

function render() {
  renderTitle();
  const dd = days7();
  const data = load();
  const notes = loadN();

  // Left page: Mon–Wed, Right page: Thu–Sun + Notes
  const leftDays = dd.slice(0, 3); // Mon, Tue, Wed
  const rightDays = dd.slice(3, 6); // Thu, Fri, Sat
  const sunday = dd[6];

  // Determine months shown
  const leftMonth = leftDays[0].getMonth();
  const rightMonth = rightDays[rightDays.length - 1].getMonth();

  let html = '';

  // Left page
  html += `<div class="page page-left">
    <div class="page-edge"></div>
    <div class="page-header">
      <span class="page-header-month">${MONTHS[leftMonth]}</span>
      <span class="page-header-year">${leftDays[0].getFullYear()}</span>
    </div>
    <div class="page-days">
      ${leftDays.map(d => renderDay(d, data)).join('')}
    </div>
  </div>`;

  // Spiral
  html += `<div class="spiral">`;
  for (let i = 0; i < 14; i++) html += '<div class="spiral-ring"></div>';
  html += `</div>`;

  // Right page
  const sundayKey = dk(sunday);
  const sundayTasks = data[sundayKey] || [];
  const weekNoteKey = dk(dd[0]) + '_notes';

  html += `<div class="page page-right">
    <div class="page-edge"></div>
    <div class="page-header">
      <span class="page-header-month">${MONTHS[rightMonth]}</span>
      <span class="page-header-year">${rightDays[0].getFullYear()}</span>
    </div>
    <div class="page-days">
      ${rightDays.map(d => renderDay(d, data)).join('')}
      <div class="day-row ${isToday(sunday) ? 'is-today' : ''}">
        <div class="day-row-header" ondblclick="openModal('${sundayKey}')">
          <span class="day-number">${sunday.getDate()}</span>
          <span class="day-weekday">${DAYS_SHORT[sunday.getDay()]}</span>
          <button class="day-add-btn" onclick="openModal('${sundayKey}')">+</button>
        </div>
        <div class="day-tasks">
          ${sundayTasks.map(t => renderTask(t, sundayKey)).join('')}
        </div>
      </div>
      <div class="notes-section">
        <div class="notes-header">
          <span class="notes-title">📝 Нотатки тижня</span>
        </div>
        <textarea class="notes-textarea" placeholder="Думки, ідеї, плани..." oninput="saveNote('${weekNoteKey}',this.value)">${esc(notes[weekNoteKey] || '')}</textarea>
      </div>
    </div>
  </div>`;

  document.getElementById('notebook').innerHTML = html;

  // Footer stats
  let total = 0, done = 0;
  dd.forEach(d => {
    const tasks = data[dk(d)] || [];
    total += tasks.length;
    done += tasks.filter(t => t.done).length;
  });
  document.getElementById('weekFooter').innerHTML = `
    <div class="footer-stat">📋 Завдань: <strong>${total}</strong></div>
    <div class="footer-stat">✅ Виконано: <strong>${done}</strong></div>
    <div class="footer-stat">📊 Прогрес: <strong>${total ? Math.round(done/total*100) : 0}%</strong></div>
  `;
}

function toggle(dayKey, id) {
  const data = load();
  if (!data[dayKey]) return;
  const t = data[dayKey].find(x => x.id === id);
  if (t) { t.done = !t.done; save(data); render(); }
}

function del(dayKey, id) {
  const data = load();
  if (!data[dayKey]) return;
  data[dayKey] = data[dayKey].filter(x => x.id !== id);
  save(data);
  render();
}

function openModal(key) {
  modalDay = key;
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('taskInput').focus(), 80);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('taskInput').value = '';
  document.getElementById('taskTime').value = '';
}

function saveNote(key, val) {
  const n = loadN();
  n[key] = val;
  saveN(n);
}

// Cat picker
document.getElementById('catRow').addEventListener('click', e => {
  const btn = e.target.closest('.cat-chip');
  if (!btn) return;
  document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  selCat = btn.dataset.c;
});

// Save
document.getElementById('saveBtn').addEventListener('click', () => {
  const text = document.getElementById('taskInput').value.trim();
  if (!text) return;
  const time = document.getElementById('taskTime').value;
  const data = load();
  if (!data[modalDay]) data[modalDay] = [];
  data[modalDay].push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    text, time, cat: selCat, done: false
  });
  save(data);
  closeModal();
  render();
});

document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('saveBtn').click();
});

document.getElementById('modalX').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Nav
document.getElementById('prevWeek').addEventListener('click', () => { weekStart.setDate(weekStart.getDate()-7); render(); });
document.getElementById('nextWeek').addEventListener('click', () => { weekStart.setDate(weekStart.getDate()+7); render(); });
document.getElementById('todayBtn').addEventListener('click', () => { weekStart = getMonday(new Date()); render(); });

// Keys
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (document.getElementById('modal').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') { weekStart.setDate(weekStart.getDate()-7); render(); }
  if (e.key === 'ArrowRight') { weekStart.setDate(weekStart.getDate()+7); render(); }
});

// Swipe
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 80) {
    if (dx > 0) weekStart.setDate(weekStart.getDate()-7);
    else weekStart.setDate(weekStart.getDate()+7);
    render();
  }
}, { passive: true });

render();
</script>
