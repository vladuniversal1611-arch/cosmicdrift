<title>План Тижня</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Caveat:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F5F0E8;
  --bg-page: #FFFDF7;
  --bg-card: #FFFFFF;
  --bg-sidebar: #2B4570;
  --bg-sidebar-hover: #3A5A8A;
  --bg-input: #F7F3EB;
  --bg-modal: rgba(43, 69, 112, 0.45);
  --text: #2C2825;
  --text-secondary: #7A746B;
  --text-sidebar: #C8D6E8;
  --text-sidebar-active: #FFFFFF;
  --accent: #2B4570;
  --accent-light: #E8EEF6;
  --coral: #D95040;
  --coral-light: #FDECEA;
  --sage: #4A8B62;
  --sage-light: #E6F3EB;
  --gold: #C8952E;
  --gold-light: #FFF5DE;
  --purple: #7B5EA7;
  --purple-light: #F0EAF7;
  --border: #E5DFD3;
  --border-light: #F0EBE0;
  --shadow: rgba(44, 40, 37, 0.08);
  --shadow-strong: rgba(44, 40, 37, 0.15);
  --check-bg: #E8E3D8;
  --today-stripe: #2B4570;
  --day-header-bg: #F7F3EB;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121218;
    --bg-page: #1A1A22;
    --bg-card: #22222C;
    --bg-sidebar: #161620;
    --bg-sidebar-hover: #252535;
    --bg-input: #2A2A36;
    --bg-modal: rgba(0, 0, 0, 0.6);
    --text: #E4E0DA;
    --text-secondary: #8A8690;
    --text-sidebar: #8A8AAA;
    --text-sidebar-active: #FFFFFF;
    --accent: #6B9FE8;
    --accent-light: #1E2840;
    --coral: #E8705E;
    --coral-light: #3A2028;
    --sage: #5EAA78;
    --sage-light: #1A3028;
    --gold: #E0AE44;
    --gold-light: #332A18;
    --purple: #A07ED0;
    --purple-light: #2A2240;
    --border: #32323E;
    --border-light: #28282F;
    --shadow: rgba(0, 0, 0, 0.25);
    --shadow-strong: rgba(0, 0, 0, 0.4);
    --check-bg: #32323E;
    --today-stripe: #6B9FE8;
    --day-header-bg: #1E1E28;
  }
}

:root[data-theme="dark"] {
  --bg: #121218;
  --bg-page: #1A1A22;
  --bg-card: #22222C;
  --bg-sidebar: #161620;
  --bg-sidebar-hover: #252535;
  --bg-input: #2A2A36;
  --bg-modal: rgba(0, 0, 0, 0.6);
  --text: #E4E0DA;
  --text-secondary: #8A8690;
  --text-sidebar: #8A8AAA;
  --text-sidebar-active: #FFFFFF;
  --accent: #6B9FE8;
  --accent-light: #1E2840;
  --coral: #E8705E;
  --coral-light: #3A2028;
  --sage: #5EAA78;
  --sage-light: #1A3028;
  --gold: #E0AE44;
  --gold-light: #332A18;
  --purple: #A07ED0;
  --purple-light: #2A2240;
  --border: #32323E;
  --border-light: #28282F;
  --shadow: rgba(0, 0, 0, 0.25);
  --shadow-strong: rgba(0, 0, 0, 0.4);
  --check-bg: #32323E;
  --today-stripe: #6B9FE8;
  --day-header-bg: #1E1E28;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ─── Sidebar ─── */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  z-index: 10;
  transition: transform 0.3s ease;
}

.sidebar-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-logo {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-sidebar-active);
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #4A8FE8, #2B4570);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: white;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
}

.sidebar-nav {
  flex: 1;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  color: var(--text-sidebar);
  cursor: pointer;
  font-size: 14px;
  font-weight: 400;
  transition: background 0.15s, color 0.15s;
  user-select: none;
}

.nav-item:hover { background: var(--bg-sidebar-hover); color: var(--text-sidebar-active); }
.nav-item.active { background: var(--bg-sidebar-hover); color: var(--text-sidebar-active); font-weight: 600; }

.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

.nav-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(200, 214, 232, 0.4);
  padding: 20px 14px 6px;
}

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-sidebar);
  font-size: 12px;
}

.category-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ─── Main ─── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: var(--bg-page);
  border-bottom: 1px solid var(--border-light);
  gap: 16px;
  flex-shrink: 0;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.menu-btn {
  display: none;
  background: none; border: none;
  color: var(--text);
  cursor: pointer;
  padding: 4px;
}

.menu-btn svg { width: 22px; height: 22px; }

.week-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}

.week-nav button {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}

.week-nav button:hover { border-color: var(--accent); background: var(--accent-light); }

.week-nav button svg { width: 16px; height: 16px; }

.week-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 20px;
  font-weight: 600;
  white-space: nowrap;
}

.today-btn {
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.today-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.view-toggle {
  display: flex;
  background: var(--bg-input);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}

.view-toggle button {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.view-toggle button.active {
  background: var(--bg-card);
  color: var(--text);
  box-shadow: 0 1px 3px var(--shadow);
}

/* ─── Content area ─── */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 24px 40px;
}

/* ─── Week Grid ─── */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  min-height: 0;
}

.day-card {
  background: var(--bg-card);
  border-radius: 12px;
  border: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  min-height: 420px;
  transition: box-shadow 0.2s, border-color 0.2s;
  overflow: hidden;
  position: relative;
}

.day-card:hover {
  box-shadow: 0 4px 16px var(--shadow);
  border-color: var(--border);
}

.day-card.is-today {
  border-color: var(--today-stripe);
  box-shadow: 0 2px 12px var(--shadow);
}

.day-card.is-today .day-header {
  background: var(--accent);
  color: white;
}

.day-card.is-today .day-header .day-name,
.day-card.is-today .day-header .day-date {
  color: white;
}

.day-card.is-today .day-header .day-date {
  opacity: 0.85;
}

.day-header {
  padding: 12px 14px;
  background: var(--day-header-bg);
  border-bottom: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.day-name {
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text);
}

.day-date {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

.day-tasks {
  flex: 1;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}

.task-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
  min-height: 32px;
}

.task-item:hover { background: var(--bg-input); }

.task-check {
  width: 18px; height: 18px;
  border-radius: 5px;
  border: 2px solid var(--check-bg);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}

.task-check:hover { border-color: var(--accent); }

.task-check.checked {
  background: var(--sage);
  border-color: var(--sage);
}

.task-check.checked::after {
  content: '';
  width: 6px; height: 10px;
  border: solid white; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  margin-top: -2px;
}

.task-text {
  flex: 1;
  font-size: 13px;
  line-height: 1.4;
  word-break: break-word;
}

.task-item.completed .task-text {
  text-decoration: line-through;
  color: var(--text-secondary);
  opacity: 0.6;
}

.task-category-tag {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 6px;
}

.task-delete {
  opacity: 0;
  background: none; border: none;
  color: var(--coral);
  cursor: pointer;
  padding: 2px;
  flex-shrink: 0;
  transition: opacity 0.15s;
}

.task-item:hover .task-delete { opacity: 1; }
.task-delete svg { width: 14px; height: 14px; }

.add-task-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  margin: 4px 10px 10px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  width: calc(100% - 20px);
}

.add-task-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}

.add-task-btn svg { width: 14px; height: 14px; }

/* ─── Day View ─── */
.day-view {
  max-width: 640px;
  margin: 0 auto;
}

.day-view-header {
  text-align: center;
  margin-bottom: 28px;
}

.day-view-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 4px;
}

.day-view-subtitle {
  color: var(--text-secondary);
  font-size: 15px;
}

.day-view-nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 24px;
}

.day-view-nav button {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
}

.day-view-nav button.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.day-view-nav button:hover:not(.active) {
  border-color: var(--accent);
  color: var(--accent);
}

.day-view-content {
  background: var(--bg-card);
  border-radius: 16px;
  border: 1px solid var(--border-light);
  padding: 24px;
  box-shadow: 0 2px 12px var(--shadow);
}

.dv-section {
  margin-bottom: 24px;
}

.dv-section:last-child { margin-bottom: 0; }

.dv-section-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.dv-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-light);
}

.dv-tasks { display: flex; flex-direction: column; gap: 4px; }

.dv-task-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
}

.dv-task-item:hover { background: var(--bg-input); }

.dv-task-text {
  flex: 1;
  font-size: 15px;
  line-height: 1.5;
}

.dv-task-item.completed .dv-task-text {
  text-decoration: line-through;
  color: var(--text-secondary);
  opacity: 0.6;
}

.dv-task-time {
  font-size: 12px;
  color: var(--text-secondary);
  flex-shrink: 0;
  margin-top: 2px;
}

.notes-area {
  width: 100%;
  min-height: 120px;
  border: 1px solid var(--border-light);
  border-radius: 10px;
  padding: 14px;
  font-family: 'Caveat', cursive;
  font-size: 18px;
  line-height: 1.7;
  color: var(--text);
  background: var(--bg-input);
  resize: vertical;
  transition: border-color 0.15s;
}

.notes-area:focus {
  outline: none;
  border-color: var(--accent);
}

.notes-area::placeholder { color: var(--text-secondary); opacity: 0.5; }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-modal);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  padding: 20px;
}

.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--bg-card);
  border-radius: 16px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 20px 60px var(--shadow-strong);
  transform: translateY(12px);
  transition: transform 0.25s ease;
  overflow: hidden;
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal-header {
  padding: 20px 24px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 18px;
  font-weight: 600;
}

.modal-close {
  width: 30px; height: 30px;
  border-radius: 8px;
  border: none;
  background: var(--bg-input);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}

.modal-close:hover { background: var(--border); }

.modal-body { padding: 0 24px 24px; }

.form-group { margin-bottom: 16px; }

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-secondary);
}

.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-input);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.15s;
}

.form-input:focus { outline: none; border-color: var(--accent); }

.category-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.cat-option {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

.cat-option:hover { border-color: var(--text-secondary); }

.cat-option.selected {
  border-color: transparent;
  font-weight: 600;
}

.cat-option .cat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}

.btn-primary {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  font-family: inherit;
}

.btn-primary:hover { opacity: 0.9; }

/* ─── Stats row ─── */
.stats-row {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.stat-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.stat-icon.blue { background: var(--accent-light); color: var(--accent); }
.stat-icon.green { background: var(--sage-light); color: var(--sage); }
.stat-icon.coral { background: var(--coral-light); color: var(--coral); }
.stat-icon.gold { background: var(--gold-light); color: var(--gold); }

.stat-value {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ─── Progress bar for day ─── */
.day-progress {
  height: 3px;
  background: var(--border-light);
  margin: 0 10px;
  border-radius: 2px;
  overflow: hidden;
}

.day-progress-bar {
  height: 100%;
  background: var(--sage);
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* ─── Sidebar overlay for mobile ─── */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 9;
}

/* ─── Responsive ─── */
@media (max-width: 1100px) {
  .week-grid { grid-template-columns: repeat(4, 1fr); }
}

@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    transform: translateX(-100%);
    z-index: 20;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .menu-btn { display: flex; }
  .week-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .content { padding: 16px; }
  .topbar { padding: 12px 16px; }
  .week-title { font-size: 16px; }
  .stats-row { flex-wrap: wrap; }
  .stat-card { min-width: calc(50% - 6px); }
  .day-card { min-height: 300px; }
}

@media (max-width: 480px) {
  .week-grid { grid-template-columns: 1fr; }
  .stat-card { min-width: 100%; }
  .view-toggle { display: none; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
</style>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">П</div>
        План Тижня
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-view="week">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Тижневий вигляд
      </div>
      <div class="nav-item" data-view="day">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><circle cx="12" cy="16" r="1"/></svg>
        Денний вигляд
      </div>
      <div class="nav-section-title">Категорії</div>
      <div class="nav-item" data-filter="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        Усі завдання
      </div>
      <div class="nav-item" data-filter="work">
        <span class="category-dot" style="background: var(--accent)"></span>
        Робота
      </div>
      <div class="nav-item" data-filter="personal">
        <span class="category-dot" style="background: var(--coral)"></span>
        Особисте
      </div>
      <div class="nav-item" data-filter="health">
        <span class="category-dot" style="background: var(--sage)"></span>
        Здоров'я
      </div>
      <div class="nav-item" data-filter="study">
        <span class="category-dot" style="background: var(--gold)"></span>
        Навчання
      </div>
      <div class="nav-item" data-filter="ideas">
        <span class="category-dot" style="background: var(--purple)"></span>
        Ідеї
      </div>
    </nav>
    <div class="sidebar-footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:16px;height:16px"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6v4l3 3"/></svg>
      Дані зберігаються локально
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="week-nav">
          <button id="prevWeek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span class="week-title" id="weekTitle"></span>
          <button id="nextWeek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <button class="today-btn" id="todayBtn">Сьогодні</button>
      </div>
      <div class="topbar-right">
        <div class="view-toggle">
          <button class="active" data-view="week">Тиждень</button>
          <button data-view="day">День</button>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Нове завдання</div>
      <button class="modal-close" id="modalClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Завдання</label>
        <input class="form-input" id="taskInput" type="text" placeholder="Що потрібно зробити?" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Час (необов'язково)</label>
        <input class="form-input" id="taskTime" type="time">
      </div>
      <div class="form-group">
        <label class="form-label">Категорія</label>
        <div class="category-picker" id="catPicker">
          <button class="cat-option selected" data-cat="work" style="background: var(--accent-light)"><span class="cat-dot" style="background: var(--accent)"></span>Робота</button>
          <button class="cat-option" data-cat="personal"><span class="cat-dot" style="background: var(--coral)"></span>Особисте</button>
          <button class="cat-option" data-cat="health"><span class="cat-dot" style="background: var(--sage)"></span>Здоров'я</button>
          <button class="cat-option" data-cat="study"><span class="cat-dot" style="background: var(--gold)"></span>Навчання</button>
          <button class="cat-option" data-cat="ideas"><span class="cat-dot" style="background: var(--purple)"></span>Ідеї</button>
        </div>
      </div>
      <button class="btn-primary" id="saveTask">Додати завдання</button>
    </div>
  </div>
</div>

<script>
const DAYS_UA = ['Неділя','Понеділок','Вівторок','Середа','Четвер','П\'ятниця','Субота'];
const DAYS_SHORT = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS_UA = ['Січня','Лютого','Березня','Квітня','Травня','Червня','Липня','Серпня','Вересня','Жовтня','Листопада','Грудня'];
const MONTHS_FULL = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

const CAT_COLORS = {
  work: { bg: 'var(--accent-light)', dot: 'var(--accent)' },
  personal: { bg: 'var(--coral-light)', dot: 'var(--coral)' },
  health: { bg: 'var(--sage-light)', dot: 'var(--sage)' },
  study: { bg: 'var(--gold-light)', dot: 'var(--gold)' },
  ideas: { bg: 'var(--purple-light)', dot: 'var(--purple)' }
};

// State
let currentWeekStart = getMonday(new Date());
let currentView = 'week';
let selectedDayIdx = 0;
let modalDayKey = '';
let selectedCat = 'work';
let activeFilter = 'all';

function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff);
  dt.setHours(0,0,0,0);
  return dt;
}

function dayKey(date) {
  return date.toISOString().split('T')[0];
}

function loadData() {
  try { return JSON.parse(localStorage.getItem('weekplan_data') || '{}'); } catch(e) { return {}; }
}

function saveData(data) {
  try { localStorage.setItem('weekplan_data', JSON.stringify(data)); } catch(e) {}
}

function loadNotes() {
  try { return JSON.parse(localStorage.getItem('weekplan_notes') || '{}'); } catch(e) { return {}; }
}

function saveNotes(notes) {
  try { localStorage.setItem('weekplan_notes', JSON.stringify(notes)); } catch(e) {}
}

function getWeekDays() {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(currentWeekStart);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  return days;
}

function isToday(d) {
  const t = new Date();
  return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
}

function getTasksForDay(dk) {
  const data = loadData();
  let tasks = data[dk] || [];
  if (activeFilter !== 'all') {
    tasks = tasks.filter(t => t.cat === activeFilter);
  }
  return tasks;
}

function renderWeekTitle() {
  const days = getWeekDays();
  const s = days[0], e = days[6];
  const title = s.getMonth() === e.getMonth()
    ? `${s.getDate()} – ${e.getDate()} ${MONTHS_UA[s.getMonth()]} ${s.getFullYear()}`
    : `${s.getDate()} ${MONTHS_UA[s.getMonth()]} – ${e.getDate()} ${MONTHS_UA[e.getMonth()]} ${e.getFullYear()}`;
  document.getElementById('weekTitle').textContent = title;
}

function renderStats(days) {
  const data = loadData();
  let total = 0, done = 0, overdue = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const cats = {};
  days.forEach(d => {
    const dk = dayKey(d);
    const tasks = data[dk] || [];
    tasks.forEach(t => {
      total++;
      if (t.done) done++;
      else if (d < today) overdue++;
      cats[t.cat] = (cats[t.cat] || 0) + 1;
    });
  });
  const topCat = Object.entries(cats).sort((a,b) => b[1]-a[1])[0];
  const catNames = { work:'Робота', personal:'Особисте', health:"Здоров'я", study:'Навчання', ideas:'Ідеї' };

  return `<div class="stats-row">
    <div class="stat-card"><div class="stat-icon blue">📋</div><div><div class="stat-value">${total}</div><div class="stat-label">Усього завдань</div></div></div>
    <div class="stat-card"><div class="stat-icon green">✓</div><div><div class="stat-value">${total ? Math.round(done/total*100) : 0}%</div><div class="stat-label">Виконано</div></div></div>
    <div class="stat-card"><div class="stat-icon coral">⏰</div><div><div class="stat-value">${overdue}</div><div class="stat-label">Прострочено</div></div></div>
    <div class="stat-card"><div class="stat-icon gold">★</div><div><div class="stat-value">${topCat ? catNames[topCat[0]] : '—'}</div><div class="stat-label">Топ категорія</div></div></div>
  </div>`;
}

function renderWeekView() {
  const days = getWeekDays();
  const data = loadData();
  let html = renderStats(days);
  html += '<div class="week-grid">';
  days.forEach((d, i) => {
    const dk = dayKey(d);
    const tasks = getTasksForDay(dk);
    const allTasks = data[dk] || [];
    const doneCount = allTasks.filter(t => t.done).length;
    const progress = allTasks.length ? (doneCount / allTasks.length * 100) : 0;
    const today = isToday(d);

    html += `<div class="day-card ${today ? 'is-today' : ''}">
      <div class="day-header">
        <span class="day-name">${DAYS_SHORT[d.getDay()]}</span>
        <span class="day-date">${d.getDate()} ${MONTHS_UA[d.getMonth()]}</span>
      </div>
      <div class="day-progress"><div class="day-progress-bar" style="width:${progress}%"></div></div>
      <div class="day-tasks">`;
    tasks.forEach(t => {
      const col = CAT_COLORS[t.cat] || CAT_COLORS.work;
      html += `<div class="task-item ${t.done ? 'completed' : ''}" data-id="${t.id}" data-day="${dk}">
        <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask('${dk}','${t.id}',event)"></div>
        <span class="task-category-tag" style="background:${col.dot}"></span>
        <span class="task-text">${escHtml(t.text)}${t.time ? ' <small style="color:var(--text-secondary)">'+t.time+'</small>' : ''}</span>
        <button class="task-delete" onclick="deleteTask('${dk}','${t.id}',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>`;
    });
    html += `</div>
      <button class="add-task-btn" onclick="openModal('${dk}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Додати
      </button>
    </div>`;
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function renderDayView() {
  const days = getWeekDays();
  const d = days[selectedDayIdx] || days[0];
  const dk = dayKey(d);
  const data = loadData();
  const tasks = getTasksForDay(dk);
  const allTasks = data[dk] || [];
  const notes = loadNotes();

  let html = `<div class="day-view">
    <div class="day-view-header">
      <div class="day-view-title">${DAYS_UA[d.getDay()]}</div>
      <div class="day-view-subtitle">${d.getDate()} ${MONTHS_UA[d.getMonth()]} ${d.getFullYear()}</div>
    </div>
    <div class="day-view-nav">`;
  days.forEach((dd, i) => {
    html += `<button class="${i === selectedDayIdx ? 'active' : ''}" onclick="selectedDayIdx=${i};render()">${DAYS_SHORT[dd.getDay()]} ${dd.getDate()}</button>`;
  });
  html += `</div><div class="day-view-content">`;

  // Tasks section
  const pending = tasks.filter(t => !t.done);
  const completed = tasks.filter(t => t.done);

  if (pending.length || completed.length) {
    if (pending.length) {
      html += `<div class="dv-section"><div class="dv-section-title">Завдання</div><div class="dv-tasks">`;
      pending.forEach(t => {
        const col = CAT_COLORS[t.cat] || CAT_COLORS.work;
        html += `<div class="dv-task-item" data-id="${t.id}" data-day="${dk}">
          <div class="task-check" onclick="toggleTask('${dk}','${t.id}',event)"></div>
          <span class="task-category-tag" style="background:${col.dot}"></span>
          <span class="dv-task-text">${escHtml(t.text)}</span>
          ${t.time ? '<span class="dv-task-time">'+t.time+'</span>' : ''}
          <button class="task-delete" style="opacity:0.5" onclick="deleteTask('${dk}','${t.id}',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>`;
      });
      html += '</div></div>';
    }
    if (completed.length) {
      html += `<div class="dv-section"><div class="dv-section-title">Виконано (${completed.length})</div><div class="dv-tasks">`;
      completed.forEach(t => {
        const col = CAT_COLORS[t.cat] || CAT_COLORS.work;
        html += `<div class="dv-task-item completed">
          <div class="task-check checked" onclick="toggleTask('${dk}','${t.id}',event)"></div>
          <span class="task-category-tag" style="background:${col.dot}"></span>
          <span class="dv-task-text">${escHtml(t.text)}</span>
          <button class="task-delete" style="opacity:0.5" onclick="deleteTask('${dk}','${t.id}',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>`;
      });
      html += '</div></div>';
    }
  }

  html += `<div style="margin-top:12px"><button class="add-task-btn" style="margin:0;width:100%" onclick="openModal('${dk}')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Додати завдання
  </button></div>`;

  // Notes
  html += `<div class="dv-section" style="margin-top:24px">
    <div class="dv-section-title">Нотатки</div>
    <textarea class="notes-area" placeholder="Запишіть думки, ідеї, нотатки..." oninput="saveNote('${dk}',this.value)">${escHtml(notes[dk] || '')}</textarea>
  </div>`;

  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

function render() {
  renderWeekTitle();
  if (currentView === 'week') renderWeekView();
  else renderDayView();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toggleTask(dk, id, e) {
  e.stopPropagation();
  const data = loadData();
  if (!data[dk]) return;
  const t = data[dk].find(x => x.id === id);
  if (t) { t.done = !t.done; saveData(data); render(); }
}

function deleteTask(dk, id, e) {
  e.stopPropagation();
  const data = loadData();
  if (!data[dk]) return;
  data[dk] = data[dk].filter(x => x.id !== id);
  saveData(data);
  render();
}

function openModal(dk) {
  modalDayKey = dk;
  document.getElementById('taskModal').classList.add('open');
  setTimeout(() => document.getElementById('taskInput').focus(), 100);
}

function closeModal() {
  document.getElementById('taskModal').classList.remove('open');
  document.getElementById('taskInput').value = '';
  document.getElementById('taskTime').value = '';
}

function saveNote(dk, val) {
  const notes = loadNotes();
  notes[dk] = val;
  saveNotes(notes);
}

// Category picker
document.getElementById('catPicker').addEventListener('click', e => {
  const btn = e.target.closest('.cat-option');
  if (!btn) return;
  document.querySelectorAll('.cat-option').forEach(b => { b.classList.remove('selected'); b.style.background = ''; });
  btn.classList.add('selected');
  const cat = btn.dataset.cat;
  selectedCat = cat;
  btn.style.background = CAT_COLORS[cat].bg;
});

// Save task
document.getElementById('saveTask').addEventListener('click', () => {
  const text = document.getElementById('taskInput').value.trim();
  if (!text) return;
  const time = document.getElementById('taskTime').value;
  const data = loadData();
  if (!data[modalDayKey]) data[modalDayKey] = [];
  data[modalDayKey].push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    text, time, cat: selectedCat, done: false
  });
  saveData(data);
  closeModal();
  render();
});

// Enter to save
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('saveTask').click();
});

// Modal close
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('taskModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Week nav
document.getElementById('prevWeek').addEventListener('click', () => {
  currentWeekStart.setDate(currentWeekStart.getDate() - 7);
  render();
});
document.getElementById('nextWeek').addEventListener('click', () => {
  currentWeekStart.setDate(currentWeekStart.getDate() + 7);
  render();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  currentWeekStart = getMonday(new Date());
  const today = new Date();
  selectedDayIdx = (today.getDay() + 6) % 7;
  render();
});

// View toggles
document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentView = btn.dataset.view;
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll(`[data-view="${currentView}"]`).forEach(b => b.classList.add('active'));
    if (currentView === 'day') {
      const today = new Date();
      const monday = getMonday(today);
      if (currentWeekStart.getTime() === monday.getTime()) {
        selectedDayIdx = (today.getDay() + 6) % 7;
      }
    }
    render();
  });
});

// Filter
document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

// Mobile menu
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
});

// Touch swipe for week nav
let touchStartX = 0;
document.getElementById('content').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.getElementById('content').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 80) {
    if (dx > 0) currentWeekStart.setDate(currentWeekStart.getDate() - 7);
    else currentWeekStart.setDate(currentWeekStart.getDate() + 7);
    render();
  }
}, { passive: true });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (document.getElementById('taskModal').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') { currentWeekStart.setDate(currentWeekStart.getDate() - 7); render(); }
  if (e.key === 'ArrowRight') { currentWeekStart.setDate(currentWeekStart.getDate() + 7); render(); }
});

// Init
render();
</script>
