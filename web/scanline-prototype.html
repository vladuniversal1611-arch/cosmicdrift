<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scanline — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; position: fixed; overflow: hidden;
    background: #1A1A1A; touch-action: none;
    font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: fixed; inset: 0; z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(26, 26, 26, 0.94); color: #E8E8E8; text-align: center; padding: 28px;
    letter-spacing: 1.5px;
  }
  .overlay.hidden { display: none; }
  .title { font-size: clamp(22px, 6vw, 34px); font-weight: 600; color: #F2F2F2; letter-spacing: 6px; }
  .subtitle { font-size: clamp(11px, 2.6vw, 13px); color: #9AA0A6; max-width: 420px; line-height: 1.7; }
  .btn {
    margin-top: 6px; padding: 13px 30px; border: 1px solid #9AA0A6; background: transparent;
    color: #E8E8E8; font-family: inherit; font-size: 12px; letter-spacing: 4px;
    text-transform: uppercase; cursor: pointer;
  }
  .btn:active { background: #E8E8E8; color: #1A1A1A; }
  .stat-row { display: flex; gap: 30px; font-size: 11px; color: #6B6F73; margin-top: 4px; letter-spacing: 2px; }
  .stat-row b { display: block; margin-top: 4px; color: #F2F2F2; font-size: 16px; font-weight: 600; }

  #muteBtn {
    position: fixed; top: 14px; right: 14px; z-index: 6;
    background: transparent; border: 1px solid #3A3A3A; color: #6B6F73;
    font-family: inherit; font-size: 10px; letter-spacing: 2px; padding: 7px 11px; cursor: pointer;
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <button id="muteBtn">SND: ON</button>

  <div id="bootOverlay" class="overlay">
    <div class="title">SCANLINE</div>
    <div class="subtitle">
      SIGNAL ACQUIRED — STANDBY FOR SWEEP.<br>
      TAP TO FREEZE THE LINE AND INTERCEPT MULTIPLE TARGETS AT ONCE.<br>
      AVOID PROTECTED NODES.
    </div>
    <button class="btn" id="startBtn">Tap to Begin</button>
    <div class="stat-row">BEST SWEEP<b id="bestScoreLabel">0</b></div>
  </div>

  <div id="overOverlay" class="overlay hidden">
    <div class="title">SYSTEM REBOOT</div>
    <div class="stat-row">
      <div>SCORE<b id="finalScore">0</b></div>
      <div>BEST COMBO<b id="finalCombo">0</b></div>
      <div>DATA FRAGMENTS<b id="finalDF">0</b></div>
    </div>
    <button class="btn" id="restartBtn">Run Again</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const bootOverlay = document.getElementById('bootOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const muteBtn = document.getElementById('muteBtn');
  const bestScoreLabel = document.getElementById('bestScoreLabel');
  const finalScoreEl = document.getElementById('finalScore');
  const finalComboEl = document.getElementById('finalCombo');
  const finalDFEl = document.getElementById('finalDF');

  const COLORS = {
    bg: '#1A1A1A',
    grid: 'rgba(154,160,166,0.07)',
    scanlineIdle: '#E8E8E8',
    scanlineFlash: '#FFFFFF',
    pulseBand: 'rgba(232,232,232,0.08)',
    standard: '#9AA0A6',
    bonus: '#D8D8D8',
    node: '#C9CDD3',
    trail: 'rgba(154,160,166,0.9)',
    text: '#F2F2F2',
    dim: '#6B6F73',
    reboot: '#E5484D'
  };

  const CONFIG = {
    freezeDuration: 0.18,
    cooldownDuration: 0.08,
    pulseHalfWidthRatio: 0.016,
    baseScore: 100,
    bonusMultiplier: 3,
    comboMultipliers: [0, 1, 2, 3, 5],
    startingLives: 3,
    bonusChance: 0.12,
    hudHeight: 78
  };

  // Difficulty ramp: mirrors GDD section 4.5 (spawn/speed bands, node chance over run time)
  const RAMP = [
    { t: 0,  spawnMin: 1.0, spawnMax: 1.4, speedMin: 0.6, speedMax: 1.4, nodeChance: 0.10 },
    { t: 20, spawnMin: 0.8, spawnMax: 1.2, speedMin: 0.8, speedMax: 1.8, nodeChance: 0.16 },
    { t: 50, spawnMin: 0.6, spawnMax: 1.0, speedMin: 1.0, speedMax: 2.2, nodeChance: 0.22 },
    { t: 90, spawnMin: 0.5, spawnMax: 0.8, speedMin: 1.2, speedMax: 2.4, nodeChance: 0.28 }
  ];

  function rampFor(elapsed) {
    let current = RAMP[0];
    for (const stage of RAMP) if (elapsed >= stage.t) current = stage;
    return current;
  }

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let width = 0, height = 0, playTop = 0, playHeight = 0, pxPerUnit = 1;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    playTop = CONFIG.hudHeight;
    playHeight = height - playTop - 24;
    pxPerUnit = playHeight / 8; // matches the 8-unit sweep range in the GDD tuning table
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Audio: everything is synthesized, no external assets ---
  let audioCtx = null;
  let muted = false;
  let humOsc = null, humLfo = null, humGain = null;

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, duration, type, gainPeak, when) {
    if (muted || !audioCtx) return;
    const t0 = audioCtx.currentTime + (when || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playClick() { tone(220, 0.05, 'square', 0.06); }
  function playChirp(step) { tone(720 + step * 90, 0.09, 'triangle', 0.07); }
  function playCombo(multiplier) { tone(300 + multiplier * 160, 0.22, 'sine', 0.09); }
  function playThud() { tone(70, 0.35, 'square', 0.16); tone(45, 0.4, 'sine', 0.12, 0.02); }
  function playShield() { tone(500, 0.12, 'triangle', 0.05); }

  function startHum() {
    if (muted || !audioCtx || humOsc) return;
    humOsc = audioCtx.createOscillator();
    humOsc.type = 'sine';
    humOsc.frequency.value = 55;
    humGain = audioCtx.createGain();
    humGain.gain.value = 0.015;
    humLfo = audioCtx.createOscillator();
    humLfo.frequency.value = 0.07;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.008;
    humLfo.connect(lfoGain).connect(humGain.gain);
    humOsc.connect(humGain).connect(audioCtx.destination);
    humLfo.start();
    humOsc.start();
  }

  function stopHum() {
    if (humOsc) { humOsc.stop(); humLfo.stop(); humOsc = null; humLfo = null; }
  }

  // --- Game state ---
  let targets = [];
  let floatingTexts = [];
  let nextId = 1;

  const scanline = { y: 0, dir: 1, state: 'sweep', timer: 0, flash: 0 };

  const game = {
    state: 'boot',
    score: 0, df: 0, lives: CONFIG.startingLives, shields: 0,
    streak: 0, bestCombo: 0,
    bestScore: Number(localStorage.getItem('scanline_best') || 0),
    runStart: 0, spawnTimer: 0, reboot: 0
  };
  bestScoreLabel.textContent = game.bestScore;

  function resetRun() {
    targets = [];
    floatingTexts = [];
    scanline.y = playTop;
    scanline.dir = 1;
    scanline.state = 'sweep';
    scanline.timer = 0;
    scanline.flash = 0;
    game.score = 0;
    game.df = 0;
    game.lives = CONFIG.startingLives;
    game.shields = 0;
    game.streak = 0;
    game.bestCombo = 0;
    game.runStart = performance.now();
    game.spawnTimer = 0.4;
    game.reboot = 0;
    game.state = 'playing';
  }

  function spawnTarget(elapsed) {
    const stage = rampFor(elapsed);
    const roll = Math.random();
    let kind = 'standard';
    if (roll < stage.nodeChance) kind = 'node';
    else if (roll < stage.nodeChance + CONFIG.bonusChance) kind = 'bonus';

    const fromLeft = Math.random() < 0.5;
    const x = fromLeft ? -20 : width + 20;
    const y = playTop + Math.random() * playHeight;
    const speedU = stage.speedMin + Math.random() * (stage.speedMax - stage.speedMin);
    const speed = speedU * pxPerUnit;
    const angle = (Math.random() * 40 - 20) * Math.PI / 180;
    const dirX = fromLeft ? 1 : -1;
    const vx = dirX * Math.cos(angle) * speed;
    const vy = Math.sin(angle) * speed;
    const radius = kind === 'bonus' ? playHeight * 0.016
      : kind === 'node' ? playHeight * 0.02
      : playHeight * 0.024;

    targets.push({ id: nextId++, kind, x, y, vx, vy, radius });
  }

  function updateScanline(dt) {
    const sweepSpeed = pxPerUnit * 3; // 3 units/sec, per GDD default
    switch (scanline.state) {
      case 'sweep':
        scanline.y += scanline.dir * sweepSpeed * dt;
        if (scanline.y >= playTop + playHeight) { scanline.y = playTop + playHeight; scanline.dir = -1; }
        else if (scanline.y <= playTop) { scanline.y = playTop; scanline.dir = 1; }
        break;
      case 'frozen':
        scanline.timer -= dt;
        if (scanline.timer <= 0) { scanline.state = 'cooldown'; scanline.timer = CONFIG.cooldownDuration; }
        break;
      case 'cooldown':
        scanline.timer -= dt;
        if (scanline.timer <= 0) scanline.state = 'sweep';
        break;
    }
  }

  function scoreHits(hitTargets) {
    game.streak++;
    const idx = Math.min(hitTargets.length, CONFIG.comboMultipliers.length - 1);
    const multiplier = CONFIG.comboMultipliers[idx];
    let raw = 0;
    hitTargets.forEach((t, i) => {
      raw += t.kind === 'bonus' ? CONFIG.baseScore * CONFIG.bonusMultiplier : CONFIG.baseScore;
      playChirp(i);
    });
    const score = raw * multiplier;
    const df = hitTargets.length * multiplier;
    game.score += score;
    game.df += df;
    game.bestCombo = Math.max(game.bestCombo, hitTargets.length);
    if (multiplier > 1) playCombo(multiplier);
    floatingTexts.push({ x: width / 2, y: scanline.y - 12, text: `+${score} :: X${multiplier}`, life: 0.7 });
  }

  function handleReboot() {
    game.streak = 0;
    game.reboot = 0.12;
    if (game.shields > 0) { game.shields--; playShield(); return; }
    game.lives--;
    playThud();
    if (game.lives <= 0) endRun();
  }

  function resolvePulse() {
    const halfWidth = playHeight * CONFIG.pulseHalfWidthRatio;
    const hitTargets = [];
    const hitNodes = [];
    for (const t of targets) {
      const reach = halfWidth + t.radius;
      if (Math.abs(t.y - scanline.y) <= reach) {
        (t.kind === 'node' ? hitNodes : hitTargets).push(t);
      }
    }

    // A node breach overrides scoring for this pulse — matches the GDD's
    // "hitting a protected node breaks the current combo" rule.
    if (hitNodes.length > 0) handleReboot();
    else if (hitTargets.length > 0) scoreHits(hitTargets);
    else game.streak = 0;

    for (const t of hitTargets.concat(hitNodes)) {
      const i = targets.indexOf(t);
      if (i >= 0) targets.splice(i, 1);
    }
  }

  function fireTap() {
    if (game.state !== 'playing' || scanline.state !== 'sweep') return;
    scanline.state = 'frozen';
    scanline.timer = CONFIG.freezeDuration;
    scanline.flash = 0.12;
    playClick();
    resolvePulse();
  }

  function endRun() {
    game.state = 'gameover';
    stopHum();
    if (game.score > game.bestScore) {
      game.bestScore = game.score;
      localStorage.setItem('scanline_best', String(game.bestScore));
    }
    finalScoreEl.textContent = game.score;
    finalComboEl.textContent = game.bestCombo;
    finalDFEl.textContent = game.df;
    bestScoreLabel.textContent = game.bestScore;
    overOverlay.classList.remove('hidden');
  }

  function update(dt, now) {
    const elapsed = (now - game.runStart) / 1000;
    const stage = rampFor(elapsed);

    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      spawnTarget(elapsed);
      game.spawnTimer = stage.spawnMin + Math.random() * (stage.spawnMax - stage.spawnMin);
    }

    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      if (t.x < -60 || t.x > width + 60 || t.y < playTop - 60 || t.y > playTop + playHeight + 60) {
        targets.splice(i, 1);
      }
    }

    updateScanline(dt);

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const f = floatingTexts[i];
      f.life -= dt;
      f.y -= 40 * dt;
      if (f.life <= 0) floatingTexts.splice(i, 1);
    }

    if (scanline.flash > 0) scanline.flash -= dt;
    if (game.reboot > 0) game.reboot -= dt;
  }

  // --- Rendering ---
  function drawGrid() {
    const step = 44;
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < width; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
    for (let y = 0; y < height; y += step) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
    ctx.stroke();
  }

  function drawTrajectory(t) {
    const len = 0.35;
    const steps = 5;
    ctx.fillStyle = COLORS.trail;
    for (let i = 1; i <= steps; i++) {
      const f = i / steps;
      ctx.globalAlpha = (1 - f) * 0.35;
      ctx.beginPath();
      ctx.arc(t.x + t.vx * len * f, t.y + t.vy * len * f, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawTarget(t) {
    ctx.lineWidth = 1.5;
    if (t.kind === 'standard') {
      ctx.strokeStyle = COLORS.standard;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
      ctx.stroke();
    } else if (t.kind === 'bonus') {
      ctx.strokeStyle = COLORS.bonus;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(t.x - t.radius * 1.6, t.y);
      ctx.lineTo(t.x - t.radius * 0.8, t.y);
      ctx.moveTo(t.x + t.radius * 0.8, t.y);
      ctx.lineTo(t.x + t.radius * 1.6, t.y);
      ctx.stroke();
    } else {
      ctx.strokeStyle = COLORS.node;
      const r = t.radius * 1.3;
      const b = r * 0.5;
      ctx.beginPath();
      ctx.moveTo(t.x - r, t.y - r + b); ctx.lineTo(t.x - r, t.y - r); ctx.lineTo(t.x - r + b, t.y - r);
      ctx.moveTo(t.x + r - b, t.y - r); ctx.lineTo(t.x + r, t.y - r); ctx.lineTo(t.x + r, t.y - r + b);
      ctx.moveTo(t.x + r, t.y + r - b); ctx.lineTo(t.x + r, t.y + r); ctx.lineTo(t.x + r - b, t.y + r);
      ctx.moveTo(t.x - r + b, t.y + r); ctx.lineTo(t.x - r, t.y + r); ctx.lineTo(t.x - r, t.y + r - b);
      ctx.stroke();
    }
  }

  function drawScanline() {
    const halfWidth = playHeight * CONFIG.pulseHalfWidthRatio;
    if (scanline.state !== 'sweep') {
      ctx.fillStyle = COLORS.pulseBand;
      ctx.fillRect(0, scanline.y - halfWidth, width, halfWidth * 2);
    }
    ctx.strokeStyle = scanline.flash > 0 ? COLORS.scanlineFlash : COLORS.scanlineIdle;
    ctx.lineWidth = scanline.flash > 0 ? 2 : 1.4;
    ctx.beginPath();
    ctx.moveTo(0, scanline.y);
    ctx.lineTo(width, scanline.y);
    ctx.stroke();
  }

  function drawFloatingTexts() {
    ctx.textAlign = 'center';
    ctx.font = '600 15px "JetBrains Mono", ui-monospace, Menlo, monospace';
    for (const f of floatingTexts) {
      ctx.globalAlpha = Math.max(f.life / 0.7, 0);
      ctx.fillStyle = COLORS.text;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    ctx.textAlign = 'left';
    ctx.fillStyle = COLORS.dim;
    ctx.font = '500 11px "JetBrains Mono", ui-monospace, Menlo, monospace';
    ctx.fillText('SCORE', 16, 24);
    ctx.fillText('DF', 16, 58);
    ctx.fillStyle = COLORS.text;
    ctx.font = '600 18px "JetBrains Mono", ui-monospace, Menlo, monospace';
    ctx.fillText(String(game.score).padStart(5, '0'), 68, 26);
    ctx.font = '500 14px "JetBrains Mono", ui-monospace, Menlo, monospace';
    ctx.fillText(String(game.df), 44, 58);

    ctx.textAlign = 'right';
    ctx.fillStyle = COLORS.dim;
    ctx.font = '500 11px "JetBrains Mono", ui-monospace, Menlo, monospace';
    ctx.fillText('LIVES', width - 16, 24);
    ctx.fillText('STREAK', width - 16, 58);
    ctx.fillStyle = COLORS.text;
    ctx.font = '600 15px "JetBrains Mono", ui-monospace, Menlo, monospace';
    ctx.fillText('◆'.repeat(game.lives) + '◇'.repeat(Math.max(CONFIG.startingLives - game.lives, 0)), width - 16, 42);
    ctx.font = '500 14px "JetBrains Mono", ui-monospace, Menlo, monospace';
    ctx.fillText(String(game.streak), width - 16, 74);
  }

  function render() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, width, height);
    drawGrid();

    if (game.state === 'playing' || game.state === 'gameover') {
      for (const t of targets) drawTrajectory(t);
      for (const t of targets) drawTarget(t);
      drawScanline();
      drawFloatingTexts();
      drawHud();
    }

    if (game.reboot > 0) {
      ctx.fillStyle = `rgba(229,72,77,${(game.reboot / 0.12) * 0.18})`;
      ctx.fillRect(0, 0, width, height);
    }
  }

  let lastTime = performance.now();
  function frame(now) {
    let dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    if (game.state === 'playing') update(dt, now);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // --- Input ---
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    if (game.state === 'playing') fireTap();
  });

  startBtn.addEventListener('click', () => {
    ensureAudio();
    bootOverlay.classList.add('hidden');
    resetRun();
    startHum();
  });

  restartBtn.addEventListener('click', () => {
    ensureAudio();
    overOverlay.classList.add('hidden');
    resetRun();
    startHum();
  });

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? 'SND: OFF' : 'SND: ON';
    if (muted) stopHum();
    else if (game.state === 'playing') startHum();
  });

  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
})();
</script>
</body>
</html>
