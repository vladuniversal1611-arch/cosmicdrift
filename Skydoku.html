<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Mobile-first viewport: lock scaling, respect device notches via
    viewport-fit=cover so the canvas can extend under the safe-area insets.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#5db4ff" />
  <meta name="description" content="Skydoku — a bright, satisfying block puzzle in the sky." />
  <title>Skydoku</title>
  <style>
    /*
      Global reset + full-bleed layout. The game renders entirely to a single
      <canvas>; the Canvas core class letterboxes the fixed design resolution
      to fit any screen. The page background is a soft SKY gradient (matching
      the in-game sky) so on wider/shorter screens — tablets, older phones —
      the letterbox margins read as sky instead of dead black bars.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #5db4ff 0%, #9ad7ff 55%, #dff2ff 100%);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;          /* disable native pan/zoom gestures */
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: block;
      background: linear-gradient(180deg, #5db4ff 0%, #9ad7ff 55%, #dff2ff 100%);
    }
    /* The Canvas class positions this: fixed + centred on the viewport, rotated
       90° in landscape so the game is always presented in portrait. */
    #game { display: block; }
  </style>
</head>
<body>
  <!-- The Canvas core class sizes and positions this element every resize. -->
  <div id="stage">
    <canvas id="game"></canvas>
  </div>

  <!-- Immersive portrait: on the first tap, go fullscreen (hides the phone's
       top status bar / clock shutter) and lock to portrait where the platform
       allows it. Both are wrapped so an unsupported browser silently no-ops;
       the Canvas class also rotates to portrait as a guaranteed fallback. -->
  <script>
    (function () {
      function goImmersive() {
        try {
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
          if (req) { var p = req.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); }
        } catch (e) {}
        try {
          if (screen.orientation && screen.orientation.lock) {
            var q = screen.orientation.lock('portrait'); if (q && q.catch) q.catch(function () {});
          }
        } catch (e) {}
      }
      window.addEventListener('pointerdown', goImmersive, { once: true });
    })();
  </script>
