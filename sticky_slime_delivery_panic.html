<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sticky Slime: Delivery Panic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0b1030;
    font-family:'Comic Sans MS','Marker Felt','Segoe UI',cursive,sans-serif;
    touch-action:none;
  }
  #gameContainer{ position:relative; width:100vw; height:100vh; overflow:hidden; }
  #gameCanvas{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #gameCanvas:active{ cursor:grabbing; }

  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: max(10px, env(safe-area-inset-top)) 14px 0 14px;
    pointer-events:none; z-index:5;
  }
  .hudLeft{ display:flex; flex-direction:column; gap:6px; }
  .hudPill{
    background:linear-gradient(135deg,#ffffff,#e9f0ff);
    border:3px solid #2b2160;
    border-radius:20px;
    padding:7px 14px;
    font-weight:700;
    font-size:clamp(13px,3.6vw,18px);
    color:#2b2160;
    box-shadow:0 4px 0 rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.25);
    display:flex; align-items:center; gap:6px;
  }
  #bestBox{ background:linear-gradient(135deg,#fff6d8,#ffe9a8); }
  #coinBox{ background:linear-gradient(135deg,#fff6d8,#ffe9a8); }

  .hudRight{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; pointer-events:auto; }
  .iconRow{ display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:138px; }
  .iconBtn{
    width:36px; height:36px; border-radius:50%;
    border:3px solid #2b2160; background:linear-gradient(135deg,#ffffff,#e9f0ff);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,0.25);
    font-family:inherit;
  }
  .iconBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.25); }

  #dailyBadge{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    display:none; align-items:center; gap:8px;
    background:rgba(20,15,50,0.68); color:#ffd23f; font-size:12px; font-weight:800;
    padding:6px 12px; border-radius:14px; z-index:6; pointer-events:auto;
    white-space:nowrap;
  }
  #dailyBadge button{
    background:none; border:none; color:#fff; font-size:13px; font-weight:800; cursor:pointer; padding:0 2px;
  }

  #buffRow{
    position:absolute; top:100px; left:14px; display:flex; flex-wrap:wrap; gap:6px; z-index:5; pointer-events:none;
    max-width:60vw;
  }
  .buffPill{
    display:none; align-items:center; gap:4px;
    background:rgba(20,15,50,0.62); color:#fff; font-size:12px; font-weight:700;
    padding:5px 10px; border-radius:12px; white-space:nowrap;
  }

  #hint{
    position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
    background:rgba(20,15,50,0.55);
    color:#fff; padding:10px 18px; border-radius:16px;
    font-size:clamp(11px,3.2vw,15px); font-weight:700; text-align:center;
    pointer-events:none; z-index:5;
    transition:opacity 0.5s ease, transform 0.5s ease;
    white-space:nowrap;
    animation:hintBob 1.6s ease-in-out infinite;
    text-shadow:0 2px 4px rgba(0,0,0,0.4);
  }
  #hint.hidden{ opacity:0; transform:translateX(-50%) translateY(10px); }
  @keyframes hintBob{
    0%,100%{ transform:translateX(-50%) translateY(0px); }
    50%{ transform:translateX(-50%) translateY(-8px); }
  }

  .overlayScreen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,8,30,0.72);
    backdrop-filter:blur(3px);
    z-index:20;
    opacity:1; transition:opacity 0.35s ease;
  }
  .overlayScreen.hidden{ opacity:0; pointer-events:none; }
  .panel{
    background:linear-gradient(160deg,#ffffff,#eef1ff);
    border:5px solid #2b2160;
    border-radius:26px;
    padding:26px 30px 30px;
    text-align:center;
    width:min(420px, 86vw);
    max-height:82vh;
    overflow-y:auto;
    box-shadow:0 12px 0 rgba(0,0,0,0.3), 0 20px 40px rgba(0,0,0,0.5);
    animation:popIn 0.35s cubic-bezier(.3,1.6,.4,1);
  }
  @keyframes popIn{
    0%{ transform:scale(0.4) rotate(-8deg); opacity:0; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .panel h1{
    font-size:clamp(22px,6.5vw,30px);
    color:#e0324c;
    -webkit-text-stroke:1px #6b0a17;
    text-shadow:0 3px 0 #6b0a17;
    margin-bottom:6px;
  }
  .panel h1.plain{ color:#2b2160; -webkit-text-stroke:0; text-shadow:none; }
  .panel p{ color:#2b2160; font-size:clamp(13px,3.8vw,16px); font-weight:700; margin:4px 0; }
  .panel .reason{ color:#7a4a00; font-size:clamp(12px,3.4vw,14px); margin-bottom:8px; font-weight:600; }
  .bigScore{ font-size:clamp(28px,8.4vw,40px); color:#159c3f; text-shadow:0 3px 0 #0a5c22; margin:6px 0 10px; }
  #restartBtn, #continueBtn{
    margin-top:8px;
    font-family:inherit;
    font-size:clamp(15px,4.2vw,19px);
    font-weight:800;
    color:#fff;
    background:linear-gradient(160deg,#5ee06a,#159c3f);
    border:4px solid #0a5c22;
    border-radius:18px;
    padding:12px 26px;
    cursor:pointer;
    box-shadow:0 6px 0 #0a5c22;
    transition:transform 0.08s ease, box-shadow 0.08s ease;
    width:100%;
    display:block;
  }
  #continueBtn{
    background:linear-gradient(160deg,#ffcf3f,#e0a30a);
    border-color:#9c6f00;
    box-shadow:0 6px 0 #9c6f00;
    margin-bottom:8px;
  }
  #restartBtn:active, #continueBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #0a5c22; }
  #copyResultBtn{
    margin-top:8px;
    font-family:inherit; font-size:13px; font-weight:700; color:#2b2160;
    background:#fff; border:2px solid #2b2160; border-radius:12px;
    padding:8px 14px; cursor:pointer; width:100%;
  }

  #newBestBadge{
    display:inline-block; background:#ffcf3f; color:#7a4a00;
    padding:4px 12px; border-radius:12px; font-size:13px;
    margin-bottom:8px; border:2px solid #7a4a00; font-weight:800;
    animation:pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  .hidden-badge{ display:none !important; }

  #shopCoinsLine{ margin-bottom:10px; font-size:16px; }
  .shopRow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#f2f4ff; border:2px solid #d5daf5; border-radius:14px;
    padding:8px 12px; margin-bottom:8px; text-align:left;
  }
  .shopRow .shopName{ font-weight:800; color:#2b2160; font-size:14px; }
  .shopRow .shopCost{ font-size:12px; color:#7a4a00; font-weight:700; }
  .shopBtn{
    font-family:inherit; font-weight:800; font-size:12px; color:#fff;
    background:linear-gradient(160deg,#5ee06a,#159c3f); border:2px solid #0a5c22;
    border-radius:10px; padding:7px 12px; cursor:pointer; white-space:nowrap;
  }
  .shopBtn:disabled{ background:#c8c8c8; border-color:#9a9a9a; color:#666; cursor:default; }
  .secondaryBtn{
    margin-top:6px; font-family:inherit; font-weight:800; font-size:14px; color:#2b2160;
    background:#fff; border:3px solid #2b2160; border-radius:14px; padding:10px 20px; cursor:pointer; width:100%;
  }
  .charRow{ text-align:left; }
  .charRow .charDesc{ font-size:12px; color:#555; font-weight:600; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hudLeft">
      <div class="hudPill" id="scoreBox">🏔️ <span id="scoreValue">0</span> м</div>
      <div class="hudPill" id="coinBox">🪙 <span id="coinValue">0</span></div>
    </div>
    <div class="hudRight">
      <div class="hudPill" id="bestBox">🏆 <span id="bestValue">0</span> м</div>
      <div class="iconRow">
        <button id="muteBtn" class="iconBtn" type="button" title="Звук">🔊</button>
        <button id="skinBtn" class="iconBtn" type="button" title="Скін">🎨</button>
        <button id="charBtn" class="iconBtn" type="button" title="Персонаж">🧬</button>
        <button id="shopBtn" class="iconBtn" type="button" title="Крамниця">🛍</button>
        <button id="dailyBtn" class="iconBtn" type="button" title="Виклик дня">📅</button>
      </div>
    </div>
  </div>

  <div id="dailyBadge">🗓 <span id="dailyBadgeText">Виклик дня</span> <button id="dailyExitBtn" title="Вийти з виклику дня">✖</button></div>

  <div id="buffRow">
    <div class="buffPill" id="buffGlue">🧲 <span id="glueTime"></span></div>
    <div class="buffPill" id="buffShield">🛡️ Щит</div>
    <div class="buffPill" id="buffBoost">🚀 Буст готовий</div>
  </div>

  <div id="hint">👆 Тягни і відпускай — лови 🧲🚀🛡️🪙 по дорозі! 👆</div>

  <div id="gameOverScreen" class="overlayScreen hidden">
    <div class="panel">
      <div id="newBestBadge" class="hidden-badge">🎉 НОВИЙ РЕКОРД!</div>
      <h1>😵 ГРУ ЗАВЕРШЕНО</h1>
      <p class="reason" id="gameOverReason">Слайм не впорався з доставкою...</p>
      <div class="bigScore">🏔️ <span id="finalScore">0</span> м</div>
      <p>Рекорд: 🏆 <span id="finalBest">0</span> м</p>
      <p id="dailyResultLine" class="hidden-badge">🗓 Рекорд дня: <span id="dailyBestValue">0</span> м</p>
      <button id="continueBtn" class="hidden-badge" type="button">▶ Продовжити</button>
      <button id="restartBtn" type="button">🔄 Грати знову</button>
      <button id="copyResultBtn" class="hidden-badge" type="button">📋 Скопіювати результат</button>
    </div>
  </div>

  <div id="shopScreen" class="overlayScreen hidden">
    <div class="panel">
      <h1 class="plain">🛍 Крамниця слідів</h1>
      <p id="shopCoinsLine">🪙 <span id="shopCoins">0</span></p>
      <div id="shopList"></div>
      <button id="shopCloseBtn" class="secondaryBtn" type="button">Закрити</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreValueEl = document.getElementById('scoreValue');
const bestValueEl = document.getElementById('bestValue');
const coinValueEl = document.getElementById('coinValue');
const hintEl = document.getElementById('hint');
const gameOverScreen = document.getElementById('gameOverScreen');
const gameOverReasonEl = document.getElementById('gameOverReason');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const newBestBadge = document.getElementById('newBestBadge');
const restartBtn = document.getElementById('restartBtn');
const continueBtn = document.getElementById('continueBtn');
const copyResultBtn = document.getElementById('copyResultBtn');
const dailyResultLine = document.getElementById('dailyResultLine');
const dailyBestValueEl = document.getElementById('dailyBestValue');
const muteBtn = document.getElementById('muteBtn');
const skinBtn = document.getElementById('skinBtn');
const charBtn = document.getElementById('charBtn');
const shopBtn = document.getElementById('shopBtn');
const dailyBtn = document.getElementById('dailyBtn');
const dailyBadge = document.getElementById('dailyBadge');
const dailyBadgeText = document.getElementById('dailyBadgeText');
const dailyExitBtn = document.getElementById('dailyExitBtn');
const buffGlueEl = document.getElementById('buffGlue');
const glueTimeEl = document.getElementById('glueTime');
const buffShieldEl = document.getElementById('buffShield');
const buffBoostEl = document.getElementById('buffBoost');
const shopScreen = document.getElementById('shopScreen');
const shopCoinsEl = document.getElementById('shopCoins');
const shopListEl = document.getElementById('shopList');
const shopCloseBtn = document.getElementById('shopCloseBtn');

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

const GRAVITY = 2100;
const MAX_DRAG = 150;
const LAUNCH_SPEED = 1600;
const MAX_LAUNCH_SPEED = LAUNCH_SPEED*1.2;
const SLIME_R = 27;
const PLAT_H = 24;
const BOX_SIZE = 30;
const TILT_LIMIT = 0.95;
const SQUASH_STIFF = 140;
const SQUASH_DAMP = 9;
const GLUE_DURATION = 6;
const CHECKPOINT_COST = 25;
const CHECKPOINT_INTERVAL = 400;

const COIN_KEY = 'stickySlimeCoins';
const OWNED_TRAILS_KEY = 'stickySlimeOwnedTrails';
const EQUIPPED_TRAIL_KEY = 'stickySlimeTrail';
const CHARACTER_KEY = 'stickySlimeCharacter';
const GHOST_KEY = 'stickySlimeGhost';
const DAILY_PREFIX = 'stickySlimeDaily_';

let best = parseInt(localStorage.getItem('stickySlimeBest') || '0', 10) || 0;
bestValueEl.textContent = best;
let coins = parseInt(localStorage.getItem(COIN_KEY) || '0', 10) || 0;
coinValueEl.textContent = coins;
let ownedTrails = ['none'];
try{ ownedTrails = JSON.parse(localStorage.getItem(OWNED_TRAILS_KEY) || '["none"]'); }catch(e){ ownedTrails = ['none']; }
let equippedTrail = localStorage.getItem(EQUIPPED_TRAIL_KEY) || 'none';

const SKINS = [
  { name:'Класичний', min:0,    top:'#c8ff7a', mid:'#7ee62a', bot:'#4ec20f', stroke:'#3a9e0a' },
  { name:'Океан',      min:150,  top:'#8fe8ff', mid:'#33b8e8', bot:'#1a7fbf', stroke:'#0f5a8a' },
  { name:'Аметист',    min:400,  top:'#e0aaff', mid:'#b366e0', bot:'#7c2fb0', stroke:'#571f80' },
  { name:'Золото',     min:800,  top:'#fff2a8', mid:'#ffcf3f', bot:'#e0a30a', stroke:'#9c6f00' },
  { name:'Вогонь',     min:1400, top:'#ffcf9e', mid:'#ff7a3d', bot:'#e0432a', stroke:'#9c1f10' }
];
let skinIndex = parseInt(localStorage.getItem('stickySlimeSkinIndex') || '0', 10) || 0;
function progressScore(){ return Math.max(best, game ? game.score : 0); }
function unlockedSkins(){ return SKINS.filter(s => progressScore() >= s.min); }
function currentSkin(){
  const u = unlockedSkins();
  if(skinIndex >= u.length) skinIndex = 0;
  return u[skinIndex] || SKINS[0];
}
function cycleSkin(){
  const u = unlockedSkins();
  if(u.length <= 1) return false;
  skinIndex = (skinIndex+1) % u.length;
  localStorage.setItem('stickySlimeSkinIndex', String(skinIndex));
  return true;
}

const CHARACTERS = [
  { id:'sticky', name:'Липкий',  min:0,   launchMul:1,    tiltMul:1,    comboMul:1,   centerTolMul:1,   desc:'Класичний баланс' },
  { id:'agile',  name:'Спритний',min:200, launchMul:0.92, tiltMul:1,    comboMul:1.5, centerTolMul:1.3, desc:'+50% за влучні приземлення, ширша ціль, слабший кидок' },
  { id:'tank',   name:'Танк',    min:500, launchMul:1,    tiltMul:1.45, comboMul:0,   centerTolMul:1,   desc:'Коробки набагато стійкіші, але без комбо-очок' },
  { id:'heavy',  name:'Важкий',  min:900, launchMul:1.18, tiltMul:0.8,  comboMul:1,   centerTolMul:1,   desc:'+18% сили кидка, зате крихкіші коробки' }
];
let characterIndex = parseInt(localStorage.getItem(CHARACTER_KEY) || '0', 10) || 0;
function unlockedCharacters(){ return CHARACTERS.filter(c => progressScore() >= c.min); }
function currentCharacter(){
  const u = unlockedCharacters();
  if(characterIndex >= u.length) characterIndex = 0;
  return u[characterIndex] || CHARACTERS[0];
}
function cycleCharacter(){
  const u = unlockedCharacters();
  if(u.length <= 1) return false;
  characterIndex = (characterIndex+1) % u.length;
  localStorage.setItem(CHARACTER_KEY, String(characterIndex));
  return true;
}

const TRAILS = [
  { id:'none',    name:'Без ефекту', cost:0,   color:null },
  { id:'sparkle', name:'Іскри',      cost:40,  color:'#ffe066' },
  { id:'bubbles', name:'Бульбашки',  cost:70,  color:'#8fe8ff' },
  { id:'flame',   name:"Полум'я",    cost:120, color:'#ff7a3d' },
  { id:'rainbow', name:'Веселка',    cost:200, color:null }
];

const ZONES = [
  { min:0,    name:'Хмарочос',            icon:'☁️' },
  { min:400,  name:'Гроза',               icon:'⛈️' },
  { min:900,  name:'Космос',              icon:'🌌' },
  { min:1500, name:'Кристальна безодня',  icon:'💎' }
];
function zoneForScore(score){
  let z = ZONES[0];
  for(const zz of ZONES) if(score >= zz.min) z = zz;
  return z;
}
const DECOR_ICONS = {
  'Хмарочос': ['☁️'],
  'Гроза': ['⛈️','☁️'],
  'Космос': ['🪐','⭐','🌑','💫'],
  'Кристальна безодня': ['✨','💎','🔮']
};

function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashString(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h)+str.charCodeAt(i))|0; }
  return h >>> 0;
}
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
let rng = Math.random;

let muted = localStorage.getItem('stickySlimeMuted') === '1';
muteBtn.textContent = muted ? '🔇' : '🔊';
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  } else if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}
function tone(freq, dur, type, vol, sweepTo){
  if(muted || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(Math.max(1,freq), t0);
  if(sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1,sweepTo), t0+dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.001,vol||0.2), t0+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function noiseBurst(dur, vol){
  if(muted || !audioCtx) return;
  const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate*dur));
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*(1-i/bufferSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.value = vol||0.2;
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}
function sfxLaunch(power){ tone(300+power*200, 0.18, 'sine', 0.15, 700+power*400); }
function sfxLand(strength){ const s=clamp(strength,0.3,1); tone(120,0.12,'sine',0.18*s,60); noiseBurst(0.05,0.06*s); }
function sfxSpike(){ noiseBurst(0.25,0.28); tone(90,0.3,'sawtooth',0.15,40); }
function sfxBoxDetach(){ tone(500,0.15,'triangle',0.12,250); }
function sfxBoxGone(){ tone(400,0.35,'sine',0.15,90); }
function sfxGameOver(){ tone(300,0.5,'sine',0.18,60); }
function sfxRecord(){ [0,1,2].forEach(i=>setTimeout(()=>tone(500+i*160,0.18,'square',0.12), i*90)); }
function sfxPickup(){ tone(650,0.14,'square',0.13,1000); }
function sfxMilestone(){ tone(700,0.2,'sine',0.15,1100); }
function sfxCoin(){ tone(900,0.09,'square',0.1,1400); }
function sfxJackpot(){ [0,1,2,3].forEach(i=>setTimeout(()=>tone(600+i*140,0.14,'square',0.12), i*70)); }
function vibrate(pattern){ if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} } }

let game = null;

function makeBox(index){
  return { index, angle:0, angVel:0, warning:false, wasWarning:false, detached:false, goneOffscreen:false, fx:0, fy:0, fvx:0, fvy:0, frot:0, frotVel:0 };
}

function newGame(daily){
  resize();
  const isDaily = !!daily;
  rng = isDaily ? mulberry32(hashString(todayKey())) : Math.random;

    meteors: [],

    replayLog: [],
    replaySampleTimer: 0,
    ghost: null,
    slime: {
      x: W/2, y: 0, vx: 0, vy: 0,
      prevX: W/2, prevY: 0, lastInstVX: 0,

    },
    boxes: [makeBox(0), makeBox(1), makeBox(2)],
    platforms: [],
    clouds: [],

    cameraY: 0,
    drag: { active:false, x:0, y:0, dx:0, dy:0, power:0 },

    lastPlatSide: 'left',

    shield: false,
    boostReady: false,
    windPhase: Math.random()*Math.PI*2,
    windStrengthNow: 0,
    currentWindAccel: 0,
    shakeT: 0
  };

  if(!isDaily){
    try{
      const g = JSON.parse(localStorage.getItem(GHOST_KEY) || 'null');
      if(g && g.length > 1) game.ghost = { log: g, idx: 0 };
    }catch(e){ game.ghost = null; }
  }

  const startW = 150;
  const startPlat = { x: W/2 - startW/2, y: 60, w: startW, h: PLAT_H, moving:false, spike:false, crumble:false, golden:false, risky:false, checkpoint:false, crumbleTimer:null, vx:0, baseX: W/2-startW/2, range:0, phase:0, speed:0 };
  game.platforms.push(startPlat);
  game.highestPlatformY = startPlat.y;
  game.highestPlatformCenterX = startPlat.x + startPlat.w/2;
  game.slime.x = W/2;
  game.slime.y = startPlat.y - SLIME_R;
  game.slime.prevX = game.slime.x;
  game.slime.prevY = game.slime.y;
  game.slime.stuckPlatform = startPlat;
  game.minWorldY = game.slime.y;
  game.cameraY = game.slime.y - H*0.62;

  generateAhead();
  gameOverScreen.classList.add('hidden');
  hintEl.classList.remove('hidden');
  scoreValueEl.textContent = '0';
  updateBuffUI();
  updateDailyBadge();
}

function diffForHeight(h){
  return Math.pow(clamp(h/9000, 0, 1), 1.35);
}

function maxHeightAtDistance(dx, speed){
  dx = Math.abs(dx);
  let maxH = 0;
  for(let a=8; a<=82; a+=4){
    const rad = a*Math.PI/180;
    const vx = speed*Math.cos(rad), vy = speed*Math.sin(rad);
    if(vx < 1) continue;
    const t = dx/vx;
    const h = vy*t - 0.5*GRAVITY*t*t;
    if(h > maxH) maxH = h;
  }
  return maxH;
}

function reachableX(prevCenterX, x, width){
  const MAX_DX = 260;
  let nearestX = clamp(prevCenterX, x, x+width);
  let dx = nearestX - prevCenterX;
  if(Math.abs(dx) > MAX_DX){
    const shift = Math.abs(dx) - MAX_DX;
    x += dx > 0 ? -shift : shift;
    x = clamp(x, 0, W-width);
    nearestX = clamp(prevCenterX, x, x+width);
    dx = nearestX - prevCenterX;
  }
  return { x, dx };
}

function spawnRiskyPlatform(safePlat, prevCenterX){
  const riskyWidth = Math.max(38, safePlat.w*0.5);
  let rx = safePlat.x < W/2 ? W-riskyWidth-8 : 8;
  const fixed = reachableX(prevCenterX, rx, riskyWidth);
  rx = fixed.x;
  const risky = {
    x:rx, y:safePlat.y, w:riskyWidth, h:PLAT_H, moving:false, spike:false, crumble:false,
    golden:false, risky:true, checkpoint:false, vx:0, baseX:rx, range:0, phase:0, speed:0, crumbleTimer:null
  };
  game.platforms.push(risky);
  const cx = rx+riskyWidth/2;
  game.pickups.push({ x:cx-14, y:safePlat.y-32, type:'coin', value:3, taken:false, bob:rng()*Math.PI*2 });
  game.pickups.push({ x:cx+14, y:safePlat.y-46, type:'coin', value:3, taken:false, bob:rng()*Math.PI*2 });
  const buffTypes = ['glue','boost','shield'];
  game.pickups.push({ x:cx, y:safePlat.y-60, type:buffTypes[Math.floor(rng()*buffTypes.length)], value:0, taken:false, bob:rng()*Math.PI*2 });
}

function generateAhead(){
  const targetY = game.cameraY - H*1.6;
  while(game.highestPlatformY > targetY){
    const prevY = game.highestPlatformY;
    const prevCenterX = game.highestPlatformCenterX;
    const heightScore = Math.max(0, -prevY);
    const diff = diffForHeight(heightScore);
    const wishGap = 95 + rng()*65 + diff*95;
    const width = Math.max(64, 155 - diff*80 - rng()*25);

    let side = rng() < 0.68 ? (game.lastPlatSide==='left' ? 'right':'left') : game.lastPlatSide;
    game.lastPlatSide = side;
    let x = side==='left' ? 0 : (W - width);
    if(rng() < 0.18 + diff*0.1 && (W - width - 50) > 40){
      x = 25 + rng()*(W - width - 50);
    }

    const fixed = reachableX(prevCenterX, x, width);
    x = fixed.x;
    const dx = fixed.dx;

    const allowedGap = maxHeightAtDistance(dx, MAX_LAUNCH_SPEED*0.82);
    const gap = clamp(wishGap, 70, Math.max(70, allowedGap*0.85));
    const y = prevY - gap;

    const isCheckpoint = heightScore >= game.nextCheckpointAt;
    if(isCheckpoint) game.nextCheckpointAt += CHECKPOINT_INTERVAL;

    let moving = !isCheckpoint && rng() < 0.1 + diff*0.28;
    let spikeChance = 0.08 + diff*0.16;
    if(moving) spikeChance *= (diff > 0.4 ? 0.55 : 0.12);
    let spike = !isCheckpoint && rng() < spikeChance;
    let crumble = !isCheckpoint && !spike && !moving && rng() < 0.06 + diff*0.14;
    let golden = !isCheckpoint && !spike && !moving && !crumble && rng() < 0.035;

    let finalWidth = isCheckpoint ? Math.max(width, 130) : width;
    let finalX = x;
    if(isCheckpoint){
      const fixed2 = reachableX(prevCenterX, x, finalWidth);
      finalX = clamp(fixed2.x, 0, W-finalWidth);
    }

    let range = 0;
    if(moving){
      const maxRange = Math.max(0, W - finalWidth - finalX);
      range = Math.min(maxRange, 55 + rng()*110);
    }

    const plat = {
      x: finalX, y, w:finalWidth, h:PLAT_H, moving, spike, crumble, golden,
      risky:false, checkpoint: isCheckpoint,
      vx:0, baseX:finalX, range, phase: rng()*Math.PI*2, speed: 0.7+rng()*0.7,
      crumbleTimer: null
    };
    game.platforms.push(plat);
    game.highestPlatformY = y;
    game.highestPlatformCenterX = finalX + finalWidth/2 + (moving ? range/2 : 0);

    if(!isCheckpoint && !spike && !moving && !crumble && !golden && rng() < 0.1 + diff*0.08){
      spawnRiskyPlatform(plat, prevCenterX);
    } else if(!spike && rng() < 0.22){
      const roll = rng();
      let type, value = 0;
      if(roll < 0.55){ type='coin'; value = 1+Math.floor(rng()*3); }
      else if(roll < 0.7) type='glue';
      else if(roll < 0.85) type='boost';
      else type='shield';
      game.pickups.push({ x: finalX+finalWidth/2, y: y-34, type, value, taken:false, bob: rng()*Math.PI*2 });
    }

    if(Math.random() < 0.45){
      const z = zoneForScore(heightScore);
      const icons = DECOR_ICONS[z.name] || ['☁️'];
      const icon = icons[Math.floor(Math.random()*icons.length)];
      game.clouds.push({ x: Math.random()*W, y: y - 20 - Math.random()*140, size: 26+Math.random()*38, spd: 0.15+Math.random()*0.2, icon });
    }
  }
}

function cleanupWorld(){
  const bottomBound = game.cameraY + H + 500;
  game.platforms = game.platforms.filter(p => p.y < bottomBound || p === game.slime.stuckPlatform);
  game.clouds = game.clouds.filter(c => c.y < bottomBound);
  game.particles = game.particles.filter(p => p.life > 0);
  game.pickups = game.pickups.filter(pu => !pu.taken && pu.y < bottomBound);
}

function getPointerPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function updateAimFromDrag(){
  const s = game.slime;
  const slimeScreenX = s.x;
  const slimeScreenY = s.y - game.cameraY;
  let dx = game.drag.x - slimeScreenX;
  let dy = game.drag.y - slimeScreenY;
  const len = Math.hypot(dx,dy) || 1;
  const clampedLen = Math.min(len, MAX_DRAG);
  dx = dx/len*clampedLen;
  dy = dy/len*clampedLen;
  game.drag.dx = dx;
  game.drag.dy = dy;
  game.drag.power = clampedLen / MAX_DRAG;
  const l2 = Math.hypot(dx,dy) || 1;
  game.eyeDir.x = -dx/l2;
  game.eyeDir.y = -dy/l2;
}

function onPointerDown(e){
  if(!game || game.state !== 'stuck') return;
  ensureAudio();
  const p = getPointerPos(e);
  game.drag.active = true;
  game.drag.x = p.x;
  game.drag.y = p.y;
  game.state = 'aiming';
  updateAimFromDrag();
  hintEl.classList.add('hidden');
  e.preventDefault();
}
function onPointerMove(e){
  if(!game || !game.drag.active) return;
  const p = getPointerPos(e);
  game.drag.x = p.x;
  game.drag.y = p.y;
  updateAimFromDrag();
  e.preventDefault();
}
function onPointerUp(e){
  if(!game || !game.drag.active) return;
  game.drag.active = false;
  launchFromDrag();
  e.preventDefault();
}

function launchFromDrag(){
  if(game.state !== 'aiming') return;
  const power = game.drag.power || 0;
  if(power < 0.1){
    game.state = 'stuck';
    return;
  }
  const dx = game.drag.dx, dy = game.drag.dy;
  const len = Math.hypot(dx,dy) || 1;
  let speed = power*power_curve(power)*LAUNCH_SPEED*game.character.launchMul;
  const s = game.slime;
  if(game.boostReady){
    speed *= 1.4;
    game.boostReady = false;
    spawnParticles(s.x, s.y, '#ff8a3d', 14);
    spawnFloatingText(s.x, s.y-50, '🚀 БУСТ!', '#ff8a3d');
  }
  s.vx = -dx/len*speed;
  s.vy = -dy/len*speed;
  game.ignorePlatform = s.stuckPlatform;
  game.ignoreTimer = 0.22;
  s.stuckPlatform = null;
  game.state = 'flying';
  sfxLaunch(power);
}
function power_curve(p){ return 0.55 + p*0.65; }

function buildShopUI(){
  shopCoinsEl.textContent = coins;
  shopListEl.innerHTML = '';
  for(const t of TRAILS){
    const owned = ownedTrails.indexOf(t.id) !== -1;
    const equipped = equippedTrail === t.id;
    const row = document.createElement('div');
    row.className = 'shopRow';
    const info = document.createElement('div');
    info.innerHTML = `<div class="shopName">${t.name}</div><div class="shopCost">${owned ? 'Куплено' : '🪙 '+t.cost}</div>`;
    const btn = document.createElement('button');
    btn.className = 'shopBtn';
    btn.type = 'button';
    btn.textContent = equipped ? 'Одягнено' : (owned ? 'Одягнути' : 'Купити');
    btn.disabled = equipped;
    btn.addEventListener('click', ()=>{
      if(owned){
        equippedTrail = t.id;
        localStorage.setItem(EQUIPPED_TRAIL_KEY, t.id);
      } else if(coins >= t.cost){
        coins -= t.cost;
        ownedTrails.push(t.id);
        localStorage.setItem(COIN_KEY, String(coins));
        localStorage.setItem(OWNED_TRAILS_KEY, JSON.stringify(ownedTrails));
        equippedTrail = t.id;
        localStorage.setItem(EQUIPPED_TRAIL_KEY, t.id);
        coinValueEl.textContent = coins;
      }
      buildShopUI();
    });
    row.appendChild(info);
    row.appendChild(btn);
    shopListEl.appendChild(row);
  }
}

function spawnParticles(x, y, color, count){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 40 + Math.random()*140;
    game.particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40,
      life: 0.4+Math.random()*0.35, maxLife: 0.4+Math.random()*0.35,
      size: 3+Math.random()*4, color
    });
  }
}

function spawnTrailParticle(){
  if(equippedTrail === 'none' || !game || game.state !== 'flying') return;
  if(Math.random() > 0.6) return;
  const s = game.slime;
  const trail = TRAILS.find(t => t.id === equippedTrail);
  let color = trail ? trail.color : null;
  if(equippedTrail === 'rainbow') color = `hsl(${Math.floor((game.time*220)%360)},85%,60%)`;
  const speed = Math.hypot(s.vx, s.vy) || 1;
  const bx = s.x - (s.vx/speed)*SLIME_R*0.7;
  const by = s.y - (s.vy/speed)*SLIME_R*0.7;
  game.particles.push({
    x: bx+(Math.random()-0.5)*8, y: by+(Math.random()-0.5)*8,
    vx:(Math.random()-0.5)*40, vy:(Math.random()-0.5)*40 - 15,
    life: 0.3+Math.random()*0.25, maxLife: 0.55, size: 2.5+Math.random()*2.5, color: color || '#ffffff'
  });
}

function updateParticles(dt){
  for(const p of game.particles){
    p.vy += 900*dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.life -= dt;
  }
  game.particles = game.particles.filter(p => p.life > 0);
}

function spawnFloatingText(x, y, text, color){
  game.floatingTexts.push({ x, y, text, color: color||'#ffffff', life:1.15, maxLife:1.15 });
}
function updateFloatingTexts(dt){
  for(const f of game.floatingTexts){
    f.y -= 42*dt;
    f.life -= dt;
  }
  game.floatingTexts = game.floatingTexts.filter(f => f.life > 0);
}
function drawFloatingTexts(){
  for(const f of game.floatingTexts){
    const a = clamp(f.life/f.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillText(f.text, f.x+1, f.y - game.cameraY+1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y - game.cameraY);
    ctx.restore();
  }
}

    game.currentZone = z;
    if(!isFirst){
      spawnFloatingText(game.slime.x, game.slime.y-90, `${z.icon} Зона: ${z.name}`, '#ffffff');
      spawnParticles(game.slime.x, game.slime.y, '#ffffff', 16);

function applyPickup(type, value){
  if(type === 'coin'){
    const amt = value || 1;
    coins += amt;
    localStorage.setItem(COIN_KEY, String(coins));
    coinValueEl.textContent = coins;
    spawnFloatingText(game.slime.x, game.slime.y-40, `🪙 +${amt}`, '#ffd23f');
    sfxCoin();
    return;
  }
  sfxPickup();
  vibrate(20);
  if(type === 'glue'){
    game.glueTimer = GLUE_DURATION;
    spawnFloatingText(game.slime.x, game.slime.y-40, '🧲 Клей! Коробки стабільні', '#6ec8ff');
  } else if(type === 'boost'){
    game.boostReady = true;
    spawnFloatingText(game.slime.x, game.slime.y-40, '🚀 Прискорювач готовий!', '#ff8a3d');
  } else if(type === 'shield'){
    game.shield = true;
    spawnFloatingText(game.slime.x, game.slime.y-40, '🛡️ Щит активовано!', '#ffd23f');
  }
}

function updatePickups(dt){
  const s = game.slime;
  for(const pu of game.pickups){
    if(pu.taken) continue;
    const dx = s.x-pu.x, dy = s.y-pu.y;
    const r = SLIME_R+16;
    if(dx*dx+dy*dy < r*r){
      pu.taken = true;
      applyPickup(pu.type, pu.value);
    }
  }
}

function closestPointOnRect(px, py, rx, ry, rw, rh){
  return { x: clamp(px, rx, rx+rw), y: clamp(py, ry, ry+rh) };
}

function checkPlatformCollisions(){
  const s = game.slime;
  for(const p of game.platforms){
    if(p === game.ignorePlatform) continue;
    const cp = closestPointOnRect(s.x, s.y, p.x, p.y, p.w, p.h);
    const dx = s.x - cp.x, dy = s.y - cp.y;
    const distSq = dx*dx + dy*dy;
    if(distSq < SLIME_R*SLIME_R){
      const dist = Math.sqrt(distSq) || 0.001;
      const nx = dx/dist, ny = dy/dist;
      const overlap = SLIME_R - dist;
      s.x += nx*overlap;
      s.y += ny*overlap;

      if(p.spike && !game.shield){
        spawnParticles(s.x, s.y, '#e0324c', 18);
        s.squashVel += 3;
        game.shakeT = 0.4;
        sfxSpike();
        vibrate(80);
        triggerGameOver('spike');
        return;
      }
      if(p.spike && game.shield){
        game.shield = false;
        spawnParticles(s.x, s.y, '#ffd23f', 16);
        spawnFloatingText(s.x, s.y-40, '🛡️ Щит врятував!', '#ffd23f');
        sfxPickup();
        vibrate(30);
      }

      const impactSpeed = Math.hypot(s.vx, s.vy);
      s.squashVel += clamp(impactSpeed*0.0011, 0.5, 3.4);
      const impactDirX = s.vx/(impactSpeed || 1);
      const glueActive = game.glueTimer > 0;
      for(let i=0;i<game.boxes.length;i++){
        const b = game.boxes[i];
        if(b.detached) continue;
        b.angVel += -impactDirX*(0.45+i*0.35)*clamp(impactSpeed/700, 0.3, 3.2)*(glueActive ? 0.28 : 1);
      }
      spawnParticles(cp.x, cp.y, '#ffffff', 8);
      game.shakeT = Math.max(game.shakeT, clamp(impactSpeed/2200, 0.05, 0.3));
      sfxLand(impactSpeed/1500);

      const center = p.x + p.w/2;
      const tol = 0.4 * game.character.centerTolMul;
      const offRatio = Math.abs(s.x - center) / (p.w/2);
      if(offRatio < tol && game.character.comboMul > 0){
        game.streak++;
        let bonus = Math.min(50, 5*game.streak) * game.character.comboMul;
        if(p.golden){
          bonus *= 3;
          spawnParticles(s.x, s.y, '#ffd23f', 22);
          sfxJackpot();
        }
        bonus = Math.round(bonus);
        game.bonusScore += bonus;
        spawnFloatingText(s.x, s.y-44, `+${bonus} 🔥 x${game.streak}${p.golden ? ' 💛':''}`, p.golden ? '#ffd23f' : '#5ee06a');
      } else {
        game.streak = 0;
        if(p.golden){
          spawnFloatingText(s.x, s.y-44, '💛 Майже! Цілься точніше', '#ffd23f');
        }
      }

      if(p.checkpoint){
        game.checkpoint = { x: p.x+p.w/2, y: p.y, score: game.score, boxes: game.boxes.filter(b=>!b.detached).length };
        spawnFloatingText(s.x, s.y-58, '🚩 Чекпоїнт збережено!', '#5ee06a');
        vibrate([15,15,15]);
      }

      if(p.crumble && p.crumbleTimer == null) p.crumbleTimer = 0.75;

      s.vx = 0; s.vy = 0;
      s.stuckPlatform = p;
      game.state = 'stuck';
      return;
    }
  }
}

function updatePlatformsMotion(dt){
  for(const p of game.platforms){
    if(!p.moving) continue;
    const oldX = p.x;
    p.x = p.baseX + (Math.sin(game.time*p.speed + p.phase)*0.5 + 0.5) * p.range;
    p.vx = (p.x - oldX) / Math.max(dt, 0.0001);
  }
}

function updateCrumblingPlatforms(dt){
  const toRemove = [];
  for(const p of game.platforms){
    if(p.crumbleTimer == null) continue;
    p.crumbleTimer -= dt;
    if(p.crumbleTimer <= 0){
      toRemove.push(p);
      if(game.slime.stuckPlatform === p){
        game.drag.active = false;
        game.slime.stuckPlatform = null;
        game.slime.vx = (Math.random()-0.5)*40;
        game.slime.vy = -90;
        game.state = 'flying';
        game.ignorePlatform = p;
        game.ignoreTimer = 0.15;
      }
      spawnParticles(p.x+p.w/2, p.y, '#8a6636', 10);
    }
  }
  if(toRemove.length){
    game.platforms = game.platforms.filter(p => toRemove.indexOf(p) === -1);
  }
}

function updateMeteors(dt){
  if(game.score < 900){
    game.meteors.length = 0;
    return;
  }
  game.meteorTimer -= dt;
  if(game.meteorTimer <= 0){
    const fromLeft = Math.random() < 0.5;
    game.meteors.push({
      x: fromLeft ? -30 : W+30,
      y: game.cameraY + Math.random()*H*0.6,
      vx: (fromLeft ? 1 : -1) * (220+Math.random()*160),
      vy: 120+Math.random()*80,
      rot: Math.random()*Math.PI*2
    });
    game.meteorTimer = 4 + Math.random()*4;
  }
  for(const m of game.meteors){
    m.x += m.vx*dt;
    m.y += m.vy*dt;
    m.rot += dt*6;
  }
  game.meteors = game.meteors.filter(m => m.x > -60 && m.x < W+60 && (m.y - game.cameraY) < H+200);

  const s = game.slime;
  for(const m of game.meteors){
    const dx = s.x-m.x, dy = s.y-m.y;
    const r = SLIME_R+13;
    if(dx*dx+dy*dy < r*r){
      if(game.shield){
        game.shield = false;
        spawnParticles(s.x, s.y, '#ffd23f', 16);
        spawnFloatingText(s.x, s.y-40, '🛡️ Щит зупинив метеорит!', '#ffd23f');
        game.meteors = game.meteors.filter(mm => mm !== m);
      } else {
        spawnParticles(s.x, s.y, '#ff5522', 20);
        sfxSpike();
        vibrate(80);
        triggerGameOver('meteor');
        return;
      }
      break;
    }
  }
}

function updateWeather(dt){
  if(game.flashAlpha > 0) game.flashAlpha = Math.max(0, game.flashAlpha - dt*1.8);
  const inStorm = game.score >= 400 && game.score < 1500;
  if(inStorm && game.time >= game.nextLightningAt){
    game.flashAlpha = 0.5;
    noiseBurst(0.3, 0.1);
    game.nextLightningAt = game.time + 4 + Math.random()*5;
  }
}

function getBoxWorldPos(i){
  const s = game.slime;
  let shiftSum = 0;
  for(let k=0;k<=i;k++){
    if(!game.boxes[k].detached) shiftSum += Math.sin(game.boxes[k].angle)*BOX_SIZE*0.85;
  }
  const y = s.y - SLIME_R - BOX_SIZE*0.55 - i*BOX_SIZE*0.92;
  const x = s.x + shiftSum;
  return { x, y };
}

function detachBox(fromIndex){
  for(let k=fromIndex; k<game.boxes.length; k++){
    const b = game.boxes[k];
    if(b.detached) continue;
    const pos = getBoxWorldPos(k);
    b.detached = true;
    b.warning = false;
    b.fx = pos.x;
    b.fy = pos.y;
    b.fvx = game.slime.vx*0.3 + b.angVel*70 + (Math.random()-0.5)*130;
    b.fvy = game.slime.vy*0.2 - 130 - Math.random()*110;
    b.frot = b.angle;
    b.frotVel = b.angVel*1.6 + (Math.random()-0.5)*4.5;
  }
  game.shakeT = Math.max(game.shakeT, 0.25);
  sfxBoxDetach();
  vibrate(20);
}

function triggerSlowMo(){
  if(game.slowMoCooldown > 0) return;
  game.slowMoTimer = 0.35;
  game.slowMoCooldown = 3;
}

function updateBoxes(dt, accX){
  const glueActive = game.glueTimer > 0;
  const torqueMul = glueActive ? 0.15 : 1;
  const tiltLimit = TILT_LIMIT * (glueActive ? 1.8 : 1) * game.character.tiltMul;
  for(let i=0;i<game.boxes.length;i++){
    const b = game.boxes[i];
    if(b.detached) continue;
    const lever = 1 + i*0.55;
    const torque = -accX*0.00032*lever*torqueMul;
    b.angVel += (-b.angle*6.0 - b.angVel*2.6 + torque) * dt;
    b.angle += b.angVel*dt;
    b.wasWarning = b.warning;
    b.warning = Math.abs(b.angle) > tiltLimit*0.68;
    if(b.warning && !b.wasWarning) triggerSlowMo();
  }
  let minIdx = -1;
  for(let i=0;i<game.boxes.length;i++){
    const b = game.boxes[i];
    if(!b.detached && Math.abs(b.angle) > tiltLimit){ minIdx = i; break; }
  }
  if(minIdx !== -1) detachBox(minIdx);
}

function updateDetachedBoxes(dt){
  for(const b of game.boxes){
    if(!b.detached || b.goneOffscreen) continue;
    b.fvy += GRAVITY*0.55*dt;
    b.fx += b.fvx*dt;
    b.fy += b.fvy*dt;
    b.frot += b.frotVel*dt;
    if((b.fy - game.cameraY) > H + 140){
      b.goneOffscreen = true;
      const remaining = game.boxes.filter(x => !x.detached).length;
      if(remaining > 0){
        spawnFloatingText(game.slime.x, game.slime.y-50, `📦 Коробка втрачена! Залишилось: ${remaining}`, '#ff8a6b');
        sfxBoxGone();
        vibrate([25,25,25]);
      }
    }
  }
  const allDetached = game.boxes.every(b => b.detached);
  const allGone = allDetached && game.boxes.every(b => b.goneOffscreen);
  if(allGone && game.state !== 'gameover'){
    triggerGameOver('boxes');
  }
}

function updateCamera(dt){
  const target = game.slime.y - H*0.62;
  const t = Math.min(1, dt*4);
  const lerped = game.cameraY + (target - game.cameraY)*t;
  if(lerped < game.cameraY) game.cameraY = lerped;
}

function updateScore(){
  if(game.slime.y < game.minWorldY) game.minWorldY = game.slime.y;
  game.heightScore = Math.max(0, Math.round((0 - game.minWorldY)/8));
  const total = game.heightScore + game.bonusScore;
  if(total !== game.score){
    game.score = total;
    scoreValueEl.textContent = game.score;
  }
  while(game.score >= game.nextMilestone){
    celebrateMilestone(game.nextMilestone);
    game.nextMilestone += 100;
  }
  updateZone();
}

function updateBuffUI(){
  buffGlueEl.style.display = game.glueTimer > 0 ? 'flex' : 'none';
  if(game.glueTimer > 0) glueTimeEl.textContent = game.glueTimer.toFixed(1)+'с';
  buffShieldEl.style.display = game.shield ? 'flex' : 'none';
  buffBoostEl.style.display = game.boostReady ? 'flex' : 'none';
}

function updateGhost(){
  if(!game.ghost) return;
  const log = game.ghost.log;
  while(game.ghost.idx < log.length-1 && log[game.ghost.idx+1][0] <= game.time) game.ghost.idx++;
}

function recordReplay(dt){
  game.replaySampleTimer += dt;
  if(game.replaySampleTimer > 0.08){
    game.replaySampleTimer = 0;
    game.replayLog.push([Math.round(game.time*100)/100, Math.round(game.slime.x), Math.round(game.slime.y)]);
    if(game.replayLog.length > 900) game.replayLog.shift();
  }
}

function triggerGameOver(reason){
  if(game.state === 'gameover') return;
  game.state = 'gameover';
  const reasons = {
    spike: '💢 Слайм наштрикнувся на шипи!',
    fall: '💧 Слайм зірвався вниз!',
    boxes: '📦 Усі коробки втрачено!',
    meteor: '☄️ У слайма влучив метеорит!'
  };
  gameOverReasonEl.textContent = reasons[reason] || 'Доставку провалено...';
  finalScoreEl.textContent = game.score;
  let isNewBest = false;
  if(game.score > best){
    best = game.score;
    localStorage.setItem('stickySlimeBest', String(best));
    bestValueEl.textContent = best;
    isNewBest = true;
  }
  finalBestEl.textContent = best;
  newBestBadge.classList.toggle('hidden-badge', !isNewBest);

  if(isNewBest && !game.daily){
    try{ localStorage.setItem(GHOST_KEY, JSON.stringify(game.replayLog)); }catch(e){}
  }

  if(game.daily){
    const dKey = DAILY_PREFIX+todayKey();
    const dBest = parseInt(localStorage.getItem(dKey) || '0', 10) || 0;
    if(game.score > dBest) localStorage.setItem(dKey, String(game.score));
    dailyBestValueEl.textContent = Math.max(game.score, dBest);
    dailyResultLine.classList.remove('hidden-badge');
    copyResultBtn.classList.remove('hidden-badge');
  } else {
    dailyResultLine.classList.add('hidden-badge');
    copyResultBtn.classList.add('hidden-badge');
  }

  if(game.checkpoint && coins >= CHECKPOINT_COST){
    continueBtn.textContent = `▶ Продовжити з чекпоїнта (${CHECKPOINT_COST}🪙)`;
    continueBtn.classList.remove('hidden-badge');
  } else {
    continueBtn.classList.add('hidden-badge');
  }

  if(isNewBest){ sfxRecord(); vibrate([20,20,20,20,60]); }
  else { sfxGameOver(); vibrate(80); }
  setTimeout(()=>{ gameOverScreen.classList.remove('hidden'); }, 260);
}

function resumeFromCheckpoint(){
  if(!game.checkpoint || coins < CHECKPOINT_COST) return;
  const cp = game.checkpoint;
  const wasDaily = game.daily;
  const preservedScore = game.score;
  const preservedBonus = game.bonusScore;
  const preservedHeight = game.heightScore;
  const preservedBoxesCount = cp.boxes;

  coins -= CHECKPOINT_COST;
  localStorage.setItem(COIN_KEY, String(coins));
  coinValueEl.textContent = coins;

  newGame(wasDaily);

  const startPlat = { x: cp.x-75, y: cp.y, w:150, h:PLAT_H, moving:false, spike:false, crumble:false, golden:false, risky:false, checkpoint:false, crumbleTimer:null, vx:0, baseX:cp.x-75, range:0, phase:0, speed:0 };
  game.platforms = [startPlat];
  game.slime.x = cp.x;
  game.slime.y = cp.y - SLIME_R;
  game.slime.prevX = game.slime.x;
  game.slime.prevY = game.slime.y;
  game.slime.stuckPlatform = startPlat;
  game.highestPlatformY = cp.y;
  game.highestPlatformCenterX = cp.x;
  game.minWorldY = -preservedHeight*8;
  game.heightScore = preservedHeight;
  game.bonusScore = preservedBonus;
  game.score = preservedScore;
  game.nextMilestone = Math.ceil((preservedScore+1)/100)*100;
  game.nextCheckpointAt = Math.ceil((preservedHeight+1)/CHECKPOINT_INTERVAL)*CHECKPOINT_INTERVAL;
  game.cameraY = game.slime.y - H*0.62;
  game.checkpoint = cp;

  for(let i=0;i<game.boxes.length;i++){
    const lost = i >= preservedBoxesCount;
    game.boxes[i].detached = lost;
    game.boxes[i].goneOffscreen = lost;
    game.boxes[i].angle = 0;
    game.boxes[i].angVel = 0;
    game.boxes[i].warning = false;
  }

  generateAhead();
  scoreValueEl.textContent = game.score;
  gameOverScreen.classList.add('hidden');
}
continueBtn.addEventListener('click', resumeFromCheckpoint);
copyResultBtn.addEventListener('click', ()=>{
  const text = `Sticky Slime — Виклик дня ${todayKey()}: ${game.score}м 🦠📦`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      copyResultBtn.textContent = '✅ Скопійовано!';
      setTimeout(()=>{ copyResultBtn.textContent = '📋 Скопіювати результат'; }, 1500);
    }).catch(()=>{});
  }
});

function boundsBounce(){
  const s = game.slime;
  if(s.x - SLIME_R < 0){
    s.x = SLIME_R;
    s.vx = Math.abs(s.vx)*0.55;
  } else if(s.x + SLIME_R > W){
    s.x = W - SLIME_R;
    s.vx = -Math.abs(s.vx)*0.55;
  }
}

function update(dt){
  if(!game || game.state === 'gameover'){
    if(game){
      updateDetachedBoxes(dt);
      updateParticles(dt);
      updateFloatingTexts(dt);
    }
    return;
  }
  game.time += dt;
  updatePlatformsMotion(dt);
  updateCrumblingPlatforms(dt);
  updateMeteors(dt);
  updateWeather(dt);

  if(game.slowMoCooldown > 0) game.slowMoCooldown = Math.max(0, game.slowMoCooldown - dt);

  const diffNow = diffForHeight(Math.max(0, -game.cameraY));
  game.windStrengthNow = 30 + diffNow*150;
  game.currentWindAccel = Math.sin(game.time*0.45 + game.windPhase) * game.windStrengthNow;

  const s = game.slime;
  s.prevX = s.x; s.prevY = s.y;

  if(game.ignoreTimer > 0){
    game.ignoreTimer -= dt;
    if(game.ignoreTimer <= 0) game.ignorePlatform = null;
  }
  if(game.glueTimer > 0) game.glueTimer = Math.max(0, game.glueTimer - dt);

  if(game.state === 'flying'){
    s.vx += game.currentWindAccel*dt;
    s.vy += GRAVITY*dt;
    s.x += s.vx*dt;
    s.y += s.vy*dt;
    boundsBounce();
    checkPlatformCollisions();
    if(game.state === 'flying' && (s.y - game.cameraY) > H + 220){
      triggerGameOver('fall');
    }
    spawnTrailParticle();
  } else if(game.state === 'stuck' && s.stuckPlatform){
    s.x += s.stuckPlatform.vx*dt;
  }

  s.squashVel += (-s.squashPos*SQUASH_STIFF - s.squashVel*SQUASH_DAMP)*dt;
  s.squashPos += s.squashVel*dt;

  const dtSafe = Math.max(dt, 0.0001);
  const instVX = (s.x - s.prevX)/dtSafe;
  const accX = (instVX - s.lastInstVX)/dtSafe;
  s.lastInstVX = instVX;

  updateBoxes(dt, accX);
  updateDetachedBoxes(dt);
  updatePickups(dt);
  updateCamera(dt);
  generateAhead();
  cleanupWorld();
  updateParticles(dt);
  updateFloatingTexts(dt);
  if(game.state !== 'gameover'){
    updateScore();
    recordReplay(dt);
    updateGhost();
  }
  updateBuffUI();

  let targetZoom = 1;
  if(game.state === 'flying'){
    const spd = Math.hypot(s.vx, s.vy);
    targetZoom = 1 - clamp((spd-600)/3000, 0, 0.12);
  }
  if(game.streak >= 3) targetZoom = Math.min(targetZoom, 0.94);
  game.zoom = lerp(game.zoom, targetZoom, Math.min(1, dt*3));

  if(game.shakeT > 0) game.shakeT = Math.max(0, game.shakeT - dt*2.2);
}

function skyColorForHeight(score){
  const t = clamp(score/1400, 0, 1);
  const stops = [
    { p:0.0, top:'#8fd8ff', bot:'#e8fbff' },
    { p:0.35, top:'#5b8cff', bot:'#b8d4ff' },
    { p:0.65, top:'#5b3fa0', bot:'#c17bd6' },
    { p:1.0, top:'#0b0930', bot:'#2c1a52' }
  ];
  let a = stops[0], b = stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(t >= stops[i].p && t <= stops[i+1].p){ a = stops[i]; b = stops[i+1]; break; }
  }
  const span = (b.p - a.p) || 1;
  const lt = clamp((t - a.p)/span, 0, 1);
  return { top: mixColor(a.top, b.top, lt), bot: mixColor(a.bot, b.bot, lt), t };
}

function mixColor(c1, c2, t){
  const p1 = hexToRgb(c1), p2 = hexToRgb(c2);
  const r = Math.round(lerp(p1.r,p2.r,t));
  const g = Math.round(lerp(p1.g,p2.g,t));
  const b = Math.round(lerp(p1.b,p2.b,t));
  return `rgb(${r},${g},${b})`;
}
function hexToRgb(hex){
  const v = parseInt(hex.slice(1),16);
  return { r:(v>>16)&255, g:(v>>8)&255, b:v&255 };
}

function drawBackground(){
  const sky = skyColorForHeight(game.score);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, sky.top);
  g.addColorStop(1, sky.bot);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  if(sky.t > 0.55){
    const starAlpha = clamp((sky.t-0.55)/0.45, 0, 1);
    ctx.save();
    ctx.globalAlpha = starAlpha;
    ctx.fillStyle = '#ffffff';
    for(let i=0;i<40;i++){
      const sx = (i*137.5) % W;
      const sy = (i*971.3 + game.time*4) % H;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(0, -game.cameraY*0.45);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.85;
  for(const c of game.clouds){
    ctx.save();
    ctx.translate(c.x + Math.sin(game.time*c.spd + c.size)*6, c.y);
    ctx.font = (c.size) + 'px sans-serif';
    ctx.fillText(c.icon || '☁️', 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawPlatform(p){
  ctx.save();
  let wob = 0;
  if(p.crumbleTimer != null){ wob = Math.sin(game.time*40) * (1 - Math.max(0,p.crumbleTimer)/0.75) * 4; }
  ctx.translate(p.x+wob, p.y - game.cameraY);

  if(p.golden){
    const pulse = 0.5+0.5*Math.sin(game.time*4);
    ctx.save();
    ctx.globalAlpha = 0.3+0.3*pulse;
    ctx.fillStyle = '#ffe066';
    ctx.beginPath();
    ctx.ellipse(p.w/2, p.h/2, p.w*0.75, p.h*2.2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  if(p.risky){
    const pulse = 0.5+0.5*Math.sin(game.time*6);
    ctx.save();
    ctx.strokeStyle = `rgba(255,90,180,${0.5+pulse*0.4})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([5,4]);
    ctx.strokeRect(-4,-4,p.w+8,p.h+8);
    ctx.restore();
  }

  const grad = ctx.createLinearGradient(0,0,0,p.h);
  if(p.checkpoint){
    grad.addColorStop(0, '#5ee0c8');
    grad.addColorStop(1, '#1a9c86');
  } else if(p.spike){
    grad.addColorStop(0, '#9aa3b0');
    grad.addColorStop(1, '#5c6270');
  } else if(p.golden){
    grad.addColorStop(0, '#fff2a8');
    grad.addColorStop(1, '#e0a30a');
  } else if(p.moving){
    grad.addColorStop(0, '#6ec8ff');
    grad.addColorStop(1, '#2f7fd6');
  } else if(p.crumble){
    grad.addColorStop(0, p.crumbleTimer != null ? '#a9834f' : '#d9b06c');
    grad.addColorStop(1, '#6b4a22');
  } else if(p.risky){
    grad.addColorStop(0, '#ff9ecf');
    grad.addColorStop(1, '#c94f8f');
  } else {
    grad.addColorStop(0, '#ffb95c');
    grad.addColorStop(1, '#c9761f');
  }
  ctx.fillStyle = grad;
  const r = 8;
  ctx.beginPath();
  ctx.moveTo(r,0);
  ctx.arcTo(p.w,0,p.w,p.h,r);
  ctx.arcTo(p.w,p.h,0,p.h,r);
  ctx.arcTo(0,p.h,0,0,r);
  ctx.arcTo(0,0,p.w,0,r);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(3, 3, p.w-6, 3);

  if(p.crumble){
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p.w*0.25,2); ctx.lineTo(p.w*0.4,p.h-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.w*0.68,2); ctx.lineTo(p.w*0.55,p.h-2); ctx.stroke();
  }

  if(p.spike){
    const n = Math.max(2, Math.floor(p.w/22));
    const sw = p.w/n;
    ctx.fillStyle = '#e0324c';
    ctx.strokeStyle = '#7a0e1c';
    ctx.lineWidth = 1.5;
    for(let i=0;i<n;i++){
      const bx = i*sw;
      ctx.beginPath();
      ctx.moveTo(bx+2, 0);
      ctx.lineTo(bx+sw/2, -16);
      ctx.lineTo(bx+sw-2, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }
  if(p.moving){
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('↔', p.w/2, p.h/2+1);
  }
  if(p.checkpoint){
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🚩', p.w/2, -16);
  }
  ctx.restore();
}

function drawPlatforms(){
  for(const p of game.platforms) drawPlatform(p);
}

function drawPickups(){
  for(const pu of game.pickups){
    if(pu.taken) continue;
    const icon = pu.type === 'glue' ? '🧲' : pu.type === 'boost' ? '🚀' : pu.type === 'shield' ? '🛡️' : '🪙';
    const bobY = Math.sin(game.time*3 + pu.bob)*6;
    ctx.save();
    ctx.translate(pu.x, pu.y + bobY - game.cameraY);
    ctx.font = (pu.type === 'coin' ? 22 : 28) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, 0, 0);
    ctx.restore();
  }
}

function drawMeteors(){
  for(const m of game.meteors){
    ctx.save();
    ctx.translate(m.x, m.y - game.cameraY);
    ctx.rotate(m.rot);
    ctx.font = '26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('☄️', 0, 0);
    ctx.restore();
  }
}

function drawGhost(){
  if(!game.ghost) return;
  const log = game.ghost.log;
  const idx = game.ghost.idx;
  if(idx >= log.length) return;
  const entry = log[idx];
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.translate(entry[1], entry[2] - game.cameraY);
  ctx.beginPath();
  ctx.arc(0,0,SLIME_R,0,Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.font = (SLIME_R*0.9)+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(43,33,96,0.55)';
  ctx.fillText('👻', 0, 1);
  ctx.restore();
}

function drawEyes(dirX, dirY){
  const ex = dirX*SLIME_R*0.12;
  const ey = -SLIME_R*0.2 + dirY*SLIME_R*0.1;
  for(const side of [-1,1]){
    const cx = side*SLIME_R*0.36 + ex;
    const cy = ey;
    ctx.beginPath();
    ctx.ellipse(cx, cy, SLIME_R*0.25, SLIME_R*0.29, 0, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.stroke();

    const px = cx + dirX*SLIME_R*0.16;
    const py = cy + dirY*SLIME_R*0.16 + SLIME_R*0.03;
    ctx.beginPath();
    ctx.arc(px, py, SLIME_R*0.13, 0, Math.PI*2);
    ctx.fillStyle = '#1a1a2e';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px - SLIME_R*0.045, py - SLIME_R*0.05, SLIME_R*0.045, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, SLIME_R*0.22, SLIME_R*0.28, 0.12*Math.PI, 0.88*Math.PI);
  ctx.strokeStyle = '#2c6b06';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.stroke();
}

function drawSlime(){
  const s = game.slime;
  const skin = currentSkin();
  ctx.save();
  ctx.translate(s.x, s.y - game.cameraY);

  let rot = 0;
  if(game.state === 'flying'){
    rot = Math.atan2(s.vy, s.vx)*0.12;
  }
  ctx.rotate(rot);

  const c = clamp(s.squashPos, -0.6, 1.1);
  const scaleX = 1 + c*0.5;
  const scaleY = 1 - c*0.42;
  ctx.scale(scaleX, scaleY);

  const wobbleAmt = 1.5 + Math.abs(c)*9;
  const N = 18;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const a = (i/N)*Math.PI*2;
    const r = SLIME_R + Math.sin(a*3 + game.time*5)*wobbleAmt*0.28 + Math.sin(a*5 - game.time*3.2)*wobbleAmt*0.18;
    const px = Math.cos(a)*r, py = Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  const grad = ctx.createRadialGradient(-SLIME_R*0.3,-SLIME_R*0.4,4, 0,0, SLIME_R*1.35);
  grad.addColorStop(0, skin.top);
  grad.addColorStop(0.55, skin.mid);
  grad.addColorStop(1, skin.bot);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = skin.stroke;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(-SLIME_R*0.32, -SLIME_R*0.48, SLIME_R*0.32, SLIME_R*0.18, -0.5, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fill();

  drawEyes(game.eyeDir.x, game.eyeDir.y);

  ctx.restore();
}

function drawShieldRing(){
  if(!game.shield) return;
  const s = game.slime;
  ctx.save();
  ctx.translate(s.x, s.y - game.cameraY);
  ctx.rotate(game.time*2);
  ctx.beginPath();
  ctx.arc(0,0, SLIME_R*1.35, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,210,63,0.85)';
  ctx.lineWidth = 3;
  ctx.setLineDash([7,5]);
  ctx.stroke();
  ctx.restore();
}

function drawBoxSprite(x, y, rotation, size, alpha){
  ctx.save();
  ctx.translate(x, y - game.cameraY);
  ctx.rotate(rotation);
  if(alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.font = size + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('📦', 0, 0);
  ctx.restore();
}

function drawStackedBoxes(){
  for(let i=0;i<game.boxes.length;i++){
    const b = game.boxes[i];
    if(b.detached) continue;
    const pos = getBoxWorldPos(i);
    if(b.warning){
      const pulse = 0.5+0.5*Math.sin(game.time*14);
      ctx.save();
      ctx.globalAlpha = 0.35+0.35*pulse;
      ctx.fillStyle = '#ff3b3b';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y - game.cameraY, BOX_SIZE*0.85, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    drawBoxSprite(pos.x, pos.y, b.angle, BOX_SIZE+8);
  }
}

function drawDetachedBoxes(){
  for(const b of game.boxes){
    if(!b.detached || b.goneOffscreen) continue;
    drawBoxSprite(b.fx, b.fy, b.frot, BOX_SIZE+8);
  }
}

function drawParticles(){
  for(const p of game.particles){
    const a = clamp(p.life/p.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y - game.cameraY, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function computeTrajectoryPreview(){
  const s = game.slime;
  const dx = game.drag.dx, dy = game.drag.dy;
  const len = Math.hypot(dx,dy) || 1;
  const power = game.drag.power;
  let speed = power*power_curve(power)*LAUNCH_SPEED*game.character.launchMul;
  if(game.boostReady) speed *= 1.4;
  let vx = -dx/len*speed;
  let vy = -dy/len*speed;
  let x = s.x, y = s.y;
  const pts = [];
  const dt = 0.032;
  for(let i=0;i<45;i++){
    const windA = Math.sin((game.time+i*dt)*0.45 + game.windPhase) * game.windStrengthNow;
    vx += windA*dt;
    vy += GRAVITY*dt;
    x += vx*dt;
    y += vy*dt;
    if(x < SLIME_R || x > W-SLIME_R) break;
    let hit = false;
    for(const p of game.platforms){
      if(p === s.stuckPlatform) continue;
      const cp = closestPointOnRect(x,y,p.x,p.y,p.w,p.h);
      const ddx = x-cp.x, ddy = y-cp.y;
      if(ddx*ddx+ddy*ddy < SLIME_R*SLIME_R){ hit = true; break; }
    }
    pts.push({x,y});
    if(hit) break;
  }
  return pts;
}

function drawTrajectoryPreview(){
  const pts = computeTrajectoryPreview();
  ctx.save();
  for(let i=0;i<pts.length;i+=2){
    const pt = pts[i];
    const a = 1 - i/pts.length;
    ctx.globalAlpha = 0.15+a*0.5;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y - game.cameraY, 3.5, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
  ctx.restore();
}

function drawAimLine(){
  const s = game.slime;
  const sx = s.x, sy = s.y - game.cameraY;
  const dx = game.drag.dx, dy = game.drag.dy;
  const power = game.drag.power;

  ctx.save();
  ctx.setLineDash([8,7]);
  ctx.lineWidth = 4;
  const hue = lerp(120, 0, power);
  ctx.strokeStyle = `hsl(${hue},85%,55%)`;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx - dx*2.2, sy - dy*2.2);
  ctx.stroke();
  ctx.setLineDash([]);

  const tx = sx - dx*2.2, ty = sy - dy*2.2;
  const ang = Math.atan2(-dy, -dx);
  ctx.translate(tx, ty);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(14,0);
  ctx.lineTo(-6,-8);
  ctx.lineTo(-6,8);
  ctx.closePath();
  ctx.fillStyle = `hsl(${hue},85%,55%)`;
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(sx, sy + SLIME_R + 30);
  const barW = 90, barH = 12;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(-barW/2, -barH/2, barW, barH, 6) : ctx.rect(-barW/2,-barH/2,barW,barH);
  ctx.fill();
  ctx.fillStyle = `hsl(${hue},85%,55%)`;
  const fillW = barW*power;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-barW/2, -barH/2, Math.max(6,fillW), barH, 6); else ctx.rect(-barW/2,-barH/2,fillW,barH);
  ctx.fill();
  ctx.restore();
}

function drawWindIndicator(){
  const w = game.currentWindAccel;
  if(Math.abs(w) < 15) return;
  const alpha = clamp(Math.abs(w)/200, 0.25, 0.9);
  const arrow = w > 0 ? '➡️ вітер' : '⬅️ вітер';
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(arrow, W/2, 76);
  ctx.restore();
}

function drawSlowMoOverlay(){
  if(!game.slowMoTimer || game.slowMoTimer <= 0) return;
  ctx.save();
  ctx.fillStyle = 'rgba(20,10,50,0.22)';
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = clamp(game.slowMoTimer/0.35, 0, 1);
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff5b5b';
  ctx.fillText('⚠️ ЗАРАЗ ВПАДЕ!', W/2, H*0.22);
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawBackground();

  let shakeX = 0, shakeY = 0;
  if(game.shakeT > 0){
    shakeX = (Math.random()-0.5)*game.shakeT*24;
    shakeY = (Math.random()-0.5)*game.shakeT*24;
  }

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(game.zoom, game.zoom);
  ctx.translate(-W/2, -H/2);
  ctx.translate(shakeX, shakeY);
  drawPlatforms();
  drawPickups();
  drawMeteors();
  drawGhost();
  drawDetachedBoxes();
  drawSlime();
  drawShieldRing();
  drawStackedBoxes();
  drawParticles();
  drawFloatingTexts();
  ctx.restore();

  if(game.state === 'aiming'){
    drawTrajectoryPreview();
    drawAimLine();
  }
  drawWindIndicator();

  if(game.flashAlpha > 0){
    ctx.save();
    ctx.globalAlpha = game.flashAlpha;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  drawSlowMoOverlay();
}

let lastT = performance.now();
function frame(now){
  let dtReal = clamp((now - lastT)/1000, 0, 0.033);
  lastT = now;
  if(game && game.slowMoTimer > 0){
    game.slowMoTimer -= dtReal;
    update(dtReal*0.25);
  } else {
    update(dtReal);
  }
  render();
  requestAnimationFrame(frame);
}

restartBtn.addEventListener('click', ()=>{
  newGame(game && game.daily);
});

resize();
newGame(false);
requestAnimationFrame((t)=>{ lastT = t; requestAnimationFrame(frame); });

})();
</script>
</body>
