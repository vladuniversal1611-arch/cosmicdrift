<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5cb85c">
<title>Hill Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;
  background:#000;display:flex;justify-content:center;align-items:center;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif}
#wrap{position:relative;width:400px;height:700px;overflow:hidden}
/* Only the GAME canvas is full-screen absolute */
#gc{display:block;position:absolute;top:0;left:0;width:400px;height:700px}

/* ── HUD ──────────────────────────────────────────────── */
#hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;
  display:none;padding:10px 14px 8px;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 100%)}
#hudRow{display:flex;justify-content:space-between;align-items:center}
.hpill{display:flex;flex-direction:column;align-items:center}
.hlbl{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.5);text-transform:uppercase}
.hval{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);line-height:1.1}
.hval.gold{color:#ffe500}
#fuelBox{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 12px}
#fuelLbl{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.45)}
#fuelTrack{width:100%;height:10px;background:rgba(0,0,0,.4);border-radius:5px;
  border:1px solid rgba(255,255,255,.15);overflow:hidden}
#fuelBar{height:100%;border-radius:5px;background:linear-gradient(90deg,#66bb6a,#2e7d32);
  transition:width .12s,background .25s}

/* ── CONTROLS ─────────────────────────────────────────── */
#controls{position:absolute;bottom:0;left:0;right:0;height:130px;display:none;
  z-index:20;pointer-events:all}
.cbtn{flex:1;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .08s}
#cBrake{float:left;width:50%;background:rgba(220,50,50,.14);
  border-right:1px solid rgba(255,255,255,.06)}
#cGas  {float:right;width:50%;background:rgba(50,200,80,.14)}
#cBrake.act{background:rgba(220,50,50,.38)}
#cGas.act  {background:rgba(50,200,80,.36)}
.cicon{font-size:40px;opacity:.55}
.clbl{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.3);text-transform:uppercase}

/* ── PAUSE BUTTON ─────────────────────────────────────── */
#pauseBtn{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  z-index:15;pointer-events:all;display:none;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);
  border-radius:9px;color:rgba(255,255,255,.7);font-size:17px;
  padding:5px 14px;cursor:pointer;font-family:inherit}

/* ── OVERLAY SCREENS ──────────────────────────────────── */
.ovl{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;
  align-items:center;justify-content:flex-start;pointer-events:all;overflow-y:auto}
.ovl.on{display:flex}

/* Menu */
#menuOvl{background:linear-gradient(180deg,#56CCF2 0%,#a8e063 60%,#66bb6a 100%);
  justify-content:center;align-items:center}
.mlogo{text-align:center;margin-bottom:14px}
.mlogo-t{font-size:56px;font-weight:900;color:#fff;
  text-shadow:0 5px 0 #1a6614,0 0 40px rgba(80,200,40,.35);letter-spacing:3px}
.mlogo-s{font-size:11px;letter-spacing:6px;color:rgba(255,255,255,.6);margin-top:4px}
/* Menu hills decoration */
#menuHills{position:absolute;bottom:0;left:0;right:0;height:220px;pointer-events:none}
.gbtn{border:none;outline:none;cursor:pointer;font-family:inherit;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;transition:transform .08s}
.gbtn:active{transform:scale(.93)!important}
.btn-play{display:block;background:linear-gradient(180deg,#56e04a,#2ea829);
  color:#fff;font-size:24px;padding:18px 0;border-radius:20px;width:240px;
  text-align:center;box-shadow:0 7px 0 #1a6614,0 0 24px rgba(60,200,40,.35);
  margin-bottom:16px}
.btn-med{display:block;background:rgba(0,0,0,.22);color:#fff;font-size:13px;
  padding:13px 0;border-radius:14px;width:200px;text-align:center;
  border:2px solid rgba(255,255,255,.3);margin-bottom:10px}
.mbest{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.5);margin-top:10px}

/* Garage / Level select shared */
.darkovl{background:linear-gradient(180deg,#1a1a2e,#16213e)}
.stitle{font-size:10px;letter-spacing:5px;color:rgba(255,255,255,.4);
  margin:22px 0 8px;text-transform:uppercase}
.scoins{font-size:18px;font-weight:900;color:#ffe500;margin-bottom:14px}
/* vehicle cards */
.vrow{display:flex;gap:9px;padding:0 14px 6px;overflow-x:auto;
  width:100%;margin-bottom:12px}
.vrow::-webkit-scrollbar{display:none}
.vcard{flex-shrink:0;width:96px;background:rgba(255,255,255,.06);
  border:2px solid rgba(255,255,255,.1);border-radius:14px;
  padding:8px 5px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;transition:all .13s}
.vcard.sel{border-color:#56e04a;background:rgba(86,224,74,.1)}
.vcard.lck{opacity:.45}
.vcname{font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.55);text-transform:uppercase}
.vcprice{font-size:11px;color:#ffe500;font-weight:900}
/* upgrades */
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px;width:100%}
.ucard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:9px 7px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:4px;transition:transform .1s}
.ucard:active{transform:scale(.94)}
.uicon{font-size:22px}
.uname{font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.5);
  text-transform:uppercase;text-align:center}
.udots{display:flex;gap:3px}
.udot{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
.udot.on{background:#56e04a;box-shadow:0 0 5px rgba(86,224,74,.65)}
.ucost{font-size:12px;font-weight:900;color:#ffe500}

/* Level cards */
.lcard{display:flex;align-items:center;gap:12px;padding:13px 15px;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.1);
  border-radius:13px;cursor:pointer;width:calc(100% - 28px);transition:all .13s}
.lcard.sel{border-color:#56e04a}
.lcard.lck{opacity:.45}
.lemoji{font-size:28px}
.lname{font-size:14px;font-weight:900;color:#fff}
.ldesc{font-size:9px;color:rgba(255,255,255,.4);margin-top:2px}

/* Pause */
#pauseOvl{background:rgba(0,0,0,.72);backdrop-filter:blur(3px);
  justify-content:center;align-items:center}
.pausetitle{font-size:32px;font-weight:900;color:#fff;letter-spacing:4px;margin-bottom:28px}

/* Game Over */
#goOvl{background:rgba(0,0,0,.78);justify-content:center;align-items:center}
.gocard{background:rgba(15,20,40,.92);border:1px solid rgba(255,255,255,.12);
  border-radius:22px;padding:26px 26px;display:flex;flex-direction:column;
  align-items:center;gap:11px;width:300px}
.go-over{font-size:10px;letter-spacing:5px;color:rgba(255,255,255,.4)}
.go-rsn{font-size:21px;font-weight:900;color:#ff5252;letter-spacing:1px}
.gohr{width:100%;height:1px;background:rgba(255,255,255,.1)}
.gostats{display:flex;justify-content:space-around;width:100%}
.gostat{display:flex;flex-direction:column;align-items:center;gap:3px}
.goslbl{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.35)}
.gosval{font-size:26px;font-weight:900;color:#fff}
.gosval.g{color:#ffe500}
.gobest{font-size:10px;color:rgba(255,180,0,.7);letter-spacing:2px}

/* Notifications */
#toast{position:absolute;top:88px;left:50%;transform:translateX(-50%);
  z-index:50;background:rgba(0,0,0,.82);color:#fff;padding:9px 18px;
  border-radius:10px;font-size:11px;letter-spacing:2px;pointer-events:none;
  opacity:0;transition:opacity .2s;white-space:nowrap}
#mile{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:50;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
.mile-n{font-size:42px;font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,220,50,.8)}
.mile-s{font-size:9px;letter-spacing:5px;color:rgba(255,255,255,.5);margin-top:4px}
.cpop{position:absolute;z-index:45;pointer-events:none;font-size:15px;font-weight:900;
  color:#ffe500;text-shadow:0 0 8px rgba(255,200,0,.7);
  animation:cpop .9s ease-out forwards}
@keyframes cpop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px)}}
</style>
</head>
<body>
<div id="wrap">

<!-- Main game canvas -->

<!-- HUD -->

<!-- ── GARAGE ── -->
<div class="ovl darkovl" id="garageOvl">

  <div style="font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.3);margin-bottom:8px;padding:0 14px;align-self:flex-start">UPGRADES</div>

  <button class="gbtn btn-med" id="btnGBack" style="margin:14px auto 20px">← BACK</button>
</div>

<!-- ── MAP SELECT ── -->
<div class="ovl darkovl" id="mapOvl">
  <div class="stitle">SELECT MAP</div>
  <div style="width:100%;padding:0 14px;display:flex;flex-direction:column;gap:9px" id="mapCards"></div>
  <button class="gbtn btn-med" id="btnMapBack" style="margin:14px auto 20px">← BACK</button>
</div>

<!-- ── PAUSE ── -->
<div class="ovl" id="pauseOvl">
  <div class="pausetitle">PAUSED</div>
  <button class="gbtn btn-play" id="btnResume" style="font-size:20px;padding:16px 0;margin-bottom:12px">▶ RESUME</button>
  <button class="gbtn btn-med" id="btnPMenu">🏠 MENU</button>
</div>

<!-- ── GAME OVER ── -->
<div class="ovl" id="goOvl">
  <div class="gocard">
    <div class="go-over">GAME OVER</div>
    <div class="go-rsn" id="goRsn">CRASHED!</div>
    <div class="gohr"></div>
    <div class="gostats">
      <div class="gostat"><div class="goslbl">DISTANCE</div><div class="gosval" id="goDist">0 m</div></div>
      <div class="gostat"><div class="goslbl">COINS</div><div class="gosval g" id="goCoins">0</div></div>
    </div>
    <div class="gobest" id="goBest"></div>
    <div class="gohr"></div>
    <button class="gbtn btn-play" id="btnRetry" style="font-size:20px;padding:15px 0;margin-bottom:6px">▶ RETRY</button>
    <button class="gbtn btn-med" id="btnGoMenu">🏠 MENU</button>
  </div>
</div>

</div><!-- #wrap -->

<script>
'use strict';
// ── polyfill roundRect ───────────────────────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(+r||0,Math.abs(w)/2,Math.abs(h)/2);
    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r);this.closePath();return this;
  };
}

// ── sizing ───────────────────────────────────────────────
const W=400,H=700;
const wrap=document.getElementById('wrap');
const gc=document.getElementById('gc');
const ctx=gc.getContext('2d');

const safeProbe=document.createElement('div');
safeProbe.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0';
document.body.appendChild(safeProbe);
function resize(){
  const cs=getComputedStyle(safeProbe),st=parseFloat(cs.paddingTop)||0,sb=parseFloat(cs.paddingBottom)||0;
  const ah=Math.max(100,innerHeight-st-sb);
  const s=Math.min(innerWidth/W,ah/H);
  wrap.style.transform=`scale(${s})`;
  wrap.style.transformOrigin='center center';
  wrap.style.position='absolute';
  wrap.style.left=((innerWidth-W)/2)+'px';
  wrap.style.top=(st+(ah-H)/2)+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();

// ── seeded rng ───────────────────────────────────────────
function mbrng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};}

// ── audio ────────────────────────────────────────────────
let AC=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
let eOsc=null,eGain=null;
function beep(f,d,v=.28,tp='sine'){try{const c=getAC(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.start();o.stop(c.currentTime+d);}catch(e){}}
function startEng(){try{const c=getAC();if(eOsc){eOsc.stop();eOsc=null;}eOsc=c.createOscillator();eGain=c.createGain();const ws=c.createWaveShaper(),cu=new Float32Array(256);for(let i=0;i<256;i++){const x=i*2/256-1;cu[i]=x<0?-Math.pow(-x,.55):Math.pow(x,.55);}ws.curve=cu;eOsc.type='sawtooth';eOsc.frequency.value=82;eGain.gain.value=.045;eOsc.connect(ws);ws.connect(eGain);eGain.connect(c.destination);eOsc.start();}catch(e){}}
function setRPM(r){if(!eOsc)return;try{const c=getAC();eOsc.frequency.setTargetAtTime(60+r*230,c.currentTime,.08);eGain.gain.setTargetAtTime(.04+r*.05,c.currentTime,.08);}catch(e){}}
function stopEng(){try{if(eOsc){eOsc.stop();eOsc=null;}}catch(e){}}
const sfxCoin=()=>beep(920,.09,.16);
const sfxFuel=()=>{beep(440,.14,.2,'triangle');setTimeout(()=>beep(550,.14,.18,'triangle'),95);};
const sfxCrash=()=>{beep(100,.5,.5,'sawtooth');setTimeout(()=>beep(65,.35,.3,'sawtooth'),55);};
const sfxBtn=()=>beep(660,.07,.16,'triangle');
const sfxBuy=()=>{beep(440,.08,.2);setTimeout(()=>beep(660,.08,.22),90);setTimeout(()=>beep(880,.14,.25),210);};
const sfxMile=()=>{beep(660,.1,.28);setTimeout(()=>beep(880,.12,.3),110);setTimeout(()=>beep(1100,.18,.28),255);};

// ── environments ─────────────────────────────────────────

   bg:['rgba(160,160,180,.4)','rgba(120,130,150,.35)','rgba(80,100,120,.3)'],
   cloud:'rgba(230,240,255,.7)',gravity:.34,friction:.76,hillAmp:150,hillFreq:.0042,rough:1.0,
   treeFn:'treePine'},
  {id:'arctic',name:'ARCTIC',emoji:'❄',locked:true,unlockM:800,

   cloud:'rgba(220,240,255,.9)',gravity:.34,friction:.58,hillAmp:120,hillFreq:.0048,rough:.75,
   treeFn:'treeSnow'},
  {id:'desert',name:'DESERT',emoji:'🏜',locked:true,unlockM:1800,

   bg:['rgba(240,180,80,.4)','rgba(210,150,50,.35)','rgba(180,120,30,.3)'],
   cloud:'rgba(255,220,150,.6)',gravity:.34,friction:.7,hillAmp:135,hillFreq:.006,rough:.65,

  {id:'moon',name:'MOON',emoji:'🌕',locked:true,unlockM:3500,

// ── vehicles ─────────────────────────────────────────────
const VEHICLES=[
  {id:'jeep',  name:'JEEP',   emoji:'🚙',price:0,   locked:false,
   bc:'#E65100',bc2:'#BF360C',rc:'#D84315',wc:'rgba(180,230,255,.75)',

  {id:'monster',name:'MONSTER',emoji:'🚜',price:1500,locked:true,

   hub:'#FF6F00',tyr:'#0a0a0a',rim:'#FF6F00',
   eng:.5,susp:1.65,fuelMax:85,mass:1.6,pitchK:.4,airK:.75,comY:40,wr:38,axF:56,axR:-52,cw:108,ch:32},
  {id:'bike',  name:'MOTO',   emoji:'🏍',price:800, locked:true,
   bc:'#B71C1C',bc2:'#7F0000',rc:'#C62828',wc:'rgba(200,230,255,.6)',
   hub:'#bbb',tyr:'#111',rim:'#e0e0e0',
   eng:.95,susp:.7,fuelMax:60,mass:.55,pitchK:.75,airK:1.25,comY:22,wr:22,axF:30,axR:-28,cw:60,ch:18},

  {id:'engine',name:'ENGINE',    icon:'⚡',max:6,base:80, mult:1.65},

// ── save ─────────────────────────────────────────────────
// Key stays "hillrush3" so existing players keep their progress; the payload
// now carries a version number and is migrated/validated on every load.
const SK='hillrush3',SK_BAK='hillrush3_bak',SAVE_VER=4;
function defaultSave(){
  const vs={};VEHICLES.forEach(v=>{vs[v.id]={locked:v.price>0};UPGRADES.forEach(u=>vs[v.id][u.id]=0);});
  const envs={};ENVS.forEach(e=>envs[e.id]=!e.locked);
  return{ver:SAVE_VER,coins:0,best:0,selV:'jeep',selE:'country',vs,envs,
    bestBy:{},                                         // best distance per map
    settings:{sound:true,vibe:true},
    stats:{runs:0,dist:0,coins:0,flips:0,perfect:0,airTime:0},
    daily:{day:'',streak:0,claimed:''},                // 7-day login cycle
    missions:{day:'',list:[]},
    ach:{}};                                           // achievement id -> true
}
const num=(v,d,min=0,max=1e12)=>{v=+v;return isFinite(v)?Math.min(max,Math.max(min,v)):d;};
function migrateSave(d){
  const s=defaultSave();
  if(!d||typeof d!=='object')return s;
  // v3 and earlier had no "ver" field; the shape is a subset of v4 so the
  // field-by-field copy below upgrades it.
  s.coins=Math.floor(num(d.coins,0));s.best=Math.floor(num(d.best,0));
  if(d.vs&&typeof d.vs==='object')for(const v of VEHICLES){
    const o=d.vs[v.id];if(!o||typeof o!=='object')continue;
    s.vs[v.id].locked=v.price>0?o.locked!==false:false;
    for(const u of UPGRADES)s.vs[v.id][u.id]=Math.floor(num(o[u.id],0,0,u.max));
  }
  if(d.envs&&typeof d.envs==='object')for(const e of ENVS)s.envs[e.id]=!!d.envs[e.id]||!e.locked;
  ENVS.forEach(e=>{if(s.best>=e.unlockM)s.envs[e.id]=true;});
  s.selV=VEHICLES.some(v=>v.id===d.selV)&&!s.vs[d.selV].locked?d.selV:'jeep';
  s.selE=ENVS.some(e=>e.id===d.selE)&&s.envs[d.selE]?d.selE:'country';
  if(d.bestBy&&typeof d.bestBy==='object')for(const e of ENVS)if(d.bestBy[e.id])s.bestBy[e.id]=Math.floor(num(d.bestBy[e.id],0));
  if(d.settings&&typeof d.settings==='object'){s.settings.sound=d.settings.sound!==false;s.settings.vibe=d.settings.vibe!==false;}
  if(d.stats&&typeof d.stats==='object')for(const k in s.stats)s.stats[k]=num(d.stats[k],0);
  if(d.daily&&typeof d.daily==='object'){s.daily.day=String(d.daily.day||'');s.daily.streak=Math.floor(num(d.daily.streak,0,0,7));s.daily.claimed=String(d.daily.claimed||'');}
  if(d.missions&&Array.isArray(d.missions.list)){s.missions.day=String(d.missions.day||'');
    s.missions.list=d.missions.list.filter(m=>m&&typeof m.id==='string').slice(0,3).map(m=>({id:m.id,goal:num(m.goal,1,1),reward:num(m.reward,0),prog:num(m.prog,0),done:!!m.done,claimed:!!m.claimed}));}
  if(d.ach&&typeof d.ach==='object')for(const k in d.ach)if(d.ach[k])s.ach[k]=true;
  return s;
}
function loadSave(){
  for(const key of [SK,SK_BAK]){
    let raw=null;try{raw=localStorage.getItem(key);}catch(e){return defaultSave();}
    if(raw==null)continue;
    try{const s=migrateSave(JSON.parse(raw));
      if(key===SK_BAK)console.warn('Main save unreadable, restored from backup');
      return s;}
    catch(e){
      // Keep the unreadable payload instead of silently overwriting it
      try{localStorage.setItem(key+'_corrupt',raw);}catch(_){}
    }
  }
  return defaultSave();
}
let sv=loadSave();
function saveSv(){
  try{const js=JSON.stringify(sv);localStorage.setItem(SK,js);localStorage.setItem(SK_BAK,js);}catch(e){}
}
saveSv();

// ── particles ─────────────────────────────────────────────
const PARTS=[];
function emit(x,y,n,o){for(let i=0;i<n;i++){const a=(o.a||0)+(Math.random()-.5)*(o.sp||6.28);const s=(o.s||2)*(.5+Math.random()*.5);PARTS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0),life:1,dec:o.d||.03,r:o.r||3,col:o.c||'#fff',g:o.g||.07});}}
function tickParts(){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.96;p.life-=p.dec;if(p.life<=0)PARTS.splice(i,1);}}
function drawParts(cx,cy){for(const p of PARTS){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x-cx,p.y-cy,p.r*(0.5+p.life*.5),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}

// ── terrain ───────────────────────────────────────────────
const SEG=55;
class Terrain{
  constructor(env,seed){this.env=env;this.r=mbrng(seed||Math.random()*99999|0);this.pts=[];this.objs=[];this.decs=[];this.gx=0;this._gen(W*4);}
  _gen(to){
    const r=this.r,e=this.env,base=H*.56;
    let x=this.gx,y=x===0?base:this.pts[this.pts.length-1].y;
    if(x===0){for(let i=0;i<=8;i++)this.pts.push({x:i*SEG,y});x=8*SEG;}
    while(x<to){
      const prog=Math.min(1,x/15000);
      const diff=Math.min(1.25,.45+x/12000);
      const cap=.4+.24*prog;                        // max slope (tan): gentle early, steeper later
      const kind=r();
      const x0=x,y0=y;
      if(x>900&&kind<.16+.08*prog&&y>base-200){
        // ── Kicker ramp with a long downhill landing (the jump in "hill climb" games)
        const hR=50+r()*55*diff,sR=Math.min(.36+.18*prog+r()*.06,cap+.08),lenR=hR/sR;
        const sL=.42+r()*.16,ease=170;
        let lenL=240+r()*170;
        const topY=y-hR,maxEnd=base+220;
        lenL=Math.max(140,Math.min(lenL,(maxEnd-topY-sL*ease/2)/sL));
        const lipX=x+70+lenR;
        this._line(x,y,x+70,y);this._line(x+70,y,lipX,topY);
        this._line(lipX,topY,lipX+lenL,topY+sL*lenL);
        const ex=lipX+lenL,ey=topY+sL*lenL;
        for(let i=1;i<=10;i++){const t=i/10;this.pts.push({x:ex+ease*t,y:ey+sL*ease*(t-t*t/2)});}
        x=ex+ease;y=ey+sL*ease/2;
        // coin arc over the landing zone rewards a clean jump
        for(let j=0;j<6;j++){const dx=60+j*42;this.objs.push({t:'coin',x:lipX+dx,y:topY-40-dx*sR+dx*dx*.0024,col:false});}
        this._fuel(x0,lipX+lenL*.6,topY+sL*lenL*.6-40);
      }else if(x>500&&kind<.5){
        // ── Bump: convex crest that launches the car at speed
        const L=220+r()*200;
        const A=Math.min((32+r()*(40+50*diff))*(.6+e.rough*.5),cap*L/Math.PI*.95);
        const ny=Math.max(base-260,Math.min(base+220,y+(r()-.5-(y-base)/600)*50));
        const n=Math.ceil(L/14);
        for(let i=1;i<=n;i++){const t=i/n,sn=Math.sin(Math.PI*t);this.pts.push({x:x+L*t,y:y+(ny-y)*(t*t*(3-2*t))-A*sn*sn});}
        const mx=x+L*.5,my=(y+ny)/2-A;
        if(r()<.6){const c=3+Math.floor(r()*3);for(let j=0;j<c;j++){const cx=mx+(j-(c-1)/2)*26;this.objs.push({t:'coin',x:cx,y:this._ySafe(cx)-44,col:false});}}
        this._fuel(x0,mx,my-40);
        if(r()<.45){const dx=x+L*(.12+r()*.2);this.decs.push({fn:e.treeFn,x:dx,y:this._ySafe(dx)+2,s:14+r()*16});}
        x+=L;y=ny;
      }else{
        // ── Hill: smooth climb or descent
        const seg=SEG*(2+r()*2.4);
        let dy=e.hillAmp*(.4+r()*.9)*(.55+e.rough*.6)*diff;
        dy=Math.min(dy,seg*cap/1.5);
        const drift=(y-base)/220;                   // pull back toward the baseline
        const dir=r()<.5+drift*.35?-1:1;
        const ny=Math.max(base-260,Math.min(base+220,y+dir*dy));
        const n=10;
        for(let i=1;i<=n;i++){const t=i/n;this.pts.push({x:x+seg*t,y:y+(ny-y)*(t*t*(3-2*t))});}
        const mx=x+seg*.5,my=y+(ny-y)*.5;
        if(mx>400){
          if(r()<.55){const c=3+Math.floor(r()*4);for(let j=0;j<c;j++){const cx=mx+(j-(c-1)/2)*26;this.objs.push({t:'coin',x:cx,y:this._ySafe(cx)-42,col:false});}}
          else this._fuel(x0,mx,my-40);
          if(r()<.5){const dx=x+seg*(.15+r()*.7);this.decs.push({fn:e.treeFn,x:dx,y:this._ySafe(dx)+2,s:14+r()*16});}
        }
        x+=seg;y=ny;
      }
    }
    this.gx=x;
  }
  _line(xa,ya,xb,yb){const n=Math.max(1,Math.ceil((xb-xa)/14));for(let i=1;i<=n;i++){const t=i/n;this.pts.push({x:xa+(xb-xa)*t,y:ya+(yb-ya)*t});}}
  _fuel(segX,fx,fy){
    // Fuel cans arrive on a schedule that stretches with distance
    if(segX>400&&segX-(this.lastFuel||0)>3200+segX*.12){this.objs.push({t:'fuel',x:fx,y:fy,col:false});this.lastFuel=segX;}
  }
  _ySafe(wx){
    // Height lookup that never triggers generation (safe to call while generating)
    const p=this.pts;if(wx<=p[0].x)return p[0].y;if(wx>=p[p.length-1].x)return p[p.length-1].y;
    let lo=0,hi=p.length-1;while(hi-lo>1){const m=lo+hi>>1;p[m].x<=wx?lo=m:hi=m;}
    const d=p[hi].x-p[lo].x;return d<.001?p[lo].y:p[lo].y+(p[hi].y-p[lo].y)*(wx-p[lo].x)/d;
  }
  getY(wx){
    const p=this.pts;
    if(wx<=p[0].x)return p[0].y;
    if(wx>=p[p.length-1].x)this._gen(wx+W*4);
    let lo=0,hi=p.length-1;
    while(hi-lo>1){const m=lo+hi>>1;p[m].x<=wx?lo=m:hi=m;}
    const d=p[hi].x-p[lo].x;
    return d<.001?p[lo].y:p[lo].y+(p[hi].y-p[lo].y)*(wx-p[lo].x)/d;
  }
  getNorm(wx){const m=(this.getY(wx+3)-this.getY(wx-3))/6,l=Math.hypot(1,m);return{nx:m/l,ny:-1/l};}
  ensure(to){if(to>this.gx-W)this._gen(to+W*4);}
  firstVisible(cx){
    // Points only ever move left on screen, so scan forward from last frame's index
    let i=Math.min(this.si||0,this.pts.length-1);
    while(i>0&&this.pts[i].x-cx>-SEG*2)i--;
    while(i<this.pts.length-2&&this.pts[i+1].x-cx<=-SEG*2)i++;
    this.si=i;return Math.max(0,i-2);
  }
  prune(behind){
    // Keep memory flat on long runs: forget geometry/pickups well behind the car
    let n=0;while(n<this.pts.length-50&&this.pts[n].x<behind)n++;
    if(n>200){this.pts.splice(0,n);this.si=0;}
    if(this.objs.length>60)this.objs=this.objs.filter(o=>o.x>=behind);
    if(this.decs.length>60)this.decs=this.decs.filter(d=>d.x>=behind);
  }
}

// ── vehicle physics ───────────────────────────────────────
class Car{
  constructor(vd,upg,env,sx,sy){
    this.vd=vd;this.env=env;
    const eM=1+upg.engine*.18,sM=1+upg.susp*.12,tM=1+upg.tires*.1,fM=1+upg.fuel*.22;
    this.engP=vd.eng*eM;
    this.mu=Math.min(1.4,env.friction*1.05*tM);
    this.fuelMax=vd.fuelMax*fM;this.fuel=this.fuelMax;
    this.has4wd=upg.fwd>0;
    this.turboL=upg.turbo;this.turboQ=0;
    this.wr=vd.wr;this.axF=vd.axF;this.axR=vd.axR;
    // Mass properties
    this.IK=1.8;                                  // heavier pitch inertia: cars hold attitude off ramps
    this.M=10*vd.mass;this.mw=1.1*vd.mass;this.Iw=.6*this.mw*this.wr*this.wr;
    const bw=vd.cw*1.1,bh=vd.ch*2.6;this.I=this.M*(bw*bw+bh*bh)/12*this.IK;
    // Suspension (loaded height = wr+10 below the body centre)
    this.ks=.028*this.M*sM*vd.susp;
    this.cs=2*.55*Math.sqrt(this.ks*this.M*.5);
    const sag=(this.M*.5*env.gravity)/this.ks;
    this.srest=this.wr+10+sag;this.smin=this.wr*.55;this.smax=this.srest+10;
    this.kt=.9*this.M;this.ct=.35*this.M;
    // Chassis
    // (bx,by) is the centre of mass, which sits comY below the drawn body centre
    this.comY=vd.comY||0;
    this.bx=sx;this.by=sy+this.comY;this.bvx=0;this.bvy=0;this.bang=0;this.bw=0;
    // Wheels
    this.fx=sx+this.axF;this.fy=sy+this.wr+10;this.fvx=0;this.fvy=0;this.fang=0;this.fom=0;this.fG=false;
    this.rx=sx+this.axR;this.ry=sy+this.wr+10;this.rvx=0;this.rvy=0;this.rang=0;this.rom=0;this.rG=false;
    this.dist=0;this.sx=sx;
    this.crashed=false;this.rsn='';this.noFuel=false;this.dead=false;this.flipT=0;this.et=0;this.airT=0;
    // Chassis collision probes (body-local). Head probe ends the run like the original.
    const hw=vd.cw/2,h=vd.ch;
    const cy0=this.comY;
    this.probes=[{x:-hw*1.1,y:h*.7-cy0},{x:hw*1.15,y:h*.7-cy0},{x:-hw*1.05,y:-h*.4-cy0},{x:hw*1.1,y:-h*.3-cy0}];
    this.head=vd.id==='bike'?{x:2,y:-50}:vd.id==='monster'?{x:-hw*.2,y:-h*2.05}:vd.id==='pickup'?{x:0,y:-h*2.15}:{x:-hw*.3,y:-h*2.3};
    this.head.y-=cy0;
  }
  step(terrain,gas,brake){
    if(this.dead)return;
    this.et++;
    if(this.fuel>0)this.fuel=Math.max(0,this.fuel-(gas?.03:.008));
    if(this.fuel<=0)this.noFuel=true;
    if(this.turboL>0){this.turboQ=gas&&this.fuel>0?Math.min(1,this.turboQ+.003*this.turboL):this.turboQ*.975;}
    const boost=this.turboQ>.7?1+this.turboL*.15:1;
    const ok=this.fuel>0;
    const N=8,h=1/N,g=this.env.gravity;
    const maxOm=(7.2+this.engP*6)*boost/this.wr;
    const T=this.engP*this.vd.mass*this.wr*6.4*boost;
    this.fG=this.rG=false;
    for(let k=0;k<N;k++){
      // Gravity
      this.bvy+=g*h;this.fvy+=g*h;this.rvy+=g*h;
      // Suspension
      this._susp('f',h);this._susp('r',h);
      // Drive / brake torque (reaction goes into the chassis -> wheelies)
      let tr=0,tf=0;
      if(ok&&gas){
        const fr=Math.max(0,1-this.rom/maxOm);tr=T*fr*(this.has4wd?.6:1);
        if(this.has4wd){tf=T*.4*Math.max(0,1-this.fom/maxOm);}
      }else if(brake){
        const rmax=-maxOm*.32;
        if(this.rom>.03){tr=-T*1.5;tf=-T*1.1;}            // braking
        else tr=this.rom>rmax?-T*.7:T*.5*Math.min(1,(rmax-this.rom)/.05); // gentle reverse, capped
      }else{this.rom*=.9994;this.fom*=.9994;}              // coasting slowdown
      this.rom+=tr/this.Iw*h;this.fom+=tf/this.Iw*h;
      // Engine reaction tilts the chassis only while a wheel is on the ground; in the
      // air the rotation comes from player input alone so flips stay predictable.
      const inAir=!this._gf&&!this._gr;
      if(!inAir)this.bw-=(tr+tf)*this.vd.pitchK/this.I*h;
      // Air control (gas tilts back, brake tilts forward)
      if(inAir){const ac=.0042*this.vd.airK*h;if(gas&&ok)this.bw-=ac;if(brake)this.bw+=ac;}
      // Ground contacts
      this._gf=this._contact(terrain,'f',h);this._gr=this._contact(terrain,'r',h);
      if(this._gf)this.fG=true;if(this._gr)this.rG=true;
      this._bodyContacts(terrain);
      if(this.crashed)return;
      // Rolling resistance / drag
      this.rom*=.9998;this.fom*=.9998;this.bw*=inAir?.9996:.9985;
      if(this.bx<this.sx-140&&this.bvx<0){this.bvx*=.5;this.rvx*=.5;this.fvx*=.5;this.rom*=.5;this.fom*=.5;}
      this.bvx*=.99985;this.bvy*=.99985;
      // Integrate
      this.bx+=this.bvx*h;this.by+=this.bvy*h;this.bang+=this.bw*h;
      this.fx+=this.fvx*h;this.fy+=this.fvy*h;this.fang+=this.fom*h;
      this.rx+=this.rvx*h;this.ry+=this.rvy*h;this.rang+=this.rom*h;
    }
    this.dist=Math.max(0,(this.bx-this.sx)/10);
    // Flip: resting upside down
    const na=Math.atan2(Math.sin(this.bang),Math.cos(this.bang));
    if(Math.abs(na)>Math.PI*.62&&!this.fG&&!this.rG&&Math.hypot(this.bvx,this.bvy)<1.2){if(++this.flipT>70){this.crashed=true;this.rsn='FLIPPED!';}}
    else if(Math.abs(na)>Math.PI*.62&&(this.fG||this.rG)&&Math.hypot(this.bvx,this.bvy)<.6){if(++this.flipT>70){this.crashed=true;this.rsn='FLIPPED!';}}
    else this.flipT=Math.max(0,this.flipT-2);
  }
  vx(){return this.bx+this.comY*Math.sin(this.bang);}
  vy(){return this.by-this.comY*Math.cos(this.bang);}
  _w(sw){return sw==='f'?{x:this.fx,y:this.fy,vx:this.fvx,vy:this.fvy,ax:this.axF}:{x:this.rx,y:this.ry,vx:this.rvx,vy:this.rvy,ax:this.axR};}
  _setV(sw,vx,vy){if(sw==='f'){this.fvx=vx;this.fvy=vy;}else{this.rvx=vx;this.rvy=vy;}}
  _susp(sw,h){
    const w=this._w(sw),c=Math.cos(this.bang),s=Math.sin(this.bang);
    const ux=c,uy=s,nx=-s,ny=c;                     // body x axis, body "down" axis
    const rAx=w.ax*ux-this.comY*nx,rAy=w.ax*uy-this.comY*ny;   // anchor relative to centre of mass
    const dx=w.x-(this.bx+rAx),dy=w.y-(this.by+rAy);
    const sExt=dx*nx+dy*ny,tOff=dx*ux+dy*uy;
    const vAx=this.bvx-this.bw*rAy,vAy=this.bvy+this.bw*rAx;
    const rvx=w.vx-vAx,rvy=w.vy-vAy;
    const vn=rvx*nx+rvy*ny,vt=rvx*ux+rvy*uy;
    let fs=-(this.ks*(sExt-this.srest)+this.cs*vn);
    if(sExt<this.smin)fs+=this.ks*14*(this.smin-sExt)-this.cs*2*Math.min(0,vn);
    if(sExt>this.smax)fs-=this.ks*14*(sExt-this.smax)+this.cs*2*Math.max(0,vn);
    const ft=-(this.kt*tOff+this.ct*vt);
    const Fx=fs*nx+ft*ux,Fy=fs*ny+ft*uy;
    this._setV(sw,w.vx+Fx/this.mw*h,w.vy+Fy/this.mw*h);
    this.bvx-=Fx/this.M*h;this.bvy-=Fy/this.M*h;
    this.bw+=(rAx*(-Fy)-rAy*(-Fx))/this.I*h;
  }
  _contact(terrain,sw,h){
    const w=this._w(sw),r=this.wr;
    const ty=terrain.getY(w.x),nm=terrain.getNorm(w.x);
    const dist=(ty-w.y)*(-nm.ny);
    const pen=r-dist;
    if(pen<=0)return false;
    // Push out
    if(sw==='f'){this.fx+=nm.nx*pen;this.fy+=nm.ny*pen;}else{this.rx+=nm.nx*pen;this.ry+=nm.ny*pen;}
    let vx=w.vx,vy=w.vy;
    const vn=vx*nm.nx+vy*nm.ny;
    let jn=0;
    if(vn<0){jn=-vn*1.05*this.mw;vx-=vn*1.05*nm.nx;vy-=vn*1.05*nm.ny;}
    jn=Math.max(jn,this.mw*this.env.gravity*h*.5);
    // Traction: tangent points "forward" along the slope
    const tx=-nm.ny,ty2=nm.nx;
    const om=sw==='f'?this.fom:this.rom;
    const slip=(vx*tx+vy*ty2)-om*r;
    const meff=1/(1/this.mw+r*r/this.Iw);
    let jt=-slip*meff;
    const lim=this.mu*jn*2.2;
    if(jt>lim)jt=lim;else if(jt<-lim)jt=-lim;
    vx+=jt/this.mw*tx;vy+=jt/this.mw*ty2;
    if(sw==='f')this.fom-=jt*r/this.Iw;else this.rom-=jt*r/this.Iw;
    this._setV(sw,vx,vy);
    return true;
  }
  _bodyContacts(terrain){
    const c=Math.cos(this.bang),s=Math.sin(this.bang);
    // Head hitting the ground ends the run
    const hx=this.bx+this.head.x*c-this.head.y*s,hy=this.by+this.head.x*s+this.head.y*c;
    if(hy>terrain.getY(hx)-2){this.crashed=true;this.rsn='DRIVER DOWN!';return;}
    for(const p of this.probes){
      const rx=p.x*c-p.y*s,ry=p.x*s+p.y*c;
      const px=this.bx+rx,py=this.by+ry;
      const ty=terrain.getY(px);
      if(py<=ty)continue;
      const nm=terrain.getNorm(px),pen=(py-ty)*(-nm.ny);
      this.bx+=nm.nx*pen*.9;this.by+=nm.ny*pen*.9;
      const vpx=this.bvx-this.bw*ry,vpy=this.bvy+this.bw*rx;
      const vn=vpx*nm.nx+vpy*nm.ny;
      if(vn>=0)continue;
      const rn=rx*nm.ny-ry*nm.nx;
      const j=-(1.1*vn)/(1/this.M+rn*rn/this.I);
      this.bvx+=j*nm.nx/this.M;this.bvy+=j*nm.ny/this.M;this.bw+=rn*j/this.I;
      // scrape friction
      const tx=-nm.ny,ty2=nm.nx,vt=vpx*tx+vpy*ty2;
      const rt=rx*ty2-ry*tx;
      let jt=-vt/(1/this.M+rt*rt/this.I);const lim=.5*j;jt=Math.max(-lim,Math.min(lim,jt));
      this.bvx+=jt*tx/this.M;this.bvy+=jt*ty2/this.M;this.bw+=rt*jt/this.I;
    }
  }
}

// ── drawing helpers ───────────────────────────────────────
function drawWheel(c,x,y,r,ang,vd){
  // Ground shadow
  c.save();c.globalAlpha=.22;c.fillStyle='#000';
  c.beginPath();c.ellipse(x+3,y+r*.8,r*.88,r*.24,0,0,Math.PI*2);c.fill();c.restore();
  // Thick black tyre
  c.fillStyle=vd.tyr;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
  // Tread notches around the outer edge
  c.save();c.translate(x,y);c.rotate(ang);
  c.strokeStyle='rgba(255,255,255,.11)';c.lineWidth=r*.15;c.lineCap='butt';
  for(let i=0;i<14;i++){
    const a=i*Math.PI*2/14;
    c.beginPath();
    c.moveTo(Math.cos(a)*r*.84,Math.sin(a)*r*.84);
    c.lineTo(Math.cos(a)*r*.99,Math.sin(a)*r*.99);
    c.stroke();
  }
  c.restore();
  // Sidewall sheen
  c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=r*.1;
  c.beginPath();c.arc(x,y,r*.7,0,Math.PI*2);c.stroke();
  // Small bright rim
  const rr=r*.44;
  const rg=c.createRadialGradient(x-rr*.32,y-rr*.36,0,x,y,rr);
  rg.addColorStop(0,'#fff');rg.addColorStop(.55,vd.rim);rg.addColorStop(1,'#7d7d7d');
  c.fillStyle=rg;c.beginPath();c.arc(x,y,rr,0,Math.PI*2);c.fill();
  // Spoke cut-outs
  c.save();c.translate(x,y);c.rotate(ang);
  c.fillStyle='rgba(0,0,0,.28)';
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5;
    c.beginPath();c.ellipse(Math.cos(a)*rr*.58,Math.sin(a)*rr*.58,rr*.27,rr*.15,a,0,Math.PI*2);c.fill();
  }
  c.restore();
  // Hub
  c.fillStyle=vd.hub;c.beginPath();c.arc(x,y,rr*.3,0,Math.PI*2);c.fill();
  // Rim + tyre outlines
  c.strokeStyle='rgba(0,0,0,.38)';c.lineWidth=r*.055;
  c.beginPath();c.arc(x,y,rr,0,Math.PI*2);c.stroke();
  c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=r*.06;
  c.beginPath();c.arc(x,y,r*.97,0,Math.PI*2);c.stroke();
}

function drawSusp(c,bx,by,bang,off,wx,wy){
  const bd=10;
  const ax=bx+off*Math.cos(bang)-bd*Math.sin(bang),ay=by+off*Math.sin(bang)+bd*Math.cos(bang);
  c.strokeStyle='rgba(70,70,70,.8)';c.lineWidth=3.5;c.lineCap='round';
  c.beginPath();c.moveTo(ax,ay);c.lineTo(wx,wy);c.stroke();
  // Coil
  const dx=wx-ax,dy=wy-ay,len=Math.hypot(dx,dy)||1;
  const nx=dx/len,ny=dy/len,px=-ny,py=nx,n=4,amp=3.5;
  c.strokeStyle='rgba(100,100,100,.5)';c.lineWidth=1.2;c.beginPath();c.moveTo(ax,ay);
  for(let i=1;i<=n*2;i++){const t=i/(n*2),sgn=i%2?1:-1;c.lineTo(ax+dx*t+px*amp*sgn,ay+dy*t+py*amp*sgn);}
  c.lineTo(wx,wy);c.stroke();
}

function drawBody(c,vd,bang,ox,oy){
  c.save();c.translate(ox,oy);c.rotate(bang);
  const w=vd.cw,h=vd.ch,hw=w/2;
  if(vd.id==='bike'){_bike(c,vd,hw,h);}
  else if(vd.id==='monster'){_monster(c,vd,hw,h);}
  else if(vd.id==='pickup'){_pickup(c,vd,hw,h);}
  else{_jeep(c,vd,hw,h);}
  c.restore();
}

function _jeep(c,vd,hw,h){
  // hw=47.5 h=28. Wheels r=25 at x=+-46, y=+35 -> body overlaps their tops.
  const L=-hw*1.2, R=hw*1.22, bot=h*.8, belt=-h*.55, roof=-h*2.2;
  const hull=()=>{
    c.beginPath();
    c.moveTo(L,belt+h*.1);
    c.lineTo(hw*.2,belt);                         // waist line under cabin
    c.quadraticCurveTo(hw*.75,belt-h*.02,R-h*.1,belt+h*.3);   // rounded bonnet
    c.quadraticCurveTo(R+h*.08,belt+h*.5,R,bot-h*.35);         // nose
    c.quadraticCurveTo(R,bot,R-h*.4,bot);
    c.lineTo(L+h*.4,bot);
    c.quadraticCurveTo(L,bot,L,bot-h*.4);
    c.closePath();
  };
  const cabin=()=>{
    c.beginPath();
    c.moveTo(L+h*.15,belt+h*.12);
    c.lineTo(hw*.36,belt+h*.02);
    c.quadraticCurveTo(hw*.22,roof+h*.2,hw*.08,roof);
    c.lineTo(L+h*.5,roof);
    c.quadraticCurveTo(L+h*.12,roof,L+h*.12,roof+h*.4);
    c.closePath();
  };
  // Cabin
  const cg=c.createLinearGradient(0,roof,0,belt);
  cg.addColorStop(0,'#ffab35');cg.addColorStop(1,'#e07410');
  c.fillStyle=cg;cabin();c.fill();
  // Windows
  c.fillStyle='#8fd3ff';
  c.beginPath();                                  // windscreen
  c.moveTo(-hw*.02,belt-h*.12);c.lineTo(hw*.24,belt-h*.14);
  c.quadraticCurveTo(hw*.14,roof+h*.5,hw*.04,roof+h*.26);
  c.lineTo(-hw*.02,roof+h*.26);c.closePath();c.fill();
  c.beginPath();                                  // side window
  c.moveTo(L+h*.45,belt-h*.1);c.lineTo(-hw*.16,belt-h*.12);
  c.lineTo(-hw*.16,roof+h*.26);c.lineTo(L+h*.7,roof+h*.26);
  c.quadraticCurveTo(L+h*.45,roof+h*.3,L+h*.45,roof+h*.6);
  c.closePath();c.fill();
  _driver(c,-hw*.46,belt-h*.62,h*.3);
  c.fillStyle='rgba(255,255,255,.55)';            // glare
  c.beginPath();c.moveTo(-hw*.6,belt-h*.12);c.lineTo(-hw*.48,belt-h*.12);
  c.lineTo(-hw*.3,roof+h*.26);c.lineTo(-hw*.42,roof+h*.26);c.closePath();c.fill();
  // Hull
  const bg=c.createLinearGradient(0,belt,0,bot);
  bg.addColorStop(0,'#ffb13d');bg.addColorStop(.5,'#f27d12');bg.addColorStop(1,'#b95205');
  c.fillStyle=bg;hull();c.fill();
  // Shine along the top of the hull
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2.5;c.lineCap='round';
  c.beginPath();c.moveTo(L+h*.4,belt+h*.3);c.lineTo(hw*.2,belt+h*.2);
  c.quadraticCurveTo(hw*.7,belt+h*.2,R-h*.35,belt+h*.5);c.stroke();
  // Wheel arches (dark lips the tyres tuck under)
  c.fillStyle='#6b2f02';
  for(const ax of [vd.axR,vd.axF]){
    c.beginPath();c.arc(ax,bot+h*.02,vd.wr*1.12,Math.PI*1.08,Math.PI*1.92);
    c.arc(ax,bot+h*.02,vd.wr*.98,Math.PI*1.92,Math.PI*1.08,true);c.closePath();c.fill();
  }
  // Bumpers
  c.fillStyle='#3a3a3a';
  c.beginPath();c.roundRect(R-h*.25,bot-h*.42,h*.42,h*.3,3);c.fill();
  c.beginPath();c.roundRect(L-h*.15,bot-h*.42,h*.4,h*.3,3);c.fill();
  // Headlight + glow
  c.fillStyle='#fff6c0';
  c.beginPath();c.ellipse(R-h*.12,belt+h*.62,h*.13,h*.18,0,0,Math.PI*2);c.fill();
  const hgl=c.createRadialGradient(R,belt+h*.62,0,R,belt+h*.62,24);
  hgl.addColorStop(0,'rgba(255,245,150,.45)');hgl.addColorStop(1,'transparent');
  c.fillStyle=hgl;c.beginPath();c.arc(R,belt+h*.62,24,0,Math.PI*2);c.fill();
  // Tail light
  c.fillStyle='#e02424';c.beginPath();c.roundRect(L-1,belt+h*.4,h*.2,h*.36,2);c.fill();
  // Door seam + handle
  c.strokeStyle='rgba(110,45,0,.55)';c.lineWidth=1.6;
  c.beginPath();c.moveTo(-hw*.16,belt);c.lineTo(-hw*.16,bot-h*.25);c.stroke();
  c.fillStyle='rgba(90,35,0,.6)';c.beginPath();c.roundRect(-hw*.42,belt+h*.28,h*.34,h*.1,2);c.fill();
  // Outlines
  c.strokeStyle='#5a2400';c.lineWidth=2.4;c.lineJoin='round';
  cabin();c.stroke();hull();c.stroke();
}
function _driver(c,x,y,r){
  // Head with cap, seen through the side window
  c.fillStyle='#f2c29a';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
  c.fillStyle='#6b3b1c';c.beginPath();c.arc(x-r*.25,y-r*.1,r*.95,Math.PI*.95,Math.PI*1.55);c.lineTo(x-r*.2,y-r*.3);c.fill();
  c.fillStyle='#d82626';c.beginPath();c.arc(x,y-r*.25,r*1.02,Math.PI*1.05,Math.PI*1.98);c.closePath();c.fill();
  c.fillStyle='#b01818';c.beginPath();c.ellipse(x+r*.95,y-r*.32,r*.6,r*.18,0,0,Math.PI*2);c.fill();
  c.fillStyle='#222';c.beginPath();c.arc(x+r*.45,y+r*.05,r*.13,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(90,40,10,.6)';c.lineWidth=1.2;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke();
}
function _hcrHull(c,L,R,belt,bot,h){
  c.beginPath();
  c.moveTo(L,belt+h*.1);
  c.lineTo((L+R)*.5+(R-L)*.1,belt);
  c.quadraticCurveTo(R-(R-L)*.14,belt-h*.02,R-h*.1,belt+h*.3);
  c.quadraticCurveTo(R+h*.08,belt+h*.5,R,bot-h*.35);
  c.quadraticCurveTo(R,bot,R-h*.4,bot);
  c.lineTo(L+h*.4,bot);
  c.quadraticCurveTo(L,bot,L,bot-h*.4);
  c.closePath();
}
function _arches(c,vd,bot,h,col){
  c.fillStyle=col;
  for(const ax of [vd.axR,vd.axF]){
    c.beginPath();c.arc(ax,bot+h*.02,vd.wr*1.12,Math.PI*1.08,Math.PI*1.92);
    c.arc(ax,bot+h*.02,vd.wr*.98,Math.PI*1.92,Math.PI*1.08,true);c.closePath();c.fill();
  }
}
function _lamp(c,x,y,r,glow){
  c.fillStyle='#fff6c0';c.beginPath();c.ellipse(x,y,r*.75,r,0,0,Math.PI*2);c.fill();
  const g=c.createRadialGradient(x,y,0,x,y,glow);
  g.addColorStop(0,'rgba(255,245,150,.45)');g.addColorStop(1,'rgba(255,245,150,0)');
  c.fillStyle=g;c.beginPath();c.arc(x,y,glow,0,Math.PI*2);c.fill();
}
function _pickup(c,vd,hw,h){
  // hw=52.5 h=30; wheels r=27 at x=-46/+50, y=+37
  const L=-hw*1.18,R=hw*1.2,bot=h*.78,belt=-h*.45,roof=-h*2.05;
  const cabL=-hw*.3,cabR=hw*.42;
  const cabin=()=>{c.beginPath();c.moveTo(cabL,belt+h*.1);c.lineTo(cabR,belt+h*.02);
    c.quadraticCurveTo(cabR-h*.3,roof+h*.2,cabR-h*.55,roof);c.lineTo(cabL+h*.3,roof);
    c.quadraticCurveTo(cabL,roof,cabL,roof+h*.35);c.closePath();};
  const cg=c.createLinearGradient(0,roof,0,belt);cg.addColorStop(0,'#4a9bff');cg.addColorStop(1,'#1c5fd0');
  c.fillStyle=cg;cabin();c.fill();
  // windows + driver
  c.fillStyle='#8fd3ff';
  c.beginPath();c.moveTo(cabL+h*.28,belt-h*.08);c.lineTo(cabR-h*.45,belt-h*.1);
  c.lineTo(cabR-h*.72,roof+h*.28);c.lineTo(cabL+h*.4,roof+h*.28);c.closePath();c.fill();
  _driver(c,cabL+h*.95,belt-h*.62,h*.3);
  c.fillStyle='rgba(255,255,255,.45)';
  c.beginPath();c.moveTo(cabR-h*.95,belt-h*.1);c.lineTo(cabR-h*.75,belt-h*.1);c.lineTo(cabR-h*.95,roof+h*.28);c.lineTo(cabR-h*1.15,roof+h*.28);c.closePath();c.fill();
  // hull
  const bg=c.createLinearGradient(0,belt,0,bot);
  bg.addColorStop(0,'#58a6ff');bg.addColorStop(.5,'#1f66d6');bg.addColorStop(1,'#0c3a8c');
  c.fillStyle=bg;_hcrHull(c,L,R,belt,bot,h);c.fill();
  // open bed: raised side wall with dark inside
  c.fillStyle='#0f3f96';c.beginPath();c.roundRect(L,belt-h*.42,cabL-L-2,h*.52,[4,2,0,0]);c.fill();
  c.fillStyle='#062a66';c.beginPath();c.roundRect(L+3,belt-h*.36,cabL-L-8,h*.2,2);c.fill();
  c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=2.5;c.lineCap='round';
  c.beginPath();c.moveTo(cabR,belt+h*.22);c.quadraticCurveTo(R-h*.9,belt+h*.2,R-h*.35,belt+h*.5);c.stroke();
  _arches(c,vd,bot,h,'#0a2a66');
  c.fillStyle='#d8d8d8';c.beginPath();c.roundRect(R-h*.25,bot-h*.42,h*.42,h*.3,3);c.fill();
  c.fillStyle='#3a3a3a';c.beginPath();c.roundRect(L-h*.15,bot-h*.42,h*.4,h*.3,3);c.fill();
  _lamp(c,R-h*.12,belt+h*.62,h*.17,24);
  c.fillStyle='#e02424';c.beginPath();c.roundRect(L-1,belt-h*.2,h*.2,h*.4,2);c.fill();
  c.strokeStyle='rgba(0,20,60,.5)';c.lineWidth=1.6;
  c.beginPath();c.moveTo(hw*.08,belt+h*.08);c.lineTo(hw*.08,bot-h*.25);c.stroke();
  c.strokeStyle='#082660';c.lineWidth=2.4;c.lineJoin='round';
  cabin();c.stroke();_hcrHull(c,L,R,belt,bot,h);c.stroke();
  c.beginPath();c.roundRect(L,belt-h*.42,cabL-L-2,h*.52,[4,2,0,0]);c.stroke();
}
function _monster(c,vd,hw,h){
  // hw=54 h=32; wheels r=38 at x=-52/+56, y=+48 -> lifted body with visible frame
  const L=-hw*1.12,R=hw*1.14,bot=h*.5,belt=-h*.55,roof=-h*1.95;
  // frame rails + shocks visible under the lifted body
  c.strokeStyle='#2a2a2a';c.lineWidth=h*.24;c.lineCap='round';
  c.beginPath();c.moveTo(vd.axR,bot+h*.2);c.lineTo(vd.axF,bot+h*.2);c.stroke();
  c.strokeStyle='#ffb300';c.lineWidth=h*.14;
  for(const ax of [vd.axR,vd.axF]){c.beginPath();c.moveTo(ax*.72,bot-h*.1);c.lineTo(ax*.95,bot+h*.95);c.stroke();}
  const cabin=()=>{c.beginPath();c.moveTo(-hw*.7,belt+h*.1);c.lineTo(hw*.35,belt+h*.02);
    c.quadraticCurveTo(hw*.22,roof+h*.2,hw*.08,roof);c.lineTo(-hw*.5,roof);
    c.quadraticCurveTo(-hw*.7,roof,-hw*.7,roof+h*.35);c.closePath();};
  const cg=c.createLinearGradient(0,roof,0,belt);cg.addColorStop(0,'#b65cff');cg.addColorStop(1,'#7a1fc4');
  c.fillStyle=cg;cabin();c.fill();
  c.fillStyle='#c9a8ff';
  c.beginPath();c.moveTo(-hw*.58,belt-h*.06);c.lineTo(hw*.22,belt-h*.08);
  c.lineTo(hw*.04,roof+h*.26);c.lineTo(-hw*.46,roof+h*.26);c.closePath();c.fill();
  _driver(c,-hw*.2,belt-h*.55,h*.28);
  c.fillStyle='rgba(255,255,255,.4)';
  c.beginPath();c.moveTo(hw*.02,belt-h*.08);c.lineTo(hw*.12,belt-h*.08);c.lineTo(-hw*.02,roof+h*.26);c.lineTo(-hw*.12,roof+h*.26);c.closePath();c.fill();
  // roof light bar
  c.fillStyle='#333';c.beginPath();c.roundRect(-hw*.46,roof-h*.2,hw*.5,h*.18,3);c.fill();
  c.fillStyle='#fff3a0';for(let i=0;i<3;i++){c.beginPath();c.arc(-hw*.38+i*hw*.17,roof-h*.11,h*.07,0,Math.PI*2);c.fill();}
  // hull
  const bg=c.createLinearGradient(0,belt,0,bot);
  bg.addColorStop(0,'#c065ff');bg.addColorStop(.5,'#8a2be2');bg.addColorStop(1,'#4b0f86');
  c.fillStyle=bg;_hcrHull(c,L,R,belt,bot,h);c.fill();
  // flame decal
  c.fillStyle='#ff9d00';
  c.beginPath();c.moveTo(-hw*.2,bot-h*.2);
  const fl=[[-.05,-.55],[.08,-.3],[.22,-.62],[.34,-.3],[.52,-.58],[.62,-.25],[.85,-.4],[.8,-.08]];
  for(const [fx,fy] of fl)c.lineTo(hw*fx,bot+h*fy);c.lineTo(-hw*.2,bot-h*.05);c.closePath();c.fill();
  c.fillStyle='#ffe14d';
  c.beginPath();c.moveTo(-hw*.05,bot-h*.14);c.lineTo(hw*.12,bot-h*.36);c.lineTo(hw*.26,bot-h*.2);c.lineTo(hw*.45,bot-h*.38);c.lineTo(hw*.62,bot-h*.14);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=2.5;c.lineCap='round';
  c.beginPath();c.moveTo(-hw*.9,belt+h*.3);c.lineTo(hw*.2,belt+h*.2);c.quadraticCurveTo(hw*.7,belt+h*.2,R-h*.35,belt+h*.5);c.stroke();
  // exhaust stacks
  c.fillStyle='#9a9a9a';c.strokeStyle='#444';c.lineWidth=1.5;
  for(const ex of [-hw*.95,-hw*.82]){c.beginPath();c.roundRect(ex,belt-h*.75,h*.16,h*.8,2);c.fill();c.stroke();}
  _lamp(c,R-h*.12,belt+h*.55,h*.16,26);
  c.fillStyle='#e02424';c.beginPath();c.roundRect(L-1,belt+h*.35,h*.2,h*.34,2);c.fill();
  c.strokeStyle='#2e0659';c.lineWidth=2.4;c.lineJoin='round';
  cabin();c.stroke();_hcrHull(c,L,R,belt,bot,h);c.stroke();
}
function _bikeLinks(c,bx,by,bang,fx,fy,rx,ry){
  // Fork (front) and swing-arm (rear) follow the real wheel positions
  const co=Math.cos(bang),si=Math.sin(bang);
  const tw=(x,y)=>[bx+x*co-y*si,by+x*si+y*co];
  const [hx,hy]=tw(18,-12),[px,py]=tw(-6,6);
  c.lineCap='round';
  c.strokeStyle='#cfcfcf';c.lineWidth=5;c.beginPath();c.moveTo(hx,hy);c.lineTo(fx,fy);c.stroke();
  c.strokeStyle='#ffcc00';c.lineWidth=3;c.beginPath();c.moveTo(hx,hy);c.lineTo(hx+(fx-hx)*.45,hy+(fy-hy)*.45);c.stroke();
  c.strokeStyle='#333';c.lineWidth=5;c.beginPath();c.moveTo(px,py);c.lineTo(rx,ry);c.stroke();
}
function _bike(c,vd,hw,h){
  // hw=30 h=18; wheels r=22 at x=-28/+30, y=+32. Motocross bike with rider.
  // engine block
  const eg=c.createLinearGradient(0,-4,0,12);eg.addColorStop(0,'#666');eg.addColorStop(1,'#2d2d2d');
  c.fillStyle=eg;c.beginPath();c.roundRect(-8,-4,20,16,4);c.fill();
  c.strokeStyle='#999';c.lineWidth=3;c.lineCap='round';
  c.beginPath();c.moveTo(4,10);c.quadraticCurveTo(-14,18,-30,-2);c.stroke();          // exhaust pipe
  c.fillStyle='#777';c.beginPath();c.roundRect(-36,-7,12,7,3);c.fill();               // silencer
  // rear fender / seat
  c.fillStyle='#d32f2f';
  c.beginPath();c.moveTo(-6,-8);c.lineTo(-38,-14);c.lineTo(-36,-8);c.lineTo(-8,-1);c.closePath();c.fill();

  _lamp(c,22,-15,3.2,16);
  // handlebar

  c.strokeStyle='#1d3f8f';c.lineWidth=7;                    // leg
  c.beginPath();c.moveTo(-12,-16);c.lineTo(4,-8);c.lineTo(0,6);c.stroke();
  c.fillStyle='#222';c.beginPath();c.roundRect(-3,4,9,5,2);c.fill();   // boot
  c.strokeStyle='#e53935';c.lineWidth=10;                   // torso
  c.beginPath();c.moveTo(-12,-17);c.lineTo(-2,-36);c.stroke();
  c.strokeStyle='#c62828';c.lineWidth=5;                    // arm
  c.beginPath();c.moveTo(-3,-33);c.lineTo(6,-24);c.lineTo(10,-25);c.stroke();
  // helmet
  const hx=2,hy=-45;
  c.fillStyle='#ffd600';c.beginPath();c.arc(hx,hy,8.5,0,Math.PI*2);c.fill();

  c.fillStyle='#263238';c.beginPath();c.roundRect(hx+2,hy-3,7,6,2);c.fill();          // visor

  c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=1.3;c.beginPath();c.arc(hx,hy,8.5,0,Math.PI*2);c.stroke();

// Decorations
function treeGreen(c,x,y,s){
  s*=1.5;
  c.fillStyle='#6d4424';c.beginPath();c.moveTo(x-s*.09,y+2);c.lineTo(x-s*.06,y-s*.6);c.lineTo(x+s*.06,y-s*.6);c.lineTo(x+s*.09,y+2);c.closePath();c.fill();
  const blobs=[[0,-.95,.42],[-.28,-.72,.3],[.28,-.7,.32],[.02,-1.25,.28]];
  c.fillStyle='#2e7d32';c.beginPath();for(const [dx,dy,r] of blobs){c.moveTo(x+dx*s+r*s,y+dy*s);c.arc(x+dx*s,y+dy*s,r*s,0,Math.PI*2);}c.fill();
  c.fillStyle='#43a047';c.beginPath();for(const [dx,dy,r] of blobs){c.moveTo(x+dx*s-r*s*.1+r*s*.7,y+dy*s-r*s*.15);c.arc(x+dx*s-r*s*.1,y+dy*s-r*s*.15,r*s*.7,0,Math.PI*2);}c.fill();
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.arc(x-s*.1,y-s*1.3,s*.1,0,Math.PI*2);c.fill();
}
function treePine(c,x,y,s){
  c.fillStyle='#37474F';c.beginPath();c.moveTo(x,y-s);c.lineTo(x-s*.5,y);c.lineTo(x+s*.5,y);c.fill();
  c.beginPath();c.moveTo(x,y-s*1.4);c.lineTo(x-s*.35,y-s*.5);c.lineTo(x+s*.35,y-s*.5);c.fill();
  c.fillStyle='#263238';c.beginPath();c.moveTo(x,y-s*1.76);c.lineTo(x-s*.2,y-s);c.lineTo(x+s*.2,y-s);c.fill();
}
function treeSnow(c,x,y,s){treePine(c,x,y,s);c.fillStyle='rgba(240,248,255,.85)';c.beginPath();c.moveTo(x,y-s*1.8);c.lineTo(x-s*.15,y-s*1.1);c.lineTo(x+s*.15,y-s*1.1);c.fill();c.beginPath();c.moveTo(x,y-s*1.1);c.lineTo(x-s*.28,y-s*.6);c.lineTo(x+s*.28,y-s*.6);c.fill();}
function cactus(c,x,y,s){c.fillStyle='#4caf50';c.fillRect(x-s*.14,y-s,s*.28,s);c.fillRect(x-s*.5,y-s*.65,s*.38,s*.12);c.fillRect(x+s*.12,y-s*.52,s*.38,s*.12);c.fillRect(x-s*.5,y-s*.65,s*.12,s*.26);c.fillRect(x+s*.38,y-s*.52,s*.12,s*.22);}
function crater(c,x,y,s){c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(x,y,s*.7,s*.24,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(80,80,80,.5)';c.lineWidth=1.5;c.beginPath();c.ellipse(x,y,s*.7,s*.24,0,0,Math.PI*2);c.stroke();}
function rock(c,x,y,s,env){
  c.fillStyle=env.id==='arctic'?'#b0bec5':env.id==='moon'?'#555':'#78909c';
  c.beginPath();c.moveTo(x-s*.5,y);c.lineTo(x-s*.6,y-s*.4);c.lineTo(x-s*.1,y-s*.7);c.lineTo(x+s*.3,y-s*.5);c.lineTo(x+s*.6,y-s*.1);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.1)';c.beginPath();c.moveTo(x-s*.1,y-s*.7);c.lineTo(x+s*.3,y-s*.5);c.lineTo(x,y-s*.5);c.closePath();c.fill();
}
const DECOFNS={treeGreen,treePine,treeSnow,cactus,crater};

// ── clouds ────────────────────────────────────────────────
function makeClouds(){
  const r=mbrng(42),cls=[];
  for(let i=0;i<5;i++){
    const w=54+r()*46,h=17+r()*13,blobs=[];
    const nb=3+Math.floor(r()*2);
    for(let j=0;j<nb;j++)blobs.push({dx:(j/(nb-1)-.5)*w*.78,dy:h*.1,r:h*.5+r()*h*.16});
    const nt=2;
    for(let j=0;j<nt;j++)blobs.push({dx:(j/(nt-1)-.3)*w*.48,dy:-h*.3-r()*h*.16,r:h*.42+r()*h*.16});
    cls.push({x:r()*W*3,y:H*.05+r()*H*.15,sp:.06+r()*.14,a:.82+r()*.14,blobs,w});
  }
  return cls;
}

// ── background render ─────────────────────────────────────
function renderBG(env,cx,cy,clouds){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,env.sky[0]);g.addColorStop(1,env.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(env.id==='moon'){
    ctx.fillStyle='rgba(255,255,255,.8)';const sr=mbrng(77);
    for(let i=0;i<90;i++){ctx.beginPath();ctx.arc(sr()*W,sr()*H*.75,sr()*1.2+.3,0,Math.PI*2);ctx.fill();}
    const eg=ctx.createRadialGradient(W*.78,H*.1,0,W*.78,H*.1,28);
    eg.addColorStop(0,'#4488cc');eg.addColorStop(.7,'#2255aa');eg.addColorStop(1,'#112244');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(W*.78,H*.1,28,0,Math.PI*2);ctx.fill();
  } else {
    // Sun
    const sg=ctx.createRadialGradient(W*.82,H*.08,2,W*.82,H*.08,54);
    sg.addColorStop(0,'rgba(255,252,200,1)');sg.addColorStop(.38,'rgba(255,228,80,.92)');sg.addColorStop(.7,'rgba(255,180,40,.35)');sg.addColorStop(1,'rgba(255,150,0,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(W*.82,H*.08,54,0,Math.PI*2);ctx.fill();
    // Clouds – merged blobs look fluffy
    if(clouds){
      for(const cl of clouds){
        const lx=((cl.x-cx*cl.sp)%W+W)%W;
        for(const offx of [0, lx<cl.w*.6?W:-W]){
          const sx=lx+offx;
          if(sx-cl.w*.6>W||sx+cl.w*.6<0)continue;
          const cyy=cl.y-cy*.05;
          const blobPath=(oy)=>{ctx.beginPath();for(const b of cl.blobs){ctx.moveTo(sx+b.dx+b.r,cyy+b.dy+oy);ctx.arc(sx+b.dx,cyy+b.dy+oy,b.r,0,Math.PI*2);}};
          ctx.save();ctx.globalAlpha=cl.a;
          ctx.fillStyle='rgba(120,160,200,.35)';blobPath(4);ctx.fill();   // soft underside shade
          ctx.fillStyle=env.cloud.replace(/[\d.]+\)$/,'1)');blobPath(0);ctx.fill();
          ctx.restore();
        }
      }
    }
  }
  // Smooth parallax hills
  for(let li=0;li<3;li++){
    const spd=.11+li*.15,ox=((-(cx*spd))%W+W)%W;
    ctx.fillStyle=env.bg[li];ctx.beginPath();
    for(let px=0;px<=W+80;px+=3){
      const hx=ox+px,hy=H*(0.36+li*.1)-Math.sin(hx*.008+li*1.2)*H*(0.14-li*.02)-Math.sin(hx*.018+li*2.1)*H*.05;
      px===0?ctx.moveTo(px,hy):ctx.lineTo(px,hy);
    }
    ctx.lineTo(W+100,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  }
}

function _drawTerrainCurve(ctx,pts,si,cx,cy){
  const p=i=>pts[Math.max(0,Math.min(pts.length-1,i))];
  for(let i=si;i<pts.length-1&&p(i).x-cx<VW+SEG*2;i++){
    const p0=p(i-1),p1=p(i),p2=p(i+1),p3=p(i+2);
    ctx.bezierCurveTo(
      p1.x+(p2.x-p0.x)/6-cx,p1.y+(p2.y-p0.y)/6-cy,
      p2.x-(p3.x-p1.x)/6-cx,p2.y-(p3.y-p1.y)/6-cy,
      p2.x-cx,p2.y-cy
    );
  }
}
function renderTerrain(terrain,env,cx,cy){
  const pts=terrain.pts;
  const si=terrain.firstVisible(cx);
  const p=i=>pts[Math.max(0,Math.min(pts.length-1,i))];
  const sx0=p(si).x-cx,sy0=p(si).y-cy;
  const dg=ctx.createLinearGradient(0,sy0,0,sy0+VH*.7);dg.addColorStop(0,env.gMid);dg.addColorStop(1,env.gDeep);
  // Fill
  ctx.beginPath();
  ctx.moveTo(Math.min(sx0,-50),VH+60);ctx.lineTo(Math.min(sx0,-50),sy0);ctx.lineTo(sx0,sy0);
  _drawTerrainCurve(ctx,pts,si,cx,cy);
  ctx.lineTo(VW+100,VH+60);ctx.closePath();ctx.fillStyle=dg;ctx.fill();
  // Dirt texture: deterministic pebbles and darker clods below the surface
  ctx.save();ctx.clip();
  for(let i=si;i<pts.length&&pts[i].x-cx<VW+SEG;i++){
    const q=pts[i];let hsh=Math.sin(q.x*12.9898)*43758.5453;hsh-=Math.floor(hsh);
    for(let k=0;k<2;k++){
      const hh=(hsh*(k+3)*7.13)%1,d=26+hh*(VH*.45),rx=3+hh*6;
      ctx.fillStyle=k?'rgba(0,0,0,.13)':'rgba(255,230,180,.08)';
      ctx.beginPath();ctx.ellipse(q.x-cx+(hh-.5)*30,q.y-cy+d,rx,rx*.62,hh*3,0,Math.PI*2);ctx.fill();
    }
  }
  // Soil shadow under the grass
  ctx.beginPath();ctx.moveTo(sx0,sy0+9);
  ctx.translate(0,9);_drawTerrainCurve(ctx,pts,si,cx,cy);ctx.translate(0,-9);
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=16;ctx.stroke();
  ctx.restore();
  // Thick grass layer
  ctx.beginPath();ctx.moveTo(sx0,sy0);_drawTerrainCurve(ctx,pts,si,cx,cy);
  ctx.strokeStyle=env.gTop;ctx.lineWidth=16;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  // Bright edge line
  ctx.beginPath();ctx.moveTo(sx0,sy0);_drawTerrainCurve(ctx,pts,si,cx,cy);
  ctx.strokeStyle=env.gLine;ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
  // Decorations
  for(const d of terrain.decs){
    const dx=d.x-cx,dy=d.y-cy;if(dx<-60||dx>VW+60)continue;
    const fn=DECOFNS[d.fn];if(fn)fn(ctx,dx,dy,d.s);else rock(ctx,dx,dy,d.s,env);
  }
}

function renderObjs(terrain,cx,cy,t){
  for(const o of terrain.objs){
    if(o.col)continue;
    const ox=o.x-cx,oy=o.y-cy;if(ox<-30||ox>VW+30)continue;
    if(o.t==='coin'){
      const p=.93+Math.sin(t*.006+o.x*.05)*.07,r=9*p;
      const cg=ctx.createRadialGradient(ox-2,oy-2,0,ox,oy,r);
      cg.addColorStop(0,'#fff8a0');cg.addColorStop(.5,'#ffe500');cg.addColorStop(1,'#cc8800');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(ox,oy,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#aa7700';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ox,oy,r,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='rgba(170,110,0,.8)';ctx.font=`bold ${r*1.1|0}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',ox,oy+.5);
    }else{
      ctx.fillStyle='#f44336';ctx.beginPath();ctx.roundRect(ox-9,oy-20,18,20,3);ctx.fill();
      ctx.fillStyle='#b71c1c';ctx.beginPath();ctx.roundRect(ox-5,oy-24,10,6,2);ctx.fill();
      ctx.fillStyle='#ef9a9a';ctx.beginPath();ctx.roundRect(ox-6,oy-17,5,5,1);ctx.fill();
      ctx.strokeStyle='#880000';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(ox-9,oy-20,18,20,3);ctx.stroke();
      const fg=ctx.createRadialGradient(ox,oy,0,ox,oy,22);fg.addColorStop(0,'rgba(255,100,0,.25)');fg.addColorStop(1,'transparent');
      ctx.fillStyle=fg;ctx.beginPath();ctx.arc(ox,oy,22,0,Math.PI*2);ctx.fill();
    }
  }
}

function renderCar(car,cx,cy){
  const bx=car.vx()-cx,by=car.vy()-cy;
  const fx=car.fx-cx,fy=car.fy-cy;
  const rx=car.rx-cx,ry=car.ry-cy;
  if(car.vd.id==='bike')_bikeLinks(ctx,bx,by,car.bang,fx,fy,rx,ry);
  else{drawSusp(ctx,bx,by,car.bang,car.axR,rx,ry);drawSusp(ctx,bx,by,car.bang,car.axF,fx,fy);}
  drawBody(ctx,car.vd,car.bang,bx,by);
  drawWheel(ctx,rx,ry,car.wr,car.rang,car.vd);
  drawWheel(ctx,fx,fy,car.wr,car.fang,car.vd);
  if(car.turboQ>.7){const tg=ctx.createRadialGradient(bx,by,0,bx,by,52);tg.addColorStop(0,'rgba(0,200,255,.22)');tg.addColorStop(1,'transparent');ctx.fillStyle=tg;ctx.beginPath();ctx.arc(bx,by,52,0,Math.PI*2);ctx.fill();}
}

function renderVignette(){
  const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.82);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function refreshGarage(){
  document.getElementById('gCoins').textContent='🪙 '+sv.coins;
  // Vehicle row
  const vr=document.getElementById('vRow');vr.innerHTML='';
  for(const vd of VEHICLES){
    const vs2=sv.vs[vd.id];
    const card=document.createElement('div');
    card.className='vcard'+(sv.selV===vd.id?' sel':'')+(vs2.locked?' lck':'');
    // mini preview canvas
    const mc=document.createElement('canvas');mc.width=90;mc.height=48;mc.style.display='block';
    const c2=mc.getContext('2d');c2.save();c2.translate(45,21);c2.scale(.3,.3);
    const sy=vd.wr+10;
    if(vd.id==='bike')_bikeLinks(c2,0,0,0,vd.axF,sy,vd.axR,sy);
    drawBody(c2,vd,0,0,0);
    drawWheel(c2,vd.axR,sy,vd.wr,0,vd);drawWheel(c2,vd.axF,sy,vd.wr,0,vd);
    c2.restore();
    card.appendChild(mc);
    const nm=document.createElement('div');nm.className='vcname';nm.textContent=vd.name;card.appendChild(nm);
    if(vs2.locked){const pr=document.createElement('div');pr.className='vcprice';pr.textContent='🪙'+vd.price;card.appendChild(pr);}
    card.addEventListener('click',()=>{
      if(vs2.locked){
        if(sv.coins>=vd.price){sv.coins-=vd.price;sv.vs[vd.id].locked=false;sv.selV=vd.id;saveSv();sfxBuy();toast(vd.name+' unlocked!');refreshGarage();}
        else{toast('Need 🪙'+vd.price);beep(220,.2,.3,'sawtooth');}
      }else{sv.selV=vd.id;saveSv();sfxBtn();refreshGarage();}
    });
    vr.appendChild(card);
  }
  drawGaragePrev(document.getElementById('gPrev'));
  // Upgrades
  const vs2=sv.vs[sv.selV];
  const ug=document.getElementById('ugGrid');ug.innerHTML='';
  for(const up of UPGRADES){
    const lv=vs2[up.id]||0,mx=lv>=up.max;
    const cost=Math.round(up.base*Math.pow(up.mult,lv));
    const cd=document.createElement('div');cd.className='ucard';
    let dots='';for(let i=0;i<up.max;i++)dots+=`<div class="udot${i<lv?' on':''}"></div>`;
    cd.innerHTML=`<div class="uicon">${up.icon}</div><div class="uname">${up.name}</div><div class="udots">${dots}</div>${mx?'<div class="ucost" style="font-size:9px;color:rgba(255,200,0,.4)">MAX</div>':`<div class="ucost" style="opacity:${sv.coins>=cost&&!vs2.locked?.9:.35}">${vs2.locked?'🔒':'🪙'+cost}</div>`}`;
    if(!mx&&!vs2.locked)cd.addEventListener('click',()=>{const c2=Math.round(up.base*Math.pow(up.mult,sv.vs[sv.selV][up.id]||0));if(sv.coins>=c2){sv.coins-=c2;sv.vs[sv.selV][up.id]=(sv.vs[sv.selV][up.id]||0)+1;saveSv();sfxBuy();refreshGarage();}else{toast('Need 🪙'+c2);beep(220,.2,.3,'sawtooth');}});
    ug.appendChild(cd);
  }
}

    const d=document.createElement('div');
    d.className='lcard'+(sv.selE===e.id?' sel':'')+(unl?'':' lck');
    d.innerHTML=`<div class="lemoji">${e.emoji}</div><div><div class="lname">${e.name}${sv.selE===e.id?' ✓':''}</div><div class="ldesc">${unl?'Distance record: '+(sv.best|0)+'m':'🔒 Reach '+e.unlockM+'m to unlock'}</div></div>`;
    if(unl)d.addEventListener('click',()=>{sv.selE=e.id;saveSv();sfxBtn();initMapSel();});
    else d.addEventListener('click',()=>toast('Reach '+e.unlockM+'m to unlock!'));
    el.appendChild(d);
  }
}

// ── game ─────────────────────────────────────────────────
function startGame(){
  if(raf){cancelAnimationFrame(raf);raf=null;}
  if(endTmr){clearTimeout(endTmr);endTmr=null;}
  STATE='game';sessionCoins=0;fT=0;setG(false);setB(false);paused=false;nextMile=0;runBanked=false;hudCache={};
  PARTS.length=0;
  const env=ENVS.find(e=>e.id===sv.selE)||ENVS[0];
  const vd=VEHICLES.find(v=>v.id===sv.selV)||VEHICLES[0];
  const vs2=sv.vs[vd.id];
  const upg={engine:vs2.engine||0,susp:vs2.susp||0,fuel:vs2.fuel||0,tires:vs2.tires||0,fwd:vs2.fwd||0,turbo:vs2.turbo||0};
  terrain=new Terrain(env,Math.random()*99999|0);
  clouds=makeClouds();
  const sy=terrain.getY(180)-vd.wr-70;
  car=new Car(vd,upg,env,180,sy);
  camX=car.bx-VW*.3;camY=car.by-VH*.58;
  showOvl(null);
  document.getElementById('pauseOvl').classList.remove('on');
  document.getElementById('goOvl').classList.remove('on');
  startEng();lastT=performance.now();
  raf=requestAnimationFrame(loop);
}

let hudCache={};
function hudSet(id,prop,val){
  const k=id+prop;if(hudCache[k]===val)return;hudCache[k]=val;
  const el=document.getElementById(id);if(prop==='textContent')el.textContent=val;else el.style[prop]=val;
}
function loop(now){
  if(STATE!=='game'||paused)return;
  raf=requestAnimationFrame(loop);
  const dt=Math.min((now-lastT)/1e3,.05);lastT=now;fT+=dt;
  const steps=Math.max(1,Math.round(dt*60));
  for(let i=0;i<steps;i++){if(!car.dead)car.step(terrain,gas,brake);tickParts();}
  if(car.noFuel&&!car.crashed&&!car.dead){car.noFuelT=(car.noFuelT||0)+1;car.stallT=Math.hypot(car.bvx,car.bvy)<.5?(car.stallT||0)+1:0;if(car.stallT>70||car.noFuelT>480){car.crashed=true;car.rsn='OUT OF FUEL!';}}
  // Exhaust
  if(!car.dead&&gas&&car.et%4===0){
    const co=Math.cos(car.bang),si=Math.sin(car.bang);
    emit(car.vx()+car.axR*co,car.vy()+car.axR*si,2,{a:car.bang+Math.PI+(Math.random()-.5)*.5,s:2+Math.random()*1.8,d:.04+Math.random()*.02,r:3+Math.random()*3,c:car.turboQ>.7?'rgba(0,200,255,.7)':`rgba(${160+Math.random()*40|0},${100+Math.random()*30|0},60,.7)`,g:.04,up:.5});
  }
  if((car.rG||car.fG)&&Math.abs(car.rvx)>2.4&&car.et%5===0){
    const wx=car.rG?car.rx:car.fx,wy=car.rG?car.ry:car.fy;
    emit(wx,wy+car.wr,2,{a:-Math.PI/2+(Math.random()-.5)*.9,s:.8+Math.random()*1.4,d:.055,r:2+Math.random()*3,c:car.env.gTop,g:-.01,up:1});
  }
  // Collect
  const pts2=[{x:car.fx,y:car.fy},{x:car.rx,y:car.ry},{x:car.bx,y:car.by}];
  for(const o of terrain.objs){
    if(o.col)continue;
    for(const b of pts2){
      const d2=(b.x-o.x)**2+(b.y-o.y)**2,rad=o.t==='coin'?10+car.wr*.4:12+car.wr*.55;
      if(d2<rad*rad){
        o.col=true;
        if(o.t==='coin'){
          sessionCoins++;sfxCoin();
          const pop=document.createElement('div');pop.className='cpop';
          pop.style.left=((o.x-camX)*ZOOM-12)+'px';pop.style.top=((o.y-camY)*ZOOM-18)+'px';pop.textContent='+1';
          wrap.appendChild(pop);setTimeout(()=>pop.remove(),920);
          emit(o.x,o.y,5,{s:2.2,d:.055,r:3,c:'#ffe500',g:.05,up:1});
        }else{
          car.fuel=Math.min(car.fuelMax,car.fuel+car.fuelMax*.5);car.noFuel=false;sfxFuel();toast('⛽ FUEL +50%');
          emit(o.x,o.y,7,{s:2.5,d:.04,r:3,c:'#ff6600',g:.03,up:1.5});
        }
        break;
      }
    }
  }
  // Camera
  camX+=(car.bx-VW*.3-camX)*.12;
  camY+=(car.by-VH*.58-camY)*.1;
  terrain.ensure(camX+VW*2);
  // Milestone
  const d=car.dist|0;
  if(nextMile<MILES.length&&d>=MILES[nextMile]){showMile(MILES[nextMile]);nextMile++;ENVS.forEach(e=>{if(d>=e.unlockM&&!sv.envs[e.id]){sv.envs[e.id]=true;saveSv();setTimeout(()=>toast('🗺 '+e.name+' UNLOCKED!'),1800);}});}
  // Engine RPM
  setRPM(Math.min(1,Math.abs(car.bvx)/14+(gas?.26:0)));
  // HUD
  hudSet('hDist','textContent',d+' m');
  hudSet('hCoins','textContent',sessionCoins);
  const fp=(car.fuel/car.fuelMax)*100;
  hudSet('fuelBar','width',fp.toFixed(1)+'%');
  hudSet('fuelBar','background',fp<20?'linear-gradient(90deg,#f44336,#b71c1c)':fp<40?'linear-gradient(90deg,#ff9800,#e65100)':'linear-gradient(90deg,#66bb6a,#2e7d32)');
  if(car.et%120===0)terrain.prune(car.bx-VW*1.5);
  // Draw
  ctx.clearRect(0,0,W,H);
  renderBG(car.env,camX,camY,clouds);
  ctx.save();ctx.scale(ZOOM,ZOOM);
  renderTerrain(terrain,car.env,camX,camY);
  renderObjs(terrain,camX,camY,now);
  drawParts(camX,camY);
  renderCar(car,camX,camY);
  ctx.restore();
  renderVignette();
  // Crash
  if(car.crashed&&!car.dead){
    car.dead=true;stopEng();sfxCrash();
    emit(car.vx(),car.vy(),18,{s:4.5,d:.022,r:6,c:'#ff3300',g:.1,up:3});
    emit(car.vx(),car.vy(),12,{s:3,d:.028,r:4,c:'#ff9800',g:.08,up:2});
    document.getElementById('pauseBtn').style.display='none';
    endTmr=setTimeout(()=>endGame(car.rsn||'CRASHED!'),900);
  }
}

function bankRun(){
  // Pays out the current run exactly once (game over, or quitting from pause)
  if(runBanked||!car)return null;
  runBanked=true;
  const d=car.dist|0,nb=d>sv.best;
  sv.coins+=sessionCoins;if(nb)sv.best=d;
  const env=car.env.id;if(d>(sv.bestBy[env]||0))sv.bestBy[env]=d;
  sv.stats.runs++;sv.stats.dist+=d;sv.stats.coins+=sessionCoins;
  ENVS.forEach(e=>{if(sv.best>=e.unlockM)sv.envs[e.id]=true;});
  saveSv();
  return{d,nb};
}
function endGame(rsn){
  if(STATE!=='game')return;
  STATE='gameover';endTmr=null;if(raf){cancelAnimationFrame(raf);raf=null;}
  setG(false);setB(false);
  const r=bankRun()||{d:car.dist|0,nb:false},d=r.d,nb=r.nb;
  showOvl('goOvl');
  document.getElementById('goRsn').textContent=rsn;
  document.getElementById('goDist').textContent=d+' m';
  document.getElementById('goCoins').textContent=sessionCoins;
  document.getElementById('goBest').textContent=nb?'🏆 NEW BEST: '+d+' m!':'BEST: '+sv.best+' m';
}

// ── pause ─────────────────────────────────────────────────
function togglePause(){
  if(STATE!=='game'||(car&&car.dead))return;
  setG(false);setB(false);
  paused=!paused;
  document.getElementById('pauseOvl').classList.toggle('on',paused);
  if(!paused){stopEng();startEng();lastT=performance.now();raf=requestAnimationFrame(loop);}
  else stopEng();
}

// ── toast & milestone ─────────────────────────────────────
let toastTmr=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.opacity='1';if(toastTmr)clearTimeout(toastTmr);toastTmr=setTimeout(()=>el.style.opacity='0',2100);}
let mileTmr=null;
function showMile(m){sfxMile();document.getElementById('mileN').textContent=m+'m';const el=document.getElementById('mile');el.style.opacity='1';if(mileTmr)clearTimeout(mileTmr);mileTmr=setTimeout(()=>el.style.opacity='0',2200);}

// ── input ─────────────────────────────────────────────────
const cG=document.getElementById('cGas'),cB=document.getElementById('cBrake');
function setG(v){gas=v;cG.classList.toggle('act',v);}
function setB(v){brake=v;cB.classList.toggle('act',v);}
window.addEventListener('blur',()=>{setG(false);setB(false);});
for(const [el,set] of [[cG,v=>setG(v)],[cB,v=>setB(v)]]){
  // A button stays held while any finger that started on it is still down
  const upd=e=>{e.preventDefault();set(e.targetTouches.length>0);};
  el.addEventListener('touchstart',e=>{upd(e);getAC();},{passive:false});
  el.addEventListener('touchend',upd,{passive:false});
  el.addEventListener('touchcancel',upd,{passive:false});
}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>getAC(),{once:true});
cG.addEventListener('mousedown',()=>setG(true));cG.addEventListener('mouseup',()=>setG(false));cG.addEventListener('mouseleave',()=>setG(false));
cB.addEventListener('mousedown',()=>setB(true));cB.addEventListener('mouseup',()=>setB(false));cB.addEventListener('mouseleave',()=>setB(false));
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowRight'||e.key==='d'){setG(true);getAC();}if(e.key==='ArrowLeft'||e.key==='a'){setB(true);getAC();}if(e.key==='Escape'||e.key==='p')togglePause();});
window.addEventListener('keyup',e=>{if(e.key==='ArrowRight'||e.key==='d')setG(false);if(e.key==='ArrowLeft'||e.key==='a')setB(false);});

// ── buttons ───────────────────────────────────────────────
document.getElementById('btnPlay').onclick=()=>{sfxBtn();getAC();startGame();};
document.getElementById('btnGarage').onclick=()=>{sfxBtn();initGarage();};
document.getElementById('btnMapSel').onclick=()=>{sfxBtn();initMapSel();};
document.getElementById('btnGBack').onclick=()=>{sfxBtn();initMenu();};
document.getElementById('btnMapBack').onclick=()=>{sfxBtn();initMenu();};
document.getElementById('btnResume').onclick=togglePause;
document.getElementById('btnPMenu').onclick=()=>{sfxBtn();paused=false;stopEng();if(raf){cancelAnimationFrame(raf);raf=null;}bankRun();initMenu();};
document.getElementById('btnRetry').onclick=()=>{sfxBtn();startGame();};
document.getElementById('btnGoMenu').onclick=()=>{sfxBtn();initMenu();};
document.getElementById('pauseBtn').onclick=togglePause;

// ── app lifecycle (backgrounding on Android) ─────────────
function onHidden(){
  if(STATE==='game'&&!paused&&car&&!car.dead)togglePause();
  setG(false);setB(false);
  try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}
}
function onVisible(){
  try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}
  lastT=performance.now();resize();
}
document.addEventListener('visibilitychange',()=>document.hidden?onHidden():onVisible());
window.addEventListener('pagehide',onHidden);
window.addEventListener('pageshow',onVisible);

// ── service worker ────────────────────────────────────────
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

// ── boot ─────────────────────────────────────────────────
initMenu();
</script>
