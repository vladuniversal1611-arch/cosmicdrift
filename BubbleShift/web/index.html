    g.restore();
  }

  // ---------------------------------------------------------------- scenery primitives
  function tree(g, x, y, s, col, kind) {
    g.save();
    g.fillStyle = 'rgba(0,0,0,0.15)'; g.beginPath(); g.ellipse(x, y, s * 0.35, s * 0.08, 0, 0, TAU); g.fill();
    g.fillStyle = '#7a4a2a'; rr(g, x - s * 0.06, y - s * 0.5, s * 0.12, s * 0.5, s * 0.03); g.fill();
    if (kind === 'pine') {
      for (let i = 0; i < 3; i++) { const w = s * (0.42 - i * 0.1), yy = y - s * (0.35 + i * 0.28); g.fillStyle = shade(col, -0.15 + i * 0.08); g.beginPath(); g.moveTo(x - w, yy); g.lineTo(x, yy - s * 0.45); g.lineTo(x + w, yy); g.closePath(); g.fill(); }

      for (const [dx, dy, r0, sh] of [[-0.2, -0.62, 0.26, -0.1], [0.2, -0.62, 0.26, -0.05], [0, -0.85, 0.3, 0.05], [0, -0.6, 0.28, 0]]) {
        const gg = g.createRadialGradient(x + dx * s - r0 * s * 0.3, y + dy * s - r0 * s * 0.4, 0, x + dx * s, y + dy * s, r0 * s);
        gg.addColorStop(0, shade(col, 0.25 + sh)); gg.addColorStop(1, shade(col, -0.2 + sh));
        g.fillStyle = gg; g.beginPath(); g.arc(x + dx * s, y + dy * s, r0 * s, 0, TAU); g.fill();
      }
      if (kind === 'fruit') for (const [dx, dy] of [[-0.15, -0.7], [0.18, -0.8], [0.05, -0.55]]) { g.fillStyle = '#ff5a5a'; g.beginPath(); g.arc(x + dx * s, y + dy * s, s * 0.04, 0, TAU); g.fill(); }
    }
    g.restore();
  }
  function flower(g, x, y, s, col) {
    g.fillStyle = col;
    for (let i = 0; i < 5; i++) { const a = (i * TAU) / 5; g.beginPath(); g.arc(x + Math.cos(a) * s * 0.5, y + Math.sin(a) * s * 0.5, s * 0.45, 0, TAU); g.fill(); }
    g.fillStyle = '#ffe36a'; g.beginPath(); g.arc(x, y, s * 0.35, 0, TAU); g.fill();
  }
  function cloudShape(g, x, y, s, col) {
    g.fillStyle = col;
    for (const [dx, dy, r0] of [[-0.35, 0.05, 0.25], [0, -0.1, 0.33], [0.35, 0.05, 0.25], [0.15, 0.1, 0.25], [-0.15, 0.12, 0.25]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r0 * s, 0, TAU); g.fill(); }
  }
  function castle(g, x, y, s, wall, roof) {
    g.save();

      g.fillStyle = roof; g.beginPath(); g.moveTo(tx - tw * 0.65, y - th); g.lineTo(tx, y - th - tw * 1.3); g.lineTo(tx + tw * 0.65, y - th); g.closePath(); g.fill();
      g.fillStyle = 'rgba(40,40,80,0.35)'; rr(g, tx - tw * 0.15, y - th * 0.7, tw * 0.3, th * 0.18, tw * 0.15); g.fill();
    };
    g.fillStyle = wall; g.fillRect(x - s * 0.45, y - s * 0.4, s * 0.9, s * 0.4);
    for (let i = 0; i < 7; i++) g.fillRect(x - s * 0.45 + i * s * 0.14, y - s * 0.46, s * 0.07, s * 0.07);
    tower(x - s * 0.45, s * 0.16, s * 0.65); tower(x + s * 0.45, s * 0.16, s * 0.65); tower(x, s * 0.22, s * 0.9);
    tower(x - s * 0.2, s * 0.12, s * 0.55); tower(x + s * 0.22, s * 0.12, s * 0.6);

    g.restore();
  }
  function hills(g, W, y, amp, col1, col2, seed, H) {
    const rnd = U.rng(seed);
    const pts = [];
    let px = -20;
    while (px < W + 40) { pts.push([px, y - rnd() * amp]); px += W * (0.18 + rnd() * 0.18); }
    const gg = g.createLinearGradient(0, y - amp, 0, H);
    gg.addColorStop(0, col1); gg.addColorStop(1, col2);
    g.fillStyle = gg; g.beginPath(); g.moveTo(-20, H); g.lineTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < pts.length - 1; i++) g.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    g.lineTo(W + 40, pts[pts.length - 1][1]); g.lineTo(W + 40, H); g.closePath(); g.fill();

  function windmill(g, x, y, s, col, a) {
    g.save(); g.fillStyle = col; g.beginPath(); g.moveTo(x - s * 0.15, y); g.lineTo(x - s * 0.08, y - s * 0.6); g.lineTo(x + s * 0.08, y - s * 0.6); g.lineTo(x + s * 0.15, y); g.fill();

    for (let i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.fillRect(-s * 0.03, 0, s * 0.06, s * 0.45); }
    g.restore();
  }
  function island(g, x, y, s) {
    g.save();
    g.fillStyle = '#8f6ad8'; g.beginPath(); g.moveTo(x - s * 0.5, y); g.quadraticCurveTo(x, y + s * 0.8, x + s * 0.5, y); g.fill();
    g.fillStyle = '#9be38a'; g.beginPath(); g.ellipse(x, y, s * 0.52, s * 0.12, 0, 0, TAU); g.fill();

    g.restore();
  }
  function mushroom(g, x, y, s) {
    g.save();
    g.fillStyle = '#fff3e0'; rr(g, x - s * 0.18, y - s * 0.6, s * 0.36, s * 0.6, s * 0.1); g.fill();
    const mg = g.createRadialGradient(x - s * 0.2, y - s * 0.8, 0, x, y - s * 0.6, s * 0.6); mg.addColorStop(0, '#ff9a9a'); mg.addColorStop(1, '#d6284a');

  }

      g.restore();
    }
  }

    g.fillStyle = lg; g.beginPath(); g.arc(x, y - s, s * 2.2, 0, TAU); g.fill();
    g.fillStyle = '#3a2a5a'; g.fillRect(x - s * 0.05, y - s * 0.6, s * 0.1, s * 0.6);
    g.fillStyle = '#ffd36a'; rr(g, x - s * 0.3, y - s * 1.3, s * 0.6, s * 0.7, s * 0.15); g.fill();
  }

  // ---------------------------------------------------------------- scenes
  // Paint an area's environment. opt.horizon 0..1, opt.dim darken amount.
  function scene(g, W, H, areaIdx, opt) {
    opt = opt || {};
    const A = DATA.AREAS[areaIdx];
    const rnd = U.rng(areaIdx * 101 + 7 + (opt.seed || 0));
    const hz = H * (opt.horizon || 0.42);
    const sky = g.createLinearGradient(0, 0, 0, hz * 1.3);
    sky.addColorStop(0, A.sky[0]); sky.addColorStop(0.6, A.sky[1]); sky.addColorStop(1, A.sky[2]);
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const night = A.props === 'shadow';
    const sx = W * (0.25 + rnd() * 0.5), sy = hz * 0.35;
    const sg = g.createRadialGradient(sx, sy, 0, sx, sy, W * 0.45);
    sg.addColorStop(0, night ? 'rgba(230,220,255,0.55)' : 'rgba(255,250,210,0.85)'); sg.addColorStop(0.2, night ? 'rgba(200,180,255,0.2)' : 'rgba(255,240,180,0.35)'); sg.addColorStop(1, 'rgba(255,240,200,0)');
    g.fillStyle = sg; g.fillRect(0, 0, W, H);
    g.fillStyle = night ? '#f4efff' : '#fffbe0'; g.beginPath(); g.arc(sx, sy, W * 0.06, 0, TAU); g.fill();
    if (night) {
      g.fillStyle = A.sky[0]; g.beginPath(); g.arc(sx + W * 0.025, sy - W * 0.015, W * 0.052, 0, TAU); g.fill();
      for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(255,255,255,${0.3 + rnd() * 0.6})`; g.beginPath(); g.arc(rnd() * W, rnd() * hz, 0.6 + rnd() * 1.4, 0, TAU); g.fill(); }
    }
    for (let i = 0; i < 5; i++) cloudShape(g, rnd() * W, hz * (0.12 + rnd() * 0.5), W * (0.14 + rnd() * 0.12), night ? 'rgba(160,140,220,0.25)' : 'rgba(255,255,255,0.75)');
    hills(g, W, hz, H * 0.12, mix(A.sky[2], A.hills[2], 0.35), mix(A.sky[2], A.hills[1], 0.5), areaIdx * 3 + 1, H);
    const lm = A.props;
    if (lm === 'meadow' || lm === 'castle') castle(g, W * (lm === 'castle' ? 0.5 : 0.72), hz - H * 0.02, W * (lm === 'castle' ? 0.5 : 0.24), mix(A.sky[2], '#b7c3e8', 0.4), mix(A.sky[0], '#6a7ad8', 0.3));
    if (lm === 'castle') for (let i = 0; i < 6; i++) { g.strokeStyle = alpha(DATA.COLORS[i].base, 0.35); g.lineWidth = W * 0.015; g.beginPath(); g.arc(W * 0.5, hz + H * 0.1, W * (0.55 - i * 0.015), Math.PI, TAU); g.stroke(); }
    if (lm === 'village') for (let i = 0; i < 3; i++) windmill(g, W * (0.2 + i * 0.3), hz - H * 0.02 + rnd() * 8, W * 0.12, mix(A.sky[2], '#c9b08a', 0.5), 0.3 + i);
    if (lm === 'ruins') for (let i = 0; i < 5; i++) { const cx0 = W * (0.1 + i * 0.2), hh = H * (0.05 + rnd() * 0.08); g.fillStyle = mix(A.sky[2], '#b8955a', 0.5); g.fillRect(cx0, hz - hh, W * 0.035, hh); g.fillRect(cx0 - W * 0.01, hz - hh - 4, W * 0.055, 5); }
    if (lm === 'clouds') for (let i = 0; i < 4; i++) island(g, W * (0.15 + i * 0.25 + rnd() * 0.05), hz - H * (0.05 + rnd() * 0.1), W * 0.14);
    if (lm === 'shadow') for (let i = 0; i < 6; i++) { const cx0 = rnd() * W, hh = H * (0.06 + rnd() * 0.1); g.fillStyle = mix(A.sky[1], '#1a1040', 0.5); g.beginPath(); g.moveTo(cx0 - W * 0.05, hz + 5); g.lineTo(cx0, hz - hh); g.lineTo(cx0 + W * 0.04, hz + 5); g.fill(); }
    const midPts = hills(g, W, hz + H * 0.06, H * 0.07, A.hills[0], A.hills[1], areaIdx * 3 + 2, H);
    if (lm === 'lake' || lm === 'meadow') {
      const wy = hz + H * (lm === 'lake' ? 0.09 : 0.14);
      const wg = g.createLinearGradient(0, wy, 0, wy + H * 0.12); wg.addColorStop(0, '#9fe6ff'); wg.addColorStop(1, '#3fa6e0');
      g.fillStyle = wg;
      g.beginPath(); g.moveTo(0, wy); g.bezierCurveTo(W * 0.3, wy - 10, W * 0.6, wy + 20, W, wy + 5); g.lineTo(W, wy + H * (lm === 'lake' ? 0.14 : 0.05)); g.bezierCurveTo(W * 0.6, wy + H * 0.1, W * 0.3, wy + H * 0.04, 0, wy + H * 0.06); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 2;
      for (let i = 0; i < 8; i++) { const lx = rnd() * W, ly = wy + 6 + rnd() * H * 0.05; g.beginPath(); g.moveTo(lx, ly); g.lineTo(lx + 14 + rnd() * 16, ly); g.stroke(); }
    }
    const kind = lm === 'forest' || lm === 'shadow' ? 'pine' : lm === 'village' ? 'fruit' : 'round';
    if (lm !== 'clouds') for (let i = 0; i < 9; i++) {
      const p = midPts[Math.floor(rnd() * midPts.length)] || [rnd() * W, hz];
      tree(g, U.clamp(p[0] + (rnd() - 0.5) * 60, 0, W), p[1] + 8 + rnd() * 20, W * (0.07 + rnd() * 0.05), shade(A.hills[1], -0.05), kind);
    }
    hills(g, W, hz + H * 0.2, H * 0.05, A.hills[1], A.hills[2], areaIdx * 3 + 3, H);
    if (lm === 'forest') for (let i = 0; i < 7; i++) mushroom(g, rnd() * W, hz + H * (0.24 + rnd() * 0.5), W * (0.03 + rnd() * 0.03));
    if (lm === 'lake' || lm === 'ruins') for (let i = 0; i < 5; i++) crystalCluster(g, rnd() * W, hz + H * (0.3 + rnd() * 0.5), W * (0.03 + rnd() * 0.02));
    if (lm === 'shadow') for (let i = 0; i < 6; i++) lantern(g, rnd() * W, hz + H * (0.25 + rnd() * 0.5), W * 0.03);
    if (lm !== 'clouds') {

      tree(g, W * 1.02, H * 1.0, W * 0.3, shade(A.hills[2], -0.1), kind === 'fruit' ? 'round' : kind);
    } else for (let i = 0; i < 6; i++) cloudShape(g, rnd() * W, hz + H * (0.3 + rnd() * 0.6), W * (0.2 + rnd() * 0.2), 'rgba(255,255,255,0.85)');

    g.globalAlpha = 0.9;

      g.restore();

  }

  // ---------------------------------------------------------------- restoration objects
  // stage 0 broken (grey, held by storm bubbles), 1 rebuilt (raw materials),
  // 2 painted, 3 decorated (flowers, lights, sparkle).
  function object(g, x, y, s, type, stage, tt) {
    g.save();
    g.fillStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(x, y, s * 0.55, s * 0.12, 0, 0, TAU); g.fill();
    const raw = stage <= 1, broken = stage === 0;
    const P = {
      wall: broken ? '#9a9aa6' : raw ? '#d8c3a0' : '#fff2da', wood: broken ? '#76727e' : '#a8703f',
      roof: broken ? '#6d6a78' : raw ? '#9a6a44' : '#e8454f', trim: broken ? '#5c5a66' : raw ? '#7a5030' : '#3f7ad8',
      stone: broken ? '#8a8a96' : '#c9c1b5', accent: broken ? '#8a8a96' : '#ffd23f',
    };
    const flowers = (n, x0, w0, yy) => { for (let i = 0; i < n; i++) flower(g, x0 + (i * w0) / Math.max(1, n - 1), yy, s * 0.035, ['#ff6fa8', '#ffd23f', '#ff8a5a', '#b98bff', '#ffffff'][i % 5]); };
    switch (type) {
      case 'house': case 'workshop': {
        const w = s * 0.8, h = s * 0.5;
        g.fillStyle = P.wall; g.strokeStyle = 'rgba(60,40,30,0.55)'; g.lineWidth = s * 0.02;

  // ---------------------------------------------------------------- chests

  // ---------------------------------------------------------------- icons (DOM images)
  const iconCache = {};

        star(g, x, y + s * 0.02, s * 0.17, s * 0.08, 5); g.fillStyle = '#e08a00'; g.fill();
        g.fillStyle = 'rgba(255,255,255,0.7)'; g.beginPath(); g.ellipse(x - s * 0.15, y - s * 0.2, s * 0.1, s * 0.05, -0.6, 0, TAU); g.fill();

      }

      case 'starGrey': star(g, x, y + s * 0.02, s * 0.42, s * 0.21, 5); g.fillStyle = 'rgba(40,50,90,0.45)'; g.fill(); g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = s * 0.04; g.stroke(); break;

/* ==========================================================================

    await playEvents(res.ev, Math.max(1, combo));
    if (combo >= 2) { addText(W / 2, top + viewU * R * 0.45, t('combo', { n: combo }), '#ffd84a', 1.4 + Math.min(combo, 6) * 0.08); Audio.play('combo', combo); lumiMood('wow', 1.2); }
    if (combo === 5) { ammo[1] = { t: 'rainbow' }; addText(shooterX, shooterY - R * 3.5, t('lumiGift'), '#ffffff', 1); Audio.play('magic'); }
    if (res.removed >= 12) praise(t('amazing'), '#ff7ad9');
    else if (res.removed >= 8) praise(t('great'), '#7fe6ff');
    else if (res.bounces > 0 && res.popGroup >= 3) praise(t('niceBank'), '#9dff7a');
    else if (res.popGroup === 0 && res.placedKey >= 0 && p.ammo.t === 'color' && almostCd <= 0 && board.flood(res.placedKey, p.ammo.c).length === 2) {
      addText(kx(res.placedKey), ky(res.placedKey) - R * 1.2, t('almost'), '#ffe8a8', 0.8); Audio.play('almost'); almostCd = 5;
    }
    almostCd--;
    if (level.id === 1) { if (res.removed > 0) clearHint('match'); else if (movesUsed === 1) setHint('match'); }
    if (ammo.length === 0) ammo.push(nextAmmo());
    if (ammo[0].t === 'color' && !board.hasColor(ammo[0].c) && board.colorCounts().some((n) => n > 0)) ammo[0] = { t: 'color', c: board.nextColor() };
    while (ammo.length < 2) ammo.push(nextAmmo());
    if (level.id === 3 && movesUsed === 2) setHint('swap');
    await afterTurn();
  }
  async function afterTurn() {
    syncDisp(); UI.syncGameHud();
    const pr = board.progress();
    if (pr.done) { await winSequence(); return; }
    if (moves <= 0) { over = true; await wait(350); lumiMood('sad', 99); UI.outOfMoves(pr, continues); return; }
    busy = false;
  }
  function syncDisp() {
    for (let k = 0; k < board.cells.length; k++) {
      const a = board.cells[k], b = disp[k];
      if (!a) disp[k] = null;
      else if (!b || b.t !== a.t || b.c !== a.c || b.hp !== a.hp) disp[k] = G.copyCell(a);
    }
    shownGoal = board.progress().cur;
  }

  // ---------------------------------------------------------------- event playback
  async function playEvents(ev, cmb) {
    let popIdx = 0;
    const objColor = level.objective.type === 'color' ? level.objective.color : -1;
    for (const e of ev) {
      switch (e.k) {
        case 'place':
          disp[e.key] = e.cell; land[e.key] = 1; ripple(e.key);
          if (e.rainbow) { sparkBurst(kx(e.key), ky(e.key), 14); Audio.play('magic'); }
          break;
        case 'pop':
          for (const it of e.list) {
            disp[it.key] = null;
            popFx(it.key, it.cell, popIdx++, cmb);
            score += 10 * cmb;
            if (popIdx % 2) addScore(kx(it.key), ky(it.key), 10 * cmb);
            if (it.cell.c === objColor) flyToGoal(kx(it.key), ky(it.key), { bubble: it.cell.c });
            await wait(26);
          }
          Audio.vib(12);
          break;
        case 'hit': disp[e.key] = e.cell; hitFx(e.key, e.cell); await wait(40); break;
        case 'melt': disp[e.key] = e.cell; addRing(kx(e.key), ky(e.key), R, '#bfeeff', 0.5); spawnShards(kx(e.key), ky(e.key), '#dff6ff', 8); Audio.play('melt'); await wait(40); break;
        case 'unchain':
          disp[e.key] = e.cell; spawnShards(kx(e.key), ky(e.key), '#c9ced9', 10); Audio.play('chain'); score += 50;
          if (level.objective.type === 'chains') flyToGoal(kx(e.key), ky(e.key), { icon: 'chain' });
          await wait(50); break;
        case 'unlock':
          for (const k of e.keys) { if (disp[k]) disp[k] = Object.assign({}, disp[k], { t: 'n' }); sparkBurst(kx(k), ky(k), 6, '#ffe27a'); }
          Audio.play('unlock'); await wait(120); break;
        case 'destroy': disp[e.key] = null; destroyFx(e.key, e.cell, e.cause); await wait(24); break;
        case 'explode':
          explodeFx(e.key); Audio.play('boom'); Audio.vib([20, 30, 40]); shake = Math.max(shake, R * 0.9); flash = 0.35;
          await wait(90); break;
        case 'drop': {
          e.list.forEach((it, i) => { disp[it.key] = null; spawnFaller(it.key, it.cell, i); score += 20 * cmb; });
          if (e.list.length >= 3) addScore(kx(e.list[0].key), ky(e.list[0].key), 20 * cmb * e.list.length, true);
          if (e.list.length >= 6) shake = Math.max(shake, R * 0.4);
          await wait(120);
          break;
        }
        case 'rotate': await rotateAnim(e); break;
        case 'spread': {
          disp[e.to] = { t: 'd', hp: 1 };
          for (let i = 0; i < 10; i++) spawn(U.lerp(kx(e.from), kx(e.to), i / 10), U.lerp(ky(e.from), ky(e.to), i / 10), { vy: -10, life: 0.6, size: R * 0.3, col: '#8b5cc7', grow: -1 });
          Audio.play('spread'); await wait(160); break;
        }
        case 'bossHit':
          bossFx.hit = 1; bossShownHp = e.hp; Audio.play('bossHit');
          bossFx.dmg.push({ n: e.dmg, life: 1, x: (Math.random() - 0.5) * R * 3 });
          await wait(60); break;
        case 'bossAttack': await bossAttackAnim(e); break;
        case 'bossDefeat':
          bossFx.dead = 0.001; Audio.play('boom'); setTimeout(() => Audio.play('win'), 300);
          shake = R * 1.2; flash = 0.6;
          for (let i = 0; i < 60; i++) spawn(W / 2, bossY(), { vx: (Math.random() - 0.5) * 700, vy: (Math.random() - 0.8) * 600, life: 1.2, size: R * (0.2 + Math.random() * 0.4), col: DATA.COLORS[i % 6].base, grav: 900 });
          await wait(900); break;
        case 'fire': Audio.play('boom'); shake = Math.max(shake, R * 0.5); break;
        case 'hammer': await hammerAnim(e.key); break;
        case 'colorBlast':
          Audio.play('magic'); flash = 0.3;
          for (const k of e.keys) sparkBurst(kx(k), ky(k), 3, DATA.COLORS[e.color].light);
          await wait(200); break;
      }
    }
  }
  function praise(txt, col) { addText(W / 2, top + viewU * R * 0.32, txt, col, 1.6); Audio.play('praise'); lumiMood('wow', 1.4); Audio.vib([10, 30, 10]); }
  function lumiMood(m, s) { lumi.mood = m; lumi.moodT = s; }

  // ---------------------------------------------------------------- fx (pooled arrays, hard caps)
  function spawn(x, y, o) {
    if (particles.length > 420) particles.shift();
    particles.push(Object.assign({ x, y, vx: 0, vy: 0, size: 4, col: '#fff', kind: 'dot', grav: 0, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 10, grow: 0 }, o, { life: o.life || 1, max: o.life || 1 }));
  }
  function spawnShards(x, y, col, n) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = 120 + Math.random() * 260; spawn(x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.55 + Math.random() * 0.3, size: R * (0.18 + Math.random() * 0.2), col, kind: 'shard', grav: 900 }); } }
  function sparkBurst(x, y, n, col) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = 60 + Math.random() * 200; spawn(x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, size: R * (0.2 + Math.random() * 0.25), col: col || '#fff6b0', kind: 'spark' }); } }
  function addRing(x, y, r, col, life) { if (rings.length < 40) rings.push({ x, y, r, col, life: life || 0.4, max: life || 0.4 }); }
  function addText(x, y, txt, col, scale) { texts.push({ x, y, txt, col, scale: scale || 1, life: 1.3, max: 1.3, big: true }); }
  function addScore(x, y, n, big) { if (texts.length < 30) texts.push({ x, y, txt: '+' + n, col: '#ffffff', scale: big ? 0.85 : 0.55, life: 0.8, max: 0.8 }); }
  function ripple(key) {
    const x0 = G.kx(key), y0 = G.ky(key);
    for (let k = 0; k < disp.length; k++) {
      if (!disp[k] || k === key) continue;
      const dx = G.kx(k) - x0, dy = G.ky(k) - y0, d = Math.hypot(dx, dy);
      if (d < 7) wob[k] = { dx: dx / d, dy: dy / d, t: 0, delay: d * 0.025, amp: 0.28 / (1 + d * 0.6) };
    }
  }
  function popFx(key, cell, i, cmb) {
    const x = kx(key), y = ky(key);
    const col = DATA.COLORS[cell.c] || DATA.COLORS[i % 6];
    addRing(x, y, R * 1.3, col.light, 0.3);
    for (let j = 0; j < 7; j++) { const a = (j / 7) * TAU + Math.random() * 0.5, s = 150 + Math.random() * 180; spawn(x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, size: R * (0.22 + Math.random() * 0.18), col: j % 2 ? col.light : col.base, grav: 300, grow: -1 }); }
    spawn(x, y, { life: 0.22, size: R * 1.05, col: col.light, kind: 'pop' });
    Audio.play('pop', i, cmb);
  }
  function hitFx(key, cell) {
    const x = kx(key), y = ky(key);
    if (cell.t === 's') { spawnShards(x, y, '#9aa3b2', 7); Audio.play('crack'); }
    else if (cell.t === 'rot') { sparkBurst(x, y, 6, '#ffe27a'); Audio.play('crack'); }
    else { spawnShards(x, y, '#c9ced9', 5); Audio.play('chain'); }
    wob[key] = { dx: 0, dy: 1, t: 0, delay: 0, amp: 0.25 };
  }
  function destroyFx(key, cell, cause) {
    const x = kx(key), y = ky(key);
    switch (cell.t) {
      case 's': spawnShards(x, y, '#8d97a8', 14); Audio.play('crack'); score += 50; break;
      case 'rot': spawnShards(x, y, '#f0b429', 12); Audio.play('crack'); score += 60; break;
      case 'x': spawnShards(x, y, '#c38bff', 14); sparkBurst(x, y, 10, '#e6c6ff'); Audio.play('shatter'); score += 80; flyToGoal(x, y, { icon: 'x' }); break;
      case 'st': sparkBurst(x, y, 12, '#ffe27a'); Audio.play('collect'); score += 80; flyToGoal(x, y, { icon: 'st' }); break;
      case 'f': freeButterfly(x, y); Audio.play('rescue'); score += 80; break;
      case 'k': sparkBurst(x, y, 16, '#ffe27a'); Audio.play('unlock'); score += 60; break;
      case 'b': score += 40; break;
      case 'd': spawnShards(x, y, '#5a3a8a', 10); Audio.play('crack'); score += 40; break;
      case 'm': freeCritter(x, y, cell.cr); break;
      case 'ch': spawnShards(x, y, '#c9ced9', 8); if (level.objective.type === 'chains') flyToGoal(x, y, { icon: 'chain' }); break;
      default: {
        const col = DATA.COLORS[cell.c] || DATA.COLORS[0];
        spawnShards(x, y, col.base, 6); spawn(x, y, { life: 0.22, size: R, col: col.light, kind: 'pop' });
        if (cause === 'burn') for (let i = 0; i < 6; i++) spawn(x, y, { vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 120, life: 0.5, size: R * 0.35, col: i % 2 ? '#ffb030' : '#ff5a2a', grow: -1 });
        if (level.objective.type === 'color' && cell.c === level.objective.color) flyToGoal(x, y, { bubble: cell.c });
        score += 10;
      }
    }
  }
  function explodeFx(key) {
    const x = kx(key), y = ky(key);
    addRing(x, y, R * 4.5, '#ffb347', 0.45); addRing(x, y, R * 3, '#fff6b0', 0.35);
    for (let i = 0; i < 30; i++) { const a = Math.random() * TAU, s = 200 + Math.random() * 380; spawn(x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, size: R * (0.3 + Math.random() * 0.4), col: ['#ffb030', '#ff5a2a', '#fff6b0'][i % 3], grow: -1 }); }
    for (let i = 0; i < 8; i++) spawn(x, y, { vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 60, life: 1.1, size: R * 0.9, col: 'rgba(120,110,140,0.5)', kind: 'smoke' });
  }
  function spawnFaller(key, cell, i) { fallers.push({ x: kx(key), y: ky(key), vx: (Math.random() - 0.5) * 120, vy: -120 - Math.random() * 120, cell, rot: 0, vr: (Math.random() - 0.5) * 6, delay: i * 0.018, bounced: false, life: 1 }); }
  function freeCritter(x, y, cr) { flyers.push({ kind: 'critter', cr, x0: x, y0: y, t: 0, dur: 1.25, target: UI.goalPoint() }); Audio.play('rescue'); sparkBurst(x, y, 16); lumiMood('wow', 1.2); score += 150; }
  function freeButterfly(x, y) { flyers.push({ kind: 'butterfly', x0: x, y0: y, t: 0, dur: 1.1, target: UI.goalPoint() }); sparkBurst(x, y, 10, '#ffc6f0'); }
  function flyToGoal(x, y, what) { if (flyers.length < 40) flyers.push(Object.assign({ kind: 'item', x0: x, y0: y, t: 0, dur: 0.75 + Math.random() * 0.2, target: UI.goalPoint() }, what)); }
  const bossY = () => top - R * 2.8;

  async function rotateAnim(e) {
    for (const m of e.moves) disp[m.from] = null;
    const list = e.moves.map((m) => ({ from: m.from, to: m.to, cell: m.cell, t: 0 }));
    movers.push(...list);
    Audio.play('rotate');
    await wait(280);
    for (const m of list) { disp[m.to] = m.cell; movers.splice(movers.indexOf(m), 1); }
  }
  async function bossAttackAnim(e) {
    bossFx.attack = 1; Audio.play('bossRoar'); lumiMood('sad', 1);
    await wait(380);
    e.keys.forEach((k, i) => flyers.push({ kind: 'orb', x0: W / 2, y0: bossY() + R * 1.2, t: -i * 0.06, dur: 0.45, tx: kx(k), ty: ky(k), cell: e.cells[i], attack: e.type }));
    await wait(700 + e.keys.length * 60);
    e.keys.forEach((k, i) => { disp[k] = e.cells[i]; });
    bossFx.attack = 0;
  }
  async function hammerAnim(key) {
    const x = kx(key), y = ky(key);
    flyers.push({ kind: 'hammer', x0: x, y0: y, t: 0, dur: 0.45 });
    await wait(300);
    Audio.play('hammer'); Audio.vib(40); shake = R * 0.6;
    addRing(x, y, R * 2.2, '#ffffff', 0.35);
    await wait(120);
  }

  // ---------------------------------------------------------------- boosters
  function useBooster(id) {
    if (!active || busy || over || paused || (State.s.boosters[id] || 0) <= 0) return false;
    if (id === 'hammer') { bombArmed = false; mode = mode === 'hammer' ? 'aim' : 'hammer'; UI.boosterMode(mode === 'hammer' ? 'hammer' : null); return true; }
    if (id === 'bomb') { mode = 'aim'; bombArmed = !bombArmed; UI.boosterMode(bombArmed ? 'bomb' : null); return true; }
    if (id === 'color') { bombArmed = false; mode = mode === 'color' ? 'aim' : 'color'; UI.boosterMode(mode === 'color' ? 'color' : null, presentColors()); return true; }
    if (id === 'shuffle') { doShuffle(); return true; }
    return false;
  }
  function cancelMode() { mode = 'aim'; bombArmed = false; UI.boosterMode(null); }
  function presentColors() { const out = []; board.colorCounts().forEach((n, i) => { if (n > 0) out.push(i); }); return out; }
  async function hammerAt(x, y) {
    const k = board.hitTest((x - bx) / R, (y - top) / R + scroll, 1.15);
    if (k < 0 || !State.useBooster('hammer')) return;
    mode = 'aim'; UI.boosterMode(null); UI.syncBoosters();
    busy = true; clearHint('hammer');
    await playEvents(board.hammer(k).ev, 1);
    await afterBooster();
  }
  async function colorBlast(c) {
    if (busy || !State.useBooster('color')) return;
    mode = 'aim'; UI.boosterMode(null); UI.syncBoosters();
    busy = true;
    await playEvents(board.colorBlast(c).ev, 1);
    await afterBooster();
  }
  async function doShuffle() {
    if (!State.useBooster('shuffle')) return;
    UI.syncBoosters();
    busy = true;
    const res = board.shuffle();
    Audio.play('magic'); flash = 0.25;
    for (const k of res.ev[0].keys) { wob[k] = { dx: 0, dy: -1, t: 0, delay: Math.random() * 0.2, amp: 0.4 }; sparkBurst(kx(k), ky(k), 1); }
    await wait(250);
    syncDisp();
    if (ammo[0].t === 'color' && !board.hasColor(ammo[0].c)) ammo[0] = nextAmmo();
    busy = false;
  }
  async function afterBooster() {
    syncDisp(); UI.syncGameHud();
    if (ammo[0] && ammo[0].t === 'color' && !board.hasColor(ammo[0].c) && board.colorCounts().some((n) => n > 0)) ammo[0] = { t: 'color', c: board.nextColor() };
    if (board.progress().done) { await winSequence(); return; }
    busy = false;
  }

  // ---------------------------------------------------------------- end of level
  async function winSequence() {
    over = true; busy = true;
    lumiMood('wow', 99);
    await wait(250);
    addText(W / 2, top + viewU * R * 0.4, t('levelComplete'), '#ffe27a', 1.7);
    Audio.play('win');
    await wait(900);
    // Bonus Blast: leftover moves become fireworks that add score. Tap = fast-forward.
    const n = Math.min(moves, 15);
    if (n > 0) {
      addText(W / 2, top + viewU * R * 0.55, t('bonusBlast'), '#9dff7a', 1.2);
      for (let i = 0; i < n; i++) {
        rockets.push({ x0: shooterX, y0: shooterY, tx: bx + (2 + Math.random() * 18) * R, ty: top + (2 + Math.random() * Math.min(viewU, 20)) * R, t: 0, dur: 0.45 });
        moves--; score += 150; UI.syncGameHud();
        Audio.play('shoot');
        await wait(150);
      }
      await wait(600);
    }
    finish(true);
  }
  function finish(won) {
    const s = board.stats, s0 = stats0;
    for (const k of ['popped', 'dropped', 'specials', 'rescued']) State.track(k, s[k] - s0[k]);
    stats0 = JSON.parse(JSON.stringify(s));
    skipFast = false;
    if (won) UI.levelWon({ level, stars: Levels.starsFor(level, movesUsed), score });
  }
  function continueWith(extra) { moves += extra; continues++; over = false; busy = false; lumiMood('happy', 1); UI.syncGameHud(); Audio.play('magic'); }
  function giveUp() { finish(false); active = false; }

  // ---------------------------------------------------------------- update
  function update(dt) {
    if (!active || paused) return;
    clock += dt * 1000;
    for (let i = timers.length - 1; i >= 0; i--) if (timers[i].t <= clock) { const tm = timers.splice(i, 1)[0]; tm.res(); }
    if (projectile) stepProjectile(dt);
    scroll += (computeScroll() - scroll) * Math.min(1, dt * 4);
    for (const p of particles) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
    particles = particles.filter((p) => p.life > 0);
    for (const r of rings) r.life -= dt;
    rings = rings.filter((r) => r.life > 0);
    for (const tx of texts) { tx.life -= dt; tx.y -= (tx.big ? 18 : 55) * dt; }
    texts = texts.filter((x) => x.life > 0);
    for (const f of fallers) {
      if (f.delay > 0) { f.delay -= dt; continue; }
      f.vy += 1500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
      if (!f.bounced && f.y > shooterY - R) {
        f.bounced = true; f.vy *= -0.35; f.vx *= 1.4;
        Audio.play('drop', Math.floor(Math.random() * 5));
        const c = f.cell;
        if (c.t === 'm') { freeCritter(f.x, f.y, c.cr); f.life = 0; }
        else if (c.t === 'st') { flyToGoal(f.x, f.y, { icon: 'st' }); Audio.play('collect'); f.life = 0; }
        else if (c.t === 'f') { freeButterfly(f.x, f.y); f.life = 0; }
        else if (c.t === 'x') { flyToGoal(f.x, f.y, { icon: 'x' }); f.life = 0; }
        else if (c.t === 'k') f.life = 0;
        else if (level.objective.type === 'color' && c.c === level.objective.color) flyToGoal(f.x, f.y, { bubble: c.c });
      }
      if (f.bounced) f.life -= dt * 1.6;
    }
    fallers = fallers.filter((f) => f.life > 0 && f.y < H + R * 3);
    for (const f of flyers) { f.t += dt; if (f.t >= f.dur && !f.done) { f.done = true; onFlyerArrive(f); } }
    flyers = flyers.filter((f) => !f.done);
    for (const m of movers) m.t = Math.min(1, m.t + dt / 0.28);
    for (const k in land) { land[k] -= dt * 4; if (land[k] <= 0) delete land[k]; }
    for (const k in wob) { const w = wob[k]; w.t += dt; if (w.t - w.delay > 0.5) delete wob[k]; }
    for (const r of rockets) {
      r.t += dt;
      if (r.t >= r.dur && !r.done) {
        r.done = true;
        const col = DATA.COLORS[Math.floor(Math.random() * 6)];
        for (let i = 0; i < 18; i++) { const a = (i / 18) * TAU, s = 150 + Math.random() * 150; spawn(r.tx, r.ty, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.7, size: R * 0.25, col: i % 2 ? col.light : col.base, kind: 'spark', grav: 200 }); }
        addScore(r.tx, r.ty, 150, true); Audio.play('pop', Math.floor(Math.random() * 8), 2);
      }
    }
    rockets = rockets.filter((r) => !r.done);
    shake = Math.max(0, shake - dt * R * 3);
    flash = Math.max(0, flash - dt * 1.5);
    recoil = Math.max(0, recoil - dt * 6);
    swapAnim = Math.max(0, swapAnim - dt * 5);
    bossFx.hit = Math.max(0, bossFx.hit - dt * 3);
    if (bossFx.dead > 0) bossFx.dead = Math.min(1, bossFx.dead + dt * 1.2);
    for (const d of bossFx.dmg) d.life -= dt;
    bossFx.dmg = bossFx.dmg.filter((d) => d.life > 0);

    if (!from || !to || !from.isConnected) return Promise.resolve();
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    const n = Math.min(count || 5, 10), src = Art.icon(iconName, 48), jobs = [];
    for (let i = 0; i < n; i++) {
      const im = el('img'); im.src = src;
      const x0 = a.left + a.width / 2 - 18 + (Math.random() - 0.5) * 40, y0 = a.top + a.height / 2 - 18 + (Math.random() - 0.5) * 30;
      const x1 = b.left + b.width / 2 - 18, y1 = b.top + b.height / 2 - 18;
      im.style.left = x0 + 'px'; im.style.top = y0 + 'px';
      $('#fly').appendChild(im);
      const anim = im.animate([
        { transform: 'translate(0,0) scale(0.4)', opacity: 0 },
        { transform: `translate(${(Math.random() - 0.5) * 60}px, ${-30 - Math.random() * 30}px) scale(1.15)`, opacity: 1, offset: 0.25 },
        { transform: `translate(${x1 - x0}px, ${y1 - y0}px) scale(0.7)`, opacity: 1 },
      ], { duration: 700 + i * 60, easing: 'cubic-bezier(.55,.05,.7,.95)', delay: i * 55, fill: 'forwards' });
      jobs.push(new Promise((res) => { anim.onfinish = () => { im.remove(); to.classList.remove('bump'); void to.offsetWidth; to.classList.add('bump'); Audio.play(iconName === 'coin' ? 'coin' : 'collect', i); res(); }; }));
    }
    return Promise.all(jobs);
  }

  // ---------------------------------------------------------------- modal system
  const stack = [];
  function modal(opt) {
    const root = el('div'); root.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
    const bd = el('div', 'backdrop'); root.appendChild(bd);
    const wrap = el('div', 'modal-wrap'); root.appendChild(wrap);
    const m = el('div', 'modal ' + (opt.cls || '')); wrap.appendChild(m);
    const panel = el('div', 'panel'); m.appendChild(panel);
    if (opt.title) { const hd = el('div', 'panel-head'); hd.appendChild(el('div', 'ribbon', esc(opt.title))); panel.appendChild(hd); }
    else panel.style.paddingTop = '22px';
    let resolveFn;
    const done = new Promise((r) => { resolveFn = r; });
    const api = {
      root, panel, done,
      close(v) {
        if (api.closed) return; api.closed = true;
        Audio.play('close');
        stack.splice(stack.indexOf(api), 1);
        m.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.85)', opacity: 0 }], { duration: 160, easing: 'ease-in', fill: 'forwards' });
        bd.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: 'forwards' });
        setTimeout(() => root.remove(), 170);
        if (opt.onClose) opt.onClose(v);
        resolveFn(v);
      },
    };
    if (opt.close !== false) {
      tap(panel.appendChild(el('button', 'close-x', '×')), () => api.close(null), false);
      if (opt.tapOutside !== false) bd.addEventListener('click', () => api.close(null));
    }
    if (opt.body) opt.body(panel, api);
    $('#modals').appendChild(root);
    stack.push(api);
    Audio.play('open');
    return api;
  }

  // ---------------------------------------------------------------- small canvas art in panels
  function artCanvas(w, h, draw) {

  }

  // ================================================================ STORY DIALOGS
  const storyQ = [];
  let storyBusy = false;
  function story(key) {
    const lines = DATA.STORY[key];
    if (!lines || State.s.seen[key]) return Promise.resolve();
    State.s.seen[key] = 1; State.persist();
    return new Promise((resolve) => { storyQ.push({ lines, resolve }); if (!storyBusy) runStory(); });
  }
  async function runStory() {
    storyBusy = true;
    while (storyQ.length) {
      const { lines, resolve } = storyQ.shift();
      const shade = el('div'); shade.id = 'storyShade'; document.body.appendChild(shade);
      const box = el('div'); box.id = 'story'; document.body.appendChild(box);
      for (const line of lines) {
        const ch = DATA.CHARACTERS[line.who];
        box.innerHTML = '';
        const dlg = el('div', 'dlg');
        const who = animCanvas(108, 120, (g, w, h, tt) => Art.character(g, w / 2, h / 2 + 10, 96, line.who, { t: tt, mood: 'talk', blink: Math.sin(tt * 1.5) > 0.97, redeemed: line.who === 'murk' && State.s.best[160] > 0 }));
        who.className = 'who';
        dlg.appendChild(who);
        dlg.appendChild(el('div', 'name', esc(L(ch.name))));
        const txt = dlg.appendChild(el('div', 'txt', ''));
        dlg.appendChild(el('div', 'tap', esc(t('tapToContinue'))));
        box.appendChild(dlg);
        const full = I18N.lang === 'uk' ? line.uk : line.en;
        await new Promise((res) => {
          let i = 0, finished = false;
          const typer = setInterval(() => {
            i += 2; txt.textContent = full.slice(0, i);
            if (i % 6 === 0) Audio.play('talk');
            if (i >= full.length) { clearInterval(typer); finished = true; }
          }, 22);
          const onTap = (e) => {
            e.stopPropagation();
            if (!finished) { clearInterval(typer); txt.textContent = full; finished = true; return; }
            box.removeEventListener('click', onTap); shade.removeEventListener('click', onTap); res();
          };
          box.addEventListener('click', onTap); shade.addEventListener('click', onTap);
        });
        Audio.play('click');
      }
      box.remove(); shade.remove();
      resolve();
    }
    storyBusy = false;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (Screens.current === 'game') { Game.update(dt); Game.draw(ctx); }
    else if (Screens.current === 'home') Screens.drawHome(ctx, dt);
    hudTimer += dt;
    if (hudTimer > 1) { hudTimer = 0; if (Screens.current === 'home') Screens.syncHome(); }
    requestAnimationFrame(frame);
  }

  // Leaving the app mid-level pauses it (the life is already committed).
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { State.persist(true); if (Screens.current === 'game' && Game.active && !Game.over && !Game.paused) UI.pause(); }
    else { State.tickLives(); State.ensureQuests(); State.ensureWeek(); Screens.syncHome(); }
  });
  window.addEventListener('pagehide', () => State.persist(true));
  window.addEventListener('resize', resize);

  async function boot() {
    State.load();
    document.documentElement.lang = I18N.lang;
    resize();
    UI.buildGameHud();
    Screens.buildHomeHud();
    requestAnimationFrame(frame);
    // Kick off icon decoding so the first frames are crisp.
    for (const n of ['hammer', 'lock', 'star', 'cell_ch']) UI.iconImg(n);
    if (document.fonts && document.fonts.load) { try { await Promise.race([document.fonts.load('900 20px Nunito'), new Promise((r) => setTimeout(r, 800))]); } catch (e) { /* fallback font */ } }
    await Screens.splash();
    Audio.init();
    if (!State.s.introSeen) {
      await Screens.intro();
      Screens.show('home');
      UI.openLevel(1);
      return;
    }
    Screens.show('home');
    if (State.dailyAvailable()) await UI.daily();
    Screens.pointAtRestore();
  }
  boot();
})();

</script>
</body>
</html>
