<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Mobile-first viewport: lock scaling, respect device notches via
    viewport-fit=cover so the canvas can extend under the safe-area insets.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#05010f" />
  <meta name="description" content="Cosmic Drift — a premium cosmic shape-placement puzzle." />
  <title>Cosmic Drift</title>
  <style>
    /*
      Global reset + full-bleed layout. The game renders entirely to a single
      <canvas>; the Canvas core class letterboxes the fixed design resolution
      to fit any screen, so CSS only needs to provide a black, non-scrolling,
      gesture-free stage.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      background: #05010f;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;          /* disable native pan/zoom gestures */
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: block;
      /* Extend into the safe area; the game keeps content within its margins. */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game { display: block; }
  </style>
</head>
<body>
  <!-- The Canvas core class sizes and positions this element every resize. -->
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
