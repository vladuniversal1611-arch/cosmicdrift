<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1033">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mystic Relics — magic tile puzzle</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Живий анімований фон: паралакс, світлячки, туман, листя -->
  <div id="bg"></div>
  <canvas id="bgFx"></canvas>
  <div id="vignette"></div>

  <!-- ==================== ГОЛОВНЕ МЕНЮ ==================== -->
  <div id="mainScreen" class="screen active">
    <header class="topbar">
      <div class="currency" id="curCoins"><span class="cur-ico">🪙</span><b>0</b><button class="plus" data-shop="coins">+</button></div>
      <div class="currency" id="curGems"><span class="cur-ico">💜</span><b>0</b><button class="plus" data-shop="gems">+</button></div>
      <button class="icon-btn" id="btnSettings">⚙️</button>
    </header>

    <div class="logo">
      <div class="logo-gem">🔮</div>
      <h1>Mystic<br>Relics</h1>
    </div>

    <div class="menu-center">
      <button class="btn-3d btn-green btn-big" id="btnPlay"><span data-i18n="level">Level</span> <span id="playLevelNum">1</span></button>
      <div class="menu-side">
        <button class="side-btn" id="btnDaily"><span>🎁</span><span class="lbl" data-i18n="daily_rewards">Daily rewards</span><i class="badge" id="dailyBadge"></i></button>
        <button class="side-btn" id="btnWheel"><span>🎡</span><span class="lbl" data-i18n="wheel_btn">Wheel of Fortune</span><i class="badge" id="wheelBadge"></i></button>
        <button class="side-btn" id="btnMissions"><span>📜</span><span class="lbl" data-i18n="missions">Missions</span></button>
        <button class="side-btn" id="btnChests"><span>🧰</span><span class="lbl" data-i18n="chests_btn">Chests</span><i class="badge" id="chestBadge"></i></button>
      </div>
    </div>

    <nav class="bottom-nav">
      <button data-nav="shop"><span>🏪</span><span data-i18n="shop">Shop</span></button>
      <button data-nav="collection"><span>🎴</span><span data-i18n="collection">Collection</span></button>
      <button class="nav-main" data-nav="main"><span>🏰</span><span data-i18n="home">Home</span></button>
      <button data-nav="achievements"><span>🏆</span><span data-i18n="achievements">Achievements</span><i class="badge" id="achBadge"></i></button>
      <button data-nav="profile"><span>🧙</span><span data-i18n="profile">Profile</span></button>
    </nav>
  </div>

  <!-- ==================== КАРТА РІВНІВ ==================== -->
  <div id="levelsScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon" data-i18n="level_map">Level map</h2>
      <div class="currency"><span class="cur-ico">⭐</span><b id="starsTotal">0</b></div>
    </header>
    <div class="page-nav">
      <button id="lvlPrev" class="icon-btn">◀</button>
      <span id="lvlPageLabel"></span>
      <button id="lvlNext" class="icon-btn">▶</button>
    </div>
    <div id="levelGrid" class="scroll"></div>
  </div>

  <!-- ==================== ГРА ==================== -->
  <div id="gameScreen" class="screen">
    <header class="game-hud">
      <button class="icon-btn" id="btnPause">⏸️</button>
      <div class="hud-center">
        <div class="hud-level"><span data-i18n="level">Level</span> <b id="hudLevel">1</b> <em id="hudStars">★★★</em></div>
        <div class="hud-timer" id="hudTimer">⏱️ 05:00</div>
      </div>
      <div class="hud-right">
        <div class="hud-pill" id="hudCoins">🪙 <b>0</b></div>
        <div class="hud-pill" id="hudGems">💜 <b>0</b></div>
        <div class="hud-pill" id="hudScorePill">⭐ <b id="hudScore">0</b></div>
        <div class="hud-pill">❤️ <b>∞</b></div>
      </div>
    </header>
    <!-- Прогрес рівня: скільки плиток уже зібрано -->
    <div class="progress-wrap"><i id="progressFill"></i></div>
    <div id="comboPopup"></div>
    <div id="fxBar"></div>
    <div class="board-wrap">
      <canvas id="gameCanvas"></canvas>
      <!-- Заставка «Рівень N — ВПЕРЕД!» -->
      <div id="levelIntro"><b id="introLevel"></b><span id="introGo"></span></div>
      <!-- Міні-туторіал для нових гравців -->
      <div id="tutorialBox" class="glass"></div>
      <div id="tutorialHand">👆</div>
      <!-- Бустери по боках поля: ліворуч 3, праворуч 2 -->
      <div class="booster-side left" id="boosterLeft"></div>
      <div class="booster-side right" id="boosterRight"></div>
    </div>
    <!-- Зарезервоване місце під AdMob банер (320×50) -->
    <div id="adBanner" data-i18n="ad_banner">Ad space · AdMob Banner</div>
  </div>

  <!-- ==================== МАГАЗИН ==================== -->
  <div id="shopScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon" data-i18n="shop">Shop</h2>
      <div class="currency"><span class="cur-ico">🪙</span><b class="coinsVal">0</b></div>
    </header>
    <div class="tabs" id="shopTabs">
      <button data-tab="coins" class="active" data-i18n="tab_coins">Coins</button>
      <button data-tab="gems" data-i18n="tab_gems">Gems</button>
      <button data-tab="boosters" data-i18n="tab_boosters">Boosters</button>
      <button data-tab="themes" data-i18n="tab_themes">Themes</button>
      <button data-tab="premium" data-i18n="tab_premium">Premium</button>
    </div>
    <div id="shopContent" class="scroll"></div>
  </div>

  <!-- ==================== ЩОДЕННІ НАГОРОДИ / МІСІЇ ==================== -->
  <div id="dailyScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon" data-i18n="daily_title">Daily rewards</h2>
      <span></span>
    </header>
    <div class="scroll">
      <div id="calendar" class="calendar glass"></div>
      <button class="btn-3d btn-green" id="btnClaimDaily" data-i18n="claim">Claim</button>
      <h3 class="section-title" data-i18n="daily_missions">Daily missions</h3>
      <div id="missionList"></div>
    </div>
  </div>

  <!-- ==================== ДОСЯГНЕННЯ ==================== -->
  <div id="achievementsScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon" data-i18n="achievements">Achievements</h2>
      <span id="achCount"></span>
    </header>
    <div id="achList" class="scroll"></div>
  </div>

  <!-- ==================== КОЛЕКЦІЯ ==================== -->
  <div id="collectionScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon" data-i18n="collection">Collection</h2>
      <span id="collCount"></span>
    </header>
    <div id="collGrid" class="coll-grid scroll"></div>
  </div>

  <!-- ==================== ПРОФІЛЬ ==================== -->
  <div id="profileScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon" data-i18n="profile">Profile</h2>
      <span></span>
    </header>
    <div id="profileContent" class="scroll"></div>
  </div>

  <!-- ==================== СКРИНІ ==================== -->
  <div id="chestsScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon" data-i18n="chests_title">Chests</h2>
      <span></span>
    </header>
    <div id="chestGrid" class="chest-grid scroll"></div>
  </div>

  <!-- ==================== МОДАЛЬНІ ВІКНА / ТОСТИ ==================== -->
  <div id="modalOverlay" class="modal-overlay">
    <div id="modalBox" class="modal-box glass"></div>
  </div>
  <div id="toasts"></div>

  <!-- Порядок підключення важливий -->
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/background.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/board.js"></script>
  <script src="js/boosters.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
