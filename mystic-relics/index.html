<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1033">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mystic Relics — магічна головоломка</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Живий анімований фон: паралакс, світлячки, туман, листя -->
  <div id="bg"></div>
  <canvas id="bgFx"></canvas>
  <div id="vignette"></div>

  <!-- ==================== ГОЛОВНЕ МЕНЮ ==================== -->
  <div id="mainScreen" class="screen active">
    <header class="topbar">
      <div class="currency" id="curCoins"><span class="cur-ico">🪙</span><b>0</b><button class="plus" data-shop="coins">+</button></div>
      <div class="currency" id="curGems"><span class="cur-ico">💜</span><b>0</b><button class="plus" data-shop="gems">+</button></div>
      <button class="icon-btn" id="btnSettings">⚙️</button>
    </header>

    <div class="logo">
      <div class="logo-gem">🔮</div>
      <h1>Mystic<br>Relics</h1>
    </div>

    <div class="menu-center">
      <button class="btn-3d btn-green btn-big" id="btnPlay">Рівень <span id="playLevelNum">1</span></button>
      <div class="menu-side">
        <button class="side-btn" id="btnDaily"><span>🎁</span>Щоденні<br>нагороди<i class="badge" id="dailyBadge"></i></button>
        <button class="side-btn" id="btnWheel"><span>🎡</span>Колесо<br>фортуни<i class="badge" id="wheelBadge"></i></button>
        <button class="side-btn" id="btnMissions"><span>📜</span>Місії</button>
        <button class="side-btn" id="btnChests"><span>🧰</span>Скрині<i class="badge" id="chestBadge"></i></button>
      </div>
    </div>

    <nav class="bottom-nav">
      <button data-nav="shop"><span>🏪</span>Магазин</button>
      <button data-nav="collection"><span>🎴</span>Колекція</button>
      <button class="nav-main" data-nav="main"><span>🏰</span>Головна</button>
      <button data-nav="achievements"><span>🏆</span>Досягнення<i class="badge" id="achBadge"></i></button>
      <button data-nav="profile"><span>🧙</span>Профіль</button>
    </nav>
  </div>

  <!-- ==================== КАРТА РІВНІВ ==================== -->
  <div id="levelsScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon">Карта рівнів</h2>
      <div class="currency"><span class="cur-ico">⭐</span><b id="starsTotal">0</b></div>
    </header>
    <div class="page-nav">
      <button id="lvlPrev" class="icon-btn">◀</button>
      <span id="lvlPageLabel"></span>
      <button id="lvlNext" class="icon-btn">▶</button>
    </div>
    <div id="levelGrid" class="level-grid scroll"></div>
  </div>

  <!-- ==================== ГРА ==================== -->
  <div id="gameScreen" class="screen">
    <header class="game-hud">
      <button class="icon-btn" id="btnPause">⏸️</button>
      <div class="hud-center">
        <div class="hud-level">Рівень <b id="hudLevel">1</b></div>
        <div class="hud-timer" id="hudTimer">⏱️ 05:00</div>
      </div>
      <div class="hud-right">
        <div class="hud-pill" id="hudCoins">🪙 <b>0</b></div>
        <div class="hud-pill" id="hudGems">💜 <b>0</b></div>
        <div class="hud-pill" id="hudScorePill">⭐ <b id="hudScore">0</b></div>
        <div class="hud-pill">❤️ <b>∞</b></div>
      </div>
    </header>
    <div id="comboPopup"></div>
    <div id="fxBar"></div>
    <div class="board-wrap"><canvas id="gameCanvas"></canvas></div>
    <div class="booster-bar" id="boosterBar"></div>
  </div>

  <!-- ==================== МАГАЗИН ==================== -->
  <div id="shopScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon">Магазин</h2>
      <div class="currency"><span class="cur-ico">🪙</span><b class="coinsVal">0</b></div>
    </header>
    <div class="tabs" id="shopTabs">
      <button data-tab="coins" class="active">Монети</button>
      <button data-tab="gems">Кристали</button>
      <button data-tab="boosters">Бустери</button>
      <button data-tab="themes">Теми</button>
      <button data-tab="premium">Преміум</button>
    </div>
    <div id="shopContent" class="scroll"></div>
  </div>

  <!-- ==================== ЩОДЕННІ НАГОРОДИ / МІСІЇ ==================== -->
  <div id="dailyScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon">Щоденні нагороди</h2>
      <span></span>
    </header>
    <div class="scroll">
      <div id="calendar" class="calendar glass"></div>
      <button class="btn-3d btn-green" id="btnClaimDaily">Отримати</button>
      <h3 class="section-title">Щоденні місії</h3>
      <div id="missionList"></div>
    </div>
  </div>

  <!-- ==================== ДОСЯГНЕННЯ ==================== -->
  <div id="achievementsScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon">Досягнення</h2>
      <span id="achCount"></span>
    </header>
    <div id="achList" class="scroll"></div>
  </div>

  <!-- ==================== КОЛЕКЦІЯ ==================== -->
  <div id="collectionScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon">Колекція</h2>
      <span id="collCount"></span>
    </header>
    <div id="collGrid" class="coll-grid scroll"></div>
  </div>

  <!-- ==================== ПРОФІЛЬ ==================== -->
  <div id="profileScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon">Профіль</h2>
      <span></span>
    </header>
    <div id="profileContent" class="scroll"></div>
  </div>

  <!-- ==================== СКРИНІ ==================== -->
  <div id="chestsScreen" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h2 class="ribbon">Скрині</h2>
      <span></span>
    </header>
    <div id="chestGrid" class="chest-grid scroll"></div>
  </div>

  <!-- ==================== МОДАЛЬНІ ВІКНА / ТОСТИ ==================== -->
  <div id="modalOverlay" class="modal-overlay">
    <div id="modalBox" class="modal-box glass"></div>
  </div>
  <div id="toasts"></div>

  <!-- Порядок підключення важливий -->
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/background.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/board.js"></script>
  <script src="js/boosters.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
