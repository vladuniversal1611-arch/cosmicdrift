    this._rr(g, 1, -1, w + 1, h + 1.6, r); g.stroke();
    g.restore();

    // Глянцевий відблиск-дуга у верхній частині
    const gloss = g.createLinearGradient(0, 0, 0, h * 0.42);
    gloss.addColorStop(0, 'rgba(255,255,255,0.55)');
    gloss.addColorStop(1, 'rgba(255,255,255,0.02)');
    g.fillStyle = gloss;
    g.beginPath();
    g.moveTo(r * 0.6, 2);
    g.lineTo(w - r * 0.6, 2);
    g.quadraticCurveTo(w - 3, 2, w - 3, r);
    g.quadraticCurveTo(w * 0.72, h * 0.4, w * 0.5, h * 0.42);
    g.quadraticCurveTo(w * 0.26, h * 0.44, 3, r * 1.2);
    g.quadraticCurveTo(3, 2, r * 0.6, 2);
    g.fill();
    // Маленький круглий блік у куті
    g.fillStyle = 'rgba(255,255,255,0.8)';
    g.beginPath(); g.ellipse(w * 0.2, h * 0.12, w * 0.07, w * 0.045, -0.5, 0, Math.PI * 2); g.fill();

    // Контур
    g.strokeStyle = 'rgba(105,80,45,0.5)';
    g.lineWidth = 1.4;
    this._rr(g, 0, 0, w, h, r); g.stroke();

    // Гліф: PNG-спрайт (якщо доданий у assets/tiles) або emoji з тінню
    if (type >= 0) {
      g.shadowColor = 'rgba(60,30,0,0.35)';
      g.shadowBlur = 3; g.shadowOffsetY = 2;
      if (Assets.hasTile(type)) {
        const iw = w * 0.72;
        g.drawImage(Assets.tiles[type], (w - iw) / 2, (h - iw) / 2 + h * 0.02, iw, iw);
      } else {
        g.font = `${Math.round(w * 0.6)}px "Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(CFG.TILES[type].g, w / 2, h / 2 + h * 0.04);
      }
      g.shadowBlur = 0; g.shadowOffsetY = 0;
    } else {
      // Райдужний джокер
      const rg = g.createLinearGradient(0, 0, w, h);
      ['#f87171', '#fbbf24', '#4ade80', '#60a5fa', '#c084fc'].forEach((col, i, a) => rg.addColorStop(i / (a.length - 1), col));
      g.fillStyle = rg;
      this._rr(g, 4, 4, w - 8, h - 8, r - 3); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)';
      this._rr(g, 6, 6, w - 12, h * 0.3, r - 4); g.fill();
      g.font = `${Math.round(w * 0.5)}px sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('🌈', w / 2, h / 2);
    }
    this.spriteCache.set(key, c);
    return c;
  },

  drawTile(ctx, t, inTray = false) {
    const size = inTray && t.state === 'tray' ? this.traySlots[0].w : this.tileW;
    const h = size * 1.22;
    let sc = t.scale < 1 ? Utils.easeOutBack(t.scale) : 1;
    // Політ у панель: плитка «підстрибує» масштабом на старті
    if (t.state === 'fly') sc *= 1.22 - 0.22 * Math.min(1, t.flyT);
    const shakeX = t.shake > 0 ? Math.sin(t.shake * 60) * 4 : 0;
    // Поява: плитка падає згори на своє місце
    const dropY = t.scale < 1 && t.state === 'board' ? -(1 - Utils.easeOutCubic(t.scale)) * 44 : 0;
    // Squash-and-stretch при посадці у панель
    let sx = 1, sy = 1;
    if (t.squashT > 0) {
      const e = Math.sin((t.squashT / 0.22) * Math.PI);
      sx = 1 + 0.2 * e; sy = 1 - 0.2 * e;
    }

    ctx.save();
    ctx.translate(t.px + shakeX, t.py + dropY);
    ctx.scale(sc * sx, sc * sy);

    // Тінь на полі
    if (t.state === 'board') {
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(2, h / 2 + 2, size / 2, size / 6, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const spr = this.sprite(t.rainbow ? -1 : t.type, size);
    ctx.drawImage(spr, -size / 2 - 4, -h / 2 - 4, size + 8, h + 8);

    // Затемнення закритих плиток
    if (t.state === 'board' && !t.open) {
      ctx.fillStyle = 'rgba(10,10,30,0.4)';
      this._rr(ctx, -size / 2, -h / 2, size, h, 9); ctx.fill();
    }

    // Блиск-пробіг: діагональна світла смуга ковзає по плитці
    if (t.shimmerT > 0 && t.state === 'board' && t.open) {
      const p = 1 - t.shimmerT / 0.7;
      ctx.save();
      this._rr(ctx, -size / 2, -h / 2, size, h, 9);
      ctx.clip();
      ctx.globalAlpha = 0.5 * Math.sin(p * Math.PI);
      ctx.rotate(-0.5);
      const bx = -size + p * size * 2.2;
      const grad = ctx.createLinearGradient(bx - size * 0.18, 0, bx + size * 0.18, 0);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(0.5, 'rgba(255,255,255,0.9)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(bx - size * 0.2, -h, size * 0.4, h * 2);
      ctx.restore();
    }

    // Перепони
    if (t.obst && t.state === 'board') this.drawObstacle(ctx, t, size, h);
    if (t.isKey && t.state !== 'gone') {
      ctx.font = `${size * 0.3}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('🗝️', size * 0.28, -h * 0.3);
    }
    if (t.portal && t.state === 'board') {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
      ctx.font = `${size * 0.3}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('🌀', -size * 0.28, -h * 0.3);
      ctx.globalAlpha = 1;
    }
    // Проклята у панелі — пульсує
    if (t.obst && t.obst.kind === 'curse' && t.state === 'tray' && !t.cursed) {
      ctx.strokeStyle = `rgba(180,60,220,${0.5 + 0.5 * Math.sin(performance.now() / 200)})`;
      ctx.lineWidth = 3;
      this._rr(ctx, -size / 2, -h / 2, size, h, 9); ctx.stroke();
    }

    // Підсвітка підказки
    if (t.hintT > 0) {
      ctx.strokeStyle = `rgba(255,224,102,${0.4 + 0.6 * Math.sin(performance.now() / 120)})`;
      ctx.lineWidth = 4;
      this._rr(ctx, -size / 2 - 3, -h / 2 - 3, size + 6, h + 6, 11); ctx.stroke();
      if (Math.random() < 0.15) Particles.sparkle(t.px, t.py);
    }
    ctx.restore();
  },

  drawObstacle(ctx, t, size, h) {
    const o = t.obst;
    if (o.kind === 'ice' && o.hp > 0) {
      ctx.fillStyle = o.hp > 1 ? 'rgba(140,210,255,0.55)' : 'rgba(140,210,255,0.28)';
      this._rr(ctx, -size / 2, -h / 2, size, h, 9); ctx.fill();
      if (o.hp === 1) { // тріщини
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-size * 0.3, -h * 0.2); ctx.lineTo(0, 0); ctx.lineTo(size * 0.25, -h * 0.35);
        ctx.moveTo(0, 0); ctx.lineTo(size * 0.1, h * 0.3);
        ctx.stroke();
      }
      ctx.font = `${size * 0.26}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('🧊', -size * 0.28, -h * 0.3);
    } else if (o.kind === 'chain' && o.counter > 0) {
      ctx.strokeStyle = 'rgba(70,70,90,0.9)'; ctx.lineWidth = size * 0.09;
      ctx.beginPath();
      ctx.moveTo(-size / 2, -h * 0.18); ctx.lineTo(size / 2, h * 0.1);
      ctx.moveTo(-size / 2, h * 0.22); ctx.lineTo(size / 2, -h * 0.12);
      ctx.stroke();
      ctx.font = `${size * 0.28}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('⛓️', 0, h * 0.02);
    } else if (o.kind === 'stone' && o.counter > 0) {
      ctx.fillStyle = 'rgba(105,100,95,0.88)';
      this._rr(ctx, -size / 2, -h / 2, size, h, 9); ctx.fill();
      ctx.font = `${size * 0.4}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🪨', 0, 0);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${size * 0.24}px sans-serif`;
      ctx.fillText(o.counter, size * 0.3, -h * 0.32);
    } else if (o.kind === 'lock' && !this.keysCollected) {
      ctx.fillStyle = 'rgba(40,30,20,0.55)';
      this._rr(ctx, -size / 2, -h / 2, size, h, 9); ctx.fill();
      ctx.font = `${size * 0.42}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🔒', 0, 0);
    } else if (o.kind === 'fog' && !t.open) {
      ctx.fillStyle = 'rgba(30,25,50,0.92)';
      this._rr(ctx, -size / 2, -h / 2, size, h, 9); ctx.fill();
      ctx.fillStyle = 'rgba(200,190,255,0.8)';
      ctx.font = `bold ${size * 0.5}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', 0, 0);
    } else if (o.kind === 'curse' && t.state === 'board') {
      ctx.font = `${size * 0.28}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('☠️', size * 0.26, -h * 0.3);
    }
  },

  drawMerge(ctx, t) {
    // Фаза 1 (0–0.55): плитки злітаються у центр, обертаючись і збільшуючись.
    // Фаза 2 (0.55–1): стискаються та спалахують перед вибухом.
    const p = Math.min(1, t.mergeT / 0.42);
    const size = this.traySlots[0].w;
    const fly = Math.min(1, p / 0.55);
    const e = Utils.easeInCubic(fly);
    const x = Utils.lerp(t.mergeFrom.x, t.mergeTo.x, e);
    const y = Utils.lerp(t.mergeFrom.y, t.mergeTo.y, e) - Math.sin(fly * Math.PI) * 26;
    const squeeze = p > 0.55 ? (p - 0.55) / 0.45 : 0;
    const sc = (1 + fly * 0.35) * (1 - squeeze * 0.5);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t.mergeSpin * p);
    ctx.scale(sc, sc);
    // Спалах перед вибухом
    if (squeeze > 0) {
      ctx.globalAlpha = squeeze * 0.8;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, size * (0.7 + squeeze * 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1 - squeeze * 0.55;
    }
    const spr = this.sprite(t.rainbow ? -1 : t.type, size);
    ctx.drawImage(spr, -size / 2 - 6, -size * 0.61 - 6, size + 12, size * 1.22 + 12);
    ctx.restore();
    ctx.globalAlpha = 1;
  },

  /* ---------------- Допоміжні ---------------- */
  _rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },

  _shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Utils.clamp((n >> 16) + amt, 0, 255);
    const g = Utils.clamp(((n >> 8) & 255) + amt, 0, 255);
    const b = Utils.clamp((n & 255) + amt, 0, 255);
    return `rgb(${r},${g},${b})`;
  }
};

// === js/boosters.js ===
/* ============================================================
 * Mystic Relics — boosters.js
 * Активація бустерів під час гри. Кількість зберігається
 * у Storage.data.boosters; купівля — у магазині.
 * ============================================================ */
'use strict';

const Boosters = {

  /** Спроба використати бустер. Повертає true, якщо спрацював. */
  use(id) {
    if (Game.state !== 'playing') return false;
    const d = Storage.data;
    if ((d.boosters[id] || 0) <= 0) {
      UI.toast(I18N.t('b_out'));
      UI.openShop('boosters');
      return false;
    }

    let ok = false;
    switch (id) {
      case 'shuffle': Board.reshuffle(); ok = true; break;
      case 'hint':    ok = Board.showHint(); if (!ok) UI.toast(I18N.t('b_no_triple')); break;
      case 'magnet':  ok = Board.magnet(); if (!ok) UI.toast(I18N.t('b_no_magnet')); break;
      case 'hammer':
        Board.hammerMode = true;
        UI.setHammerCursor(true);
        UI.toast(I18N.t('b_hammer_hint'));
        ok = true;
        break;
      case 'freeze':  Game.freezeLeft = 30; Audio2.play('freeze'); UI.toast(I18N.t('b_freeze')); ok = true; break;
      case 'double':  Game.doubleLeft = 30; Audio2.play('booster'); UI.toast(I18N.t('b_double')); ok = true; break;
      case 'wand':    ok = Board.wand(); if (!ok) UI.toast(I18N.t('b_no_wand')); break;
      case 'bomb':    ok = Board.bomb(); if (!ok) UI.toast(I18N.t('b_no_bomb')); break;
      case 'rainbow': ok = Board.addRainbow(); if (!ok) UI.toast(I18N.t('b_tray_full')); break;
      case 'undo':    ok = Board.undo(); if (!ok) UI.toast(I18N.t('b_no_undo')); break;
    }

    if (ok) {
      d.boosters[id]--;
      d.stats.boostersUsed++;
      Game.boostersUsedThisLevel++;
      Missions.progress('boosters', 1);
      if (id !== 'freeze' && id !== 'hammer') Audio2.play('booster');
      Storage.save();
      UI.updateBoosterBar();
      Achievements.check();
    }
    return ok;
  },

  /** Купівля бустера за монети. */
  buy(id) {
    const b = CFG.BOOSTERS[id];
    const d = Storage.data;
    if (d.coins < b.cost) { UI.toast(I18N.t('not_enough_coins')); return false; }
    Storage.addCoins(-b.cost);
    d.boosters[id] = (d.boosters[id] || 0) + 1;
    Storage.save();
    Audio2.play('coin');
    UI.toast(b.g + ' ' + I18N.t('plus_one', { name: I18N.booster(id).name }));
    return true;
  }
};

/* ============================================================
 * Mystic Relics — achievements.js
 * 100 досягнень, згенерованих з шаблонів прогресії.
 * Кожне має нагороду монетами; отримання — вручну на екрані.
 * ============================================================ */
'use strict';

const Achievements = {
  list: [],

  build() {
    const L = [];
    // tmpl — ключ шаблону в I18N; назва обчислюється при рендері поточною мовою
    const add = (id, g, tmpl, stat, goal, reward) => L.push({ id, g, tmpl, stat, goal, reward });

    [1, 5, 10, 25, 50, 100, 200, 300, 500, 750, 1000, 1500, 2000, 3000, 4000, 5000].forEach((n, i) =>
      add(`lvl_${n}`, '🗺️', 'a_levels', 'levelsCompleted', n, 50 + i * 30));

    [3, 15, 30, 60, 100, 200, 300, 500, 750, 1000, 1250, 1500].forEach((n, i) =>
      add(`star_${n}`, '⭐', 'a_stars', 'totalStars', n, 40 + i * 35));

    [10, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 20000].forEach((n, i) =>
      add(`match_${n}`, '🧩', 'a_matches', 'matches', n, 30 + i * 40));

    [1, 10, 25, 50, 100, 250, 500, 1000].forEach((n, i) =>
      add(`combo_${n}`, '🔥', 'a_combo', 'combos', n, 50 + i * 45));

    [100, 500, 1000, 5000, 10000, 25000, 50000, 100000].forEach((n, i) =>
      add(`coin_${n}`, '🪙', 'a_coins', 'coinsEarned', n, 40 + i * 50));

    [1, 10, 25, 50, 100, 250, 500].forEach((n, i) =>
      add(`boost_${n}`, '⚡', 'a_boost', 'boostersUsed', n, 35 + i * 40));

    [1, 5, 10, 25, 50, 100].forEach((n, i) =>
      add(`chest_${n}`, '🎁', 'a_chest', 'chestsOpened', n, 60 + i * 50));

    [10, 20, 30, 40, 50, 60, 72].forEach((n, i) =>
      add(`coll_${n}`, '🎴', 'a_coll', 'collection', n, 50 + i * 45));

    [1, 3, 7, 14, 30, 60, 100].forEach((n, i) =>
      add(`login_${n}`, '📅', 'a_login', 'loginDays', n, 40 + i * 45));

    [1, 5, 15, 30, 50].forEach((n, i) =>
      add(`spin_${n}`, '🎡', 'a_spin', 'spins', n, 45 + i * 40));

    [1, 5, 15, 30, 60, 100].forEach((n, i) =>
      add(`perfect_${n}`, '🌟', 'a_perfect', 'perfectLevels', n, 70 + i * 55));

    [2, 5, 10, 15, 20, 30, 40, 50].forEach((n, i) =>
      add(`profile_${n}`, '👑', 'a_profile', 'profileLevel', n, 60 + i * 60));

    this.list = L;   // рівно 100 досягнень
  },

  /** Локалізована назва досягнення. */
  name(a) { return I18N.t(a.tmpl, { n: Utils.fmt(a.goal) }); },

  /** Поточне значення метрики досягнення. */
  value(a) {
    const d = Storage.data;
    if (a.stat === 'collection') return d.collection.length;
    if (a.stat === 'loginDays') return d.daily.loginDays;
    if (a.stat === 'spins') return d.stats.spins;
    if (a.stat === 'profileLevel') return d.profileLevel;
    return d.stats[a.stat] || 0;
  },

  isDone(a) { return this.value(a) >= a.goal; },
  isClaimed(a) { return Storage.data.achievementsClaimed.includes(a.id); },

  claim(a) {
    if (!this.isDone(a) || this.isClaimed(a)) return false;
    Storage.data.achievementsClaimed.push(a.id);
    Storage.addCoins(a.reward);
    Audio2.play('coin');
    UI.toast(I18N.t('ach_claim', { name: this.name(a), n: a.reward }));
    Storage.save();
    return true;
  },

  /** Кількість готових до отримання (для бейджа у меню). */
  readyCount() { return this.list.filter(a => this.isDone(a) && !this.isClaimed(a)).length; },

  /** Виклик після значущих подій — показує тост про нові досягнення. */
  check() {
    const n = this.readyCount();
    UI.setBadge('achBadge', n);
  }
};

// === js/daily.js ===
/* ============================================================
 * Mystic Relics — daily.js
 * Щоденні активності: 7-денний календар нагород, колесо
 * фортуни, щоденні місії (Missions).
 * ============================================================ */
'use strict';

const Daily = {

  /** Викликається при старті гри: зарахування дня входу. */
  onLogin() {
    const d = Storage.data.daily;
    const today = Utils.today();
    if (d.lastLogin !== today) {
      d.lastLogin = today;
      Storage.data.daily.loginDays++;
      Storage.save();
    }
    Missions.ensureToday();
  },

  canClaim() { return Storage.data.daily.lastClaim !== Utils.today(); },

  /** Поточний день календаря (0..6). */
  streakIndex() { return Storage.data.daily.streak % 7; },

  claim() {
    if (!this.canClaim()) return false;
    const d = Storage.data.daily;
    const idx = this.streakIndex();
    const reward = CFG.DAILY_CALENDAR[idx];
    this.giveReward(reward);
    d.lastClaim = Utils.today();
    d.streak++;
    Storage.save();
    Audio2.play('chest');
    return true;
  },

  giveReward(r) {
    if (r.coins) { Storage.addCoins(r.coins); UI.toast(`+${r.coins} 🪙`); }
    if (r.gems) { Storage.addGems(r.gems); UI.toast(`+${r.gems} 💎`); Audio2.play('gem'); }
    if (r.booster) {
      Storage.data.boosters[r.booster]++;
      UI.toast(CFG.BOOSTERS[r.booster].g + ' ' + I18N.t('plus_one', { name: I18N.booster(r.booster).name }));
    }
    if (r.chest) {
      Storage.data.chests[r.chest]++;
      UI.toast(CFG.CHESTS[r.chest].g + ' ' + I18N.t('chest_of', { name: I18N.chest(r.chest) }) + '!');
    }
    Storage.save();
  },

  /* ---- Rewarded-реклама у магазині: ліміт на день ---- */
  _adReset() {
    const d = Storage.data.daily;
    if (d.adDate !== Utils.today()) { d.adDate = Utils.today(); d.adCoins = 0; d.adGems = 0; }
  },

  /** Скільки переглядів типу kind ('coins'|'gems') лишилось сьогодні. */
  adLeft(kind) {
    this._adReset();
    const used = kind === 'coins' ? Storage.data.daily.adCoins : Storage.data.daily.adGems;
    return Math.max(0, CFG.AD_REWARDS[kind].perDay - used);
  },

  /** Зарахування нагороди за перегляд (викликати ПІСЛЯ реклами). */
  useAdReward(kind) {
    if (this.adLeft(kind) <= 0) return false;
    const d = Storage.data.daily;
    if (kind === 'coins') { d.adCoins++; Storage.addCoins(CFG.AD_REWARDS.coins.amount); UI.toast(I18N.t('coins_plus', { n: CFG.AD_REWARDS.coins.amount })); }
    else { d.adGems++; Storage.addGems(CFG.AD_REWARDS.gems.amount); UI.toast(I18N.t('gems_plus', { n: CFG.AD_REWARDS.gems.amount })); Audio2.play('gem'); }
    Storage.save();
    return true;
  },

  /* ---- Скрині за перегляд реклами (wood:1, silver:2, gold:3) ----
   * Ліміт: CFG.AD_CHEST_PER_DAY отриманих скринь на день (усього). */
  adChestNeed(kind) { return CFG.CHESTS[kind].ads || 0; },
  adChestProgress(kind) { return Storage.data.adChestProgress[kind] || 0; },

  _adChestReset() {
    const d = Storage.data.daily;
    if (d.adChestDate !== Utils.today()) { d.adChestDate = Utils.today(); d.adChestClaimed = {}; }
  },

  /** Скільки скринь ТИПУ kind ще можна отримати за рекламу сьогодні
   *  (ліміт CFG.AD_CHEST_PER_DAY на КОЖЕН тип окремо). */
  adChestLeft(kind) {
    this._adChestReset();
    const used = Storage.data.daily.adChestClaimed[kind] || 0;
    return Math.max(0, CFG.AD_CHEST_PER_DAY - used);
  },

  /** Зарахувати один перегляд реклами до скрині kind (викликати ПІСЛЯ реклами).
   *  Повертає { granted, progress, need, blocked }. */
  addAdChest(kind) {
    const need = this.adChestNeed(kind);
    if (!need) return { granted: false, progress: 0, need: 0 };
    if (this.adChestLeft(kind) <= 0) return { granted: false, progress: this.adChestProgress(kind), need, blocked: true };
    const p = Storage.data.adChestProgress;
    p[kind] = (p[kind] || 0) + 1;
    if (p[kind] >= need) {
      p[kind] = 0;
      Storage.data.chests[kind]++;
      const c = Storage.data.daily.adChestClaimed;
      c[kind] = (c[kind] || 0) + 1;            // цей тип зараховано у денний ліміт
      Storage.save();
      return { granted: true, progress: 0, need };
    }
    Storage.save();
    return { granted: false, progress: p[kind], need };
  },

  /* ---- Колесо фортуни ---- */
  canSpin() { return Storage.data.daily.lastSpin !== Utils.today(); },

  /** Крутіння: безкоштовне раз на день, далі — за rewarded-рекламу.
   *  viaAd=true означає, що нагороду за перегляд уже підтверджено.
   *  Повертає індекс сектора або -1, якщо крутити не можна. */
  spin(viaAd) {
    if (!viaAd && !this.canSpin()) return -1;
    if (!viaAd) Storage.data.daily.lastSpin = Utils.today();
    Storage.data.stats.spins++;
    Missions.progress('spins', 1);
    Storage.save();
    return Math.floor(Math.random() * CFG.WHEEL.length);
  }
};

/* ============================================================
 * Щоденні місії: 3 випадкові місії на день з шаблонів CFG.MISSIONS.
 * ============================================================ */
const Missions = {

  ensureToday() {
    const d = Storage.data.daily;
    const today = Utils.today();
    if (d.missionsDate === today && d.missions.length) return;
    d.missionsDate = today;
    const rnd = Utils.rng(parseInt(today.replace(/-/g, '')) || 1);
    const pool = Utils.shuffle([...CFG.MISSIONS], rnd).slice(0, CFG.MISSIONS_PER_DAY);
    d.missions = pool.map(m => ({
      id: m.id,
      goal: m.n[Utils.ri(rnd, 0, m.n.length - 1)],
      progress: 0,
      reward: m.reward,
      claimed: false
    }));
    Storage.save();
  },

  /** Просування прогресу місій типу id на n. */
  progress(id, n) {
    const d = Storage.data.daily;
    if (!d.missions) return;
    let changed = false;
    for (const m of d.missions) {
      if (m.id === id && !m.claimed && m.progress < m.goal) {
        m.progress = Math.min(m.goal, m.progress + n);
        changed = true;
        if (m.progress >= m.goal) UI.toast(I18N.t('mission_done'));
      }
    }
    if (changed) Storage.save();
  },

  claim(i) {
    const m = Storage.data.daily.missions[i];
    if (!m || m.claimed || m.progress < m.goal) return false;
    m.claimed = true;
    Storage.addCoins(m.reward);
    Audio2.play('coin');
    Storage.save();
    return true;
  }
};

/* ============================================================
 * Скрині: відкриття та випадкові нагороди.
 * ============================================================ */
const Chests = {

  open(kind) {
    const d = Storage.data;
    if ((d.chests[kind] || 0) <= 0) return null;
    d.chests[kind]--;
    d.stats.chestsOpened++;
    Missions.progress('chests', 1);

    const c = CFG.CHESTS[kind];
    const rewards = [];
    const coins = Utils.ri(Math.random, c.coins[0], c.coins[1]);
    rewards.push({ g: '🪙', text: I18N.t('coins_plus', { n: coins }) });
    Storage.addCoins(coins);

    const gems = Utils.ri(Math.random, c.gems[0], c.gems[1]);
    if (gems > 0) { rewards.push({ g: '💎', text: I18N.t('gems_plus', { n: gems }) }); Storage.addGems(gems); }

    const boosterIds = CFG.GAME_BOOSTERS;
    for (let i = 0; i < c.boosters; i++) {
      const id = boosterIds[Math.floor(Math.random() * boosterIds.length)];
      d.boosters[id]++;
      rewards.push({ g: CFG.BOOSTERS[id].g, text: I18N.t('plus_one', { name: I18N.booster(id).name }) });
    }

    // Шанс нової теми
    if (Math.random() < c.themeChance) {
      const locked = CFG.THEMES.filter(t => !d.themes.includes(t.id));
      if (locked.length) {
        const t = locked[Math.floor(Math.random() * locked.length)];
        d.themes.push(t.id);
        rewards.push({ g: '🎨', text: I18N.t('new_theme', { name: I18N.theme(t.id) }) });
      }
    }

    Audio2.play('chest');
    Achievements.check();
    Storage.save();
    return rewards;
  }
};

// === js/ads.js ===
/* ============================================================
 * Mystic Relics — ads.js
 * Монетизація з ДВОМА шляхами:
 *   • Веб (демо)  — заглушки: rewarded видає нагороду одразу,
 *                   покупка «успішна» через підтвердження.
 *   • Нативно (Capacitor + @capacitor-community/admob) — реальні
 *     виклики плагіна. Активується САМЕ ТОДІ, коли плагін присутній,
 *     тож той самий код працює і в браузері, і в застосунку.
 *
 * Що зробити для релізу:
 *   1) npm i @capacitor-community/admob && npx cap sync
 *   2) У AD_IDS нижче замінити ТЕСТОВІ id Google на свої (AdMob).
 *   3) App ID AdMob прописати в android/app/src/main/AndroidManifest.xml
 *      (<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" .../>)
 *      і додати дозвіл AD_ID (див. EXPORT_CHECKLIST.md).
 *   4) IAP: підключити @capacitor/purchases або RevenueCat у purchase().
 * ============================================================ */
'use strict';

const Ads = {
  _levelCounter: 0,
  _initDone: false,
  _iapReady: false,

  /* Рекламні одиниці AdMob (Mystic Relics tile-matching, Android). */
  AD_IDS: {
    banner:       'ca-app-pub-5816871059908402/7709152948',
    interstitial: 'ca-app-pub-5816871059908402/2456826267',
    rewarded:     'ca-app-pub-5816871059908402/1143744597'
  },

  /* ⚠️ Ключ RevenueCat для Google (починається з 'goog_') — вставити свій.
   * RevenueCat сам валідує чеки й «споживає» витратні товари. */
  IAP_KEY: 'goog_XXXXXXXXXXXXXXXXXXXXXXXXX',

  /** Плагін AdMob, якщо застосунок запущено нативно; інакше null (веб). */
  _plugin() {
    const C = (typeof window !== 'undefined') && window.Capacitor;
    if (C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.AdMob) return C.Plugins.AdMob;
    return null;
  },

  async _ensureInit() {
    const AdMob = this._plugin();
    if (!AdMob || this._initDone) return AdMob;
    try { await AdMob.initialize({ initializeForTesting: false }); } catch (e) { console.warn('[Ads] init', e); }
    this._initDone = true;
    return AdMob;
  },

  /** Банер знизу ігрового екрана (плейсхолдер #adBanner у вебі). */
  async showBanner() {
    const el = document.getElementById('adBanner');
    if (Storage.data.premium) { if (el) el.classList.add('hidden'); return; }
    const AdMob = await this._ensureInit();
    if (AdMob) {
      if (el) el.classList.add('hidden');   // нативний банер малює плагін, не HTML
      try {
        await AdMob.showBanner({
          adId: this.AD_IDS.banner, adSize: 'ADAPTIVE_BANNER',
          position: 'BOTTOM_CENTER', margin: 0
        });
        document.documentElement.style.setProperty('--banner-h', '56px');
      } catch (e) { console.warn('[Ads] banner', e); }
      return;
    }
    if (el) el.classList.remove('hidden');   // веб-демо: показуємо плейсхолдер
  },

  async hideBanner() {
    const el = document.getElementById('adBanner');
    if (el) el.classList.add('hidden');
    document.documentElement.style.setProperty('--banner-h', '0px');
    const AdMob = this._plugin();
    if (AdMob) { try { await AdMob.hideBanner(); await AdMob.removeBanner(); } catch (e) {} }
  },

  /** Міжсторінкова реклама — кожні 3 пройдені рівні. */
  async maybeInterstitial() {
    if (Storage.data.premium) return;
    this._levelCounter++;
    if (this._levelCounter % 3 !== 0) return;
    const AdMob = await this._ensureInit();
    if (!AdMob) { console.info('[Ads] Interstitial placeholder'); return; }
    try {
      await AdMob.prepareInterstitial({ adId: this.AD_IDS.interstitial });
      await AdMob.showInterstitial();
    } catch (e) { console.warn('[Ads] interstitial', e); }
  },

  /**
   * Реклама з нагородою. onReward викликається ЛИШЕ після успішного
   * перегляду (нативно) або одразу (веб-демо).
   */
  async showRewarded(onReward) {
    if (Storage.data.premium) { onReward(); return; }
    const AdMob = await this._ensureInit();
    if (!AdMob) {
      console.info('[Ads] Rewarded placeholder — нагорода видана одразу (демо)');
      onReward();
      return;
    }
    try {
      await AdMob.prepareRewardVideoAd({ adId: this.AD_IDS.rewarded });
      const reward = await AdMob.showRewardVideoAd();   // резолвиться після повного перегляду
      if (reward) onReward();
    } catch (e) { console.warn('[Ads] rewarded', e); }
  },

  /** Плагін RevenueCat (@revenuecat/purchases-capacitor), якщо застосунок нативний. */
  _iapPlugin() {
    const C = (typeof window !== 'undefined') && window.Capacitor;
    if (C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Purchases) return C.Plugins.Purchases;
    return null;
  },

  async _iapEnsure() {
    const P = this._iapPlugin();
    if (!P || this._iapReady) return P;
    try { await P.configure({ apiKey: this.IAP_KEY }); this._iapReady = true; } catch (e) { console.warn('[IAP] configure', e); }
    return P;
  },

  /**
   * Реальна покупка. productId — з CFG.SHOP (coins_s/m/l, gems_s/m/l, premium_noads).
   * Веб-демо: «успішно» через підтвердження. Нативно: Google Play Billing (RevenueCat).
   * onSuccess() викликається ЛИШЕ після успішної, підтвердженої покупки.
   */
  async purchase(productId, onSuccess) {
    const P = await this._iapEnsure();
    if (!P) {   // веб-демо
      console.info('[IAP] Purchase placeholder:', productId);
      UI.confirm(I18N.t('demo_purchase'), I18N.t('demo_purchase_text'), onSuccess);
      return;
    }
    try {
      const { products } = await P.getProducts({ productIdentifiers: [productId] });
      if (!products || !products.length) { UI.toast('Product unavailable'); return; }
      // RevenueCat сам підтверджує/споживає транзакцію після успіху
      await P.purchaseStoreProduct({ product: products[0] });
      onSuccess();
    } catch (e) {
      if (!(e && e.userCancelled)) { console.warn('[IAP] purchase', e); UI.toast('Purchase failed'); }
    }
  },

  /** Відновлення покупок (напр. Premium) — виклич із налаштувань за потреби. */
  async restore() {
    const P = await this._iapEnsure();
    if (!P) return;
    try {
      const { customerInfo } = await P.restorePurchases();
      const ent = customerInfo && customerInfo.entitlements && customerInfo.entitlements.active;
      if (ent && ent.premium) { Storage.data.premium = true; Storage.save(); this.hideBanner(); UI.toast('✓ Premium restored'); }
    } catch (e) { console.warn('[IAP] restore', e); }
  }
};

/* ============================================================
 * Mystic Relics — game.js
 * Життєвий цикл рівня: таймер, очки, комбо, перемога/поразка,
 * нагороди, головний цикл requestAnimationFrame (60 FPS).
 * ============================================================ */
'use strict';

const Game = {
  state: 'menu',          // menu | playing | paused | won | lost
  mode: 'level',          // level (кампанія) | zen (без таймера) | daily (виклик дня)
  levelNum: 1,
  levelCfg: null,
  score: 0,
  combo: 1,
  comboTimer: 0,
  timeLeft: 0,
  freezeLeft: 0,
  doubleLeft: 0,
  boostersUsedThisLevel: 0,
  _last: 0,
  _rafStarted: false,

  startLevel(n) {
    this.levelNum = n;
    this._begin(Generator.generate(n), 'level', I18N.t('level_n', { n }));
    if (n === 1 && !Storage.data.tutorialDone) setTimeout(() => UI.startTutorial(), 1600);
    else UI.endTutorial();
  },

  /** Дзен-режим: без таймера, випадкова розкладка навколо прогресу гравця. */
  startZen() {
    const d = Storage.data;
    const n = Utils.clamp(d.level - 5 + Math.floor(Math.random() * 20), 1, CFG.TOTAL_LEVELS);
    this.levelNum = n;
    this._begin(Generator.generate(n, 1 + Math.floor(Math.random() * 1e6)), 'zen', '🧘 ' + I18N.t('mode_zen'));
    UI.endTutorial();
  },

  /** Виклик дня: один спільний рівень для всіх, подвійна нагорода раз на день. */
  startDaily() {
    const day = Math.floor(Date.now() / 864e5);
    const n = 10 + (day * 7) % 140;          // рівні 10..149 — середня складність
    this.levelNum = n;
    this._begin(Generator.generate(n, day), 'daily', '📅 ' + I18N.t('mode_daily'));
    UI.endTutorial();
  },

  /** Спільний старт будь-якого режиму. */
  _begin(cfg, mode, introTitle) {
    this.mode = mode;
    this.levelCfg = cfg;
    this.score = 0;
    this.combo = 1;
    this.comboTimer = 0;
    this.timeLeft = mode === 'zen' ? Infinity : cfg.timeLimit;
    this.freezeLeft = 0;
    this.doubleLeft = 0;
    this.boostersUsedThisLevel = 0;
    Board.setup(cfg);
    this.state = 'playing';
    this._lastTick = -1;
    UI.showScreen('game');
    UI.updateHUD();
    UI.showLevelIntro(introTitle);
    this.startLoop();
  },

  startLoop() {
    if (this._rafStarted) return;
    this._rafStarted = true;
    this._last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.05, (now - this._last) / 1000);
      this._last = now;
      this.update(dt);
      if (document.getElementById('gameScreen').classList.contains('active')) Board.draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  },

  update(dt) {
    if (this.state !== 'playing') { Particles.update(dt); return; }

    // Таймер (заморозка зупиняє; у дзен-режимі час не йде)
    if (this.mode === 'zen') { /* без таймера */ }
    else if (this.freezeLeft > 0) this.freezeLeft -= dt;
    else {
      this.timeLeft -= dt;
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.onLose('time'); }
      // Останні 10 секунд: тік-звук щосекунди + червона пульсація країв
      if (this.timeLeft <= 10 && this.timeLeft > 0) {
        const sec = Math.ceil(this.timeLeft);
        if (sec !== this._lastTick) { this._lastTick = sec; Audio2.play('tick'); }
      }
    }
    UI.setDanger(this.mode !== 'zen' && this.timeLeft <= 10 && this.timeLeft > 0 && this.freezeLeft <= 0);
    if (this.doubleLeft > 0) this.doubleLeft -= dt;

    // Комбо згасає
    if (this.comboTimer > 0) {
      this.comboTimer -= dt * 1000;
      if (this.comboTimer <= 0) this.combo = 1;
    }

    Board.update(dt);
    UI.updateHUD();
  },

  addScore(n) {
    this.score = Math.max(0, this.score + n);
    UI.updateHUD();
  },

  /** Викликається з Board після кожної зібраної трійки. */
  onMatch(type, silent) {
    // Комбо-множник
    if (this.comboTimer > 0) this.combo = Math.min(this.combo + 1, 8);
    this.comboTimer = CFG.COMBO_WINDOW;

    let pts = 100 * this.combo;
    if (this.doubleLeft > 0) pts *= 2;
    this.addScore(pts);
    this._lastPts = pts;

    if (!silent) Audio2.play('match', this.combo);
    if (this.combo >= 3) {
      UI.comboPopup(this.combo);
      Storage.data.stats.combos++;
      Missions.progress('combo', 1);
    }
    // Колекція: плитка зараховується після COLLECTION_TRIPLES зібраних
    // трійок цього типу; за відкриття — нагорода монетами
    if (type >= 0 && !Storage.data.collection.includes(type)) {
      const cc = Storage.data.collectionCount;
      cc[type] = (cc[type] || 0) + 1;
      if (cc[type] >= CFG.COLLECTION_TRIPLES) {
        Storage.data.collection.push(type);
        Missions.progress('coll', 1);
        Storage.addCoins(CFG.COLLECTION_REWARD);
        Audio2.play('gem');
        UI.toast(I18N.t('coll_unlocked', {
          name: CFG.TILES[type].g + ' ' + I18N.tile(type),
          r: CFG.COLLECTION_REWARD
        }));
      }
    }
    Storage.data.stats.matches++;
    Missions.progress('matches', 1);
    if (UI.tutorial.active) UI.tutorialProgress();
    Storage.save();
    return pts;
  },

  onWin() {
    if (this.state !== 'playing') return;
    this.state = 'won';
    UI.setDanger(false);
    Audio2.play('win');
    Utils.vibrate([40, 60, 40, 60, 80]);

    // Дзен: спокійна нагорода без зірок і прогресії
    if (this.mode === 'zen') {
      const coins = 40 + this.levelCfg.tier * 8;
      Storage.addCoins(coins);
      Storage.addXP(20);
      Storage.save();
      setTimeout(() => UI.showZenWin(this.score, coins), 700);
      return;
    }

    // Зірки за залишок часу
    const ratio = this.timeLeft / this.levelCfg.timeLimit;
    const stars = ratio > 0.5 ? 3 : ratio > 0.25 ? 2 : 1;
    const timeBonus = Math.round(this.timeLeft * 5);
    this.addScore(timeBonus);

    const d = Storage.data;

    // Виклик дня: подвійна нагорода + кристали за перше проходження
    if (this.mode === 'daily') {
      const today = Utils.today();
      const first = d.daily.challengeDone !== today;
      const coins = (50 + this.levelCfg.tier * 10 + stars * 25) * 2;
      const gems = first ? 3 : 0;
      Storage.addCoins(coins);
      if (gems) Storage.addGems(gems);
      Storage.addXP(60);
      d.daily.challengeDone = today;
      Missions.progress('levels', 1);
      Missions.progress('stars', stars);
      if (stars === 3) Missions.progress('perfect', 1);
      Achievements.check();
      Storage.save();
      setTimeout(() => UI.showWin(stars, this.score, coins, gems, 60), 700);
      return;
    }
    const firstClear = !(d.stars[this.levelNum] > 0);
    const prevStars = d.stars[this.levelNum] || 0;
    d.stars[this.levelNum] = Math.max(prevStars, stars);

    // Нагороди
    const coins = 50 + this.levelCfg.tier * 10 + stars * 25;
    const gems = stars === 3 && firstClear ? 1 : 0;
    const xp = 40 + this.levelCfg.tier * 8;
    Storage.addCoins(coins);
    if (gems) Storage.addGems(gems);
    Storage.addXP(xp);

    if (firstClear) {
      d.stats.levelsCompleted++;
      if (stars === 3) d.stats.perfectLevels++;
      // Скрині за прогрес
      if (this.levelNum % 100 === 0) d.chests.legendary++;
      else if (this.levelNum % 25 === 0) d.chests.gold++;
      else if (this.levelNum % 10 === 0) d.chests.silver++;
      else if (this.levelNum % 3 === 0) d.chests.wood++;
    }
    d.stats.totalStars = Object.values(d.stars).reduce((a, b) => a + b, 0);
    if (this.levelNum >= d.level && this.levelNum < CFG.TOTAL_LEVELS) d.level = this.levelNum + 1;

    Missions.progress('levels', 1);
    Missions.progress('stars', stars);
    if (stars === 3) Missions.progress('perfect', 1);
    Achievements.check();
    Storage.save();

    Ads.maybeInterstitial();
    setTimeout(() => UI.showWin(stars, this.score, coins, gems, xp), 700);
  },

  /** Панель переповнена. */
  onTrayFull() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    UI.showRevive();
  },

  /** Порятунок: за кристали прибираємо 3 плитки з панелі назад на поле. */
  revive() {
    if (Storage.data.gems < 5) { UI.toast(I18N.t('not_enough_gems')); return false; }
    Storage.addGems(-5);
    Board.reviveClear(3);
    this.state = 'playing';
    return true;
  },

  /** Порятунок за рекламу (rewarded video). */
  reviveByAd() {
    Ads.showRewarded(() => {
      Board.reviveClear(3);
      this.state = 'playing';
      UI.closeModal();
    });
  },

  onLose(reason) {
    if (this.state !== 'playing' && this.state !== 'paused') return;
    this.state = 'lost';
    this._loseReason = reason;
    UI.setDanger(false);
    Audio2.play('lose');
    Utils.vibrate(150);
    setTimeout(() => UI.showLose(reason), 500);
  },

  /** Другий шанс після поразки: повертає плитки/час і перемішує поле. */
  secondChance() {
    if (this.state !== 'lost') return;
    if (this._loseReason === 'time') this.timeLeft = 45;
    else Board.reviveClear(3);
    Board.reshuffle();
    this.state = 'playing';
    this._last = performance.now();
    UI.toast(I18N.t('second_chance'));
  },

  pause() { if (this.state === 'playing') { this.state = 'paused'; UI.showPause(); } },
  resume() { if (this.state === 'paused') { this.state = 'playing'; this._last = performance.now(); } },

  quitToMenu() {
    this.state = 'menu';
    UI.setDanger(false);
    UI.showScreen('main');
  }
};

// === js/ui.js ===
/* ============================================================
 * Mystic Relics — ui.js
 * Усі екрани, модальні вікна, HUD, теми, тости та навігація.
 * ============================================================ */
'use strict';

const UI = {
  lvlPage: 0,
  LVL_PER_PAGE: 40,
  _dispScore: 0,         // плавний лічильник очок у HUD
  _lastCoins: -1, _lastGems: -1,

  $(id) { return document.getElementById(id); },

  theme() { return CFG.THEMES.find(t => t.id === Storage.data.theme) || CFG.THEMES[0]; },

  applyTheme() {
    const t = this.theme();
    const r = document.documentElement.style;
    r.setProperty('--bg1', t.bg[0]);
    r.setProperty('--bg2', t.bg[1]);
    r.setProperty('--accent', t.accent);
    Board.spriteCache.clear();
    if (Background.canvas) Background.build();   // перебудова живого фону
  },

  /* ---------------- Навігація ---------------- */
  showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = this.$(name + 'Screen');
    if (el) el.classList.add('active');
    // Рендер вмісту екрана при відкритті
    switch (name) {
      case 'main': this.renderMain(); break;
      case 'levels':
        this.lvlPage = Math.floor((Storage.data.level - 1) / this.LVL_PER_PAGE);
        this.renderLevels();
        break;
      case 'shop': this.renderShop(); break;
      case 'daily': this.renderDaily(); break;
      case 'achievements': this.renderAchievements(); break;
      case 'collection': this.renderCollection(); break;
      case 'profile': this.renderProfile(); break;
      case 'chests': this.renderChests(); break;
      case 'game':
        // Спершу панель бустерів (вона впливає на висоту поля), тоді розмір
        this.updateBoosterBar();
        Board.resize();
        requestAnimationFrame(() => Board.resize());
        this._dispScore = 0; this._lastCoins = -1; this._lastGems = -1;
        break;
    }
  },

  renderMain() {
    this.$('playLevelNum').textContent = Storage.data.level;
    this.updateCurrency();
    this.setBadge('dailyBadge', Daily.canClaim() ? 1 : 0, '!');
    this.setBadge('dailyChBadge', Storage.data.daily.challengeDone !== Utils.today() ? 1 : 0, '!');
    this.setBadge('wheelBadge', Daily.canSpin() ? 1 : 0, '!');
    const chestsTotal = Object.values(Storage.data.chests).reduce((a, b) => a + b, 0);
    this.setBadge('chestBadge', chestsTotal);
    Achievements.check();
  },

  updateCurrency() {
    const d = Storage.data;
    this.$('curCoins').querySelector('b').textContent = Utils.fmt(d.coins);
    this.$('curGems').querySelector('b').textContent = Utils.fmt(d.gems);
    document.querySelectorAll('.coinsVal').forEach(el => el.textContent = Utils.fmt(d.coins));
  },

  /** Малює іконки валют у всі статичні [data-ico] контейнери
   *  (PNG-спрайт, якщо завантажений, інакше вбудований SVG). */
  paintIcons() {
    document.querySelectorAll('[data-ico]').forEach(el => {
      el.innerHTML = Utils.ic(el.dataset.ico);
    });
  },

  /** Підміняє емодзі в кнопках меню на PNG-іконки, коли ті завантажені.
   *  Емодзі лишаються запасним варіантом, доки спрайтів немає. */
  _MENU_ICONS: {
    'nav-shop': 'shop', 'nav-collection': 'collection', 'nav-main': 'home',
    'nav-achievements': 'achievements', 'nav-profile': 'profile',
    'btnDaily': 'daily', 'btnWheel': 'wheel', 'btnMissions': 'missions', 'btnChests': 'chests'
  },
  paintMenuIcons() {
    const set = (el, id) => {
      const im = Assets.icons[id];
      if (!el || !im || !im.complete) return;
      const span = el.querySelector('span');
      if (span && !span.querySelector('img')) span.innerHTML = `<img class="menu-ico" src="${im.src}" alt="">`;
    };
    document.querySelectorAll('.bottom-nav [data-nav]').forEach(b => set(b, this._MENU_ICONS['nav-' + b.dataset.nav]));
    ['btnDaily', 'btnWheel', 'btnMissions', 'btnChests'].forEach(id => set(this.$(id), this._MENU_ICONS[id]));
    // Кнопки режимів + шестерня: емодзі у span[data-micon] → PNG
    document.querySelectorAll('[data-micon]').forEach(sp => {
      const im = Assets.icons[sp.dataset.micon];
      if (im && im.complete && !sp.querySelector('img')) sp.innerHTML = `<img class="btn-ico" src="${im.src}" alt="">`;
    });
  },

  setBadge(id, n, symbol) {
    const el = this.$(id);
    if (!el) return;
    el.textContent = symbol || (n > 99 ? '99+' : n);
    el.classList.toggle('show', n > 0);
  },

  /* ---------------- HUD гри ---------------- */
  updateHUD() {
    if (Game.state !== 'playing' && Game.state !== 'paused') return;
    this.$('hudLevel').textContent = Game.levelNum;

    // Очки «набігають» плавно, з bump-анімацією панелі
    if (this._dispScore !== Game.score) {
      const diff = Game.score - this._dispScore;
      this._dispScore += Math.abs(diff) < 2 ? diff : Math.round(diff * 0.16 + Math.sign(diff));
      this.$('hudScore').textContent = Utils.fmt(this._dispScore);
      if (Math.abs(diff) > 50) this._bump('hudScorePill');
    }
    // Валюти у HUD
    const d = Storage.data;
    if (d.coins !== this._lastCoins) {
      this._lastCoins = d.coins;
      this.$('hudCoins').querySelector('b').textContent = Utils.fmt(d.coins);
      this._bump('hudCoins');
    }
    if (d.gems !== this._lastGems) {
      this._lastGems = d.gems;
      this.$('hudGems').querySelector('b').textContent = Utils.fmt(d.gems);
      this._bump('hudGems');
    }

    const timer = this.$('hudTimer');
    if (Game.mode === 'zen') {
      timer.textContent = '🧘 ∞';
      timer.classList.remove('low', 'frozen');
    } else {
      timer.textContent = (Game.freezeLeft > 0 ? '🧊 ' : '⏱️ ') + Utils.time(Game.timeLeft);
      timer.classList.toggle('low', Game.timeLeft < 30 && Game.freezeLeft <= 0);
      timer.classList.toggle('frozen', Game.freezeLeft > 0);
    }

    // Прогрес рівня: частка зібраних плиток
    if (Board.totalTiles) {
      const left = Board.boardTiles().length + Board.tray.filter(t => t.state !== 'gone' && !t.rainbow).length;
      const p = Math.round((1 - left / Board.totalTiles) * 100);
      const fill = this.$('progressFill');
      if (fill.style.width !== p + '%') fill.style.width = p + '%';
    }
    // Прогноз зірок за поточним часом (у дзен — символ спокою)
    const ratio = Game.levelCfg ? Game.timeLeft / Game.levelCfg.timeLimit : 1;
    const starStr = Game.mode === 'zen' ? '☮' : ratio > 0.5 ? '★★★' : ratio > 0.25 ? '★★' : '★';
    const hs = this.$('hudStars');
    if (hs.textContent !== starStr) hs.textContent = starStr;
    // Активні ефекти
    const fx = [];
    if (Game.freezeLeft > 0) fx.push(`🧊 ${Math.ceil(Game.freezeLeft)}s`);
    if (Game.doubleLeft > 0) fx.push(`✨ x2 ${Math.ceil(Game.doubleLeft)}s`);
    if (Game.combo > 1) fx.push(`🔥 x${Game.combo}`);
    const bar = this.$('fxBar');
    const html = fx.map(f => `<span>${f}</span>`).join('');
    if (bar.innerHTML !== html) bar.innerHTML = html;
  },

  updateBoosterBar() {
    this.$('boosterBar').innerHTML = CFG.GAME_BOOSTERS.map(id => {
      const n = Storage.data.boosters[id] || 0;
      return `<button class="booster-btn ${n ? '' : 'empty'}" data-booster="${id}" title="${I18N.booster(id).name}">
        ${Assets.boosterHtml(id, 'bicon')}<span class="cnt">${n}</span><span class="info" data-binfo="${id}">і</span></button>`;
    }).join('');
  },

  /** Інфо-вікно бустера (ⓘ). На час перегляду гра стає на паузу. */
  boosterInfo(id) {
    const b = CFG.BOOSTERS[id];
    if (Game.state === 'playing') { Game.state = 'paused'; this._resumeOnClose = true; }
    this.modal(`
      <button class="modal-close" data-close>✕</button>
      <div style="font-size:54px;filter:drop-shadow(0 4px 8px rgba(0,0,10,0.6))">${Assets.boosterHtml(id, 'modal-icon')}</div>
      <h2>${I18N.booster(id).name}</h2>
      <p style="opacity:0.88;font-size:14.5px;line-height:1.45;margin:8px 0">${I18N.booster(id).desc}</p>
      <div class="reward-item" style="display:inline-block;margin-bottom:6px">${I18N.t('you_have', { n: Storage.data.boosters[id] || 0 })} · ${b.cost} ${Utils.ic('coin')} ${I18N.t('in_shop')}</div>
      <button class="btn-3d btn-green" data-close>${I18N.t('got_it')}</button>
    `);
  },

  setHammerCursor(on) { this.$('gameCanvas').classList.toggle('hammer', on); },

  /** Червона пульсація країв на останніх секундах. */
  setDanger(on) {
    const v = this.$('vignette');
    if (v.classList.contains('danger') !== on) v.classList.toggle('danger', on);
  },

  /** Заставка на старті рівня (кампанія / дзен / виклик дня). */
  showLevelIntro(title) {
    const el = this.$('levelIntro');
    this.$('introLevel').textContent = title;
    this.$('introGo').textContent = I18N.t('go');
    el.classList.remove('show');
    void el.offsetWidth;                  // перезапуск CSS-анімації
    el.classList.add('show');
    Audio2.play('intro');
  },

  /* ---------------- Міні-туторіал (перший запуск) ---------------- */
  tutorial: { active: false, step: 0, _timer: null },

  startTutorial() {
    this.tutorial.active = true;
    this.tutorial.step = 1;
    const box = this.$('tutorialBox');
    box.textContent = I18N.t('tut_1');
    box.classList.add('show');
    // Постійно підсвічуємо збирану трійку і ведемо палець 👆 до неї
    this.tutorial._timer = setInterval(() => {
      if (!this.tutorial.active || Game.state !== 'playing') return;
      if (!Board.boardTiles().some(t => t.hintT > 0)) Board.showHint();
      const target = Board.boardTiles().find(t => t.hintT > 0);
      const hand = this.$('tutorialHand');
      if (target) {
        hand.style.left = target.px + 'px';
        hand.style.top = (target.py + Board.tileH * 0.35) + 'px';
        hand.classList.add('show');
      } else hand.classList.remove('show');
    }, 500);
  },

  /** Викликається після кожної зібраної трійки під час туторіалу. */
  tutorialProgress() {
    const t = this.tutorial;
    if (!t.active) return;
    if (t.step === 1) {
      t.step = 2;
      this.$('tutorialBox').textContent = I18N.t('tut_2');
      this.$('tutorialHand').classList.remove('show');
      clearInterval(t._timer);                     // палець більше не потрібен
    } else {
      this.endTutorial();
    }
  },

  endTutorial() {
    const t = this.tutorial;
    if (!t.active) return;
    t.active = false;
    clearInterval(t._timer);
    this.$('tutorialBox').classList.remove('show');
    this.$('tutorialHand').classList.remove('show');
    Storage.data.tutorialDone = true;
    Storage.save();
  },

  /** Bounce-анімація панелі при зміні значення. */
  _bump(id) {
    const el = this.$(id);
    if (!el || el.classList.contains('bump')) return;
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 420);
  },

  comboPopup(mult) {
    const el = this.$('comboPopup');
    el.textContent = I18N.t('combo', { n: mult });
    el.classList.remove('show');
    void el.offsetWidth;          // перезапуск анімації
    el.classList.add('show');
  },

  toast(text) {
    const box = this.$('toasts');
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    box.appendChild(t);
    setTimeout(() => t.remove(), 2800);
    while (box.children.length > 4) box.firstChild.remove();
  },

  /* ---------------- Карта рівнів: звивиста стежка ---------------- */
  renderLevels() {
    const d = Storage.data;
    this.$('starsTotal').textContent = d.stats.totalStars;
    const pages = Math.ceil(CFG.TOTAL_LEVELS / this.LVL_PER_PAGE);
    this.lvlPage = Utils.clamp(this.lvlPage, 0, pages - 1);
    this.$('lvlPageLabel').textContent = `${this.lvlPage * this.LVL_PER_PAGE + 1} – ${Math.min((this.lvlPage + 1) * this.LVL_PER_PAGE, CFG.TOTAL_LEVELS)}`;

    const N = Math.min(this.LVL_PER_PAGE, CFG.TOTAL_LEVELS - this.lvlPage * this.LVL_PER_PAGE);
    const stepY = 84, H = N * stepY + 70;
    const rnd = Utils.rng(this.lvlPage * 7919 + 3);

    // Точки стежки: плавна синусоїда згори донизу (x у %, y у px)
    const pts = [];
    for (let i = 0; i < N; i++) {
      pts.push({ x: 50 + Math.sin(i * 0.75 + this.lvlPage * 2) * 30, y: 52 + i * stepY });
    }

    // Пунктирна золота стежка через вузли (координати: 1000 × H)
    let path = `M ${pts[0].x * 10} ${pts[0].y}`;
    for (let i = 1; i < N; i++) {
      const midX = (pts[i - 1].x + pts[i].x) / 2 * 10;
      const midY = (pts[i - 1].y + pts[i].y) / 2;
      path += ` Q ${pts[i - 1].x * 10} ${midY - stepY * 0.22}, ${midX} ${midY}`;
      path += ` Q ${pts[i].x * 10} ${midY + stepY * 0.22}, ${pts[i].x * 10} ${pts[i].y}`;
    }
    const svg = `<svg class="lvl-path" viewBox="0 0 1000 ${H}" preserveAspectRatio="none" style="height:${H}px">
      <path d="${path}" class="lvl-path-shadow"/>
      <path d="${path}" class="lvl-path-line"/>
    </svg>`;

    // Декорації узбіч стежки (за сценою активної теми)
    const decoSets = { forest: ['🌿', '🍄', '🌸', '🦋', '✨'], cave: ['💎', '✨', '🪨', '🔮'], temple: ['🏺', '✨', '🗿', '🕯️'] };
    const decos = decoSets[this.theme().scene] || decoSets.forest;
    let decoHtml = '';
    for (let i = 0; i < N; i += 2) {
      const p = pts[i];
      const side = p.x > 50 ? p.x - 38 - rnd() * 8 : p.x + 30 + rnd() * 8;
      decoHtml += `<span class="lvl-deco" style="left:${side}%;top:${p.y + 26 + rnd() * 20}px;font-size:${18 + rnd() * 12}px;animation-delay:${rnd() * 3}s">${decos[Utils.ri(rnd, 0, decos.length - 1)]}</span>`;
    }

    // Вузли рівнів на стежці
    let nodes = '';
    for (let i = 0; i < N; i++) {
      const n = this.lvlPage * this.LVL_PER_PAGE + i + 1;
      const stars = d.stars[n] || 0;
      const locked = n > d.level;
      const cls = locked ? 'locked' : n === d.level ? 'current' : stars ? 'done' : '';
      const starStr = stars ? '★'.repeat(stars) : (locked ? '🔒' : '');
      nodes += `<button class="level-node path-node ${cls}" data-level="${locked ? '' : n}"
        style="left:calc(${pts[i].x}% - 31px);top:${pts[i].y - 31}px">${n}<small>${starStr}</small></button>`;
    }

    this.$('levelGrid').innerHTML =
      `<div class="level-path-wrap" style="height:${H}px">${svg}${decoHtml}${nodes}</div>`;

    // Прокрутка до поточного рівня
    const cur = this.$('levelGrid').querySelector('.current, .path-node:not(.locked):last-of-type');
    if (cur) setTimeout(() => cur.scrollIntoView({ block: 'center' }), 50);
  },

  showWheel() {

    this.modal(`

      <p style="opacity:0.6;font-size:12px">${I18N.t('free_daily')}</p>`}
    `);
    // Рендеримо у високій роздільності (DPR) для чіткого краю
    const c = this.$('wheelCanvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = c.height = Math.round(300 * dpr);
    this._wheelAngle = -Math.PI / 2;   // старт: перший сектор під стрілкою
    this._drawWheel(this._wheelAngle);
    this.$('btnSpin').onclick = () => {
      if (free) this._spinWheel(false);
      else Ads.showRewarded(() => this._spinWheel(true));   // нагорода лише після перегляду
    };
    const coinBtn = this.$('btnSpinCoins');
    if (coinBtn) coinBtn.onclick = () => {
      if (Storage.data.coins < 250) { this.toast(I18N.t('not_enough_coins')); return; }
      Storage.addCoins(-250);

      this._spinWheel(true);
    };

  /** Дані сектора у зручному вигляді для рендеру. */
  _wheelSector(s) {
    if (s.coins) return { img: Utils.iconImg('coin'), amount: '' + s.coins };
    if (s.gems) return { img: Utils.iconImg('gem'), amount: '' + s.gems };
    return { emoji: CFG.BOOSTERS[s.booster].g, amount: '' };
  },

  _drawWheel(angle) {
    const c = this.$('wheelCanvas');
    if (!c) return;
    const g = c.getContext('2d');
    const S = (c.width / 300) || 1;             // масштаб DPR: малюємо в координатах 300×300
    g.setTransform(S, 0, 0, S, 0, 0);
    const cx = 150, cy = 150, R = 130;
    g.clearRect(0, 0, 300, 300);
    const n = CFG.WHEEL.length;

    // Зовнішнє світіння
    g.save();
    g.shadowColor = 'rgba(180,110,255,0.55)'; g.shadowBlur = 26;
    g.beginPath(); g.arc(cx, cy, R + 8, 0, Math.PI * 2);
    g.fillStyle = '#2a0f52'; g.fill();
    g.restore();

    // Сектори
    const cols = [['#8b3fe8', '#5f21b6'], ['#c05bff', '#7a2fd6']];
    for (let i = 0; i < n; i++) {
      const a0 = angle + (i / n) * Math.PI * 2, a1 = angle + ((i + 1) / n) * Math.PI * 2, mid = (a0 + a1) / 2;
      const grad = g.createRadialGradient(cx, cy, 20, cx, cy, R);
      const cc = cols[i % 2];
      grad.addColorStop(0, cc[0]); grad.addColorStop(1, cc[1]);
      g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, a0, a1); g.closePath();
      g.fillStyle = grad; g.fill();
      // Золотий роздільник
      g.strokeStyle = '#ffd873'; g.lineWidth = 2; g.stroke();

      // Вміст сектора
      const sec = this._wheelSector(CFG.WHEEL[i]);
      g.save();
      g.translate(cx, cy); g.rotate(mid);
      const dist = R * 0.66;
      if (sec.img && sec.img.complete) {
        const s = 40;
        g.save(); g.translate(dist, 0); g.rotate(Math.PI / 2);
        g.drawImage(sec.img, -s / 2, -s / 2, s, s); g.restore();
      } else if (sec.emoji) {
        g.save(); g.translate(dist, 0); g.rotate(Math.PI / 2);
        g.font = '30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(sec.emoji, 0, 0); g.restore();
      }
      if (sec.amount) {
        g.save(); g.translate(R * 0.92, 0); g.rotate(Math.PI / 2);
        g.font = '900 17px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 3; g.strokeStyle = 'rgba(30,0,50,0.8)'; g.strokeText(sec.amount, 0, 0);
        g.fillStyle = '#fff'; g.fillText(sec.amount, 0, 0); g.restore();
      }
      g.restore();
    }

    // Золотий обід із «лампочками»
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2);
    g.lineWidth = 8; g.strokeStyle = '#f5b800'; g.stroke();
    g.lineWidth = 2; g.strokeStyle = '#7a4a00'; g.stroke();
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
      const lx = cx + Math.cos(a) * R, ly = cy + Math.sin(a) * R;
      g.beginPath(); g.arc(lx, ly, 3.4, 0, Math.PI * 2);
      g.fillStyle = i % 2 ? '#fff7d0' : '#ffcf3f';
      g.shadowColor = '#ffdd66'; g.shadowBlur = 6; g.fill(); g.shadowBlur = 0;
    }

    // Центральна маточина
    const hub = g.createRadialGradient(cx - 6, cy - 8, 4, cx, cy, 26);
    hub.addColorStop(0, '#fff4c0'); hub.addColorStop(0.5, '#ffce46'); hub.addColorStop(1, '#c67a0a');
    g.beginPath(); g.arc(cx, cy, 24, 0, Math.PI * 2); g.fillStyle = hub; g.fill();
    g.lineWidth = 3; g.strokeStyle = '#8f5200'; g.stroke();
    g.font = '22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('🎡', cx, cy + 1);
  },

  _spinWheel(viaAd) {
    const idx = Daily.spin(viaAd);
    if (idx < 0) { this.renderMain(); return; }
    const btn = this.$('btnSpin');
    const coinBtn = this.$('btnSpinCoins');
    btn.disabled = true; if (coinBtn) coinBtn.disabled = true;
    const stage = document.querySelector('.wheel-stage');
    const n = CFG.WHEEL.length;
    const start = this._wheelAngle;
    // Сектор idx має зупинитися під стрілкою (зверху, -90°)
    const target = -Math.PI / 2 - (idx + 0.5) / n * Math.PI * 2 - Math.PI * 2 * 6;
    const dur = 3800;
    const t0 = performance.now();
    let lastTick = 0;
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const ang = start + (target - start) * Utils.easeOutCubic(p);
      this._wheelAngle = ang;
      this._drawWheel(ang);
      // Клацання на кожному новому секторі
      const cur = Math.floor(ang / (Math.PI * 2) * n);
      if (cur !== lastTick) { lastTick = cur; if (p < 0.97) Audio2.play('wheel'); }
      if (p < 1) requestAnimationFrame(tick);
      else {
        Utils.vibrate(30);
        if (stage) { stage.classList.add('wheel-pulse'); setTimeout(() => stage.classList.remove('wheel-pulse'), 500); }
        const s = CFG.WHEEL[idx];
        const sec = this._wheelSector(s);
        const icon = sec.img ? Utils.ic(s.coins ? 'coin' : 'gem', 'reveal-big') : `<span class="reveal-emoji">${sec.emoji}</span>`;
        const label = s.coins ? '+' + s.coins : s.gems ? '+' + s.gems : I18N.booster(s.booster).name;
        setTimeout(() => {
          Daily.giveReward(s);
          Achievements.check();
          this.revealReward({
            icon, title: I18N.t('you_won'),
            items: [{ ico: sec.img ? Utils.moneyIco(s.coins ? '🪙' : '💜') : sec.emoji, text: label }],
            anticipation: false,
            onClose: () => this.renderMain()
          });
        }, 450);
      }
    };
    requestAnimationFrame(tick);
  },

  /* ============================================================
   * Brawl-Stars-стиль: відкриття з передчуттям, спалахом і
   * послідовною появою нагород. Використовується скринями/колесом.
   * ============================================================ */
  revealReward({ icon, title, items, onClose, anticipation = true }) {
    this.modal(`
      <div class="reveal ${anticipation ? 'anticipate' : ''}">
        <div class="reveal-rays"></div>
        <div class="reveal-flash"></div>
        <div class="reveal-icon">${icon}</div>
        <h2 class="reveal-title">${title}</h2>
        <div class="reveal-items reward-row"></div>
        <button class="btn-3d btn-green reveal-cta" data-close>${I18N.t('great')}</button>
      </div>
    `, true);
    const box = this.$('modalBox');
    const reveal = box.querySelector('.reveal');
    const iconEl = box.querySelector('.reveal-icon');
    const itemsEl = box.querySelector('.reveal-items');

    const burstDelay = anticipation ? 850 : 250;
    if (anticipation) { Audio2.play('wheel'); Utils.vibrate(20); }

    // Спалах + промені
    setTimeout(() => {
      reveal.classList.add('burst');
      Audio2.play('chest');
      Utils.vibrate(40);
      Fx.confetti(70);
    }, burstDelay);

    // Поява нагород по черзі
    setTimeout(() => {
      iconEl.classList.add('done');
      box.querySelector('.reveal-title').classList.add('show');
      items.forEach((r, i) => {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'reward-item pop';
          el.innerHTML = `<span class="ico">${r.ico}</span>${r.text}`;
          itemsEl.appendChild(el);
          Audio2.play(i === 0 ? 'gem' : 'coin');
          Utils.vibrate(15);
        }, i * 260);
      });
      setTimeout(() => box.querySelector('.reveal-cta').classList.add('show'), items.length * 260 + 200);
    }, burstDelay + 260);

    this._modalNoClose = false;
    box.querySelector('.reveal-cta').addEventListener('click', () => { this.closeModal(); onClose && onClose(); }, { once: true });
  },

  /* ---------------- Досягнення ---------------- */
  renderAchievements() {
    const done = Achievements.list.filter(a => Achievements.isClaimed(a)).length;
    this.$('achCount').textContent = `${done}/100`;
    // Сортування: готові до отримання → у прогресі → отримані
    const sorted = [...Achievements.list].sort((a, b) => {
      const ka = Achievements.isClaimed(a) ? 2 : Achievements.isDone(a) ? 0 : 1;
      const kb = Achievements.isClaimed(b) ? 2 : Achievements.isDone(b) ? 0 : 1;
      return ka - kb;
    });
    this.$('achList').innerHTML = sorted.map(a => {
      const v = Math.min(Achievements.value(a), a.goal);
      const done = Achievements.isDone(a), claimed = Achievements.isClaimed(a);
      return `<div class="ach glass ${done ? 'done' : 'locked'}">
        <div class="ico">${a.g}</div>
        <div class="info"><b>${Achievements.name(a)}</b>
          <div class="bar"><i style="width:${(v / a.goal * 100).toFixed(0)}%"></i></div>
        </div>
        <button class="buy-btn" data-ach="${a.id}" ${!done || claimed ? 'disabled' : ''}>
          ${claimed ? '✓' : a.reward + ' ' + Utils.ic('coin')}</button>
      </div>`;
    }).join('');
  },

  /* ---------------- Колекція ---------------- */
  renderCollection() {
    const d = Storage.data;
    const coll = d.collection;
    this.$('collCount').textContent = `${coll.length}/${CFG.TILES.length}`;

    // Пояснення умови + віхи з нагородами + сітка з прогресом
    const milestones = CFG.COLLECTION_MILESTONES.map(m => {
      const done = coll.length >= m.n;
      const claimed = d.collectionClaimed.includes(m.n);
      const ico = m.coins ? Utils.ic('coin') : m.gems ? Utils.ic('gem') : CFG.CHESTS[m.chest].g;
      const val = m.coins || m.gems || I18N.chest(m.chest);
      return `<div class="mission glass">
        <div class="info">
          <b>${I18N.t('a_coll', { n: m.n })}</b>
          <div class="bar"><i style="width:${Math.min(100, coll.length / m.n * 100).toFixed(0)}%"></i></div>
          <small>${Math.min(coll.length, m.n)}/${m.n}</small>
        </div>
        <button class="buy-btn" data-collmile="${m.n}" ${!done || claimed ? 'disabled' : ''}>
          ${claimed ? '✓' : ico + ' ' + val}</button>
      </div>`;
    }).join('');

    const grid = CFG.TILES.map((t, i) => {
      const has = coll.includes(i);
      const prog = d.collectionCount[i] || 0;
      const progBadge = !has && prog > 0
        ? `<em class="coll-prog">${prog}/${CFG.COLLECTION_TRIPLES}</em>` : '';
      return `<div class="coll-cell ${has ? '' : 'unknown'}" title="${has ? I18N.tile(i) : '???'}"
        style="animation-delay:${i * 12}ms">${has ? Assets.tileHtml(i) : '?'}${progBadge}</div>`;
    }).join('');

    this.$('collGrid').outerHTML = `<div id="collGrid" class="scroll">
      <p class="coll-note">${I18N.t('coll_hint', { k: CFG.COLLECTION_TRIPLES, r: CFG.COLLECTION_REWARD })}</p>
      <h3 class="section-title">${I18N.t('coll_rewards')}</h3>
      ${milestones}
      <div class="coll-grid" style="padding-top:10px">${grid}</div>
    </div>`;
  },

  /** Отримання нагороди за віху колекції. */
  claimCollectionMilestone(n) {
    const d = Storage.data;
    const m = CFG.COLLECTION_MILESTONES.find(x => x.n === +n);
    if (!m || d.collection.length < m.n || d.collectionClaimed.includes(m.n)) return;
    d.collectionClaimed.push(m.n);
    Daily.giveReward(m);          // видає монети/кристали/скриню з тостами
    Audio2.play('chest');
    Storage.save();
    this.renderCollection();
  },

  /* ---------------- Ігрові модальні вікна ---------------- */
  showWin(stars, score, coins, gems, xp) {
    const title = stars === 3 ? I18N.t('win_title') : stars === 2 ? I18N.t('win_good') : I18N.t('win_ok');
    const d = Storage.data;
    const need = CFG.xpForLevel(d.profileLevel);
    const prevXp = Math.max(0, d.xp - xp);
    const xpPctStart = Math.min(100, (prevXp / need * 100)).toFixed(0);
    const xpPctEnd = Math.min(100, (d.xp / need * 100)).toFixed(0);
    const nextLvl = d.profileLevel + 1;

    const starHtml = [0, 1, 2].map(i => {
      const on = i < stars;
      const cls = i === 1 ? 'win-star win-star-big' : 'win-star';
      return `<div class="${cls}${on ? '' : ' off'}"></div>`;
    }).join('');

    let di = 0;
    const cardCoins = `<div class="win-card" style="--d:${di++}">
      <span class="win-card-ico">${Utils.ic('coin')}</span>
      <span class="win-card-label">${I18N.t('tab_coins')}</span>
      <span class="win-card-val">+${coins}</span>
    </div>`;
    const cardGems = gems ? `<div class="win-card" style="--d:${di++}">
      <span class="win-card-ico">${Utils.ic('gem')}</span>
      <span class="win-card-label">${I18N.t('tab_gems')}</span>
      <span class="win-card-val">+${gems}</span>
    </div>` : '';
    const cardXp = `<div class="win-card" style="--d:${di}">
      <span class="win-card-ico">${Utils.ic('star')}</span>
      <span class="win-card-label">${I18N.t('experience')}</span>
      <span class="win-card-val">+${xp}</span>
    </div>`;

    this.modal(`
      <div class="win-panel">
        <div class="win-stars-row">${starHtml}</div>
        <div class="win-body">
          <div class="win-ribbon">
            <span class="win-title">${title}</span>
          </div>
          <div class="win-score-label">${I18N.t('final_score')}</div>
          <div class="win-score" id="winScore">0</div>
          <div class="win-divider"><span class="win-divider-gem"></span></div>
          <div class="win-rewards">${cardCoins}${cardGems}${cardXp}</div>
          <button class="win-btn-next" id="btnNextLevel">${I18N.t('next')}</button>
          <button class="win-btn-menu" id="btnWinMenu">☰ ${I18N.t('to_menu')}</button>
          <div class="win-xp-row">
            <div class="win-xp-levels">
              <span class="win-xp-lvl">Lv.${d.profileLevel}</span>
              <span class="win-xp-lvl win-xp-lvl-next">Lv.${nextLvl}</span>
            </div>
            <div class="win-xp-track">
              <i class="win-xp-fill" style="width:${xpPctStart}%"></i>
              <div class="win-xp-badge">${d.profileLevel}</div>
            </div>
            <div class="win-xp-text">
              <span><b>${d.xp}</b> / ${need} XP</span>
              <span>+${xp} XP</span>
            </div>
          </div>
        </div>
      </div>
    `, true);
    this.$('modalBox').classList.add('win-mode');

    const box = this.$('modalBox');
    const body = box.querySelector('.win-body');
    for (let s = 0; s < 8; s++) {
      const sp = document.createElement('div');
      sp.className = 'win-sparkle';
      sp.style.cssText = `left:${10 + Math.random() * 80}%;top:${8 + Math.random() * 84}%;`
        + `--dx:${(Math.random() - 0.5) * 24}px;--dy:${-12 - Math.random() * 30}px;`
        + `--dur:${2.5 + Math.random() * 2}s;--del:${Math.random() * 3}s;`;
      body.appendChild(sp);
    }

    setTimeout(() => {
      const fill = box.querySelector('.win-xp-fill');
      if (fill) fill.style.width = xpPctEnd + '%';
    }, 400);

    if (Game.mode === 'daily') {
      this.$('btnNextLevel').textContent = I18N.t('to_menu');
      this.$('btnNextLevel').onclick = () => { this.closeModal(); Game.quitToMenu(); };
      this.toast(I18N.t('daily_done'));
    } else {
      this.$('btnNextLevel').onclick = () => { this.closeModal(); Game.startLevel(Math.min(Game.levelNum + 1, CFG.TOTAL_LEVELS)); };
    }
    this.$('btnWinMenu').onclick = () => { this.closeModal(); Game.quitToMenu(); };

    const el = this.$('winScore');
    const t0 = performance.now();
    const count = (now) => {
      const p = Math.min(1, (now - t0) / 1200);
      el.textContent = Utils.fmt(Math.round(score * Utils.easeOutCubic(p)));
      if (p < 1 && el.isConnected) requestAnimationFrame(count);
    };
    requestAnimationFrame(count);

    Fx.confetti(130);
    Fx.fireworksShow(stars + 2);
    setTimeout(() => Fx.coinRain(18, Utils.iconImg('coin')), 500);
    if (gems) setTimeout(() => Fx.coinRain(6, Utils.iconImg('gem')), 900);

    setTimeout(() => {
      Fx.flyTo(innerWidth / 2, innerHeight / 2 - 30, this.$('hudCoins'), Utils.iconImg('coin'), 8,
        () => { Audio2.play('coin'); this._bump('hudCoins'); });
      if (gems) setTimeout(() => Fx.flyTo(innerWidth / 2, innerHeight / 2, this.$('hudGems'), Utils.iconImg('gem'), 4,
        () => { Audio2.play('gem'); this._bump('hudGems'); }), 400);
    }, 900);
  },

      <p style="margin:10px 0;opacity:0.85">${text}</p>

  /* ---------------- Прив'язка подій ---------------- */
  bind() {
    Utils.buildIcons();
    this.paintIcons();
    this.paintMenuIcons();
    // Навігація
    document.querySelectorAll('[data-nav]').forEach(b =>
      b.addEventListener('click', () => { Audio2.init(); Audio2.play('tap'); this.showScreen(b.dataset.nav); }));
    document.querySelectorAll('[data-back]').forEach(b =>
      b.addEventListener('click', () => { Audio2.play('tap'); this.showScreen('main'); }));

    this.$('btnPlay').onclick = () => { Audio2.init(); this.showScreen('levels'); };
    this.$('btnZen').onclick = () => { Audio2.init(); Game.startZen(); };
    this.$('btnDailyCh').onclick = () => { Audio2.init(); Game.startDaily(); };
    this.$('btnSettings').onclick = () => { Audio2.init(); this.showSettings(); };
    this.$('btnDaily').onclick = () => { Audio2.init(); this.showScreen('daily'); };
    this.$('btnMissions').onclick = () => { Audio2.init(); this.showScreen('daily'); };
    this.$('btnWheel').onclick = () => { Audio2.init(); this.showWheel(); };
    this.$('btnChests').onclick = () => { Audio2.init(); this.showScreen('chests'); };
    this.$('btnPause').onclick = () => Game.pause();
    this.$('lvlPrev').onclick = () => { this.lvlPage--; this.renderLevels(); };
    this.$('lvlNext').onclick = () => { this.lvlPage++; this.renderLevels(); };

    document.querySelectorAll('.plus').forEach(b =>
      b.addEventListener('click', e => { e.stopPropagation(); this.openShop(b.dataset.shop); }));

    this.$('btnClaimDaily').onclick = () => { if (Daily.claim()) this.renderDaily(); };

    // Вкладки магазину (перемикачі)
    document.querySelectorAll('#shopTabs button').forEach(b =>
      b.addEventListener('click', () => { Audio2.play('tap'); this.shopTab(b.dataset.tab); }));

    // Делеговані кліки: рівні, магазин, місії, досягнення, скрині, бустери
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-binfo],[data-chinfo],[data-collmile],[data-adreward],[data-buychest],[data-adchest],[data-level],[data-buy-booster],[data-mission],[data-ach],[data-chest],[data-booster],[data-theme],[data-iap],[data-close]');
      if (!t) return;
      if (t.dataset.binfo) { this.boosterInfo(t.dataset.binfo); return; }   // ⓘ перехоплює клік до кнопки
      if (t.dataset.chinfo) { this.chestInfo(t.dataset.chinfo); return; }   // ⓘ скрині
      if (t.dataset.collmile) { this.claimCollectionMilestone(t.dataset.collmile); return; }
      if (t.dataset.close !== undefined) { this.closeModal(); return; }
      if (t.dataset.level) { Audio2.init(); Game.startLevel(+t.dataset.level); return; }
      if (t.dataset.booster) {
        const used = Boosters.use(t.dataset.booster);
        this.updateBoosterBar();
        if (used) {          // пульс кнопки після успішного використання
          const btn = document.querySelector(`.booster-btn[data-booster="${t.dataset.booster}"]`);
          if (btn) btn.classList.add('pop');
        }
        return;
      }
      if (t.dataset.buyBooster) { Boosters.buy(t.dataset.buyBooster); this.shopTab('boosters'); return; }
      if (t.dataset.mission !== undefined) { if (Missions.claim(+t.dataset.mission)) this.renderDaily(); return; }
      if (t.dataset.ach) {
        const a = Achievements.list.find(x => x.id === t.dataset.ach);
        if (a && Achievements.claim(a)) this.renderAchievements();
        return;
      }
      if (t.dataset.chest) { this.openChest(t.dataset.chest); return; }
      if (t.dataset.adreward) {
        const kind = t.dataset.adreward;
        if (Daily.adLeft(kind) <= 0) return;
        Ads.showRewarded(() => { Daily.useAdReward(kind); this.renderShop(); });
        return;
      }
      if (t.dataset.buychest) {
        const id = t.dataset.buychest;
        const price = CFG.CHESTS[id].price;
        if (Storage.data.coins < price) { this.toast(I18N.t('not_enough_coins')); return; }
        Storage.addCoins(-price);
        Storage.data.chests[id]++;
        Storage.save();
        Audio2.play('coin');
        this.renderChests();
        return;
      }
      if (t.dataset.adchest) {
        const id = t.dataset.adchest;
        if (Daily.adChestLeft(id) <= 0) { this.toast(I18N.t('ad_chest_limit')); return; }
        Ads.showRewarded(() => {
          const r = Daily.addAdChest(id);
          if (r.granted) { Audio2.play('chest'); this.toast(I18N.t('chest_earned', { name: I18N.chest(id) })); }
          else if (r.blocked) this.toast(I18N.t('ad_chest_limit'));
          else this.toast(I18N.t('ad_chest_progress', { x: r.progress, n: r.need }));
          this.renderChests();
        });
        return;
      }
      if (t.dataset.theme) {
        const th = CFG.THEMES.find(x => x.id === t.dataset.theme);
        const d = Storage.data;
        if (!d.themes.includes(th.id)) {
          if (d.gems < th.cost) { this.toast(I18N.t('not_enough_gems')); return; }
          Storage.addGems(-th.cost);
          d.themes.push(th.id);
        }
        d.theme = th.id;
        Storage.save();
        this.applyTheme();
        if (Storage.data.settings.music) Audio2.startMusic();
        this.toast(I18N.t('theme_applied', { name: I18N.theme(th.id) }));
        this.shopTab('themes');
        return;
      }
      if (t.dataset.iap) {
        Ads.purchase(t.dataset.iap, () => {
          const kind = t.dataset.kind;
          if (kind === 'coins') Storage.addCoins(+t.dataset.amount);
          else if (kind === 'gems') Storage.addGems(+t.dataset.amount);
          else if (kind === 'premium') { Storage.data.premium = true; Storage.addGems(1000); Ads.hideBanner(); }
          Storage.save();
          Audio2.play('coin');
          this.renderShop();
        });
      }
    });

    // Шпаринка для клавіатури на ПК
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && Game.state === 'playing') Game.pause();
    });
  }
};

// === js/main.js ===
/* ============================================================
 * Mystic Relics — main.js
 * Точка входу: ініціалізація всіх модулів у правильному порядку.
 * ============================================================ */
'use strict';

document.addEventListener('DOMContentLoaded', () => {
  Storage.load();            // 1. Збереження
  Assets.load();             // 1б. PNG-спрайти (необов'язкові, fallback — emoji)
  I18N.apply();              // 2. Мова інтерфейсу (за замовчуванням — англійська)
  Achievements.build();      // 3. 100 досягнень
  Daily.onLogin();           // 4. Щоденний вхід + місії
  UI.applyTheme();           // 5. Тема (кольори, фон)
  UI.bind();                 // 6. Обробники подій
  Background.init(document.getElementById('bgFx'));    // 6. Живий фон з паралаксом
  Fx.init();                 // 7. Святкові ефекти (конфеті, феєрверки)
  Board.init(document.getElementById('gameCanvas'));   // 8. Ігрове поле
  UI.showScreen('main');     // 9. Головне меню
  Game.startLoop();          // 10. Головний цикл (60 FPS)
  Ads.showBanner();          // 11. Місце під банер AdMob

  // Ховаємо системну шторку (status bar) на нативній платформі
  try {
    const C = window.Capacitor;
    if (C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.StatusBar) {
      C.Plugins.StatusBar.setOverlaysWebView({ overlay: false });
      C.Plugins.StatusBar.hide({ animation: 'FADE' });
    }
  } catch (e) {}

  // WebAudio дозволено запускати лише після першого дотику користувача
  const unlock = () => { Audio2.init(); Audio2.resume(); };
  document.addEventListener('pointerdown', unlock, { once: true });

  // Авто-пауза, коли гру згорнуто (телефон заблоковано, інший додаток)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && Game.state === 'playing') Game.pause();
  });

  // Блокуємо контекстне меню на довгий дотик (мобільні браузери)
  document.addEventListener('contextmenu', e => e.preventDefault());
});

</script>
