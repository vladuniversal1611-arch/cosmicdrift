    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },

  /** Шумовий сплеск (вибухи, пил). */
  noise(dur, vol = 0.2, delay = 0, filterFreq = 1200) {
    if (!this.ctx || !Storage.data.settings.sound) return;
    const t0 = this.ctx.currentTime + delay;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filterFreq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  },

  /** Іменовані звукові ефекти гри. */
  play(name, arg) {
    if (!this.ctx) return;
    this.resume();
    switch (name) {
      case 'tap':     this.tone(600, 0.08, 'triangle', 0.25); this.tone(900, 0.06, 'sine', 0.15, 0.02); break;
      case 'place':   this.tone(420, 0.1, 'sine', 0.3, 0, -80); break;
      case 'match': { // комбо: висота росте з множником
        const m = Math.min(arg || 1, 6);
        [0, 4, 7].forEach((s, i) => this.tone(523 * Math.pow(2, (s + m * 2) / 12), 0.18, 'triangle', 0.3, i * 0.06));
        this.noise(0.25, 0.15, 0, 2500);
        break;
      }
      case 'win':
        [0, 4, 7, 12, 16].forEach((s, i) => this.tone(523 * Math.pow(2, s / 12), 0.35, 'triangle', 0.3, i * 0.12));
        this.noise(0.6, 0.1, 0.5, 4000);
        break;
      case 'lose':
        [7, 3, 0, -5].forEach((s, i) => this.tone(392 * Math.pow(2, s / 12), 0.4, 'sawtooth', 0.15, i * 0.18));
        break;
      case 'booster': this.tone(300, 0.3, 'sawtooth', 0.15, 0, 600); this.tone(900, 0.2, 'sine', 0.2, 0.1, 300); break;
      case 'chest':
        this.tone(180, 0.15, 'square', 0.15); this.tone(240, 0.15, 'square', 0.15, 0.12);
        [0, 4, 7, 12].forEach((s, i) => this.tone(660 * Math.pow(2, s / 12), 0.25, 'triangle', 0.25, 0.3 + i * 0.08));
        break;
      case 'coin':    this.tone(1200, 0.08, 'square', 0.12); this.tone(1600, 0.15, 'square', 0.1, 0.06); break;
      case 'gem':     this.tone(1500, 0.2, 'sine', 0.2, 0, 500); break;
      case 'crack':   this.noise(0.12, 0.3, 0, 900); this.tone(200, 0.08, 'square', 0.1); break;
      case 'unlock':  this.tone(500, 0.1, 'square', 0.15); this.tone(750, 0.2, 'triangle', 0.2, 0.08); break;
      case 'error':   this.tone(200, 0.15, 'sawtooth', 0.2); this.tone(150, 0.2, 'sawtooth', 0.2, 0.1); break;
      case 'wheel':   this.tone(800, 0.04, 'square', 0.1); break;
      case 'levelup': [0, 5, 9, 12].forEach((s, i) => this.tone(440 * Math.pow(2, s / 12), 0.3, 'triangle', 0.25, i * 0.1)); break;
      case 'portal':  this.tone(300, 0.5, 'sine', 0.15, 0, 900); this.tone(1200, 0.5, 'sine', 0.1, 0, -900); break;
      case 'curse':   this.tone(120, 0.4, 'sawtooth', 0.2, 0, -40); break;
      case 'freeze':  this.tone(2000, 0.4, 'sine', 0.15, 0, -1400); this.noise(0.3, 0.08, 0, 6000); break;
      case 'tick':    this.tone(1150, 0.05, 'square', 0.14); this.tone(580, 0.07, 'sine', 0.1, 0.02); break;
      case 'intro':   [0, 7, 12].forEach((s, i) => this.tone(392 * Math.pow(2, s / 12), 0.25, 'triangle', 0.25, i * 0.09)); break;
    }
  },

  /* ------------------------------------------------------------
   * Процедурна фонова музика 2.0 — багатошаровий рушій:
   *   • пад-акорди (3 голоси, повільна атака) за прогресією I–IV–V–I
   *   • бас: тоніка та квінта у чвертях
   *   • м'яка перкусія: кік (синус-тон вниз) + хет (шум)
   *   • мелодія: «випадкова прогулянка» гамою теми зі структурою
   *     A-A-B-A (у B-тактах мелодія активніша, з октавними стрибками)
   * 16 кроків × 170 мс на такт; гама і тон — з активної теми.
   * ---------------------------------------------------------- */
  startMusic() {
    this.stopMusic();
    if (!this.ctx || !Storage.data.settings.music) return;
    this._musicStep = 0;
    this._mel = 4;
    const PROG = [0, 3, 4, 0];                   // ступені акордів (I–IV–V–I)
    const step = () => {
      const theme = CFG.THEMES.find(t => t.id === Storage.data.theme) || CFG.THEMES[0];
      const scale = theme.scale, base = theme.base;
      const i = this._musicStep++;
      const pos = i % 16, bar = Math.floor(i / 16);
      const rootDeg = PROG[bar % 4];
      const root = scale[rootDeg % scale.length];
      const isB = bar % 4 === 2;                 // такт «B» — жвавіший

      // Пад-акорд: три голоси з м'якою атакою на початку такту
      if (pos === 0) {
        [0, 2, 4].forEach(k => {
          const idx = rootDeg + k;
          const dg = scale[idx % scale.length] + 12 * Math.floor(idx / scale.length);
          this._mtone(base * Math.pow(2, dg / 12), 3.6, 'sine', 0.16, 0.7);
        });
      }
      // Бас: тоніка (сильні долі) та квінта (слабкі)
      if (pos === 0 || pos === 8) this._mtone(base / 2 * Math.pow(2, root / 12), 1.3, 'sine', 0.5);
      if (pos === 4 || pos === 12) this._mtone(base / 2 * Math.pow(2, (root + 7) / 12), 1.0, 'sine', 0.38);
      // Перкусія: кік на сильні долі, хет на «і»
      if (pos % 8 === 0) this._kick();
      if (pos % 4 === 2) this._hat();
      // Мелодія: прогулянка гамою (2 октави), паузи роблять фразування
      const busy = isB ? 0.8 : 0.55;
      if (pos % 2 === 0 && Math.random() < busy) {
        this._mel = Utils.clamp(this._mel + Math.floor(Math.random() * 5) - 2, 0, 9);
        const dg = scale[this._mel % scale.length] + 12 * Math.floor(this._mel / scale.length);
        this._mtone(base * Math.pow(2, dg / 12), isB ? 0.4 : 0.6, 'triangle', 0.3);
        // Октавне «відлуння» у B-тактах
        if (isB && Math.random() < 0.3) {
          this._mtone(base * 2 * Math.pow(2, dg / 12), 0.3, 'sine', 0.12);
        }
      }
      this._musicTimer = setTimeout(step, 170);
    };
    step();
  },

  _mtone(freq, dur, type, vol, attack = 0.05) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.musicGain);
    o.start(t0); o.stop(t0 + dur + 0.1);
  },

  /** М'який кік: короткий синус зі спадом висоти. */
  _kick() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(105, t0);
    o.frequency.exponentialRampToValueAtTime(45, t0 + 0.12);
    g.gain.setValueAtTime(0.5, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
    o.connect(g); g.connect(this.musicGain);
    o.start(t0); o.stop(t0 + 0.16);
  },

  /** Тихий хет: короткий сплеск фільтрованого шуму. */
  _hat() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * 0.04);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 6000;
    const g = this.ctx.createGain();
    g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(this.musicGain);
    src.start(t0);
  },

  stopMusic() { clearTimeout(this._musicTimer); this._musicTimer = null; },

  toggleMusic(on) { on ? this.startMusic() : this.stopMusic(); },

  /** Пауза всього звуку, коли гру згорнули у фон; відновлення при поверненні. */
  onVisibility() {
    if (document.hidden) {
      this.stopMusic();
      if (this.ctx && this.ctx.state === 'running') this.ctx.suspend();
    } else if (this.ctx) {
      this.ctx.resume();
      if (Storage.data.settings.music) this.startMusic();
    }
  }
};

document.addEventListener('visibilitychange', () => Audio2.onVisibility());
window.addEventListener('pagehide', () => { Audio2.stopMusic(); if (Audio2.ctx && Audio2.ctx.state === 'running') Audio2.ctx.suspend(); });

// === js/particles.js ===
/* ============================================================
 * Mystic Relics — particles.js
 * Система частинок з Object Pooling — без збирання сміття
 * у гарячому циклі, стабільні 60 FPS.
 * ============================================================ */
'use strict';

const Particles = {
  pool: [],
  active: [],
  MAX: 600,

  _get() {
    return this.pool.pop() || { x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, size: 0, color: '#fff', grav: 0, glyph: null, spin: 0, rot: 0 };
  },

  spawn(opts) {
    if (this.active.length >= this.MAX) return;
    if (Storage.data.settings.quality === 'low' && Math.random() < 0.6) return;
    const p = this._get();
    Object.assign(p, {
      x: opts.x, y: opts.y,
      vx: opts.vx || 0, vy: opts.vy || 0,
      life: opts.life || 0.8, maxLife: opts.life || 0.8,
      size: opts.size || 4, color: opts.color || '#ffd700',
      grav: opts.grav || 0, glyph: opts.glyph || null,
      spin: opts.spin || 0, rot: 0, ring: opts.ring || false
    });
    this.active.push(p);
  },

  /** Вибух трійки плиток. */
  burst(x, y, color, n = 22) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 80 + Math.random() * 260;
      this.spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        life: 0.5 + Math.random() * 0.6, size: 2 + Math.random() * 5,
        color, grav: 350
      });
    }
    // Іскри-зірочки
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      this.spawn({
        x, y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120 - 100,
        life: 0.9, size: 14, glyph: '✦', color: '#fff8d0', grav: 200, spin: 4
      });
    }
  },

  /** Ударна хвиля — кільце, що розширюється. */
  ring(x, y, color) {
    this.spawn({ x, y, life: 0.45, size: 6, color, ring: true });
  },

  /** Пил при появі/падінні плитки. */
  dust(x, y, color = 'rgba(255,255,255,0.5)') {
    for (let i = 0; i < 8; i++) {
      this.spawn({
        x: x + (Math.random() - 0.5) * 30, y,
        vx: (Math.random() - 0.5) * 60, vy: -20 - Math.random() * 40,
        life: 0.4 + Math.random() * 0.3, size: 3 + Math.random() * 3, color
      });
    }
  },

  /** Сяйво навколо підказки/бонусу. */
  sparkle(x, y, color = '#ffe066') {
    this.spawn({
      x: x + (Math.random() - 0.5) * 40, y: y + (Math.random() - 0.5) * 40,
      vx: 0, vy: -30, life: 0.7, size: 10, glyph: '✨', color, spin: 2
    });
  },

  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const p = this.active[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.active.splice(i, 1);
        if (this.pool.length < this.MAX) this.pool.push(p);
        continue;
      }
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
    }
  },

  draw(ctx) {
    for (const p of this.active) {
      const a = Math.min(1, p.life / p.maxLife * 2);
      ctx.globalAlpha = a;
      if (p.ring) {
        // Ударна хвиля: радіус росте, товщина та прозорість спадають
        const prog = 1 - p.life / p.maxLife;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(1, 7 * (1 - prog));
        ctx.globalAlpha = a * 0.8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size + prog * 70, 0, Math.PI * 2);
        ctx.stroke();
      } else if (p.glyph) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.font = `${p.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = p.color;
        ctx.fillText(p.glyph, 0, 0);
        ctx.restore();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  },

  clear() {
    this.pool.push(...this.active);
    this.active.length = 0;
  }
};

// === js/background.js ===
/* ============================================================
 * Mystic Relics — background.js
 * Живий анімований фон із паралаксом: три сцени (магічний ліс,
 * печера з кристалами, стародавній храм), світлячки, туман,
 * листя/іскри, пульсуюче світіння.
 *
 * Оптимізація: силуети шарів і м'які плями пре-рендеряться в
 * offscreen-канваси один раз на resize/зміну теми; у кадрі —
 * лише drawImage з паралакс-зсувом і ~40 спрайтів частинок.
 * Нові сцени додаються одним методом _scene<Name>().
 * ============================================================ */
'use strict';

const Background = {
  canvas: null, g: null, w: 0, h: 0,
  far: null, mid: null,          // пре-рендерені шари паралаксу
  fogSprite: null, gloSprite: null, flySprite: null,
  flies: [], leaves: [], fog: [],
  t: 0, _last: 0, _themeId: '',

  init(canvas) {
    this.canvas = canvas;
    this.g = canvas.getContext('2d');
    window.addEventListener('resize', () => this.build());
    this.build();
    this._last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - this._last) / 1000);
      this._last = now;
      this.t += dt;
      this.draw(dt);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },

  theme() { return CFG.THEMES.find(t => t.id === Storage.data.theme) || CFG.THEMES[0]; },

  /** Повна перебудова шарів (resize або зміна теми). */
  build() {
    const th = this.theme();
    this._themeId = th.id;
    this.w = this.canvas.width = innerWidth;
    this.h = this.canvas.height = innerHeight;

    // --- Спрайт туману: велика м'яка пляма ---
    this.fogSprite = this._radial(260, 'rgba(255,255,255,0.16)');
    // --- Спрайт світіння світлячка ---
    this.flySprite = this._radial(22, th.accent);
    // --- Велике амбієнтне світіння ---
    this.gloSprite = this._radial(Math.max(this.w, 420), th.accent);

    // --- Шари силуетів ---
    this.far = this._layer(0.30, th);
    this.mid = this._layer(0.55, th);

    // --- Частинки ---
    const q = Storage.data.settings.quality === 'low';
    this.flies = Array.from({ length: q ? 8 : 22 }, () => ({
      x: Math.random() * this.w, y: this.h * 0.15 + Math.random() * this.h * 0.8,
      a: Math.random() * Math.PI * 2, sp: 8 + Math.random() * 18,
      ph: Math.random() * Math.PI * 2, s: 0.5 + Math.random() * 0.9
    }));
    this.leaves = Array.from({ length: q ? 5 : 12 }, () => this._leaf(true));
    this.fog = Array.from({ length: q ? 2 : 4 }, (_, i) => ({
      x: Math.random() * this.w, y: this.h * (0.35 + 0.16 * i),
      sp: 6 + Math.random() * 10, sc: 1.6 + Math.random() * 2.4, al: 0.35 + Math.random() * 0.3
    }));
  },

  _leaf(anywhere) {
    return {
      x: Math.random() * this.w,
      y: anywhere ? Math.random() * this.h : -20,
      vy: 22 + Math.random() * 26, ph: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 2,
      s: 0.6 + Math.random() * 0.8
    };
  },

  /** М'яка радіальна пляма кольору у offscreen-спрайт. */
  _radial(r, color) {
    const c = document.createElement('canvas');
    c.width = c.height = r * 2;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, color);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, r * 2, r * 2);
    return c;
  },

  /** Пре-рендер шару силуетів. depth 0..1 — наскільки «близько». */
  _layer(depth, th) {
    const c = document.createElement('canvas');
    c.width = this.w + 120;                 // запас для паралакс-зсуву
    c.height = this.h;
    const g = c.getContext('2d');
    const rnd = Utils.rng((th.id.length * 977 + Math.round(depth * 100)) | 0);
    const dark = `rgba(0,0,0,${0.28 + depth * 0.3})`;
    const scene = th.scene || 'forest';
    if (scene === 'forest') this._sceneForest(g, c.width, c.height, depth, dark, rnd, th);
    else if (scene === 'cave') this._sceneCave(g, c.width, c.height, depth, dark, rnd, th);
    else this._sceneTemple(g, c.width, c.height, depth, dark, rnd, th);
    return c;
  },

  /* ---- Сцена: магічний ліс — стовбури з кронами по краях кадру ---- */
  _sceneForest(g, w, h, depth, dark, rnd, th) {
    g.fillStyle = dark;
    const n = Math.round(4 + depth * 3);
    for (let i = 0; i < n; i++) {
      // Дерева тяжіють до країв, центр лишається «повітряним»
      const edge = i % 2 === 0;
      const x = edge
        ? rnd() * w * 0.3
        : w - rnd() * w * 0.3;
      const tw = (18 + rnd() * 22) * (0.5 + depth);
      const ty = -h * 0.05 + rnd() * h * 0.12;      // верхівка за кадром
      // Стовбур, що звужується догори, з легким вигином
      const bend = (rnd() - 0.5) * 40;
      g.beginPath();
      g.moveTo(x - tw / 2, h);
      g.quadraticCurveTo(x - tw * 0.25 + bend, h * 0.5, x - tw * 0.2 + bend, ty);
      g.lineTo(x + tw * 0.2 + bend, ty);
      g.quadraticCurveTo(x + tw * 0.25 + bend, h * 0.5, x + tw / 2, h);
      g.fill();
      // Кілька гілок убік
      for (let b = 0; b < 2; b++) {
        const by = h * (0.12 + rnd() * 0.3);
        const dir = rnd() < 0.5 ? -1 : 1;
        const len = (40 + rnd() * 50) * (0.5 + depth);
        g.save();
        g.translate(x + bend * 0.6, by);
        g.rotate(dir * (0.5 + rnd() * 0.5));
        g.fillRect(0, -tw * 0.1, len, tw * 0.2);
        // Листяна китиця на кінці гілки
        g.beginPath();
        g.ellipse(len, 0, len * 0.42, len * 0.2, 0.2, 0, Math.PI * 2);
        g.fill();
        g.restore();
      }
    }
    // Нависле листя згори (як рамка кадру)
    for (let i = 0; i < 6 + depth * 5; i++) {
      const x = rnd() * w;
      const br = (24 + rnd() * 34) * (0.4 + depth * 0.7);
      g.beginPath();
      g.ellipse(x, -br * 0.35 + rnd() * br * 0.4, br, br * 0.55, (rnd() - 0.5) * 0.5, 0, Math.PI * 2);
      g.fill();
    }
    // Трава-пагорб унизу
    g.beginPath();
    g.moveTo(0, h);
    for (let x = 0; x <= w; x += 40) g.lineTo(x, h - (14 + Math.sin(x * 0.02 + depth * 9) * 8) * (0.5 + depth));
    g.lineTo(w, h);
    g.fill();
    // Кущики трави
    for (let i = 0; i < 10; i++) {
      const x = rnd() * w, gh = (8 + rnd() * 14) * (0.5 + depth);
      for (let b = -2; b <= 2; b++) {
        g.beginPath();
        g.moveTo(x + b * 3, h);
        g.quadraticCurveTo(x + b * 5, h - gh * 0.7, x + b * 7, h - gh);
        g.quadraticCurveTo(x + b * 4, h - gh * 0.5, x + b * 3 + 2, h);
        g.fill();
      }
    }
  },

  /* ---- Сцена: печера — сталактити та світні кристали ---- */
  _sceneCave(g, w, h, depth, dark, rnd, th) {
    g.fillStyle = dark;
    // Сталактити зверху
    const n = Math.round(8 + depth * 8);
    for (let i = 0; i < n; i++) {
      const x = (i + rnd()) * (w / n);
      const len = (h * 0.08 + rnd() * h * 0.16) * (0.5 + depth);
      const wd = (14 + rnd() * 26) * (0.5 + depth);
      g.beginPath();
      g.moveTo(x - wd, 0); g.quadraticCurveTo(x, len * 0.6, x, len);
      g.quadraticCurveTo(x, len * 0.6, x + wd, 0);
      g.fill();
    }
    // Кам'яні брили знизу
    for (let i = 0; i < n / 2; i++) {
      const x = rnd() * w, r = (30 + rnd() * 60) * (0.5 + depth);
      g.beginPath(); g.ellipse(x, h + r * 0.3, r, r * 0.8, 0, Math.PI, 0); g.fill();
    }
    // Світні кристали (акцентний колір, ближній шар яскравіший)
    for (let i = 0; i < 4 + depth * 5; i++) {
      const x = rnd() * w, base = h - rnd() * h * 0.12;
      const ch = (26 + rnd() * 44) * (0.4 + depth), cw = ch * 0.3;
      const tilt = (rnd() - 0.5) * 0.7;
      g.save();
      g.translate(x, base); g.rotate(tilt);
      g.globalAlpha = 0.5 + depth * 0.4;
      // Сяйво за кристалом
      const glow = g.createRadialGradient(0, -ch / 2, 0, 0, -ch / 2, ch * 1.4);
      glow.addColorStop(0, th.accent + '66'); glow.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = glow;
      g.fillRect(-ch * 1.4, -ch * 2.4, ch * 2.8, ch * 2.8);
      // Сам кристал
      g.fillStyle = th.accent + 'cc';
      g.beginPath();
      g.moveTo(0, -ch); g.lineTo(cw, -ch * 0.55); g.lineTo(cw * 0.7, 0);
      g.lineTo(-cw * 0.7, 0); g.lineTo(-cw, -ch * 0.55);
      g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.45)';          // грань-відблиск
      g.beginPath(); g.moveTo(0, -ch); g.lineTo(cw * 0.35, -ch * 0.5); g.lineTo(0, 0); g.closePath(); g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
  },

  /* ---- Сцена: стародавній храм — колони та арки ---- */
  _sceneTemple(g, w, h, depth, dark, rnd, th) {
    g.fillStyle = dark;
    const n = Math.round(4 + depth * 4);
    const cw = (26 + depth * 30);
    for (let i = 0; i < n; i++) {
      const x = (i + 0.3 + rnd() * 0.4) * (w / n);
      const top = h * (0.16 - depth * 0.08) + rnd() * h * 0.1;
      const broken = rnd() < 0.4;
      const colH = broken ? h * (0.3 + rnd() * 0.3) : h - top;
      // Колона з канелюрами
      g.fillRect(x - cw / 2, h - colH, cw, colH);
      // Капітель та база
      g.fillRect(x - cw * 0.75, h - colH - cw * 0.35, cw * 1.5, cw * 0.4);
      g.fillRect(x - cw * 0.7, h - cw * 0.35, cw * 1.4, cw * 0.4);
      // Уламок арки між сусідніми колонами
      if (!broken && rnd() < 0.5) {
        g.beginPath();
        g.moveTo(x, h - colH);
        g.quadraticCurveTo(x + w / n / 2, h - colH - 40 * (0.5 + depth), x + w / n, h - colH + 10);
        g.lineTo(x + w / n, h - colH + 26);
        g.quadraticCurveTo(x + w / n / 2, h - colH - 14 * (0.5 + depth), x, h - colH + 16);
        g.fill();
      }
    }
    // Підлога з плит
    g.fillRect(0, h - 12 * (0.5 + depth) - 2, w, 20 * (0.5 + depth));
  },

  /* ------------------------------------------------------------ */
  draw(dt) {
    const g = this.g, w = this.w, h = this.h;
    if (this._themeId !== Storage.data.theme) this.build();   // тема змінилась
    g.clearRect(0, 0, w, h);
    const th = this.theme();

    // Амбієнтне світіння, що «дихає»
    g.globalAlpha = 0.10 + 0.045 * Math.sin(this.t * 0.7);
    g.drawImage(this.gloSprite, w / 2 - this.gloSprite.width / 2, -this.gloSprite.height * 0.45);
    g.globalAlpha = 1;

    // Фон-картинка з assets/bg (якщо додана) або процедурні силуети
    const bgImg = Assets.bg[th.scene || 'forest'];
    const px = Math.sin(this.t * 0.05) * 26;
    if (bgImg) {
      // Cover-заповнення з легким паралакс-дрейфом
      const s = Math.max((w + 60) / bgImg.width, h / bgImg.height);
      const iw = bgImg.width * s, ih = bgImg.height * s;
      g.drawImage(bgImg, (w - iw) / 2 + px * 0.5, (h - ih) / 2, iw, ih);
    } else {
      // Паралакс: далекий шар пливе повільно, середній швидше
      g.drawImage(this.far, -60 + px * 0.4, 0);
      g.drawImage(this.mid, -60 + px, 0);
    }

    const lowQ = Storage.data.settings.quality === 'low';

    // Туман — напівпрозорі плями, що дрейфують
    for (const f of this.fog) {
      f.x += f.sp * dt;
      const fw = this.fogSprite.width * f.sc;
      if (f.x - fw / 2 > w) f.x = -fw / 2;
      g.globalAlpha = f.al * (0.5 + 0.2 * Math.sin(this.t * 0.4 + f.y));
      g.drawImage(this.fogSprite, f.x - fw / 2, f.y - fw / 4, fw, fw / 2);
    }
    g.globalAlpha = 1;

    // Листя (ліс/небо) або іскри, що піднімаються (печера/храм)
    const rising = (th.scene === 'cave' || th.scene === 'temple');
    for (const l of this.leaves) {
      l.ph += dt * 1.6; l.rot += l.vr * dt;
      if (rising) { l.y -= l.vy * 0.5 * dt; if (l.y < -20) Object.assign(l, this._leaf(false), { y: h + 10 }); }
      else { l.y += l.vy * dt; if (l.y > h + 20) Object.assign(l, this._leaf(false)); }
      l.x += Math.sin(l.ph) * 22 * dt;
      g.save();
      g.translate(l.x, l.y); g.rotate(l.rot); g.scale(l.s, l.s);
      if (rising) {                       // іскра
        g.globalAlpha = 0.5 + 0.4 * Math.sin(l.ph * 2);
        g.fillStyle = th.accent;
        g.beginPath(); g.arc(0, 0, 2.4, 0, Math.PI * 2); g.fill();
      } else {                            // листок
        g.globalAlpha = 0.7;
        g.fillStyle = th.accent + '99';
        g.beginPath();
        g.moveTo(0, -7); g.quadraticCurveTo(6, -2, 0, 7); g.quadraticCurveTo(-6, -2, 0, -7);
        g.fill();
      }
      g.restore();
    }
    g.globalAlpha = 1;

    // Світлячки — блукаючі точки зі світінням
    if (!lowQ) {
      for (const f of this.flies) {
        f.a += (Math.random() - 0.5) * 2.4 * dt;
        f.x += Math.cos(f.a) * f.sp * dt;
        f.y += Math.sin(f.a) * f.sp * dt * 0.6;
        if (f.x < -20) f.x = w + 20; if (f.x > w + 20) f.x = -20;
        if (f.y < h * 0.06) f.y = h * 0.06; if (f.y > h) f.y = h * 0.5;
        const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(this.t * 2.2 + f.ph));
        const s = this.flySprite.width * f.s;
        g.globalAlpha = tw * 0.85;
        g.drawImage(this.flySprite, f.x - s / 2, f.y - s / 2, s, s);
        g.globalAlpha = tw;
        g.fillStyle = '#fffbe8';
        g.beginPath(); g.arc(f.x, f.y, 1.6 * f.s, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
    }
  }
};

// === js/fx.js ===
/* ============================================================
 * Mystic Relics — fx.js
 * Повноекранні святкові ефекти ПОВЕРХ модальних вікон:
 * конфеті, феєрверки, дощ із монет і кристалів.
 * Окремий canvas + власний rAF, який працює лише поки є
 * активні частинки (нуль витрат у спокої).
 * ============================================================ */
'use strict';

const Fx = {
  canvas: null, g: null,
  parts: [], pool: [],
  _running: false,

  init() {
    const c = document.createElement('canvas');
    c.id = 'fxCanvas';
    c.style.cssText = 'position:fixed;inset:0;z-index:90;pointer-events:none';
    document.body.appendChild(c);
    this.canvas = c;
    this.g = c.getContext('2d');
    window.addEventListener('resize', () => this._size());
    this._size();
  },

  _size() { this.canvas.width = innerWidth; this.canvas.height = innerHeight; },

  _get() { return this.pool.pop() || {}; },

  _add(p) {
    p.t = 0;
    this.parts.push(p);
    if (!this._running) { this._running = true; this._last = performance.now(); requestAnimationFrame(ts => this._loop(ts)); }
  },

  /* ---- Конфеті: кольорові папірці, що крутяться ---- */
  confetti(n = 120) {
    const colors = ['#ff6b6b', '#ffd166', '#4ade80', '#60a5fa', '#c084fc', '#f472b6', '#fff'];
    for (let i = 0; i < n; i++) {
      this._add(Object.assign(this._get(), {
        kind: 'confetti',
        x: Math.random() * this.canvas.width, y: -20 - Math.random() * this.canvas.height * 0.4,
        vx: (Math.random() - 0.5) * 90, vy: 110 + Math.random() * 160,
        w: 5 + Math.random() * 6, h: 8 + Math.random() * 7,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 12,
        ph: Math.random() * Math.PI * 2,
        color: colors[i % colors.length], life: 3.4 + Math.random() * 1.4
      }));
    }
  },

  /* ---- Феєрверк: ракета + сферичний вибух ---- */
  firework(x, y, color) {
    for (let i = 0; i < 46; i++) {
      const a = (i / 46) * Math.PI * 2;
      const sp = 90 + Math.random() * 190;
      this._add(Object.assign(this._get(), {
        kind: 'spark',
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        color, size: 1.6 + Math.random() * 2.4, life: 0.9 + Math.random() * 0.7
      }));
    }
    Audio2.play('match', 5);
  },

  /** Серія феєрверків у випадкових точках верхньої частини екрана. */
  fireworksShow(count = 5) {
    const colors = ['#ffd166', '#4ade80', '#60a5fa', '#f472b6', '#c084fc'];
    for (let i = 0; i < count; i++) {
      setTimeout(() => this.firework(
        this.canvas.width * (0.2 + Math.random() * 0.6),
        this.canvas.height * (0.12 + Math.random() * 0.3),
        colors[i % colors.length]
      ), 350 + i * 420);
    }
  },

  /* ---- Політ нагород у лічильник валюти ----
   * n гліфів летять дугою від (x0,y0) до центру елемента el;
   * per(i) викликається на кожному прибутті (бамп лічильника, звук). */
  flyTo(x0, y0, el, glyph, n = 8, per = null) {
    if (!el) return;
    const r = el.getBoundingClientRect();
    const tx = r.left + r.width / 2, ty = r.top + r.height / 2;
    for (let i = 0; i < n; i++) {
      this._add(Object.assign(this._get(), {
        kind: 'homing', glyph,
        sx: x0 + (Math.random() - 0.5) * 60, sy: y0 + (Math.random() - 0.5) * 40,
        cx: (x0 + tx) / 2 + (Math.random() - 0.5) * 180,
        cy: Math.min(y0, ty) - 50 - Math.random() * 90,
        tx, ty, x: x0, y: y0,
        size: 20 + Math.random() * 6,
        delay: i * 0.07, life: 0.75 + i * 0.07,
        onDone: per, _done: false
      }));
    }
  },

  /* ---- Дощ із монет / кристалів ---- */
  coinRain(n = 22, glyph = '🪙') {
    for (let i = 0; i < n; i++) {
      setTimeout(() => this._add(Object.assign(this._get(), {
        kind: 'glyph', glyph,
        x: this.canvas.width * (0.15 + Math.random() * 0.7), y: -30,
        vx: (Math.random() - 0.5) * 60, vy: 200 + Math.random() * 220,
        rot: 0, vr: (Math.random() - 0.5) * 7,
        size: 20 + Math.random() * 12, life: 2.6
      })), i * 90);
    }
  },

  _loop(now) {
    const dt = Math.min(0.05, (now - this._last) / 1000);
    this._last = now;
    const g = this.g, W = this.canvas.width, H = this.canvas.height;
    g.clearRect(0, 0, W, H);

    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.t += dt;
      if (p.t >= p.life || p.y > H + 60) {
        this.parts.splice(i, 1);
        this.pool.push(p);
        continue;
      }
      const fade = Math.min(1, (p.life - p.t) / 0.5);
      if (p.kind === 'confetti') {
        p.ph += dt * 6;
        p.x += (p.vx + Math.sin(p.ph) * 50) * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        g.save();
        g.translate(p.x, p.y); g.rotate(p.rot);
        g.globalAlpha = fade;
        g.fillStyle = p.color;
        g.fillRect(-p.w / 2, -p.h / 2, p.w, Math.abs(Math.sin(p.ph)) * p.h + 2);
        g.restore();
      } else if (p.kind === 'spark') {
        p.vy += 160 * dt;
        p.vx *= 1 - 1.2 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.globalAlpha = fade;
        g.fillStyle = p.color;
        g.beginPath(); g.arc(p.x, p.y, p.size * fade, 0, Math.PI * 2); g.fill();
        // Слід
        g.globalAlpha = fade * 0.3;
        g.beginPath(); g.arc(p.x - p.vx * 0.02, p.y - p.vy * 0.02, p.size * fade * 1.8, 0, Math.PI * 2); g.fill();
      } else if (p.kind === 'homing') {
        // Політ дугою Безьє до цілі
        const tt = (p.t - p.delay) / (p.life - p.delay);
        if (tt >= 0) {
          if (tt >= 1) {
            if (!p._done && p.onDone) { p._done = true; p.onDone(); }
            p.t = p.life;   // завершення на наступному кадрі
            continue;
          }
          const u = 1 - tt, e = tt * tt * (3 - 2 * tt);   // smoothstep
          const uu = 1 - e;
          p.x = uu * uu * p.sx + 2 * uu * e * p.cx + e * e * p.tx;
          p.y = uu * uu * p.sy + 2 * uu * e * p.cy + e * e * p.ty;
          g.globalAlpha = 1;
          const sz = p.size * (1 - e * 0.3);
          if (p.glyph instanceof HTMLImageElement) {
            g.drawImage(p.glyph, p.x - sz / 2, p.y - sz / 2, sz, sz);
          } else {
            g.font = `${sz}px sans-serif`;
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText(p.glyph, p.x, p.y);
          }
        }
      } else { // glyph — монети/кристали
        p.vy += 60 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
        g.save();
        g.translate(p.x, p.y); g.rotate(p.rot);
        g.globalAlpha = fade;
        if (p.glyph instanceof HTMLImageElement) {
          g.drawImage(p.glyph, -p.size / 2, -p.size / 2, p.size, p.size);
        } else {
          g.font = `${p.size}px sans-serif`;
          g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText(p.glyph, 0, 0);
        }
        g.restore();
      }
    }
    g.globalAlpha = 1;

    if (this.parts.length) requestAnimationFrame(ts => this._loop(ts));
    else { this._running = false; g.clearRect(0, 0, W, H); }
  }
};

// === js/generator.js ===
/* ============================================================
 * Mystic Relics — generator.js
 * Процедурний генератор рівнів.
 *
 * Принцип гарантованої прохідності («зворотне розв'язання»):
 *   1. Будуємо форму рівня — набір позицій {x, y, z}.
 *   2. Симулюємо ПРОХОДЖЕННЯ: на кожному кроці серед плиток,
 *      що залишилися, обираємо 3 «відкриті» позиції та
 *      призначаємо їм ОДИН тип, після чого прибираємо їх.
 *   3. Отриманий порядок вилучення — це готовий розв'язок,
 *      отже рівень гарантовано прохідний без тупиків.
 *
 * Координати: плитка займає 2×2 клітинки; сусідні плитки можуть
 * стояти з півкроковим зсувом (як у класичних tile-matching ігор).
 * Плитка «відкрита», якщо зверху її ніхто не перекриває І вільна
 * хоча б одна бічна сторона (ліва або права).
 * ============================================================ */
'use strict';

const Generator = {

  /** Головна точка входу: конфіг рівня № n.
   *  salt — необов'язкове зерно варіації: та сама складність,
   *  але інша розкладка (дзен-режим, щоденний виклик). */
  generate(n, salt = 0) {
    const tier = Math.floor((n - 1) / 10);           // кожні 10 рівнів складніше
    const rnd = Utils.rng((n * 2654435761 + salt * 97003) % 2147483647 + 7);

    // Параметри складності
    const tileCount = Math.min(27 + tier * 6 + (n % 10) * 3, 150);
    const typeCount = Math.min(6 + Math.floor(tier / 2), 26);
    // Багатошарова «гірка» з першого рівня — як у референсних tile-matching ігор
    const maxLayers = Math.min(3 + Math.floor(tier / 3), 6);
    const timeLimit = Utils.clamp(Math.round(tileCount * 3.2 - tier * 6), 75, 420);

    // 1. Форма рівня
    let positions = this._buildLayout(rnd, tileCount, maxLayers);

    this._salt = salt;
    // 2. Призначення типів зворотним розв'язанням (з повторами при невдачі)
    let types = null;
    for (let attempt = 0; attempt < 30 && !types; attempt++) {
      types = this._assignTypes(positions, typeCount, rnd, n);
      if (!types) positions = this._trimTop(positions, 3); // спрощуємо форму
    }
    // Аварійний випадок (практично недосяжний): плоский рівень
    if (!types) {
      positions = this._flatLayout(rnd, 36);
      types = this._assignTypes(positions, 6, rnd, n);
    }

    // 3. Перепони згідно з тіром
    const tiles = positions.map((p, i) => ({ x: p.x, y: p.y, z: p.z, type: types.map[i] }));
    this._placeObstacles(tiles, tier, rnd, types.solveOrder);

    return { level: n, tier, tiles, typeCount, timeLimit, solveOrder: types.solveOrder };
  },

  /* ------------------------------------------------------------
   * ФОРМИ РІВНІВ — бібліотека впізнаваних силуетів (піксель-арт
   * бітмапи 8×7 плиток): серце, коло, ведмедик, зірка, метелик,
   * квітка, ромб, хрест, корона, ялинка, будиночок, місяць,
   * рибка, перстень, блискавка, грибок. Кожен рівень сідовано
   * отримує форму, що пасує його розміру; форми чергуються.
   * ---------------------------------------------------------- */
  SHAPES: {
    heart:     ['.XX..XX.', 'XXXXXXXX', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..', '...XX...'],
    circle:    ['..XXXX..', '.XXXXXX.', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..'],
    bear:      ['XX....XX', 'XXX..XXX', '.XXXXXX.', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..'],
    star:      ['...XX...', '.XXXXXX.', 'XXXXXXXX', '..XXXX..', '.XX..XX.', 'XX....XX'],
    butterfly: ['XX....XX', 'XXX..XXX', 'XXXXXXXX', '.XXXXXX.', 'XXXXXXXX', 'XX....XX'],
    flower:    ['..XXXX..', '.XXXXXX.', 'XXXXXXXX', '.XXXXXX.', '..XXXX..', '...XX...', '...XX...'],
    diamond:   ['...XX...', '..XXXX..', '.XXXXXX.', '.XXXXXX.', '..XXXX..', '...XX...'],
    cross:     ['..XXXX..', '..XXXX..', 'XXXXXXXX', 'XXXXXXXX', '..XXXX..', '..XXXX..'],
    crown:     ['X..XX..X', 'XX.XX.XX', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.'],
    tree:      ['...XX...', '..XXXX..', '.XXXXXX.', '..XXXX..', '.XXXXXX.', 'XXXXXXXX', '...XX...'],
    house:     ['...XX...', '..XXXX..', '.XXXXXX.', 'XXXXXXXX', 'XXXXXXXX', 'XX.XX.XX'],
    moon:      ['..XXXX..', '.XXX....', '.XXX....', '.XXX....', '.XXXX...', '..XXXXX.'],
    fish:      ['.XXXX..X', 'XXXXXX.X', 'XXXXXXXX', 'XXXXXX.X', '.XXXX..X'],
    ring:      ['..XXXX..', '.XXXXXX.', 'XXX..XXX', 'XXX..XXX', '.XXXXXX.', '..XXXX..'],
    bolt:      ['....XXX.', '...XXX..', '..XXXXX.', '.XXXX...', '..XXX...', '.XXX....'],
    mushroom:  ['..XXXX..', '.XXXXXX.', 'XXXXXXXX', '...XX...', '...XX...', '..XXXX..']
  },

  _buildLayout(rnd, count, maxLayers) {
    const W = 16, H = 14;                       // поле у клітинках (плитка = 2×2)

    // Місткість стеку над основою (та сама формула, що у стекінгу)
    let capacity = 1, cur = 1;
    for (let z = 1; z < maxLayers; z++) { cur *= Math.max(0.3, 0.72 - z * 0.07); capacity += cur; }

    // Розміри форм (кешуємо один раз)
    if (!this._shapeSizes) {
      this._shapeSizes = {};
      for (const k in this.SHAPES) {
        this._shapeSizes[k] = this.SHAPES[k].join('').split('').filter(c => c === 'X').length;
      }
    }
    // Кандидати: основа вміщується у count, а стек здатен добрати до count
    const names = Object.keys(this.SHAPES);
    let eligible = names.filter(k => this._shapeSizes[k] <= count && this._shapeSizes[k] * capacity >= count * 0.8);
    if (!eligible.length) eligible = names.filter(k => this._shapeSizes[k] <= count);
    if (!eligible.length) eligible = ['bolt'];
    const shapeName = eligible[Utils.ri(rnd, 0, eligible.length - 1)];
    const bmp = this.SHAPES[shapeName];
    const mirror = rnd() < 0.4;                 // дзеркальний варіант для різноманіття

    // Базовий шар — точний силует бітмапи, відцентрований на полі
    const bw = Math.max(...bmp.map(r => r.length)) * 2;
    const bh = bmp.length * 2;
    const offX = Math.floor((W - bw) / 4) * 2;
    const offY = Math.floor((H - bh) / 4) * 2;
    const layers = [];
    const base = [];
    for (let row = 0; row < bmp.length; row++) {
      for (let col = 0; col < bmp[row].length; col++) {
        if (bmp[row][col] !== 'X') continue;
        const c = mirror ? bmp[row].length - 1 - col : col;
        base.push({ x: offX + c * 2, y: offY + row * 2, z: 0 });
      }
    }
    Utils.shuffle(base, rnd);
    layers.push(base);

    // Верхні шари — щільна «черепиця»: кандидати з півкроковими зсувами
    // (±1 клітинка) над нижнім шаром, беруться лише позиції з достатньою
    // опорою, пріоритет — ближче до центру ваги (пірамідальний силует).
    for (let z = 1; z < maxLayers; z++) {
      const below = layers[layers.length - 1];
      if (!below || below.length < 2 || below[0].z !== z - 1) break;

      // Центр ваги нижнього шару
      const cx = below.reduce((a, b) => a + b.x, 0) / below.length;
      const cy = below.reduce((a, b) => a + b.y, 0) / below.length;

      // Усі можливі позиції над нижнім шаром (включно з зсувом на пів плитки)
      const seen = new Set();
      const cand = [];
      for (const b of below) {
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const x = b.x + dx, y = b.y + dy;
            if (x < 0 || y < 0 || x > W - 2 || y > H - 2) continue;
            const key = x * 100 + y;
            if (seen.has(key)) continue;
            seen.add(key);
            // Площа опори: сума перекриттів 2×2-слідів з нижніми плитками
            // (повна опора = 4, половина = 2, кут = 1)
            let sup = 0;
            for (const o of below) {
              const ox = Math.abs(o.x - x), oy = Math.abs(o.y - y);
              if (ox < 2 && oy < 2) sup += (2 - ox) * (2 - oy);
            }
            if (sup >= 2) cand.push({ x, y, score: Math.abs(x - cx) + Math.abs(y - cy) + rnd() * 4 });
          }
        }
      }
      // Ближчі до центру — першими; легка випадковість для різноманіття
      cand.sort((a, b) => a.score - b.score);

      const target = Math.max(2, Math.round(below.length * (0.72 - z * 0.07)));
      const next = [];
      for (const c of cand) {
        if (next.length >= target) break;
        if (next.some(q => Math.abs(q.x - c.x) < 2 && Math.abs(q.y - c.y) < 2)) continue;
        next.push({ x: c.x, y: c.y, z });
      }
      if (!next.length) break;
      layers.push(next);
    }

    // Збираємо потрібну кількість: шари знизу вгору, кратно 3
    let all = [];
    for (const l of layers) all = all.concat(l);
    if (all.length > count) {
      // Прибираємо зайві з країв верхніх шарів
      all.sort((a, b) => a.z - b.z || (Math.abs(a.x - 7) + Math.abs(a.y - 6)) - (Math.abs(b.x - 7) + Math.abs(b.y - 6)));
      all = all.slice(0, count);
    }
    while (all.length % 3 !== 0) all.pop();
    // Верхній шар без підтримки після обрізання — опускаємо
    this._fixSupport(all);
    return all;
  },

  /** Простий плоский резервний рівень. */
  _flatLayout(rnd, count) {
    const out = [];
    for (let y = 0; y < 12 && out.length < count; y += 2)
      for (let x = 0; x < 12 && out.length < count; x += 2)
        out.push({ x, y, z: 0 });
    return out;
  },

  /** Опускає плитки верхніх шарів, що втратили підтримку. */
  _fixSupport(all) {
    let changed = true;
    while (changed) {
      changed = false;
      for (const t of all) {
        while (t.z > 0 && !all.some(o => o !== t && o.z === t.z - 1 && Math.abs(o.x - t.x) < 2 && Math.abs(o.y - t.y) < 2)) {
          // Немає підтримки і клітинка нижче вільна — опускаємо
          if (all.some(o => o !== t && o.z === t.z - 1 && o.x === t.x && o.y === t.y)) break;
          t.z--; changed = true;
        }
      }
    }
  },

  _trimTop(positions, n) {
    const sorted = positions.slice().sort((a, b) => b.z - a.z);
    const out = positions.filter(p => !sorted.slice(0, n).includes(p));
    while (out.length % 3 !== 0) out.pop();
    return out;
  },

  /* ------------------------------------------------------------
   * Перевірка «відкритості» позиції серед множини remaining.
   * ---------------------------------------------------------- */
  isOpen(pos, remaining) {
    for (const o of remaining) {
      if (o === pos) continue;
      // Хтось зверху перекриває
      if (o.z === pos.z + 1 && Math.abs(o.x - pos.x) < 2 && Math.abs(o.y - pos.y) < 2) return false;
    }
    // Хоча б одна бічна сторона вільна
    const leftBlocked = remaining.some(o => o !== pos && o.z === pos.z && o.x === pos.x - 2 && Math.abs(o.y - pos.y) < 2);
    const rightBlocked = remaining.some(o => o !== pos && o.z === pos.z && o.x === pos.x + 2 && Math.abs(o.y - pos.y) < 2);
    return !(leftBlocked && rightBlocked);
  },

  /* ------------------------------------------------------------
   * Зворотне розв'язання: повертає { map: type[], solveOrder }
   * або null, якщо форма зайшла у глухий кут.
   * ---------------------------------------------------------- */
  _assignTypes(positions, typeCount, rnd, levelNum) {
    // Сідовано обираємо підмножину типів плиток для цього рівня
    const pool = Utils.shuffle([...Array(CFG.TILES.length).keys()], Utils.rng(levelNum * 7919 + 13 + (this._salt || 0))).slice(0, typeCount);

    const remaining = new Set(positions);
    const map = new Map();          // position -> type
    const solveOrder = [];          // порядок вилучення (розв'язок)
    let lastType = -1;

    while (remaining.size > 0) {
      const rem = [...remaining];
      const open = rem.filter(p => this.isOpen(p, rem));
      if (open.length < 3) return null;          // глухий кут — форма перебудовується
      Utils.shuffle(open, rnd);
      const triple = open.slice(0, 3);
      // Тип: уникаємо повтору поспіль, щоб рівень був різноманітним
      let type = pool[Utils.ri(rnd, 0, pool.length - 1)];
      if (type === lastType && pool.length > 1) type = pool[(pool.indexOf(type) + 1) % pool.length];
      lastType = type;
      for (const p of triple) { map.set(p, type); remaining.delete(p); }
      solveOrder.push(triple.map(p => positions.indexOf(p)));
    }
    return { map: positions.map(p => map.get(p)), solveOrder };
  },

  /* ------------------------------------------------------------
   * Перепони. Розставляються так, щоб НЕ ламати знайдений
   * розв'язок: «замки» вішаються лише на трійки, які у розв'язку
   * йдуть ПІСЛЯ трійки-ключа; решта перепон лише сповільнюють.
   * ---------------------------------------------------------- */
  _placeObstacles(tiles, tier, rnd, solveOrder) {
    const kinds = Object.entries(CFG.OBSTACLES).filter(([, o]) => o.tier <= tier && o.tier > 0).map(([k]) => k);
    if (!kinds.length) return;

    const budget = Math.min(2 + Math.floor(tier / 2), 12);   // скільки плиток з перепонами
    let placed = 0;

    // Замки + ключ: перша трійка розв'язку стає ключем 🗝️
    if (kinds.includes('lock') && rnd() < 0.5 && solveOrder.length > 4) {
      const keyTriple = solveOrder[0];
      for (const idx of keyTriple) tiles[idx].isKey = true;
      // Замикаємо 1-2 трійки з другої половини розв'язку
      const lockCount = Utils.ri(rnd, 1, 2);
      for (let i = 0; i < lockCount; i++) {
        const trip = solveOrder[Utils.ri(rnd, Math.floor(solveOrder.length / 2), solveOrder.length - 1)];
        for (const idx of trip) if (!tiles[idx].obst && !tiles[idx].isKey) { tiles[idx].obst = { kind: 'lock' }; placed++; }
      }
    }

    // Решта перепон — на випадкові плитки (сповільнюють, але не блокують розв'язок)
    const simple = kinds.filter(k => k !== 'lock' && k !== 'portal');
    const order = Utils.shuffle([...tiles.keys()], rnd);
    for (const idx of order) {
      if (placed >= budget) break;
      const t = tiles[idx];
      if (t.obst || t.isKey || !simple.length) continue;
      if (rnd() > 0.4) continue;
      const kind = simple[Utils.ri(rnd, 0, simple.length - 1)];
      t.obst =
        kind === 'ice'   ? { kind, hp: 2 } :
        kind === 'chain' ? { kind, counter: 1 } :
        kind === 'stone' ? { kind, counter: 2 } :
        kind === 'fog'   ? { kind } :
        kind === 'curse' ? { kind } : null;
      if (t.obst) placed++;
    }

    // Портали: пара плиток, що періодично міняються типами
    if (kinds.includes('portal') && rnd() < 0.6) {
      const free = tiles.filter(t => !t.obst && !t.isKey);
      if (free.length >= 2) {
        Utils.shuffle(free, rnd);
        free[0].portal = true;
        free[1].portal = true;
      }
    }
  }
};

// === js/board.js ===
/* ============================================================
 * Mystic Relics — board.js
 * Ігрове поле: розкладка, рендеринг на Canvas, введення,
 * панель збору (7 слотів), перепони, анімації польоту та вибуху.
 *
 * Оптимізації: спрайт-кеш облич плиток (малюємо кожен тип один
 * раз у offscreen-canvas), перерахунок «відкритості» лише при
 * зміні поля, Object Pooling частинок у particles.js.
 * ============================================================ */
'use strict';

const Board = {
  tiles: [],            // усі плитки рівня
  tray: [],             // плитки у панелі (макс. CFG.TRAY_SIZE)
  undoStack: [],
  spriteCache: new Map(),
  canvas: null, ctx: null,
  dpr: 1, w: 0, h: 0,
  tileW: 60, tileH: 74, cellX: 30, cellY: 37,
  offX: 0, offY: 0, depth: 5,
  traySlots: [],        // піксельні позиції слотів панелі
  hammerMode: false,
  rainbowArmed: false,
  keysCollected: false,
  matchesMade: 0,       // для ланцюгів/каменю
  portalTimer: 0,
  shakeT: 0,
  _openDirty: true,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    canvas.addEventListener('pointerdown', e => this.onTap(e));
    window.addEventListener('resize', () => this.resize());
  },

  /* ---------------- Налаштування рівня ---------------- */
  setup(cfg) {
    // Хвильова поява: затримка залежить від відстані до центру поля
    const cx = cfg.tiles.reduce((a, t) => a + t.x, 0) / cfg.tiles.length;
    const cy = cfg.tiles.reduce((a, t) => a + t.y, 0) / cfg.tiles.length;
    this.tiles = cfg.tiles.map((t, i) => ({
      id: i, x: t.x, y: t.y, z: t.z, type: t.type,
      obst: t.obst ? { ...t.obst } : null,
      isKey: !!t.isKey, portal: !!t.portal,
      state: 'board', px: 0, py: 0, scale: 0,
      spawnDelay: Math.hypot(t.x - cx, t.y - cy) * 0.045 + t.z * 0.12 + Math.random() * 0.05,
      flyT: -1, hintT: 0, mergeT: -1, trayAt: 0, cursed: false, rainbow: false
    }));
    this.tray = [];
    this.undoStack = [];
    this.texts = [];
    this.totalTiles = cfg.tiles.length;   // для прогрес-бара рівня
    this.idleT = 0;                       // авто-підказка при бездіяльності
    this.shimmerTimer = 2.5;              // блиск-пробіг по відкритих плитках
    this.hammerMode = false;
    this.rainbowArmed = false;
    this.keysCollected = !cfg.tiles.some(t => t.isKey);
    this.matchesMade = 0;
    this.portalTimer = 20;
    this.shakeT = 0;
    this._openDirty = true;
    this.spriteCache.clear();
    Particles.clear();
    this.resize();
    Audio2.play('place');
  },

  /* ---------------- Геометрія ---------------- */
  resize() {
    if (!this.canvas) return;
    // clientWidth/Height ігнорують CSS-трансформації (анімацію появи екрана)
    const parent = this.canvas.parentElement;
    this.w = parent.clientWidth; this.h = parent.clientHeight;
    if (!this.w || !this.h) return;            // екран ще прихований
    // DPR з «пікселевим бюджетом»: телефони лишаються чіткими (×2),
    // великі екрани (планшет/десктоп) не роздувають полотно → стабільний FPS.
    const rawDpr = Math.min(window.devicePixelRatio || 1, 2);
    const maxPixels = Storage.data.settings.quality === 'low' ? 900000 : 1600000;
    const budgetDpr = Math.sqrt(maxPixels / (this.w * this.h));
    this.dpr = Math.max(1, Math.min(rawDpr, budgetDpr));
    this.canvas.width = Math.round(this.w * this.dpr);
    this.canvas.height = Math.round(this.h * this.dpr);
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.spriteCache.clear();
    if (!this.tiles.length) return;

    // Межі поля у клітинках
    let minX = 99, maxX = -99, minY = 99, maxY = -99, maxZ = 0;
    for (const t of this.tiles) {
      minX = Math.min(minX, t.x); maxX = Math.max(maxX, t.x + 2);
      minY = Math.min(minY, t.y); maxY = Math.max(maxY, t.y + 2);
      maxZ = Math.max(maxZ, t.z);
    }
    const spanX = maxX - minX, spanY = maxY - minY;
    const trayZone = Math.min(120, this.h * 0.18);         // місце під панель
    const availW = this.w - 16, availH = this.h - trayZone - 20;
    // ФІКСОВАНИЙ розмір плитки: нормуємо на повну сітку 16×14 клітинок,
    // а не на розмах конкретного рівня — іконки однакові на всіх рівнях
    const GRID_X = 16, GRID_Y = 14;
    const cell = Math.min(availW / GRID_X, availH / (GRID_Y * 1.22), 42);
    this.cellX = cell; this.cellY = cell * 1.22;
    this.tileW = cell * 2; this.tileH = this.cellY * 2;
    this.depth = Math.max(3, cell * 0.22);
    this.offX = (this.w - spanX * this.cellX) / 2 - minX * this.cellX + maxZ * this.depth * 0.5;
    this.offY = (availH - spanY * this.cellY) / 2 + 12 - minY * this.cellY + maxZ * this.depth;

    // Межі поля у пікселях — для об'ємної підкладки
    const pad = this.cellX * 0.9;
    this.boardRect = {
      x: this.offX + minX * this.cellX - pad,
      y: this.offY + minY * this.cellY - pad - maxZ * this.depth,
      w: spanX * this.cellX + pad * 2,
      h: spanY * this.cellY + pad * 2 + maxZ * this.depth
    };

    // Слоти панелі
    const slotW = Math.min(this.tileW * 0.98, (this.w - 40) / CFG.TRAY_SIZE - 5, 56);
    const totalW = CFG.TRAY_SIZE * (slotW + 5);
    const y0 = this.h - trayZone / 2 - slotW * 0.6;
    this.traySlots = [];
    for (let i = 0; i < CFG.TRAY_SIZE; i++) {
      this.traySlots.push({ x: (this.w - totalW) / 2 + i * (slotW + 5) + slotW / 2, y: y0 + slotW * 0.6, w: slotW });
    }
    this._renderTrayPanel(slotW, totalW);
    // Оновлюємо домашні позиції
    for (const t of this.tiles) if (t.state === 'board') { const p = this.homePos(t); t.px = p.x; t.py = p.y; }
  },

  /** Пре-рендер дерев'яної панелі із золотими вставками (offscreen). */
  _renderTrayPanel(slotW, totalW) {
    const padX = 16, padY = 13;
    const w = totalW + padX * 2, h = slotW * 1.2 + padY * 2;
    const c = document.createElement('canvas');
    const s = Math.min(window.devicePixelRatio || 1, 2);
    c.width = (w + 24) * s; c.height = (h + 24) * s;
    const g = c.getContext('2d');
    g.scale(s, s);
    g.translate(12, 12);

    // Тінь під панеллю
    g.shadowColor = 'rgba(0,0,10,0.55)'; g.shadowBlur = 14; g.shadowOffsetY = 6;
    // Дерев'яна основа
    const wood = g.createLinearGradient(0, 0, 0, h);
    wood.addColorStop(0, '#9a6428');
    wood.addColorStop(0.12, '#7c4c1c');
    wood.addColorStop(0.55, '#5f3812');
    wood.addColorStop(1, '#3f240a');
    g.fillStyle = wood;
    this._rr(g, 0, 0, w, h, 18); g.fill();
    g.shadowBlur = 0; g.shadowOffsetY = 0;

    // Волокна дерева — тонкі хвилясті лінії
    g.strokeStyle = 'rgba(40,22,6,0.35)';
    g.lineWidth = 1.2;
    for (let i = 0; i < 7; i++) {
      const y = 6 + (i / 7) * (h - 10);
      g.beginPath();
      g.moveTo(6, y);
      for (let x = 6; x < w - 6; x += 26) {
        g.quadraticCurveTo(x + 13, y + Math.sin(x * 0.11 + i * 2.4) * 2.6, x + 26, y);
      }
      g.stroke();
    }
    // Верхній світлий кант
    g.strokeStyle = 'rgba(255,220,160,0.35)';
    g.lineWidth = 2;
    this._rr(g, 2, 2, w - 4, h - 4, 16); g.stroke();
    // Золота рамка
    const gold = g.createLinearGradient(0, 0, w, h);
    gold.addColorStop(0, '#f3d27a'); gold.addColorStop(0.4, '#8a5f14');
    gold.addColorStop(0.6, '#f7e3a1'); gold.addColorStop(1, '#7a5410');
    g.strokeStyle = gold;
    g.lineWidth = 3;
    this._rr(g, 0, 0, w, h, 18); g.stroke();
    // Золоті заклепки по кутах
    for (const [rx, ry] of [[13, 13], [w - 13, 13], [13, h - 13], [w - 13, h - 13]]) {
      const riv = g.createRadialGradient(rx - 1.5, ry - 1.5, 0.5, rx, ry, 5.5);
      riv.addColorStop(0, '#fff3c4'); riv.addColorStop(0.5, '#e8b93a'); riv.addColorStop(1, '#8a5f14');
      g.fillStyle = riv;
      g.beginPath(); g.arc(rx, ry, 5, 0, Math.PI * 2); g.fill();
    }
    this._trayPanel = c;
    this._trayPanelW = w + 24; this._trayPanelH = h + 24;
    this._trayPadY = padY;
  },

  homePos(t) {
    return {
      x: this.offX + t.x * this.cellX + this.cellX - t.z * this.depth * 0.6,
      y: this.offY + t.y * this.cellY + this.cellY - t.z * this.depth
    };
  },

  boardTiles() { return this.tiles.filter(t => t.state === 'board'); },

  /** Кеш відкритості: перераховується лише після зміни поля. */
  refreshOpen() {
    const rem = this.boardTiles();
    for (const t of rem) t.open = Generator.isOpen(t, rem);
    this._openDirty = false;
  },

  isSelectable(t) {
    if (t.state !== 'board' || !t.open) return false;
    if (t.obst) {
      if (t.obst.kind === 'chain' && t.obst.counter > 0) return false;
      if (t.obst.kind === 'stone' && t.obst.counter > 0) return false;
      if (t.obst.kind === 'lock' && !this.keysCollected) return false;
    }
    return true;
  },

  /* ---------------- Введення ---------------- */
  onTap(e) {
    if (Game.state !== 'playing') return;
    Audio2.init(); Audio2.resume();
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (this._openDirty) this.refreshOpen();

    // Пошук плитки під пальцем: верхні шари мають пріоритет
    const cand = this.boardTiles()
      .filter(t => Math.abs(mx - t.px) < this.tileW / 2 && Math.abs(my - t.py) < this.tileH / 2)
      .sort((a, b) => b.z - a.z || b.y - a.y);
    const t = cand[0];
    if (!t) return;

    if (this.hammerMode) { this.hammerMode = false; UI.setHammerCursor(false); this.destroyTriple(t); return; }

    if (!this.isSelectable(t)) {
      // Лід можна «тріснути» навіть якщо плитка відкрита, але з hp=2
      Audio2.play('error');
      this.shakeTile(t);
      return;
    }
    // Лід: перший дотик лише розколює
    if (t.obst && t.obst.kind === 'ice' && t.obst.hp > 1) {
      t.obst.hp--;
      Audio2.play('crack');
      Particles.dust(t.px, t.py, 'rgba(160,220,255,0.8)');
      Utils.vibrate(15);
      return;
    }
    this.pickTile(t, true);
  },

  shakeTile(t) { t.shake = 0.3; },

  /* ---------------- Взяття плитки у панель ---------------- */
  pickTile(t, byUser) {
    if (this.tray.length >= CFG.TRAY_SIZE) return;
    if (t.rainbow !== true && byUser) Audio2.play('tap');
    Utils.vibrate(10);

    // Ефект вибору: спалах + маленькі іскри
    Particles.dust(t.px, t.py + this.tileH * 0.3, 'rgba(255,240,190,0.7)');
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * Math.PI * 2;
      Particles.spawn({
        x: t.px, y: t.py, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130,
        life: 0.35, size: 2.5, color: UI.theme().accent
      });
    }

    this.idleT = 0;                       // скидання таймера авто-підказки
    t.state = 'fly';
    t.flyT = 0;
    t.from = { x: t.px, y: t.py };
    // Позиція вставки: після останньої плитки того ж типу
    let idx = this.tray.length;
    for (let i = this.tray.length - 1; i >= 0; i--) {
      if (this.tray[i].type === t.type) { idx = i + 1; break; }
    }
    this.tray.splice(idx, 0, t);
    t.trayAt = performance.now();
    if (byUser) this.undoStack.push(t);
    this._openDirty = true;

    // Крива польоту: контрольна точка збоку для дуги
    const slot = this.traySlots[Math.min(idx, this.traySlots.length - 1)];
    t.ctrl = { x: (t.px + slot.x) / 2 + (Math.random() - 0.5) * 80, y: Math.min(t.py, slot.y) - 60 };
  },

  /** Після завершення польоту — squash, пил, звук, перевірка матчів. */
  onTrayLanded(t) {
    Audio2.play('place');
    if (t) {
      t.squashT = 0.22;                   // squash-and-stretch при посадці
      Particles.dust(t.px, t.py + this.traySlots[0].w * 0.5, 'rgba(220,190,140,0.65)');
      Particles.sparkle(t.px, t.py, UI.theme().accent);
    }
    this.checkMatches();
  },

  checkMatches() {
    // Райдужна плитка доповнює будь-яку пару
    const rainbow = this.tray.find(t => t.rainbow && t.state === 'tray');
    if (rainbow) {
      const counts = {};
      for (const t of this.tray) if (!t.rainbow && t.state === 'tray') counts[t.type] = (counts[t.type] || 0) + 1;
      const pair = Object.keys(counts).find(k => counts[k] >= 2);
      if (pair !== undefined) {
        const group = this.tray.filter(t => t.type === +pair && t.state === 'tray').slice(0, 2);
        group.push(rainbow);
        this.explodeGroup(group, +pair);
        return;
      }
    }
    // Звичайна трійка
    const counts = {};
    for (const t of this.tray) if (t.state === 'tray' && !t.rainbow) counts[t.type] = (counts[t.type] || 0) + 1;
    for (const k in counts) {
      if (counts[k] >= CFG.MATCH_COUNT) {
        const group = this.tray.filter(t => t.type === +k && t.state === 'tray').slice(0, CFG.MATCH_COUNT);
        this.explodeGroup(group, +k);
        return;
      }
    }
    // Поразка: панель повна і жодного матчу
    const settled = this.tray.filter(t => t.state === 'tray' || t.state === 'fly').length;
    if (settled >= CFG.TRAY_SIZE) Game.onTrayFull();
  },

  /** WOW-ефект збору трійки: плитки злітаються у точку над панеллю,
   *  обертаються, стискаються і вибухають кільцем із частинками. */
  explodeGroup(group, type) {
    const cx = group.reduce((a, t) => a + t.px, 0) / group.length;
    const cy = this.traySlots[0].y - this.traySlots[0].w * 1.7;
    for (const t of group) {
      t.state = 'merge';
      t.mergeT = 0;
      t.mergeFrom = { x: t.px, y: t.py };
      t.mergeTo = { x: cx, y: cy };
      t.mergeSpin = (Math.random() - 0.5) * 9;
    }
    this.matchesMade++;
    this.undoStack = this.undoStack.filter(t => !group.includes(t));

    // Ключ 🗝️ відкриває замки
    if (group.some(t => t.isKey)) {
      this.keysCollected = true;
      Audio2.play('unlock');
      for (const t of this.boardTiles()) if (t.obst && t.obst.kind === 'lock') Particles.sparkle(t.px, t.py, '#ffd700');
    }
    // Ланцюги та каміння слабшають з кожним матчем
    for (const t of this.boardTiles()) {
      if (t.obst && (t.obst.kind === 'chain' || t.obst.kind === 'stone') && t.obst.counter > 0) {
        t.obst.counter--;
        if (t.obst.counter === 0) { Particles.dust(t.px, t.py, 'rgba(200,200,200,0.8)'); Audio2.play('crack'); }
      }
    }
    setTimeout(() => {
      const theme = UI.theme();
      // Вибух: кільце + сплеск частинок + гліфи плитки, що розлітаються
      Particles.burst(cx, cy, theme.accent, 30);
      Particles.ring(cx, cy, theme.accent);
      Particles.ring(cx, cy, '#ffffff');
      if (type >= 0) {
        for (let i = 0; i < 5; i++) {
          const a = Math.random() * Math.PI * 2;
          Particles.spawn({
            x: cx, y: cy, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190 - 120,
            life: 0.8, size: 15, glyph: CFG.TILES[type].g, grav: 420, spin: 6
          });
        }
      }
      this.shakeT = 0.32;                       // screen shake
      for (const t of group) t.state = 'gone';
      this.tray = this.tray.filter(t => t.state !== 'gone');
      const pts = Game.onMatch(type);
      if (pts) this.addText(cx, cy - 24, `+${pts}`, '#ffe066');
      Utils.vibrate([20, 30, 20]);
      // Каскад: можливо, уже є наступний матч (магніт/бомба)
      this.checkMatches();
      this.checkWin();
    }, 420);
  },

  /* ---- Літаючі тексти очок ---- */
  addText(x, y, text, color) {
    this.texts.push({ x, y, text, color: color || '#fff', t: 0, life: 1.1 });
  },

  checkWin() {
    if (this.boardTiles().length === 0 && this.tray.filter(t => t.state !== 'gone').length === 0
        && !this.tiles.some(t => t.state === 'fly' || t.state === 'merge')) {
      Game.onWin();
    }
  },

  /* ---------------- Бустери (викликаються з boosters.js) ---------------- */

  /** Перемішування з гарантією прохідності: типи перерозподіляються
   *  зворотним розв'язанням по позиціях, що лишилися. */
  reshuffle() {
    const rem = this.boardTiles();
    if (rem.length < 3) return;
    const rnd = Utils.rng(Date.now() % 2147483647);

    // Мультимножина типів на полі
    const counts = {};
    for (const t of rem) counts[t.type] = (counts[t.type] || 0) + 1;
    // «Хвости» — типи, частково зібрані у панелі (кількість не кратна 3):
    // їх кладемо на відкриті позиції, щоб гравець міг одразу доповнити
    const leftovers = [];
    for (const k in counts) { const r = counts[k] % 3; for (let i = 0; i < r; i++) leftovers.push(+k); }

    for (let attempt = 0; attempt < 25; attempt++) {
      const remaining = new Set(rem);
      const assign = new Map();
      const c2 = { ...counts };
      let ok = true;

      // 1. Хвости — на відкриті зараз позиції
      const openNow = rem.filter(p => Generator.isOpen(p, rem));
      if (openNow.length < leftovers.length) break;
      Utils.shuffle(openNow, rnd);
      leftovers.forEach((type, i) => { assign.set(openNow[i], type); remaining.delete(openNow[i]); c2[type]--; });

      // 2. Повні трійки — зворотним розв'язанням
      while (remaining.size > 0) {
        const arr = [...remaining];
        const open = arr.filter(p => Generator.isOpen(p, arr));
        if (open.length < 3) { ok = false; break; }
        Utils.shuffle(open, rnd);
        const types = Object.keys(c2).filter(k => c2[k] >= 3);
        if (!types.length) { ok = false; break; }
        const type = +types[Utils.ri(rnd, 0, types.length - 1)];
        c2[type] -= 3;
        for (const p of open.slice(0, 3)) { assign.set(p, type); remaining.delete(p); }
      }
      if (ok) {
        for (const [tile, type] of assign) { tile.type = type; tile.scale = 0; tile.spawnDelay = Math.random() * 0.25; }
        Audio2.play('booster');
        this._openDirty = true;
        return;
      }
    }
    // Запасний варіант: простий обмін типами
    const typesArr = Utils.shuffle(rem.map(t => t.type), rnd);
    rem.forEach((t, i) => { t.type = typesArr[i]; t.scale = 0; t.spawnDelay = Math.random() * 0.25; });
    Audio2.play('booster');
  },

  /** Підказка: підсвічує трійку, яку реально можна зібрати. */
  showHint() {
    if (this._openDirty) this.refreshOpen();
    const open = this.boardTiles().filter(t => this.isSelectable(t));
    const trayCounts = {};
    for (const t of this.tray) if (t.state === 'tray') trayCounts[t.type] = (trayCounts[t.type] || 0) + 1;
    // Спершу — доповнення того, що вже у панелі
    for (const k in trayCounts) {
      const need = 3 - trayCounts[k];
      const found = open.filter(t => t.type === +k).slice(0, need);
      if (found.length === need && need > 0) { found.forEach(t => t.hintT = 2.5); return true; }
    }
    // Інакше — повна відкрита трійка
    const byType = {};
    for (const t of open) (byType[t.type] = byType[t.type] || []).push(t);
    for (const k in byType) if (byType[k].length >= 3) { byType[k].slice(0, 3).forEach(t => t.hintT = 2.5); return true; }
    return false;
  },

  /** Магніт: притягує плитки, що доповнюють трійку в панелі. */
  magnet() {
    if (this.tray.length >= CFG.TRAY_SIZE) return false;
    const trayCounts = {};
    for (const t of this.tray) if (t.state === 'tray') trayCounts[t.type] = (trayCounts[t.type] || 0) + 1;
    let best = null;
    for (const k in trayCounts) if (!best || trayCounts[k] > trayCounts[best]) best = k;
    const rem = this.boardTiles();
    if (best === null) {
      const counts = {};
      for (const t of rem) counts[t.type] = (counts[t.type] || 0) + 1;
      best = Object.keys(counts).find(k => counts[k] >= 3);
      if (best === undefined) return false;
    }
    const need = 3 - (trayCounts[best] || 0);
    const found = rem.filter(t => t.type === +best).slice(0, need);
    if (found.length < need) return false;
    found.forEach((t, i) => setTimeout(() => this.pickTile(t, false), i * 130));
    return true;
  },

  /** Молоток: цільовий режим — наступний дотик знищує трійку. */
  destroyTriple(target) {
    const rem = this.boardTiles();
    const same = rem.filter(t => t.type === target.type && t !== target).slice(0, 2);
    const group = [target, ...same];
    for (const t of group) {
      t.state = 'gone';
      Particles.burst(t.px, t.py, '#ff9f43', 14);
    }
    Audio2.play('match', 2);
    this._openDirty = true;
    Game.onMatch(target.type, true);
    this.checkWin();
  },

  /** Чарівна паличка: збирає одну відкриту трійку автоматично. */
  wand() {
    if (this._openDirty) this.refreshOpen();
    const open = this.boardTiles().filter(t => this.isSelectable(t));
    const byType = {};
    for (const t of open) (byType[t.type] = byType[t.type] || []).push(t);
    for (const k in byType) {
      if (byType[k].length >= 3) {
        byType[k].slice(0, 3).forEach((t, i) => setTimeout(() => this.pickTile(t, false), i * 120));
        return true;
      }
    }
    return this.magnet();   // якщо відкритої трійки немає — діємо як магніт
  },

  /** Бомба: знищує до трьох трійок будь-де на полі. */
  bomb() {
    let destroyed = 0;
    for (let round = 0; round < 3; round++) {
      const rem = this.boardTiles();
      const byType = {};
      for (const t of rem) (byType[t.type] = byType[t.type] || []).push(t);
      const k = Object.keys(byType).find(k => byType[k].length >= 3);
      if (k === undefined) break;
      for (const t of byType[k].slice(0, 3)) {
        t.state = 'gone';
        Particles.burst(t.px, t.py, '#f87171', 16);
      }
      destroyed++;
      Game.onMatch(+k, true);
    }
    if (destroyed) {
      this.shakeT = 0.5;
      Audio2.play('match', 4);
      this._openDirty = true;
      this.checkWin();
    }
    return destroyed > 0;
  },

  /** Райдужна плитка: додає джокер у панель. */
  addRainbow() {
    if (this.tray.length >= CFG.TRAY_SIZE) return false;
    const t = {
      id: -1, type: -1, rainbow: true, state: 'fly', flyT: 0,
      px: this.w / 2, py: -40, from: { x: this.w / 2, y: -40 },
      ctrl: { x: this.w / 2, y: this.h / 3 }, isKey: false, obst: null,
      hintT: 0, mergeT: -1, trayAt: performance.now(), x: 0, y: 0, z: 0, scale: 1, spawnDelay: 0
    };
    this.tiles.push(t);
    this.tray.push(t);
    return true;
  },

  /** Порятунок: повертає до n останніх звичайних плиток панелі на поле. */
  reviveClear(n) {
    const back = this.tray.filter(t => t.state === 'tray' && !t.rainbow).slice(-n);
    for (const t of back) {
      this.tray.splice(this.tray.indexOf(t), 1);
      const p = this.homePos(t);
      t.state = 'board';
      t.from = { x: t.px, y: t.py };
      t.ctrl = { x: (t.px + p.x) / 2, y: Math.min(t.py, p.y) - 50 };
      t.returnT = 0;
    }
    this.undoStack = this.undoStack.filter(t => !back.includes(t));
    this._openDirty = true;
    Audio2.play('booster');
    return back.length > 0;
  },

  /** Відміна ходу: остання плитка повертається на поле. */
  undo() {
    const t = this.undoStack.pop();
    if (!t || t.state !== 'tray') return false;
    this.tray.splice(this.tray.indexOf(t), 1);
    t.state = 'board';
    const p = this.homePos(t);
    t.from = { x: t.px, y: t.py };
    t.ctrl = { x: (t.px + p.x) / 2, y: Math.min(t.py, p.y) - 50 };
    t.returnT = 0;
    this._openDirty = true;
    return true;
  },

  /* ---------------- Оновлення та рендеринг ---------------- */
  update(dt) {
    if (this._openDirty) this.refreshOpen();

    // Портали: обмін типами кожні 20 с
    const portals = this.boardTiles().filter(t => t.portal);
    if (portals.length >= 2) {
      this.portalTimer -= dt;
      if (this.portalTimer <= 0) {
        this.portalTimer = 20;
        const [a, b] = portals;
        if (a.type !== b.type) {
          [a.type, b.type] = [b.type, a.type];
          a.scale = 0; b.scale = 0; a.spawnDelay = 0; b.spawnDelay = 0;
          Particles.sparkle(a.px, a.py, '#a78bfa');
          Particles.sparkle(b.px, b.py, '#a78bfa');
          Audio2.play('portal');
        }
      }
    }

    // Прокляті плитки у панелі
    const now = performance.now();
    for (const t of this.tray) {
      if (t.state === 'tray' && t.obst && t.obst.kind === 'curse' && !t.cursed && now - t.trayAt > 12000) {
        t.cursed = true;
        Game.addScore(-200);
        UI.toast(I18N.t('curse_toast'));
        Audio2.play('curse');
      }
    }

    if (this.shakeT > 0) this.shakeT -= dt;

    // Авто-підказка: після 8 с бездіяльності підсвічуємо збирану трійку
    if (Game.state === 'playing' && this.boardTiles().length > 0) {
      this.idleT += dt;
      if (this.idleT > 8) { if (this.showHint()) this.idleT = 3.5; else this.idleT = 0; }
    }
    // Блиск-пробіг по випадковій відкритій плитці (жива картинка)
    this.shimmerTimer -= dt;
    if (this.shimmerTimer <= 0) {
      this.shimmerTimer = 2 + Math.random() * 1.6;
      const open = this.boardTiles().filter(t => t.open && t.scale >= 1);
      if (open.length) open[Math.floor(Math.random() * open.length)].shimmerT = 0.7;
    }

    for (const t of this.tiles) {
      if (t.state === 'gone') continue;
      if (t.hintT > 0) t.hintT -= dt;
      if (t.shake > 0) t.shake -= dt;
      if (t.shimmerT > 0) t.shimmerT -= dt;
      if (t.squashT > 0) t.squashT -= dt;

      // Поява плитки: падіння згори з пружиною і пилом при посадці
      if (t.spawnDelay > 0) { t.spawnDelay -= dt; continue; }
      if (t.scale < 1) {
        t.scale = Math.min(1, t.scale + dt * 4);
        if (t.scale >= 1 && t.state === 'board' && !t.landed) {
          t.landed = true;
          if (Math.random() < 0.3) Particles.dust(t.px, t.py + this.tileH * 0.4, 'rgba(210,190,150,0.45)');
        }
      }

      if (t.state === 'board') {
        if (t.returnT !== undefined && t.returnT >= 0) {
          // Повернення з панелі (undo)
          t.returnT += dt * 3;
          const p = this.homePos(t);
          if (t.returnT >= 1) { t.px = p.x; t.py = p.y; t.returnT = undefined; }
          else {
            const b = Utils.bezier(t.from, t.ctrl, p, Utils.easeOutCubic(t.returnT));
            t.px = b.x; t.py = b.y;
          }
        } else {
          const p = this.homePos(t);
          t.px = p.x; t.py = p.y;
        }
      } else if (t.state === 'fly') {
        t.flyT += dt * 2.8;
        const slotIdx = this.tray.indexOf(t);
        const slot = this.traySlots[Math.max(0, Math.min(slotIdx, this.traySlots.length - 1))];
        if (t.flyT >= 1) {
          t.state = 'tray'; t.px = slot.x; t.py = slot.y;
          this.onTrayLanded(t);
        } else {
          const b = Utils.bezier(t.from, t.ctrl, slot, Utils.easeInCubic(Math.min(1, t.flyT)));
          t.px = b.x; t.py = b.y;
        }
      } else if (t.state === 'tray') {
        // Плавне «підсування» до свого слота при перестановках
        const slotIdx = this.tray.indexOf(t);
        if (slotIdx >= 0) {
          const slot = this.traySlots[Math.min(slotIdx, this.traySlots.length - 1)];
          t.px = Utils.lerp(t.px, slot.x, Math.min(1, dt * 14));
          t.py = Utils.lerp(t.py, slot.y, Math.min(1, dt * 14));
        }
      } else if (t.state === 'merge') {
        t.mergeT += dt;
      }
    }

    // Літаючі тексти очок
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const tx = this.texts[i];
      tx.t += dt;
      tx.y -= 46 * dt;
      if (tx.t >= tx.life) this.texts.splice(i, 1);
    }

    Particles.update(dt);
  },

  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);
    ctx.save();
    if (this.shakeT > 0) {
      ctx.translate((Math.random() - 0.5) * this.shakeT * 30, (Math.random() - 0.5) * this.shakeT * 30);
    }

    this.drawBoardPanel(ctx);
    this.drawTray(ctx);

    // Плитки на полі: знизу вгору
    const board = this.boardTiles().sort((a, b) => a.z - b.z || a.y - b.y || a.x - b.x);
    for (const t of board) this.drawTile(ctx, t);

    // Плитки у польоті/панелі/вибуху — поверх усього
    for (const t of this.tiles) {
      if (t.state === 'fly' || t.state === 'tray') this.drawTile(ctx, t, true);
      else if (t.state === 'merge') this.drawMerge(ctx, t);
    }

    Particles.draw(ctx);

    // Літаючі тексти очок — з пружною появою
    for (const tx of this.texts) {
      const inP = Math.min(1, tx.t / 0.22);
      const sc = Utils.easeOutBack(inP);
      const alpha = tx.t > tx.life - 0.35 ? (tx.life - tx.t) / 0.35 : 1;
      ctx.save();
      ctx.translate(tx.x, tx.y);
      ctx.scale(sc, sc);
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.font = '900 26px Nunito, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(70,30,0,0.85)';
      ctx.strokeText(tx.text, 0, 0);
      ctx.fillStyle = tx.color;
      ctx.fillText(tx.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  },

  /** Об'ємна підкладка поля: скляна плита з сяйвом і золотим кантом. */
  drawBoardPanel(ctx) {
    const r = this.boardRect;
    if (!r) return;
    const theme = UI.theme();
    // М'яка тінь
    ctx.fillStyle = 'rgba(0,0,10,0.35)';
    this._rr(ctx, r.x + 4, r.y + 8, r.w, r.h, 26); ctx.fill();
    // Скляна плита
    const grad = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    grad.addColorStop(0, 'rgba(255,255,255,0.10)');
    grad.addColorStop(0.5, 'rgba(20,10,50,0.24)');
    grad.addColorStop(1, 'rgba(0,0,15,0.34)');
    ctx.fillStyle = grad;
    this._rr(ctx, r.x, r.y, r.w, r.h, 26); ctx.fill();
    // Пульсуюче внутрішнє світіння акцентом теми
    const pulse = 0.10 + 0.05 * Math.sin(performance.now() / 900);
    const glow = ctx.createRadialGradient(r.x + r.w / 2, r.y + r.h / 2, 10, r.x + r.w / 2, r.y + r.h / 2, Math.max(r.w, r.h) * 0.6);
    glow.addColorStop(0, theme.accent + Math.round(pulse * 255).toString(16).padStart(2, '0'));
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    this._rr(ctx, r.x, r.y, r.w, r.h, 26); ctx.fill();
    // Верхній відблиск і золотий кант
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    this._rr(ctx, r.x + 2, r.y + 2, r.w - 4, r.h - 4, 24); ctx.stroke();
    ctx.strokeStyle = 'rgba(220,178,90,0.45)';
    ctx.lineWidth = 2;
    this._rr(ctx, r.x, r.y, r.w, r.h, 26); ctx.stroke();
  },

  drawTray(ctx) {
    const theme = UI.theme();
    const s0 = this.traySlots[0], sn = this.traySlots[this.traySlots.length - 1];
    if (!s0) return;
    // Дерев'яна панель (пре-рендер)
    const px = (this.w - this._trayPanelW) / 2;
    const py = s0.y - s0.w * 0.6 - this._trayPadY - 12;
    ctx.drawImage(this._trayPanel, px, py, this._trayPanelW, this._trayPanelH);

    // Небезпека: панель майже повна — червоне пульсуюче світіння
    const filled = this.tray.filter(t => t.state === 'tray' || t.state === 'fly').length;
    if (filled >= CFG.TRAY_SIZE - 1) {
      ctx.strokeStyle = `rgba(255,70,70,${0.4 + 0.4 * Math.sin(performance.now() / 160)})`;
      ctx.lineWidth = 4;
      this._rr(ctx, px + 10, py + 10, this._trayPanelW - 20, this._trayPanelH - 20, 18);
      ctx.stroke();
    }

    // Слоти — тиснені гнізда у дереві
    for (const s of this.traySlots) {
      ctx.fillStyle = 'rgba(20,10,2,0.55)';
      this._rr(ctx, s.x - s.w / 2, s.y - s.w * 0.6, s.w, s.w * 1.2, 9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1.5;
      this._rr(ctx, s.x - s.w / 2 + 1, s.y - s.w * 0.6 + 1, s.w - 2, s.w * 1.2 - 2, 8);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,215,150,0.16)';
      this._rr(ctx, s.x - s.w / 2, s.y - s.w * 0.6, s.w, s.w * 1.2 + 1.5, 9);
      ctx.stroke();
    }
  },

  /** Спрайт обличчя плитки: товста глянцева «цукерка» з фаскою,
   *  подвійним боком, відблиском зверху та м'яким світінням гліфа.
   *  Кешується на тип+розмір — у кадрі лише drawImage. */
  sprite(type, size) {
    const key = type + '_' + Math.round(size);
    let c = this.spriteCache.get(key);
    if (c) return c;
    const theme = UI.theme();
    const w = Math.round(size), h = Math.round(size * 1.22);
    const r = Math.max(7, w * 0.2);                 // соковите заокруглення
    const d = Math.max(3, w * 0.09);                // товщина плитки
    c = document.createElement('canvas');
    const s = Math.min(window.devicePixelRatio || 1, 2);
    c.width = (w + 12) * s; c.height = (h + 12) * s;
    const g = c.getContext('2d');
    g.scale(s, s);
    g.translate(6, 6);

    // Нижній темний бік (двошаровий — ефект товщини)
    g.fillStyle = 'rgba(52,36,20,0.95)';
    this._rr(g, d * 0.5, d + 1, w, h, r); g.fill();
    const side = g.createLinearGradient(0, h * 0.5, 0, h + d);
    side.addColorStop(0, this._shade(theme.tile, -70));
    side.addColorStop(1, this._shade(theme.tile, -110));
    g.fillStyle = side;
    this._rr(g, d * 0.3, d * 0.7, w, h, r); g.fill();

    // Обличчя: слонова кістка з теплим градієнтом і тінню до низу
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.1, this._shade(theme.tile, 14));
    grad.addColorStop(0.62, theme.tile);
    grad.addColorStop(1, this._shade(theme.tile, -26));
    g.fillStyle = grad;
    this._rr(g, 0, 0, w, h, r); g.fill();

    // Внутрішня фаска: світло зверху-зліва, тінь знизу-справа
    g.save();
    this._rr(g, 1.2, 1.2, w - 2.4, h - 2.4, r - 1); g.clip();
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 2.4;
    this._rr(g, 1.6, 1.6, w - 3.2, h - 3.2, r - 1); g.stroke();
    g.strokeStyle = 'rgba(120,90,50,0.35)'; g.lineWidth = 3;
