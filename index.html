<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Mobile-first viewport: lock scaling, respect device notches via
    viewport-fit=cover so the canvas can extend under the safe-area insets.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#5db4ff" />
  <meta name="description" content="Skydoku — a bright, satisfying block puzzle in the sky." />
  <title>Skydoku</title>
  <style>
    /*
      Global reset + full-bleed layout. The game renders entirely to a single
      <canvas>; the Canvas core class letterboxes the fixed design resolution
      to fit any screen. The page background is a soft SKY gradient (matching
      the in-game sky) so on wider/shorter screens — tablets, older phones —
      the letterbox margins read as sky instead of dead black bars.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      background: #2f7ad0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;          /* disable native pan/zoom gestures */
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: block;
      background: #2f7ad0;
    }
    /* The Canvas class positions this: fixed + centred on the viewport, rotated
       90° in landscape so the game is always presented in portrait. */
    #game { display: block; }

    /* Loading splash shown while the game boots, then faded out. */
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 30px;
      background: linear-gradient(180deg, #2f7ad0 0%, #4f9ae6 55%, #84baf0 100%);
      transition: opacity 0.5s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .logo {
      font: 900 clamp(44px, 13vw, 92px)/1 system-ui, -apple-system, sans-serif;
      color: #fff; letter-spacing: 2px;
      text-shadow: 0 4px 0 rgba(20,60,120,0.35), 0 10px 24px rgba(0,0,0,0.28);
    }
    #loading .dots { display: flex; gap: 16px; }
    #loading .dots i {
      width: 20px; height: 20px; border-radius: 50%; display: block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: ld-bounce 0.9s ease-in-out infinite;
    }
    #loading .dots i:nth-child(1) { background: #3fd07a; animation-delay: 0s; }
    #loading .dots i:nth-child(2) { background: #ff5a68; animation-delay: 0.15s; }
    #loading .dots i:nth-child(3) { background: #ffd23a; animation-delay: 0.3s; }
    #loading .dots i:nth-child(4) { background: #b06aff; animation-delay: 0.45s; }
    @keyframes ld-bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.75; } 40% { transform: translateY(-18px); opacity: 1; } }
  </style>
</head>
<body>
  <!-- The Canvas core class sizes and positions this element every resize. -->
  <div id="stage">
    <canvas id="game"></canvas>
  </div>

  <!-- Boot loading splash (removed by main.js once the game is ready). -->
  <div id="loading">
    <div class="logo">Skydoku</div>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
  </div>

  <!-- Immersive portrait: on the first tap, go fullscreen (hides the phone's
       top status bar / clock shutter) and lock to portrait where the platform
       allows it. Both are wrapped so an unsupported browser silently no-ops;
       the Canvas class also rotates to portrait as a guaranteed fallback. -->
  <script>
    (function () {
      function goImmersive() {
        // Fullscreen (hides the phone's top status shade) — only if not already,
        // so re-tapping never throws. Requires a user gesture, hence on tap.
        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            var el = document.documentElement;
            var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
            if (req) { var p = req.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); }
          }
        } catch (e) {}
        // Lock to portrait where the platform allows it (WebView/PWA).
        try {
          if (screen.orientation && screen.orientation.lock) {
            var q = screen.orientation.lock('portrait'); if (q && q.catch) q.catch(function () {});
          }
        } catch (e) {}
      }
      // Re-arm on every tap so immersive/portrait is re-applied if the phone
      // dropped it (e.g. after the status shade was pulled down).
      window.addEventListener('pointerdown', goImmersive);
    })();
  </script>

  <!-- ES modules keep the architecture cleanly separated. For Android WebView
       export, bundle to a single file (see README) since file:// + modules
       can hit CORS restrictions on older WebViews. -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
