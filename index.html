<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Block Kingdom — Crystal Forge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ЕКРАН ЗАВАНТАЖЕННЯ -->
  <div id="screen-loading" class="screen active">
    <div class="loading-logo">
      <div class="logo-crystal">◆</div>
      <h1 class="logo-title">BLOCK<span>KINGDOM</span></h1>
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
    </div>
  </div>

  <!-- ГОЛОВНЕ МЕНЮ -->
  <div id="screen-menu" class="screen">
    <div class="top-bar glass">
      <div class="res-pill" id="pill-coins"><span class="res-ico">🪙</span><span id="menu-coins">0</span><button class="res-add" data-action="shop-coins">+</button></div>
      <div class="res-pill" id="pill-gems"><span class="res-ico">💎</span><span id="menu-gems">0</span></div>
      <div class="res-pill" id="pill-energy"><span class="res-ico">⚡</span><span id="menu-energy">5/5</span><span class="res-timer" id="energy-timer"></span></div>
      <button class="icon-btn" data-action="settings">⚙️</button>
    </div>

    <div class="menu-hero">
      <div class="menu-crystal float">◆</div>
      <h1 class="menu-title">BLOCK<span>KINGDOM</span></h1>
      <div class="menu-sub" id="menu-level-label"></div>
    </div>

    <button class="btn-play pulse" data-action="play"><span>PLAY</span><small id="play-sub"></small></button>

    <div class="menu-grid">
      <button class="menu-tile glass" data-action="adventure"><span class="tile-ico">🗺️</span><span class="tile-label" data-i18n="adventure">Adventure</span></button>
      <button class="menu-tile glass" data-action="daily"><span class="tile-ico">📅</span><span class="tile-label" data-i18n="daily">Daily</span><span class="tile-badge" id="daily-badge">!</span></button>
      <button class="menu-tile glass" data-action="events"><span class="tile-ico">🏆</span><span class="tile-label" data-i18n="events">Events</span></button>
      <button class="menu-tile glass" data-action="shop"><span class="tile-ico">🛍️</span><span class="tile-label" data-i18n="shop">Shop</span></button>
      <button class="menu-tile glass" data-action="collection"><span class="tile-ico">📦</span><span class="tile-label" data-i18n="collection">Collection</span></button>
      <button class="menu-tile glass" data-action="quests"><span class="tile-ico">📜</span><span class="tile-label" data-i18n="quests">Quests</span><span class="tile-badge hidden" id="quest-badge">!</span></button>
      <button class="menu-tile glass" data-action="leaderboard"><span class="tile-ico">🥇</span><span class="tile-label" data-i18n="leaderboard">Ranks</span></button>
      <button class="menu-tile glass" data-action="achievements"><span class="tile-ico">🎖️</span><span class="tile-label" data-i18n="achievements">Awards</span></button>
    </div>

    <div class="banner-slot" id="banner-slot">AD BANNER</div>
  </div>

  <!-- КАРТА СВІТУ -->
  <div id="screen-map" class="screen">
    <div class="top-bar glass">
      <button class="icon-btn" data-action="back">←</button>
      <div class="map-world-name" id="map-world-name"></div>
      <div class="res-pill"><span class="res-ico">⭐</span><span id="map-stars">0</span></div>
    </div>
    <div class="map-scroll" id="map-scroll"><div class="map-canvas" id="map-content"></div></div>
    <div class="map-worlds" id="map-worlds"></div>
  </div>

  <!-- ІГРОВИЙ ЕКРАН -->
  <div id="screen-game" class="screen">
    <div class="game-hud glass">
      <button class="icon-btn" data-action="pause">⏸</button>
      <div class="hud-center">
        <div class="hud-level" id="hud-level"></div>
        <div class="hud-goals" id="hud-goals"></div>
      </div>
      <div class="hud-right">
        <div class="hud-score" id="hud-score">0</div>
        <div class="hud-coins">🪙 <span id="hud-coins">0</span></div>
      </div>
    </div>
    <div class="game-canvas-wrap" id="game-canvas-wrap">
      <canvas id="game-canvas"></canvas>
      <div class="combo-pop" id="combo-pop"></div>
    </div>
    <div class="boosters-bar" id="boosters-bar"></div>
  </div>

  <!-- МОДАЛЬНІ ВІКНА (контент рендериться з JS) -->
  <div id="modal-root"></div>

</div>

<!-- Модулі гри: порядок важливий (звичайні скрипти, без бандлера — готово до WebView/file://) -->
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/ads.js"></script>
<script src="js/notify.js"></script>
<script src="js/shapes.js"></script>
<script src="js/levels.js"></script>
<script src="js/particles.js"></script>
<script src="js/board.js"></script>
<script src="js/game.js"></script>
<script src="js/meta.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
