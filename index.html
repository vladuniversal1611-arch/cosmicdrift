'use strict';
const C=document.getElementById('gc'),X=C.getContext('2d');
let W,H,DPR,FW,FH,SC;
function resize(){
DPR=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;H=window.innerHeight;
C.width=W*DPR;C.height=H*DPR;
X.setTransform(DPR,0,0,DPR,0,0);
FW=Math.min(W,480);FH=Math.min(H,820);
SC=Math.min(FW/400,FH/700);
}
resize();window.addEventListener('resize',resize);

const TAU=Math.PI*2,PI=Math.PI;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rng=(a=0,b=1)=>a+Math.random()*(b-a);
const rngI=(a,b)=>Math.floor(rng(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const ease={
out3:t=>1-(1-t)**3,
out4:t=>1-(1-t)**4,
inOut:t=>t<.5?2*t*t:1-(-2*t+2)**2/2,
elastic:t=>{const c=TAU/3;return t===0?0:t===1?1:2**(-10*t)*Math.sin((t*10-.75)*c)+1},
bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}
};

═══════════════════════════════════════════════════*/
const AC=new(window.AudioContext||window.webkitAudioContext)();
function resumeAC(){if(AC.state==='suspended')AC.resume()}
document.addEventListener('touchstart',resumeAC,{once:true});
document.addEventListener('click',resumeAC,{once:true});
let masterVol=.25,sfxOn=true,musicOn=true;
function tone(f,dur,type='sine',vol=.12){
if(!sfxOn)return;const o=AC.createOscillator(),g=AC.createGain();
o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol*masterVol,AC.currentTime);
g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
}
const sfx={
draw(){tone(800+rng(0,400),.06,'sine',.06)},
bounce(){tone(600+rng(0,200),.09,'triangle',.09)},
collect(){tone(523,.1,'sine',.12);setTimeout(()=>tone(659,.08,'sine',.1),60);setTimeout(()=>tone(784,.1,'sine',.12),120)},
portal(){tone(300,.2,'sawtooth',.04);tone(600,.2,'sine',.06)},
blackhole(){tone(80,.35,'sawtooth',.07)},
crystal(){tone(1200,.12,'sine',.08);tone(1500,.1,'sine',.06)},
sw(){tone(440,.07,'square',.06);setTimeout(()=>tone(660,.07,'square',.06),80)},
win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sine',.12),i*90))},
fail(){tone(300,.2,'sawtooth',.07);tone(200,.3,'sawtooth',.05)},
click(){tone(900,.03,'sine',.05)},
milestone(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.14),i*120))},
discover(){tone(440,.15,'sine',.1);setTimeout(()=>tone(554,.12,'sine',.1),100);setTimeout(()=>tone(659,.15,'sine',.12),200);setTimeout(()=>tone(880,.25,'sine',.14),300)},
chest(){tone(330,.1,'triangle',.08);setTimeout(()=>tone(440,.1,'triangle',.08),80);setTimeout(()=>tone(550,.15,'triangle',.1),160)},
hatch(){[262,330,392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.2+i*.03,'sine',.1+i*.01),i*100))}
};
let bgM=null,curMusicWorld=-1;
const WORLD_MUSIC=[
{notes:[262,330,392,330,349,294,262,330],types:['sine','sine','triangle','sine','sine','triangle','sine','sine'],tempo:950,vol:.025},
{notes:[330,415,494,554,494,415,370,330],types:['triangle','sine','triangle','sine','triangle','sine','triangle','triangle'],tempo:1100,vol:.02},
{notes:[247,294,330,370,349,294,262,247],types:['sine','triangle','sine','sine','triangle','sine','triangle','sine'],tempo:1250,vol:.018},
{notes:[349,440,523,587,523,494,440,349],types:['triangle','triangle','sine','triangle','sine','triangle','triangle','sine'],tempo:1050,vol:.022},
{notes:[523,587,659,784,880,784,659,523],types:['sine','sine','sine','triangle','sine','sine','sine','sine'],tempo:900,vol:.02}
];
function startMusic(worldIdx){
if(!musicOn)return;
const wi=worldIdx??0;
if(bgM&&curMusicWorld===wi)return;
stopMusic();curMusicWorld=wi;
const wm=WORLD_MUSIC[wi]||WORLD_MUSIC[0];let idx=0;
function pn(){if(!musicOn){bgM=null;curMusicWorld=-1;return}
const o=AC.createOscillator(),g=AC.createGain();
o.type=wm.types[idx%wm.notes.length];
o.frequency.value=wm.notes[idx%wm.notes.length];
const v=wm.vol*masterVol;
g.gain.setValueAtTime(v,AC.currentTime);
g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+wm.tempo/1100);
o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+wm.tempo/900);
idx++;bgM=setTimeout(pn,wm.tempo)}pn()}
function stopMusic(){if(bgM){clearTimeout(bgM);bgM=null;curMusicWorld=-1}}

/*═══════════════════════════════════════════════════

const P=[];
function spark(x,y,c,vx,vy,life,sz,gl){if(P.length>300)return;P.push({x,y,c,vx:vx??rng(-1,1),vy:vy??rng(-2,-.5),life,ml:life,s:sz||2.5,gl:gl||0})}
function burst(x,y,c,n=10,spd=2.5,life=.5,sz=2.5){for(let i=0;i<n;i++){const a=TAU*i/n+rng(-.3,.3);spark(x,y,c,Math.cos(a)*spd*rng(.5,1.5),Math.sin(a)*spd*rng(.5,1.5),life*rng(.7,1.3),sz*rng(.6,1.4),8)}}
function confetti(x,y,n=30){const cs=['#fbbf24','#ef4444','#10b981','#818cf8','#ec4899','#06b6d4','#f97316'];for(let i=0;i<n;i++)spark(x+rng(-30,30),y+rng(-10,10),cs[i%7],rng(-5,5),rng(-9,-2),rng(1.2,3),rng(2.5,6))}
function megaConfetti(n=60){for(let i=0;i<n;i++)spark(rng(0,W),rng(-20,H*.3),pick(['#fbbf24','#ef4444','#10b981','#818cf8','#ec4899','#06b6d4','#f97316','#fff']),rng(-3,3),rng(-1,3),rng(1.5,3.5),rng(3,8))}
function updateP(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=dt;if(p.life<=0)P.splice(i,1)}}
function drawP(){for(const p of P){const a=clamp(p.life/p.ml,0,1);X.globalAlpha=a;if(p.gl>0){X.shadowColor=p.c;X.shadowBlur=p.gl*a}X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.s*a,0,TAU);X.fill();X.shadowBlur=0}X.globalAlpha=1}

function gx(n){return(W-FW)/2+n*FW}
function gy(n){return(H-FH)/2+60+n*(FH-120)}

/*═══════════════════════════════════════════════════
  NEXT GOAL SYSTEM

function getNextGoal(afterLevel){
const next=MILESTONES.find(m=>m.at>afterLevel);
if(!next)return null;
const rem=next.at-afterLevel;
let icon='🎁';
if(next.type==='creature')icon=CREATURES[next.id].icon;
else if(next.type==='artifact')icon=ARTIFACTS[next.id].icon;
else if(next.type==='world')icon='🗺️';
return{rem,icon,title:next.title,text:next.text,total:next.at,progress:afterLevel};
}

function getCollectionProgress(){
const cTotal=CREATURES.length,aTotal=ARTIFACTS.length;
const cHave=Object.keys(save.creatures).length,aHave=Object.keys(save.artifacts).length;
return{creatures:cHave,creaturesTotal:cTotal,artifacts:aHave,artifactsTotal:aTotal,pct:Math.round((cHave+aHave)/(cTotal+aTotal)*100)};
}

function initLevel(idx){
const ld=LEVELS[idx];if(!ld)return;
curLv=idx;orbs=[];lines=[];lvObjs=[];targets=[];
linesUsed=0;collected=0;lvWon=false;lvLost=false;lvTime=0;winTimer=0;
tipA=ld.tip?2.5:0;lvTip=ld.tip||'';
hintUsed=false;hintAnim=0;showHint=false;undoStack=[];
maxLines=(ld.ml||3)+bonusLines;bonusLines=0;
totalTgts=ld.targets.length;
for(const o of ld.orbs)orbs.push({x:gx(o.x),y:gy(o.y),dx:o.dx*SC*60,dy:o.dy*SC*60,r:8*SC,active:true,trail:[],absorbed:false,spawned:false,sd:.5});
for(const t of ld.targets)targets.push({x:gx(t.x),y:gy(t.y),r:t.r*FW,collected:false,pulse:0});
for(const o of ld.obj){
const ob={...o};
if(o.t==='M'){ob.px=gx(o.x);ob.py=gy(o.y);ob.len=o.l*FW;ob.angle=o.a}
else if(o.t==='wall'){ob.px1=gx(o.x1);ob.py1=gy(o.y1);ob.px2=gx(o.x2);ob.py2=gy(o.y2)}
else if(o.t==='C'){ob.px=gx(o.x);ob.py=gy(o.y);ob.r=16*SC;ob.an=0}
else if(o.t==='P'){ob.px1=gx(o.x1);ob.py1=gy(o.y1);ob.px2=gx(o.x2);ob.py2=gy(o.y2);ob.r=18*SC;ob.an=0}
else if(o.t==='N'){ob.px=gx(o.x);ob.py=gy(o.y);ob.r=14*SC;ob.an=0;ob.str=o.s}
else if(o.t==='B'){ob.px=gx(o.x);ob.py=gy(o.y);ob.pr=o.r*FW;ob.an=0}
else if(o.t==='T'){ob.px=gx(o.x);ob.py=gy(o.y);ob.r=20*SC;ob.phase=o.p||0;ob.an=0}
else if(o.t==='S'){ob.px=gx(o.x);ob.py=gy(o.y);ob.r=14*SC;ob.on=false;ob.an=0}
else if(o.t==='G'){ob.px1=gx(o.x1);ob.py1=gy(o.y1);ob.px2=gx(o.x2);ob.py2=gy(o.y2);ob.open=false;ob.an=0}
else if(o.t==='Z'){ob.px=gx(o.x);ob.py=gy(o.y);ob.pr=o.r*FW;ob.an=0}
lvObjs.push(ob);
}
}

/*═══════════════════════════════════════════════════
  PHYSICS
═══════════════════════════════════════════════════*/
function reflect(dx,dy,nx,ny){const d=dx*nx+dy*ny;return{dx:dx-2*d*nx,dy:dy-2*d*ny}}
function bounceOff(orb,x1,y1,x2,y2){
const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(len<1)return false;
const nx=-dy/len,ny=dx/len,ox=orb.x-x1,oy=orb.y-y1;
const proj=ox*dx/len+oy*dy/len;if(proj<-orb.r||proj>len+orb.r)return false;
const perp=ox*nx+oy*ny;if(Math.abs(perp)>orb.r+3)return false;
const dot=orb.dx*nx+orb.dy*ny;
if(dot*perp<0){const r=reflect(orb.dx,orb.dy,nx,ny);orb.dx=r.dx;orb.dy=r.dy;orb.x+=nx*Math.sign(perp)*3;orb.y+=ny*Math.sign(perp)*3;return true}
return false;
}

/*═══════════════════════════════════════════════════
  UPDATE LEVEL
═══════════════════════════════════════════════════*/
function updateLevel(dt){
if(lvWon||lvLost)return;
lvTime+=dt;if(tipA>0)tipA-=dt*.35;
const fL=gx(0),fR=gx(1),fT=gy(0),fB=gy(1);
for(let i=lines.length-1;i>=0;i--){lines[i].life-=dt;if(lines[i].life<=0)lines.splice(i,1)}
for(const o of lvObjs){
if(o.t==='T'){o.phase+=dt*2;o.r=(20+10*Math.sin(o.phase))*SC;o.an+=dt}
if(o.t==='C'||o.t==='N'||o.t==='S')o.an+=dt;
if(o.t==='P')o.an+=dt*2;
if(o.t==='B')o.an+=dt*.5;
if(o.t==='G'){const sw=lvObjs.find(s=>s.t==='S'&&s.g===o.id);o.open=sw?sw.on:false;o.an+=(o.open?1:-1)*dt*3;o.an=clamp(o.an,0,1)}
if(o.t==='Z')o.an+=dt;
}
for(const orb of orbs){
if(!orb.active)continue;
if(orb.sd>0){orb.sd-=dt;continue}
if(!orb.spawned)orb.spawned=true;
let spd=1;
for(const o of lvObjs)if(o.t==='Z'&&dst({x:orb.x,y:orb.y},{x:o.px,y:o.py})<o.pr)spd=.3;
orb.x+=orb.dx*dt*spd;orb.y+=orb.dy*dt*spd;
orb.trail.push({x:orb.x,y:orb.y,a:1});if(orb.trail.length>18)orb.trail.shift();
for(const tr of orb.trail)tr.a-=dt*3;
for(const o of lvObjs){
if(o.t==='N'){const ddx=o.px-orb.x,ddy=o.py-orb.y,d=Math.hypot(ddx,ddy);
if(d<150*SC&&d>5){const f=o.str*500*SC/(d*d)*dt;orb.dx+=ddx/d*f*60;orb.dy+=ddy/d*f*60}}
}
if(orb.x-orb.r<fL){orb.x=fL+orb.r;orb.dx=Math.abs(orb.dx);sfx.bounce()}
if(orb.x+orb.r>fR){orb.x=fR-orb.r;orb.dx=-Math.abs(orb.dx);sfx.bounce()}
if(orb.y-orb.r<fT){orb.y=fT+orb.r;orb.dy=Math.abs(orb.dy);sfx.bounce()}
if(orb.y+orb.r>fB){orb.y=fB-orb.r;orb.dy=-Math.abs(orb.dy);sfx.bounce()}
for(const ln of lines)if(bounceOff(orb,ln.x1,ln.y1,ln.x2,ln.y2)){sfx.bounce();burst(orb.x,orb.y,'#a78bfa',6,2,.3,2)}
for(const o of lvObjs)if(o.t==='wall')bounceOff(orb,o.px1,o.py1,o.px2,o.py2);
for(const o of lvObjs){if(o.t==='M'){
const mx1=o.px-Math.cos(o.angle)*o.len,my1=o.py-Math.sin(o.angle)*o.len;
const mx2=o.px+Math.cos(o.angle)*o.len,my2=o.py+Math.sin(o.angle)*o.len;
if(bounceOff(orb,mx1,my1,mx2,my2)){sfx.bounce();burst(orb.x,orb.y,'#60a5fa',6,2,.3,2)}
}}
for(const o of lvObjs)if(o.t==='G'&&!o.open)bounceOff(orb,o.px1,o.py1,o.px2,o.py2);
for(const o of lvObjs){if(o.t==='C'){
const d=dst({x:orb.x,y:orb.y},{x:o.px,y:o.py});
if(d<o.r+orb.r){sfx.crystal();burst(o.px,o.py,'#c084fc',12,3,.5,3);
const sp=Math.hypot(orb.dx,orb.dy),an=Math.atan2(orb.dy,orb.dx);
orb.dx=Math.cos(an+.4)*sp;orb.dy=Math.sin(an+.4)*sp;
orbs.push({x:o.px,y:o.py,dx:Math.cos(an-.4)*sp,dy:Math.sin(an-.4)*sp,r:orb.r,active:true,trail:[],absorbed:false,spawned:true,sd:0});
orb.x=o.px+Math.cos(an+.4)*20;orb.y=o.py+Math.sin(an+.4)*20}
}}
for(const o of lvObjs){if(o.t==='P'){
const d1=dst({x:orb.x,y:orb.y},{x:o.px1,y:o.py1}),d2=dst({x:orb.x,y:orb.y},{x:o.px2,y:o.py2});
if(d1<o.r){orb.x=o.px2;orb.y=o.py2;sfx.portal();burst(o.px2,o.py2,'#34d399',10,3,.4,3)}
else if(d2<o.r){orb.x=o.px1;orb.y=o.py1;sfx.portal();burst(o.px1,o.py1,'#34d399',10,3,.4,3)}
}}
for(const o of lvObjs){if(o.t==='B'){
const d=dst({x:orb.x,y:orb.y},{x:o.px,y:o.py});
if(d<o.pr*.5){orb.active=false;orb.absorbed=true;sfx.blackhole();burst(o.px,o.py,'#7c3aed',15,2,.7,2)}
else if(d<o.pr*2){const f=800*SC/(d*d)*dt;orb.dx+=(o.px-orb.x)/d*f*60;orb.dy+=(o.py-orb.y)/d*f*60}
}}
for(const o of lvObjs){if(o.t==='S'&&!o.on){
const d=dst({x:orb.x,y:orb.y},{x:o.px,y:o.py});
if(d<o.r+orb.r){o.on=true;sfx.sw();burst(o.px,o.py,'#fbbf24',10,3,.4,3)}
}}
for(const o of lvObjs){if(o.t==='T'){
const d=dst({x:orb.x,y:orb.y},{x:o.px,y:o.py});
if(d<o.r+orb.r){const nx=(orb.x-o.px)/d,ny=(orb.y-o.py)/d;
const r=reflect(orb.dx,orb.dy,nx,ny);orb.dx=r.dx;orb.dy=r.dy;
orb.x=o.px+nx*(o.r+orb.r+3);orb.y=o.py+ny*(o.r+orb.r+3);
sfx.bounce();burst(orb.x,orb.y,'#4ade80',6,2,.3,2)}
}}
for(const tg of targets){if(tg.collected)continue;
const d=dst({x:orb.x,y:orb.y},{x:tg.x,y:tg.y});
if(d<tg.r+orb.r){tg.collected=true;collected++;orb.active=false;sfx.collect();burst(tg.x,tg.y,'#fbbf24',18,4,.7,3);confetti(tg.x,tg.y,20);tg.pulse=1;shakeAmt=.5}
}
}
const allC=targets.every(t=>t.collected),anyA=orbs.some(o=>o.active),anyP=orbs.some(o=>o.sd>0);
if(allC&&!lvWon){
lvWon=true;winTimer=0;sfx.win();megaConfetti();
const stars=lvTime<8?3:lvTime<18?2:1;
save.stars[curLv]=Math.max(save.stars[curLv]||0,stars);
save.lv=Math.max(save.lv,curLv+1);
const wI=LEVELS[curLv].w;save.worldLife[wI]=Math.min(1,(save.worldLife[wI]||0)+.1);
// Check milestones
const justReached=curLv+1;
for(const m of MILESTONES){
if(m.at===justReached&&!save.eventsShown[m.at]){
save.eventsShown[m.at]=1;
if(m.type==='creature')save.creatures[m.id]=1;
if(m.type==='artifact')save.artifacts[m.id]=1;
milestoneQueue.push(m);
}
}
doSave();
}
if(!anyA&&!anyP&&!allC&&!lvLost){lvLost=true;sfx.fail()}
}

function startDraw(cx,cy){
if(lvWon||lvLost)return;
for(const o of lvObjs){if(o.t==='M'&&o.rot){if(Math.hypot(cx-o.px,cy-o.py)<35*SC){o.angle+=PI/4;sfx.click();burst(o.px,o.py,'#60a5fa',6,2,.3,2);return}}}
if(linesUsed>=maxLines)return;
drawLine={x1:cx,y1:cy,x2:cx,y2:cy};sfx.draw();
}
function moveDraw(cx,cy){if(!drawLine)return;const dx=cx-drawLine.x1,dy=cy-drawLine.y1,len=Math.hypot(dx,dy),mx=120*SC;
if(len>mx){drawLine.x2=drawLine.x1+dx/len*mx;drawLine.y2=drawLine.y1+dy/len*mx}else{drawLine.x2=cx;drawLine.y2=cy}}
function endDraw(){if(!drawLine)return;if(Math.hypot(drawLine.x2-drawLine.x1,drawLine.y2-drawLine.y1)>15*SC){const ln={...drawLine,life:4,ml:4};lines.push(ln);linesUsed++;undoStack.push(lines.length-1)}drawLine=null}
function undoLine(){if(undoStack.length===0||lvWon||lvLost)return;const idx=undoStack.pop();if(idx<lines.length){lines.splice(idx,1);linesUsed=Math.max(0,linesUsed-1);sfx.click()}}

C.addEventListener('pointerdown',e=>{e.preventDefault();resumeAC();if(state==='level'){startDraw(e.clientX,e.clientY);ptrDown=true}});
C.addEventListener('pointermove',e=>{e.preventDefault();if(ptrDown&&state==='level')moveDraw(e.clientX,e.clientY)});
C.addEventListener('pointerup',e=>{e.preventDefault();if(ptrDown){endDraw();ptrDown=false}});
C.addEventListener('pointercancel',()=>{if(ptrDown){endDraw();ptrDown=false}});

function drawBG(b1,b2){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,b1||'#0a0a1a');g.addColorStop(1,b2||'#0f0f2a');X.fillStyle=g;X.fillRect(0,0,W,H);

/*═══════════════════════════════════════════════════
  WORLD MAP — Path-based with evolution
═══════════════════════════════════════════════════*/
function nodePos(idx){
const row=LEVELS.length-1-idx;
const totalH=(LEVELS.length+2)*70*SC;
const y=60+row*70*SC-mapScroll;
const x=W/2+Math.sin(idx*.6)*80*SC;
return{x,y};
}
function drawMap(){
const totalH=(LEVELS.length+2)*70*SC;
mapScroll=lerp(mapScroll,mapScrollTarget,.12);

// Background gradient per visible world
drawBG('#071a12','#0e2844');

// Draw path
X.strokeStyle='rgba(255,255,255,.06)';X.lineWidth=3;X.beginPath();
for(let i=0;i<LEVELS.length;i++){const p=nodePos(i);if(i===0)X.moveTo(p.x,p.y);else X.lineTo(p.x,p.y)}X.stroke();

// Decorations
for(const d of MAP_DECOS){
if(save.lv<=d.unlockAt)continue;
const refNode=nodePos(d.unlockAt);
const dx=d.x*W,dy=refNode.y;
if(dy<-30||dy>H+30)continue;
const bob=Math.sin(gameTime*1.5+d.unlockAt)*.5;
X.globalAlpha=.6;
if(d.type==='tree'){X.fillStyle='#166534';X.beginPath();X.moveTo(dx,dy-12+bob);X.lineTo(dx-6,dy+4+bob);X.lineTo(dx+6,dy+4+bob);X.closePath();X.fill();X.fillStyle='#713f12';X.fillRect(dx-1.5,dy+4+bob,3,6)}
else if(d.type==='flower'){X.fillStyle='#f472b6';X.beginPath();X.arc(dx,dy+bob,3,0,TAU);X.fill()}
else if(d.type==='stream'){X.strokeStyle='#38bdf8';X.lineWidth=2;X.globalAlpha=.3;X.beginPath();X.moveTo(dx-20,dy+bob);X.quadraticCurveTo(dx,dy-8+bob,dx+20,dy+bob);X.stroke()}
else if(d.type==='crystal'){X.fillStyle='#c084fc';X.beginPath();X.moveTo(dx,dy-8+bob);X.lineTo(dx+5,dy+bob);X.lineTo(dx,dy+4+bob);X.lineTo(dx-5,dy+bob);X.closePath();X.fill()}
else if(d.type==='gem'){X.fillStyle='#818cf8';X.beginPath();X.arc(dx,dy+bob,4,0,TAU);X.fill();X.shadowColor='#818cf8';X.shadowBlur=6;X.fill();X.shadowBlur=0}
else if(d.type==='mushroom'){X.fillStyle='#ef4444';X.beginPath();X.arc(dx,dy-3+bob,5,PI,0);X.fill();X.fillStyle='#e2e8f0';X.fillRect(dx-1.5,dy-3+bob,3,6)}
else if(d.type==='firefly'){X.fillStyle='#fbbf24';X.globalAlpha=.3+.3*Math.sin(gameTime*4+d.unlockAt);X.beginPath();X.arc(dx+Math.sin(gameTime*2+d.unlockAt)*8,dy+Math.cos(gameTime*1.5+d.unlockAt)*5,2,0,TAU);X.fill()}
else if(d.type==='pillar'){X.fillStyle='#a8a29e';X.fillRect(dx-3,dy-10+bob,6,16);X.fillRect(dx-5,dy-12+bob,10,3)}
else if(d.type==='rune'){X.strokeStyle='#fbbf24';X.lineWidth=1.5;X.globalAlpha=.3+.2*Math.sin(gameTime*2+d.unlockAt);X.beginPath();X.arc(dx,dy+bob,5,0,TAU);X.stroke();X.beginPath();X.moveTo(dx,dy-5+bob);X.lineTo(dx,dy+5+bob);X.stroke()}
else if(d.type==='star'){X.fillStyle='#fff';X.globalAlpha=.3+.3*Math.sin(gameTime*3+d.unlockAt);X.beginPath();X.arc(dx,dy+bob,2,0,TAU);X.fill();glow(dx,dy+bob,8,'rgba(255,255,255,.15)')}
else if(d.type==='nebula'){const ng=X.createRadialGradient(dx,dy+bob,0,dx,dy+bob,15);ng.addColorStop(0,'rgba(139,92,246,.15)');ng.addColorStop(1,'transparent');X.fillStyle=ng;X.beginPath();X.arc(dx,dy+bob,15,0,TAU);X.fill()}
X.globalAlpha=1;
}

// Creature icons on map
for(let i=0;i<CREATURES.length;i++){
if(!save.creatures[i])continue;
const m=MILESTONES.find(m=>m.type==='creature'&&m.id===i);if(!m)continue;
const p=nodePos(m.at-1);if(p.y<-30||p.y>H+30)continue;
const cx=p.x+(m.at%2?-1:1)*50*SC,cy=p.y;
X.font=`${18*SC}px sans-serif`;X.textAlign='center';X.textBaseline='middle';
X.globalAlpha=.7+.2*Math.sin(gameTime*2+i);
X.fillText(CREATURES[i].icon,cx,cy+Math.sin(gameTime+i)*3);
X.globalAlpha=1;
}

// Level nodes
for(let i=0;i<LEVELS.length;i++){
const p=nodePos(i);if(p.y<-30||p.y>H+30)continue;
const unlocked=save.lv>=i,done=save.stars[i]>0;
const isCurrent=save.lv===i;
const isMilestone=MILESTONES.some(m=>m.at===i+1);
const r=isMilestone?18*SC:14*SC;

X.globalAlpha=unlocked?1:.25;

if(isCurrent){
glow(p.x,p.y,r*3,'rgba(139,92,246,.2)',.5+.3*Math.sin(gameTime*3));
X.strokeStyle='#8b5cf6';X.lineWidth=3;X.beginPath();X.arc(p.x,p.y,r+4+2*Math.sin(gameTime*3),0,TAU);X.stroke();
}

if(done){
const wc=WORLDS[LEVELS[i].w].color;
X.fillStyle=wc;X.shadowColor=wc;X.shadowBlur=8;
}else if(unlocked){
X.fillStyle='rgba(255,255,255,.12)';X.shadowBlur=0;
}else{
X.fillStyle='rgba(255,255,255,.04)';X.shadowBlur=0;
}
X.beginPath();X.arc(p.x,p.y,r,0,TAU);X.fill();X.shadowBlur=0;
X.strokeStyle=done?'rgba(255,255,255,.2)':'rgba(255,255,255,.08)';X.lineWidth=1.5;X.beginPath();X.arc(p.x,p.y,r,0,TAU);X.stroke();

// Level number
X.fillStyle=unlocked?'#fff':'#555';X.font=`bold ${(isMilestone?13:11)*SC}px sans-serif`;X.textAlign='center';X.textBaseline='middle';
X.fillText(i+1,p.x,p.y-(done?3:0));

// Stars
if(done){const st=save.stars[i];X.font=`${7*SC}px sans-serif`;X.fillStyle='#fbbf24';let ss='';for(let s=0;s<3;s++)ss+=s<st?'★':'☆';X.fillText(ss,p.x,p.y+r-5*SC)}

// Milestone marker
if(isMilestone&&!done){X.fillStyle='#fbbf24';X.font=`${10*SC}px sans-serif`;X.fillText('🎁',p.x+r+8,p.y)}

X.globalAlpha=1;
}

// Header
X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,55);
X.fillStyle='#fff';X.font=`bold ${18*SC}px sans-serif`;X.textAlign='center';X.fillText('World Map',W/2,32);
const cp=getCollectionProgress();
X.fillStyle='rgba(255,255,255,.35)';X.font=`${10*SC}px sans-serif`;
X.fillText(`${cp.pct}% collected`,W/2,48);
}

let prevState='menu';
function act(a){
sfx.click();
if(a==='play'){state='map';setupMap();scrollToCurrentLevel()}
else if(a==='back_menu'){state='menu';setupMenu();stopMusic()}
else if(a==='back_map'){state='map';setupMap()}
else if(a==='back_prev'){state=prevState;if(state==='menu')setupMenu();else if(state==='map')setupMap()}
else if(a==='settings'){state='settings';setupSettings()}
else if(a==='collection'){prevState=state;state='collection';setupCollection()}
else if(a==='restart'||a==='retry'||a==='replay'){resize();initLevel(curLv);state='level';setupLevel()}
else if(a==='next'){
if(milestoneQueue.length>0){curMilestone=milestoneQueue.shift();milestoneTimer=0;state='milestone';setupMilestone();sfx.milestone();megaConfetti(40);return}
if(curLv+1<LEVELS.length){resize();initLevel(curLv+1);state='level';setupLevel();startMusic(LEVELS[curLv]?.w);maybeRandomEvent(curLv)}
else{state='map';setupMap()}}
else if(a==='to_map'){state='map';setupMap()}
else if(a==='toggle_sfx'){sfxOn=!sfxOn;doSave();setupSettings()}
else if(a==='toggle_music'){musicOn=!musicOn;if(!musicOn)stopMusic();doSave();setupSettings()}
else if(a==='reset'){save={lv:0,stars:{},creatures:{},artifacts:{},totalStars:0,eventsShown:{},worldLife:{},settings:{sfx:true,music:true}};doSave();sfxOn=true;musicOn=true;state='menu';setupMenu()}
else if(a==='milestone_done'){
if(milestoneQueue.length>0){curMilestone=milestoneQueue.shift();milestoneTimer=0;sfx.milestone();megaConfetti(40)}
else if(curLv+1<LEVELS.length){resize();initLevel(curLv+1);state='level';setupLevel();startMusic(LEVELS[curLv]?.w);maybeRandomEvent(curLv)}
else{state='map';setupMap()}}
else if(a==='event_accept'){applyEventReward();state='level';setupLevel()}
else if(a==='event_skip'){curEvent=null;state='level';setupLevel()}
else if(a==='undo'){undoLine()}
else if(a==='hint'){if(!hintUsed){hintUsed=true;showHint=true;hintAnim=0;sfx.chest()}}
else if(a==='ad_lines'){bonusLines=2;resize();initLevel(curLv);state='level';setupLevel()}
else if(a.startsWith('node_')){const idx=+a.slice(5);resize();initLevel(idx);state='level';setupLevel();startMusic(LEVELS[idx]?.w)}
}

function scrollToCurrentLevel(){
const p=nodePos(save.lv<LEVELS.length?save.lv:LEVELS.length-1);
mapScrollTarget=clamp(p.y-H/2,(LEVELS.length+2)*70*SC-H>0?0:0,Math.max(0,(LEVELS.length+2)*70*SC-H+100));
// Invert because nodePos uses (length-1-idx)
const totalH=(LEVELS.length+2)*70*SC;
const targetY=60+(LEVELS.length-1-save.lv)*70*SC;
mapScrollTarget=clamp(targetY-H/2,0,Math.max(0,totalH-H+60));
mapScroll=mapScrollTarget;
}

/*═══════════════════════════════════════════════════
  RANDOM EVENTS
═══════════════════════════════════════════════════*/
function maybeRandomEvent(afterLevel){
if(afterLevel<4)return;
if(Math.random()>.25)return;
curEvent=pick(RANDOM_EVENTS);eventTimer=0;
setTimeout(()=>{if(state==='level'&&!lvWon&&!lvLost){state='event';setupEvent()}},500);
}
function applyEventReward(){
if(!curEvent)return;
const r=curEvent.reward;
if(r==='artifact_progress'){
const locked=[];for(let i=0;i<ARTIFACTS.length;i++)if(!save.artifacts[i])locked.push(i);
if(locked.length>0){save.artifacts[pick(locked)]=1;sfx.discover();megaConfetti(20)}
}else if(r==='creature_hint'){
sfx.chest();
}else if(r==='bonus_lines'){
bonusLines=1;sfx.chest();
}else if(r==='double_stars'){
if(save.stars[curLv])save.stars[curLv]=3;sfx.chest();
}else if(r==='random_collectible'){
if(save.totalStars>=5){
const lockedC=[];for(let i=0;i<CREATURES.length;i++)if(!save.creatures[i])lockedC.push(i);
const lockedA=[];for(let i=0;i<ARTIFACTS.length;i++)if(!save.artifacts[i])lockedA.push(i);
const all=[...lockedC.map(i=>({t:'c',i})),...lockedA.map(i=>({t:'a',i}))];
if(all.length>0){const ch=pick(all);if(ch.t==='c')save.creatures[ch.i]=1;else save.artifacts[ch.i]=1;sfx.discover();megaConfetti(25)}
}
}
doSave();curEvent=null;
}

document.addEventListener('click',e=>{
const cx=e.clientX,cy=e.clientY;
for(const b of uiBtn){if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){act(b.cb);return}}
if(state==='map'){
for(let i=0;i<LEVELS.length;i++){if(save.lv<i)continue;
const p=nodePos(i);const r=18*SC;
if(Math.hypot(cx-p.x,cy-p.y)<r+8){act('node_'+i);return}}
}
if(state==='level'&&lvWon&&winTimer>1.5){
if(milestoneQueue.length>0){curMilestone=milestoneQueue.shift();milestoneTimer=0;state='milestone';setupMilestone();sfx.milestone();megaConfetti(40)}
else setupWin();
}
if(state==='level'&&lvLost)setupLose();
});

/*═══════════════════════════════════════════════════
  MAIN LOOP
═══════════════════════════════════════════════════*/
let lastT=0;
function frame(now){
requestAnimationFrame(frame);
const dt=Math.min((now-lastT)/1e3,.05);lastT=now;gameTime+=dt;
resize();
if(state==='level')updateLevel(dt);
if(state==='menu')menuAnim+=dt;
updateP(dt);
if(shakeAmt>0){shakeAmt-=dt*4;shakeX=rng(-2,2)*shakeAmt;shakeY=rng(-2,2)*shakeAmt}else{shakeX=0;shakeY=0}

// Fade
if(screenFadeDir!==0){screenFade+=screenFadeDir*dt*4;
if(screenFade>=1&&screenFadeCb){screenFadeCb();screenFadeCb=null;screenFadeDir=-1}
if(screenFade<=0){screenFadeDir=0;screenFade=0}}

X.save();X.translate(shakeX,shakeY);

if(state==='menu'){drawMenu();setupMenu();drawUI()}
else if(state==='map'){drawMap();setupMap();drawUI()}
else if(state==='collection'){drawCollection();setupCollection();drawUI()}
else if(state==='level'){
const wd=WORLDS[LEVELS[curLv]?.w||0];drawBG(wd.bg1,wd.bg2);drawField();drawLvObjs();drawLines();
if(showHint){hintAnim+=dt;const h=LEVELS[curLv]?.hint;if(h){const ha=clamp(hintAnim*2,0,1)*(.4+.2*Math.sin(gameTime*4));X.globalAlpha=ha;X.strokeStyle='#fbbf24';X.lineWidth=3*SC;X.setLineDash([6,6]);X.lineCap='round';X.shadowColor='#fbbf24';X.shadowBlur=8;X.beginPath();X.moveTo(gx(h.x1),gy(h.y1));X.lineTo(gx(h.x2),gy(h.y2));X.stroke();X.setLineDash([]);X.shadowBlur=0;X.globalAlpha=1;if(hintAnim>6)showHint=false}}
drawTargets();drawOrbs();drawP();drawHUD();setupLevel();drawUI();
if(lvWon){drawWin(dt);if(winTimer>1.5){if(milestoneQueue.length===0)setupWin();drawUI()}}
if(lvLost){drawLose();setupLose();drawUI()}
}
else if(state==='milestone'){drawBG('#0a0a1a','#0f0a2e');drawMilestone(dt);setupMilestone();drawUI();drawP()}
else if(state==='event'){const wd=WORLDS[LEVELS[curLv]?.w||0];drawBG(wd.bg1,wd.bg2);drawEvent(dt);setupEvent();drawUI()}
else if(state==='settings'){drawSettings();setupSettings();drawUI()}

if(screenFade>0){X.fillStyle=`rgba(0,0,0,${screenFade})`;X.fillRect(-10,-10,W+20,H+20)}

X.restore();
}

setupMenu();requestAnimationFrame(frame);
</script>
