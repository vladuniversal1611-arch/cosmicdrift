<canvas id="gc"></canvas>
<script>
'use strict';
const C=document.getElementById('gc'),X=C.getContext('2d');
let W,H,DPR,FW,FH,SCALE;
function resize(){
DPR=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;H=window.innerHeight;
C.width=W*DPR;C.height=H*DPR;
X.setTransform(DPR,0,0,DPR,0,0);
FW=Math.min(W,480);FH=Math.min(H,820);
SCALE=Math.min(FW/400,FH/700);
}
resize();window.addEventListener('resize',resize);

const TAU=Math.PI*2,PI=Math.PI;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rng=(a=0,b=1)=>a+Math.random()*(b-a);
const ease={
out3:t=>1-Math.pow(1-t,3),
out4:t=>1-Math.pow(1-t,4),
inOut:t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
elastic:t=>{const c=TAU/3;return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c)+1},
bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}
};

/* ─── Audio ─── */
const AC=new(window.AudioContext||window.webkitAudioContext)();
function resumeAudio(){if(AC.state==='suspended')AC.resume()}
document.addEventListener('touchstart',resumeAudio,{once:true});
document.addEventListener('click',resumeAudio,{once:true});

let masterVol=0.25,sfxOn=true,musicOn=true;
function tone(freq,dur,type='sine',vol=0.12){
if(!sfxOn)return;
const o=AC.createOscillator(),g=AC.createGain();
o.type=type;o.frequency.value=freq;
g.gain.setValueAtTime(vol*masterVol,AC.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
}
function sfxDraw(){tone(800+rng(0,400),0.07,'sine',0.07)}
function sfxBounce(){tone(600+rng(0,200),0.1,'triangle',0.1)}
function sfxCollect(){tone(523,0.12,'sine',0.13);setTimeout(()=>tone(659,0.1,'sine',0.11),70);setTimeout(()=>tone(784,0.12,'sine',0.13),140)}
function sfxPortal(){tone(300,0.25,'sawtooth',0.05);tone(600,0.25,'sine',0.07)}
function sfxBlackHole(){tone(80,0.4,'sawtooth',0.08)}
function sfxCrystal(){tone(1200,0.15,'sine',0.09);tone(1500,0.12,'sine',0.07)}
function sfxSwitch(){tone(440,0.08,'square',0.07);setTimeout(()=>tone(660,0.08,'square',0.07),90)}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sine',0.13),i*100))}
function sfxFail(){tone(300,0.25,'sawtooth',0.08);tone(200,0.35,'sawtooth',0.06)}
function sfxClick(){tone(900,0.04,'sine',0.06)}

let bgMusic=null;
function startMusic(){
if(!musicOn||bgMusic)return;
const notes=[261.6,329.6,392,523.3,392,329.6,261.6,196];
let idx=0;
function playNote(){
if(!musicOn){bgMusic=null;return}
const o=AC.createOscillator(),g=AC.createGain();
o.type='sine';o.frequency.value=notes[idx%notes.length];
g.gain.setValueAtTime(0.025*masterVol,AC.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.9);
o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+1);
idx++;bgMusic=setTimeout(playNote,950);
}
playNote();
}
function stopMusic(){if(bgMusic){clearTimeout(bgMusic);bgMusic=null}}

/* ─── Save ─── */
let save={level:0,stars:{},worldState:{},settings:{sfx:true,music:true}};
function loadSave(){try{const s=localStorage.getItem('echoforge_v2');if(s)save=JSON.parse(s)}catch(e){}}
function doSave(){save.settings={sfx:sfxOn,music:musicOn};try{localStorage.setItem('echoforge_v2',JSON.stringify(save))}catch(e){}}
loadSave();sfxOn=save.settings?.sfx!==false;musicOn=save.settings?.music!==false;

/* ─── Particles ─── */
const particles=[];
function spark(x,y,c,vx,vy,life,sz,glow){
if(particles.length>250)return;
particles.push({x,y,c,vx:vx??rng(-1,1),vy:vy??rng(-2,-0.5),life,ml:life,s:sz||2.5,glow:glow||0});
}
function burst(x,y,c,n=10,spd=2.5,life=0.5,sz=2.5){
for(let i=0;i<n;i++){const a=TAU*i/n+rng(-0.3,0.3);spark(x,y,c,Math.cos(a)*spd*rng(0.5,1.5),Math.sin(a)*spd*rng(0.5,1.5),life*rng(0.7,1.3),sz*rng(0.6,1.4),8)}
}
function confetti(x,y,n=25){
const cols=['#fbbf24','#ef4444','#10b981','#818cf8','#ec4899','#06b6d4'];
for(let i=0;i<n;i++)spark(x+rng(-20,20),y,cols[i%6],rng(-4,4),rng(-8,-2),rng(1,2.5),rng(2.5,6));
}
function updateParticles(dt){
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=dt;
if(p.life<=0)particles.splice(i,1);
}
}
function drawParticles(){
for(const p of particles){
const a=clamp(p.life/p.ml,0,1);
X.globalAlpha=a;
if(p.glow>0){X.shadowColor=p.c;X.shadowBlur=p.glow*a}
X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.s*a,0,TAU);X.fill();
X.shadowBlur=0;
}
X.globalAlpha=1;
}

L.push({w:4,orbs:[{x:.5,y:.05,dx:0,dy:1.5}],targets:[{x:.5,y:.9,r:.06}],objects:[{t:'switch',x:.5,y:.3,target:'g1',on:false},{t:'gate',x1:.3,y1:.5,x2:.7,y2:.5,id:'g1'},{t:'timew',x:.5,y:.7,r:.15},{t:'blackhole',x:.3,y:.7,r:.05},{t:'blackhole',x:.7,y:.7,r:.05}],maxLines:3});
L.push({w:4,orbs:[{x:.1,y:.1,dx:1,dy:1}],targets:[{x:.9,y:.9,r:.06}],objects:[{t:'portal',x1:.4,y1:.4,x2:.6,y2:.2},{t:'portal',x1:.7,y1:.4,x2:.3,y2:.7},{t:'timew',x:.5,y:.6,r:.15},{t:'crystal',x:.5,y:.8},{t:'mirror',x:.8,y:.85,a:PI*.75,len:.1}],maxLines:4});
L.push({w:4,orbs:[{x:.1,y:.1,dx:1.5,dy:.5},{x:.9,y:.1,dx:-1.5,dy:.5}],targets:[{x:.5,y:.95,r:.08}],objects:[{t:'crystal',x:.5,y:.3},{t:'portal',x1:.3,y1:.5,x2:.7,y2:.5},{t:'timew',x:.5,y:.7,r:.18},{t:'switch',x:.5,y:.55,target:'g1',on:false},{t:'gate',x1:.35,y1:.8,x2:.65,y2:.8,id:'g1'},{t:'blackhole',x:.2,y:.8,r:.05},{t:'blackhole',x:.8,y:.8,r:.05},{t:'magnet',x:.5,y:.9,str:1.5}],maxLines:5});
return L;
}
const LEVELS=makeLevels();

/* ─── State ─── */
let gameState='menu',currentLevel=0,gameTime=0,levelTime=0;
let orbs=[],drawnLines=[],levelObjects=[],targets=[];
let linesUsed=0,maxLines=3,collected=0,totalTargets=0;
let levelWon=false,levelLost=false,levelTip='',tipAlpha=1;
let drawingLine=null;
let mapScroll=0,mapTargetScroll=0,selectedWorld=0;
let winTimer=0,menuAnim=0,screenShake=0,shakeX=0,shakeY=0;
let uiButtons=[];

/* ─── Coordinate helpers ─── */
function gx(n){return(W-FW)/2+n*FW}
function gy(n){return(H-FH)/2+60+n*(FH-120)}

/* ─── Level init ─── */
function initLevel(idx){
const ld=LEVELS[idx];if(!ld)return;
currentLevel=idx;
orbs=[];drawnLines=[];levelObjects=[];targets=[];
linesUsed=0;collected=0;levelWon=false;levelLost=false;levelTime=0;winTimer=0;
tipAlpha=ld.tip?2.5:0;levelTip=ld.tip||'';
maxLines=ld.maxLines||3;
totalTargets=ld.targets.length;
for(const o of ld.orbs)
orbs.push({x:gx(o.x),y:gy(o.y),dx:o.dx*SCALE*60,dy:o.dy*SCALE*60,r:8*SCALE,active:true,trail:[],absorbed:false,spawned:false,spawnDelay:.5});
for(const t of ld.targets)
targets.push({x:gx(t.x),y:gy(t.y),r:t.r*FW,collected:false,pulse:0});
for(const o of ld.objects){
const obj={...o};
if(o.t==='mirror'){obj.px=gx(o.x);obj.py=gy(o.y);obj.len=o.len*FW;obj.angle=o.a}
else if(o.t==='wall'){obj.px1=gx(o.x1);obj.py1=gy(o.y1);obj.px2=gx(o.x2);obj.py2=gy(o.y2)}
else if(o.t==='crystal'){obj.px=gx(o.x);obj.py=gy(o.y);obj.r=16*SCALE;obj.anim=0}
else if(o.t==='portal'){obj.px1=gx(o.x1);obj.py1=gy(o.y1);obj.px2=gx(o.x2);obj.py2=gy(o.y2);obj.r=18*SCALE;obj.anim=0}
else if(o.t==='magnet'){obj.px=gx(o.x);obj.py=gy(o.y);obj.r=14*SCALE;obj.anim=0}
else if(o.t==='blackhole'){obj.px=gx(o.x);obj.py=gy(o.y);obj.pr=o.r*FW;obj.anim=0}
else if(o.t==='tree'){obj.px=gx(o.x);obj.py=gy(o.y);obj.r=20*SCALE;obj.phase=o.phase||0;obj.anim=0}
else if(o.t==='switch'){obj.px=gx(o.x);obj.py=gy(o.y);obj.r=14*SCALE;obj.on=false;obj.anim=0}
else if(o.t==='gate'){obj.px1=gx(o.x1);obj.py1=gy(o.y1);obj.px2=gx(o.x2);obj.py2=gy(o.y2);obj.open=false;obj.anim=0}
else if(o.t==='timew'){obj.px=gx(o.x);obj.py=gy(o.y);obj.pr=o.r*FW;obj.anim=0}
levelObjects.push(obj);
}
}

/* ─── Physics helpers ─── */
function reflect(dx,dy,nx,ny){const d=dx*nx+dy*ny;return{dx:dx-2*d*nx,dy:dy-2*d*ny}}

function bounceOrbOffLine(orb,lx1,ly1,lx2,ly2){
const dx=lx2-lx1,dy=ly2-ly1,len=Math.hypot(dx,dy);
if(len<1)return false;
const nx=-dy/len,ny=dx/len;
const ox=orb.x-lx1,oy=orb.y-ly1;
const proj=ox*dx/len+oy*dy/len;
if(proj<-orb.r||proj>len+orb.r)return false;
const perp=ox*nx+oy*ny;
if(Math.abs(perp)>orb.r+3)return false;
const dot=orb.dx*nx+orb.dy*ny;
if(dot*perp<0){
const r=reflect(orb.dx,orb.dy,nx,ny);
orb.dx=r.dx;orb.dy=r.dy;
orb.x+=nx*Math.sign(perp)*3;orb.y+=ny*Math.sign(perp)*3;
return true;
}
return false;
}

/* ─── Update ─── */
function updateLevel(dt){
if(levelWon||levelLost)return;
levelTime+=dt;
if(tipAlpha>0)tipAlpha-=dt*0.4;

const fL=gx(0),fR=gx(1),fT=gy(0),fB=gy(1);

for(let i=drawnLines.length-1;i>=0;i--){drawnLines[i].life-=dt;if(drawnLines[i].life<=0)drawnLines.splice(i,1)}

for(const obj of levelObjects){
if(obj.t==='tree'){obj.phase+=dt*2;obj.r=(20+10*Math.sin(obj.phase))*SCALE;obj.anim+=dt}
if(obj.t==='crystal')obj.anim+=dt;
if(obj.t==='portal')obj.anim+=dt*2;
if(obj.t==='magnet')obj.anim+=dt;
if(obj.t==='blackhole')obj.anim+=dt*.5;
if(obj.t==='switch')obj.anim+=dt;
if(obj.t==='gate'){
const sw=levelObjects.find(o=>o.t==='switch'&&o.target===obj.id);
obj.open=sw?sw.on:false;
obj.anim+=(obj.open?1:-1)*dt*3;obj.anim=clamp(obj.anim,0,1);
}
if(obj.t==='timew')obj.anim+=dt;
}

for(const orb of orbs){
if(!orb.active)continue;
if(orb.spawnDelay>0){orb.spawnDelay-=dt;continue}
if(!orb.spawned)orb.spawned=true;
let speed=1;
for(const obj of levelObjects){if(obj.t==='timew'){if(dist({x:orb.x,y:orb.y},{x:obj.px,y:obj.py})<obj.pr)speed=.3}}
orb.x+=orb.dx*dt*speed;orb.y+=orb.dy*dt*speed;
orb.trail.push({x:orb.x,y:orb.y,a:1});
if(orb.trail.length>18)orb.trail.shift();
for(const tr of orb.trail)tr.a-=dt*3;

for(const obj of levelObjects){
if(obj.t==='magnet'){
const ddx=obj.px-orb.x,ddy=obj.py-orb.y,d=Math.hypot(ddx,ddy);
if(d<150*SCALE&&d>5){const f=obj.str*500*SCALE/(d*d)*dt;orb.dx+=ddx/d*f*60;orb.dy+=ddy/d*f*60}
}
}

if(orb.x-orb.r<fL){orb.x=fL+orb.r;orb.dx=Math.abs(orb.dx);sfxBounce()}
if(orb.x+orb.r>fR){orb.x=fR-orb.r;orb.dx=-Math.abs(orb.dx);sfxBounce()}
if(orb.y-orb.r<fT){orb.y=fT+orb.r;orb.dy=Math.abs(orb.dy);sfxBounce()}
if(orb.y+orb.r>fB){orb.y=fB-orb.r;orb.dy=-Math.abs(orb.dy);sfxBounce()}

for(const ln of drawnLines){if(bounceOrbOffLine(orb,ln.x1,ln.y1,ln.x2,ln.y2)){sfxBounce();burst(orb.x,orb.y,'#a78bfa',6,2,.3,2)}}
for(const obj of levelObjects){if(obj.t==='wall')bounceOrbOffLine(orb,obj.px1,obj.py1,obj.px2,obj.py2)}

for(const obj of levelObjects){
if(obj.t==='mirror'){
const mx1=obj.px-Math.cos(obj.angle)*obj.len,my1=obj.py-Math.sin(obj.angle)*obj.len;
const mx2=obj.px+Math.cos(obj.angle)*obj.len,my2=obj.py+Math.sin(obj.angle)*obj.len;
if(bounceOrbOffLine(orb,mx1,my1,mx2,my2)){sfxBounce();burst(orb.x,orb.y,'#60a5fa',6,2,.3,2)}
}
}

for(const obj of levelObjects){if(obj.t==='gate'&&!obj.open)bounceOrbOffLine(orb,obj.px1,obj.py1,obj.px2,obj.py2)}

for(const obj of levelObjects){
if(obj.t==='crystal'){
const d=dist({x:orb.x,y:orb.y},{x:obj.px,y:obj.py});
if(d<obj.r+orb.r){
sfxCrystal();burst(obj.px,obj.py,'#c084fc',12,3,.5,3);
const spd=Math.hypot(orb.dx,orb.dy),ang=Math.atan2(orb.dy,orb.dx);
orb.dx=Math.cos(ang+.4)*spd;orb.dy=Math.sin(ang+.4)*spd;
orbs.push({x:obj.px,y:obj.py,dx:Math.cos(ang-.4)*spd,dy:Math.sin(ang-.4)*spd,r:orb.r,active:true,trail:[],absorbed:false,spawned:true,spawnDelay:0});
orb.x=obj.px+Math.cos(ang+.4)*20;orb.y=obj.py+Math.sin(ang+.4)*20;
}
}
}

for(const obj of levelObjects){
if(obj.t==='portal'){
const d1=dist({x:orb.x,y:orb.y},{x:obj.px1,y:obj.py1});
const d2=dist({x:orb.x,y:orb.y},{x:obj.px2,y:obj.py2});
if(d1<obj.r){orb.x=obj.px2;orb.y=obj.py2;sfxPortal();burst(obj.px2,obj.py2,'#34d399',10,3,.4,3)}
else if(d2<obj.r){orb.x=obj.px1;orb.y=obj.py1;sfxPortal();burst(obj.px1,obj.py1,'#34d399',10,3,.4,3)}
}
}

for(const obj of levelObjects){
if(obj.t==='blackhole'){
const d=dist({x:orb.x,y:orb.y},{x:obj.px,y:obj.py});
if(d<obj.pr*.5){orb.active=false;orb.absorbed=true;sfxBlackHole();burst(obj.px,obj.py,'#7c3aed',15,2,.7,2)}
else if(d<obj.pr*2){const f=800*SCALE/(d*d)*dt;orb.dx+=(obj.px-orb.x)/d*f*60;orb.dy+=(obj.py-orb.y)/d*f*60}
}
}

for(const obj of levelObjects){
if(obj.t==='switch'&&!obj.on){
const d=dist({x:orb.x,y:orb.y},{x:obj.px,y:obj.py});
if(d<obj.r+orb.r){obj.on=true;sfxSwitch();burst(obj.px,obj.py,'#fbbf24',10,3,.4,3)}
}
}

for(const obj of levelObjects){
if(obj.t==='tree'){
const d=dist({x:orb.x,y:orb.y},{x:obj.px,y:obj.py});
if(d<obj.r+orb.r){
const nx=(orb.x-obj.px)/d,ny=(orb.y-obj.py)/d;
const r=reflect(orb.dx,orb.dy,nx,ny);
orb.dx=r.dx;orb.dy=r.dy;
orb.x=obj.px+nx*(obj.r+orb.r+3);orb.y=obj.py+ny*(obj.r+orb.r+3);
sfxBounce();burst(orb.x,orb.y,'#4ade80',6,2,.3,2);
}
}
}

for(const tgt of targets){
if(tgt.collected)continue;
const d=dist({x:orb.x,y:orb.y},{x:tgt.x,y:tgt.y});
if(d<tgt.r+orb.r){
tgt.collected=true;collected++;orb.active=false;
sfxCollect();burst(tgt.x,tgt.y,'#fbbf24',18,4,.7,3);confetti(tgt.x,tgt.y,20);tgt.pulse=1;
}
}
}

const allCollected=targets.every(t=>t.collected);
const anyActive=orbs.some(o=>o.active);
const anyPending=orbs.some(o=>o.spawnDelay>0);
if(allCollected&&!levelWon){
levelWon=true;winTimer=0;sfxWin();
const stars=levelTime<8?3:levelTime<18?2:1;
save.stars[currentLevel]=Math.max(save.stars[currentLevel]||0,stars);
save.level=Math.max(save.level,currentLevel+1);
const wI=LEVELS[currentLevel].w;
if(!save.worldState[wI])save.worldState[wI]={life:0};
save.worldState[wI].life=Math.min(1,(save.worldState[wI].life||0)+.1);
doSave();
}
if(!anyActive&&!anyPending&&!allCollected&&!levelLost){levelLost=true;sfxFail()}
}

/* ─── Drawing input ─── */
function startDraw(cx,cy){
if(levelWon||levelLost)return;
for(const obj of levelObjects){
if(obj.t==='mirror'&&obj.rot){
const d=Math.hypot(cx-obj.px,cy-obj.py);
if(d<35*SCALE){obj.angle+=PI/4;sfxClick();burst(obj.px,obj.py,'#60a5fa',6,2,.3,2);return}
}
}
if(linesUsed>=maxLines)return;
drawingLine={x1:cx,y1:cy,x2:cx,y2:cy};sfxDraw();
}
function moveDraw(cx,cy){
if(!drawingLine)return;
const dx=cx-drawingLine.x1,dy=cy-drawingLine.y1,len=Math.hypot(dx,dy),mx=120*SCALE;
if(len>mx){drawingLine.x2=drawingLine.x1+dx/len*mx;drawingLine.y2=drawingLine.y1+dy/len*mx}
else{drawingLine.x2=cx;drawingLine.y2=cy}
}
function endDraw(){
if(!drawingLine)return;
if(Math.hypot(drawingLine.x2-drawingLine.x1,drawingLine.y2-drawingLine.y1)>15*SCALE){
drawnLines.push({...drawingLine,life:4,maxLife:4});linesUsed++;
}
drawingLine=null;
}

let pointerDown=false;
C.addEventListener('pointerdown',e=>{e.preventDefault();resumeAudio();if(gameState==='level'){startDraw(e.clientX,e.clientY);pointerDown=true}});
C.addEventListener('pointermove',e=>{e.preventDefault();if(pointerDown&&gameState==='level')moveDraw(e.clientX,e.clientY)});
C.addEventListener('pointerup',e=>{e.preventDefault();if(pointerDown){endDraw();pointerDown=false}});
C.addEventListener('pointercancel',()=>{if(pointerDown){endDraw();pointerDown=false}});

/* ─── Drawing utilities ─── */
function roundRect(x,y,w,h,r){
X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);
X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);
X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();
}
function glow(x,y,r,color,a=1){
const g=X.createRadialGradient(x,y,0,x,y,r);
g.addColorStop(0,color);g.addColorStop(1,'transparent');
X.globalAlpha=a;X.fillStyle=g;X.beginPath();X.arc(x,y,r,0,TAU);X.fill();X.globalAlpha=1;
}

/* ─── Draw background ─── */
function drawBG(bg1,bg2){
const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,bg1||'#0a0a1a');g.addColorStop(1,bg2||'#0f0f2a');
X.fillStyle=g;X.fillRect(0,0,W,H);
const t=gameTime*.08;
for(let i=0;i<50;i++){
const sx=(i*137.5+t*15)%W,sy=(i*97.3+Math.sin(t+i)*5)%H;
X.globalAlpha=.15+.2*Math.sin(gameTime*1.5+i);
X.fillStyle='#fff';X.beginPath();X.arc(sx,sy,1,0,TAU);X.fill();
}
X.globalAlpha=1;
}

/* ─── Draw game field border ─── */
function drawField(){
const fl=gx(0),ft=gy(0),fw=FW,fh=FH-120;
X.strokeStyle='rgba(255,255,255,.06)';X.lineWidth=1;X.strokeRect(fl,ft,fw,fh);
}

/* ─── Draw orbs ─── */
function drawOrbs(){
for(const orb of orbs){
if(!orb.active&&!orb.absorbed)continue;
if(orb.spawnDelay>0){
const a=1-orb.spawnDelay/.5;
X.globalAlpha=a;glow(orb.x,orb.y,28*SCALE,'rgba(255,200,50,.3)',a*.4);
X.fillStyle='#fbbf24';X.beginPath();X.arc(orb.x,orb.y,orb.r*a,0,TAU);X.fill();X.globalAlpha=1;continue;
}
if(!orb.active)continue;
for(let i=0;i<orb.trail.length;i++){const tr=orb.trail[i];if(tr.a<=0)continue;X.globalAlpha=tr.a*.35;X.fillStyle='#fbbf24';X.beginPath();X.arc(tr.x,tr.y,orb.r*tr.a*.5,0,TAU);X.fill()}
X.globalAlpha=1;
glow(orb.x,orb.y,32*SCALE,'rgba(251,191,36,.2)');
const og=X.createRadialGradient(orb.x-2,orb.y-2,0,orb.x,orb.y,orb.r);
og.addColorStop(0,'#fff');og.addColorStop(.35,'#fde68a');og.addColorStop(1,'#f59e0b');
X.fillStyle=og;X.shadowColor='#fbbf24';X.shadowBlur=14;
X.beginPath();X.arc(orb.x,orb.y,orb.r,0,TAU);X.fill();X.shadowBlur=0;
}
}

/* ─── Draw targets ─── */
function drawTargets(){
for(const tgt of targets){
const pulse=Math.sin(gameTime*3)*.12+.88;
if(tgt.collected){
if(tgt.pulse>0){tgt.pulse-=.02;glow(tgt.x,tgt.y,tgt.r*3*tgt.pulse,'rgba(74,222,128,.3)')}
X.globalAlpha=.3;X.strokeStyle='#4ade80';X.lineWidth=2;X.beginPath();X.arc(tgt.x,tgt.y,tgt.r,0,TAU);X.stroke();
X.strokeStyle='#4ade80';X.lineWidth=3*SCALE;X.beginPath();
X.moveTo(tgt.x-7*SCALE,tgt.y);X.lineTo(tgt.x-2*SCALE,tgt.y+5*SCALE);X.lineTo(tgt.x+7*SCALE,tgt.y-5*SCALE);X.stroke();
X.globalAlpha=1;
}else{
glow(tgt.x,tgt.y,tgt.r*2.2*pulse,'rgba(251,191,36,.1)');
X.strokeStyle='rgba(251,191,36,.5)';X.lineWidth=2*SCALE;X.setLineDash([4,4]);
X.beginPath();X.arc(tgt.x,tgt.y,tgt.r*pulse,0,TAU);X.stroke();X.setLineDash([]);
X.fillStyle='rgba(251,191,36,.05)';X.beginPath();X.arc(tgt.x,tgt.y,tgt.r*pulse,0,TAU);X.fill();
X.fillStyle='rgba(251,191,36,.35)';X.beginPath();
X.moveTo(tgt.x,tgt.y-7*SCALE);X.lineTo(tgt.x+5*SCALE,tgt.y);X.lineTo(tgt.x,tgt.y+7*SCALE);X.lineTo(tgt.x-5*SCALE,tgt.y);X.closePath();X.fill();
}
}
}

/* ─── Draw objects ─── */
function drawObjects(){
for(const obj of levelObjects){
if(obj.t==='wall'){
X.strokeStyle='rgba(148,163,184,.5)';X.lineWidth=3*SCALE;X.shadowColor='#94a3b8';X.shadowBlur=5;
X.beginPath();X.moveTo(obj.px1,obj.py1);X.lineTo(obj.px2,obj.py2);X.stroke();X.shadowBlur=0;
}
else if(obj.t==='mirror'){
const mx1=obj.px-Math.cos(obj.angle)*obj.len,my1=obj.py-Math.sin(obj.angle)*obj.len;
const mx2=obj.px+Math.cos(obj.angle)*obj.len,my2=obj.py+Math.sin(obj.angle)*obj.len;
X.strokeStyle='#60a5fa';X.lineWidth=4*SCALE;X.shadowColor='#60a5fa';X.shadowBlur=10;X.lineCap='round';
X.beginPath();X.moveTo(mx1,my1);X.lineTo(mx2,my2);X.stroke();X.shadowBlur=0;X.lineCap='butt';
if(obj.rot){X.fillStyle='rgba(96,165,250,.25)';X.beginPath();X.arc(obj.px,obj.py,12*SCALE,0,TAU);X.fill();
X.strokeStyle='rgba(96,165,250,.4)';X.lineWidth=1;X.beginPath();X.arc(obj.px,obj.py,12*SCALE,0,TAU);X.stroke()}
}
else if(obj.t==='crystal'){
X.save();X.translate(obj.px,obj.py);X.rotate(obj.anim*.5);
const cg=X.createRadialGradient(0,0,0,0,0,obj.r);cg.addColorStop(0,'#e9d5ff');cg.addColorStop(.5,'#c084fc');cg.addColorStop(1,'#7c3aed');
X.fillStyle=cg;X.shadowColor='#c084fc';X.shadowBlur=14;
X.beginPath();for(let i=0;i<6;i++){const a=TAU*i/6;X.lineTo(Math.cos(a)*obj.r,Math.sin(a)*obj.r)}X.closePath();X.fill();
X.shadowBlur=0;X.restore();
}
else if(obj.t==='portal'){
glow(obj.px1,obj.py1,obj.r*2.2,'rgba(52,211,153,.12)');
X.strokeStyle='#34d399';X.lineWidth=2.5*SCALE;X.shadowColor='#34d399';X.shadowBlur=10;
X.beginPath();X.arc(obj.px1,obj.py1,obj.r*(.9+.1*Math.sin(obj.anim)),0,TAU);X.stroke();
glow(obj.px2,obj.py2,obj.r*2.2,'rgba(52,211,153,.12)');
X.beginPath();X.arc(obj.px2,obj.py2,obj.r*(.9+.1*Math.sin(obj.anim+PI)),0,TAU);X.stroke();
X.shadowBlur=0;

/* ─── Actions ─── */
function act(a){
sfxClick();
if(a==='play'){gameState='map';setupMap()}
else if(a==='back_menu'){gameState='menu';setupMenu();stopMusic()}
else if(a==='back_map'){gameState='map';setupMap()}
else if(a==='back_select'){gameState='levelselect';setupLevelSel()}
else if(a==='settings'){gameState='settings';setupSettings()}
else if(a==='restart'||a==='retry'||a==='replay'){resize();initLevel(currentLevel);gameState='level';setupLevel()}
else if(a==='next'){if(currentLevel+1<LEVELS.length){resize();initLevel(currentLevel+1);gameState='level';setupLevel()}else{gameState='map';setupMap()}}
else if(a==='to_map'){gameState='map';setupMap()}
else if(a==='toggle_sfx'){sfxOn=!sfxOn;doSave();setupSettings()}
else if(a==='toggle_music'){musicOn=!musicOn;if(!musicOn)stopMusic();doSave();setupSettings()}
else if(a==='reset'){save={level:0,stars:{},worldState:{},settings:{sfx:true,music:true}};doSave();sfxOn=true;musicOn=true;gameState='menu';setupMenu()}
else if(a.startsWith('level_')){resize();initLevel(+a.slice(6));gameState='level';setupLevel();startMusic()}
else if(a.startsWith('world_')){selectedWorld=+a.slice(6);gameState='levelselect';setupLevelSel()}
}

/* ─── Click handling ─── */
document.addEventListener('click',e=>{
const cx=e.clientX,cy=e.clientY;
for(const b of uiButtons){if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){act(b.cb);return}}
if(gameState==='map'){
const startY=75,cardH=108*SCALE,gap=14*SCALE;
for(let i=0;i<WORLDS.length;i++){
const ccy=startY+i*(cardH+gap)-mapScroll;
if(cx>22&&cx<W-22&&cy>ccy&&cy<ccy+cardH&&save.level>=WORLDS[i].unlockAt){act('world_'+i);return}
}
}
if(gameState==='level'&&levelWon&&winTimer>1.5)setupWin();
if(gameState==='level'&&levelLost)setupLose();
});

let mapDragY=null;
document.addEventListener('touchstart',e=>{if(gameState==='map')mapDragY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchmove',e=>{if(gameState==='map'&&mapDragY!==null){
const dy=mapDragY-e.touches[0].clientY;mapTargetScroll=clamp(mapTargetScroll+dy,0,Math.max(0,WORLDS.length*122*SCALE-H+100));mapDragY=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',()=>{mapDragY=null});
document.addEventListener('wheel',e=>{if(gameState==='map')mapTargetScroll=clamp(mapTargetScroll+e.deltaY*.5,0,Math.max(0,WORLDS.length*122*SCALE-H+100))},{passive:true});

/* ─── Main loop ─── */
let lastTime=0;
function frame(now){
requestAnimationFrame(frame);
const dt=Math.min((now-lastTime)/1000,.05);lastTime=now;gameTime+=dt;
resize();

if(gameState==='level')updateLevel(dt);
if(gameState==='menu')menuAnim+=dt;
updateParticles(dt);
if(screenShake>0){screenShake-=dt*5;shakeX=rng(-2,2)*screenShake;shakeY=rng(-2,2)*screenShake}else{shakeX=0;shakeY=0}

X.save();X.translate(shakeX,shakeY);

if(gameState==='menu'){drawMenu();setupMenu();drawUI()}
else if(gameState==='map'){drawMap();setupMap();drawUI()}
else if(gameState==='levelselect'){drawLevelSelect();setupLevelSel();drawUI()}
else if(gameState==='level'){
const wd=WORLDS[LEVELS[currentLevel]?.w||0];
drawBG(wd.bg1,wd.bg2);drawField();drawObjects();drawLines();drawTargets();drawOrbs();drawParticles();drawHUD();
setupLevel();drawUI();
if(levelWon){drawWin(dt);if(winTimer>1.5){setupWin();drawUI()}}
if(levelLost){drawLose();setupLose();drawUI()}
}
else if(gameState==='settings'){drawSettings();setupSettings();drawUI()}

X.restore();
}

setupMenu();requestAnimationFrame(frame);
</script>
