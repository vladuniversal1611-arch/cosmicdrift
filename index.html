<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a2a1e">
<title>Tiny Kingdom — Маленьке Королівство</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="top">
    <div id="topRes"></div>
    <div id="topBar2">
      <div id="topStats"></div>
      <button id="settingsBtn" aria-label="Налаштування">⚙️</button>
    </div>
  </div>
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="eventBanner"></div>
    <div id="toasts"></div>
    <div id="sheet">
      <div id="sheetHead">
        <div id="panelTitle"></div>
        <button id="panelClose" aria-label="Закрити">✕</button>
      </div>
      <div id="panelBody"></div>
    </div>
  </div>
  <div id="nav"></div>
</div>
<div id="modal"></div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</html>
