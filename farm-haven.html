<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm Haven">
<meta name="theme-color" content="#2e7d32">
<meta name="description" content="Farm Haven: New Beginnings — відроди дідусеву ферму, допоможи мешканцям долини та поверни до життя магічне Дерево Життя.">
<title>Farm Haven: Новий Початок</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#1b2a1b;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:'Segoe UI',system-ui,sans-serif}
/* fullscreen app: the map fills the whole screen, UI floats above it */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--appbg);overflow:hidden}

/* seasons: panel background */
#app{--appbg:linear-gradient(#b7e8a0,#8fd07a)}
#app.season-summer{--appbg:linear-gradient(#c9e88a,#93c85e)}
#app.season-autumn{--appbg:linear-gradient(#f0d193,#d8a45e)}
#app.season-winter{--appbg:linear-gradient(#dbe9f4,#b6cede)}

/* header */
header{padding:calc(10px + env(safe-area-inset-top)) 12px 8px;background:rgba(30,52,25,.82);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20;position:relative}
#hrow{display:flex;align-items:center;gap:8px}
.hpill{background:rgba(255,255,255,.12);border-radius:12px;padding:4px 10px;font-size:14px;font-weight:700;white-space:nowrap}
#coins{color:#ffd54f}
#lvlbox{flex:1;min-width:0}
#lvlrow{display:flex;justify-content:space-between;font-size:11px;opacity:.95;gap:6px}
#lvlrow span{white-space:nowrap}
#xptrack{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-top:3px}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,#aed581,#ffd54f);border-radius:3px;transition:width .3s}
#gear{background:none;border:none;font-size:20px;cursor:pointer;color:#fff}
#calbanner{display:none;margin-top:8px;background:linear-gradient(90deg,#7b1fa2,#ab47bc);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;cursor:pointer}
#festbanner{display:none;margin-top:8px;background:linear-gradient(90deg,#ff8f00,#ffb300);color:#3d2600;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;animation:glowp 1.6s infinite}
@keyframes glowp{50%{filter:brightness(1.12)}}
#treemini{cursor:pointer}

/* main */
main{flex:1;overflow:hidden;position:relative;z-index:10;pointer-events:none}
.tab{position:absolute;inset:0;overflow-y:auto;padding:10px 10px 16px;display:none;background:var(--appbg);pointer-events:auto}
.tab.on{display:block}
/* farm tab is a transparent overlay over the fullscreen map */
#tab-farm{background:none;pointer-events:none;overflow:hidden;padding:0 8px 10px;display:none;flex-direction:column;justify-content:flex-end}
#tab-farm.on{display:flex}

/* fullscreen map canvas behind everything */
#farmCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#33502b;cursor:grab;z-index:0}
#zoomctl{position:absolute;right:10px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.zbtn{width:38px;height:38px;border:none;border-radius:11px;background:rgba(30,52,25,.8);color:#fff;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);backdrop-filter:blur(6px)}

/* seed bar — floating strip above the nav */
#seedbar{display:flex;gap:6px;overflow-x:auto;padding:8px;scrollbar-width:none;background:rgba(30,52,25,.62);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
#seedbar::-webkit-scrollbar{display:none}
.seedchip{flex:0 0 auto;background:#fff9e8;border:2px solid transparent;border-radius:12px;padding:5px 9px;font-size:13px;font-weight:700;color:#4a3b1f;cursor:pointer;text-align:center}
.seedchip.sel{border-color:#2e7d32;background:#e6ffd9}
.seedchip.off{opacity:.45}
.seedchip small{display:block;font-weight:600;font-size:10px;color:#8a7a55}

/* cards */
.card{background:rgba(255,253,245,.95);border-radius:14px;padding:11px 12px;margin-bottom:10px;color:#33301f;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card h3{font-size:15px;margin-bottom:6px}
.card p{font-size:13px;line-height:1.35}
.muted{color:#7d7458;font-size:12px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #e4dcc4;font-size:14px}
.rowline:last-child{border-bottom:none}
.btn{background:#2e7d32;color:#fff;border:none;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:disabled{background:#b9b3a0;cursor:default}
.btn.gold{background:#ef8f00}
.btn.small{padding:5px 9px;font-size:12px}
.btn.ghost{background:#e8e2cf;color:#4c452e}
.secTitle{font-size:14px;font-weight:800;color:#274d22;margin:12px 4px 6px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.season-winter .secTitle{color:#1c3a52}
.needok{color:#2e7d32;font-weight:700}
.needno{color:#c62828;font-weight:700}
.pbar{height:7px;background:#e6dfc8;border-radius:4px;overflow:hidden;margin-top:6px}
.pfill{height:100%;background:linear-gradient(90deg,#66bb6a,#9ccc65)}

/* nav */
nav{display:flex;background:rgba(30,52,25,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 4px calc(6px + env(safe-area-inset-bottom));position:relative;z-index:20}
nav button{flex:1;background:none;border:none;color:#cfe3c4;font-size:10px;cursor:pointer;padding:4px 0;border-radius:10px}
nav button .ni{display:block;font-size:20px;margin-bottom:2px}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
nav button .dot{position:relative}
nav button .dot::after{content:'';position:absolute;top:-2px;right:-6px;width:8px;height:8px;border-radius:50%;background:#ff5252}

/* fishing minigame overlay */
#fishing{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:flex-end;background:linear-gradient(#9fd4ef 0%,#5aa7d8 34%,#3d85b8 60%,#2a6a99 100%);overflow:hidden;touch-action:none}
#fishing.on{display:flex}
#fishing.winter{background:linear-gradient(#dfeaf3 0%,#b9d6ea 34%,#8fb8d6 60%,#6f9cbf 100%)}
#fishSun{position:absolute;top:26px;right:34px;font-size:44px;filter:drop-shadow(0 0 18px #ffe28a)}
#fishWaves{position:absolute;left:0;right:0;top:32%;bottom:0;pointer-events:none;opacity:.5;font-size:22px;color:#fff;letter-spacing:14px;overflow:hidden;line-height:2.4}
#bobber{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-size:44px;transition:top .3s;filter:drop-shadow(0 4px 6px rgba(0,20,40,.4))}
#bobber.floaty{animation:bobf 2.2s ease-in-out infinite}
#bobber.bite{animation:bshake .12s linear infinite}
@keyframes bobf{50%{transform:translateX(-50%) translateY(7px)}}
@keyframes bshake{25%{transform:translateX(-58%) translateY(9px) rotate(-9deg)}75%{transform:translateX(-42%) translateY(3px) rotate(9deg)}}
#fishMsg{position:absolute;top:14%;left:0;right:0;text-align:center;font-size:19px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,30,60,.55);padding:0 20px}
#fishCatch{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:56px;filter:drop-shadow(0 4px 8px rgba(0,20,40,.4))}
#fishCtl{position:relative;z-index:2;display:flex;gap:10px;padding:0 16px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:420px}
#castBtn{flex:1;padding:15px;font-size:17px;border-radius:16px}
#castBtn.bite{background:#ef8f00;animation:glowp .4s infinite}
#fishClose{width:54px;border-radius:16px}

/* mine overlay */
#mine{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:space-between;background:linear-gradient(#3a2f26 0%,#241c15 40%,#120d09 100%);color:#e8dcc8;overflow:hidden;touch-action:none;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
#mine.on{display:flex}
#mineTop{text-align:center}
#mineFloor{font-size:22px;font-weight:800}
#minePick{font-size:13px;opacity:.8;margin-top:3px}
#mineRock{font-size:110px;filter:drop-shadow(0 6px 14px #000);transition:transform .08s;cursor:pointer;user-select:none}
#mineRock.hit{transform:scale(.9) rotate(-4deg)}
#mineLog{min-height:44px;text-align:center;font-size:15px;font-weight:700;color:#ffd54f}
#mineHint{text-align:center;font-size:12px;opacity:.75;margin-top:4px}
#mineBtns{display:flex;gap:8px;width:100%;max-width:420px;flex-wrap:wrap;justify-content:center}
#mineBtns .btn{flex:1;min-width:100px}
#digBtn{background:#8d6034;font-size:16px;padding:13px}
#digBtn:disabled{background:#5a4a38}

/* toasts */
#toasts{position:absolute;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:50}
.toast{background:rgba(30,45,25,.93);color:#fff;border-radius:12px;padding:8px 16px;font-size:13px;font-weight:600;max-width:88%;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}

/* modal */
#mback{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#mback.on{display:flex}
#mbox{background:#fffdf3;border-radius:18px;padding:18px;max-width:360px;width:100%;max-height:82%;overflow-y:auto;color:#332e1c}
#mbox h2{font-size:18px;margin-bottom:10px;color:#274d22}
#mbox p{font-size:14px;line-height:1.45;margin-bottom:10px}
#mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}

.treeArt{text-align:center;font-size:64px;margin:8px 0;filter:drop-shadow(0 4px 10px rgba(0,100,0,.3))}
.treeArt.l0{filter:grayscale(1) opacity(.6)}
.treeArt.l5{animation:glowp 2s infinite}
.badge{display:inline-block;background:#e6ffd9;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;color:#2e7d32;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <canvas id="farmCanvas"></canvas>
  <header>
    <div id="hrow">
      <div class="hpill" id="coins">🪙 100</div>
      <div id="lvlbox">
        <div id="lvlrow"><span id="lvltxt">Рівень 1</span><span id="xptxt">0/60</span></div>
        <div id="xptrack"><div id="xpfill"></div></div>
      </div>
      <div class="hpill" id="seasonpill">🌸 День 1</div>
      <div class="hpill" id="treemini" title="Дерево Життя">🌳0</div>
      <button id="gear">⚙️</button>
    </div>
    <div id="festbanner"></div>
    <div id="calbanner"></div>
  </header>
  <main>
    <section class="tab on" id="tab-farm">
      <div id="zoomctl"><button class="zbtn" id="zin">+</button><button class="zbtn" id="zout">−</button></div>
      <div id="seedbar"></div>
    </section>
    <section class="tab" id="tab-shop"></section>
    <section class="tab" id="tab-prod"></section>
    <section class="tab" id="tab-map"></section>
    <section class="tab" id="tab-quests"></section>
    <section class="tab" id="tab-tree"></section>
  </main>
  <nav>
    <button data-tab="farm" class="on"><span class="ni">🏡</span>Ферма</button>
    <button data-tab="shop"><span class="ni">🛒</span>Крамниця</button>
    <button data-tab="prod"><span class="ni">🏭</span>Цехи</button>
    <button data-tab="map"><span class="ni">🗺️</span>Долина</button>
    <button data-tab="quests"><span class="ni">🧑‍🌾</span>Люди</button>
    <button data-tab="tree"><span class="ni">🌳</span>Дерево</button>
  </nav>
  <div id="mine">
    <div id="mineTop"><div id="mineFloor"></div><div id="minePick"></div></div>
    <div>
      <div id="mineRock">🪨</div>
      <div id="mineLog"></div>
      <div id="mineHint"></div>
    </div>
    <div id="mineBtns">
      <button class="btn" id="digBtn">⛏️ Копати</button>
      <button class="btn" id="mineDownBtn">⬇️ Спуск</button>
      <button class="btn ghost" id="mineUpBtn">⬆️ Вгору</button>
      <button class="btn ghost" id="mineCraftBtn">🔨 Кирка</button>
      <button class="btn ghost" id="mineExitBtn">✖</button>
    </div>
  </div>
  <div id="fishing">
    <div id="fishSun">☀️</div>
    <div id="fishMsg"></div>
    <div id="fishCatch"></div>
    <div id="bobber">🔴</div>
    <div id="fishWaves">〰〰〰〰〰〰〰〰〰〰<br>〰〰〰〰〰〰〰〰〰〰<br>〰〰〰〰〰〰〰〰〰〰<br>〰〰〰〰〰〰〰〰〰〰</div>
    <div id="fishCtl"><button class="btn" id="castBtn">🎣 Закинути</button><button class="btn ghost" id="fishClose">✖</button></div>
  </div>
  <div id="toasts"></div>
  <div id="mback"><div id="mbox"><h2 id="mtitle"></h2><div id="mbody"></div><div id="mbtns"></div></div></div>
</div>

/* ---------- world map geometry ---------- */
const WORLD={w:1600,h:1200};
const ZONES={
 core:{x:500,y:350,w:600,h:500},
 west:{x:140,y:350,w:360,h:500},
 east:{x:1100,y:350,w:360,h:500},
 north:{x:140,y:60,w:1320,h:290},
 south:{x:140,y:850,w:1320,h:290},
};
const PADDOCK={x:930,y:480,w:160,h:140};   // animals wander here
const POND={x:330,y:1010,rx:115,ry:62};    // decorative pond in the south
const HOUSE_POS={x:590,y:450}, BARN_POS={x:1010,y:450};
function zoneAt(x,y){
 for(const k in ZONES){const z=ZONES[k]; if(x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h)return k;}
 return null;
}
function curLoc(){ return (S&&S.loc)||'valley'; }
function objsW(){ return curLoc()==='island'?S.island.objs:S.world.objs; }
function zonesBag(){ if(curLoc()==='island'){ S.zones2=S.zones2||{}; return S.zones2; } return S.zones; }
function zoneOwned(k){ return k==='core'||!!zonesBag()[k]; }
function exCost(z){ return Math.round(EXPANSIONS[z].cost*(curLoc()==='island'?4:1)*(S.friend&&friendPerk('carpenter')?.9:1)); }
function exLvl(z){ return EXPANSIONS[z].lvl+(curLoc()==='island'?6:0); }
function inRect(x,y,r){ return x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h; }
function inPond(x,y){ const dx=(x-POND.x)/(POND.rx+30), dy=(y-POND.y)/(POND.ry+30); return dx*dx+dy*dy<1; }
function posFree(objs,x,y,r){
 for(const o of objs){ const d=Math.hypot(o.x-x,o.y-y); if(d<r)return false; }
 return true;
}

/* ---------- state ---------- */
let S=null;
function defaultState(){
 return {
  coins:100, xp:0, level:1, inv:{},
  world:null, animals:[], buildings:{}, zones:{},
  terr:{}, quests:{}, tree:{lvl:0,don:{}}, fest:{},
  beesUnlocked:false, continent:false, decoCount:0,
  sel:'wheat', worldStart:now(), lastDay:0, sound:true, intro:false,
 };
}
function scatterZone(objs,zk,counts){
 const z=ZONES[zk];
 for(const [kind,n] of counts){
  for(let t=0;t<n;t++){
   for(let tries=0;tries<50;tries++){
    const x=z.x+30+Math.random()*(z.w-60), y=z.y+40+Math.random()*(z.h-70);
    if(!posFree(objs,x,y,kind==='weed'?38:46))continue;
    if(inRect(x,y,PADDOCK)||inPond(x,y))continue;
    if(Math.hypot(x-HOUSE_POS.x,y-HOUSE_POS.y)<80||Math.hypot(x-BARN_POS.x,y-BARN_POS.y)<80)continue;
    objs.push({k:kind,x:Math.round(x),y:Math.round(y)}); break;
   }
  }
 }
}
function genWorld(){
 const objs=[];
 objs.push({k:'house',x:HOUSE_POS.x,y:HOUSE_POS.y});
 objs.push({k:'barn',x:BARN_POS.x,y:BARN_POS.y});
 objs.push({k:'board',x:898,y:506});
 objs.push({k:'museum',x:690,y:430});
 objs.push({k:'tractor',x:940,y:430});
 for(let r=0;r<2;r++)for(let c=0;c<3;c++)objs.push({k:'soil',x:600+c*52,y:620+r*52});
 scatterZone(objs,'core',[['tree',7],['rock',6],['weed',9]]);
 for(const zk of ['west','east','north','south'])
  scatterZone(objs,zk,[['tree',10],['rock',7],['weed',8]]);
 return objs;
}
function bedSpot(objs){ // free lattice spot for a migrated bed
 for(let ring=0;ring<8;ring++)
  for(let r=0;r<6;r++)for(let c=0;c<9;c++){
   const x=560+c*52, y=620+r*52;
   if(zoneAt(x,y)!=='core')continue;
   if(inRect(x,y,PADDOCK))continue;
   if(posFree(objs,x,y,44))return {x,y};
  }
 return null;
}
function migrateGrid(objs){ // carry crops/beds/decos over from the old grid save
 const beds=[],decos=[];
 for(const row of S.grid)for(const t of row){
  if(t.t==='crop')beds.push({crop:t.crop,at:t.at});
  else if(t.t==='soil')beds.push(null);
  else if(t.t==='deco')decos.push(t.e);
 }
 const free=objs.filter(o=>o.k==='soil');
 for(const b of beds){
  let o=free.pop();
  if(!o){ const p=bedSpot(objs); if(!p)break; o={k:'soil',x:p.x,y:p.y}; objs.push(o); }
  if(b){ o.k='crop'; o.crop=b.crop; o.at=b.at; }
 }
 for(const e of decos){
  const p=bedSpot(objs); if(!p)break;
  objs.push({k:'deco',x:p.x,y:p.y,e});
 }
 delete S.grid;
}
function newGame(){
 S=defaultState();
 S.world={objs:genWorld()};
 for(const k in NPCS) S.quests[k]=0;
 for(const k in TERRITORIES) S.terr[k]={unlocked:false,last:0};
 save();
}
function save(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){} }
function load(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  S=Object.assign(defaultState(),JSON.parse(raw));
  if(!S.world){
   if(!S.grid) return false;
   const objs=genWorld();
   migrateGrid(objs);
   S.world={objs};
  }
  if(typeof S.placing==='object')S.placing=null;
  // saves from before buildings appeared on the map: place owned ones
  for(const k in S.buildings)
   if(S.buildings[k].owned&&!S.world.objs.some(o=>o.k==='bldg'&&o.b===k))placeBuilding(k);
  return true;
 }catch(e){ return false; }
}

/* --- weather: deterministic per game-day --- */
const WEATHERS={
 sun:{e:'☀️',n:'Сонячно'}, rain:{e:'🌧',n:'Дощ'}, fog:{e:'🌫',n:'Туман'},
 snow:{e:'🌨',n:'Сніжить'}, blizzard:{e:'❄️',n:'Хуртовина'}, rainbow:{e:'🌈',n:'Веселка'},
};
const WEATHER_TABLE={
 spring:[['sun',45],['rain',35],['fog',12],['rainbow',8]],
 summer:[['sun',60],['rain',22],['fog',8],['rainbow',10]],
 autumn:[['sun',30],['rain',40],['fog',25],['rainbow',5]],
 winter:[['snow',50],['blizzard',30],['fog',20]],
 island:[['sun',70],['rain',20],['rainbow',10]],
};
function weatherNow(){
 const d=dayNum();
 const table=WEATHER_TABLE[curLoc()==='island'?'island':season().id];
 let h=((d*2654435761)>>>0)%100;
 for(const [id,w] of table){ h-=w; if(h<0)return {id,...WEATHERS[id]}; }
 return {id:'sun',...WEATHERS.sun};
}
function raining(){ const w=weatherNow().id; return w==='rain'||w==='snow'; }
function dayFrac(){ return ((now()-S.worldStart)/1000%SEC_PER_DAY)/SEC_PER_DAY; }
function nightInfo(){ // returns {dark:0..1, dusk:0..1}
 const f=dayFrac();
 if(f<.08)return {dark:.32*(1-f/.08), dusk:0};        // dawn fades out
 if(f<.7)return {dark:0, dusk:0};                     // day
 if(f<.8)return {dark:.32*((f-.7)/.1)*.5, dusk:(f-.7)/.1}; // sunset
 return {dark:.32, dusk:Math.max(0,1-(f-.8)/.06)};    // night
}
function festKey(){ return yearNum()+'-'+seasonIdx(); }

/* ---------- audio ---------- */
let AC=null;
function snd(f,d,type){
 if(!S||!S.sound)return;
 try{
  const fresh=!AC;
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(fresh&&!ambientT)ambientT=setInterval(ambientTick,2600);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'triangle'; o.frequency.value=f;
  g.gain.setValueAtTime(.08,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
 }catch(e){}
}
const sPop=()=>snd(520,.09), sCoin=()=>{snd(880,.08);setTimeout(()=>snd(1320,.1),70);}, sUp=()=>{snd(440,.12);setTimeout(()=>snd(660,.12),110);setTimeout(()=>snd(880,.18),220);}, sErr=()=>snd(160,.15,'sawtooth');
/* --- ambient soundscape: birds (day) & crickets (night) --- */
function birdChirp(){
 if(!S||!S.sound||!AC||document.hidden)return;
 const n=2+ri(3), base=1600+ri(1400);
 for(let i=0;i<n;i++)setTimeout(()=>{
  try{
   const o=AC.createOscillator(),g=AC.createGain();
   o.type='sine'; o.frequency.value=base+(ri(400)-200);
   o.frequency.linearRampToValueAtTime(o.frequency.value+300,AC.currentTime+.06);
   g.gain.setValueAtTime(.035,AC.currentTime);
   g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.09);
   o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+.1);
  }catch(e){}
 },i*90);
}
function cricket(){
 if(!S||!S.sound||!AC||document.hidden)return;
 try{
  for(let k=0;k<3;k++)setTimeout(()=>{
   const o=AC.createOscillator(),g=AC.createGain();
   o.type='square'; o.frequency.value=4200+ri(300);
   g.gain.setValueAtTime(.014,AC.currentTime);
   g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.03);
   o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+.035);
  },k*45);
 }catch(e){}
}
let ambientT=0;
function ambientTick(){
 if(!S||!S.sound||!AC){ return; }

  for(const k in ANIMALS) if(ANIMALS[k].lvl===S.level&&!ANIMALS[k].needsQuest) un.push(ANIMALS[k].e+' '+ANIMALS[k].n);
  for(const k in BUILDINGS) if(BUILDINGS[k].lvl===S.level) un.push(BUILDINGS[k].e+' '+BUILDINGS[k].n);

function stepAnimals(dt){
 while(wander.length<S.animals.length){
  wander.push({x:PADDOCK.x+20+ri(PADDOCK.w-40),y:PADDOCK.y+20+ri(PADDOCK.h-40),tx:0,ty:0,wait:0});
  const wd=wander[wander.length-1]; wd.tx=wd.x; wd.ty=wd.y;
 }
 wander.length=S.animals.length;
 for(const wd of wander){
  if(wd.wait>0){ wd.wait-=dt; continue; }
  const dx=wd.tx-wd.x, dy=wd.ty-wd.y, d=Math.hypot(dx,dy);
  if(d<2){ wd.tx=PADDOCK.x+16+ri(PADDOCK.w-32); wd.ty=PADDOCK.y+16+ri(PADDOCK.h-32); wd.wait=1+Math.random()*3; continue; }
  const sp=18*dt;
  wd.x+=dx/d*sp; wd.y+=dy/d*sp;
 }
}
function clampCam(w,h){

 cam.x=vw>=WORLD_ISO.w+2*pad?(WORLD_ISO.w-vw)/2:Math.max(-pad,Math.min(WORLD_ISO.w+pad-vw,cam.x));
 cam.y=vh>=WORLD_ISO.h+2*pad?(WORLD_ISO.h-vh)/2:Math.max(-pad,Math.min(WORLD_ISO.h+pad-vh,cam.y));
}
/* --- input: pan / pinch / tap --- */
function initCanvas(){
 cv=$('farmCanvas'); cx=cv.getContext('2d');
 const resize=()=>{
  dpr=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
 };
 resize(); window.addEventListener('resize',resize);
 // start centered on the farmstead, close enough to fill the screen
 cam.s=Math.max(minScale(),Math.min(.95,cv.clientHeight/1050));
 const c0=isoP(795,555);
 cam.x=c0.x-cv.clientWidth/cam.s/2; cam.y=c0.y-cv.clientHeight/cam.s/2;
 const pts=new Map(); let start=null,drag=false,pinchD=0;
 const pdist=()=>{ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); };
 cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ start={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; drag=false; }
  else if(pts.size===2)pinchD=pdist();
 });
 cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1&&start){
   const dx=e.clientX-start.x, dy=e.clientY-start.y;
   if(Math.hypot(dx,dy)>7)drag=true;
   if(drag){ cam.x=start.cx-dx/cam.s; cam.y=start.cy-dy/cam.s; }
  }else if(pts.size===2&&pinchD>0){
   const nd=pdist();
   const a=[...pts.values()];
   const rect=cv.getBoundingClientRect();
   zoomAt((a[0].x+a[1].x)/2-rect.left,(a[0].y+a[1].y)/2-rect.top,nd/pinchD);
   pinchD=nd;
  }
 });
 const up=e=>{
  if(!pts.has(e.pointerId))return;
  pts.delete(e.pointerId);
  if(pts.size===0){
   if(!drag&&start){
    const rect=cv.getBoundingClientRect();
    const wp=unIso(cam.x+(e.clientX-rect.left)/cam.s,cam.y+(e.clientY-rect.top)/cam.s);
    tapWorld(wp.x,wp.y);
   }
   start=null; drag=false;
  }
  pinchD=0;
 };
 cv.addEventListener('pointerup',up);
 cv.addEventListener('pointercancel',up);
 cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:.87); },{passive:false});
 $('zin').onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.25);
 $('zout').onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,.8);
 requestAnimationFrame(frame);
}
function minScale(){ // never zoom out past "world fills the screen"

}
function zoomAt(px,py,f){

 cam.x=wx-px/cam.s; cam.y=wy-py/cam.s;
}

function tapWorld(x,y){
 // animals first
 for(let i=0;i<S.animals.length;i++){
  const wd=wander[i]; if(!wd)continue;
  if(Math.hypot(wd.x-x,wd.y-y)<24){
   const a=S.animals[i];
   if(a.readyAt&&now()>=a.readyAt)collectAnimal(i);
   else if(a.readyAt)toast(ANIMALS[a.type].e+' '+ITEMS[ANIMALS[a.type].product].e+' через '+fmtT((a.readyAt-now())/1000));
   else feedAnimal(i);
   return;
  }
 }
 // nearest object
 let best=null,bd=1e9;
 for(const o of objsW()){
  const zk=zoneAt(o.x,o.y);
  if(zk&&!zoneOwned(zk))continue; // hidden under fog
  const r=HITR[o.k]||24, d=Math.hypot(o.x-x,o.y-y);
  if(d<r&&d<bd){ best=o; bd=d; }
 }
 if(best){ handleObj(best); refresh(); return; }
 if(x>1450&&x<1600){ openFishing(); return; } // river bank
 if(inPond(x,y)){ openFishing(); return; }    // pond (works even under fog)
 const zk=zoneAt(x,y);
 if(!zk){ toast('🌲 Дикі хащі. Тут порядкує сама природа'); return; }
 if(!zoneOwned(zk)){ offerExpansion(zk); return; }
 if(inRect(x,y,PADDOCK)){ toast('🐮 Тут пасуться твої тварини'); return; }
 // empty owned land: place deco or till a new bed
 if(S.placing){
  const d=DECOS[S.placing];
  if(!posFree(objsW(),x,y,40)){ toast('Тут замало місця'); return; }
  objsW().push({k:'deco',x:Math.round(x),y:Math.round(y),e:d.e});
  S.decoCount++; S.placing=null; sCoin();
  toast(d.e+' '+d.n+' встановлено! Краса ферми зростає');
  refresh(); return;
 }
 tillAt(x,y);
 refresh();
}
function tillAt(x,y){
 // prefer a lattice-snapped spot so beds line up; fall back to the exact tap
 const cands=[[Math.round(x/52)*52,Math.round(y/52)*52],[Math.round(x),Math.round(y)]];
 for(const [gx,gy] of cands){
  const zk=zoneAt(gx,gy);
  if(!zk||!zoneOwned(zk)||inRect(gx,gy,PADDOCK)||inPond(gx,gy))continue;
  if(!posFree(objsW(),gx,gy,44))continue;
  objsW().push({k:'soil',x:gx,y:gy});
  addXp(1); sPop();
  toast('⛏️ Нова грядка готова! Торкнись її, щоб посадити '+ITEMS[S.sel].e);
  return;
 }
 toast('Тут замало місця для грядки');
}
function freeSpot(r){ // lattice spot for auto-placed structures
 const owned=Object.keys(ZONES).filter(zoneOwned);
 for(const zk of owned){
  const z=ZONES[zk];
  for(let y=z.y+64;y<z.y+z.h-50;y+=52)for(let x=z.x+50;x<z.x+z.w-50;x+=52){
   if(inRect(x,y,PADDOCK)||inPond(x,y))continue;
   if(posFree(objsW(),x,y,r))return {x,y};
  }
 }
 return null;
}

/* ---------- order board ---------- */
function orderItemsPool(){
 const pool=[];
 for(const id in CROPS){
  if(CROPS[id].isle){ if(S.arrived)pool.push(id); }
  else if(S.level>=CROPS[id].lvl)pool.push(id);
 }
 for(const t of new Set(S.animals.map(a=>a.type))) pool.push(ANIMALS[t].product);
 for(const b in S.buildings) if(S.buildings[b].owned)
  for(const rc of BUILDINGS[b].recipes) pool.push(Object.keys(rc.out)[0]);
 return [...new Set(pool)].filter(i=>i!=='feed');
}
function genOrder(){
 const pool=orderItemsPool();
 const kinds=1+ri(Math.min(3,pool.length));
 const items={}; let val=0;
 for(let i=0;i<kinds;i++){
  const it=pool[ri(pool.length)];
  items[it]=(items[it]||0)+1+ri(2+Math.floor(S.level*.8));
 }
 for(const k in items) val+=ITEMS[k].sell*items[k];
 return {items,coins:Math.round(val*1.35),xp:10+Math.round(val/15)};
}
function ensureOrders(){
 if(!S.orders)S.orders=[];
 while(S.orders.length<3)S.orders.push(genOrder());
}
function fulfillOrder(i){
 const o=S.orders[i];
 if(!takeAll(o.items)){ sErr(); return; }
 S.coins+=o.coins; addXp(o.xp); dg('order',1); sCoin();
 S.orders[i]=genOrder();
 toast('📋 Замовлення виконано: +'+fmt(o.coins)+'🪙');
 refresh();
}
function rerollOrder(i){
 if(S.coins<5){ sErr(); toast('Потрібно 5🪙'); return; }
 S.coins-=5; S.orders[i]=genOrder(); sPop(); refresh();
}
function anyOrderReady(){ return (S.orders||[]).some(o=>hasAll(o.items)); }

/* ---------- daily goals & login streak ---------- */
const LOGIN_RW=[{coins:50},{feed:5},{coins:100},{crystal:1},{coins:200},{essence:1},{coins:500}];
function todayKey(){ return new Date().toDateString(); }
function genGoals(){
 const defs=[
  {t:'sell',n:10+S.level*2,txt:'Продай товарів'},
  {t:'harvest',n:5+S.level,txt:'Збери врожаю'},
  {t:'clear',n:4+Math.floor(S.level/2),txt:'Розчисть ділянок'},
  {t:'order',n:1+ri(2),txt:'Виконай замовлень'},
 ];
 if(S.animals.length)defs.push({t:'feed',n:Math.min(3+Math.floor(S.level/2),S.animals.length*3),txt:'Нагодуй тварин'});
 if(S.terr.lake&&S.terr.lake.unlocked)defs.push({t:'fish',n:3+Math.floor(S.level/3),txt:'Злови рибу'});
 defs.push({t:'water',n:4+Math.floor(S.level/2),txt:'Полий грядки'});
 if(S.terr.mine&&S.terr.mine.unlocked)defs.push({t:'dig',n:8+S.level,txt:'Копни в шахті'});
 if(Object.keys(S.buildings).some(b=>S.buildings[b].owned))defs.push({t:'produce',n:2+Math.floor(S.level/3),txt:'Вироби товарів'});
 for(let i=defs.length-1;i>0;i--){ const j=ri(i+1); [defs[i],defs[j]]=[defs[j],defs[i]]; }
 return defs.slice(0,3).map(d=>({t:d.t,n:d.n,txt:d.txt,p:0,done:false,rw:20+S.level*10}));
}
function ensureDaily(){
 if(!S.daily)S.daily={key:'',goals:[],bonus:false,streak:0,lastKey:'',loginPending:false};
 const k=todayKey();
 if(S.daily.key!==k){
  const yest=new Date(Date.now()-864e5).toDateString();
  S.daily.streak=(S.daily.lastKey===yest)?(S.daily.streak%7)+1:1;
  S.daily.lastKey=k; S.daily.key=k; S.daily.bonus=false;
  S.daily.goals=genGoals();
  S.daily.loginPending=true;
  if(S.family)familyNewDay();
 }
}
function dg(type,n){ // daily goal progress + lifetime stats
 if(!S.stats)S.stats={};
 S.stats[type]=(S.stats[type]||0)+n;
 if(!S.daily||!S.daily.goals)return;
 for(const g of S.daily.goals) if(g.t===type&&!g.done) g.p=Math.min(g.n,g.p+n);
}
function st(k){ return (S.stats&&S.stats[k])||0; }
function claimGoal(i){
 const g=S.daily.goals[i];
 if(!g||g.done||g.p<g.n)return;
 g.done=true; S.coins+=g.rw; sCoin();
 toast('📅 Ціль виконано: +'+g.rw+'🪙');
 if(S.daily.goals.every(x=>x.done)&&!S.daily.bonus){
  S.daily.bonus=true;
  const b=50+S.level*20;
  S.coins+=b; give('crystal',1); sUp();
  modal('🎉 Всі щоденні цілі!','<p>Чудова робота, фермере!</p><p class="needok">+'+b+'🪙 та 💎 кристал</p>');
 }
 refresh();
}

const FISH_TABLE=[

];
let fishPhase='idle', fishTimer=0, fishEscTimer=0;
function fishingAllowed(){ return S.terr.lake&&S.terr.lake.unlocked; }
function openFishing(){

function fishAction(){
 if(fishPhase==='idle'){
  fishPhase='wait';
  fishUI('Чекаємо кльову... не смикай зарано!','',false);
  $('castBtn').textContent='Підсікти!';
  sPop();
  clearTimeout(fishTimer);
  fishTimer=setTimeout(()=>{
   if(fishPhase!=='wait')return;
   fishPhase='bite';
   fishUI('❗ КЛЬОЮЄ! ПІДСІКАЙ!','',true);
   snd(1250,.12); setTimeout(()=>snd(1250,.12),150);
   clearTimeout(fishEscTimer);
   fishEscTimer=setTimeout(()=>{
    if(fishPhase!=='bite')return;
    fishPhase='idle';
    fishUI('Ех, зірвалась... Спробуй ще!','💨',false);
    $('castBtn').textContent='🎣 Закинути';
    sErr();
   },900);
  },1500+Math.random()*3500);
 }else if(fishPhase==='wait'){
  clearTimeout(fishTimer);
  fishPhase='idle';
  fishUI('Ти сполохав рибу! Терпіння, фермере.','🌊',false);
  $('castBtn').textContent='🎣 Закинути';
  sErr();
 }else if(fishPhase==='bite'){
  clearTimeout(fishEscTimer);
  fishPhase='idle';
  fishCatch();
  $('castBtn').textContent='🎣 Закинути';
 }
}
function fishCatch(){
 // legendary Balthazar chance while Petro's last quest is active
 if(S.quests.fisherman===3&&!S.story.flags.balt&&Math.random()<.06){
  S.story.flags.balt=1;
  give('catfish',1); addXp(50); dg('fish',1); sUp();
  fishUI('НЕЙМОВІРНО!!!','🐋',false);
  modal('🐋 СОМ БАЛТАЗАР!','<p>Вода вирує — і на гачку велетенський вусатий сом! Він дивиться на тебе на диво розумними очима... наче впізнає.</p><p class="needok">Віднеси його Петру (вкладка «Люди»)!</p>');
  return;
 }
 const tbl=FISH_TABLE.map(f=>({...f}));
 if(weatherNow().id==='fog')tbl.find(f=>f.id==='goldfish').w*=3; // у тумані клює краще
 if(S.friend&&friendPerk('fisherman'))tbl.find(f=>f.id==='goldfish').w*=2;
 if(S.story&&S.story.flags&&S.story.flags.krukPoison)tbl.find(f=>f.id==='boot').w*=5; // отруєна річка
 let total=0; for(const f of tbl)total+=f.w;
 let r=Math.random()*total, pick=tbl[0];
 for(const f of tbl){ r-=f.w; if(r<=0){ pick=f; break; } }
 give(pick.id,1); dg('fish',1);
 const it=ITEMS[pick.id];
 if(pick.id==='goldfish')dg('goldfish',1);
 if(pick.id==='boot'){
  fishUI('Старий черевик... Ну, буває 😅','🥾',false);
  addXp(1); sPop();
 }else if(pick.id==='goldfish'){
  fishUI('ЗОЛОТА РИБКА! Рідкісний улов!','🎏',false);
  addXp(15); sUp();
 }else{
  fishUI('Спіймано: '+it.n+'! (+'+sellPrice(pick.id)+'🪙 у крамниці)',it.e,false);
  addXp(pick.id==='trout'?8:pick.id==='crayfish'?6:3); sCoin();
 }
}

function evAct(n){
 const e=S.event; if(!e)return;
 const base=evBase();
 switch(e.tpl){
  case 'quarrel':{
   const w=n===0?e.a:e.b, l=n===0?e.b:e.a;
   S.coins+=base; addXp(12); sCoin();
   evEnd(EV_E[w]+' вдячно киває (+'+base+'🪙). '+EV_NPC[l].split(' ')[1]+' буркоче, але мир відновлено 🤝');
   return;}
  case 'traveler':
   if(n===0){
    if(!takeAll({[e.item]:e.qty})){ sErr(); return; }
    const rw=Math.round(ITEMS[e.item].sell*e.qty*1.8);
    S.coins+=rw; addXp(20); sCoin();
    evEnd('🎒 «Дякую, добра душе!» Мандрівник платить '+fmt(rw)+'🪙 і йде далі');
   }else{ addXp(5); evEnd('🎒 Мандрівник махає рукою на прощання (+5⭐)'); }
   return;
  case 'sick':{
   const a=S.animals[e.ai];
   if(n===0){ if(!takeAll({flower:3,honey:1})){ sErr(); return; } }
   else if(n===1){ if(S.coins<50){ sErr(); return; } S.coins-=50; }
   else { if(a)a.hap=Math.max(0,a.hap-10); evEnd('🤒 Тварина ще трохи посумує...'); return; }
   if(a)a.hap=100;
   addXp(15); sUp();
   evEnd('💚 Одужала! Щастя тварини повне (+15⭐)');
   return;}
  case 'lost':
   if(Math.random()<.55){
    const rw=Math.round(base*1.5);
    S.coins+=rw; addXp(15); sCoin();
    evEnd('🔍 Знайшов! '+EV_NPC[e.a].split(' ')[1]+' на радощах дає '+rw+'🪙');
   }else{
    e.tries++;
    if(e.tries>=3){ addXp(5); evEnd('🔍 Не знайшлося... але за старання +5⭐'); }
    else { sErr(); toast('Тут нема... лишилось спроб: '+(3-e.tries)); refresh(); }
   }
   return;
  case 'contest':{
   if(!takeAll({[e.item]:e.qty})){ sErr(); return; }
   const rw=Math.round(ITEMS[e.item].sell*e.qty*1.5)+base;
   S.coins+=rw; addXp(25); sUp();
   evEnd('🏁 Перемога! '+EV_NPC[e.a].split(' ')[1]+' тисне руку: +'+fmt(rw)+'🪙');
   return;}
  case 'merchant':{
   const q=invGet(e.item);
   if(q<1){ sErr(); return; }
   const rw=Math.round(sellPrice(e.item)*1.6*q);
   S.inv[e.item]=0; S.coins+=rw; dg('sell',q); sCoin();
   evEnd('🧙 Лукас платить '+fmt(rw)+'🪙 і зникає в куряві шляху');
   return;}
  case 'kids':
   if(n===0){ addXp(15); const c=orderItemsPool()[0]||'wheat'; give(c,2);
    evEnd('😄 Найкращий день! Дітлахи «за службу» приносять '+ITEMS[c].e+'×2 (+15⭐)'); }
   else { S.coins+=20; evEnd('📦 Ящики на місці. Дітлахи лишили 20🪙 «компенсації» і втекли'); }
   return;
  case 'treasure':{
   const r=Math.random();
   if(r<.45){ const rw=Math.round(base*1.5); S.coins+=rw; sCoin(); evEnd('💰 Скарб! Стара скринька з '+rw+'🪙'); }
   else if(r<.75){ const c=orderItemsPool()[0]||'wheat'; give(c,3); sCoin(); evEnd('📦 Схованка з припасами: '+ITEMS[c].e+'×3'); }
   else if(r<.9){ give('crystal',1); sUp(); evEnd('💎 Кристал! Хтось сховав його дуже давно...'); }
   else { give('boot',1); evEnd('🥾 Черевик. Знову черевик. ЧОМУ ЗАВЖДИ ЧЕРЕВИК?!'); }
   return;}
 }
}

function mmdd(d){ return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function calActive(dateNow){
 const d=dateNow||new Date(), cur=mmdd(d);
 for(const ev of CAL_EVENTS){
  const wrap=ev.from>ev.to;
  if(wrap?(cur>=ev.from||cur<=ev.to):(cur>=ev.from&&cur<=ev.to))return ev;
 }
 return null;
}
function calKey(ev){
 const d=new Date(); let y=d.getFullYear();
 if(ev.from>ev.to&&mmdd(d)<=ev.to)y--; // the new-year event keeps one key across Dec 31
 return ev.id+'-'+y;
}
function calRwText(rw){
 return Object.entries(rw).map(([k,v])=>k==='coins'?fmt(v)+'🪙':ITEMS[k].e+'×'+v).join(' + ');
}
function claimCal(){
 const ev=calActive();
 if(!ev)return;
 if(!S.calDone)S.calDone={};
 const key=calKey(ev);
 if(S.calDone[key])return;
 if(ev.need&&!takeAll(ev.need)){ sErr(); return; }
 S.calDone[key]=true; dg('fest',1);
 for(const k in ev.rw){ if(k==='coins')S.coins+=ev.rw[k]; else give(k,ev.rw[k]); }
 addXp(60); sUp();
 modal(ev.e+' '+ev.n,'<p>'+ev.tx+'</p><p class="needok">Нагорода року: '+calRwText(ev.rw)+' +60⭐</p><p class="muted">Наступного року свято повернеться з новими дарами!</p>');
 save(); refresh();
}
function checkAnniversary(){
 const years=Math.floor((now()-S.worldStart)/(365.25*864e5));
 if(years>=1&&(S.annivYear||0)<years){
  S.annivYear=years;
  const rw=500*years;
  S.coins+=rw; give('crystal',2*years); give('trophy',1); sUp();
  modal('🎂 Річниця ферми!','<p>Сьогодні рівно '+years+' '+(years===1?'рік':years<5?'роки':'років')+' відтоді, як ти приїхав у долину. Мешканці влаштували свято на твою честь!</p><p class="needok">+'+fmt(rw)+'🪙, 💎×'+(2*years)+', 🏆</p>');
  save();
  return true;
 }
 return false;
}

/* ---------- the deep mine: 10 floors ---------- */
const PICKS=[
 {n:'Стара кирка ⛏️',max:3,cost:null},
 {n:'Кам’яна кирка 🪨⛏️',max:6,cost:{stone:10,wood:5}},
 {n:'Залізна кирка 🔩⛏️',max:9,cost:{iron:8,wood:5}},
 {n:'Золота кирка 🥇⛏️',max:10,cost:{gold:5,crystal:2}},
];
let digCooling=false;
function ensureMine(){ if(!S.mine)S.mine={floor:1,deepest:1,pick:0,digs:6,spirit:false}; }
function pickMax(){ return PICKS[S.mine.pick].max; }
function mineLoot(f){
 const r=Math.random();
 if(f<=3)return r<.5?{stone:1+ri(2)}:r<.85?{ore:1}:{iron:1};
 if(f<=6)return r<.35?{stone:1}:r<.7?{iron:1}:r<.92?{ore:1+ri(2)}:{silver:1};
 if(f<=9)return r<.3?{iron:1}:r<.6?{silver:1}:r<.85?{gold:1}:{crystal:1};
 return r<.4?{gold:1}:r<.75?{gem:1}:r<.95?{crystal:1}:{gem:2};
}
function openMine(){
 if(!S.terr.mine||!S.terr.mine.unlocked){ toast('⛏️ Спершу відкрий Покинуту шахту (вкладка «Долина»)'); return; }
 ensureMine();
 S.mine.floor=Math.min(S.mine.deepest,pickMax());
 $('mine').classList.add('on');
 renderMine('Темрява пахне вологим каменем...');
}
function closeMine(){ $('mine').classList.remove('on'); save(); refresh(); }
function renderMine(log){
 const m=S.mine;
 $('mineFloor').textContent='Поверх '+m.floor+' / 10'+(m.floor>=7?' 💎':m.floor>=4?' 🔦':'');
 $('minePick').textContent=PICKS[m.pick].n+(m.pick<3?' · глибина до '+pickMax():'');
 $('mineRock').textContent=m.floor>=7?'🟪':m.floor>=4?'🟫':'🪨';
 if(log!==undefined)$('mineLog').textContent=log;
 const frontier=m.floor===m.deepest;
 $('mineHint').textContent=frontier?(m.digs>0?'До спуску: ~'+m.digs+' змахів':'Спуск знайдено!'):'Спуск відомий — можна йти глибше';
 $('mineDownBtn').disabled=!(m.floor<10&&m.floor<pickMax()&&(!frontier||m.digs<=0));
 $('mineUpBtn').disabled=m.floor<=1;
 $('mineCraftBtn').style.display=m.pick<3?'':'none';
}
function mineDig(){
 if(digCooling)return;
 const m=S.mine;
 digCooling=true;
 const btn=$('digBtn'); btn.disabled=true;
 setTimeout(()=>{ digCooling=false; btn.disabled=false; },850);
 $('mineRock').classList.add('hit');
 setTimeout(()=>$('mineRock').classList.remove('hit'),90);
 snd(180+ri(60),.08,'square');
 // Autumn Spirit crystal on the deepest floor
 if(m.floor===10&&!S.story.flags.spiritAutumn&&Math.random()<.12){
  S.story.flags.spiritAutumn=1;
  give('crystal',3); give('essence',3); S.coins+=1000; addXp(150); sUp();
  renderMine('🍂 КРИСТАЛ ДУХА ОСЕНІ!');
  modal('🍂 Дух Осені прокидається!','<p>Кирка дзвенить об щось тепле. У бурштиновому кристалі повільно розплющує очі постать із листя і золота...</p><p><i>«Дякую, Хранителю. Віднині осінь у долині буде щедрою».</i></p><p class="needok">+1000🪙, 💎×3, ✨×3, +150⭐<br>Осінні культури ростуть на 10% швидше — назавжди!</p>');
  save(); return;
 }
 const loot=mineLoot(m.floor);
 const parts=[];
 for(const k in loot){ give(k,loot[k]); parts.push(ITEMS[k].e+'×'+loot[k]); }
 if(m.floor===m.deepest&&m.digs>0)m.digs--;
 addXp(2); dg('dig',1);
 renderMine('⛏️ '+parts.join(' '));
 if(m.floor===m.deepest&&m.digs===0){ sUp(); $('mineLog').textContent+='  · Спуск знайдено!'; }
}
function mineDown(){
 const m=S.mine;
 if(m.floor>=10||m.floor>=pickMax())return;
 const frontier=m.floor===m.deepest;
 if(frontier&&m.digs>0)return;
 m.floor++;
 if(m.floor>m.deepest){ m.deepest=m.floor; m.digs=5+ri(4); }
 sPop(); renderMine('Ти спускаєшся глибше... Поверх '+m.floor);
 save();
}
function mineUp(){
 if(S.mine.floor<=1)return;
 S.mine.floor--; sPop();
 renderMine('Піднімаєшся до світла... Поверх '+S.mine.floor);
}
function craftPick(){
 const next=S.mine.pick+1;
 if(next>=PICKS.length)return;
 const c=PICKS[next].cost;
 const costTx=Object.entries(c).map(([k,v])=>ITEMS[k].e+'×'+v).join(' + ');
 modal('🔨 Скувати '+PICKS[next].n,'<p>Міцніша кирка відкриє глибші поверхи (до '+PICKS[next].max+').</p><p>Потрібно: '+needHTML(c)+'</p>',[
  {t:'Скувати',fn:()=>{
   if(!takeAll(c)){ sErr(); toast('Бракує матеріалів: '+costTx); return; }
   S.mine.pick=next; addXp(30); sUp();
   toast('🔨 '+PICKS[next].n+' готова!');
   if($('mine').classList.contains('on'))renderMine('Нова кирка аж сяє!');
   save();
  }},
  {t:'Пізніше',ghost:true},
 ]);
}

/* ---------- the greenhouse (any crop, any season) ---------- */
const GH_SLOTS=6;
function ensureGreenhouse(){ if(!S.gh)S.gh={owned:false,beds:[]}; if(!S.gh.beds)S.gh.beds=[]; }
function buyGreenhouse(){
 ensureGreenhouse();
 if(S.gh.owned)return;
 if(S.coins<1800){ sErr(); toast('Не вистачає монет (1800🪙)'); return; }
 S.coins-=1800; S.gh.owned=true; S.gh.beds=Array(GH_SLOTS).fill(null);
 const p=freeSpot(50)||{x:760,y:430};
 S.world.objs.push({k:'greenhouse',x:p.x,y:p.y});
 addXp(40); sUp();
 toast('🌱 Теплицю збудовано! Знайди її на фермі — там ростуть будь-які культури цілий рік');
 refresh();
}
function ghStage(b){
 if(!b)return 'empty';
 const cd=CROPS[b.crop];
 const p=(now()-b.at)/(cd.time*1000*growMult()*0.85); // greenhouse: +15% faster
 return p>=1?'ready':(p<.5?'sprout':'grow');
}
function openGreenhouse(){
 ensureGreenhouse();
 let html='<p class="muted">Скляні грядки: тут росте будь-яка культура долини незалежно від пори року, ще й на 15% швидше. Полив не потрібен.</p>';
 for(let i=0;i<GH_SLOTS;i++){
  const b=S.gh.beds[i], stg=ghStage(b);
  html+='<div class="rowline"><span>Грядка '+(i+1)+': ';
  if(stg==='empty')html+='<span class="muted">порожня</span>';
  else if(stg==='ready')html+=ITEMS[b.crop].e+' <b>'+ITEMS[b.crop].n+'</b> — готово!';
  else html+=ITEMS[b.crop].e+' '+ITEMS[b.crop].n+' <span class="muted">('+fmtT((CROPS[b.crop].time*growMult()*0.85-(now()-b.at)/1000))+')</span>';
  html+='</span>';
  if(stg==='empty')html+='<button class="btn small" onclick="ghPlant('+i+')">Посадити '+ITEMS[S.sel].e+'</button>';
  else if(stg==='ready')html+='<button class="btn gold small" onclick="ghHarvest('+i+')">Зібрати</button>';
  else html+='<span class="muted">росте…</span>';
  html+='</div>';
 }
 modal('🌱 Теплиця',html);
}
function ghPlant(i){
 const id=S.sel, cd=CROPS[id];
 if(!cd||cd.isle){ toast('У теплиці ростуть лише культури долини'); return; }
 if(S.level<cd.lvl){ toast('Спершу відкрий цю культуру (рівень '+cd.lvl+')'); return; }
 if(S.coins<cd.cost){ sErr(); toast('Не вистачає монет'); return; }
 S.coins-=cd.cost; S.gh.beds[i]={crop:id,at:now()}; sPop();
 save(); openGreenhouse(); renderHUD();
}
function ghHarvest(i){
 const b=S.gh.beds[i]; if(!b||ghStage(b)!=='ready')return;
 const q=1+(Math.random()<.4?1:0); // greenhouse yields a touch more
 give(b.crop,q); addXp(CROPS[b.crop].xp); dg('harvest',q); sCoin();
 S.gh.beds[i]=null;
 save(); openGreenhouse(); renderHUD();
}

/* ---------- Taras the mechanic & the tractor ---------- */
const TRACTOR_CD=120000; // 2 real minutes
function ensureTractor(){ if(!S.tractor)S.tractor={repaired:false,sower:false,lastH:0,lastP:0}; }
function ensureTractorObj(){ if(!S.world.objs.some(o=>o.k==='tractor'))S.world.objs.push({k:'tractor',x:940,y:430}); }
function openTractor(){
 ensureTractor();
 const t=S.tractor;
 if(!t.repaired){
  modal('🧑‍🔧 Механік Тарас',
   '<p>Кремезний чолов’яга витирає руки ганчіркою: «О, а це ж дідів трактор! Іржавий, але серце ще б’ється. Дай залізо, деревину й золото — поверну його до життя, і збиратимеш урожай одним махом!»</p>'+
   '<p>Потрібно: '+needHTML({iron:5,wood:10,gold:2})+'</p>',
   [
    {t:'Полагодити',fn:()=>{
     if(!takeAll({iron:5,wood:10,gold:2})){ sErr(); toast('Бракує матеріалів (копай у шахті ⛏️)'); return; }
     t.repaired=true; addXp(60); sUp();
     toast('🚜 Трактор гуркоче! Тепер тисни на нього для швидкого збору');
     save(); refresh();
    }},
    {t:'Пізніше',ghost:true},
   ]);
  return;
 }
 const hcd=Math.max(0,TRACTOR_CD-(now()-t.lastH))/1000;
 const pcd=Math.max(0,TRACTOR_CD-(now()-t.lastP))/1000;
 let body='<p>🚜 Дідів трактор гуде на повну. Що робимо?</p>';
 const btns=[];
 btns.push({t:hcd>0?('Збір: '+fmtT(hcd)):'🌾 Зібрати весь врожай',fn:()=>{ if(hcd<=0)harvestAll(); }});
 if(t.sower)btns.push({t:pcd>0?('Сівба: '+fmtT(pcd)):'🌱 Засіяти все ('+ITEMS[S.sel].e+')',fn:()=>{ if(pcd<=0)sowAll(); }});
 else btns.push({t:'🔧 Сівалка (5⚙️,3🥇)',fn:()=>{
   if(!takeAll({ore:5,gold:3})){ sErr(); toast('Бракує: 5⚙️ руди, 3🥇 золота'); return; }
   t.sower=true; sUp(); toast('🌱 Сівалку встановлено! Тепер можна засівати все поле'); save(); refresh();
  }});
 btns.push({t:'Закрити',ghost:true});
 modal('🚜 Трактор',body,btns);
}
function harvestAll(){
 let n=0,kinds={};
 for(const o of objsW()){
  if(o.k==='crop'&&cropStage(o)==='ready'){
   const q=1+(Math.random()<.35?1:0);
   give(o.crop,q); kinds[o.crop]=(kinds[o.crop]||0)+q; n+=q;
   addXp(CROPS[o.crop].xp); o.k='soil'; delete o.crop; delete o.at; delete o.w;
  }
 }
 S.tractor.lastH=now();
 if(n){ dg('harvest',n); sCoin(); toast('🚜 Зібрано '+n+' врожаю: '+Object.keys(kinds).map(k=>ITEMS[k].e+'×'+kinds[k]).join(' ')); }
 else toast('🚜 Стиглого врожаю немає');
 save(); refresh();
}
function sowAll(){
 const id=S.sel, cd=CROPS[id];
 if(!cd){ toast('Оберіть насіння внизу 👇'); return; }
 if(!!cd.isle!==(curLoc()==='island')){ sErr(); toast('🌍 Ця культура тут не приживеться'); return; }
 if(!cd.isle&&!cd.seasons.includes(season().id)){ sErr(); toast('❄️ '+ITEMS[id].n+' не в сезон'); return; }
 let n=0;
 for(const o of objsW()){
  if(o.k!=='soil')continue;
  if(S.coins<cd.cost)break;
  S.coins-=cd.cost; o.k='crop'; o.crop=id; o.at=now(); delete o.w; n++;
 }
 S.tractor.lastP=now();
 if(n){ sPop(); toast('🌱 Засіяно '+n+' грядок ('+ITEMS[id].e+') за '+fmt(cd.cost*n)+'🪙'); }
 else toast('🌱 Немає вільних грядок або монет');
 save(); refresh();
}

const FRIEND_NPCS=['carpenter','baker','fisherman','beekeeper','elder'];
const FRIEND_FAV={
 carpenter:['wood','stone','iron'], baker:['flour','egg','wheat'],

};
function ensureFriend(){
 if(!S.friend)S.friend={};
 for(const k of FRIEND_NPCS) if(!S.friend[k])S.friend[k]={pts:0,giftKey:'',claimed:0};
}
function friendLevel(k){ return Math.min(5,Math.floor((S.friend[k].pts||0)/100)); }
function friendHearts(k){ const l=friendLevel(k); return '❤️'.repeat(l)+'🤍'.repeat(5-l); }
function bestGift(k){
 for(const it of FRIEND_FAV[k]) if(invGet(it)>0)return it;
 return null;
}
function giveGift(k){
 ensureFriend();
 const f=S.friend[k];
 if(f.giftKey===todayKey()){ toast('Сьогодні '+NPCS[k].n.split(' ')[1]+' вже отримав(ла) подарунок 🎁'); return; }
 const it=bestGift(k);
 if(!it){ toast('Немає улюблених дарунків для '+NPCS[k].n+' ('+FRIEND_FAV[k].map(i=>ITEMS[i].e).join('')+')'); return; }
 S.inv[it]--; f.giftKey=todayKey();
 const before=friendLevel(k);
 f.pts+=25; sCoin(); dg('gift',1);
 toast(NPCS[k].e+' '+ITEMS[it].e+' «Дякую!» (+дружба)');
 checkFriendLevel(k,before);
 save(); refresh();
}
function checkFriendLevel(k,before){
 const now=friendLevel(k);
 if(now>before){
  const f=S.friend[k];
  const rw=200*now;
  S.coins+=rw; addXp(30);
  let extra='';
  if(now===5){
   const spot=freeSpot(40);
   if(spot){ S.world.objs.push({k:'deco',x:spot.x,y:spot.y,e:NPCS[k].e}); S.decoCount++; }
   extra='<br>🎁 Пам’ятну прикрасу встановлено на фермі!<br><b>Перк дружби: '+FRIEND_PERK[k]+'</b>';
  }
  sUp();
  modal(NPCS[k].e+' '+NPCS[k].n+' — '+friendHearts(k),
   '<p><i>'+FRIEND_LETTERS[k][now-1]+'</i></p><p class="needok">Дружба '+now+'/5 · +'+rw+'🪙 +30⭐'+extra+'</p>');
 }
}
function friendPerk(k){ return friendLevel(k)>=5; }
function friendHTML(){
 ensureFriend();
 let html='<div class="card"><h3>💞 Дружба з мешканцями</h3><p class="muted" style="font-size:11px">Даруй улюблені товари (1 подарунок на день кожному). 5 зірок — особливий перк!</p>';
 for(const k of FRIEND_NPCS){
  const canGift=S.friend[k].giftKey!==todayKey()&&bestGift(k);
  html+='<div class="rowline"><span>'+NPCS[k].e+' <b>'+NPCS[k].n.split(' ')[1]+'</b> '+friendHearts(k)+'<br><span class="muted" style="font-size:10px">любить: '+FRIEND_FAV[k].map(i=>ITEMS[i].e).join(' ')+(friendPerk(k)?' · ⭐'+FRIEND_PERK[k]:'')+'</span></span>'+
   '<button class="btn small'+(canGift?' gold':'')+'" '+(canGift?'':'disabled')+' onclick="giveGift(\''+k+'\')">🎁</button></div>';
 }
 return html+'</div>';
}

function achDone(a){ const [c,m]=a.p(); return c>=m; }
function achReady(){ return ACH.filter(a=>achDone(a)&&!(S.ach&&S.ach[a.id])); }
function achClaimed(){ return ACH.filter(a=>S.ach&&S.ach[a.id]).length; }
function claimAch(){
 const ready=achReady();
 if(!ready.length)return;
 if(!S.ach)S.ach={};
 let coins=0,cryst=0;
 const names=[];
 for(const a of ready){
  S.ach[a.id]=true;
  coins+=a.rw.coins||0; cryst+=a.rw.crystal||0;
  names.push(a.e+' '+a.n);
 }
 S.coins+=coins; if(cryst)give('crystal',cryst);
 addXp(20*ready.length); sUp();
 modal('🏅 Досягнення!','<p>'+names.join('<br>')+'</p><p class="needok">+'+fmt(coins)+'🪙'+(cryst?' + 💎×'+cryst:'')+' +'+(20*ready.length)+'⭐</p>');
 S.achLastReady=0;
 save(); refresh();
}
function showAchList(){
 let html='';
 for(const a of ACH){
  const done=achDone(a), claimed=S.ach&&S.ach[a.id];
  const [c,m]=a.p();
  html+='<div class="rowline"><span>'+a.e+' <b>'+a.n+'</b><br><span class="muted" style="font-size:11px">'+a.d+'</span></span>'+
   '<span class="'+(claimed?'needok':done?'needok':'muted')+'">'+(claimed?'✅':done?'🟡 готово':Math.min(c,m)+'/'+m)+'</span></div>';
 }
 modal('🏅 Досягнення ('+achClaimed()+'/'+ACH.length+')',html);
}
function achHTML(){
 const ready=achReady().length;
 let html='<div class="card"><h3>🏅 Досягнення <span class="badge">'+achClaimed()+'/'+ACH.length+'</span></h3>';
 html+='<div class="rowline"><button class="btn small ghost" onclick="showAchList()">Список</button>';
 if(ready)html+='<button class="btn gold small" onclick="claimAch()">Забрати нагороди ('+ready+')</button>';
 else html+='<span class="muted">нових немає</span>';
 html+='</div></div>';
 return html;
}

/* ---------- dynasty: weddings, children, inheritance ---------- */
const SPOUSE_GIFT={carpenter:{wood:5},baker:{flour:2},fisherman:{fish:3},beekeeper:{honey:2}};
const SPOUSE_PHRASES=['«Гарного дня, серденько!»','«Я приготую щось смачне!»','«Наша ферма — найкраща в долині»','«Дивись, яке небо сьогодні!»'];
const CHILD_PHRASES=['«Я сьогодні бачив жабку ось ТАКУ!»','«А коли виросту — теж буду фермером!»','«Дивись, що я знайшов!»','«Наввипередки до комори?»'];
const CREST_POOL=['🌳','🐝','🌻','🐴','⭐','🔥','💎','🌊'];
function gen(){ return (S.dynasty&&S.dynasty.gen)||1; }
function ensureFamily(){
 if(!S.family)S.family={spouse:null,marriedKey:'',child:null,childAt:0,giftKey:''};
 if(!S.dynasty)S.dynasty={gen:1,crest:['🌾']};
}
function candidateReady(k){
 return !NPCS[k].isle&&SPOUSE_GIFT[k]&&(S.quests[k]||0)>=NPCS[k].steps.length;
}
function propose(k){
 if(S.family.spouse)return;
 if(!candidateReady(k)){ sErr(); return; }
 if(invGet('ring')<1){ sErr(); toast('Потрібна 💍 обручка (Крамниця → Особливе)'); return; }
 S.inv.ring--;
 S.family.spouse=k; S.family.marriedKey=todayKey();
 addXp(50); sUp();
 const spot=bedSpot(S.world.objs)||{x:640,y:500};
 S.world.objs.push({k:'spouse',x:HOUSE_POS.x+55,y:HOUSE_POS.y+40});
 modal('💒 Весілля!','<p>Уся долина гуляє на вашому весіллі! '+NPCS[k].e+' <b>'+NPCS[k].n+'</b> тепер — твоя родина.</p><p class="needok">Щодня на тебе чекатиме родинний подарунок (вкладка «Дерево» → Родина). Кажуть, скоро в домі стане ще веселіше...</p>');
 save(); refresh();
}
function childStage(){ // 0 baby, 1 kid, 2 teen
 if(!S||!S.family||!S.family.child)return -1;
 const d=(now()-S.family.childAt)/864e5;
 return d<2?0:d<5?1:2;
}
function familyNewDay(){ // called when the real date changes
 if(S.family.spouse&&!S.family.child&&S.family.marriedKey&&S.family.marriedKey!==todayKey()){
  S.family.child={}; S.family.childAt=now();
  S.world.objs.push({k:'child',x:HOUSE_POS.x-50,y:HOUSE_POS.y+45});
  modal('👶 Поповнення!','<p>У вашій родині народилася дитина! Уся долина приходить із вітаннями, а Старійшина Ганна витирає сльози: <i>«Рід Хранителів продовжується...»</i></p>');
 }
}
function claimFamilyGift(){
 if(!S.family.spouse)return;
 if(S.family.giftKey===todayKey()){ toast('Сьогоднішній подарунок вже отримано 💝'); return; }
 S.family.giftKey=todayKey();
 const g=SPOUSE_GIFT[S.family.spouse];
 const parts=[];
 for(const k in g){ give(k,g[k]); parts.push(ITEMS[k].e+'×'+g[k]); }
 if(childStage()>=1){ const it=orderItemsPool()[0]||'wheat'; give(it,2); parts.push(ITEMS[it].e+'×2 (від малечі)'); }
 sCoin(); toast('💝 Родинний подарунок: '+parts.join(' '));
 save(); refresh();
}
function canInherit(){ return S.tree.lvl>=5&&S.family.child&&childStage()>=1; }
function inherit(){
 if(!canInherit())return;
 modal('🕊 Передати ферму у спадок?','<p>Минуть роки. Твій герой piде на заслужений спочинок, а ферму прийме наступне покоління роду.</p><p><b>Збережеться:</b> родовід і герб, щоденник дідуся, кубки, свята року, серія входів.<br><b>Почнеться заново:</b> ферма (заросте за 20 років), рівень, монети, Дерево Життя.</p><p class="needok">Вічний бонус династії: +5% до цін та досвіду за кожне покоління.</p>',[
  {t:'Передати у спадок 🕊',fn:doInherit},
  {t:'Ще не час',ghost:true},
 ]);
}
function doInherit(){
 const g=gen()+1;
 const keep={
  gen:g,
  crest:(S.dynasty.crest||['🌾']).concat(CREST_POOL[(g-2)%CREST_POOL.length]),
  diary:S.story.diary.slice(),
  calDone:S.calDone||{}, annivYear:S.annivYear||0,
  worldStart:S.worldStart, sound:S.sound,
  streak:S.daily?S.daily.streak:0, lastKey:S.daily?S.daily.lastKey:'',
  trophies:invGet('trophy'),
 };
 S=defaultState();
 S.world={objs:genWorld()};
 for(const k in NPCS)S.quests[k]=0;
 for(const k in TERRITORIES)S.terr[k]={unlocked:false,last:0};
 S.dynasty={gen:keep.gen,crest:keep.crest};
 S.worldStart=keep.worldStart; S.sound=keep.sound;
 S.calDone=keep.calDone; S.annivYear=keep.annivYear;
 S.intro=true;
 S.coins=100+250*(keep.gen-1);
 initExtras();
 S.story.diary=keep.diary;
 S.daily.streak=keep.streak; S.daily.lastKey=keep.lastKey; S.daily.loginPending=false;
 if(keep.trophies)give('trophy',keep.trophies);
 bgSeason=null; recenterCam();
 save(); refresh();
 modal('🌅 Покоління '+keep.gen,
  '<p>Минуло двадцять років...</p><p>Тепер уже <b>твій</b> лист лежить у поштовій скриньці нащадка: <i>«Ферма чекає на тебе. Дерево обере тебе, як колись обрало мене. З любов’ю — твій батько»</i>.</p>'+
  '<p>Долина знову заросла, Дерево знову дрімає. Але тепер за спиною — сила всього роду!</p>'+
  '<p class="needok">Бонус династії: +'+(5*(keep.gen-1))+'% до цін та досвіду · Герб: '+keep.crest.join('')+'</p>',
  [{t:'До праці! 🚜'}]);
}
function familyHTML(){
 ensureFamily();
 let html='<div class="card"><h3>👨‍👩‍👧 Родина <span class="badge">покоління '+gen()+'</span></h3>';
 html+='<p class="muted">Герб роду: '+(S.dynasty.crest||['🌾']).join('')+(gen()>1?' · бонус династії +'+(5*(gen()-1))+'%':'')+'</p>';

  else cands.forEach(k=>{
   html+='<div class="rowline"><span>'+NPCS[k].e+' '+NPCS[k].n+'</span><button class="btn small'+(invGet('ring')?' gold':'')+'" '+(invGet('ring')?'':'disabled')+' onclick="propose(\''+k+'\')">💍 Освідчитись</button></div>';
  });
 }else{
  const sp=NPCS[S.family.spouse];
  html+='<div class="rowline"><span>'+sp.e+' <b>'+sp.n+'</b> — твоя пара 💞</span>'+
   (S.family.giftKey===todayKey()?'<span class="muted">подарунок отримано</span>':'<button class="btn gold small" onclick="claimFamilyGift()">🎁 Подарунок</button>')+'</div>';
  const cs=childStage();
  if(cs<0)html+='<p class="muted">У домі затишно. Хтозна, може скоро стане ще веселіше...</p>';
  else html+='<div class="rowline"><span>'+['👶 Немовля спить у колисці','🧒 Малеча бігає фермою і «допомагає»','🧑 Підліток — справжня опора родини (+5% досвіду)'][cs]+'</span></div>';
  if(canInherit())html+='<div class="rowline"><span class="muted">Рід готовий до нової глави</span><button class="btn small" onclick="inherit()">🕊 Передати у спадок</button></div>';
  else html+='<p class="muted">Спадок: потрібне сяюче Дерево (рів. 5) і підросла дитина.</p>';
 }
 return html+'</div>';
}

/* ---------- tree of life ---------- */
function renderTree(){
 const el=$('tab-tree');
 const lvl=S.tree.lvl;
 let html=`<div class="secTitle">🌳 Дерево Життя</div>
  <div class="card" style="text-align:center">
   <div class="treeArt l${lvl}">${lvl===0?'🥀':lvl<3?'🌳':lvl<5?'🌳✨':'🌳🌟'}</div>
   <h3>Рівень ${lvl}/5 — «${TREE_STAGES[lvl]}»</h3>
   <p class="muted">Легенда каже: коли Дерево Життя знову засяє, долина розквітне, а за океаном з’явиться новий континент.</p>
  </div>`;
 // bonuses so far
 if(lvl>0){
  html+='<div class="card"><h3>Отримані дари дерева</h3>';
  for(let i=0;i<lvl;i++)html+='<p class="needok">✔ '+TREE_LEVELS[i].bonus+'</p>';
  html+='</div>';
 }
 if(lvl<5){
  const req=TREE_LEVELS[lvl].req;
  html+=`<div class="card"><h3>Пожертви для рівня ${lvl+1} <span class="badge">${TREE_LEVELS[lvl].bonus}</span></h3>`;
  for(const k in req){
   const don=S.tree.don[k]||0, need=req[k];
   const can=Math.min(invGet(k),need-don);
   html+=`<div class="rowline"><span>${ITEMS[k].e} ${ITEMS[k].n}: <b>${don}/${need}</b> <span class="muted">(у коморі: ${invGet(k)})</span></span>
    <button class="btn small" ${can>0?'':'disabled'} onclick="donate('${k}')">Віддати</button></div>`;
  }
  html+='</div>';
 }else{
  html+='<div class="card" style="background:#e8ffe0"><h3>🌍 Новий континент відкрито!</h3><p>Дерево Життя сяє на всю долину. Ферма стала легендою, але пригоди тривають: досліджуй нові землі на мапі, вирощуй рідкісні культури та збирай екзотичні ресурси!</p></div>';
 }
 html+=spiritsHTML();
 html+=achHTML();
 html+=familyHTML();
 html+=diaryHTML();
 el.innerHTML=html;
}
function donate(k){
 if(S.tree.lvl>=5)return;
 const req=TREE_LEVELS[S.tree.lvl].req;
 const don=S.tree.don[k]||0;
 const can=Math.min(invGet(k),(req[k]||0)-don);
 if(can<=0)return;
 S.inv[k]-=can; S.tree.don[k]=don+can; sPop();
 // level complete?
 let full=true;
 for(const r in req) if((S.tree.don[r]||0)<req[r]){ full=false; break; }
 if(full){
  S.tree.lvl++; S.tree.don={}; addXp(100); sUp();
  if(S.tree.lvl>=5){
   S.continent=true;
   modal('🌟 Дерево Життя відроджено!','<p>Величне дерево засяяло магічним світлом, і вся долина розквітла. Далеко за океаном з’явилися обриси незвіданих земель…</p><p class="needok">🌍 Відкрито Новий континент (вкладка «Долина»)!<br>+25% до всіх цін продажу назавжди.</p>');
  }else{
   modal('🌳 Дерево росте!','<p>Дерево Життя досягло рівня '+S.tree.lvl+' — «'+TREE_STAGES[S.tree.lvl]+'».</p><p class="needok">Дар дерева: '+TREE_LEVELS[S.tree.lvl-1].bonus+'</p>'+(ACT_TX[S.tree.lvl]?'<p>'+ACT_TX[S.tree.lvl]+'</p>':''));
   if(S.tree.lvl===1)awardPage(3);
   if(S.tree.lvl===2){ awardPage(8); setTimeout(krukIntro,2800); }
   if(S.tree.lvl===3)awardPage(10);
   if(S.tree.lvl===4)awardPage(11);
  }
 }
 refresh();
}

 document.getElementById('app').className='season-'+(curLoc()==='island'?'summer':s.id);
 const cb=$('calbanner');

 if(cev&&!(S.calDone&&S.calDone[calKey(cev)])){
  cb.style.display='block';
  cb.textContent=cev.e+' '+cev.n+' — справжнє свято сьогодні! Тисни';
  cb.onclick=()=>showTab('quests');
 }else cb.style.display='none';
 const fb=$('festbanner');
 if(festActive()&&!S.fest[festKey()]){
  const f=FESTIVALS[s.id];
  fb.style.display='block';
  fb.textContent=f.e+' '+f.n+' — сьогодні у селі! Тисни, щоб узяти участь';
  fb.onclick=()=>showTab('quests');
 }else fb.style.display='none';
}

function refresh(){
 renderHUD();
 if(activeTab==='farm'){ renderSeedbar(); }
 else{
  const el=$('tab-'+activeTab);
  const st=el.scrollTop;
  if(activeTab==='shop')renderShop();
  else if(activeTab==='prod')renderProd();
  else if(activeTab==='map')renderMap();
  else if(activeTab==='quests')renderQuests();
  else if(activeTab==='tree')renderTree();
  el.scrollTop=st;
 }
}

     {t:'Так, почати заново',fn:()=>{ localStorage.removeItem(SAVE_KEY); location.reload(); }},
     {t:'Ні',ghost:true},
    ]);
   }},
   {t:'Закрити',ghost:true},
  ]);
};
function showIntro(){
 modal('🏡 Farm Haven: Новий Початок',
  `<p>Після років у шумному місті ти отримуєш несподіваний лист: дідусь — легендарний фермер — залишив тобі у спадок стару ферму в долині.</p>
   <p>Мешканці села розповідають легенду про <b>Дерево Життя</b> 🌳, що колись наповнювало землю магією. Дерево згасло — і долина почала занепадати.</p>
   <p>Лише справжній фермер зможе відродити землю, допомогти мешканцям і повернути Дереву силу. <b>Ця людина — ти.</b></p>
   <p class="muted">🖐 Тягни карту пальцем, щоб оглянути долину.<br>🌿 Торкайся бур’янів, каміння й дерев, щоб розчищати землю.<br>⛏️ Торкнись вільної землі — скопаєш нову грядку, обери насіння внизу і саджай.<br>🛒 Продавай врожай, купуй тварин і будуй виробництво.<br>🧑‍🌾 Допомагай мешканцям та відроджуй Дерево Життя!</p>`,
  [{t:'Почати! 🚜'}]);
}

/* ---------- tick ---------- */
let tickCount=0;
function tick(){
 if(!S||!S.world)return;
 tickCount++;
 ensureDaily();
 storyTick();
 tickStories();
 if(S.story&&S.story.krukIntro&&!$('mback').classList.contains('on')
    &&now()-(S.story.lastKruk||0)>240000&&Math.random()<1/180)krukOffer();
 // animal happiness decay
 let hapDecay=weatherNow().id==='blizzard'?1/15:1/30;
 if(S.story&&S.story.flags&&S.story.flags.krukPoison)hapDecay*=2;
 S.animals.forEach(a=>{ a.hap=Math.max(0,a.hap-hapDecay); });
 // new day events
 const d=dayNum();
 if(d!==S.lastDay){
  const days=d-S.lastDay;
  S.lastDay=d;
  const weeds=objsW().filter(o=>o.k==='weed').length;
  for(let i=0;i<Math.min(days,5);i++){
   if(weeds+i>=28||Math.random()>=.5)continue;
   const owned=Object.keys(ZONES).filter(zoneOwned);
   const z=ZONES[owned[ri(owned.length)]];
   for(let tries=0;tries<15;tries++){
    const x=z.x+30+Math.random()*(z.w-60), y=z.y+40+Math.random()*(z.h-70);
    if(!posFree(objsW(),x,y,40)||inRect(x,y,PADDOCK)||inPond(x,y))continue;
    objsW().push({k:'weed',x:Math.round(x),y:Math.round(y)});
    break;
   }
  }
 }
 if(tickCount%10===0){
  save();
  const r=achReady().length;
  if(r>(S.achLastReady||0)){ sUp(); toast('🏅 Нове досягнення! Забери нагороду у вкладці «Дерево»'); }
  S.achLastReady=r;
 }
 refresh();
}
