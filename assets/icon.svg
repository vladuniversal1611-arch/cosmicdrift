<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="0.55" stop-color="#e9f7ff"/>
      <stop offset="1" stop-color="#fff6e6"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffe089"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c8e6ff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- floating sparkles -->
  <circle cx="110" cy="120" r="10" fill="#7df0c9" opacity="0.6"/>
  <circle cx="410" cy="150" r="14" fill="#a879ff" opacity="0.5"/>
  <circle cx="380" cy="380" r="9" fill="#38e0b0" opacity="0.6"/>
  <!-- flask -->
  <path d="M210 120 h92 v70 l70 150 a90 90 0 0 1 -232 0 l70 -150 z"
        fill="url(#glass)" stroke="#ffffff" stroke-width="10"/>
  <rect x="200" y="104" width="112" height="26" rx="13" fill="#ffffff" opacity="0.9"/>
  <!-- liquid -->
  <path d="M176 300 a90 90 0 0 0 160 0 z" fill="#8be86b" opacity="0.85"/>
  <!-- orb / core -->
  <circle cx="256" cy="300" r="46" fill="url(#orb)"/>
  <circle cx="240" cy="284" r="14" fill="#ffffff" opacity="0.8"/>
  <text x="256" y="316" font-size="52" text-anchor="middle" fill="#ffffff" font-family="sans-serif">✦</text>
</svg>
