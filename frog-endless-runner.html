<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

// ========== UTILS ==========
function lerp(a,b,t){return a+(b-a)*t}
function sd(c,t,s,d){return c+(t-c)*(1-Math.exp(-s*d))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

// ========== CONSTANTS ==========
const ST={MENU:0,PLAY:1,OVER:2,SKINS:3};
const GAME_SPD=6.3;
const GAME_SPD_MAX=8.8;      // max base speed (plateau)
const SPD_RAMP_START=30;      // score when speed starts increasing
const SPD_RAMP_SCALE=200;     // how gradual the ramp is (higher = slower ramp)
const FOCAL_LEN=3.5;
const VIEW_Z=3.0;
const VIEW_AHEAD=22;
// Jump physics — spacing in game units
const JUMP_UNIT=3.0;

// ========== STATE ==========
let state=ST.MENU,gt=0;
let seq=0,spd=GAME_SPD,visLane=1,lastIdx=-1;
let alive=true,falling=false,fallT=0;
let dist=0,score=0,runCoins=0;
let hs=+localStorage.getItem('fHS')||0;
let coins=+localStorage.getItem('fCoins')||0;
let newRec=false;
let shield=false,magnet=false,magnetT=0,boost=false,boostT=0;
let shFlash=0,pfFlash=0,shake=0,shX=0,shY=0,goT=0;
let pads=[],padPositions=[];
let pts=[],floats=[],clouds=[],bflies=[];
let spdLines=[];
let currentPattern=null,patternIdx=0;
let lastBouncePhase=0; // for jump sound trigger
let perfectCombo=0,perfectShow=0,perfectText='';
// Fever mode
let fever=false,feverT=0,feverFlash=0,feverBreakT=0,feverPts=[];
// Milestones
const MILESTONES=[
  {dist:50, text:'РОЗГІН!',emoji:'🚀',color:'#4FC3F7',coins:5},
  {dist:100,text:'СОТНЯ!',emoji:'💯',color:'#66BB6A',coins:10},
  {dist:250,text:'НЕЙМОВІРНО!',emoji:'⭐',color:'#FFD54F',coins:15},
  {dist:500,text:'НАПІВТИСЯЧА!',emoji:'🔥',color:'#FF9800',coins:25},
  {dist:1000,text:'ТИСЯЧА!',emoji:'🏆',color:'#FFD700',coins:50},
  {dist:2000,text:'ЛЕГЕНДА!',emoji:'👑',color:'#E040FB',coins:100},
  {dist:3000,text:'БОГ СТРИБКІВ!',emoji:'⚡',color:'#FF1744',coins:200},
];
let msShow=0,msText='',msEmoji='',msColor='',msCoins=0,lastMilestone=0;
// Close call
let closeCallShow=0;
// Revive
let reviveUsed=false,reviveShow=0;
// Lucky platform roulette
let luckyActive=false,luckyT=0,luckyResult='',luckyShow=0;
// Turbo zone
let turbo=false,turboT=0,turboShow=0,lastTurboDist=0,turboLines=[];
const TURBO_DURATION=3.5,TURBO_SPEED_MULT=1.45,TURBO_INTERVAL=120; // every ~120 dist units (~500m+)
// Meteor shower
let meteorActive=false,meteorT=0,lastMeteorDist=0,meteors=[];
const METEOR_DURATION=4,METEOR_INTERVAL=150;
// Chaser (shadow wall)
let chaserZ=0,chaserActive=false,chaserWarnShow=0;
// Diamond path
let diamondPath=false,diamondT=0,diamondCount=0,diamondTotal=0,lastDiamondDist=0;
// Challenge platform
const CHALLENGES=[
  {id:'perfects',text:'3 PERFECT підряд!',emoji:'🎯',need:3,reward:15,rewardCoins:8},
  {id:'noMoving',text:'Уникай рухомих!',emoji:'🚫',need:5,reward:12,rewardCoins:6},
  {id:'speedLand',text:'5 стрибків за 6с!',emoji:'⏱️',need:5,reward:20,rewardCoins:10},
];
let challenge=null,challengeT=0,challengeProgress=0,challengeShow=0,lastChallengeDist=0;
// Dash (dodge/skip mechanic)
let dashReady=true,dashCooldown=0,dashActive=false,dashT=0,dashShow=0;
const DASH_COOLDOWN=5,DASH_DURATION=.3;
// Platform generation state
let sectionType='easy', sectionLen=0, sectionPos=0;
let lastTypes=[], lastZones=[], lastPatternId=-1;

// ========== PARALLAX SIDE OBJECTS (object pooling, 4 layers) ==========
const SIDE_LAYERS=[
  {speed:.15,count:14,minZ:.05,maxZ:.4,types:['mountain_tree','dead_tree']},
  {speed:.3,count:16,minZ:.15,maxZ:.55,types:['bush','reeds','rock','mushroom']},
  {speed:.55,count:12,minZ:.25,maxZ:.7,types:['swamp_tree','lantern','tall_reeds']},
  {speed:.85,count:10,minZ:.45,maxZ:.9,types:['close_bush','firefly_cluster','lily_cluster','grass_tuft']}
];
let sideObjects=[];
function initSideObjects(){
  sideObjects=[];
  for(let li=0;li<SIDE_LAYERS.length;li++){
    const layer=SIDE_LAYERS[li];
    for(let i=0;i<layer.count;i++){
      sideObjects.push(createSideObj(li,rand(0,1)));
    }
  }
}
function createSideObj(layerIdx,progress){
  const layer=SIDE_LAYERS[layerIdx];
  const type=layer.types[Math.floor(Math.random()*layer.types.length)];
  const side=Math.random()<.5?-1:1;
  return{
    layer:layerIdx,type,side,
    z:lerp(layer.minZ,layer.maxZ,progress),
    xOff:rand(.78,1.2),
    scale:rand(.7,1.4),
    phase:rand(0,Math.PI*2),
    active:true
  };
}
function updSideObjects(dt){
  for(const obj of sideObjects){
    const layer=SIDE_LAYERS[obj.layer];
    obj.z-=spd*dt*.08*layer.speed;
    if(obj.z<layer.minZ-.1){
      obj.z=layer.maxZ+rand(0,.1);
      obj.side=Math.random()<.5?-1:1;
      obj.xOff=rand(.78,1.2);
      obj.scale=rand(.7,1.4);
      obj.phase=rand(0,Math.PI*2);
      const types=layer.types;
      obj.type=types[Math.floor(Math.random()*types.length)];
    }
  }
}
function drawSideObj(obj){
  const screenZ=obj.z*VIEW_AHEAD;
  const p=FOCAL_LEN/(screenZ+FOCAL_LEN);
  const vanY=H*.18,baseY=H*.93;
  const y=vanY+(baseY-vanY)*p;
  const halfW=W/2;
  const x=halfW+obj.side*halfW*obj.xOff*p*1.6;
  const s=p*obj.scale;
  if(s<.03||y<H*.1||y>H*.95)return;
  const sway=Math.sin(gt*1.2+obj.phase)*2*s;
  ctx.save();ctx.translate(x+sway,y);
  switch(obj.type){
    case 'mountain_tree':case 'dead_tree':{
      const h=50*s,w=8*s;
      // Trunk
      ctx.fillStyle='rgba(139,90,43,.7)';
      ctx.fillRect(-w/2,-h,w,h);
      // Green canopy
      ctx.fillStyle=obj.layer===0?'rgba(76,175,80,.6)':'rgba(102,187,106,.7)';
      ctx.beginPath();ctx.arc(0,-h-8*s,18*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(129,199,132,.5)';
      ctx.beginPath();ctx.arc(-6*s,-h-12*s,12*s,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'bush':{
      const bsz=14*s;
      ctx.fillStyle='rgba(76,175,80,.6)';
      ctx.beginPath();ctx.ellipse(0,-bsz*.4,bsz,bsz*.7,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(129,199,132,.5)';
      ctx.beginPath();ctx.ellipse(-bsz*.4,-bsz*.2,bsz*.6,bsz*.5,0,0,Math.PI*2);ctx.fill();
      // Small flower
      ctx.fillStyle='rgba(244,143,177,.5)';
      ctx.beginPath();ctx.arc(bsz*.3,-bsz*.5,2.5*s,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'mushroom':{
      const ms=12*s;
      ctx.fillStyle='rgba(188,170,164,.7)';
      ctx.fillRect(-ms*.15,-ms*.8,ms*.3,ms*.8);
      ctx.fillStyle='rgba(239,83,80,.5)';
      ctx.beginPath();ctx.ellipse(0,-ms*.8,ms*.6,ms*.35,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.4)';
      ctx.beginPath();ctx.arc(-ms*.15,-ms*.85,ms*.1,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ms*.2,-ms*.75,ms*.08,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'reeds':case 'tall_reeds':{
      const h=obj.type==='tall_reeds'?45*s:30*s;
      const count=obj.type==='tall_reeds'?5:3;
      for(let i=0;i<count;i++){
        const rx=(-count/2+i)*4*s;
        const rsway=Math.sin(gt*1.5+obj.phase+i*.8)*3*s;
        ctx.strokeStyle=`rgba(76,175,80,${.5+obj.layer*.1})`;
        ctx.lineWidth=1.5*s;
        ctx.beginPath();ctx.moveTo(rx,0);
        ctx.quadraticCurveTo(rx+rsway,-h*.5,rx+rsway*1.5,-h);
        ctx.stroke();
      }
      break;
    }
    case 'rock':{
      const rsz=12*s;
      ctx.fillStyle='rgba(158,158,158,.5)';
      ctx.beginPath();
      ctx.moveTo(-rsz,0);ctx.lineTo(-rsz*.8,-rsz*.6);ctx.lineTo(-rsz*.2,-rsz);
      ctx.lineTo(rsz*.5,-rsz*.7);ctx.lineTo(rsz,0);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(189,189,189,.3)';
      ctx.beginPath();ctx.moveTo(-rsz*.6,-rsz*.3);ctx.lineTo(-rsz*.2,-rsz*.8);ctx.lineTo(rsz*.2,-rsz*.5);ctx.lineTo(-rsz*.1,-rsz*.2);ctx.closePath();ctx.fill();
      break;
    }
    case 'swamp_tree':{
      const h=55*s,w=6*s;
      ctx.fillStyle='rgba(121,85,72,.7)';
      ctx.fillRect(-w/2,-h,w,h);
      // Branches with leaves
      ctx.fillStyle='rgba(56,142,60,.6)';
      ctx.beginPath();ctx.ellipse(0,-h,22*s,15*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(102,187,106,.5)';
      ctx.beginPath();ctx.ellipse(8*s,-h-5*s,16*s,11*s,0,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'lantern':{
      // Flower on a stem
      const h=35*s;
      ctx.strokeStyle='rgba(76,175,80,.6)';ctx.lineWidth=2*s;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-h);ctx.stroke();
      const cols=['#F48FB1','#CE93D8','#FFB74D','#FF8A65','#81D4FA'];
      const fc=cols[Math.floor(Math.abs(Math.sin(obj.phase))*cols.length)%cols.length];
      // Petals
      for(let i=0;i<5;i++){
        const pa=Math.PI*2*i/5+gt*.3;
        ctx.fillStyle=fc;ctx.globalAlpha=.6;
        ctx.beginPath();ctx.ellipse(Math.cos(pa)*5*s,-h+Math.sin(pa)*5*s,4*s,2.5*s,pa,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(0,-h,3*s,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'close_bush':{
      const bsz=18*s;
      ctx.fillStyle='rgba(67,160,71,.55)';
      ctx.beginPath();ctx.ellipse(0,-bsz*.3,bsz,bsz*.6,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(102,187,106,.45)';
      for(let i=0;i<3;i++){
        const la=Math.PI*2*i/3+obj.phase;
        ctx.beginPath();ctx.ellipse(Math.cos(la)*bsz*.5,-bsz*.3+Math.sin(la)*bsz*.3,bsz*.3,bsz*.2,la,0,Math.PI*2);ctx.fill();
      }
      // Berries
      ctx.fillStyle='rgba(239,83,80,.5)';
      ctx.beginPath();ctx.arc(bsz*.2,-bsz*.5,2*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(-bsz*.3,-bsz*.4,1.8*s,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'grass_tuft':{
      const gs=10*s;
      for(let i=0;i<5;i++){
        const gx=(-2+i)*3*s;
        const gsway=Math.sin(gt*2+obj.phase+i)*2*s;
        ctx.strokeStyle='rgba(76,175,80,.5)';
        ctx.lineWidth=1.2*s;
        ctx.beginPath();ctx.moveTo(gx,0);
        ctx.quadraticCurveTo(gx+gsway,-gs*.6,gx+gsway*1.3,-gs);
        ctx.stroke();
      }
      break;
    }
    case 'firefly_cluster':{
      // Butterflies instead of fireflies
      for(let i=0;i<3;i++){
        const fx=Math.sin(gt*1.5+obj.phase+i*2.5)*10*s;
        const fy=Math.cos(gt*1.2+obj.phase+i*1.8)*8*s-10*s;
        const cols=['rgba(244,143,177,','rgba(206,147,216,','rgba(129,212,250,'];
        const pulse=.4+Math.sin(gt*3+i*1.7+obj.phase)*.3;
        ctx.fillStyle=cols[i%3]+pulse+')';
        const ws=3*s;
        ctx.beginPath();ctx.ellipse(fx-ws,fy,ws,ws*.5,.3,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(fx+ws,fy,ws,ws*.5,-.3,0,Math.PI*2);ctx.fill();
      }
      break;
    }
    case 'lily_cluster':{
      // Small flowers in grass
      const cols=['#F48FB1','#FFF176','#CE93D8'];
      for(let i=0;i<3;i++){
        const lx=(i-1)*8*s;
        const wave=Math.sin(gt+obj.phase+i)*1.5*s;
        ctx.fillStyle=cols[i];ctx.globalAlpha=.5;
        ctx.beginPath();ctx.arc(lx,wave-4*s,3*s,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#FFF176';
        ctx.beginPath();ctx.arc(lx,wave-4*s,1.2*s,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        // Stem
        ctx.strokeStyle='rgba(76,175,80,.4)';ctx.lineWidth=.8*s;
        ctx.beginPath();ctx.moveTo(lx,wave);ctx.lineTo(lx,wave-3*s);ctx.stroke();
      }
      break;
    }
  }
  ctx.restore();
}

// ========== ATMOSPHERE PARTICLES (pooled) ==========
const MAX_ATMO=50;
let atmoParticles=[];
function initAtmo(){
  atmoParticles=[];
  for(let i=0;i<MAX_ATMO;i++) atmoParticles.push(createAtmo());
}
function createAtmo(){
  const type=Math.random()<.4?'firefly':(Math.random()<.5?'dust':'spark');
  return{
    x:rand(0,W),y:rand(H*.15,H*.85),
    vx:rand(-.3,.3),vy:rand(-.2,-.05),
    size:type==='firefly'?rand(1.5,3):rand(.5,1.5),
    phase:rand(0,Math.PI*2),
    life:rand(.5,3),maxLife:3,
    type,active:true
  };
}
function updAtmo(dt){
  for(const p of atmoParticles){
    p.x+=p.vx*dt*20;
    p.y+=p.vy*dt*20;
    p.life-=dt;
    if(p.life<=0||p.x<-20||p.x>W+20||p.y<H*.05){
      p.x=rand(0,W);p.y=rand(H*.4,H*.85);
      p.vx=rand(-.3,.3);p.vy=rand(-.2,-.05);
      p.life=rand(1,3);p.phase=rand(0,Math.PI*2);
      p.type=Math.random()<.4?'firefly':(Math.random()<.5?'dust':'spark');
      p.size=p.type==='firefly'?rand(1.5,3):rand(.5,1.5);
    }
  }
}
function drawAtmo(){
  for(const p of atmoParticles){
    const a=clamp(p.life/1,.0,1)*.6;
    if(p.type==='firefly'){
      const pulse=.3+Math.sin(gt*4+p.phase)*.4;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3);
      g.addColorStop(0,`rgba(180,255,120,${a*pulse})`);
      g.addColorStop(1,'rgba(180,255,120,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(220,255,180,${a*pulse})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*.6,0,Math.PI*2);ctx.fill();
    } else if(p.type==='dust'){
      ctx.fillStyle=`rgba(180,220,200,${a*.3})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    } else {
      const sparkA=a*(.3+Math.sin(gt*6+p.phase)*.2);
      ctx.fillStyle=`rgba(255,220,150,${sparkA})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*.8,0,Math.PI*2);ctx.fill();
    }
  }
}

// ========== CENTER LANE GLOW ==========
function drawCenterGlow(){
  ctx.save();
  for(let z=0;z<VIEW_AHEAD;z+=.15){
    const p=project(z,1);
    const nextP=project(z+.15,1);
    const a=clamp(1-z/VIEW_AHEAD,.0,1)*.04;
    const pulse=1+Math.sin(gt*2-z*.5)*.3;
    ctx.strokeStyle=`rgba(255,255,255,${a*pulse})`;
    ctx.lineWidth=3*p.s;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nextP.x,nextP.y);ctx.stroke();
  }
  for(let i=0;i<6;i++){
    const pz=((gt*spd*.5+i*.6)%VIEW_AHEAD);
    const p=project(pz,1);
    const a=clamp(1-pz/VIEW_AHEAD,0,1)*.15;
    const pulse=.5+Math.sin(gt*5+i*2)*.5;
    ctx.fillStyle=`rgba(255,255,200,${a*pulse})`;
    ctx.beginPath();ctx.arc(p.x,p.y,2*p.s,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ========== LANDING RIPPLE / GLOW EXPLOSION ==========
let ripples=[];
function addRipple(x,y,s){
  ripples.push({x,y,s,t:0,maxT:.7});
}
function updRipples(dt){
  for(let i=ripples.length-1;i>=0;i--){
    ripples[i].t+=dt;
    if(ripples[i].t>=ripples[i].maxT) ripples.splice(i,1);
  }
}
function drawRipples(){
  for(const r of ripples){
    const prog=r.t/r.maxT;
    const a=(1-prog);

    // Central glow burst — big bright flash like Tiles Hop
    const glowR=(20+prog*60)*r.s;
    const gg=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,glowR);
    gg.addColorStop(0,`rgba(255,235,59,${a*.5})`);
    gg.addColorStop(.4,`rgba(255,193,7,${a*.25})`);
    gg.addColorStop(1,'rgba(255,152,0,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(r.x,r.y,glowR,0,Math.PI*2);ctx.fill();

    // Expanding diamond outline
    const dSize=(15+prog*45)*r.s;
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(Math.PI/4+prog*.3);
    ctx.strokeStyle=`rgba(0,229,255,${a*.6})`;
    ctx.lineWidth=2.5*r.s*(1-prog);
    ctx.shadowColor='rgba(0,229,255,.5)';ctx.shadowBlur=10*r.s;
    ctx.strokeRect(-dSize,-dSize*.4,dSize*2,dSize*.8);
    ctx.shadowBlur=0;
    ctx.restore();

    // Outer ripple ring
    const ringR=(10+prog*50)*r.s;
    ctx.strokeStyle=`rgba(180,100,255,${a*.35})`;
    ctx.lineWidth=2*r.s*(1-prog);
    ctx.beginPath();ctx.ellipse(r.x,r.y,ringR,ringR*.3,0,0,Math.PI*2);ctx.stroke();
  }
}

// Smooth difficulty curve with plateau: 0→1, never infinite
// ~0 at start, ~0.5 at dist=700, ~0.85 at dist=1500, ~0.95 at dist=3000
function getDifficulty(){
  return 1-Math.exp(-dist/1400);
}

// === 5 ZONES across the road ===
const ZONES={
  FAR_LEFT: {min:0.08, max:0.35},
  LEFT:     {min:0.30, max:0.65},
  CENTER:   {min:0.70, max:1.30},
  RIGHT:    {min:1.35, max:1.70},
  FAR_RIGHT:{min:1.65, max:1.92}
};
const ZONE_NAMES=['FAR_LEFT','LEFT','CENTER','RIGHT','FAR_RIGHT'];

function zoneToX(zoneName){
  const z=ZONES[zoneName];
  return rand(z.min, z.max);
}

// How far apart two zones are (0=same, 1=adjacent, 2=skip, etc)
function zoneDist(a,b){
  return Math.abs(ZONE_NAMES.indexOf(a)-ZONE_NAMES.indexOf(b));
}

// Pick next zone based on difficulty — harder = wider jumps allowed
function pickNextZone(prevZone, diff){
  const prevIdx=ZONE_NAMES.indexOf(prevZone);
  // Max zone jump depends on difficulty
  const maxJump=diff<0.3?2:diff<0.6?3:4;

  // Build candidates — never same zone, respect max jump
  let candidates=ZONE_NAMES.filter(z=>{
    if(z===prevZone) return false;
    const d=zoneDist(z,prevZone);
    return d>=1 && d<=maxJump;
  });

  // Anti-repetition: avoid last 3 zones
  const filtered=candidates.filter(z=>!lastZones.slice(-3).includes(z));
  if(filtered.length>=2) candidates=filtered;

  return candidates[Math.floor(Math.random()*candidates.length)]||'CENTER';
}

}

function selectPattern(diff){
  let available=PATTERNS.filter(p=>p.minDiff<=diff+0.1);
  // Check type availability
  available=available.filter(p=>{
    const unlocked=getUnlockedTypes(dist);
    return p.types.every(t=>unlocked.includes(t));
  });
  // Anti-repetition
  const noRepeat=available.filter(p=>p.id!==lastPatternId);
  if(noRepeat.length>=2) available=noRepeat;
  const chosen=available[Math.floor(Math.random()*available.length)]||PATTERNS[0];
  lastPatternId=chosen.id;
  return chosen;
}

// === BREATHING SYSTEM ===
// Cycles: easy → medium → hard → recovery
function getBreathingPhase(d){
  // Cycle every ~40 distance units
  const cycle=d%40;
  if(cycle<10) return 'easy';      // 25% easy
  if(cycle<22) return 'medium';    // 30% medium
  if(cycle<32) return 'hard';      // 25% hard
  return 'recovery';               // 20% recovery
}

function getBreathingMod(phase){
  // Returns a multiplier for difficulty
  if(phase==='easy') return 0.6;
  if(phase==='medium') return 0.85;
  if(phase==='hard') return 1.0;
  return 0.4; // recovery
}

// === SPACING ===
function getSpacing(diff, phase){
  const base=lerp(4.2, 3.2, diff); // closer at higher diff
  const mod=phase==='recovery'?1.15:phase==='easy'?1.05:phase==='hard'?0.9:1.0;
  // Add variation
  const variation=rand(-0.6, 0.8);
  return Math.max(2.5, base*mod+variation);
}

// === WIDTH ===
function getWidth(type, diff){
  if(type==='wide') return lerp(1.3, 1.15, diff);
  if(type==='small') return lerp(0.7, 0.55, diff);
  return lerp(1.05, 0.78, diff*diff);
}

// === HIT RADIUS ===
function getHitRadius(padWidth){
  return 0.38*padWidth+0.12;
}

// === REACHABILITY CHECK ===
function isReachable(prevX, prevY, nextX, nextY, hasBounce){
  const yDist=nextY-prevY;
  const xDist=Math.abs(nextX-prevX);
  // Min spacing
  if(yDist<2.2) return false;
  // Max Y distance (jump range, bounce extends it)
  const maxY=hasBounce?9.0:7.0;
  if(yDist>maxY) return false;
  // Max X distance scales with Y distance (more Y = more time to move X)
  const maxX=Math.min(yDist*0.42, 1.5);
  if(xDist>maxX) return false;
  // Safety margin 12%
  return xDist<=maxX*0.88;
}

// === MAIN GENERATOR ===
function makePad(gameX, type, diff){
  let width=getWidth(type, diff);
  let coin=Math.random()<(.15+diff*.08);
  let pu=null;
  if(Math.random()<.012&&dist>5)
    pu=['shield','magnet','boost','superjump'][Math.floor(Math.random()*4)];
  if(type==='bonus'){coin=true;if(Math.random()<.3)pu='magnet';}

  // Moving horizontal
  let moving=null;
  if(type==='moving_h'){
    const maxAmp=Math.min(gameX-0.1, 1.9-gameX, 0.55);
    const amp=rand(0.2, Math.max(0.22, maxAmp));
    moving={amp, spd:rand(0.7, 1.5), phase:rand(0,Math.PI*2), baseX:gameX};
  }

  // Trap lane: full-width, 3 sections, 1 safe
  let safeZone=0;
  if(type==='trap_lane'){
    width=2.2;
    gameX=1.0;
    coin=false;pu=null;
    // Bias safe zone toward where player likely is
    const px=arguments.length>3?gameX:1.0;
    safeZone=Math.floor(Math.random()*3); // 0=left,1=center,2=right
  }

  return{
    gameX, laneX:gameX, lane:Math.round(gameX),
    width, type, coin, pu,
    landed:false, dip:0, riskCoin:null,
    moving,
    // State for special types
    breakTimer:0, broken:false,     // breakable
    disappearTimer:0, disappeared:false, disappearAlpha:1, // disappearing
    fallSpeed:0, fallOffset:0,      // falling
    springBoost:false,              // bounce
    boostActive:false,              // boost_pad
    safeZone,                       // trap_lane: which third is safe (0/1/2)
    ringCollected:false,            // ring_pad: ring collected?
  };
}

function ensurePads(){
  const avgSpace=3.8;
  const needed=Math.floor(seq/avgSpace)+Math.ceil(VIEW_AHEAD/avgSpace)+10;

  while(pads.length<needed){
    const diff=getDifficulty();
    const phase=getBreathingPhase(dist);
    const effDiff=diff*getBreathingMod(phase);

    const prevX=pads.length>0?pads[pads.length-1].gameX:1.0;
    const prevY=padPositions.length>0?padPositions[padPositions.length-1]:0;
    const prevType=pads.length>0?pads[pads.length-1].type:'normal';
    const prevHasBounce=prevType==='bounce';

    // Use pattern or random?
    if(!currentPattern||patternIdx>=currentPattern.seq.length){
      if(Math.random()<0.7){
        currentPattern=selectPattern(effDiff);
        patternIdx=0;
      } else {
        currentPattern=null;
      }
    }

    let targetZone, targetType;

    if(currentPattern&&patternIdx<currentPattern.seq.length){
      targetZone=currentPattern.seq[patternIdx];
      targetType=currentPattern.types[patternIdx];
      // Check if type is unlocked, fallback to normal
      if(!getUnlockedTypes(dist).includes(targetType)) targetType='normal';
      patternIdx++;
    } else {
      // Random generation
      const prevZone=lastZones.length>0?lastZones[lastZones.length-1]:'CENTER';
      targetZone=pickNextZone(prevZone, effDiff);

      // Pick type based on difficulty and phase
      const unlocked=getUnlockedTypes(dist);
      // Lucky platform — rare random chance (~2.5%)
      if(unlocked.includes('lucky')&&Math.random()<0.025&&!lastTypes.slice(-5).includes('lucky')){
        targetType='lucky';
      } else if(phase==='recovery'||phase==='easy'){
        // Even in easy, allow moving_h sometimes
        if(unlocked.includes('moving_h')&&Math.random()<0.18){
          targetType='moving_h';
        } else {
          targetType=Math.random()<0.15?'wide':'normal';
        }
      } else {
        const special=unlocked.filter(t=>t!=='normal'&&t!=='wide');
        // Boosted chance for moving_h
        if(unlocked.includes('moving_h')&&Math.random()<0.25&&!lastTypes.slice(-1).includes('moving_h')){
          targetType='moving_h';
        } else if(special.length>0&&Math.random()<lerp(0.18,0.4,effDiff)){
          // Don't repeat last 2 types
          const noRepeat=special.filter(t=>!lastTypes.slice(-2).includes(t));
          const pool=noRepeat.length>0?noRepeat:special;
          targetType=pool[Math.floor(Math.random()*pool.length)];
        } else {
          targetType=Math.random()<0.08?'wide':'normal';
        }
      }
    }

    // Generate X position
    let gameX;
    if(targetType==='trap_lane'){
      gameX=1.0; // always centered, full width
    } else {
      gameX=zoneToX(targetZone);
      gameX+=rand(-0.04, 0.04); // jitter
      gameX=clamp(gameX, 0.1, 1.9);
    }

    // Generate spacing
    const spacing=getSpacing(effDiff, phase);
    const nextY=prevY+spacing;

    // === REACHABILITY CHECK ===
    // Try up to 5 candidates if not reachable
    let reachable=isReachable(prevX, prevY, gameX, nextY, prevHasBounce);
    if(!reachable){
      for(let attempt=0;attempt<5;attempt++){
        // Pull closer to prev position
        gameX=lerp(gameX, prevX, 0.3+attempt*0.12);
        gameX=clamp(gameX, 0.1, 1.9);
        reachable=isReachable(prevX, prevY, gameX, nextY, prevHasBounce);
        if(reachable) break;
      }
      // Final fallback: close to previous
      if(!reachable){
        gameX=prevX+rand(-0.4, 0.4);
        gameX=clamp(gameX, 0.1, 1.9);
      }
    }

    // After breakable/disappear/falling/trap_lane: ALWAYS follow with safe normal/wide
    if(prevType==='breakable'||prevType==='disappear'||prevType==='falling'||prevType==='trap_lane'){
      if(targetType!=='normal'&&targetType!=='wide') targetType='wide';
    }
    // Max 1 special in a row (except moving_h which is fine)
    const isSpecial=t=>!['normal','wide','small','bonus','moving_h'].includes(t);
    if(isSpecial(prevType)&&isSpecial(targetType)){
      targetType='normal';
    }

    // Create the pad
    padPositions.push(nextY);
    const pad=makePad(gameX, targetType, diff);
    pads.push(pad);

    // Track history
    lastTypes.push(targetType);
    if(lastTypes.length>10) lastTypes.shift();
    lastZones.push(targetZone);
    if(lastZones.length>10) lastZones.shift();
  }
}

// Validate first N pads for reachability (safety net)
function validatePads(n){
  n=Math.min(n,pads.length);
  for(let i=1;i<n;i++){
    // Skip paired pads at same Y
    if(padPositions[i]===padPositions[i-1]) continue;
    const prev=pads[i-1],cur=pads[i];
    const xDist=Math.abs(cur.gameX-prev.gameX);
    const yDist=padPositions[i]-padPositions[i-1];
    const maxX=Math.min(yDist*0.42, 1.5)*0.88;
    if(xDist>maxX){
      cur.gameX=prev.gameX+(cur.gameX>prev.gameX?maxX:-maxX);
      cur.gameX=clamp(cur.gameX,0.1,1.9);
      cur.laneX=cur.gameX;
      if(cur.moving) cur.moving.baseX=cur.gameX;
    }
    if(yDist<2.2) padPositions[i]=padPositions[i-1]+2.5;
  }
}

// ========== PROJECTION (true 1/z perspective) ==========
function project(relZ,l){
  const depth=Math.max(relZ,0.01);
  const p=FOCAL_LEN/(depth+FOCAL_LEN);
  const vanY=H*.18,baseY=H*.93;
  const y=vanY+(baseY-vanY)*p;
  const lw=W*.6*p;
  const x=W/2+(l-1)*lw;
  return{x,y,s:Math.max(p,.02)};
}

// ========== INPUT (DRAG / HOLD — frog follows finger) ==========
let touching=false,frogCont=1;
let tSX=0,tSY=0,tST=0;

function xToLane(sx){
  const margin=W*.06;
  const raw=(sx-margin)/(W-margin*2);
  const centered=(raw-.5)*1.5+.5; // 1:1.5 sensitivity
  return clamp(centered,0,1)*2;
}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  const t=e.touches[0];tSX=t.clientX;tSY=t.clientY;tST=Date.now();
  if(state===ST.PLAY&&alive){
    touching=true;frogCont=xToLane(t.clientX);
    // Double-tap for dash
    const now=Date.now();
    if(now-lastTapTime<300&&dashReady){doDash()}
    lastTapTime=now;
  }
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(state===ST.PLAY&&alive&&touching){
    const t=e.touches[0];
    frogCont=xToLane(t.clientX);
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];if(!t)return;
  const dx=t.clientX-tSX,dy=t.clientY-tSY;
  const d=Math.sqrt(dx*dx+dy*dy);
  const dt=Date.now()-tST;
  if(state===ST.PLAY&&alive){touching=false}
  if(d<30&&dt<300){
    if(state===ST.MENU)menuTap(t.clientX,t.clientY);
    else if(state===ST.OVER)overTap(t.clientX,t.clientY);
    else if(state===ST.SKINS)skinsTap(t.clientX,t.clientY);
    // Dash button tap (bottom-right corner)
    else if(state===ST.PLAY&&alive&&dashReady){
      const r=canvas.getBoundingClientRect();
      const tx=(t.clientX-r.left)*(W/r.width), ty2=(t.clientY-r.top)*(H/r.height);
      if(tx>W-65&&ty2>H-85) doDash();
    }
  }
},{passive:false});

let mouseDown=false;
canvas.addEventListener('mousedown',e=>{
  initAudio();tSX=e.clientX;tSY=e.clientY;tST=Date.now();mouseDown=true;
  if(state===ST.PLAY&&alive){touching=true;frogCont=xToLane(e.clientX)}
});
canvas.addEventListener('mousemove',e=>{
  if(mouseDown&&state===ST.PLAY&&alive&&touching){frogCont=xToLane(e.clientX)}
});
canvas.addEventListener('mouseup',e=>{
  mouseDown=false;
  if(state===ST.PLAY&&alive){touching=false}
  const d=Math.sqrt((e.clientX-tSX)**2+(e.clientY-tSY)**2);
  if(d<30&&Date.now()-tST<300){
    if(state===ST.MENU)menuTap(e.clientX,e.clientY);
    else if(state===ST.OVER)overTap(e.clientX,e.clientY);
    else if(state===ST.SKINS)skinsTap(e.clientX,e.clientY);
  }
});
document.addEventListener('keydown',e=>{
  initAudio();
  if(state===ST.PLAY){
    if(e.key==='ArrowLeft'||e.key==='a'){frogCont=clamp(frogCont-.5,0,2)}
    if(e.key==='ArrowRight'||e.key==='d'){frogCont=clamp(frogCont+.5,0,2)}
    if(e.key===' '&&dashReady){e.preventDefault();doDash()}
  }else if(state===ST.MENU&&(e.key==='Enter'))startGame();
  else if(state===ST.OVER){if(e.key==='Enter'||e.key===' ')startGame();if(e.key==='Escape')state=ST.MENU}
  else if(state===ST.SKINS&&e.key==='Escape')state=ST.MENU;
});

// ========== PARTICLES ==========
function addP(x,y,vx,vy,col,sz,life,tp='c'){pts.push({x,y,vx,vy,col,sz,life,ml:life,tp,a:1})}
function addSplash(x,y,sc){for(let i=0;i<10;i++){const a=Math.PI*2*i/10+rand(-.2,.2);const s=rand(1.5,3)*sc;addP(x,y,Math.cos(a)*s*.07,Math.sin(a)*s*.07-.05,'rgba(140,215,255,.7)',rand(1.5,3.5),rand(.25,.45))}}
function addPerfFX(x,y){for(let i=0;i<18;i++){const a=Math.PI*2*i/18;const s=rand(.04,.09);const cols=['#FFD700','#FFF176','#FFEB3B','#FF9800','#FFF','#4FC3F7'];addP(x,y,Math.cos(a)*s,Math.sin(a)*s-.02,cols[i%6],rand(2,5),rand(.35,.6),'s')}}
function addCoinFX(x,y){for(let i=0;i<6;i++){const a=Math.PI*2*i/6;addP(x,y,Math.cos(a)*.035,Math.sin(a)*.035-.015,'#FFD700',rand(1.5,3),rand(.25,.4))}}
function addLandFX(x,y,s){for(let i=0;i<10;i++){const a=Math.PI*2*i/10+rand(0,.4);addP(x,y,Math.cos(a)*.03*s,Math.sin(a)*.012*s,'rgba(100,200,255,.6)',2.8*s,.35)}}
function addJumpFX(x,y,s){for(let i=0;i<6;i++){const a=Math.PI-.3+rand(0,.6);addP(x,y+5,Math.cos(a)*.02*s,Math.sin(a)*.035*s,'rgba(150,255,200,.4)',2*s,.25)}}
function addTrail(x,y,s){addP(x+rand(-3,3),y+rand(-2,5),0,.015,'rgba(150,230,255,.25)',rand(1,2.5)*s,rand(.12,.2))}
function addFloat(t,x,y,col='#FFD700',sz=20){floats.push({t,x,y,vy:-.04,a:1,l:.8,col,sz,sc:1.4})}
function updPts(dt){
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.002*dt*60;p.life-=dt;p.a=Math.pow(Math.max(0,p.life/p.ml),.6);if(p.life<=0)pts.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy*dt*60;f.vy*=.97;f.l-=dt;f.a=Math.max(0,f.l);f.sc=lerp(f.sc,1,.06);if(f.l<=0)floats.splice(i,1)}
}

// ========== BUTTERFLIES ==========
function initBflies(){bflies=[];for(let i=0;i<6;i++)bflies.push({x:rand(W*.05,W*.95),y:rand(H*.04,H*.25),vx:rand(-.3,.3),vy:rand(-.12,.12),ph:rand(0,6),col:['#F48FB1','#CE93D8','#FFB74D','#81D4FA','#A5D6A7','#FF8A65'][i%6]})}
function updBflies(dt){for(const b of bflies){b.x+=b.vx*dt*30;b.y+=b.vy*dt*30+Math.sin(gt*2+b.ph)*.3;b.ph+=dt*5;if(b.x<-10)b.x=W+10;if(b.x>W+10)b.x=-10;if(b.y<H*.03)b.vy=Math.abs(b.vy);if(b.y>H*.3)b.vy=-Math.abs(b.vy)}}

// ========== CLOUDS ==========
function initClouds(){clouds=[];for(let i=0;i<4;i++)clouds.push({x:rand(-50,W+50),y:rand(H*.04,H*.15),sz:rand(30,60),sp:rand(.1,.25),op:rand(.04,.08)})}
function updClouds(dt){for(const c of clouds){c.x+=c.sp*dt*22;if(c.x>W+c.sz+10)c.x=-c.sz-10}}

// ========== SPEED LINES ==========
function updSpdLines(dt){
  const spdFactor=clamp(spd/5,0,1);
  const spawnRate=.04+spdFactor*.18;
  if(Math.random()<spawnRate){
    const lineLen=rand(10,22)+spdFactor*15;
    const lineSpd=rand(1.5,3)+spdFactor*2;
    spdLines.push({x:rand(0,W),y:rand(H*.3,H*.75),l:lineLen,a:rand(.04,.12)+spdFactor*.04,sp:lineSpd});
  }
  for(let i=spdLines.length-1;i>=0;i--){
    spdLines[i].y+=spdLines[i].sp*dt*60;
    spdLines[i].a-=dt*1.2;
    if(spdLines[i].a<=0||spdLines[i].y>H)spdLines.splice(i,1);
  }
}

// ========== GAME LOGIC ==========
function startGame(){
  sfxClick();state=ST.PLAY;
  seq=0;spd=GAME_SPD;visLane=1;lastIdx=-1;
  alive=true;falling=false;fallT=0;dist=0;score=0;runCoins=0;
  newRec=false;shield=false;magnet=false;magnetT=0;boost=false;boostT=0;
  shFlash=0;pfFlash=0;shake=0;shX=0;shY=0;lastBouncePhase=0;perfectCombo=0;perfectShow=0;
  fever=false;feverT=0;feverFlash=0;feverBreakT=0;feverPts=[];
  msShow=0;lastMilestone=0;closeCallShow=0;reviveUsed=false;reviveShow=0;
  luckyActive=false;luckyT=0;luckyShow=0;
  turbo=false;turboT=0;turboShow=0;lastTurboDist=0;turboLines=[];
  meteorActive=false;meteorT=0;lastMeteorDist=0;meteors=[];
  chaserZ=0;chaserActive=false;chaserWarnShow=0;
  diamondPath=false;diamondT=0;diamondCount=0;diamondTotal=0;lastDiamondDist=0;
  challenge=null;challengeT=0;challengeProgress=0;challengeShow=0;lastChallengeDist=0;
  dashReady=true;dashCooldown=0;dashActive=false;dashT=0;dashShow=0;
  sectionType='easy';sectionLen=0;sectionPos=0;
  lastTypes=[];lastZones=[];lastPatternId=-1;breathPhase=0;
  pads=[];padPositions=[];currentPattern=null;patternIdx=0;
  pts=[];floats=[];spdLines=[];ripples=[];touching=false;frogCont=1;

  // Initial platforms — first 6 center/easy, generous spacing
  let prevX=1.0;
  for(let i=0;i<6;i++){
    padPositions.push(i*4.5);
    if(i>=3) prevX=clamp(prevX+rand(-0.3,0.3), 0.5, 1.5);
    pads.push(makePad(prevX, 'normal', 0));
  }
  ensurePads();
  validatePads(100);
  initClouds();initBflies();initSideObjects();initAtmo();startMus();
}

function die(){
  if(!alive)return;
  if(shield){
    shield=false;shFlash=.5;sfxPU();
    addFloat('🛡️',W/2,H*.4,'#4FC3F7',28);
    const nextPadIdx=getCurrentPadIdx()+1;
    const np=pads[nextPadIdx];
    if(np) frogCont=np.gameX;
    return;
  }
  alive=false;falling=true;fallT=0;sfxSplash();sfxDie();stopMus();
  const ci=getCurrentPadIdx();
  const curP=padPositions[ci]||0;
  const frogRelZ=curP-seq+VIEW_Z;
  const fp=project(Math.max(frogRelZ,.1),visLane);
  addSplash(fp.x,fp.y,2.5);shake=.5;
  if(navigator.vibrate)navigator.vibrate(100);
  const fd=Math.floor(dist);
  if(fd>hs){hs=fd;localStorage.setItem('fHS',''+hs);newRec=true}
  coins+=runCoins;localStorage.setItem('fCoins',''+coins);
  goT=0;setTimeout(()=>{state=ST.OVER},800);
}

function getCurrentPadIdx(){
  for(let i=padPositions.length-1;i>=0;i--){
    if(padPositions[i]<=seq) return i;
  }
  return 0;
}

function breakFever(fx,fy){
  fever=false;feverBreakT=1;
  sfxFeverBreak();shake=.3;
  addFloat('💔 FEVER ВТРАЧЕНО!',fx,fy-60,'#FF5252',20);
  // Shatter particles — glass break effect
  for(let i=0;i<16;i++){
    const a=rand(0,Math.PI*2);
    const sp=rand(.04,.1);
    feverPts.push({x:fx+rand(-30,30),y:fy+rand(-20,20),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.03,
      life:rand(.5,1.2),maxLife:1.2,size:rand(2,5),col:['#FFD700','#FFA000','#FF6F00','#FFF'][i%4]});
  }
}

function onLand(idx){
  const pad=pads[idx];if(!pad)return;

  const padZ=padPositions[idx]-seq+VIEW_Z;
  const lp=project(padZ,pad.gameX);

  // Skip broken/disappeared/fallen pads
  if(pad.broken||pad.disappeared) return;

  pad.landed=true;pad.dip=.5;

  // === TRAP LANE — 3 sections, 2 traps, 1 safe ===
  if(pad.type==='trap_lane'){
    const frogX=visLane;
    let zone;
    if(frogX<0.67) zone=0;       // left third
    else if(frogX>1.33) zone=2;  // right third
    else zone=1;                  // center third
    if(zone!==pad.safeZone){
      // Hit trap zone!
      sfxBreak();shake=.5;
      addFloat('💀 ПАСТКА!',lp.x,lp.y-40,'#F44336',20);
      for(let i=0;i<8;i++){
        const a=rand(0,Math.PI*2);
        addP(lp.x,lp.y,Math.cos(a)*.06,Math.sin(a)*.04-.02,'#FF5252',rand(2,3),.5,'s');
      }
      die();return;
    }
    addFloat('✅ БЕЗПЕЧНО!',lp.x,lp.y-40,'#4CAF50',18);
  }

  // === BREAKABLE — starts cracking, breaks after timer ===
  if(pad.type==='breakable' && !pad.broken){
    pad.breakTimer=0.4; // 0.4s before it breaks
    sfxBreak();
    addFloat('⚠️ ТРІЩИНИ!',lp.x,lp.y-40,'#8D6E63',18);
  }

  // === DISAPPEARING — fades out after landing ===
  if(pad.type==='disappear' && !pad.disappeared){
    pad.disappearTimer=0.6; // 0.6s before fully gone
    sfxDisappear();
    addFloat('👻 ЗНИКАЄ!',lp.x,lp.y-40,'#78909C',18);
  }

  // === SLIPPERY — frog slides sideways ===
  if(pad.type==='slippery'){
    sfxSlippery();
    const slideDir=visLane>pad.gameX?1:-1;
    frogCont=clamp(frogCont+slideDir*rand(0.2,0.4), 0.1, 1.9);
    addFloat('❄️ КОВЗКО!',lp.x,lp.y-40,'#81D4FA',18);
  }

  // === BOUNCE — extra jump height ===
  if(pad.type==='bounce'){
    sfxBounce();
    pad.springBoost=true;
    pad.dip=.8;
    addFloat('🔺 СТРИБОК!',lp.x,lp.y-40,'#69F0AE',20);
    for(let i=0;i<6;i++){
      const a=rand(0,Math.PI*2);
      addP(lp.x,lp.y,Math.cos(a)*.04,-.06+Math.sin(a)*.02,'#69F0AE',rand(2,3),.4,'s');
    }
  }

  // === BOOST PAD — temporary speed boost ===
  if(pad.type==='boost_pad'){
    sfxBoost();
    boost=true;boostT=3;
    pad.boostActive=true;
    addFloat('⚡ БУСТ!',lp.x,lp.y-40,'#FFEE58',20);
    for(let i=0;i<8;i++){
      const a=rand(0,Math.PI*2);
      addP(lp.x,lp.y,Math.cos(a)*.06,Math.sin(a)*.04-.03,'#FFF176',rand(2,3),.5,'s');
    }
  }

  // === FALLING — starts falling after landing ===
  if(pad.type==='falling' && pad.fallSpeed===0){
    sfxFalling();
    pad.fallSpeed=0.01; // starts slow, accelerates
    addFloat('⬇️ ПАДАЄ!',lp.x,lp.y-40,'#EF5350',18);
  }

  // === LUCKY PLATFORM — random prize roulette ===
  if(pad.type==='lucky'){
    sfxPU();
    const prizes=['coins','shield','magnet','jackpot'];
    const weights=[40,25,20,15]; // percentage chances
    let roll=Math.random()*100, pick=0;
    for(let i=0;i<weights.length;i++){roll-=weights[i];if(roll<=0){pick=i;break}}
    const prize=prizes[pick];
    if(prize==='coins'){
      const amt=10;runCoins+=amt;
      addFloat('🎰 +'+amt+'🪙',lp.x,lp.y-50,'#FFD700',22);
    } else if(prize==='shield'){
      shield=true;
      addFloat('🎰 🛡️ ЩИТ!',lp.x,lp.y-50,'#4FC3F7',22);
    } else if(prize==='magnet'){
      magnet=true;magnetT=8;
      addFloat('🎰 🧲 МАГНІТ!',lp.x,lp.y-50,'#F44336',22);
    } else {
      const amt=20;runCoins+=amt;
      addFloat('🎰 ДЖЕКПОТ! +'+amt+'🪙',lp.x,lp.y-50,'#FFD700',24);
      for(let i=0;i<15;i++){
        const a=rand(0,Math.PI*2);
        addP(lp.x,lp.y,Math.cos(a)*.07,Math.sin(a)*.05-.02,'#FFD700',rand(2,4),.7,'s');
      }
    }
    // Rainbow sparkle burst for all prizes
    for(let i=0;i<10;i++){
      const a=rand(0,Math.PI*2);
      addP(lp.x,lp.y,Math.cos(a)*.05,Math.sin(a)*.04-.02,
        ['#FF5252','#FFD700','#4FC3F7','#69F0AE','#E040FB'][i%5],rand(2,3),.5,'s');
    }
  }

  // === BONUS — extra coins ===
  if(pad.type==='bonus'){
    runCoins+=3;
    addFloat('+3🪙',lp.x,lp.y-35,'#FFC107',20);
    sfxCoin();
    for(let i=0;i<6;i++){
      const a=rand(0,Math.PI*2);
      addP(lp.x,lp.y,Math.cos(a)*.04,Math.sin(a)*.04-.02,'#FFD54F',rand(2,3),.4,'s');
    }
  }

  // Landing precision for feedback quality
  const frogX=visLane;
  const hitR=getHitRadius(pad.width);
  const precision=1-Math.abs(frogX-pad.gameX)/hitR;
  const isPerfect=precision>0.75;

  const coinMult=fever?2:1;

  if(isPerfect){
    perfectCombo++;
    // === COMBO MULTIPLIER: consecutive perfects multiply score ===
    const comboMult=Math.min(perfectCombo,5); // x1,x2,x3,x4,x5 cap
    const feverMult=fever?2:1;
    const totalPts=2*comboMult*feverMult;
    score+=totalPts;
    sfxPerfect();pfFlash=.35;
    // Show combo text with multiplier
    if(perfectCombo>=3){
      perfectText=fever?'🔥 COMBO x'+comboMult+' 🔥':'⚡ COMBO x'+comboMult;
      // Escalating combo sound
      for(let i=0;i<Math.min(comboMult,4);i++)tone(440+i*330,.08,'sine',.06,i*.03);
    } else if(perfectCombo===2){
      perfectText=fever?'🔥 PERFECT x2 🔥':'PERFECT x2';
    } else {
      perfectText=fever?'🔥 PERFECT 🔥':'PERFECT';
    }
    perfectShow=1;
    addPerfFX(lp.x,lp.y-10);
    addRipple(lp.x,lp.y+5*lp.s,lp.s*1.8);
    // Show bonus points float for combo
    if(comboMult>=2){
      const bonusCol=['#FFD54F','#FF9800','#FF5722','#E040FB','#FFD700'][comboMult-1]||'#FFD700';
      addFloat('+'+totalPts+'✨',lp.x+30,lp.y-30,bonusCol,14+comboMult*2);
    }
    const ptCol=fever?'#FFD700':'#FFF';
    const ptCount=Math.min(8+comboMult*2,16);
    for(let i=0;i<(fever?ptCount+4:ptCount);i++){
      const a=rand(0,Math.PI*2);
      addP(lp.x,lp.y,Math.cos(a)*.05,Math.sin(a)*.05-.015,ptCol,rand(1.5,3),.5,'s');
    }
    // === FEVER ACTIVATION at 5 perfects ===
    if(perfectCombo===5&&!fever){
      fever=true;feverT=0;feverFlash=1;
      sfxFever();
      addFloat('🔥 FEVER MODE! 🔥',lp.x,lp.y-70,'#FFD700',26);
      // Explosion of gold particles
      for(let i=0;i<20;i++){
        const a=rand(0,Math.PI*2);
        addP(lp.x,lp.y-30,Math.cos(a)*.08,Math.sin(a)*.06-.02,'#FFD700',rand(2,4),.7,'s');
      }
    }
  } else if(precision>0.4){
    // GREAT — breaks fever
    if(fever){breakFever(lp.x,lp.y)}
    perfectCombo=0;
    sfxLand();score++;
    perfectText='GREAT';perfectShow=.7;
    addLandFX(lp.x,lp.y,1.5);
    addRipple(lp.x,lp.y+5*lp.s,lp.s*1.3);
  } else {
    // Normal — breaks fever
    if(fever){breakFever(lp.x,lp.y)}
    perfectCombo=0;
    sfxLand();score++;
    addLandFX(lp.x,lp.y,1.2);
    addRipple(lp.x,lp.y+5*lp.s,lp.s);
    // Close call — barely landed (edge of platform)
    if(precision<0.35&&precision>0.05){
      closeCallShow=1;
      sfxCloseCall();shake=.15;
      addFloat('😱 ФУХХ!',lp.x,lp.y-50,'#FF5252',22);
      if(navigator.vibrate)navigator.vibrate(30);
    }
  }

  if(pad.coin){pad.coin=false;runCoins+=coinMult;addCoinFX(lp.x,lp.y-12);sfxCoin();if(fever)addFloat('x2🪙',lp.x+20,lp.y-25,'#FFD700',14)}

  if(pad.pu){
    const t=pad.pu;pad.pu=null;sfxPU();
    if(t==='shield'){shield=true;addFloat('🛡️ ЩИТ!',lp.x,lp.y-40,'#4FC3F7',22)}
    else if(t==='magnet'){magnet=true;magnetT=6;addFloat('🧲 МАГНІТ!',lp.x,lp.y-40,'#F44336',22)}
    else if(t==='boost'){boost=true;boostT=4;addFloat('⚡ БУСТ!',lp.x,lp.y-40,'#FFEB3B',22)}
    else if(t==='superjump'){addFloat('🌟 СУПЕР!',lp.x,lp.y-40,'#AB47BC',22)}
  }
  // Diamond path collection
  if(pad.diamond){
    pad.diamond=false;diamondCount++;
    sfxDiamond();runCoins+=3;
    addFloat(`💎 ${diamondCount}/${diamondTotal}`,lp.x,lp.y-50,'#00BCD4',18);
    for(let i=0;i<6;i++){
      const a=rand(0,Math.PI*2);
      addP(lp.x,lp.y-10,Math.cos(a)*.04,Math.sin(a)*.04-.02,'#00BCD4',rand(2,3.5),.5,'s');
    }
  }
  // Challenge progress tracking
  if(challenge){
    if(challenge.id==='perfects'&&isPerfect) challengeProgress++;
    if(challenge.id==='perfects'&&!isPerfect) challengeProgress=0; // must be consecutive
    if(challenge.id==='noMoving'&&!pad.moving) challengeProgress++;
    if(challenge.id==='noMoving'&&pad.moving){challengeProgress=0;addFloat('❌',lp.x,lp.y-50,'#F44336',16)}
    if(challenge.id==='speedLand') challengeProgress++;
  }
}

function doDash(){
  if(!dashReady||!alive||state!==ST.PLAY) return;
  dashReady=false;dashCooldown=DASH_COOLDOWN;dashActive=true;dashT=DASH_DURATION;dashShow=1;
  sfxDash();shake=.1;
  // Skip forward by 1 platform
  const ci=getCurrentPadIdx();
  if(ci>=0&&ci+1<pads.length){
    const np=pads[ci+1];
    lastIdx=ci;
    frogCont=np.gameX;visLane=np.gameX;
    seq=np.z;
    addFloat('⚡ DASH!',W/2,H*.4,'#448AFF',20);
    // Dash trail particles
    for(let i=0;i<10;i++){
      addP(W/2+rand(-30,30),H*.5+rand(-20,20),rand(-.04,.04),rand(.01,.03),'#448AFF',rand(1.5,3),.4,'s');
    }
  }
}

function updateGame(dt){
  if(!alive){fallT+=dt*1.8;updPts(dt);updRipples(dt);return}
  gt+=dt;
  // Gradual speed ramp: starts at GAME_SPD, plateaus at GAME_SPD_MAX
  const rampProgress=score>SPD_RAMP_START?1-Math.exp(-(score-SPD_RAMP_START)/SPD_RAMP_SCALE):0;
  const baseSpd=GAME_SPD+(GAME_SPD_MAX-GAME_SPD)*rampProgress;
  spd=boost?baseSpd*1.3:turbo?baseSpd*TURBO_SPEED_MULT:baseSpd;
  if(boost){boostT-=dt;if(boostT<=0)boost=false}
  if(magnet){magnetT-=dt;if(magnetT<=0)magnet=false}
  // Fever
  if(fever) feverT+=dt;
  if(feverFlash>0) feverFlash-=dt*2;
  if(feverBreakT>0) feverBreakT-=dt*1.5;
  // Fever shatter particles
  for(let i=feverPts.length-1;i>=0;i--){
    const fp=feverPts[i];
    fp.x+=fp.vx*60*dt;fp.y+=fp.vy*60*dt;fp.vy+=.002;fp.life-=dt;
    if(fp.life<=0) feverPts.splice(i,1);
  }

  seq+=spd*dt;
  dist+=spd*dt*.5;

  // Milestone check
  if(msShow>0) msShow-=dt*.4;
  if(closeCallShow>0) closeCallShow-=dt*2;
  if(reviveShow>0) reviveShow-=dt*1.5;
  const fd=Math.floor(dist);
  for(const ms of MILESTONES){
    if(fd>=ms.dist&&lastMilestone<ms.dist){
      lastMilestone=ms.dist;
      msText=ms.text;msEmoji=ms.emoji;msColor=ms.color;msCoins=ms.coins;msShow=1;
      sfxMilestone();shake=.25;
      runCoins+=ms.coins;
      addFloat(`${ms.emoji} +${ms.coins}🪙`,W/2,H*.35,ms.color,20);
      if(navigator.vibrate)navigator.vibrate([30,50,30]);
      // Big particle burst
      for(let i=0;i<25;i++){
        const a=rand(0,Math.PI*2);
        addP(W/2,H*.28,Math.cos(a)*rand(.04,.09),Math.sin(a)*rand(.04,.08),
          ['#FFD700','#FF5252','#4FC3F7','#66BB6A','#E040FB','#FF9800'][i%6],rand(2,4),rand(.6,1.2),'s');
      }
      break;
    }
  }

  // === TURBO ZONE ===
  if(turboShow>0) turboShow-=dt*1.2;
  if(!turbo&&dist>50&&dist-lastTurboDist>TURBO_INTERVAL&&!meteorActive&&!diamondPath){
    turbo=true;turboT=TURBO_DURATION;turboShow=1;lastTurboDist=dist;
    sfxTurbo();shake=.3;
    addFloat('🌪️ ТУРБО!',W/2,H*.3,'#FF5722',28);
    if(navigator.vibrate)navigator.vibrate([20,30,20,30,20]);
    // Burst of speed particles
    for(let i=0;i<15;i++){
      addP(W/2+rand(-80,80),H*.5+rand(-40,40),rand(-.02,.02),rand(-.04,-.08),'#FF9800',rand(1.5,3),rand(.4,.8),'s');
    }
  }
  if(turbo){
    turboT-=dt;
    // Add speed lines during turbo
    if(Math.random()<.4){
      turboLines.push({x:rand(0,W),y:0,l:rand(40,100),a:1,sp:rand(8,16)});
    }
    if(turboT<=0){
      turbo=false;sfxTurboEnd();
      // Survival bonus
      const turboBonus=Math.floor(5+dist*.02);
      score+=turboBonus;runCoins+=3;
      addFloat(`✅ ТУРБО +${turboBonus}⭐ +3🪙`,W/2,H*.35,'#4CAF50',20);
      shake=.15;
    }
  }
  // Update turbo lines
  for(let i=turboLines.length-1;i>=0;i--){
    turboLines[i].y+=turboLines[i].sp*60*dt;turboLines[i].a-=dt*1.5;
    if(turboLines[i].a<=0||turboLines[i].y>H)turboLines.splice(i,1);
  }

  // === METEOR SHOWER ===
  if(!meteorActive&&dist>80&&dist-lastMeteorDist>METEOR_INTERVAL&&!turbo&&!diamondPath){
    meteorActive=true;meteorT=METEOR_DURATION;lastMeteorDist=dist;meteors=[];
    sfxMeteorWarn();shake=.2;
    addFloat('☄️ МЕТЕОРИТИ!',W/2,H*.3,'#F44336',28);
    if(navigator.vibrate)navigator.vibrate([50,30,50]);
  }
  if(meteorActive){
    meteorT-=dt;
    // Spawn meteors
    if(Math.random()<.12){
      meteors.push({x:rand(W*.1,W*.9),y:-30,vy:rand(2,5),size:rand(8,18),rot:rand(0,6.28),life:1});
    }
    if(meteorT<=0){
      meteorActive=false;
      const mBonus=Math.floor(3+dist*.015);
      score+=mBonus;runCoins+=2;
      addFloat(`✅ ВИЖИВ! +${mBonus}⭐ +2🪙`,W/2,H*.35,'#4CAF50',20);
    }
  }
  // Update meteors
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.y+=m.vy*60*dt;m.rot+=dt*3;m.life-=dt*.3;
    // Check collision with frog (approximate screen position)
    if(alive&&!shield&&padPositions.length>0){
      const ci=getCurrentPadIdx();
      if(ci>=0&&ci<padPositions.length){
        const fp=padPositions[ci];
        if(fp){
          const fx=fp.x+(visLane-pads[ci].gameX)*120*fp.s;
          const fy=fp.y-80*fp.s; // approximate frog center
          const dx=m.x-fx,dy=m.y-fy;
          if(dx*dx+dy*dy<(m.size+18)*(m.size+18)){
            sfxMeteorHit();shake=.5;
            addFloat('💥 МЕТЕОРИТ!',fx,fy-40,'#F44336',22);
            meteors.splice(i,1);
            die();continue;
          }
        }
      }
    }
    if(m.y>H+30||m.life<=0)meteors.splice(i,1);
  }

  // === CHASER (shadow wall) ===
  if(dist>100&&!chaserActive){
    chaserActive=true;chaserZ=VIEW_Z+VIEW_AHEAD+5;
    sfxChaserWarn();chaserWarnShow=1;
    addFloat('🏃 ТІКАЙ!',W/2,H*.3,'#9C27B0',26);
  }
  if(chaserActive&&alive){
    if(chaserWarnShow>0) chaserWarnShow-=dt*.8;
    // Chaser slowly catches up — moves at ~80% of current speed
    const chaserSpd=spd*.8;
    chaserZ-=chaserSpd*dt;
    // Player is at seq position — if chaser passes player's current pad, die
    if(chaserZ<seq-2){
      // Reset chaser far behind — it will catch up slowly
      chaserZ=seq+VIEW_AHEAD+8;
    }
    // Proximity warning
    const chaserDist=chaserZ-seq;
    if(chaserDist<4&&chaserDist>0){
      if(Math.random()<.1) shake=.05;
    }
  }

  // === DIAMOND PATH ===
  if(!diamondPath&&dist>60&&dist-lastDiamondDist>200&&!turbo&&!meteorActive&&Math.random()<.003){
    diamondPath=true;diamondT=0;diamondCount=0;diamondTotal=6;lastDiamondDist=dist;
    sfxDiamond();
    addFloat('💎 АЛМАЗНИЙ ШЛЯХ!',W/2,H*.3,'#00BCD4',26);
    // Mark next N platforms as diamond
    let marked=0;
    for(let i=Math.max(0,getCurrentPadIdx()+1);i<pads.length&&marked<diamondTotal;i++){
      if(!pads[i].broken){pads[i].diamond=true;marked++}
    }
  }
  if(diamondPath){
    diamondT+=dt;
    if(diamondT>12||diamondCount>=diamondTotal){
      diamondPath=false;
      if(diamondCount>=diamondTotal){
        const dBonus=diamondCount*5;
        score+=dBonus;runCoins+=diamondCount*3;
        addFloat(`💎 ВСІ ЗІБРАНІ! +${dBonus}⭐ +${diamondCount*3}🪙`,W/2,H*.35,'#00BCD4',22);
        sfxMilestone();shake=.2;
      }
    }
  }

  // === CHALLENGE SYSTEM ===
  if(challengeShow>0) challengeShow-=dt*.8;
  if(!challenge&&dist>70&&dist-lastChallengeDist>180&&!turbo&&!meteorActive&&Math.random()<.004){
    challenge=CHALLENGES[Math.floor(Math.random()*CHALLENGES.length)];
    challengeT=challenge.id==='speedLand'?6:0;
    challengeProgress=0;lastChallengeDist=dist;challengeShow=1;
    sfxChallenge();shake=.15;
    addFloat(`${challenge.emoji} ЧЕЛЛЕНДЖ!`,W/2,H*.28,'#FF9800',26);
    if(navigator.vibrate)navigator.vibrate([20,40,20]);
  }
  if(challenge){
    if(challenge.id==='speedLand') challengeT-=dt;
    // Timeout: 10s for perfects/noMoving, timer-based for speedLand
    if(challenge.id!=='speedLand') challengeT+=dt;
    if((challenge.id==='speedLand'&&challengeT<=0)||(challenge.id!=='speedLand'&&challengeT>10)){
      // Failed
      addFloat('❌ ПРОВАЛ!',W/2,H*.35,'#F44336',22);
      challenge=null;
    } else if(challengeProgress>=challenge.need){
      // Won!
      sfxChallengeWin();shake=.25;
      score+=challenge.reward;runCoins+=challenge.rewardCoins;
      addFloat(`🏆 +${challenge.reward}⭐ +${challenge.rewardCoins}🪙`,W/2,H*.35,'#FFD700',24);
      if(navigator.vibrate)navigator.vibrate([30,50,30,50,30]);
      for(let i=0;i<20;i++){
        const a=rand(0,Math.PI*2);
        addP(W/2,H*.3,Math.cos(a)*.07,Math.sin(a)*.06-.02,'#FFD700',rand(2,4),rand(.5,1),'s');
      }
      challenge=null;
    }
  }

  // === DASH COOLDOWN ===
  if(!dashReady){
    dashCooldown-=dt;
    if(dashCooldown<=0){dashReady=true;dashShow=.5}
  }
  if(dashActive){
    dashT-=dt;
    if(dashT<=0){dashActive=false}
  }
  if(dashShow>0) dashShow-=dt*1.5;

  // Update moving platforms — horizontal oscillation
  for(const p of pads){
    if(p.moving){
      p.gameX=clamp(p.moving.baseX+Math.sin(gt*p.moving.spd+p.moving.phase)*p.moving.amp, 0.08, 1.92);
    }
    // Breakable countdown — platform breaks after timer expires
    if(p.type==='breakable' && p.breakTimer>0 && !p.broken){
      p.breakTimer-=dt;
      p.dip=rand(-.15,.15); // shake as it cracks
      if(p.breakTimer<=0){
        p.broken=true;
        p.dip=0;
        const ci=getCurrentPadIdx();
        if(pads[ci]===p){
          sfxBreak();shake=.4;
          die();
        }
      }
    }
    // Disappearing — fade out after landing
    if(p.type==='disappear' && p.disappearTimer>0 && !p.disappeared){
      p.disappearTimer-=dt;
      p.disappearAlpha=clamp(p.disappearTimer/0.6, 0, 1);
      if(p.disappearTimer<=0){
        p.disappeared=true;
        p.disappearAlpha=0;
        const ci=getCurrentPadIdx();
        if(pads[ci]===p){
          die();
        }
      }
    }
    // Falling — accelerates downward after landing
    if(p.type==='falling' && p.fallSpeed>0){
      p.fallSpeed+=dt*4; // accelerate
      p.fallOffset+=p.fallSpeed*dt*60;
      if(p.fallOffset>5){ // fallen far enough = gone
        const ci=getCurrentPadIdx();
        if(pads[ci]===p){
          die();
        }
      }
    }
  }

  // Landing checks — continuous X matching
  // Handles paired pads at same Y (trap + safe alternative)
  const curPadIdx=getCurrentPadIdx();
  while(lastIdx<curPadIdx){
    lastIdx++;
    if(lastIdx>=0&&lastIdx<pads.length){
      // Collect all pads at this same Y position
      const thisY=padPositions[lastIdx];
      const group=[lastIdx];
      while(lastIdx+1<pads.length && lastIdx+1<=curPadIdx &&
            padPositions[lastIdx+1]===thisY){
        lastIdx++;
        group.push(lastIdx);
      }

      // Check if frog hits ANY pad in this group
      const frogX=visLane;
      let landed=false;
      for(const gi of group){
        const pad=pads[gi];
        if(pad.broken||pad.disappeared||(pad.fallOffset&&pad.fallOffset>3)) continue; // skip gone pads
        const hitR=getHitRadius(pad.width);
        if(Math.abs(frogX-pad.gameX)<=hitR){
          onLand(gi);
          landed=true;
          break;
        }
      }
      if(!landed){
        // Near miss check on any pad in group
        let nearMiss=false;
        for(const gi of group){
          const pad=pads[gi];
          if(pad.broken||pad.disappeared||(pad.fallOffset&&pad.fallOffset>3)) continue;
          const hitR=getHitRadius(pad.width);
          if(Math.abs(frogX-pad.gameX)<=hitR+0.15){nearMiss=true;break}
        }
        if(nearMiss) sfxNearMiss();
        die();break;
      }
    }
  }

  // Smooth frog horizontal movement
  visLane=sd(visLane,frogCont,18,dt);

  // Jump sound trigger — detect start of new bounce
  const ci=getCurrentPadIdx();
  if(ci>=0&&ci<padPositions.length){
    const nextI=Math.min(ci+1,padPositions.length-1);
    const curPos=padPositions[ci]||0;
    const nextPos=padPositions[nextI]||curPos+1;
    const gap=nextPos-curPos;
    const bounce=gap>0?clamp((seq-curPos)/gap,0,1):0;
    // Trigger jump sound when bounce crosses 0.08 (just taking off)
    if(bounce>0.06&&bounce<0.15&&lastBouncePhase<0.06){
      sfxJump();
      // Jump particles
      const fp=project(VIEW_Z,visLane);
      addJumpFX(fp.x,fp.y,fp.s*1.5);
    }
    // Ring collection — collect when near peak of arc
    const curPadRing=pads[ci];
    if(curPadRing&&curPadRing.type==='ring_pad'&&!curPadRing.ringCollected&&bounce>0.38&&bounce<0.62&&lastBouncePhase<=0.38){
      curPadRing.ringCollected=true;
      runCoins+=5;
      sfxPerfect();score+=3;
      const fp3=project(VIEW_Z,visLane);
      addFloat('🔗 +5🪙',fp3.x,fp3.y-60,'#FFD700',22);
      for(let i=0;i<10;i++){
        const a=rand(0,Math.PI*2);
        addP(fp3.x,fp3.y-40,Math.cos(a)*.06,Math.sin(a)*.04-.03,'#FFD700',rand(2,3),.5,'s');
      }
    }
    lastBouncePhase=bounce;
  }

  if(shFlash>0)shFlash-=dt*2.5;
  if(pfFlash>0)pfFlash=sd(pfFlash,0,6,dt);
  if(perfectShow>0)perfectShow=sd(perfectShow,0,3,dt);
  for(const p of pads)if(p.dip>0)p.dip=sd(p.dip,0,10,dt);
  if(shake>0){shake=sd(shake,0,7,dt);shX=Math.sin(gt*45)*shake*6;shY=Math.cos(gt*51)*shake*5}else{shX=shY=0}

  // Magnet
  if(magnet){
    const ci2=getCurrentPadIdx();
    for(let i=ci2;i<ci2+6&&i<pads.length;i++){
      if(pads[i].coin&&Math.abs(pads[i].gameX-visLane)<=1.2){
        pads[i].coin=false;runCoins++;
        const pz=padPositions[i]-seq+VIEW_Z;
        const pp=project(pz,pads[i].gameX);
        addCoinFX(pp.x,pp.y);sfxCoin();
      }
    }
  }

  ensurePads();
  const minI=getCurrentPadIdx()-3;
  if(minI>12){
    const rm=minI-6;
    pads.splice(0,rm);padPositions.splice(0,rm);lastIdx-=rm;
  }

  updPts(dt);updClouds(dt);updBflies(dt);updSpdLines(dt);
  updSideObjects(dt);updAtmo(dt);updRipples(dt);
}

// ========== DRAWING ==========
function drawBg(){
  // Bright sky gradient — light blue to white near horizon
  const sg=ctx.createLinearGradient(0,0,0,H*.35);
  sg.addColorStop(0,'#4FC3F7');sg.addColorStop(.4,'#81D4FA');sg.addColorStop(.7,'#B3E5FC');sg.addColorStop(1,'#E1F5FE');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*.35);

  // Bright sun with soft glow
  const sunX=W*.75,sunY=H*.1,sunR=W*.12;
  const sung=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*2);
  sung.addColorStop(0,'rgba(255,255,220,.9)');sung.addColorStop(.2,'rgba(255,245,157,.6)');sung.addColorStop(.5,'rgba(255,235,59,.15)');sung.addColorStop(1,'rgba(255,235,59,0)');
  ctx.fillStyle=sung;ctx.beginPath();ctx.arc(sunX,sunY,sunR*2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,240,.95)';ctx.beginPath();ctx.arc(sunX,sunY,sunR*.6,0,Math.PI*2);ctx.fill();

  // Fluffy clouds
  for(const c of clouds){
    ctx.fillStyle=`rgba(255,255,255,${c.op*3})`;
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.sz,c.sz*.45,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x-c.sz*.5,c.y+c.sz*.1,c.sz*.6,c.sz*.35,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x+c.sz*.45,c.y+c.sz*.08,c.sz*.55,c.sz*.3,0,0,Math.PI*2);ctx.fill();
  }

  // Rolling hills — green
  const mx=Math.sin(gt*.1)*3;
  // Far hills (lighter green)
  ctx.fillStyle='#81C784';ctx.beginPath();ctx.moveTo(0,H*.29);
  ctx.quadraticCurveTo(W*.15+mx,H*.21,W*.3+mx*.5,H*.26);
  ctx.quadraticCurveTo(W*.45+mx,H*.18,W*.6+mx*.7,H*.24);
  ctx.quadraticCurveTo(W*.75+mx,H*.2,W*.9+mx*.5,H*.25);
  ctx.lineTo(W,H*.27);ctx.lineTo(W,H*.30);ctx.lineTo(0,H*.30);ctx.closePath();ctx.fill();
  // Near hills (deeper green)
  ctx.fillStyle='#66BB6A';ctx.beginPath();ctx.moveTo(0,H*.30);
  ctx.quadraticCurveTo(W*.2,H*.26,W*.35,H*.28);
  ctx.quadraticCurveTo(W*.5,H*.25,W*.7,H*.28);
  ctx.quadraticCurveTo(W*.85,H*.26,W,H*.29);
  ctx.lineTo(W,H*.31);ctx.lineTo(0,H*.31);ctx.closePath();ctx.fill();

  // Cute trees on hills
  function drawTree(px,py,sc){
    ctx.save();ctx.translate(px,py);ctx.scale(sc,sc);
    // Trunk
    ctx.fillStyle='#8D6E63';
    ctx.fillRect(-3,-50,6,50);
    // Round canopy
    ctx.fillStyle='#4CAF50';
    ctx.beginPath();ctx.arc(0,-55,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#66BB6A';
    ctx.beginPath();ctx.arc(-6,-60,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#81C784';
    ctx.beginPath();ctx.arc(5,-50,12,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  drawTree(W*.1,H*.29,.5);
  drawTree(W*.9,H*.28,.6);
  drawTree(W*.04,H*.30,.35);
  drawTree(W*.96,H*.29,.4);

  // Butterflies / floating sparkles
  for(const b of bflies){
    const pulse=.5+Math.sin(b.ph)*.3;
    ctx.globalAlpha=pulse;
    ctx.fillStyle=b.col;
    // Butterfly wings
    const ws=4+Math.sin(b.ph*2)*2;
    ctx.beginPath();ctx.ellipse(b.x-ws,b.y,ws,ws*.6,.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(b.x+ws,b.y,ws,ws*.6,-.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(b.x,b.y,1,3,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawWater(){
  const wt=H*.29;
  // Green meadow ground
  const wg=ctx.createLinearGradient(0,wt,0,H);
  wg.addColorStop(0,'#4CAF50');wg.addColorStop(.3,'#43A047');wg.addColorStop(.6,'#388E3C');wg.addColorStop(1,'#2E7D32');
  ctx.fillStyle=wg;ctx.fillRect(0,wt,W,H-wt);

  // Subtle grass texture lines
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  const woff=gt*spd*10;
  for(let r=0;r<10;r++){
    const wy=wt+15+r*(H-wt)/10;
    ctx.beginPath();
    for(let x=0;x<=W;x+=8){
      const w=Math.sin(x*.02+woff+r*.7)*1.5;
      if(x===0)ctx.moveTo(x,wy+w);else ctx.lineTo(x,wy+w);
    }
    ctx.stroke();
  }

  // Dandelion puffs / light particles
  for(let i=0;i<8;i++){
    const sparkX=((i*137.5+gt*15+woff*.3)%(W+40))-20;
    const sparkY=wt+40+((i*73.1+Math.sin(gt*1.2+i)*12)%(H-wt-40));
    const ss=.8+Math.sin(gt*3+i*2.3)*.6;
    if(ss>.9){ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(sparkX,sparkY,ss,0,Math.PI*2);ctx.fill()}
  }
  // Speed lines (light)
  for(const sl of spdLines){
    ctx.strokeStyle=`rgba(255,255,255,${sl.a*.3})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sl.x,sl.y);ctx.lineTo(sl.x,sl.y+sl.l);ctx.stroke();
  }
}

function drawPad(x,y,s,type,dip,isCurrent,width){
  width=width||1;
  ctx.save();ctx.translate(x,y);
  const hw=120*s*width;
  const hh=55*s*width;
  const thick=28*s*width;
  const dO=dip*8*s;
  const rad=16*s*Math.min(width,1);

  let c1,c2,c3,glow;
  const pt=PAD_TYPES[type];
  if(pt){c1=pt.color[0];c2=pt.color[1];c3=pt.color[2];glow=pt.glow}
  else if(type==='flower'){c1='#E040FB';c2='#CE93D8';c3='#7B1FA2';glow='rgba(224,64,251,'}
  else{c1='#4DD0E1';c2='#00ACC1';c3='#006064';glow='rgba(0,229,255,'}

  // Shadow under platform
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath();ctx.ellipse(0,thick+dO+4*s,hw*.9,hh*.25,0,0,Math.PI*2);ctx.fill();

  // Neon glow — strong like Tiles Hop
  ctx.shadowColor=glow+'.6)';ctx.shadowBlur=35*s;

  // FRONT FACE (3D thickness)
  const fg=ctx.createLinearGradient(0,dO,0,thick+dO);
  fg.addColorStop(0,c3);fg.addColorStop(.5,darken(c3,25));fg.addColorStop(1,darken(c3,50));
  ctx.fillStyle=fg;
  rr(-hw,dO,hw*2,thick,rad*.4);ctx.fill();
  ctx.shadowBlur=0;

  // TOP FACE (flat rectangle)
  const tg=ctx.createLinearGradient(0,-hh*2+dO,0,dO);
  tg.addColorStop(0,lighten(c1,15));tg.addColorStop(.3,c1);tg.addColorStop(.6,c2);tg.addColorStop(1,c3);
  ctx.fillStyle=tg;
  rr(-hw,-hh*2+dO,hw*2,hh*2,rad);ctx.fill();

  // Neon border
  ctx.shadowColor=glow+'.6)';ctx.shadowBlur=15*s;
  ctx.strokeStyle=glow+'.8)';ctx.lineWidth=3*s;
  rr(-hw,-hh*2+dO,hw*2,hh*2,rad);ctx.stroke();
  ctx.shadowBlur=0;

  // Inner border
  const ins=6*s;
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.5*s;
  rr(-hw+ins,-hh*2+ins+dO,hw*2-ins*2,hh*2-ins*2,rad*.7);ctx.stroke();

  // Center glow
  const cy=-hh+dO;
  const cg=ctx.createRadialGradient(0,cy,0,0,cy,hw*.45);
  cg.addColorStop(0,'rgba(255,255,255,.1)');
  cg.addColorStop(1,'rgba(200,255,220,0)');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.ellipse(0,cy,hw*.45,hh*.5,0,0,Math.PI*2);ctx.fill();

  // Diamond icon
  const ds=14*s*Math.min(width,1);
  ctx.save();ctx.translate(0,cy);ctx.rotate(Math.PI/4);
  ctx.fillStyle='rgba(255,255,255,.28)';
  ctx.fillRect(-ds,-ds,ds*2,ds*2);
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1.5*s;
  ctx.strokeRect(-ds*.55,-ds*.55,ds*1.1,ds*1.1);
  ctx.restore();

  // Type-specific decorations
  if(type==='breakable'){
    // Crack lines across surface
    ctx.strokeStyle='rgba(80,40,20,.6)';ctx.lineWidth=2*s;
    ctx.beginPath();
    ctx.moveTo(-hw*.6,cy-hh*.3);ctx.lineTo(-hw*.1,cy+hh*.1);ctx.lineTo(hw*.3,cy-hh*.2);ctx.lineTo(hw*.7,cy+hh*.15);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-hw*.3,cy+hh*.3);ctx.lineTo(hw*.1,cy-hh*.1);ctx.lineTo(hw*.5,cy+hh*.2);
    ctx.stroke();
    // Warning icon
    ctx.fillStyle='rgba(255,200,150,.5)';ctx.font=`${14*s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⚠',0,cy);
  }
  if(type==='disappear'){
    // Ghostly shimmer
    ctx.fillStyle='rgba(200,220,230,.08)';
    rr(-hw,-hh*2+dO,hw*2,hh*2,rad);ctx.fill();
    // Dotted outline
    ctx.setLineDash([4*s,4*s]);
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5*s;
    rr(-hw,-hh*2+dO,hw*2,hh*2,rad);ctx.stroke();
    ctx.setLineDash([]);
    // Ghost icon
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.font=`${14*s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('👻',0,cy);
  }
  if(type==='slippery'){
    // Sparkle crystals
    ctx.fillStyle='rgba(255,255,255,.4)';
    for(let i=0;i<4;i++){
      const cx2=-hw*.5+hw*i*.35;
      const cy2=cy+Math.sin(gt*2+i*1.5)*hh*.15;
      const cr=4*s;
      ctx.save();ctx.translate(cx2,cy2);ctx.rotate(Math.PI/4+gt*.5);
      ctx.fillRect(-cr,-cr*.3,cr*2,cr*.6);
      ctx.fillRect(-cr*.3,-cr,cr*.6,cr*2);
      ctx.restore();
    }
    // Frost overlay
    ctx.fillStyle='rgba(200,240,255,.12)';
    rr(-hw,-hh*2+dO,hw*2,hh*2,rad);ctx.fill();
  }
  if(type==='bounce'){
    // Spring coil icon
    ctx.strokeStyle='rgba(0,200,100,.7)';ctx.lineWidth=2.5*s;
    ctx.beginPath();
    for(let i=0;i<4;i++){
      const y1=cy-hh*.3+hh*.15*i;
      const y2=y1+hh*.08;
      ctx.moveTo(-hw*.25,y1);ctx.quadraticCurveTo(hw*.25,y1-hh*.1,hw*.25,y2);
      ctx.moveTo(hw*.25,y2);ctx.quadraticCurveTo(-hw*.25,y2+hh*.1,-hw*.25,y2+hh*.08);
    }
    ctx.stroke();
    // Up arrow
    ctx.fillStyle='rgba(105,240,174,.6)';
    ctx.beginPath();ctx.moveTo(0,cy-hh*.6);ctx.lineTo(-10*s,cy-hh*.2);ctx.lineTo(10*s,cy-hh*.2);ctx.fill();
  }
  if(type==='boost_pad'){
    // Lightning bolt
    ctx.fillStyle='rgba(255,235,100,.6)';
    ctx.beginPath();
    ctx.moveTo(-4*s,cy-hh*.5);ctx.lineTo(4*s,cy-hh*.5);ctx.lineTo(0,cy-hh*.1);
    ctx.lineTo(6*s,cy-hh*.1);ctx.lineTo(-2*s,cy+hh*.5);ctx.lineTo(2*s,cy);
    ctx.lineTo(-6*s,cy);ctx.closePath();ctx.fill();
    // Speed lines
    ctx.strokeStyle='rgba(255,255,200,.3)';ctx.lineWidth=1.5*s;
    for(let i=0;i<3;i++){
      const lx=-hw*.6+hw*.4*i;
      ctx.beginPath();ctx.moveTo(lx,cy-hh*.3);ctx.lineTo(lx+hw*.15,cy+hh*.2);ctx.stroke();
    }
  }
  if(type==='falling'){
    // Down arrows
    ctx.fillStyle='rgba(239,83,80,.6)';
    for(let i=0;i<3;i++){
      const ax=-hw*.4+hw*.4*i;
      const ay=cy+Math.sin(gt*3+i)*hh*.1;
      ctx.beginPath();ctx.moveTo(ax,ay+hh*.3);ctx.lineTo(ax-5*s,ay-hh*.1);ctx.lineTo(ax+5*s,ay-hh*.1);ctx.fill();
    }
    // Warning color pulse
    const pulse=.1+.05*Math.sin(gt*4);
    ctx.fillStyle=`rgba(239,83,80,${pulse})`;
    rr(-hw,-hh*2+dO,hw*2,hh*2,rad);ctx.fill();
  }
  if(type==='bonus'){
    // Coin sparkles
    ctx.fillStyle='rgba(255,193,7,.5)';
    for(let i=0;i<5;i++){
      const bx2=Math.cos(gt*2+i*1.2)*hw*.5;
      const by2=cy+Math.sin(gt*2.5+i*1.5)*hh*.3;
      ctx.beginPath();ctx.arc(bx2,by2,2.5*s,0,Math.PI*2);ctx.fill();
    }
    // Star icon
    ctx.fillStyle='rgba(255,215,0,.5)';ctx.font=`${16*s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⭐',0,cy);
  }
  if(type==='small'){
    // Compact marker dots
    ctx.fillStyle='rgba(255,152,0,.4)';
    ctx.beginPath();ctx.arc(-hw*.3,cy,2*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hw*.3,cy,2*s,0,Math.PI*2);ctx.fill();
  }
  if(type==='trap_lane'){
    // Draw 3 sections with divider lines
    const sz=arguments.length>7?arguments[7]:0; // safeZone passed via extra
    const secW=hw*2/3;
    // Left divider
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2*s;
    ctx.beginPath();ctx.moveTo(-hw+secW,-hh*2+dO+ins);ctx.lineTo(-hw+secW,dO-ins);ctx.stroke();
    // Right divider
    ctx.beginPath();ctx.moveTo(-hw+secW*2,-hh*2+dO+ins);ctx.lineTo(-hw+secW*2,dO-ins);ctx.stroke();
  }
  if(type==='ring_pad'){
    // Golden star marker on platform
    ctx.fillStyle='rgba(255,215,0,.5)';ctx.font=`${16*s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🔗',0,cy);
    // Sparkle dots
    for(let i=0;i<3;i++){
      const sx=Math.cos(gt*2+i*2.1)*hw*.4;
      const sy=cy+Math.sin(gt*2.5+i*1.8)*hh*.25;
      ctx.fillStyle='rgba(255,215,0,.4)';ctx.beginPath();ctx.arc(sx,sy,2.5*s,0,Math.PI*2);ctx.fill();
    }
  }
  if(type==='lucky'){
    // Golden shimmer overlay
    const shimmer=.08+.04*Math.sin(gt*4);
    ctx.fillStyle=`rgba(255,215,0,${shimmer})`;
    rr(-hw,-hh*2+dO,hw*2,hh*2,rad);ctx.fill();
    // Slot machine icon
    ctx.fillStyle='rgba(255,215,0,.6)';ctx.font=`${18*s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🎰',0,cy);
    // Orbiting sparkles
    for(let i=0;i<5;i++){
      const a=gt*2.5+i*Math.PI*2/5;
      const ox=Math.cos(a)*hw*.55;
      const oy=cy+Math.sin(a)*hh*.35;
      const sp=2+Math.sin(gt*3+i)*1;
      ctx.fillStyle=`rgba(255,215,0,${.3+.2*Math.sin(gt*4+i)})`;
      ctx.beginPath();ctx.arc(ox,oy,sp*s,0,Math.PI*2);ctx.fill();
    }
    // Rainbow border pulse
    const hue=(gt*120)%360;
    ctx.strokeStyle=`hsla(${hue},80%,60%,.3)`;ctx.lineWidth=2*s;
    rr(-hw,-hh*2+dO,hw*2,hh*2,rad);ctx.stroke();
  }

  // Gloss
  ctx.fillStyle='rgba(255,255,255,.1)';
  ctx.beginPath();ctx.ellipse(0,-hh*1.5+dO,hw*.65,hh*.22,0,0,Math.PI*2);ctx.fill();

  // Flower
  if(type==='flower'){
    const fc=['#F48FB1','#CE93D8','#FFB74D','#FFF176'][Math.floor(gt*.6)%4];
    for(let i=0;i<5;i++){const a=Math.PI*2*i/5+gt*.5;
      ctx.fillStyle=fc;ctx.beginPath();
      ctx.ellipse(hw*.3+Math.cos(a)*4*s,cy+Math.sin(a)*4*s,5*s,3*s,a,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(hw*.3,cy,3*s,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

function getSkinCol(){const sk=SKINS[curSkin];return sk.c==='rainbow'?`hsl(${(gt*60)%360},70%,55%)`:sk.c}
function lighten(h,a){if(h.startsWith('hsl'))return h;const n=parseInt(h.replace('#',''),16);return`rgb(${Math.min(255,((n>>16)&255)+a)},${Math.min(255,((n>>8)&255)+a)},${Math.min(255,(n&255)+a)})`}
function darken(h,a){if(h.startsWith('hsl'))return h;const n=parseInt(h.replace('#',''),16);return`rgb(${Math.max(0,((n>>16)&255)-a)},${Math.max(0,((n>>8)&255)-a)},${Math.max(0,(n&255)-a)})`}

function drawFrog(x,y,sc,rot,sqX,sqY,inAir,height){
  ctx.save();ctx.translate(x,y-height*180*sc);ctx.rotate(rot);ctx.scale(sc*sqX,sc*sqY);
  const sk=SKINS[curSkin],bc=getSkinCol(),s=28;
  const antCol=sk.ant||'#69F0AE';

  // Shield aura
  if(shield){ctx.strokeStyle='rgba(255,193,7,.5)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-s*.2,s*2,0,Math.PI*2);ctx.stroke()}

  // Shadow
  const shA=clamp(.15-height*.08,0,.15);
  ctx.fillStyle=`rgba(0,0,0,${shA})`;ctx.beginPath();ctx.ellipse(0,s*.7+height*35,s*(1-height*.2),s*.2,0,0,Math.PI*2);ctx.fill();

  // === FEET ===
  ctx.fillStyle=darken(bc,30);
  if(inAir){
    // Feet tucked up in air
    ctx.beginPath();ctx.ellipse(-s*.35,s*.65,s*.22,s*.1,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*.35,s*.65,s*.22,s*.1,0,0,Math.PI*2);ctx.fill();
  } else {
    // Feet planted
    ctx.beginPath();ctx.ellipse(-s*.4,s*.7,s*.28,s*.12,.1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*.4,s*.7,s*.28,s*.12,-.1,0,Math.PI*2);ctx.fill();
  }

  // === BODY — pill/capsule shape (rounded rect) ===
  const bw=s*.85,bh=s*1.35,by=-s*.35;
  const bg=ctx.createRadialGradient(-3,by,0,0,by+bh*.3,s*1.3);
  bg.addColorStop(0,lighten(bc,30));bg.addColorStop(.5,bc);bg.addColorStop(1,darken(bc,20));
  ctx.fillStyle=bg;
  rr(-bw,by-bh*.5,bw*2,bh,bw*.65);ctx.fill();

  // Belly patch — lighter oval
  ctx.fillStyle=lighten(bc,50);
  ctx.globalAlpha=.35;
  ctx.beginPath();ctx.ellipse(0,by+bh*.15,bw*.55,bh*.3,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  // Body outline glow
  ctx.shadowColor=bc;ctx.shadowBlur=8;
  ctx.strokeStyle=lighten(bc,20);ctx.lineWidth=1.5;
  rr(-bw,by-bh*.5,bw*2,bh,bw*.65);ctx.stroke();
  ctx.shadowBlur=0;

  // === ARMS ===
  const armWave=inAir?Math.sin(gt*8)*.25:Math.sin(gt*3)*.1;
  ctx.fillStyle=bc;
  // Left arm
  ctx.save();ctx.translate(-bw-.5,by+bh*.1);ctx.rotate(-.4+armWave);
  ctx.beginPath();ctx.ellipse(0,0,s*.15,s*.35,0,0,Math.PI*2);ctx.fill();
  // Hand
  ctx.fillStyle=lighten(bc,20);
  ctx.beginPath();ctx.arc(0,s*.32,s*.12,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Right arm
  ctx.fillStyle=bc;
  ctx.save();ctx.translate(bw+.5,by+bh*.1);ctx.rotate(.4-armWave);
  ctx.beginPath();ctx.ellipse(0,0,s*.15,s*.35,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=lighten(bc,20);
  ctx.beginPath();ctx.arc(0,s*.32,s*.12,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // === ANTENNA ===
  const antBob=Math.sin(gt*4)*.08;
  const antX=0,antY=by-bh*.5;
  // Stalk
  ctx.strokeStyle=darken(bc,15);ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(antX,antY);
  ctx.quadraticCurveTo(antX+Math.sin(gt*3)*4,antY-s*.5,antX+Math.sin(gt*2.5)*2,antY-s*.85+antBob*s);
  ctx.stroke();
  // Glowing ball
  const abX=antX+Math.sin(gt*2.5)*2,abY=antY-s*.85+antBob*s;
  const ag=ctx.createRadialGradient(abX,abY,0,abX,abY,s*.25);
  ag.addColorStop(0,'rgba(255,255,255,.9)');ag.addColorStop(.4,antCol);ag.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ag;ctx.beginPath();ctx.arc(abX,abY,s*.25,0,Math.PI*2);ctx.fill();
  // Antenna glow
  ctx.shadowColor=antCol;ctx.shadowBlur=12;
  ctx.fillStyle=antCol;ctx.beginPath();ctx.arc(abX,abY,s*.1,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // === EYES ===
  const ey=by-bh*.05;
  const leS=s*.38,reS=s*.32; // left eye slightly bigger

  // Eye whites
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-s*.28,ey,leS,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*.28,ey,reS,0,Math.PI*2);ctx.fill();

  // Eye outlines
  ctx.strokeStyle=darken(bc,30);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(-s*.28,ey,leS,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(s*.28,ey,reS,0,Math.PI*2);ctx.stroke();

  // Pupils — blink animation
  const blink=Math.sin(gt*2)>.96?.1:1;
  ctx.fillStyle=sk.e;
  ctx.beginPath();ctx.ellipse(-s*.28,ey+1,leS*.48,leS*.48*blink,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*.28,ey+1,reS*.48,reS*.48*blink,0,0,Math.PI*2);ctx.fill();

  // Eye highlights
  ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.beginPath();ctx.arc(-s*.28-2,ey-3,leS*.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*.28-1.5,ey-2.5,reS*.18,0,Math.PI*2);ctx.fill();

  // === MOUTH ===
  const mouthY=ey+s*.52;
  if(inAir){
    // Open mouth — excited "O"
    ctx.fillStyle=darken(bc,45);
    ctx.beginPath();ctx.ellipse(0,mouthY,s*.15,s*.12,0,0,Math.PI*2);ctx.fill();
  } else {
    // Happy smile
    ctx.strokeStyle=darken(bc,40);ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(0,mouthY-s*.08,s*.2,.15,Math.PI-.15);ctx.stroke();
  }

  // === CHEEKS ===
  ctx.fillStyle=sk.ch;ctx.globalAlpha=.3;
  ctx.beginPath();ctx.ellipse(-s*.55,ey+s*.3,s*.15,s*.1,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*.55,ey+s*.3,s*.15,s*.1,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  // === GLOSS highlight ===
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.beginPath();ctx.ellipse(-s*.15,by-bh*.3,bw*.5,bh*.15,-.15,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function drawCoin(x,y,s,bob){
  const b=Math.sin(gt*4.5+bob)*3;
  ctx.save();ctx.translate(x,y-25*s+b);ctx.scale(s,s);
  const gg=ctx.createRadialGradient(0,0,3,0,0,16);gg.addColorStop(0,'rgba(255,215,0,.3)');gg.addColorStop(1,'rgba(255,215,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  const cg=ctx.createRadialGradient(-2,-2,0,0,0,11);cg.addColorStop(0,'#FFF176');cg.addColorStop(.6,'#FFD54F');cg.addColorStop(1,'#FFA000');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#FFA000';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(-3,-3,3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawPUIcon(x,y,s,type,bob){
  const b=Math.sin(gt*3.5+bob)*5;ctx.save();ctx.translate(x,y-28*s+b);ctx.scale(s,s);
  let gc;
  if(type==='shield')gc='79,195,247';else if(type==='magnet')gc='244,67,54';else if(type==='boost')gc='255,235,59';else gc='171,71,188';
  const gg=ctx.createRadialGradient(0,0,5,0,0,22);gg.addColorStop(0,`rgba(${gc},.4)`);gg.addColorStop(1,`rgba(${gc},0)`);ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
  ctx.font='22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText({shield:'🛡️',magnet:'🧲',boost:'⚡',superjump:'🌟'}[type]||'?',0,0);
  ctx.restore();
}

function drawPts(){
  for(const p of pts){ctx.globalAlpha=p.a;ctx.fillStyle=p.col;
    if(p.tp==='s'){ctx.beginPath();for(let i=0;i<5;i++){const a=Math.PI*2*i/5-Math.PI/2,r=p.sz*p.a;ctx.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);const ia=a+Math.PI/5;ctx.lineTo(p.x+Math.cos(ia)*r*.4,p.y+Math.sin(ia)*r*.4)}ctx.closePath();ctx.fill()}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.a,0,Math.PI*2);ctx.fill()}}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=f.a;ctx.fillStyle=f.col;ctx.font=`bold ${f.sz*f.sc}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=3;ctx.fillText(f.t,f.x,f.y);ctx.shadowBlur=0}
  ctx.globalAlpha=1;
}

function drawGame(){
  ctx.save();ctx.translate(shX,shY);
  drawBg();drawWater();

  // Far parallax layers (0,1)
  for(const obj of sideObjects){
    if(obj.layer<=1)drawSideObj(obj);
  }

  // Road surface
  const ROAD_EDGE=-.75;
  const ROAD_EDGE_R=2.75;
  ctx.beginPath();
  const roadLeft=[],roadRight=[];
  for(let z=VIEW_AHEAD;z>=0;z-=.2){
    const pl=project(z,ROAD_EDGE);
    roadLeft.push(pl);
  }
  for(let z=0;z<=VIEW_AHEAD;z+=.2){
    const pr=project(z,ROAD_EDGE_R);
    roadRight.push(pr);
  }
  ctx.moveTo(roadLeft[0].x,roadLeft[0].y);
  for(const p of roadLeft)ctx.lineTo(p.x,p.y);
  for(const p of roadRight)ctx.lineTo(p.x,p.y);
  ctx.closePath();
  const roadGrad=ctx.createLinearGradient(0,H*.18,0,H*.93);
  roadGrad.addColorStop(0,'rgba(200,230,200,.15)');
  roadGrad.addColorStop(.5,'rgba(100,180,100,.12)');
  roadGrad.addColorStop(1,'rgba(50,120,50,.18)');
  ctx.fillStyle=roadGrad;ctx.fill();

  // Road edge — soft glow
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2.5;
  ctx.shadowColor='rgba(255,255,200,.4)';ctx.shadowBlur=8;
  ctx.beginPath();
  for(let z=0;z<VIEW_AHEAD;z+=.2){
    const p=project(z,ROAD_EDGE);
    if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
  ctx.beginPath();
  for(let z=0;z<VIEW_AHEAD;z+=.2){
    const p=project(z,ROAD_EDGE_R);
    if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
  ctx.shadowBlur=0;

  drawCenterGlow();

  // Grid lines (subtle depth cue)
  for(let gl=0;gl<=2;gl+=.5){
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=.6;
    ctx.beginPath();
    for(let z=0;z<VIEW_AHEAD;z+=.5){
      const p=project(z,gl);
      if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }

  // Mid parallax (2)
  for(const obj of sideObjects){
    if(obj.layer===2)drawSideObj(obj);
  }

  // Draw platforms far to near
  const si=Math.max(0,getCurrentPadIdx()-2);
  const ei=Math.min(pads.length,getCurrentPadIdx()+Math.ceil(VIEW_AHEAD/4.5)+4);
  const order=[];
  for(let i=si;i<ei;i++){
    const rz=padPositions[i]-seq+VIEW_Z;
    if(rz<-.5||rz>VIEW_AHEAD)continue;
    order.push({i,rz});
  }
  order.sort((a,b)=>b.rz-a.rz);

  const curIdx=getCurrentPadIdx();
  for(const{i,rz}of order){
    const pad=pads[i];
    // Don't draw broken/disappeared platforms
    if(pad.broken) continue;
    if(pad.disappeared) continue;
    // Falling offset
    let extraY=0;
    if(pad.type==='falling'&&pad.fallOffset>0) extraY=pad.fallOffset*20;
    if(pad.fallOffset&&pad.fallOffset>8) continue; // fallen off screen
    const p=project(rz,pad.gameX);
    p.y+=extraY*p.s;
    // Depth-based alpha — farther = slightly darker
    const depthAlpha=clamp(1-rz/VIEW_AHEAD*.35, 0.45, 1);
    // Breakable platforms flicker when cracking
    const breakFlicker=(pad.type==='breakable'&&pad.breakTimer>0)?(.5+.5*Math.sin(gt*30)):1;
    // Disappearing platforms fade
    const disappearFade=(pad.type==='disappear')?pad.disappearAlpha:1;
    ctx.globalAlpha=depthAlpha*breakFlicker*disappearFade;
    drawPad(p.x,p.y,p.s,pad.type,pad.dip,i===curIdx,pad.width);
    // Diamond path overlay
    if(pad.diamond&&diamondPath){
      ctx.save();ctx.translate(p.x,p.y);
      const dhw=120*p.s*(pad.width||1);
      const dcy=p.y-55*p.s*(pad.width||1);
      // Cyan glow border
      ctx.strokeStyle=`rgba(0,188,212,${.5+.2*Math.sin(gt*5)})`;ctx.lineWidth=3*p.s;
      ctx.shadowColor='rgba(0,188,212,.6)';ctx.shadowBlur=15*p.s;
      rr(-dhw,-55*p.s*(pad.width||1)*2,dhw*2,55*p.s*(pad.width||1)*2,12*p.s);ctx.stroke();
      ctx.shadowBlur=0;
      // Diamond icon floating above
      ctx.font=`${20*p.s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('💎',0,-55*p.s*(pad.width||1)*2-15*p.s+Math.sin(gt*3)*5*p.s);
      ctx.restore();
    }
    // Moving platform indicator — small arrows on sides
    if(pad.moving){
