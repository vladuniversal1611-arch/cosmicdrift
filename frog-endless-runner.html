<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Frog Runner 🐸</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

// ===================== HELPERS =====================
function lerp(a,b,t){return a+(b-a)*t}
function smoothDamp(cur,tgt,spd,dt){return cur+(tgt-cur)*(1-Math.exp(-spd*dt))}
function easeOut(t){return 1-Math.pow(1-t,3)}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function rand(a,b){return a+Math.random()*(b-a)}

// ===================== CONSTANTS =====================
const ST={MENU:0,PLAY:1,OVER:2,SKINS:3};
const BASE_SPEED=1.6; // pads per second at start
const MAX_SPEED=4.2;
const SPEED_RAMP=100; // seconds to reach max speed
const FROG_VIEW_Z=1.2; // where frog sits on screen (pad-units from bottom)
const VIEW_AHEAD=10;

// ===================== STATE =====================
let state=ST.MENU;
let gt=0; // global time for animations
// Game
let seqPos=0; // frog's continuous position along pad sequence
let speed=BASE_SPEED;
let frogLane=1; // target lane 0,1,2
let frogVisLane=1; // visual lane (smooth)
let lastLandedIdx=-1;
let alive=true,falling=false,fallT=0;
let dist=0,score=0,combo=0,maxCombo=0,runCoins=0;
let highScore=+localStorage.getItem('fHS')||0;
let totalCoins=+localStorage.getItem('fCoins')||0;
let newRecord=false;
let hasShield=false,hasMagnet=false,magnetT=0,hasBoost=false,boostT=0;
let shieldFlash=0,perfectFlash=0,comboScale=1;
let screenShake=0,shakeX=0,shakeY=0;
let gameOverT=0;
// Pads
let pads=[]; // {lane, type, coin, powerUp, landed}
let padGenLane=1;
// Particles & effects
let particles=[];
let floats=[];
// Decorations
let clouds=[];
// Skins
const SKINS=[
  {n:'Класична',c:'#4CAF50',e:'#222',ch:'#FF8A80',p:0,o:true},
  {n:'Блакитна',c:'#42A5F5',e:'#1A237E',ch:'#90CAF9',p:100,o:false},
  {n:'Рожева',c:'#F48FB1',e:'#880E4F',ch:'#FCE4EC',p:150,o:false},
  {n:'Фіолетова',c:'#AB47BC',e:'#4A148C',ch:'#E1BEE7',p:200,o:false},
  {n:'Золота',c:'#FFD54F',e:'#F57F17',ch:'#FFF9C4',p:500,o:false},
  {n:'Райдужна',c:'rainbow',e:'#333',ch:'#FFB3B3',p:1000,o:false},
];
let curSkin=0;
try{const s=JSON.parse(localStorage.getItem('fSk')||'[]');s.forEach((v,i)=>{if(SKINS[i])SKINS[i].o=v});curSkin=+(localStorage.getItem('fCS')||0)}catch(e){}
function saveSkins(){localStorage.setItem('fSk',JSON.stringify(SKINS.map(s=>s.o)));localStorage.setItem('fCS',''+curSkin)}

// ===================== AUDIO =====================
let ac=null,sfxG=null,musG=null,musPlaying=false,musIv=null;
function initAudio(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();sfxG=ac.createGain();sfxG.gain.value=0.25;sfxG.connect(ac.destination);musG=ac.createGain();musG.gain.value=0.1;musG.connect(ac.destination)}
function tone(f,d,tp='sine',v=0.2,dl=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=tp;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+d);o.connect(g);g.connect(sfxG);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d)}
function noise(d,v=.15){if(!ac)return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),dd=b.getChannelData(0);for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*v;const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=1;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);s.connect(g);g.connect(sfxG);s.start()}
function sfxJump(){tone(500,.1,'sine',.12);tone(700,.08,'sine',.08,.03)}
function sfxLand(){tone(250,.08,'triangle',.1);noise(.03,.06)}
function sfxPerfect(){tone(880,.12,'sine',.15);tone(1100,.12,'sine',.1,.08);tone(1320,.15,'sine',.08,.16)}
function sfxCoin(){tone(1300,.08,'square',.08);tone(1700,.1,'square',.06,.04)}
function sfxCombo(){tone(660,.1,'sine',.12);tone(990,.12,'sine',.08,.06)}
function sfxPU(){for(let i=0;i<4;i++)tone(500+i*250,.12,'sine',.08,i*.04)}
function sfxSplash(){noise(.35,.25);tone(180,.25,'sine',.12)}
function sfxDie(){tone(440,.25,'sine',.15);tone(330,.25,'sine',.12,.12);tone(220,.4,'sine',.1,.24)}
function sfxClick(){tone(900,.06,'square',.08)}
const MEL=[523,659,784,659,523,587,659,784,880,784,659,523,587,523,659,784];
let melIdx=0;
function startMus(){if(musPlaying)return;musPlaying=true;melIdx=0;musIv=setInterval(()=>{if(!ac||state!==ST.PLAY)return;const f=MEL[melIdx%MEL.length];if(f){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(g);g.connect(musG);o.start();o.stop(ac.currentTime+.2)}melIdx++},180)}
function stopMus(){musPlaying=false;if(musIv){clearInterval(musIv);musIv=null}}

// ===================== PATTERN GENERATION =====================
// Generates arrays of lane numbers for the pad sequence
function genStraight(lane,count){return Array(count).fill(lane)}

function genSwitch(from){
  if(from===0)return[1];
  if(from===2)return[1];
  return[Math.random()<.5?0:2];
}

function genZigzag(start,count){
  const r=[];let l=start;
  for(let i=0;i<count;i++){
    const adj=l===1?(Math.random()<.5?0:2):1;
    r.push(adj);l=adj;
  }
  return r;
}

function genStaircase(from){
  if(from===0)return[1,2];
  if(from===2)return[1,0];
  return Math.random()<.5?[0,1,0]:[2,1,2];
}

function genDoubleSwitch(from){
  if(from===0)return[2];
  if(from===2)return[0];
  return[Math.random()<.5?0:2];
}

function genFastSeq(start){
  const r=[];let l=start;
  const n=4+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    const next=l===0?1:l===2?1:(Math.random()<.5?0:2);
    r.push(next);l=next;
  }
  return r;
}

function genRiskPath(safeLane){
  // Main path continues on safeLane, but coins are on another lane
  // Return the safe path; coins placed separately
  return genStraight(safeLane,3);
}

function pickPattern(difficulty){
  const d=Math.min(difficulty,1);
  const straightLen=Math.max(2,Math.floor(5-d*3));
  const r=Math.random();

  if(r<.25-d*.1){
    // Straight
    return genStraight(padGenLane,straightLen+Math.floor(Math.random()*2));
  }else if(r<.4){
    // Switch to adjacent
    const sw=genSwitch(padGenLane);
    padGenLane=sw[sw.length-1];
    return sw;
  }else if(r<.55){
    // Zigzag
    const zz=genZigzag(padGenLane,3+Math.floor(Math.random()*3));
    padGenLane=zz[zz.length-1];
    return zz;
  }else if(r<.65&&d>.2){
    // Staircase
    const st=genStaircase(padGenLane);
    padGenLane=st[st.length-1];
    return st;
  }else if(r<.75&&d>.3){
    // Double switch (long jump)
    const ds=genDoubleSwitch(padGenLane);
    padGenLane=ds[ds.length-1];
    return ds;
  }else if(r<.85&&d>.15){
    // Fast sequence
    const fs=genFastSeq(padGenLane);
    padGenLane=fs[fs.length-1];
    return fs;
  }else{
    // Straight with transition
    const s=genStraight(padGenLane,straightLen);
    const sw=genSwitch(padGenLane);
    padGenLane=sw[sw.length-1];
    return[...s,...sw];
  }
}

function ensurePads(){
  const needed=Math.floor(seqPos)+VIEW_AHEAD+5;
  while(pads.length<needed){
    const diff=Math.min(dist/40,1);
    const pattern=pickPattern(diff);
    for(const lane of pattern){
      const idx=pads.length;
      const hasCoin=Math.random()<(.2+diff*.15);
      let pu=null;
      if(Math.random()<.015&&dist>5){
        pu=['shield','magnet','boost','superjump'][Math.floor(Math.random()*4)];
      }
      const type=Math.random()<.06?'flower':(Math.random()<.04&&dist>10?'gold':'normal');
      pads.push({lane,type,coin:hasCoin,pu,landed:false,dip:0});
    }
  }
}

// ===================== PROJECTION =====================
function project(relZ,lane){
  const maxD=VIEW_AHEAD;
  const t=clamp(relZ/maxD,0,1);
  const p=Math.pow(1-t*.85,1.7);
  const vanY=H*.28,baseY=H*.82;
  const y=vanY+(baseY-vanY)*p;
  const lw=W*.23*p;
  const x=W/2+(lane-1)*lw;
  return{x,y,s:Math.max(p,.03)};
}

// ===================== INPUT =====================
let touching=false; // is finger currently on screen during gameplay
let touchSX=0,touchSY=0,touchST=0;
let frogCont=1; // continuous lane position (0.0 - 2.0) — follows finger

// Map screen X to lane value (0-2) using the playfield width
function xToLane(sx){
  // Use wider zone so edges are reachable comfortably
  const margin=W*.12;
  const t=clamp((sx-margin)/(W-margin*2),0,1);
  return t*2; // 0.0 (left) to 2.0 (right)
}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  const t=e.touches[0];touchSX=t.clientX;touchSY=t.clientY;touchST=Date.now();
  if(state===ST.PLAY&&alive){
    touching=true;
    frogCont=xToLane(t.clientX);
    frogLane=Math.round(frogCont);
  }
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(state===ST.PLAY&&alive&&touching){
    const t=e.touches[0];
    frogCont=xToLane(t.clientX);
    frogLane=Math.round(frogCont);
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];if(!t)return;
  const dx=t.clientX-touchSX,dy=t.clientY-touchSY;
  const d=Math.sqrt(dx*dx+dy*dy);
  const dt=Date.now()-touchST;
  if(state===ST.PLAY&&alive){
    // Snap to nearest lane on release
    frogLane=Math.round(frogCont);
    touching=false;
  }
  if(d<25&&dt<300){
    // Tap for menus
    if(state===ST.MENU)handleMenuTap(t.clientX,t.clientY);
    else if(state===ST.OVER)handleOverTap(t.clientX,t.clientY);
    else if(state===ST.SKINS)handleSkinsTap(t.clientX,t.clientY);
  }
},{passive:false});

// Mouse (desktop fallback)
let mouseDown=false;
canvas.addEventListener('mousedown',e=>{
  initAudio();touchSX=e.clientX;touchSY=e.clientY;touchST=Date.now();mouseDown=true;
  if(state===ST.PLAY&&alive){touching=true;frogCont=xToLane(e.clientX);frogLane=Math.round(frogCont)}
});
canvas.addEventListener('mousemove',e=>{
  if(mouseDown&&state===ST.PLAY&&alive&&touching){
    frogCont=xToLane(e.clientX);frogLane=Math.round(frogCont);
  }
});
canvas.addEventListener('mouseup',e=>{
  mouseDown=false;
  if(state===ST.PLAY&&alive){frogLane=Math.round(frogCont);touching=false}
  const dx=e.clientX-touchSX,d=Math.sqrt(dx*dx+(e.clientY-touchSY)**2);
  if(d<25&&Date.now()-touchST<300){
    if(state===ST.MENU)handleMenuTap(e.clientX,e.clientY);
    else if(state===ST.OVER)handleOverTap(e.clientX,e.clientY);
    else if(state===ST.SKINS)handleSkinsTap(e.clientX,e.clientY);
  }
});
document.addEventListener('keydown',e=>{
  initAudio();
  if(state===ST.PLAY){
    if(e.key==='ArrowLeft'||e.key==='a'){frogCont=clamp(frogCont-1,0,2);frogLane=Math.round(frogCont)}
    if(e.key==='ArrowRight'||e.key==='d'){frogCont=clamp(frogCont+1,0,2);frogLane=Math.round(frogCont)}
  }else if(state===ST.MENU&&(e.key==='Enter'||e.key===' '))startGame();
  else if(state===ST.OVER){if(e.key==='Enter'||e.key===' ')startGame();if(e.key==='Escape'){state=ST.MENU}}
  else if(state===ST.SKINS&&e.key==='Escape'){state=ST.MENU}
});

// ===================== PARTICLES =====================
function addP(x,y,vx,vy,col,sz,life,tp='c'){particles.push({x,y,vx,vy,col,sz,life,ml:life,tp,a:1})}
function addSplash(x,y,sc=1){for(let i=0;i<8;i++){const a=Math.PI*2*i/8+rand(-.3,.3);const s=rand(1,2.5)*sc;addP(x,y,Math.cos(a)*s*.06,Math.sin(a)*s*.06-.04,'rgba(140,215,255,.7)',rand(1.5,3),rand(.3,.5))}}
function addPerfectFX(x,y){for(let i=0;i<12;i++){const a=Math.PI*2*i/12;const s=rand(.03,.07);const cols=['#FFD700','#FFF176','#FFEB3B','#FF9800','#FFF'];addP(x,y,Math.cos(a)*s,Math.sin(a)*s-.02,cols[i%5],rand(2,4),rand(.4,.6),'s')}}
function addCoinFX(x,y){for(let i=0;i<5;i++){const a=Math.PI*2*i/5;addP(x,y,Math.cos(a)*.03,Math.sin(a)*.03-.01,'#FFD700',rand(1.5,3),rand(.3,.4))}}
function addLandFX(x,y,s){for(let i=0;i<4;i++){const a=Math.PI*2*i/4+rand(0,.5);addP(x,y,Math.cos(a)*.015*s,Math.sin(a)*.005*s,'rgba(100,200,255,.5)',1.5*s,.3)}}
function addFloat(txt,x,y,col='#FFD700',sz=20){floats.push({t:txt,x,y,vy:-.03,a:1,l:1,col,sz,sc:1.3})}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.002*dt*60;p.life-=dt;p.a=Math.pow(Math.max(0,p.life/p.ml),.6);if(p.life<=0)particles.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy*dt*60;f.vy*=.98;f.l-=dt;f.a=Math.max(0,f.l);f.sc=lerp(f.sc,1,.05);if(f.l<=0)floats.splice(i,1)}
}

// ===================== GAME LOGIC =====================
function startGame(){
  sfxClick();state=ST.PLAY;
  seqPos=0;speed=BASE_SPEED;frogLane=1;frogVisLane=1;lastLandedIdx=-1;
  alive=true;falling=false;fallT=0;dist=0;score=0;combo=0;maxCombo=0;runCoins=0;
  newRecord=false;hasShield=false;hasMagnet=false;magnetT=0;hasBoost=false;boostT=0;
  shieldFlash=0;perfectFlash=0;comboScale=1;screenShake=0;shakeX=0;shakeY=0;
  pads=[];padGenLane=1;particles=[];floats=[];touching=false;frogCont=1;
  // Initial straight pads
  for(let i=0;i<8;i++)pads.push({lane:1,type:'normal',coin:false,pu:null,landed:false,dip:0});
  ensurePads();initClouds();startMus();
}

function die(){
  if(!alive)return;
  if(hasShield){
    hasShield=false;shieldFlash=.5;sfxPU();
    addFloat('🛡️ ВРЯТОВАНО!',W/2,H*.4,'#4FC3F7',26);
    // Snap to next pad's lane
    const np=pads[Math.floor(seqPos)+1];
    if(np)frogLane=np.lane;
    return;
  }
  alive=false;falling=true;fallT=0;sfxSplash();sfxDie();stopMus();
  const fp=project(FROG_VIEW_Z,frogVisLane);
  addSplash(fp.x,fp.y,2.5);screenShake=.4;
  const fd=Math.floor(dist);
  if(fd>highScore){highScore=fd;localStorage.setItem('fHS',''+highScore);newRecord=true}
  totalCoins+=runCoins;localStorage.setItem('fCoins',''+totalCoins);
  gameOverT=0;setTimeout(()=>{state=ST.OVER},1000);
}

function onLand(padIdx){
  const pad=pads[padIdx];if(!pad)return;
  pad.landed=true;pad.dip=.3;
  sfxLand();score++;

  const lp=project(FROG_VIEW_Z,pad.lane);
  addLandFX(lp.x,lp.y,1);

  // Perfect check
  const laneDist=Math.abs(frogVisLane-pad.lane);
  if(laneDist<.25){
    combo++;if(combo>maxCombo)maxCombo=combo;
    if(combo>=3){
      perfectFlash=.5;
      addPerfectFX(lp.x,lp.y-25);
      const labels=['PERFECT!','GREAT!','AMAZING!','🔥 COMBO!'];
      const label=combo>=10?'🔥 x'+combo+'!':labels[Math.min(Math.floor(combo/3),3)];
      if(combo%2===0||combo>=5)addFloat(label,lp.x,lp.y-45,'#FFD700',combo>=8?28:22);
      sfxPerfect();if(combo>3)sfxCombo();
      comboScale=1.3;score+=combo;
    }
  }else{
    combo=0;
  }

  // Coin
  if(pad.coin){
    pad.coin=false;runCoins++;
    addCoinFX(lp.x,lp.y-15);sfxCoin();
  }

  // Gold pad
  if(pad.type==='gold'){runCoins+=5;addFloat('+5🪙',lp.x,lp.y-35,'#FFD700',20);sfxCoin()}

  // Power-up
  if(pad.pu){
    const t=pad.pu;pad.pu=null;sfxPU();
    if(t==='shield'){hasShield=true;addFloat('🛡️ ЩИТ!',lp.x,lp.y-40,'#4FC3F7',22)}
    else if(t==='magnet'){hasMagnet=true;magnetT=6;addFloat('🧲 МАГНІТ!',lp.x,lp.y-40,'#F44336',22)}
    else if(t==='boost'){hasBoost=true;boostT=4;addFloat('⚡ БУСТ!',lp.x,lp.y-40,'#FFEB3B',22)}
    else if(t==='superjump'){addFloat('🌟 СУПЕР!',lp.x,lp.y-40,'#AB47BC',22)}
  }
}

function updateGame(dt){
  if(!alive){
    fallT+=dt*1.5;updateParticles(dt);return;
  }
  gt+=dt;

  // Speed ramp
  const elapsed=dist/.3; // rough seconds
  const t=Math.min(elapsed/SPEED_RAMP,1);
  const targetSpd=BASE_SPEED+(MAX_SPEED-BASE_SPEED)*easeOut(t);
  speed=smoothDamp(speed,hasBoost?targetSpd*1.3:targetSpd,3,dt);
  if(hasBoost){boostT-=dt;if(boostT<=0)hasBoost=false}
  if(hasMagnet){magnetT-=dt;if(magnetT<=0)hasMagnet=false}

  // Advance position — THIS IS THE CORE: no pauses, continuous movement
  seqPos+=speed*dt;
  dist+=speed*dt*.5;

  // Check landings
  const curIdx=Math.floor(seqPos);
  while(lastLandedIdx<curIdx){
    lastLandedIdx++;
    if(lastLandedIdx>=0&&lastLandedIdx<pads.length){
      const pad=pads[lastLandedIdx];
      if(pad.lane===frogLane){
        onLand(lastLandedIdx);
      }else{
        die();break;
      }
    }
  }

  // Smooth visual lane — follows continuous finger position when touching, snaps to lane when not
  const visTgt=touching?frogCont:frogLane;
  frogVisLane=smoothDamp(frogVisLane,visTgt,18,dt);

  // Shield flash
  if(shieldFlash>0)shieldFlash-=dt*2;
  if(perfectFlash>0)perfectFlash=smoothDamp(perfectFlash,0,5,dt);
  if(comboScale>1)comboScale=smoothDamp(comboScale,1,6,dt);

  // Pad dip
  for(const p of pads)if(p.dip>0)p.dip=smoothDamp(p.dip,0,8,dt);

  // Screen shake
  if(screenShake>0){screenShake=smoothDamp(screenShake,0,6,dt);shakeX=Math.sin(gt*41)*screenShake*5;shakeY=Math.cos(gt*47)*screenShake*4}else{shakeX=shakeY=0}

  // Magnet
  if(hasMagnet){
    const ci=Math.floor(seqPos);
    for(let i=ci;i<ci+5&&i<pads.length;i++){
      if(pads[i].coin&&Math.abs(pads[i].lane-frogLane)<=1){
        pads[i].coin=false;runCoins++;
        const pp=project(i-seqPos+FROG_VIEW_Z,pads[i].lane);
        addCoinFX(pp.x,pp.y);sfxCoin();
      }
    }
  }

  // Speed lines at high speed
  if(speed>3){
    if(Math.random()<(speed-3)*.15){
      const x=rand(0,W),y=rand(H*.3,H*.85);
      addP(x,y,0,.08+speed*.01,'rgba(255,255,255,.15)',1,rand(.15,.3));
    }
  }

  ensurePads();
  // Cleanup old pads
  const minIdx=Math.floor(seqPos)-3;
  if(minIdx>10){pads.splice(0,minIdx-5);lastLandedIdx-=minIdx-5;seqPos-=minIdx-5}

  updateParticles(dt);
  updateClouds(dt);
}

// ===================== CLOUDS =====================
function initClouds(){clouds=[];for(let i=0;i<5;i++)clouds.push({x:rand(0,W),y:rand(H*.04,H*.2),sz:rand(25,50),sp:rand(.15,.3),op:rand(.4,.7)})}
function updateClouds(dt){for(const c of clouds){c.x+=c.sp*dt*20;if(c.x>W+c.sz)c.x=-c.sz}}

// ===================== DRAWING =====================
function drawBg(){
  // Sky
  const sg=ctx.createLinearGradient(0,0,0,H*.45);
  sg.addColorStop(0,'#87CEEB');sg.addColorStop(.6,'#B3E5FC');sg.addColorStop(1,'#E0F7FA');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*.45);
  // Sun
  const sx=W*.82,sy=H*.09;
  const sng=ctx.createRadialGradient(sx,sy,0,sx,sy,50);
  sng.addColorStop(0,'rgba(255,255,200,1)');sng.addColorStop(.4,'rgba(255,235,59,.6)');sng.addColorStop(1,'rgba(255,235,59,0)');
  ctx.fillStyle=sng;ctx.fillRect(sx-60,sy-60,120,120);
  // Mountains
  ctx.fillStyle='#81C784';ctx.beginPath();ctx.moveTo(0,H*.34);
  ctx.lineTo(W*.12,H*.22);ctx.lineTo(W*.28,H*.3);ctx.lineTo(W*.48,H*.17);ctx.lineTo(W*.68,H*.26);ctx.lineTo(W*.82,H*.19);ctx.lineTo(W,H*.28);
  ctx.lineTo(W,H*.38);ctx.lineTo(0,H*.38);ctx.closePath();ctx.fill();
  // Trees
  ctx.fillStyle='#66BB6A';
  for(let i=0;i<10;i++){const tx=i/10*W+Math.sin(i*3.7)*15,ty=H*.31+Math.sin(i*2.1)*10,ts=12+Math.sin(i*4.3)*6;
    ctx.beginPath();ctx.moveTo(tx-ts*.5,ty);ctx.lineTo(tx,ty-ts*1.3);ctx.lineTo(tx+ts*.5,ty);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(tx-ts*.4,ty-ts*.3);ctx.lineTo(tx,ty-ts*1.6);ctx.lineTo(tx+ts*.4,ty-ts*.3);ctx.closePath();ctx.fill()}
  // Clouds
  for(const c of clouds){ctx.globalAlpha=c.op;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(c.x,c.y,c.sz*.5,0,Math.PI*2);ctx.arc(c.x+c.sz*.35,c.y-c.sz*.08,c.sz*.38,0,Math.PI*2);ctx.arc(c.x-c.sz*.3,c.y+c.sz*.05,c.sz*.32,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}

function drawWater(){
  const wt=H*.35;
  const wg=ctx.createLinearGradient(0,wt,0,H);
  wg.addColorStop(0,'#4DD0E1');wg.addColorStop(.3,'#26C6DA');wg.addColorStop(.7,'#00BCD4');wg.addColorStop(1,'#00838F');
  ctx.fillStyle=wg;ctx.fillRect(0,wt,W,H-wt);
  // Waves
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.2;
  for(let r=0;r<12;r++){
    const wy=wt+15+r*(H-wt)/12;
    ctx.beginPath();for(let x=0;x<=W;x+=6){const w=Math.sin(x*.02+gt*2+r*.6)*2.5+Math.sin(x*.035-gt*1.3+r)*1.5;if(x===0)ctx.moveTo(x,wy+w);else ctx.lineTo(x,wy+w)}ctx.stroke()}
  // Sparkles
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<15;i++){const sx=((i*137.5+gt*25)%(W+30))-15;const sy=wt+25+((i*73.1+Math.sin(gt+i)*15)%(H-wt-30));const ss=1.2+Math.sin(gt*3+i*2)*.8;if(ss>1){ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);ctx.fill()}}
}

function drawPad(x,y,s,type,dip,hasCoin,hasPU){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s*.55);
  const pw=38,ph=32;
  // Shadow
  ctx.fillStyle='rgba(0,70,70,.25)';ctx.beginPath();ctx.ellipse(2,4,pw+1,ph+1,0,0,Math.PI*2);ctx.fill();
  // Color
  let c1,c2,c3;
  if(type==='gold'){c1='#FFF176';c2='#FFD54F';c3='#FFC107'}
  else if(type==='flower'){c1='#81C784';c2='#66BB6A';c3='#4CAF50'}
  else{c1='#66BB6A';c2='#4CAF50';c3='#388E3C'}
  const dO=dip*5;
  const pg=ctx.createRadialGradient(-4,-4+dO,0,0,dO,pw);pg.addColorStop(0,c1);pg.addColorStop(.7,c2);pg.addColorStop(1,c3);
  ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(0,dO,pw,ph,0,0,Math.PI*2);ctx.fill();
  // Notch
  ctx.fillStyle='rgba(0,120,110,.3)';ctx.beginPath();ctx.moveTo(0,dO);ctx.lineTo(pw*.35,-ph*.7+dO);ctx.lineTo(pw*.55,-ph*.25+dO);ctx.closePath();ctx.fill();
  // Veins
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=.8;
  for(let i=0;i<4;i++){const a=-Math.PI*.35+(Math.PI*.7*i)/3;ctx.beginPath();ctx.moveTo(0,dO);ctx.lineTo(Math.cos(a)*pw*.75,Math.sin(a)*ph*.75+dO);ctx.stroke()}
  // Gloss
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.ellipse(-7,-6+dO,pw*.35,ph*.25,-.3,0,Math.PI*2);ctx.fill();
  // Flower
  if(type==='flower'){
    const fc=['#F48FB1','#CE93D8','#FFB74D','#FFF176'][Math.floor(gt*.5)%4];
    for(let i=0;i<5;i++){const a=Math.PI*2*i/5+gt*.5;ctx.fillStyle=fc;ctx.beginPath();ctx.ellipse(pw*.25+Math.cos(a)*5,-ph*.4+Math.sin(a)*5+dO,5,3,a,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(pw*.25,-ph*.4+dO,3,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function getSkinCol(){const sk=SKINS[curSkin];return sk.c==='rainbow'?`hsl(${(gt*60)%360},70%,55%)`:sk.c}
function lighten(h,a){if(h.startsWith('hsl'))return h;const n=parseInt(h.replace('#',''),16);return`rgb(${Math.min(255,((n>>16)&255)+a)},${Math.min(255,((n>>8)&255)+a)},${Math.min(255,(n&255)+a)})`}
function darken(h,a){if(h.startsWith('hsl'))return h;const n=parseInt(h.replace('#',''),16);return`rgb(${Math.max(0,((n>>16)&255)-a)},${Math.max(0,((n>>8)&255)-a)},${Math.max(0,(n&255)-a)})`}

function drawFrog(x,y,sc,rot,sqX,sqY,inAir,height){
  ctx.save();ctx.translate(x,y-height*70*sc);ctx.rotate(rot);ctx.scale(sc*sqX,sc*sqY);
  const sk=SKINS[curSkin],bc=getSkinCol(),s=18;
  // Shield aura
  if(hasShield){ctx.strokeStyle='rgba(79,195,247,.4)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-s*.3,s*1.8,0,Math.PI*2);ctx.stroke();
    const sg=ctx.createRadialGradient(0,-s*.3,s,0,-s*.3,s*1.8);sg.addColorStop(0,'rgba(79,195,247,0)');sg.addColorStop(1,'rgba(79,195,247,.12)');ctx.fillStyle=sg;ctx.fill()}
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(0,s*.5+height*25,s*1.1,s*.25,0,0,Math.PI*2);ctx.fill();
  // Back legs
  ctx.fillStyle=bc;
  if(inAir){ctx.beginPath();ctx.ellipse(-s*.75,s*.55,s*.45,s*.22,.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.75,s*.55,s*.45,s*.22,-.5,0,Math.PI*2);ctx.fill()}
  else{ctx.beginPath();ctx.ellipse(-s*.65,s*.25,s*.4,s*.28,.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.65,s*.25,s*.4,s*.28,-.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-s,s*.45,s*.28,s*.12,.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s,s*.45,s*.28,s*.12,-.2,0,Math.PI*2);ctx.fill()}
  // Body
  const bg=ctx.createRadialGradient(-2,-s*.15,0,0,0,s*1.1);bg.addColorStop(0,lighten(bc,25));bg.addColorStop(.7,bc);bg.addColorStop(1,darken(bc,15));
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,s*.95,s*.8,0,0,Math.PI*2);ctx.fill();
  // Belly
  ctx.fillStyle=lighten(bc,45);ctx.beginPath();ctx.ellipse(0,s*.12,s*.55,s*.4,0,0,Math.PI*2);ctx.fill();
  // Head
  const hy=-s*.8;
  const hg=ctx.createRadialGradient(-2,hy-2,0,0,hy,s*1.05);hg.addColorStop(0,lighten(bc,25));hg.addColorStop(.8,bc);hg.addColorStop(1,darken(bc,12));
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,hy,s*1.05,s*.85,0,0,Math.PI*2);ctx.fill();
  // Eyes
  const es=s*.35,ey=hy-s*.12;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.38,ey,es,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.38,ey,es,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=darken(bc,25);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(-s*.38,ey,es,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(s*.38,ey,es,0,Math.PI*2);ctx.stroke();
  // Pupils
  const blink=Math.sin(gt*2)>.95?.1:1;
  ctx.fillStyle=sk.e;ctx.beginPath();ctx.ellipse(-s*.38,ey+1,es*.45,es*.45*blink,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.38,ey+1,es*.45,es*.45*blink,0,0,Math.PI*2);ctx.fill();
  // Eye shine
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(-s*.38-1.5,ey-2.5,es*.18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.38-1.5,ey-2.5,es*.18,0,Math.PI*2);ctx.fill();
  // Cheeks
  ctx.fillStyle=sk.ch;ctx.globalAlpha=.4;ctx.beginPath();ctx.ellipse(-s*.65,hy+s*.18,s*.22,s*.12,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.65,hy+s*.18,s*.22,s*.12,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  // Mouth
  ctx.strokeStyle=darken(bc,35);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,hy+s*.22,s*.28,.1,Math.PI-.1);ctx.stroke();
  // Front legs
  ctx.fillStyle=bc;ctx.beginPath();ctx.ellipse(-s*.8,s*.08,s*.18,s*.12,.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.8,s*.08,s*.18,s*.12,-.3,0,Math.PI*2);ctx.fill();
  // Head gloss
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.ellipse(-2,hy-s*.28,s*.45,s*.25,-.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawCoin(x,y,s,bob){
  const b=Math.sin(gt*4+bob)*2.5;
  ctx.save();ctx.translate(x,y-18*s+b);ctx.scale(s,s);
  // Glow
  const gg=ctx.createRadialGradient(0,0,2,0,0,12);gg.addColorStop(0,'rgba(255,215,0,.25)');gg.addColorStop(1,'rgba(255,215,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();
  // Coin
  const cg=ctx.createRadialGradient(-1.5,-1.5,0,0,0,8);cg.addColorStop(0,'#FFF176');cg.addColorStop(.6,'#FFD54F');cg.addColorStop(1,'#FFA000');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,7.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#FFA000';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(-2,-2,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawPUIcon(x,y,s,type,bob){
  const b=Math.sin(gt*3+bob)*4;ctx.save();ctx.translate(x,y-22*s+b);ctx.scale(s,s);
  let gc;
  if(type==='shield')gc='79,195,247';else if(type==='magnet')gc='244,67,54';else if(type==='boost')gc='255,235,59';else gc='171,71,188';
  const gg=ctx.createRadialGradient(0,0,4,0,0,16);gg.addColorStop(0,`rgba(${gc},.4)`);gg.addColorStop(1,`rgba(${gc},0)`);ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  ctx.font='16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const icons={shield:'🛡️',magnet:'🧲',boost:'⚡',superjump:'🌟'};
  ctx.fillText(icons[type]||'?',0,0);ctx.restore();
}

function drawParticles(){
  for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=p.col;
    if(p.tp==='s'){ctx.beginPath();for(let i=0;i<5;i++){const a=Math.PI*2*i/5-Math.PI/2,r=p.sz*p.a;ctx.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);const ia=a+Math.PI/5;ctx.lineTo(p.x+Math.cos(ia)*r*.4,p.y+Math.sin(ia)*r*.4)}ctx.closePath();ctx.fill()}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.a,0,Math.PI*2);ctx.fill()}}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=f.a;ctx.fillStyle=f.col;ctx.font=`bold ${f.sz*f.sc}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=3;ctx.fillText(f.t,f.x,f.y);ctx.shadowBlur=0}
  ctx.globalAlpha=1;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

// ===================== GAME RENDER =====================
function drawGame(){
  ctx.save();ctx.translate(shakeX,shakeY);
  drawBg();drawWater();

  // Draw pads from far to near
  const startIdx=Math.max(0,Math.floor(seqPos)-2);
  const endIdx=Math.min(pads.length,Math.floor(seqPos)+VIEW_AHEAD+3);

  // Sort by distance (far first)
  const drawOrder=[];
  for(let i=startIdx;i<endIdx;i++){
    const relZ=i-seqPos+FROG_VIEW_Z;
    if(relZ<-.5||relZ>VIEW_AHEAD)continue;
    drawOrder.push({i,relZ});
  }
  drawOrder.sort((a,b)=>b.relZ-a.relZ);

  for(const {i,relZ} of drawOrder){
    const pad=pads[i];
    const p=project(relZ,pad.lane);
    drawPad(p.x,p.y,p.s,pad.type,pad.dip,pad.coin,pad.pu);

    // Coin
    if(pad.coin){drawCoin(p.x,p.y,p.s,i*1.7)}
    // Power-up
    if(pad.pu){drawPUIcon(p.x,p.y,p.s,pad.pu,i*2.3)}
  }

  // Draw frog
  if(alive||fallT<1.5){
    const bounce=seqPos%1; // 0-1 within current arc
    const airness=Math.sin(bounce*Math.PI);
    const height=airness;

    // Squash/stretch from bounce
    const sqX=1+.15*(1-airness)-.08*airness; // wide on pad, narrow in air
    const sqY=1-.12*(1-airness)+.1*airness;  // short on pad, tall in air

    // Rotation from lane change
    const laneDelta=frogVisLane-frogLane;
    const rot=airness*.1*clamp(laneDelta,-1,1);

    const fp=project(FROG_VIEW_Z,frogVisLane);
    let fx=fp.x,fy=fp.y,fs=fp.s;

    if(falling){
      const ft=Math.min(fallT,1);
      fy+=ft*60;fs*=(1-ft*.4);ctx.globalAlpha=1-ft*.8;
    }

    // Gentle bob when on pad (tiny)
    if(!falling&&airness<.15){fy+=Math.sin(gt*3)*1}

    drawFrog(fx,fy,fs,rot,sqX,sqY,airness>.3,height*.35);
    ctx.globalAlpha=1;

    // Trail particles at high speed
    if(speed>2.5&&airness>.3&&Math.random()<.3){
      addP(fx+rand(-5,5),fy+10,0,.01,'rgba(150,220,255,.3)',rand(1,2.5),rand(.15,.25));
    }
  }

  drawParticles();

  // Perfect flash
  if(perfectFlash>0){ctx.fillStyle=`rgba(255,215,0,${perfectFlash*.12})`;ctx.fillRect(0,0,W,H)}
  if(shieldFlash>0){ctx.fillStyle=`rgba(79,195,247,${shieldFlash*.15})`;ctx.fillRect(0,0,W,H)}
  ctx.restore();

  drawHUD();
}

function drawHUD(){
  const p=12,ty=16;
  // Distance
  ctx.fillStyle='rgba(0,0,0,.25)';rr(p,ty,130,44,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';
  ctx.fillText('🏆 ДИСТАНЦІЯ',p+8,ty+14);
  ctx.font='bold 18px sans-serif';ctx.fillText(Math.floor(dist)+' м',p+8,ty+34);
  // Coins
  ctx.fillStyle='rgba(0,0,0,.25)';rr(W-90-p,ty,90,30,10);ctx.fill();
  ctx.fillStyle='#FFD700';ctx.font='bold 14px sans-serif';ctx.textAlign='right';ctx.fillText('🪙 '+runCoins,W-p-8,ty+20);
  // Combo
  if(combo>=3){
    ctx.save();const cx=p+8,cy=ty+58;ctx.translate(cx+35,cy);ctx.scale(comboScale,comboScale);ctx.translate(-(cx+35),-cy);
    ctx.fillStyle='rgba(255,87,34,.75)';rr(cx,cy-12,70,24,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('🔥 x'+combo,cx+35,cy+4);ctx.restore();
  }
  // Power-up HUD
  let py=ty+80;
  if(hasShield){ctx.fillStyle='rgba(79,195,247,.6)';rr(p,py,80,18,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.fillText('🛡️ Щит',p+6,py+13);py+=22}
  if(hasMagnet){ctx.fillStyle='rgba(244,67,54,.6)';rr(p,py,80,18,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.fillText('🧲 '+Math.ceil(magnetT)+'с',p+6,py+13);py+=22}
  if(hasBoost){ctx.fillStyle='rgba(255,235,59,.6)';rr(p,py,80,18,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.fillText('⚡ '+Math.ceil(boostT)+'с',p+6,py+13);py+=22}
  // Speed
  const sp=(speed-BASE_SPEED)/(MAX_SPEED-BASE_SPEED);
  if(sp>.1){ctx.fillStyle=`rgba(255,${Math.floor(255*(1-sp))},0,.4)`;ctx.font='9px sans-serif';ctx.textAlign='right';ctx.fillText('ШВИДКІСТЬ '+Math.floor(sp*100)+'%',W-p,H-15)}
  // Hint
  if(dist<2&&alive){const ha=Math.max(0,1-dist/2)*(0.5+Math.sin(gt*3)*.2);ctx.globalAlpha=ha;ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('☝️ тримай палець і веди',W/2,H*.9);ctx.globalAlpha=1}
}

function drawMenu(){
  gt+=.016;drawBg();drawWater();
  // Decorative pads
  for(let i=0;i<5;i++){const mx=W*.15+i*W*.18+Math.sin(gt+i)*8,my=H*.5+Math.sin(gt*.7+i*2)*5;drawPad(mx,my,.45+i*.03,i%3===0?'flower':'normal',0,false,null)}

  const fx=W/2,fy=H*.42;
  drawPad(fx,fy+18,.75,'flower',0,false,null);

  // Title
  ctx.save();ctx.translate(W/2,H*.13);const ts=.8+Math.sin(gt*1.5)*.025;ctx.scale(ts,ts);

  const tg=ctx.createLinearGradient(-90,-15,90,15);tg.addColorStop(0,'#4CAF50');tg.addColorStop(.5,'#8BC34A');tg.addColorStop(1,'#CDDC39');ctx.fillStyle=tg;ctx.fillText('🐸 FROG RUNNER',0,0);ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('Endless Lily Pad Adventure',W/2,H*.13+28);
  // Play btn
  const bw=190,bh=52,bx=W/2-bw/2,by=H*.6;
  ctx.fillStyle='rgba(0,0,0,.15)';rr(bx+2,by+2,bw,bh,26);ctx.fill();
  const bg=ctx.createLinearGradient(bx,by,bx,by+bh);bg.addColorStop(0,'#66BB6A');bg.addColorStop(1,'#43A047');ctx.fillStyle=bg;rr(bx,by,bw,bh,26);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';rr(bx+3,by+2,bw-6,bh/2,18);ctx.fill();

  if(highScore>0){ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='13px sans-serif';ctx.fillText('🏆 Рекорд: '+highScore+' м',W/2,by+bh+25)}
  // Nav
  const ny=H-60;
  [{i:'🐸',l:'СКІНИ',x:W*.2},{i:'🎯',l:'ЗАВДАННЯ',x:W*.5},{i:'🛒',l:'МАГАЗИН',x:W*.8}].forEach(b=>{
    ctx.fillStyle='rgba(0,0,0,.2)';rr(b.x-35,ny-3,70,45,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText(b.i,b.x,ny+15);ctx.font='9px sans-serif';ctx.fillText(b.l,b.x,ny+32)});
  // Coins
  ctx.fillStyle='rgba(0,0,0,.25)';rr(W-100,12,90,26,8);ctx.fill();ctx.fillStyle='#FFD700';ctx.font='bold 13px sans-serif';ctx.textAlign='right';ctx.fillText('🪙 '+totalCoins,W-16,30);
}
function handleMenuTap(x,y){
  const bw=190,bh=52,bx=W/2-bw/2,by=H*.6;
  if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){startGame();return}
  if(y>H-70&&x<W*.35){sfxClick();state=ST.SKINS}
}

// ===================== GAME OVER =====================
function drawOver(){
  gameOverT=Math.min(gameOverT+.025,1);
  ctx.fillStyle=`rgba(0,0,0,${.45*gameOverT})`;ctx.fillRect(0,0,W,H);
  const pw=Math.min(W*.82,310),ph=newRecord?360:330,px=W/2-pw/2,py=H/2-ph/2;
  ctx.save();ctx.translate(W/2,H/2);const as=.5+gameOverT*.5;ctx.scale(as,as);ctx.translate(-W/2,-H/2);ctx.globalAlpha=gameOverT;
  ctx.fillStyle='rgba(255,255,255,.95)';rr(px,py,pw,ph,22);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=1.5;rr(px,py,pw,ph,22);ctx.stroke();
  const cx=W/2;let ty=py+25;
  if(newRecord){ctx.fillStyle='#FFD700';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('🏆 НОВИЙ РЕКОРД! 🏆',cx,ty+8);ty+=30}
  ctx.fillStyle='#F44336';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('ГРА ЗАКІНЧЕНА',cx,ty+10);ty+=40;
  ctx.font='36px sans-serif';ctx.fillText('🐸💧',cx,ty+8);ty+=45;
  ctx.fillStyle='#555';ctx.font='13px sans-serif';ctx.fillText('Дистанція',cx,ty);ty+=3;
  ctx.fillStyle='#333';ctx.font='bold 26px sans-serif';ctx.fillText(Math.floor(dist)+' м',cx,ty+22);ty+=35;
  ctx.fillStyle='#888';ctx.font='11px sans-serif';
  ctx.fillText('Рекорд: '+highScore+' м   Монети: +'+runCoins+(maxCombo>2?'   Комбо: x'+maxCombo:''),cx,ty+5);ty+=25;
  // Retry
  const rw=pw*.68,rh=44,rx=cx-rw/2,ry=ty+5;
  const rg=ctx.createLinearGradient(rx,ry,rx,ry+rh);rg.addColorStop(0,'#66BB6A');rg.addColorStop(1,'#43A047');ctx.fillStyle=rg;rr(rx,ry,rw,rh,22);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('▶ СПРОБУВАТИ ЗНОВУ',cx,ry+rh/2+5);
  ty=ry+rh+12;ctx.fillStyle='rgba(0,0,0,.08)';rr(rx,ty,rw,36,18);ctx.fill();ctx.fillStyle='#666';ctx.font='13px sans-serif';ctx.fillText('ГОЛОВНЕ МЕНЮ',cx,ty+22);
  ctx.globalAlpha=1;ctx.restore();
}
function handleOverTap(x,y){
  const pw=Math.min(W*.82,310),cx=W/2,rw=pw*.68,rx=cx-rw/2;
  let ty=(H/2-(newRecord?360:330)/2)+25;if(newRecord)ty+=30;ty+=40+45+3+35+25+5;
  if(x>=rx&&x<=rx+rw&&y>=ty&&y<=ty+44){startGame();return}
  ty+=44+12;if(x>=rx&&x<=rx+rw&&y>=ty&&y<=ty+36){sfxClick();state=ST.MENU}
}

// ===================== SKINS =====================
function drawSkins(){
  drawBg();drawWater();ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.95)';rr(8,8,W-16,46,14);ctx.fill();
  ctx.fillStyle='#333';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('🐸 СКІНИ',W/2,38);
  ctx.fillStyle='#666';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText('← Назад',22,38);
  ctx.fillStyle='#FFD700';ctx.font='bold 12px sans-serif';ctx.textAlign='right';ctx.fillText('🪙 '+totalCoins,W-20,38);
  const cw=Math.min(W-30,280),ch=72,sy=70;
  for(let i=0;i<SKINS.length;i++){
    const s=SKINS[i],cx=W/2-cw/2,cy=sy+i*(ch+8);
    if(cy<-ch||cy>H)continue;
    ctx.fillStyle=i===curSkin?'rgba(76,175,80,.15)':'rgba(255,255,255,.88)';rr(cx,cy,cw,ch,14);ctx.fill();
    if(i===curSkin){ctx.strokeStyle='#4CAF50';ctx.lineWidth=2.5;rr(cx,cy,cw,ch,14);ctx.stroke()}
    ctx.save();const os=curSkin;curSkin=i;drawFrog(cx+38,cy+ch/2,.6,0,1,1,false,0);curSkin=os;ctx.restore();
    ctx.fillStyle='#333';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText(s.n,cx+70,cy+28);
    if(s.o){ctx.fillStyle=i===curSkin?'#4CAF50':'#888';ctx.font='12px sans-serif';ctx.fillText(i===curSkin?'✅ Обрано':'Натисніть',cx+70,cy+48)}
    else{ctx.fillStyle='#FF9800';ctx.font='bold 12px sans-serif';ctx.fillText('🪙 '+s.p,cx+70,cy+48)}
  }
}
function handleSkinsTap(x,y){
  if(y<55&&x<90){sfxClick();state=ST.MENU;return}
  const cw=Math.min(W-30,280),ch=72,sy=70;
  for(let i=0;i<SKINS.length;i++){const cx=W/2-cw/2,cy=sy+i*(ch+8);
    if(x>=cx&&x<=cx+cw&&y>=cy&&y<=cy+ch){const s=SKINS[i];
      if(s.o){curSkin=i;sfxClick();saveSkins()}
      else if(totalCoins>=s.p){totalCoins-=s.p;s.o=true;curSkin=i;localStorage.setItem('fCoins',''+totalCoins);sfxPU();saveSkins()}
      else sfxLand();return}}
}

// ===================== MAIN LOOP =====================
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.04);lastT=ts;
  ctx.clearRect(0,0,W,H);

  switch(state){
    case ST.MENU:drawMenu();break;
    case ST.PLAY:updateGame(dt);drawGame();break;
    case ST.OVER:drawGame();drawOver();break;
    case ST.SKINS:drawSkins();break;
  }
  requestAnimationFrame(loop);
}
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
initClouds();requestAnimationFrame(loop);
</script>
