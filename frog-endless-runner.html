<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Frog Runner 🐸</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

// ========== UTILS ==========
function lerp(a,b,t){return a+(b-a)*t}
function sd(c,t,s,d){return c+(t-c)*(1-Math.exp(-s*d))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

// ========== CONSTANTS ==========
const ST={MENU:0,PLAY:1,OVER:2,SKINS:3};
const START_SPD=2.0;
const MAX_SPD=4.2;
const RAMP_TIME=45;
const FOCAL_LEN=3.5;
const VIEW_Z=3.0;
const VIEW_AHEAD=18;
const PAD_SPACE_START=3.2; // big gaps — only 4-5 pads visible
const PAD_SPACE_END=2.4;   // late-game: tighter but still roomy

// ========== STATE ==========
let state=ST.MENU,gt=0;
let seq=0,spd=START_SPD,lane=1,visLane=1,lastIdx=-1;
let playTime=0;
let alive=true,falling=false,fallT=0;
let dist=0,score=0,runCoins=0;
let hs=+localStorage.getItem('fHS')||0;
let coins=+localStorage.getItem('fCoins')||0;
let newRec=false;
let shield=false,magnet=false,magnetT=0,boost=false,boostT=0;
let shFlash=0,pfFlash=0,shake=0,shX=0,shY=0,goT=0;
let pads=[],genLane=1;
let pts=[],floats=[],clouds=[],bflies=[];
let spdLines=[];

// ========== PARALLAX SIDE OBJECTS (object pooling) ==========
// 4 layers: 0=far bg, 1=mid bg, 2=near bg, 3=foreground
const SIDE_LAYERS=[
  {speed:.15,count:8,minZ:.1,maxZ:.35,types:['mountain_tree','dead_tree']},
  {speed:.3,count:10,minZ:.2,maxZ:.5,types:['bush','reeds','rock']},
  {speed:.55,count:8,minZ:.3,maxZ:.65,types:['swamp_tree','lantern','tall_reeds']},
  {speed:.85,count:6,minZ:.5,maxZ:.85,types:['close_bush','firefly_cluster','lily_cluster']}
];
let sideObjects=[]; // pooled
function initSideObjects(){
  sideObjects=[];
  for(let li=0;li<SIDE_LAYERS.length;li++){
    const layer=SIDE_LAYERS[li];
    for(let i=0;i<layer.count;i++){
      sideObjects.push(createSideObj(li,rand(0,1)));
    }
  }
}
function createSideObj(layerIdx,progress){
  const layer=SIDE_LAYERS[layerIdx];
  const type=layer.types[Math.floor(Math.random()*layer.types.length)];
  const side=Math.random()<.5?-1:1;
  return{
    layer:layerIdx,type,side,
    z:lerp(layer.minZ,layer.maxZ,progress), // normalized depth 0-1
    xOff:rand(.62,1.05), // pushed further out for wider road
    scale:rand(.7,1.3),
    phase:rand(0,Math.PI*2),
    active:true
  };
}
function updSideObjects(dt){
  for(const obj of sideObjects){
    const layer=SIDE_LAYERS[obj.layer];
    obj.z-=spd*dt*.08*layer.speed;
    if(obj.z<layer.minZ-.1){
      // recycle
      obj.z=layer.maxZ+rand(0,.1);
      obj.side=Math.random()<.5?-1:1;
      obj.xOff=rand(.62,1.05);
      obj.scale=rand(.7,1.3);
      obj.phase=rand(0,Math.PI*2);
      const types=layer.types;
      obj.type=types[Math.floor(Math.random()*types.length)];
    }
  }
}
function drawSideObj(obj){
  // Map obj.z (0-1) to screen position using perspective
  const screenZ=obj.z*VIEW_AHEAD;
  const p=FOCAL_LEN/(screenZ+FOCAL_LEN);
  const vanY=H*.18,baseY=H*.93;
  const y=vanY+(baseY-vanY)*p;
  const halfW=W/2;
  const x=halfW+obj.side*halfW*obj.xOff*p*1.6;
  const s=p*obj.scale;

  if(s<.03||y<H*.1||y>H*.95)return;

  const sway=Math.sin(gt*1.2+obj.phase)*2*s;
  ctx.save();ctx.translate(x+sway,y);

  switch(obj.type){
    case 'mountain_tree':case 'dead_tree':{
      // Silhouette tree
      const h=50*s,w=8*s;
      ctx.fillStyle=obj.layer===0?'rgba(8,30,30,.6)':'rgba(10,40,35,.7)';
      ctx.fillRect(-w/2,-h,w,h);
      // Canopy
      ctx.beginPath();ctx.moveTo(-18*s,-h);ctx.lineTo(0,-h-25*s);ctx.lineTo(18*s,-h);ctx.closePath();ctx.fill();
      if(obj.type==='dead_tree'){
        ctx.beginPath();ctx.moveTo(-12*s,-h+8*s);ctx.lineTo(0,-h-15*s);ctx.lineTo(12*s,-h+8*s);ctx.closePath();ctx.fill();
      } else {
        ctx.beginPath();ctx.moveTo(-14*s,-h-5*s);ctx.lineTo(0,-h-32*s);ctx.lineTo(14*s,-h-5*s);ctx.closePath();ctx.fill();
      }
      break;
    }
    case 'bush':{
      const bsz=14*s;
      ctx.fillStyle='rgba(15,50,40,.65)';
      ctx.beginPath();ctx.ellipse(0,-bsz*.4,bsz,bsz*.7,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(20,65,50,.5)';
      ctx.beginPath();ctx.ellipse(-bsz*.4,-bsz*.2,bsz*.6,bsz*.5,0,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'reeds':case 'tall_reeds':{
      const h=obj.type==='tall_reeds'?45*s:30*s;
      const count=obj.type==='tall_reeds'?5:3;
      for(let i=0;i<count;i++){
        const rx=(-count/2+i)*4*s;
        const rsway=Math.sin(gt*1.5+obj.phase+i*.8)*3*s;
        ctx.strokeStyle=`rgba(40,100,70,${.4+obj.layer*.1})`;
        ctx.lineWidth=1.5*s;
        ctx.beginPath();ctx.moveTo(rx,0);
        ctx.quadraticCurveTo(rx+rsway,-h*.5,rx+rsway*1.5,-h);
        ctx.stroke();
        // tip
        ctx.fillStyle='rgba(60,120,80,.4)';
        ctx.beginPath();ctx.ellipse(rx+rsway*1.5,-h,2*s,4*s,0,0,Math.PI*2);ctx.fill();
      }
      break;
    }
    case 'rock':{
      const rsz=12*s;
      ctx.fillStyle='rgba(25,45,45,.6)';
      ctx.beginPath();
      ctx.moveTo(-rsz,0);ctx.lineTo(-rsz*.8,-rsz*.6);ctx.lineTo(-rsz*.2,-rsz);
      ctx.lineTo(rsz*.5,-rsz*.7);ctx.lineTo(rsz,0);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(35,60,55,.4)';
      ctx.beginPath();ctx.moveTo(-rsz*.6,-rsz*.3);ctx.lineTo(-rsz*.2,-rsz*.8);ctx.lineTo(rsz*.2,-rsz*.5);ctx.lineTo(-rsz*.1,-rsz*.2);ctx.closePath();ctx.fill();
      break;
    }
    case 'swamp_tree':{
      const h=55*s,w=6*s;
      ctx.fillStyle='rgba(15,45,35,.7)';
      // Trunk
      ctx.fillRect(-w/2,-h,w,h);
      // Hanging moss
      ctx.strokeStyle='rgba(40,90,60,.35)';ctx.lineWidth=1*s;
      for(let i=0;i<4;i++){
        const mx=(-2+i)*6*s,my=-h+10*s*i;
        const msway=Math.sin(gt+obj.phase+i)*4*s;
        ctx.beginPath();ctx.moveTo(mx,my);
        ctx.quadraticCurveTo(mx+msway,my+12*s,mx+msway*.5,my+20*s);ctx.stroke();
      }
      // Canopy
      ctx.fillStyle='rgba(12,50,40,.6)';
      ctx.beginPath();ctx.ellipse(0,-h,22*s,15*s,0,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'lantern':{
      const h=35*s;
      ctx.strokeStyle='rgba(60,80,70,.6)';ctx.lineWidth=2*s;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-h);ctx.stroke();
      // Lantern glow
      const pulse=.5+Math.sin(gt*2+obj.phase)*.3;
      const lg=ctx.createRadialGradient(0,-h,0,0,-h,15*s);
      lg.addColorStop(0,`rgba(255,200,80,${.3*pulse})`);
      lg.addColorStop(.5,`rgba(255,160,40,${.12*pulse})`);
      lg.addColorStop(1,'rgba(255,140,20,0)');
      ctx.fillStyle=lg;ctx.beginPath();ctx.arc(0,-h,15*s,0,Math.PI*2);ctx.fill();
      // Lamp body
      ctx.fillStyle=`rgba(255,200,100,${.6*pulse})`;
      ctx.beginPath();ctx.arc(0,-h,3*s,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'close_bush':{
      const bsz=18*s;
      ctx.fillStyle='rgba(12,45,35,.55)';
      ctx.beginPath();ctx.ellipse(0,-bsz*.3,bsz,bsz*.6,0,0,Math.PI*2);ctx.fill();
      // Detail leaves
      for(let i=0;i<3;i++){
        const la=Math.PI*2*i/3+gt*.3+obj.phase;
        ctx.fillStyle='rgba(20,60,45,.4)';
        ctx.beginPath();ctx.ellipse(Math.cos(la)*bsz*.5,-bsz*.3+Math.sin(la)*bsz*.3,bsz*.3,bsz*.2,la,0,Math.PI*2);ctx.fill();
      }
      break;
    }
    case 'firefly_cluster':{
      for(let i=0;i<4;i++){
        const fx=Math.sin(gt*1.5+obj.phase+i*2.5)*10*s;
        const fy=Math.cos(gt*1.2+obj.phase+i*1.8)*8*s-10*s;
        const pulse=.3+Math.sin(gt*3+i*1.7+obj.phase)*.3;
        const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,5*s);
        fg.addColorStop(0,`rgba(180,255,100,${pulse})`);
        fg.addColorStop(1,'rgba(180,255,100,0)');
        ctx.fillStyle=fg;ctx.beginPath();ctx.arc(fx,fy,5*s,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=`rgba(200,255,150,${pulse})`;ctx.beginPath();ctx.arc(fx,fy,1*s,0,Math.PI*2);ctx.fill();
      }
      break;
    }
    case 'lily_cluster':{
      for(let i=0;i<3;i++){
        const lx=(i-1)*8*s;
        const wave=Math.sin(gt+obj.phase+i)*1.5*s;
        ctx.fillStyle='rgba(30,80,50,.5)';
        ctx.beginPath();ctx.ellipse(lx,wave,6*s,3*s,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(50,100,70,.3)';ctx.lineWidth=.5*s;
        ctx.beginPath();ctx.moveTo(lx,wave);ctx.lineTo(lx+4*s,wave-2*s);ctx.stroke();
      }
      break;
    }
  }
  ctx.restore();
}

// ========== ATMOSPHERE PARTICLES (pooled) ==========
const MAX_ATMO=40;
let atmoParticles=[];
function initAtmo(){
  atmoParticles=[];
  for(let i=0;i<MAX_ATMO;i++) atmoParticles.push(createAtmo());
}
function createAtmo(){
  const type=Math.random()<.4?'firefly':(Math.random()<.5?'dust':'spark');
  return{
    x:rand(0,W),y:rand(H*.15,H*.85),
    vx:rand(-.3,.3),vy:rand(-.2,-.05),
    size:type==='firefly'?rand(1.5,3):rand(.5,1.5),
    phase:rand(0,Math.PI*2),
    life:rand(.5,3),maxLife:3,
    type,active:true
  };
}
function updAtmo(dt){
  for(const p of atmoParticles){
    p.x+=p.vx*dt*20;
    p.y+=p.vy*dt*20;
    p.life-=dt;
    if(p.life<=0||p.x<-20||p.x>W+20||p.y<H*.05){
      // recycle
      p.x=rand(0,W);p.y=rand(H*.4,H*.85);
      p.vx=rand(-.3,.3);p.vy=rand(-.2,-.05);
      p.life=rand(1,3);p.phase=rand(0,Math.PI*2);
      p.type=Math.random()<.4?'firefly':(Math.random()<.5?'dust':'spark');
      p.size=p.type==='firefly'?rand(1.5,3):rand(.5,1.5);
    }
  }
}
function drawAtmo(){
  for(const p of atmoParticles){
    const a=clamp(p.life/1,.0,1)*.6;
    if(p.type==='firefly'){
      const pulse=.3+Math.sin(gt*4+p.phase)*.4;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3);
      g.addColorStop(0,`rgba(180,255,120,${a*pulse})`);
      g.addColorStop(1,'rgba(180,255,120,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(220,255,180,${a*pulse})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*.6,0,Math.PI*2);ctx.fill();
    } else if(p.type==='dust'){
      ctx.fillStyle=`rgba(180,220,200,${a*.3})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    } else { // spark
      const sparkA=a*(.3+Math.sin(gt*6+p.phase)*.2);
      ctx.fillStyle=`rgba(255,220,150,${sparkA})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*.8,0,Math.PI*2);ctx.fill();
    }
  }
}

// ========== CENTER LANE GLOW ==========
function drawCenterGlow(){
  // Glowing center strip — guides the eye
  ctx.save();
  for(let z=0;z<VIEW_AHEAD;z+=.15){
    const p=project(z,1); // center lane
    const nextP=project(z+.15,1);
    const a=clamp(1-z/VIEW_AHEAD,.0,1)*.08;
    const pulse=1+Math.sin(gt*2-z*.5)*.3;

    ctx.strokeStyle=`rgba(100,255,200,${a*pulse})`;
    ctx.lineWidth=3*p.s;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nextP.x,nextP.y);ctx.stroke();
  }

  // Leading particles along center
  for(let i=0;i<8;i++){
    const pz=((gt*spd*.5+i*.5)%VIEW_AHEAD);
    const p=project(pz,1);
    const a=clamp(1-pz/VIEW_AHEAD,0,1)*.35;
    const pulse=.5+Math.sin(gt*5+i*2)*.5;
    ctx.fillStyle=`rgba(120,255,200,${a*pulse})`;
    ctx.beginPath();ctx.arc(p.x,p.y,2*p.s,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ========== LANDING RIPPLE EFFECT ==========
let ripples=[];
function addRipple(x,y,s){
  ripples.push({x,y,s,t:0,maxT:.6});
}
function updRipples(dt){
  for(let i=ripples.length-1;i>=0;i--){
    ripples[i].t+=dt;
    if(ripples[i].t>=ripples[i].maxT) ripples.splice(i,1);
  }
}
function drawRipples(){
  for(const r of ripples){
    const prog=r.t/r.maxT;
    const a=(1-prog)*.4;
    const radius=(10+prog*35)*r.s;
    ctx.strokeStyle=`rgba(100,220,200,${a})`;
    ctx.lineWidth=2*r.s*(1-prog);
    ctx.beginPath();ctx.ellipse(r.x,r.y,radius,radius*.3,0,0,Math.PI*2);ctx.stroke();
    // Second ripple ring
    if(prog>.15){
      const prog2=prog-.15;
      const a2=(1-prog2/.85)*.2;
      const r2=(5+prog2*25)*r.s;
      ctx.strokeStyle=`rgba(100,220,200,${a2})`;
      ctx.lineWidth=1.5*r.s*(1-prog2);
      ctx.beginPath();ctx.ellipse(r.x,r.y,r2,r2*.3,0,0,Math.PI*2);ctx.stroke();
    }
  }
}

// ========== SKINS ==========
const SKINS=[
  {n:'Класична',c:'#4CAF50',e:'#222',ch:'#FF8A80',p:0,o:true},
  {n:'Блакитна',c:'#42A5F5',e:'#1A237E',ch:'#90CAF9',p:100,o:false},
  {n:'Рожева',c:'#F48FB1',e:'#880E4F',ch:'#FCE4EC',p:150,o:false},
  {n:'Фіолетова',c:'#AB47BC',e:'#4A148C',ch:'#E1BEE7',p:200,o:false},
  {n:'Золота',c:'#FFD54F',e:'#F57F17',ch:'#FFF9C4',p:500,o:false},
  {n:'Райдужна',c:'rainbow',e:'#333',ch:'#FFB3B3',p:1000,o:false},
];
let curSkin=0;
try{const s=JSON.parse(localStorage.getItem('fSk')||'[]');s.forEach((v,i)=>{if(SKINS[i])SKINS[i].o=v});curSkin=+(localStorage.getItem('fCS')||0)}catch(e){}
function saveSkins(){localStorage.setItem('fSk',JSON.stringify(SKINS.map(s=>s.o)));localStorage.setItem('fCS',''+curSkin)}

// ========== AUDIO ==========
let ac=null,sfxG=null,musG=null,musOn=false,musIv=null;
function initAudio(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();sfxG=ac.createGain();sfxG.gain.value=0.25;sfxG.connect(ac.destination);musG=ac.createGain();musG.gain.value=0.08;musG.connect(ac.destination)}
function tone(f,d,tp='sine',v=0.2,dl=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=tp;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+d);o.connect(g);g.connect(sfxG);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d)}
function noise(d,v=.15){if(!ac)return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),dd=b.getChannelData(0);for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*v;const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=1;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);s.connect(g);g.connect(sfxG);s.start()}
function sfxLand(){tone(280,.08,'triangle',.12);tone(180,.05,'sine',.06,.02);noise(.03,.05)}
function sfxPerfect(){tone(880,.1,'sine',.14);tone(1100,.1,'sine',.09,.06);tone(1320,.12,'sine',.07,.12)}
function sfxCoin(){tone(1300,.07,'square',.07);tone(1700,.08,'square',.05,.03)}
function sfxCombo(){tone(660,.08,'sine',.1);tone(990,.1,'sine',.07,.05)}
function sfxPU(){for(let i=0;i<4;i++)tone(500+i*250,.1,'sine',.07,i*.03)}
function sfxSplash(){noise(.3,.22);tone(180,.2,'sine',.1)}
function sfxDie(){tone(440,.2,'sine',.12);tone(330,.2,'sine',.1,.1);tone(220,.3,'sine',.08,.2)}
function sfxClick(){tone(900,.05,'square',.07)}
function sfxSwipe(){tone(600,.04,'sine',.06);tone(800,.03,'sine',.04,.02)}
const MEL=[523,659,784,659,523,587,659,784,880,784,659,523,587,523,659,784];
let melI=0;
function startMus(){if(musOn)return;musOn=true;melI=0;musIv=setInterval(()=>{if(!ac||state!==ST.PLAY)return;const f=MEL[melI%MEL.length];if(f){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.03;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g);g.connect(musG);o.start();o.stop(ac.currentTime+.18)}melI++},160)}
function stopMus(){musOn=false;if(musIv){clearInterval(musIv);musIv=null}}

// ========== PAD GENERATION (scattered, difficulty-based, wider spacing) ==========
function getPadSpacing(){
  // Difficulty ramp: start far apart (easy), get closer (harder) but still comfortable
  const diff=clamp(playTime/RAMP_TIME,0,1);
  return lerp(PAD_SPACE_START,PAD_SPACE_END,diff);
}

function nextPadLane(curLane,diff){
  const sameness=.85-diff*.7;
  if(Math.random()<sameness) return curLane;
  if(diff<.4){
    if(curLane===0)return 1;
    if(curLane===2)return 1;
    return Math.random()<.5?0:2;
  }
  const options=[0,1,2].filter(l=>l!==curLane);
  return options[Math.floor(Math.random()*options.length)];
}

// Track cumulative position for pads with variable spacing
let padPositions=[]; // seq-position of each pad

function ensurePads(){
  const needed=Math.floor(seq/getPadSpacing())+Math.ceil(VIEW_AHEAD/getPadSpacing())+8;
  while(pads.length<needed){
    const diff=Math.min(dist/50,1);
    const l=nextPadLane(genLane,diff);
    genLane=l;

    // Calculate position for this pad
    const spacing=getPadSpacing();
    const lastPos=padPositions.length>0?padPositions[padPositions.length-1]:0;
    padPositions.push(lastPos+spacing);

    let hasCoin=Math.random()<(.18+diff*.1);
    let pu=null;
    if(Math.random()<.015&&dist>5)
      pu=['shield','magnet','boost','superjump'][Math.floor(Math.random()*4)];
    const type=Math.random()<.05?'flower':(Math.random()<.03&&dist>8?'gold':'normal');

    // Add slight X variation — pads aren't locked to rigid grid
    const xVar=rand(-.15,.15); // small offset from lane center
    pads.push({lane:l,laneX:l+xVar,type,coin:hasCoin,pu,landed:false,dip:0,riskCoin:null});
  }
}

// ========== PROJECTION (true 1/z perspective) ==========
function project(relZ,l){
  const depth=Math.max(relZ,0.01);
  const p=FOCAL_LEN/(depth+FOCAL_LEN);
  const vanY=H*.18,baseY=H*.93;
  const y=vanY+(baseY-vanY)*p;
  const lw=W*.48*p; // wide road like Tiles Hop
  const x=W/2+(l-1)*lw;
  return{x,y,s:Math.max(p,.02)};
}

// ========== INPUT (DRAG / HOLD — frog follows finger horizontally) ==========
let touching=false,frogCont=1;
let tSX=0,tSY=0,tST=0;

function xToLane(sx){
  const margin=W*.12;
  return clamp((sx-margin)/(W-margin*2),0,1)*2;
}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  const t=e.touches[0];tSX=t.clientX;tSY=t.clientY;tST=Date.now();
  if(state===ST.PLAY&&alive){touching=true;frogCont=xToLane(t.clientX);lane=Math.round(frogCont)}
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(state===ST.PLAY&&alive&&touching){
    const t=e.touches[0];
    frogCont=xToLane(t.clientX);lane=Math.round(frogCont);
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];if(!t)return;
  const dx=t.clientX-tSX,dy=t.clientY-tSY;
  const d=Math.sqrt(dx*dx+dy*dy);
  const dt=Date.now()-tST;
  if(state===ST.PLAY&&alive){lane=Math.round(frogCont);touching=false}
  if(d<30&&dt<300){
    if(state===ST.MENU)menuTap(t.clientX,t.clientY);
    else if(state===ST.OVER)overTap(t.clientX,t.clientY);
    else if(state===ST.SKINS)skinsTap(t.clientX,t.clientY);
  }
},{passive:false});

let mouseDown=false;
canvas.addEventListener('mousedown',e=>{
  initAudio();tSX=e.clientX;tSY=e.clientY;tST=Date.now();mouseDown=true;
  if(state===ST.PLAY&&alive){touching=true;frogCont=xToLane(e.clientX);lane=Math.round(frogCont)}
});
canvas.addEventListener('mousemove',e=>{
  if(mouseDown&&state===ST.PLAY&&alive&&touching){frogCont=xToLane(e.clientX);lane=Math.round(frogCont)}
});
canvas.addEventListener('mouseup',e=>{
  mouseDown=false;
  if(state===ST.PLAY&&alive){lane=Math.round(frogCont);touching=false}
  const d=Math.sqrt((e.clientX-tSX)**2+(e.clientY-tSY)**2);
  if(d<30&&Date.now()-tST<300){
    if(state===ST.MENU)menuTap(e.clientX,e.clientY);
    else if(state===ST.OVER)overTap(e.clientX,e.clientY);
    else if(state===ST.SKINS)skinsTap(e.clientX,e.clientY);
  }
});
document.addEventListener('keydown',e=>{
  initAudio();
  if(state===ST.PLAY){
    if(e.key==='ArrowLeft'||e.key==='a'){frogCont=clamp(frogCont-1,0,2);lane=Math.round(frogCont)}
    if(e.key==='ArrowRight'||e.key==='d'){frogCont=clamp(frogCont+1,0,2);lane=Math.round(frogCont)}
  }else if(state===ST.MENU&&(e.key==='Enter'||e.key===' '))startGame();
  else if(state===ST.OVER){if(e.key==='Enter'||e.key===' ')startGame();if(e.key==='Escape')state=ST.MENU}
  else if(state===ST.SKINS&&e.key==='Escape')state=ST.MENU;
});

// ========== PARTICLES ==========
function addP(x,y,vx,vy,col,sz,life,tp='c'){pts.push({x,y,vx,vy,col,sz,life,ml:life,tp,a:1})}
function addSplash(x,y,sc){for(let i=0;i<10;i++){const a=Math.PI*2*i/10+rand(-.2,.2);const s=rand(1.5,3)*sc;addP(x,y,Math.cos(a)*s*.07,Math.sin(a)*s*.07-.05,'rgba(140,215,255,.7)',rand(1.5,3.5),rand(.25,.45))}}
function addPerfFX(x,y){for(let i=0;i<15;i++){const a=Math.PI*2*i/15;const s=rand(.04,.08);const cols=['#FFD700','#FFF176','#FFEB3B','#FF9800','#FFF','#4FC3F7'];addP(x,y,Math.cos(a)*s,Math.sin(a)*s-.02,cols[i%6],rand(2,4.5),rand(.35,.55),'s')}}
function addCoinFX(x,y){for(let i=0;i<6;i++){const a=Math.PI*2*i/6;addP(x,y,Math.cos(a)*.035,Math.sin(a)*.035-.015,'#FFD700',rand(1.5,3),rand(.25,.4))}}
function addLandFX(x,y,s){for(let i=0;i<8;i++){const a=Math.PI*2*i/8+rand(0,.4);addP(x,y,Math.cos(a)*.025*s,Math.sin(a)*.01*s,'rgba(100,200,255,.6)',2.5*s,.3)}}
function addTrail(x,y,s){addP(x+rand(-3,3),y+rand(-2,5),0,.015,'rgba(150,230,255,.25)',rand(1,2.5)*s,rand(.12,.2))}
function addFloat(t,x,y,col='#FFD700',sz=20){floats.push({t,x,y,vy:-.04,a:1,l:.8,col,sz,sc:1.4})}
function updPts(dt){
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.002*dt*60;p.life-=dt;p.a=Math.pow(Math.max(0,p.life/p.ml),.6);if(p.life<=0)pts.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy*dt*60;f.vy*=.97;f.l-=dt;f.a=Math.max(0,f.l);f.sc=lerp(f.sc,1,.06);if(f.l<=0)floats.splice(i,1)}
}

// ========== BUTTERFLIES ==========
function initBflies(){bflies=[];for(let i=0;i<6;i++)bflies.push({x:rand(W*.05,W*.95),y:rand(H*.04,H*.25),vx:rand(-.3,.3),vy:rand(-.12,.12),ph:rand(0,6),col:['#69F0AE','#80CBC4','#4FC3F7','#FFF176','#CE93D8','#FF8A80'][i%6]})}
function updBflies(dt){for(const b of bflies){b.x+=b.vx*dt*30;b.y+=b.vy*dt*30+Math.sin(gt*2+b.ph)*.3;b.ph+=dt*5;if(b.x<-10)b.x=W+10;if(b.x>W+10)b.x=-10;if(b.y<H*.03)b.vy=Math.abs(b.vy);if(b.y>H*.3)b.vy=-Math.abs(b.vy)}}

// ========== CLOUDS ==========
function initClouds(){clouds=[];for(let i=0;i<4;i++)clouds.push({x:rand(-50,W+50),y:rand(H*.04,H*.15),sz:rand(30,60),sp:rand(.1,.25),op:rand(.04,.08)})}
function updClouds(dt){for(const c of clouds){c.x+=c.sp*dt*22;if(c.x>W+c.sz+10)c.x=-c.sz-10}}

// ========== SPEED LINES ==========
function updSpdLines(dt){
  const spdFactor=clamp((spd-START_SPD)/(MAX_SPD-START_SPD),0,1);
  const spawnRate=.04+spdFactor*.18;
  if(Math.random()<spawnRate){
    const lineLen=rand(10,22)+spdFactor*15;
    const lineSpd=rand(1.5,3)+spdFactor*2;
    spdLines.push({x:rand(0,W),y:rand(H*.3,H*.75),l:lineLen,a:rand(.04,.12)+spdFactor*.04,sp:lineSpd});
  }
  for(let i=spdLines.length-1;i>=0;i--){
    spdLines[i].y+=spdLines[i].sp*dt*60;
    spdLines[i].a-=dt*1.2;
    if(spdLines[i].a<=0||spdLines[i].y>H)spdLines.splice(i,1);
  }
}

// ========== GAME LOGIC ==========
function startGame(){
  sfxClick();state=ST.PLAY;
  seq=0;spd=START_SPD;lane=1;visLane=1;lastIdx=-1;playTime=0;
  alive=true;falling=false;fallT=0;dist=0;score=0;runCoins=0;
  newRec=false;shield=false;magnet=false;magnetT=0;boost=false;boostT=0;
  shFlash=0;pfFlash=0;shake=0;shX=0;shY=0;
  pads=[];padPositions=[];genLane=1;pts=[];floats=[];spdLines=[];ripples=[];touching=false;frogCont=1;
  // Initial straight pads
  for(let i=0;i<10;i++){
    padPositions.push(i*PAD_SPACE_START);
    pads.push({lane:1,laneX:1,type:'normal',coin:i>3&&Math.random()<.3,pu:null,landed:false,dip:0,riskCoin:null});
  }
  ensurePads();initClouds();initBflies();initSideObjects();initAtmo();startMus();
}

function die(){
  if(!alive)return;
  if(shield){
    shield=false;shFlash=.5;sfxPU();
    addFloat('🛡️',W/2,H*.4,'#4FC3F7',28);
    const nextPadIdx=getCurrentPadIdx()+1;
    const np=pads[nextPadIdx];
    if(np)lane=np.lane;
    return;
  }
  alive=false;falling=true;fallT=0;sfxSplash();sfxDie();stopMus();
  // Splash at frog's actual position
  const ci=getCurrentPadIdx();
  const curP=padPositions[ci]||0;
  const frogRelZ=curP-seq+VIEW_Z;
  const fp=project(Math.max(frogRelZ,.1),visLane);
  addSplash(fp.x,fp.y,2.5);shake=.5;
  if(navigator.vibrate)navigator.vibrate(100);
  const fd=Math.floor(dist);
  if(fd>hs){hs=fd;localStorage.setItem('fHS',''+hs);newRec=true}
  coins+=runCoins;localStorage.setItem('fCoins',''+coins);
  goT=0;setTimeout(()=>{state=ST.OVER},800);
}

// Find which pad index we're currently at based on seq position
function getCurrentPadIdx(){
  for(let i=padPositions.length-1;i>=0;i--){
    if(padPositions[i]<=seq) return i;
  }
  return 0;
}

function onLand(idx){
  const pad=pads[idx];if(!pad)return;
  pad.landed=true;pad.dip=.4;
  sfxLand();score++;
  const padZ=padPositions[idx]-seq+VIEW_Z;
  const lp=project(padZ,pad.laneX||pad.lane);
  addLandFX(lp.x,lp.y,1.2);
  addRipple(lp.x,lp.y+5*lp.s,lp.s); // ripple on landing

  if(pad.coin){pad.coin=false;runCoins++;addCoinFX(lp.x,lp.y-12);sfxCoin()}
  if(pad.type==='gold'){runCoins+=5;addFloat('+5🪙',lp.x,lp.y-35,'#FFD700',18);sfxCoin()}

  if(pad.pu){
    const t=pad.pu;pad.pu=null;sfxPU();
    if(t==='shield'){shield=true;addFloat('🛡️ ЩИТ!',lp.x,lp.y-40,'#4FC3F7',22)}
    else if(t==='magnet'){magnet=true;magnetT=6;addFloat('🧲 МАГНІТ!',lp.x,lp.y-40,'#F44336',22)}
    else if(t==='boost'){boost=true;boostT=4;addFloat('⚡ БУСТ!',lp.x,lp.y-40,'#FFEB3B',22)}
    else if(t==='superjump'){addFloat('🌟 СУПЕР!',lp.x,lp.y-40,'#AB47BC',22)}
  }
}

function updateGame(dt){
  if(!alive){fallT+=dt*1.8;updPts(dt);updRipples(dt);return}
  gt+=dt;
  playTime+=dt;

  const rampT=clamp(playTime/RAMP_TIME,0,1);
  const rampedSpd=START_SPD+(MAX_SPD-START_SPD)*(1-Math.pow(1-rampT,2.5));
  spd=boost?rampedSpd*1.3:rampedSpd;
  if(boost){boostT-=dt;if(boostT<=0)boost=false}
  if(magnet){magnetT-=dt;if(magnetT<=0)magnet=false}

  // Core forward movement
  seq+=spd*dt;
  dist+=spd*dt*.5;

  // Landing checks — find current pad based on position
  const curPadIdx=getCurrentPadIdx();
  while(lastIdx<curPadIdx){
    lastIdx++;
    if(lastIdx>=0&&lastIdx<pads.length){
      if(pads[lastIdx].lane===lane){
        onLand(lastIdx);
      }else{
        die();break;
      }
    }
  }

  visLane=sd(visLane,touching?frogCont:lane,18,dt);

  if(shFlash>0)shFlash-=dt*2.5;
  if(pfFlash>0)pfFlash=sd(pfFlash,0,6,dt);
  for(const p of pads)if(p.dip>0)p.dip=sd(p.dip,0,10,dt);
  if(shake>0){shake=sd(shake,0,7,dt);shX=Math.sin(gt*45)*shake*6;shY=Math.cos(gt*51)*shake*5}else{shX=shY=0}

  // Magnet
  if(magnet){
    const ci=getCurrentPadIdx();
    for(let i=ci;i<ci+6&&i<pads.length;i++){
      if(pads[i].coin&&Math.abs(pads[i].lane-lane)<=1){
        pads[i].coin=false;runCoins++;
        const pz=padPositions[i]-seq+VIEW_Z;
        const pp=project(pz,pads[i].lane);
        addCoinFX(pp.x,pp.y);sfxCoin();
      }
    }
  }

  ensurePads();
  // Cleanup old pads
  const minI=getCurrentPadIdx()-3;
  if(minI>12){
    const rm=minI-6;
    pads.splice(0,rm);padPositions.splice(0,rm);lastIdx-=rm;
  }

  updPts(dt);updClouds(dt);updBflies(dt);updSpdLines(dt);
  updSideObjects(dt);updAtmo(dt);updRipples(dt);
}

// ========== DRAWING ==========
function drawBg(){
  const sg=ctx.createLinearGradient(0,0,0,H*.35);
  sg.addColorStop(0,'#0a1628');sg.addColorStop(.4,'#0d2137');sg.addColorStop(.7,'#0f3045');sg.addColorStop(1,'#0a3a3a');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*.35);
  // Moon glow
  const sx=W*.82,sy=H*.08;
  const sng=ctx.createRadialGradient(sx,sy,0,sx,sy,75);
  sng.addColorStop(0,'rgba(200,230,255,.3)');sng.addColorStop(.3,'rgba(150,200,255,.1)');sng.addColorStop(1,'rgba(100,180,255,0)');
  ctx.fillStyle=sng;ctx.fillRect(sx-85,sy-85,170,170);
  ctx.fillStyle='rgba(220,235,255,.6)';ctx.beginPath();ctx.arc(sx,sy,12,0,Math.PI*2);ctx.fill();
  // Stars
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<25;i++){
    const stx=(i*137.5+47)%W,sty=(i*73.1+13)%(H*.25);
    const ss=.5+Math.sin(gt*2+i*3)*.4;
    if(ss>.5){ctx.beginPath();ctx.arc(stx,sty,ss,0,Math.PI*2);ctx.fill()}
  }
  // Dark mountains
  const mx=Math.sin(gt*.1)*3;
  ctx.fillStyle='#0a2a2a';ctx.beginPath();ctx.moveTo(0,H*.28);
  ctx.lineTo(W*.12+mx,H*.17);ctx.lineTo(W*.28+mx*.5,H*.24);ctx.lineTo(W*.48+mx,H*.12);ctx.lineTo(W*.68+mx*.7,H*.20);ctx.lineTo(W*.82+mx,H*.14);ctx.lineTo(W,H*.22);
  ctx.lineTo(W,H*.32);ctx.lineTo(0,H*.32);ctx.closePath();ctx.fill();
  // Tree silhouettes
  ctx.fillStyle='#082020';
  for(let i=0;i<12;i++){
    const tx=i/12*W+Math.sin(i*3.7+gt*.3)*8+mx*.5;
    const ty=H*.27+Math.sin(i*2.1)*6;
    const ts=10+Math.sin(i*4.3)*4;
    ctx.beginPath();ctx.moveTo(tx-ts*.5,ty);ctx.lineTo(tx,ty-ts*1.4);ctx.lineTo(tx+ts*.5,ty);ctx.closePath();ctx.fill();
  }
  // Firefly dots in sky
  for(const b of bflies){
    const pulse=.4+Math.sin(b.ph)*.3;
    ctx.globalAlpha=pulse;
    const gg=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,6);
    gg.addColorStop(0,b.col);gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,1.5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawWater(){
  const wt=H*.29;
  const wg=ctx.createLinearGradient(0,wt,0,H);
  wg.addColorStop(0,'#0a3535');wg.addColorStop(.3,'#063030');wg.addColorStop(.6,'#042525');wg.addColorStop(1,'#021a1a');
  ctx.fillStyle=wg;ctx.fillRect(0,wt,W,H-wt);

  // Moon reflection on water
  const moonX=W*.82,moonRefY=wt+30;
  const mrg=ctx.createRadialGradient(moonX,moonRefY,0,moonX,moonRefY,40);
  mrg.addColorStop(0,'rgba(200,230,255,.06)');
  mrg.addColorStop(.5,'rgba(150,200,255,.03)');
  mrg.addColorStop(1,'rgba(100,180,255,0)');
  ctx.fillStyle=mrg;ctx.beginPath();ctx.ellipse(moonX,moonRefY,40,15,0,0,Math.PI*2);ctx.fill();
  // Shimmer line
  const shimmer=Math.sin(gt*1.5)*.5+.5;
  ctx.strokeStyle=`rgba(200,230,255,${.04*shimmer})`;ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=moonX-35;x<=moonX+35;x+=3){
    const wy=moonRefY+Math.sin(x*.15+gt*2)*3;
    if(x===moonX-35)ctx.moveTo(x,wy);else ctx.lineTo(x,wy);
  }
  ctx.stroke();

  // Wave ripples
  ctx.strokeStyle='rgba(100,220,200,.06)';ctx.lineWidth=1;
  const woff=gt*spd*10;
  for(let r=0;r<10;r++){
    const wy=wt+15+r*(H-wt)/10;
    ctx.beginPath();
    for(let x=0;x<=W;x+=6){
      const w=Math.sin(x*.02+woff+r*.7)*2.5+Math.sin(x*.035-gt*1.5+r)*1.5+Math.sin(x*.01+gt*.8+r*1.3)*.8;
      if(x===0)ctx.moveTo(x,wy+w);else ctx.lineTo(x,wy+w);
    }
    ctx.stroke();
  }
  // Sparkles
  for(let i=0;i<12;i++){
    const sparkX=((i*137.5+gt*25+woff*.4)%(W+40))-20;
    const sparkY=wt+30+((i*73.1+Math.sin(gt*1.2+i)*12)%(H-wt-30));
    const ss=.8+Math.sin(gt*3+i*2.3)*.6;
    if(ss>.9){ctx.fillStyle='rgba(100,220,200,.25)';ctx.beginPath();ctx.arc(sparkX,sparkY,ss,0,Math.PI*2);ctx.fill()}
  }
  // Speed lines
  for(const sl of spdLines){
    ctx.strokeStyle=`rgba(100,220,200,${sl.a*.5})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sl.x,sl.y);ctx.lineTo(sl.x,sl.y+sl.l);ctx.stroke();
  }
}

function drawPad(x,y,s,type,dip,isCurrent){
  ctx.save();ctx.translate(x,y);

  // 3D square tile — like Tiles Hop
  // Top face is a perspective trapezoid (narrower at back, wider at front)
  const hw=120*s;       // half-width of tile at front edge
  const topNarrow=.82;  // back edge is 82% of front width (perspective)
  const topH=90*s;      // depth of top face (how tall the square looks)
  const sideH=32*s;     // thickness of the 3D box
  const dO=dip*8*s;
  const rad=14*s;

  let c1,c2,c3,glow;
  if(type==='gold'){c1='#FFF176';c2='#FFD54F';c3='#F9A825';glow='rgba(255,215,0,'}
  else if(type==='flower'){c1='#81C784';c2='#66BB6A';c3='#2E7D32';glow='rgba(129,199,132,'}
  else{c1='#66BB6A';c2='#43A047';c3='#1B5E20';glow='rgba(76,175,80,'}

  // Neon glow underneath
  ctx.shadowColor=glow+'.5)';ctx.shadowBlur=30*s;
  ctx.fillStyle=glow+'.01)';
  ctx.fillRect(-hw,-topH+dO,hw*2,topH);
  ctx.shadowBlur=0;

  // === FRONT FACE (3D thickness) ===
  const frontTop=dO;           // where top face ends (front edge)
  const frontBot=sideH+dO;     // bottom of front face
  const fg=ctx.createLinearGradient(0,frontTop,0,frontBot);
  fg.addColorStop(0,c3);fg.addColorStop(.6,darken(c3,30));fg.addColorStop(1,'rgba(0,30,0,.9)');
  ctx.fillStyle=fg;
  // Front face — rounded rect
  rr(-hw,frontTop,hw*2,sideH,rad*.5);ctx.fill();

  // === LEFT SIDE FACE ===
  const backHW=hw*topNarrow;
  ctx.fillStyle=darken(c3,20);
  ctx.beginPath();
  ctx.moveTo(-hw,frontTop);              // front-left top
  ctx.lineTo(-backHW,-topH+dO);          // back-left top
  ctx.lineTo(-backHW,-topH+sideH*.3+dO); // back-left bottom (less visible)
  ctx.lineTo(-hw,frontBot);              // front-left bottom
  ctx.closePath();ctx.fill();

  // === RIGHT SIDE FACE ===
  ctx.fillStyle=darken(c3,35);
  ctx.beginPath();
  ctx.moveTo(hw,frontTop);
  ctx.lineTo(backHW,-topH+dO);
  ctx.lineTo(backHW,-topH+sideH*.3+dO);
  ctx.lineTo(hw,frontBot);
  ctx.closePath();ctx.fill();

  // === TOP FACE (perspective trapezoid) ===
  const tg=ctx.createLinearGradient(0,-topH+dO,0,dO);
  tg.addColorStop(0,c1);tg.addColorStop(.4,c2);tg.addColorStop(1,c3);
  ctx.fillStyle=tg;
  ctx.beginPath();
  // Back edge (narrower)
  ctx.moveTo(-backHW+rad*.6,-topH+dO);
  ctx.lineTo(backHW-rad*.6,-topH+dO);
  ctx.quadraticCurveTo(backHW,-topH+dO,backHW,-topH+rad*.4+dO);
  // Right edge
  ctx.lineTo(hw,-rad*.4+dO);
  ctx.quadraticCurveTo(hw,dO,hw-rad,dO);
  // Front edge (wider)
  ctx.lineTo(-hw+rad,dO);
  ctx.quadraticCurveTo(-hw,dO,-hw,-rad*.4+dO);
  // Left edge
  ctx.lineTo(-backHW,-topH+rad*.4+dO);
  ctx.quadraticCurveTo(-backHW,-topH+dO,-backHW+rad*.6,-topH+dO);
  ctx.closePath();ctx.fill();

  // Neon border on top face
  ctx.shadowColor=glow+'.6)';ctx.shadowBlur=15*s;
  ctx.strokeStyle=glow+'.8)';ctx.lineWidth=3*s;
  ctx.stroke(); // strokes the same trapezoid path
  ctx.shadowBlur=0;

  // Inner border glow
  const inset=5*s;
  const ib=backHW-inset,ih=hw-inset;
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.5*s;
  ctx.beginPath();
  ctx.moveTo(-ib+rad*.4,-topH+inset+dO);
  ctx.lineTo(ib-rad*.4,-topH+inset+dO);
  ctx.quadraticCurveTo(ib,-topH+inset+dO,ib,-topH+inset+rad*.3+dO);
  ctx.lineTo(ih,-inset-rad*.3+dO);
  ctx.quadraticCurveTo(ih,-inset+dO,ih-rad,-inset+dO);
  ctx.lineTo(-ih+rad,-inset+dO);
  ctx.quadraticCurveTo(-ih,-inset+dO,-ih,-inset-rad*.3+dO);
  ctx.lineTo(-ib,-topH+inset+rad*.3+dO);
  ctx.quadraticCurveTo(-ib,-topH+inset+dO,-ib+rad*.4,-topH+inset+dO);
  ctx.closePath();ctx.stroke();

  // Center glow on top face
  const centerY=-topH*.45+dO;
  const cg=ctx.createRadialGradient(0,centerY,0,0,centerY,hw*.5);
  cg.addColorStop(0,'rgba(255,255,255,.1)');
  cg.addColorStop(1,'rgba(200,255,220,0)');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.ellipse(0,centerY,hw*.5,topH*.25,0,0,Math.PI*2);ctx.fill();

  // Diamond icon at center
  const ds=14*s;
  ctx.save();ctx.translate(0,centerY);ctx.rotate(Math.PI/4);
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.fillRect(-ds,-ds,ds*2,ds*2);
  const dg=ctx.createRadialGradient(0,0,0,0,0,ds);
  dg.addColorStop(0,'rgba(255,255,200,.2)');dg.addColorStop(1,'rgba(255,255,200,0)');
  ctx.fillStyle=dg;ctx.fillRect(-ds,-ds,ds*2,ds*2);
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.5*s;
  ctx.strokeRect(-ds*.6,-ds*.6,ds*1.2,ds*1.2);
  ctx.restore();

  // Gloss highlight across top
  ctx.fillStyle='rgba(255,255,255,.1)';
  ctx.beginPath();
  ctx.ellipse(0,-topH*.7+dO,hw*.6,topH*.12,0,0,Math.PI*2);
  ctx.fill();

  // Flower decoration
  if(type==='flower'){
    const fc=['#F48FB1','#CE93D8','#FFB74D','#FFF176'][Math.floor(gt*.6)%4];
    for(let i=0;i<5;i++){const a=Math.PI*2*i/5+gt*.5;
      ctx.fillStyle=fc;ctx.beginPath();
      ctx.ellipse(hw*.3+Math.cos(a)*4*s,centerY+Math.sin(a)*4*s,5*s,3*s,a,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(hw*.3,centerY,3*s,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

function getSkinCol(){const sk=SKINS[curSkin];return sk.c==='rainbow'?`hsl(${(gt*60)%360},70%,55%)`:sk.c}
function lighten(h,a){if(h.startsWith('hsl'))return h;const n=parseInt(h.replace('#',''),16);return`rgb(${Math.min(255,((n>>16)&255)+a)},${Math.min(255,((n>>8)&255)+a)},${Math.min(255,(n&255)+a)})`}
function darken(h,a){if(h.startsWith('hsl'))return h;const n=parseInt(h.replace('#',''),16);return`rgb(${Math.max(0,((n>>16)&255)-a)},${Math.max(0,((n>>8)&255)-a)},${Math.max(0,(n&255)-a)})`}

function drawFrog(x,y,sc,rot,sqX,sqY,inAir,height){

  ctx.fillStyle=`rgba(0,0,0,${shA})`;ctx.beginPath();ctx.ellipse(0,s*.5+height*20,s*(1.1-height*.2),s*.25,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=bc;
  if(inAir){ctx.beginPath();ctx.ellipse(-s*.75,s*.55,s*.45,s*.22,.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.75,s*.55,s*.45,s*.22,-.5,0,Math.PI*2);ctx.fill()}
  else{ctx.beginPath();ctx.ellipse(-s*.65,s*.25,s*.4,s*.28,.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.65,s*.25,s*.4,s*.28,-.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-s,s*.45,s*.28,s*.12,.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s,s*.45,s*.28,s*.12,-.2,0,Math.PI*2);ctx.fill()}
  const bg=ctx.createRadialGradient(-2,-s*.15,0,0,0,s*1.1);bg.addColorStop(0,lighten(bc,25));bg.addColorStop(.7,bc);bg.addColorStop(1,darken(bc,15));
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,s*.95,s*.8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=lighten(bc,45);ctx.beginPath();ctx.ellipse(0,s*.12,s*.55,s*.4,0,0,Math.PI*2);ctx.fill();
  const hy=-s*.8;
  const hg=ctx.createRadialGradient(-2,hy-2,0,0,hy,s*1.05);hg.addColorStop(0,lighten(bc,25));hg.addColorStop(.8,bc);hg.addColorStop(1,darken(bc,12));
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,hy,s*1.05,s*.85,0,0,Math.PI*2);ctx.fill();
  const es=s*.35,ey=hy-s*.12;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.38,ey,es,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.38,ey,es,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=darken(bc,25);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(-s*.38,ey,es,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(s*.38,ey,es,0,Math.PI*2);ctx.stroke();
  const blink=Math.sin(gt*2)>.96?.1:1;
  ctx.fillStyle=sk.e;ctx.beginPath();ctx.ellipse(-s*.38,ey+1,es*.45,es*.45*blink,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.38,ey+1,es*.45,es*.45*blink,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(-s*.38-1.5,ey-2.5,es*.18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.38-1.5,ey-2.5,es*.18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=sk.ch;ctx.globalAlpha=.4;ctx.beginPath();ctx.ellipse(-s*.65,hy+s*.18,s*.22,s*.12,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.65,hy+s*.18,s*.22,s*.12,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=darken(bc,35);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,hy+s*.22,s*.28,.1,Math.PI-.1);ctx.stroke();
  ctx.fillStyle=bc;ctx.beginPath();ctx.ellipse(-s*.8,s*.08,s*.18,s*.12,.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.8,s*.08,s*.18,s*.12,-.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.ellipse(-2,hy-s*.28,s*.45,s*.25,-.2,0,Math.PI*2);ctx.fill();

}

function drawPts(){
  for(const p of pts){ctx.globalAlpha=p.a;ctx.fillStyle=p.col;
    if(p.tp==='s'){ctx.beginPath();for(let i=0;i<5;i++){const a=Math.PI*2*i/5-Math.PI/2,r=p.sz*p.a;ctx.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);const ia=a+Math.PI/5;ctx.lineTo(p.x+Math.cos(ia)*r*.4,p.y+Math.sin(ia)*r*.4)}ctx.closePath();ctx.fill()}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.a,0,Math.PI*2);ctx.fill()}}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=f.a;ctx.fillStyle=f.col;ctx.font=`bold ${f.sz*f.sc}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=3;ctx.fillText(f.t,f.x,f.y);ctx.shadowBlur=0}
  ctx.globalAlpha=1;
}

function drawGame(){
  ctx.save();ctx.translate(shX,shY);
  drawBg();drawWater();

  // Draw far parallax layers (0,1) — behind everything
  for(const obj of sideObjects){
    if(obj.layer<=1)drawSideObj(obj);
  }

  // Road surface — filled lane area like Tiles Hop
  ctx.beginPath();
  const roadLeft=[],roadRight=[];
  for(let z=VIEW_AHEAD;z>=0;z-=.2){
    const pl=project(z,-.25);
    roadLeft.push(pl);
  }
  for(let z=0;z<=VIEW_AHEAD;z+=.2){
    const pr=project(z,2.25);
    roadRight.push(pr);
  }
  ctx.moveTo(roadLeft[0].x,roadLeft[0].y);
  for(const p of roadLeft)ctx.lineTo(p.x,p.y);
  for(const p of roadRight)ctx.lineTo(p.x,p.y);
  ctx.closePath();
  const roadGrad=ctx.createLinearGradient(0,H*.18,0,H*.93);
  roadGrad.addColorStop(0,'rgba(20,80,60,.15)');
  roadGrad.addColorStop(.5,'rgba(25,90,65,.2)');
  roadGrad.addColorStop(1,'rgba(30,100,70,.25)');
  ctx.fillStyle=roadGrad;ctx.fill();
  // Road edge glow
  ctx.strokeStyle='rgba(100,255,180,.2)';ctx.lineWidth=2;
  ctx.beginPath();
  for(let z=0;z<VIEW_AHEAD;z+=.2){
    const p=project(z,-.25);
    if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
  ctx.beginPath();
  for(let z=0;z<VIEW_AHEAD;z+=.2){
    const p=project(z,2.25);
    if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();

  // Center lane glow
  drawCenterGlow();

  // Lane dividers (subtle)
  for(let dl=.5;dl<=1.5;dl+=1){
    ctx.strokeStyle='rgba(100,220,200,.06)';ctx.lineWidth=.8;
    ctx.beginPath();
    for(let z=0;z<VIEW_AHEAD;z+=.5){
      const p=project(z,dl);
      if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }

  // Draw mid parallax layers (2) — between lane lines and pads
  for(const obj of sideObjects){
    if(obj.layer===2)drawSideObj(obj);
  }

  // Draw pads far to near
  const si=Math.max(0,getCurrentPadIdx()-2);
  const ei=Math.min(pads.length,getCurrentPadIdx()+Math.ceil(VIEW_AHEAD/getPadSpacing())+4);
  const order=[];
  for(let i=si;i<ei;i++){
    const rz=padPositions[i]-seq+VIEW_Z;
    if(rz<-.5||rz>VIEW_AHEAD)continue;
    order.push({i,rz});
  }
  order.sort((a,b)=>b.rz-a.rz);

  const curIdx=getCurrentPadIdx();
  for(const{i,rz}of order){
    const pad=pads[i];
    const p=project(rz,pad.laneX||pad.lane);
    drawPad(p.x,p.y,p.s,pad.type,pad.dip,i===curIdx);
    if(pad.coin)drawCoin(p.x,p.y,p.s,i*1.7);
    if(pad.pu)drawPUIcon(p.x,p.y,p.s,pad.pu,i*2.3);
    if(pad.riskCoin!==null){
      const rp=project(rz,pad.riskCoin);
      drawCoin(rp.x,rp.y,rp.s*.8,i*2.1);
    }
  }

  // Landing ripples (on water surface, after pads)
  drawRipples();

  // Draw frog — anchored to actual pad positions
  if(alive||fallT<1.2){
    // Find current and next pad to interpolate between
    const curIdx=getCurrentPadIdx();
    const nextIdx=Math.min(curIdx+1,padPositions.length-1);
    const curPos=padPositions[curIdx]||0;
    const nextPos=padPositions[nextIdx]||curPos+1;
    const gap=nextPos-curPos;
    const bounce=gap>0?clamp((seq-curPos)/gap,0,1):0;

    // Improved jump curve: more hang time at peak, snappier takeoff/landing
    const rawAir=Math.sin(bounce*Math.PI);
    const airness=Math.pow(rawAir,.7);

    // Enhanced squash/stretch
    let sqX,sqY;
    if(bounce<.15){
      const t=bounce/.15;
      sqX=1+.22*(1-t);
      sqY=1-.18*(1-t);
    } else if(bounce<.5){
      const t=(bounce-.15)/.35;
      sqX=1-.12*t;
      sqY=1+.15*t;
    } else if(bounce<.85){
      const t=(bounce-.5)/.35;
      sqX=1-.12*(1-t);
      sqY=1+.15*(1-t);
    } else {
      const t=(bounce-.85)/.15;
      sqX=1+.25*t;
      sqY=1-.2*t;
    }

    const ld=visLane-lane;
    const rot=airness*.12*clamp(ld,-1,1);

    // Frog Z position: interpolate between current pad and next pad
    const frogZ=lerp(curPos,nextPos,bounce)-seq+VIEW_Z;
    // Frog lane: use visLane for smooth horizontal movement
    const fp=project(frogZ,visLane);
    let fx=fp.x,fy=fp.y,fs=fp.s*1.7;

    if(falling){
      const ft=Math.min(fallT,1);
      fy+=ft*70;fs*=(1-ft*.5);ctx.globalAlpha=1-ft*.9;
    }

    // Frog glow
    ctx.save();
    const fgy=fy-airness*120*fs*.55;
    const fgg=ctx.createRadialGradient(fx,fgy,0,fx,fgy,50*fs);
    fgg.addColorStop(0,'rgba(76,175,80,.14)');fgg.addColorStop(1,'rgba(76,175,80,0)');
    ctx.fillStyle=fgg;ctx.beginPath();ctx.arc(fx,fgy,50*fs,0,Math.PI*2);ctx.fill();
    ctx.restore();

    drawFrog(fx,fy,fs,rot,sqX,sqY,airness>.25,airness*.55);
    ctx.globalAlpha=1;

    // Trail
    if(spd>2.8&&airness>.3){
      const trailChance=clamp((spd-2.8)/1.5,0,.6);
      if(Math.random()<trailChance)addTrail(fx+rand(-4,4),fy+12,.3+trailChance*.4);
    }
  }

  // Near parallax layer (3) — foreground, semi-transparent so it doesn't block view
  ctx.globalAlpha=.6;
  for(const obj of sideObjects){
    if(obj.layer===3)drawSideObj(obj);
  }
  ctx.globalAlpha=1;

  // Atmosphere particles
  drawAtmo();

  drawPts();

  if(pfFlash>0){ctx.fillStyle=`rgba(255,215,0,${pfFlash*.1})`;ctx.fillRect(0,0,W,H)}
  if(shFlash>0){ctx.fillStyle=`rgba(79,195,247,${shFlash*.12})`;ctx.fillRect(0,0,W,H)}
  ctx.restore();

  drawHUD();
}

function drawHUD(){
  ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=6;
  ctx.fillText(score,W/2,32);
  ctx.shadowBlur=0;ctx.textBaseline='alphabetic';

  const bw=W*.35,bh=4,bx=W/2-bw/2,by=52;
  const prog=clamp(dist/100,0,1);
  ctx.fillStyle='rgba(255,255,255,.15)';rr(bx,by,bw,bh,2);ctx.fill();
  if(prog>0){
    const fw=bw*prog;
    ctx.fillStyle='rgba(76,175,80,.8)';rr(bx,by,fw,bh,2);ctx.fill();
    ctx.shadowColor='rgba(76,175,80,.5)';ctx.shadowBlur=6;rr(bx,by,fw,bh,2);ctx.fill();ctx.shadowBlur=0;
  }
  for(let i=0;i<4;i++){
    const dx=bx+bw*((i+1)/5);
    ctx.fillStyle=prog>=(i+1)/5?'rgba(76,175,80,.9)':'rgba(255,255,255,.25)';
    ctx.save();ctx.translate(dx,by+bh/2);ctx.rotate(Math.PI/4);
    ctx.fillRect(-3,-3,6,6);ctx.restore();
  }

  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='bold 14px sans-serif';ctx.textAlign='right';
  ctx.fillText('🪙 '+runCoins,W-14,28);

  let py=H-60;
  if(shield){ctx.fillStyle='rgba(79,195,247,.5)';rr(10,py,80,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText('🛡️ Щит',16,py+15);py-=24}
  if(magnet){ctx.fillStyle='rgba(244,67,54,.5)';rr(10,py,80,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText('🧲 '+Math.ceil(magnetT)+'с',16,py+15);py-=24}
  if(boost){ctx.fillStyle='rgba(255,235,59,.5)';rr(10,py,80,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText('⚡ '+Math.ceil(boostT)+'с',16,py+15);py-=24}
  if(dist<3&&alive){const ha=Math.max(0,1-dist/3)*(0.5+Math.sin(gt*3)*.2);ctx.globalAlpha=ha;ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='15px sans-serif';ctx.textAlign='center';ctx.fillText('☝️ тримай палець і води',W/2,H*.88);ctx.globalAlpha=1}
}

    ctx.fillStyle='rgba(0,0,0,.3)';rr(b.x-35,ny-3,70,45,10);ctx.fill();ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText(b.i,b.x,ny+15);ctx.font='9px sans-serif';ctx.fillText(b.l,b.x,ny+32)});
  ctx.fillStyle='rgba(0,0,0,.3)';rr(W-100,12,90,26,8);ctx.fill();ctx.fillStyle='#FFD700';ctx.font='bold 13px sans-serif';ctx.textAlign='right';ctx.fillText('🪙 '+coins,W-16,30);
}
function menuTap(x,y){
  const bw=190,bh=52,bx=W/2-bw/2,by=H*.58;
  if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){startGame();return}
  if(y>H-70&&x<W*.35){sfxClick();state=ST.SKINS}
}

// ========== GAME OVER ==========
function drawOver(){
  goT=Math.min(goT+.03,1);
  ctx.fillStyle=`rgba(0,0,0,${.45*goT})`;ctx.fillRect(0,0,W,H);
  const pw=Math.min(W*.82,310),ph=newRec?360:330,px=W/2-pw/2,py=H/2-ph/2;
  ctx.save();ctx.translate(W/2,H/2);const as=.5+goT*.5;ctx.scale(as,as);ctx.translate(-W/2,-H/2);ctx.globalAlpha=goT;
  ctx.fillStyle='rgba(10,30,30,.92)';rr(px,py,pw,ph,22);ctx.fill();
  ctx.strokeStyle='rgba(76,175,80,.3)';ctx.lineWidth=1.5;rr(px,py,pw,ph,22);ctx.stroke();
  const cx=W/2;let ty=py+25;
  if(newRec){ctx.fillStyle='#FFD700';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('🏆 НОВИЙ РЕКОРД! 🏆',cx,ty+8);ty+=30}
  ctx.fillStyle='#F44336';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('ГРА ЗАКІНЧЕНА',cx,ty+10);ty+=45;
  ctx.font='42px sans-serif';ctx.fillText('🐸💧',cx,ty+8);ty+=50;
  ctx.fillStyle='rgba(150,230,200,.6)';ctx.font='15px sans-serif';ctx.fillText('Дистанція',cx,ty);ty+=3;
  ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.fillText(Math.floor(dist)+' м',cx,ty+24);ty+=40;
  ctx.fillStyle='rgba(150,200,200,.5)';ctx.font='13px sans-serif';
  ctx.fillText('Рекорд: '+hs+' м   Монети: +'+runCoins,cx,ty+5);ty+=25;
  const rw=pw*.68,rh=44,rx=cx-rw/2,ry=ty+5;
  ctx.shadowColor='rgba(76,175,80,.4)';ctx.shadowBlur=12;
  const rg=ctx.createLinearGradient(rx,ry,rx,ry+rh);rg.addColorStop(0,'#66BB6A');rg.addColorStop(1,'#388E3C');ctx.fillStyle=rg;rr(rx,ry,rw,rh,22);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('▶ СПРОБУВАТИ ЗНОВУ',cx,ry+rh/2+5);
  ty=ry+rh+12;ctx.fillStyle='rgba(255,255,255,.08)';rr(rx,ty,rw,36,18);ctx.fill();ctx.fillStyle='rgba(200,230,220,.5)';ctx.font='13px sans-serif';ctx.fillText('ГОЛОВНЕ МЕНЮ',cx,ty+22);
  ctx.globalAlpha=1;ctx.restore();
}
function overTap(x,y){
  const pw=Math.min(W*.82,310),cx=W/2,rw=pw*.68,rx=cx-rw/2;
  let ty=(H/2-(newRec?360:330)/2)+25;if(newRec)ty+=30;ty+=40+45+3+35+25+5;
  if(x>=rx&&x<=rx+rw&&y>=ty&&y<=ty+44){startGame();return}
  ty+=44+12;if(x>=rx&&x<=rx+rw&&y>=ty&&y<=ty+36){sfxClick();state=ST.MENU}
}

// ========== SKINS ==========
function drawSkins(){
  drawBg();drawWater();ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(10,30,30,.9)';rr(8,8,W-16,46,14);ctx.fill();
  ctx.strokeStyle='rgba(76,175,80,.3)';ctx.lineWidth=1;rr(8,8,W-16,46,14);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('🐸 СКІНИ',W/2,38);
  ctx.fillStyle='rgba(150,230,200,.6)';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText('← Назад',22,38);
  ctx.fillStyle='#FFD700';ctx.font='bold 12px sans-serif';ctx.textAlign='right';ctx.fillText('🪙 '+coins,W-20,38);
  const cw=Math.min(W-30,280),ch=72,sy=70;
  for(let i=0;i<SKINS.length;i++){
    const s=SKINS[i],cx=W/2-cw/2,cy=sy+i*(ch+8);
    if(cy<-ch||cy>H)continue;
    ctx.fillStyle=i===curSkin?'rgba(76,175,80,.15)':'rgba(10,30,30,.85)';rr(cx,cy,cw,ch,14);ctx.fill();
    if(i===curSkin){ctx.strokeStyle='rgba(76,175,80,.6)';ctx.lineWidth=2;rr(cx,cy,cw,ch,14);ctx.stroke()}
    else{ctx.strokeStyle='rgba(100,200,180,.15)';ctx.lineWidth=1;rr(cx,cy,cw,ch,14);ctx.stroke()}
    ctx.save();const os=curSkin;curSkin=i;drawFrog(cx+38,cy+ch/2,.6,0,1,1,false,0);curSkin=os;ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText(s.n,cx+70,cy+28);
    if(s.o){ctx.fillStyle=i===curSkin?'#69F0AE':'rgba(150,200,200,.5)';ctx.font='12px sans-serif';ctx.fillText(i===curSkin?'✅ Обрано':'Натисніть',cx+70,cy+48)}
    else{ctx.fillStyle='#FF9800';ctx.font='bold 12px sans-serif';ctx.fillText('🪙 '+s.p,cx+70,cy+48)}
  }
}
function skinsTap(x,y){
  if(y<55&&x<90){sfxClick();state=ST.MENU;return}
  const cw=Math.min(W-30,280),ch=72,sy=70;
  for(let i=0;i<SKINS.length;i++){const cx=W/2-cw/2,cy=sy+i*(ch+8);
    if(x>=cx&&x<=cx+cw&&y>=cy&&y<=cy+ch){const s=SKINS[i];
      if(s.o){curSkin=i;sfxClick();saveSkins()}
      else if(coins>=s.p){coins-=s.p;s.o=true;curSkin=i;localStorage.setItem('fCoins',''+coins);sfxPU();saveSkins()}
      else sfxLand();return}}
}

// ========== MAIN LOOP ==========
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.035);lastT=ts;
  ctx.clearRect(0,0,W,H);
  switch(state){
    case ST.MENU:drawMenu();break;
    case ST.PLAY:updateGame(dt);drawGame();break;
    case ST.OVER:drawGame();drawOver();break;
    case ST.SKINS:drawSkins();break;
  }
  requestAnimationFrame(loop);
}
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
initClouds();initBflies();initSideObjects();initAtmo();requestAnimationFrame(loop);
</script>
