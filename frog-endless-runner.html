const _SI={},_SL={};
for(const [k,v] of Object.entries(_SD)){const i=new Image();i.onload=()=>{_SL[k]=true};i.src="data:image/webp;base64,"+v;_SI[k]=i}

function getSkinCol(){const sk=SKINS[curSkin];return sk.c==='rainbow'?`hsl(${(gt*60)%360},70%,55%)`:sk.c}
function lighten(h,a){if(h.startsWith('hsl'))return h;const n=parseInt(h.replace('#',''),16);return`rgb(${Math.min(255,((n>>16)&255)+a)},${Math.min(255,((n>>8)&255)+a)},${Math.min(255,(n&255)+a)})`}
function darken(h,a){if(h.startsWith('hsl'))return h;const n=parseInt(h.replace('#',''),16);return`rgb(${Math.max(0,((n>>16)&255)-a)},${Math.max(0,((n>>8)&255)-a)},${Math.max(0,(n&255)-a)})`}

function drawFrog(x,y,sc,rot,sqX,sqY,inAir,height,spriteHint){
  ctx.save();ctx.translate(x,y-height*180*sc);ctx.rotate(rot);ctx.scale(sc*sqX,sc*sqY);

  // --- Choose sprite based on game state (or use hint) ---
  let spName=spriteHint||'idle';
  if(!spriteHint){
    if(falling){
      spName='scared';
    } else if(inAir){
      spName=fever?'spinglow':(Math.abs(rot)>1.5?'spin':'fly');
    } else if(sqY<.85){
      spName='squish'; // landing squash
    } else if(sqY>1.1){
      spName='jumpup'; // launch stretch
    } else if(perfectCombo>=3){
      spName='happy';
    } else if(boost){
      spName='slide';
    } else if(perfectCombo>=1){
      spName='wink';
    } else {
      spName='normal';
    }
  }

  const sprImg=_SI[spName];
  const sprLoaded=_SL[spName];
  const s=28;

  // Shield aura
  if(shield){ctx.strokeStyle='rgba(255,193,7,.5)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-s*.2,s*2,0,Math.PI*2);ctx.stroke()}

  // Shadow
  const shA=clamp(.15-height*.08,0,.15);
  ctx.fillStyle=`rgba(0,0,0,${shA})`;ctx.beginPath();ctx.ellipse(0,s*.7+height*35,s*(1-height*.2),s*.2,0,0,Math.PI*2);ctx.fill();

  if(sprLoaded&&sprImg&&sprImg.naturalWidth>0){
    // Draw sprite — center it on character origin
    const aspR=sprImg.naturalWidth/sprImg.naturalHeight;
    const drawH=70; // sprite height in local coords
    const drawW=drawH*aspR;
    ctx.drawImage(sprImg,-drawW/2,-drawH+10,drawW,drawH);
  } else {
    // Procedural fallback while sprites load
    const sk=SKINS[curSkin],bc=getSkinCol();
    const antCol=sk.ant||'#69F0AE';
    ctx.fillStyle=darken(bc,30);
    if(inAir){
      ctx.beginPath();ctx.ellipse(-s*.35,s*.65,s*.22,s*.1,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(s*.35,s*.65,s*.22,s*.1,0,0,Math.PI*2);ctx.fill();
    } else {
      ctx.beginPath();ctx.ellipse(-s*.4,s*.7,s*.28,s*.12,.1,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(s*.4,s*.7,s*.28,s*.12,-.1,0,Math.PI*2);ctx.fill();
    }
    const bw=s*.85,bh=s*1.35,by=-s*.35;
    const bg=ctx.createRadialGradient(-3,by,0,0,by+bh*.3,s*1.3);
    bg.addColorStop(0,lighten(bc,30));bg.addColorStop(.5,bc);bg.addColorStop(1,darken(bc,20));
    ctx.fillStyle=bg;rr(-bw,by-bh*.5,bw*2,bh,bw*.65);ctx.fill();
    ctx.fillStyle=lighten(bc,50);ctx.globalAlpha=.35;
    ctx.beginPath();ctx.ellipse(0,by+bh*.15,bw*.55,bh*.3,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.shadowColor=bc;ctx.shadowBlur=8;ctx.strokeStyle=lighten(bc,20);ctx.lineWidth=1.5;
    rr(-bw,by-bh*.5,bw*2,bh,bw*.65);ctx.stroke();ctx.shadowBlur=0;
    const armWave=inAir?Math.sin(gt*8)*.25:Math.sin(gt*3)*.1;
    ctx.fillStyle=bc;
    ctx.save();ctx.translate(-bw-.5,by+bh*.1);ctx.rotate(-.4+armWave);
    ctx.beginPath();ctx.ellipse(0,0,s*.15,s*.35,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=lighten(bc,20);ctx.beginPath();ctx.arc(0,s*.32,s*.12,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle=bc;ctx.save();ctx.translate(bw+.5,by+bh*.1);ctx.rotate(.4-armWave);
    ctx.beginPath();ctx.ellipse(0,0,s*.15,s*.35,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=lighten(bc,20);ctx.beginPath();ctx.arc(0,s*.32,s*.12,0,Math.PI*2);ctx.fill();ctx.restore();
    const antBob=Math.sin(gt*4)*.08;const antX=0,antY=by-bh*.5;
    ctx.strokeStyle=darken(bc,15);ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(antX,antY);
    ctx.quadraticCurveTo(antX+Math.sin(gt*3)*4,antY-s*.5,antX+Math.sin(gt*2.5)*2,antY-s*.85+antBob*s);ctx.stroke();
    const abX=antX+Math.sin(gt*2.5)*2,abY=antY-s*.85+antBob*s;
    const ag=ctx.createRadialGradient(abX,abY,0,abX,abY,s*.25);
    ag.addColorStop(0,'rgba(255,255,255,.9)');ag.addColorStop(.4,antCol);ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag;ctx.beginPath();ctx.arc(abX,abY,s*.25,0,Math.PI*2);ctx.fill();
    ctx.shadowColor=antCol;ctx.shadowBlur=12;ctx.fillStyle=antCol;ctx.beginPath();ctx.arc(abX,abY,s*.1,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    const ey=by-bh*.05;const leS=s*.38,reS=s*.32;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.28,ey,leS,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(s*.28,ey,reS,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=darken(bc,30);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(-s*.28,ey,leS,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(s*.28,ey,reS,0,Math.PI*2);ctx.stroke();
    const blink=Math.sin(gt*2)>.96?.1:1;ctx.fillStyle=sk.e;
    ctx.beginPath();ctx.ellipse(-s*.28,ey+1,leS*.48,leS*.48*blink,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*.28,ey+1,reS*.48,reS*.48*blink,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.beginPath();ctx.arc(-s*.28-2,ey-3,leS*.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(s*.28-1.5,ey-2.5,reS*.18,0,Math.PI*2);ctx.fill();
    const mouthY=ey+s*.52;
    if(inAir){ctx.fillStyle=darken(bc,45);ctx.beginPath();ctx.ellipse(0,mouthY,s*.15,s*.12,0,0,Math.PI*2);ctx.fill();}
    else{ctx.strokeStyle=darken(bc,40);ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,mouthY-s*.08,s*.2,.15,Math.PI-.15);ctx.stroke();}
    ctx.fillStyle=sk.ch;ctx.globalAlpha=.3;
    ctx.beginPath();ctx.ellipse(-s*.55,ey+s*.3,s*.15,s*.1,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*.55,ey+s*.3,s*.15,s*.1,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,.12)';
    ctx.beginPath();ctx.ellipse(-s*.15,by-bh*.3,bw*.5,bh*.15,-.15,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

function drawCoin(x,y,s,bob){
  const b=Math.sin(gt*4.5+bob)*3;
  ctx.save();ctx.translate(x,y-25*s+b);ctx.scale(s,s);
  const gg=ctx.createRadialGradient(0,0,3,0,0,16);gg.addColorStop(0,'rgba(255,215,0,.3)');gg.addColorStop(1,'rgba(255,215,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  const cg=ctx.createRadialGradient(-2,-2,0,0,0,11);cg.addColorStop(0,'#FFF176');cg.addColorStop(.6,'#FFD54F');cg.addColorStop(1,'#FFA000');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#FFA000';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(-3,-3,3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawPUIcon(x,y,s,type,bob){
  const b=Math.sin(gt*3.5+bob)*5;ctx.save();ctx.translate(x,y-28*s+b);ctx.scale(s,s);
  let gc;
  if(type==='shield')gc='79,195,247';else if(type==='magnet')gc='244,67,54';else if(type==='boost')gc='255,235,59';else gc='171,71,188';
  const gg=ctx.createRadialGradient(0,0,5,0,0,22);gg.addColorStop(0,`rgba(${gc},.4)`);gg.addColorStop(1,`rgba(${gc},0)`);ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
  ctx.font='22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText({shield:'🛡️',magnet:'🧲',boost:'⚡',superjump:'🌟'}[type]||'?',0,0);
  ctx.restore();
}

function drawPts(){
  for(const p of pts){ctx.globalAlpha=p.a;ctx.fillStyle=p.col;
    if(p.tp==='s'){ctx.beginPath();for(let i=0;i<5;i++){const a=Math.PI*2*i/5-Math.PI/2,r=p.sz*p.a;ctx.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);const ia=a+Math.PI/5;ctx.lineTo(p.x+Math.cos(ia)*r*.4,p.y+Math.sin(ia)*r*.4)}ctx.closePath();ctx.fill()}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.a,0,Math.PI*2);ctx.fill()}}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=f.a;ctx.fillStyle=f.col;ctx.font=`bold ${f.sz*f.sc}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=3;ctx.fillText(f.t,f.x,f.y);ctx.shadowBlur=0}
  ctx.globalAlpha=1;
}

function drawGame(){
  ctx.save();ctx.translate(shX,shY);
  drawBg();drawWater();

  // Far parallax layers (0,1)
  for(const obj of sideObjects){
    if(obj.layer<=1)drawSideObj(obj);
  }

  // Road surface
  const ROAD_EDGE=-.75;
  const ROAD_EDGE_R=2.75;
  ctx.beginPath();
  const roadLeft=[],roadRight=[];
  for(let z=VIEW_AHEAD;z>=0;z-=.2){
    const pl=project(z,ROAD_EDGE);
    roadLeft.push(pl);
  }
  for(let z=0;z<=VIEW_AHEAD;z+=.2){
    const pr=project(z,ROAD_EDGE_R);
    roadRight.push(pr);
  }
  ctx.moveTo(roadLeft[0].x,roadLeft[0].y);
  for(const p of roadLeft)ctx.lineTo(p.x,p.y);
  for(const p of roadRight)ctx.lineTo(p.x,p.y);
  ctx.closePath();
  const roadGrad=ctx.createLinearGradient(0,H*.18,0,H*.93);
  roadGrad.addColorStop(0,'rgba(200,230,200,.15)');
  roadGrad.addColorStop(.5,'rgba(100,180,100,.12)');
  roadGrad.addColorStop(1,'rgba(50,120,50,.18)');
  ctx.fillStyle=roadGrad;ctx.fill();

  // Road edge — soft glow
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2.5;
  ctx.shadowColor='rgba(255,255,200,.4)';ctx.shadowBlur=8;
  ctx.beginPath();
  for(let z=0;z<VIEW_AHEAD;z+=.2){
    const p=project(z,ROAD_EDGE);
    if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
  ctx.beginPath();
  for(let z=0;z<VIEW_AHEAD;z+=.2){
    const p=project(z,ROAD_EDGE_R);
    if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
  ctx.shadowBlur=0;

  drawCenterGlow();

  // Grid lines (subtle depth cue)
  for(let gl=0;gl<=2;gl+=.5){
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=.6;
    ctx.beginPath();
    for(let z=0;z<VIEW_AHEAD;z+=.5){
      const p=project(z,gl);
      if(z===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }

  // Mid parallax (2)
  for(const obj of sideObjects){
    if(obj.layer===2)drawSideObj(obj);
  }

  // Draw platforms far to near
  const si=Math.max(0,getCurrentPadIdx()-2);
  const ei=Math.min(pads.length,getCurrentPadIdx()+Math.ceil(VIEW_AHEAD/4.5)+4);
  const order=[];
  for(let i=si;i<ei;i++){
    const rz=padPositions[i]-seq+VIEW_Z;
    if(rz<-.5||rz>VIEW_AHEAD)continue;
    order.push({i,rz});
  }
  order.sort((a,b)=>b.rz-a.rz);

  const curIdx=getCurrentPadIdx();
  for(const{i,rz}of order){
    const pad=pads[i];
    // Don't draw broken/disappeared platforms
    if(pad.broken) continue;
    if(pad.disappeared) continue;
    // Falling offset
    let extraY=0;
    if(pad.type==='falling'&&pad.fallOffset>0) extraY=pad.fallOffset*20;
    if(pad.fallOffset&&pad.fallOffset>8) continue; // fallen off screen
    const p=project(rz,pad.gameX);
    p.y+=extraY*p.s;
    // Depth-based alpha — farther = slightly darker
    const depthAlpha=clamp(1-rz/VIEW_AHEAD*.35, 0.45, 1);
    // Breakable platforms flicker when cracking
    const breakFlicker=(pad.type==='breakable'&&pad.breakTimer>0)?(.5+.5*Math.sin(gt*30)):1;
    // Disappearing platforms fade
    const disappearFade=(pad.type==='disappear')?pad.disappearAlpha:1;
    ctx.globalAlpha=depthAlpha*breakFlicker*disappearFade;
    drawPad(p.x,p.y,p.s,pad.type,pad.dip,i===curIdx,pad.width);
    // Diamond path overlay
    if(pad.diamond&&diamondPath){
      ctx.save();ctx.translate(p.x,p.y);
      const dhw=120*p.s*(pad.width||1);
      const dcy=p.y-55*p.s*(pad.width||1);
      // Cyan glow border
      ctx.strokeStyle=`rgba(0,188,212,${.5+.2*Math.sin(gt*5)})`;ctx.lineWidth=3*p.s;
      ctx.shadowColor='rgba(0,188,212,.6)';ctx.shadowBlur=15*p.s;
      rr(-dhw,-55*p.s*(pad.width||1)*2,dhw*2,55*p.s*(pad.width||1)*2,12*p.s);ctx.stroke();
      ctx.shadowBlur=0;
      // Diamond icon floating above
      ctx.font=`${20*p.s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('💎',0,-55*p.s*(pad.width||1)*2-15*p.s+Math.sin(gt*3)*5*p.s);
      ctx.restore();
    }
    // Moving platform indicator — small arrows on sides
    if(pad.moving){
      const arrowS=18*p.s;
      const hw=120*p.s*(pad.width||1);
      const cy=p.y-55*p.s*(pad.width||1);
      const phase=Math.sin(gt*pad.moving.spd+pad.moving.phase);
      ctx.save();
      ctx.globalAlpha=depthAlpha*(.3+.2*Math.abs(phase));
      ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2*p.s;
      // Left arrow
      ctx.beginPath();ctx.moveTo(p.x-hw-arrowS*.5,cy);ctx.lineTo(p.x-hw-arrowS*1.5,cy);
      ctx.moveTo(p.x-hw-arrowS*1.5,cy);ctx.lineTo(p.x-hw-arrowS*1.1,cy-arrowS*.4);
      ctx.moveTo(p.x-hw-arrowS*1.5,cy);ctx.lineTo(p.x-hw-arrowS*1.1,cy+arrowS*.4);
      ctx.stroke();
      // Right arrow
      ctx.beginPath();ctx.moveTo(p.x+hw+arrowS*.5,cy);ctx.lineTo(p.x+hw+arrowS*1.5,cy);
      ctx.moveTo(p.x+hw+arrowS*1.5,cy);ctx.lineTo(p.x+hw+arrowS*1.1,cy-arrowS*.4);
      ctx.moveTo(p.x+hw+arrowS*1.5,cy);ctx.lineTo(p.x+hw+arrowS*1.1,cy+arrowS*.4);
      ctx.stroke();
      ctx.restore();
    }
    // Trap lane — draw colored sections overlay
    if(pad.type==='trap_lane'){
      const tlHw=120*p.s*(pad.width||1);
      const tlHh=55*p.s*(pad.width||1);
      const tlCy=p.y-tlHh;
      const secW=tlHw*2/3;
      const rad2=16*p.s;
      for(let sec=0;sec<3;sec++){
        const sx=p.x-tlHw+sec*secW;
        const isSafe=sec===pad.safeZone;
        if(isSafe){
          // Green safe section
          ctx.fillStyle='rgba(76,175,80,.3)';
          rr(sx+2,p.y-tlHh*2+pad.dip*8*p.s+4,secW-4,tlHh*2-8,sec===0?rad2:sec===2?rad2:4);ctx.fill();
          // Checkmark
          ctx.fillStyle='rgba(76,175,80,.7)';ctx.font=`bold ${14*p.s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('✓',sx+secW/2,tlCy+pad.dip*4*p.s);
        } else {
          // Red trap section with X
          ctx.fillStyle='rgba(244,67,54,.3)';
          rr(sx+2,p.y-tlHh*2+pad.dip*8*p.s+4,secW-4,tlHh*2-8,sec===0?rad2:sec===2?rad2:4);ctx.fill();
          // Spike triangles
          const spkCount=3;
          ctx.fillStyle='rgba(244,67,54,.5)';
          for(let si2=0;si2<spkCount;si2++){
            const spX=sx+secW*(si2+0.5)/spkCount;
            const spY=p.y-tlHh*2+pad.dip*8*p.s+8;
            ctx.beginPath();ctx.moveTo(spX,spY);ctx.lineTo(spX-6*p.s,spY+14*p.s);ctx.lineTo(spX+6*p.s,spY+14*p.s);ctx.fill();
          }
          // X mark
          ctx.strokeStyle='rgba(255,100,100,.6)';ctx.lineWidth=2.5*p.s;
          const xc=sx+secW/2,yc=tlCy+pad.dip*4*p.s;
          ctx.beginPath();ctx.moveTo(xc-8*p.s,yc-8*p.s);ctx.lineTo(xc+8*p.s,yc+8*p.s);ctx.stroke();
          ctx.beginPath();ctx.moveTo(xc+8*p.s,yc-8*p.s);ctx.lineTo(xc-8*p.s,yc+8*p.s);ctx.stroke();
        }
      }
    }
    // Ring pad — draw floating ring above platform
    if(pad.type==='ring_pad'&&!pad.ringCollected){
      const ringY=p.y-160*p.s;
      const ringW=40*p.s;
      const ringH=16*p.s;
      const ringBob=Math.sin(gt*2+i)*5*p.s;
      ctx.save();
      ctx.globalAlpha=depthAlpha*.9;
      // Outer ring
      ctx.strokeStyle='#FFD700';ctx.lineWidth=5*p.s;
      ctx.shadowColor='rgba(255,215,0,.7)';ctx.shadowBlur=15*p.s;
      ctx.beginPath();ctx.ellipse(p.x,ringY+ringBob,ringW,ringH,0,0,Math.PI*2);ctx.stroke();
      // Inner highlight
      ctx.strokeStyle='rgba(255,255,200,.5)';ctx.lineWidth=2*p.s;
      ctx.shadowBlur=0;
      ctx.beginPath();ctx.ellipse(p.x,ringY+ringBob,ringW*.65,ringH*.65,0,0,Math.PI*2);ctx.stroke();
      // Sparkle on ring
      const spkA=gt*3;
      ctx.fillStyle='#FFF';
      ctx.beginPath();ctx.arc(p.x+Math.cos(spkA)*ringW,ringY+ringBob+Math.sin(spkA)*ringH,3*p.s,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=depthAlpha;
    if(pad.coin)drawCoin(p.x,p.y,p.s,i*1.7);
    if(pad.pu)drawPUIcon(p.x,p.y,p.s,pad.pu,i*2.3);
    ctx.globalAlpha=1;
  }

  drawRipples();

  // Draw frog — anchored to actual pad positions with parabolic arc
  if(alive||fallT<1.2){
    const curIdx2=getCurrentPadIdx();
    const nextIdx=Math.min(curIdx2+1,padPositions.length-1);
    const curPos=padPositions[curIdx2]||0;
    const nextPos=padPositions[nextIdx]||curPos+1;
    const gap=nextPos-curPos;
    const bounce=gap>0?clamp((seq-curPos)/gap,0,1):0;

    // Jump curve with hang time at peak
    const rawAir=Math.sin(bounce*Math.PI);
    // Spring platforms boost jump height 1.6x
    const springMult=(curIdx2>=0&&curIdx2<pads.length&&pads[curIdx2].springBoost)?1.6:1;
    const airness=Math.pow(rawAir,.65)*springMult;

    // Squash/stretch phases
    let sqX,sqY;
    if(bounce<.12){
      const t=bounce/.12;
      sqX=1+.25*(1-t);sqY=1-.2*(1-t);
    } else if(bounce<.45){
      const t=(bounce-.12)/.33;
      sqX=1-.14*t;sqY=1+.18*t;
    } else if(bounce<.88){
      const t=(bounce-.45)/.43;
      sqX=1-.14*(1-t);sqY=1+.18*(1-t);
    } else {
      const t=(bounce-.88)/.12;
      sqX=1+.28*t;sqY=1-.22*t;
    }

    // Frog X follows player input — no snapping to platform center
    const jumpLaneX=visLane;

    // Lean toward movement direction + 360° forward spin in air
    const moveDir=frogCont-visLane; // positive=right, negative=left
    const leanAmt=clamp(moveDir*1.2,-0.6,0.6); // max ~35° lean
    const spinAngle=airness>0.2 ? bounce*Math.PI*2 : 0; // 360° only in air
    const rot=leanAmt*airness + spinAngle*airness;

    const frogZ=lerp(curPos,nextPos,bounce)-seq+VIEW_Z;
    const fp=project(frogZ,jumpLaneX);
    let fx=fp.x,fy=fp.y,fs=fp.s*1.7;

    if(falling){
      const ft=Math.min(fallT,1);
      fy+=ft*70;fs*=(1-ft*.5);ctx.globalAlpha=1-ft*.9;
    }

    // Frog glow — enhanced during fever
    ctx.save();
    const fgy=fy-airness*140*fs*.55;
    const glowR=fever?70*fs:50*fs;
    const glowA=fever?(.3+.1*Math.sin(feverT*6)):.18;
    const fgg=ctx.createRadialGradient(fx,fgy,0,fx,fgy,glowR);
    fgg.addColorStop(0,`rgba(255,${fever?200:255},${fever?0:200},${glowA})`);
    fgg.addColorStop(1,`rgba(255,${fever?180:255},${fever?0:100},0)`);
    ctx.fillStyle=fgg;ctx.beginPath();ctx.arc(fx,fgy,glowR,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Fever trail sparkles
    if(fever&&airness>.2&&Math.random()<.5){
      addP(fx+rand(-6,6),fy+8,rand(-.02,.02),rand(.01,.03),'#FFD700',rand(1.5,2.5),.3,'s');
    }

    drawFrog(fx,fy,fs,rot,sqX,sqY,airness>.2,airness*.85);
    ctx.globalAlpha=1;

    // Trail
    if(spd>2.8&&airness>.3){
      const trailChance=clamp((spd-2.8)/1.5,0,.6);
      if(Math.random()<trailChance)addTrail(fx+rand(-4,4),fy+12,.3+trailChance*.4);
    }
  }

  // Near parallax (3)
  ctx.globalAlpha=.5;
  for(const obj of sideObjects){
    if(obj.layer===3)drawSideObj(obj);
  }
  ctx.globalAlpha=1;

  drawAtmo();
  drawPts();

  if(pfFlash>0){ctx.fillStyle=`rgba(255,235,59,${pfFlash*.1})`;ctx.fillRect(0,0,W,H)}
  if(shFlash>0){ctx.fillStyle=`rgba(255,193,7,${shFlash*.15})`;ctx.fillRect(0,0,W,H)}

  // === FEVER MODE VISUALS ===
  if(fever){
    // Pulsing golden border
    const pulse=.4+.15*Math.sin(feverT*6);
    const bord=6+2*Math.sin(feverT*4);
    ctx.save();
    ctx.strokeStyle=`rgba(255,215,0,${pulse})`;ctx.lineWidth=bord;
    ctx.shadowColor='rgba(255,180,0,.5)';ctx.shadowBlur=20;
    rr(2,2,W-4,H-4,12);ctx.stroke();
    ctx.shadowBlur=0;
    // Inner glow edge
    ctx.strokeStyle=`rgba(255,255,200,${pulse*.3})`;ctx.lineWidth=2;
    rr(bord+2,bord+2,W-bord*2-4,H-bord*2-4,8);ctx.stroke();
    ctx.restore();
    // Subtle gold overlay
    ctx.fillStyle=`rgba(255,215,0,${.02+.01*Math.sin(feverT*5)})`;ctx.fillRect(0,0,W,H);
    // Ambient gold particles from edges
    if(Math.random()<.3){
      const side=Math.random()<.5;
      addP(side?rand(0,15):rand(W-15,W),rand(0,H),side?.02:-.02,rand(-.02,.02),'#FFD700',rand(1.5,2.5),.4,'s');
    }
  }
  // Revive flash
  if(reviveShow>0){
    ctx.fillStyle=`rgba(255,215,0,${reviveShow*.12})`;ctx.fillRect(0,0,W,H);
  }
  // Fever activation flash
  if(feverFlash>0){
    ctx.fillStyle=`rgba(255,215,0,${feverFlash*.2})`;ctx.fillRect(0,0,W,H);
  }
  // Fever break — red crack flash
  if(feverBreakT>0){
    ctx.fillStyle=`rgba(255,50,50,${feverBreakT*.08})`;ctx.fillRect(0,0,W,H);
  }
  // Fever shatter particles
  for(const fp of feverPts){
    const fa=clamp(fp.life/fp.maxLife,0,1);
    ctx.globalAlpha=fa;ctx.fillStyle=fp.col;
    ctx.save();ctx.translate(fp.x,fp.y);ctx.rotate(fp.life*8);
    ctx.fillRect(-fp.size/2,-fp.size/2,fp.size,fp.size);
    ctx.restore();
  }
  ctx.globalAlpha=1;

  // === TURBO ZONE VISUALS ===
  if(turbo){
    // Orange vignette
    const tp=.15+.05*Math.sin(gt*8);
    const tg=ctx.createRadialGradient(W/2,H/2,W*.15,W/2,H/2,W*.65);
    tg.addColorStop(0,'rgba(255,87,34,0)');tg.addColorStop(1,`rgba(255,87,34,${tp})`);
    ctx.fillStyle=tg;ctx.fillRect(0,0,W,H);
    // Speed lines
    ctx.strokeStyle='rgba(255,200,100,.4)';ctx.lineWidth=2;
    for(const tl of turboLines){
      ctx.globalAlpha=tl.a;
      ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tl.x,tl.y+tl.l);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  // Turbo announcement
  if(turboShow>0.02){
    ctx.save();
    const ta=Math.min(turboShow*2,1);
    ctx.globalAlpha=ta;
    ctx.font=`bold ${52*(1+.2*(1-turboShow))}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(255,87,34,.8)';ctx.shadowBlur=30;
    ctx.fillStyle='#FF5722';
    ctx.fillText('🌪️ ТУРБО!',W/2,H*.28);
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
  }

  // === CHASER VISUAL ===
  if(chaserActive&&alive){
    const chaserDist=chaserZ-seq;
    const cVis=clamp(1-chaserDist/VIEW_AHEAD,0,1);
    if(cVis>0){
      // Dark fog from bottom
      const fogH=H*cVis*.3;
      const fg=ctx.createLinearGradient(0,H,0,H-fogH);
      fg.addColorStop(0,`rgba(50,0,80,${cVis*.4})`);fg.addColorStop(1,'rgba(50,0,80,0)');
      ctx.fillStyle=fg;ctx.fillRect(0,H-fogH,W,fogH);
    }
    if(chaserWarnShow>0.02){
      ctx.save();ctx.globalAlpha=Math.min(chaserWarnShow*2,1);
      ctx.font=`bold ${48*(1+.2*(1-chaserWarnShow))}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='rgba(156,39,176,.8)';ctx.shadowBlur=25;
      ctx.fillStyle='#CE93D8';ctx.fillText('🏃 ТІКАЙ!',W/2,H*.28);
      ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
    }
  }

  // === DIAMOND PATH INDICATOR ===
  if(diamondPath&&diamondCount<diamondTotal){
    ctx.save();
    ctx.font='bold 22px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillStyle='#00BCD4';ctx.shadowColor='rgba(0,188,212,.5)';ctx.shadowBlur=10;
    ctx.fillText(`💎 ${diamondCount}/${diamondTotal}`,W-20,80);
    ctx.shadowBlur=0;ctx.restore();
  }

  // === CHALLENGE HUD ===
  if(challenge){
    ctx.save();
    const ca=challengeShow>0?Math.min(challengeShow*2,1):1;
    ctx.globalAlpha=ca;
    // Challenge box at top
    const cbw=260,cbh=50,cbx=W/2-cbw/2,cby=65;
    ctx.fillStyle='rgba(0,0,0,.35)';rr(cbx,cby,cbw,cbh,12);ctx.fill();
    ctx.strokeStyle='rgba(255,152,0,.6)';ctx.lineWidth=2;rr(cbx,cby,cbw,cbh,12);ctx.stroke();
    // Challenge text
    ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#FF9800';ctx.fillText(`${challenge.emoji} ${challenge.text}`,W/2,cby+16);
    // Progress bar
    const prog=clamp(challengeProgress/challenge.need,0,1);
    const pbw=cbw-30,pbh=8,pbx=cbx+15,pby=cby+32;
    ctx.fillStyle='rgba(255,255,255,.15)';rr(pbx,pby,pbw,pbh,4);ctx.fill();
    if(prog>0){
      const hue=120*prog; // green when done
      ctx.fillStyle=`hsl(${hue},80%,55%)`;rr(pbx,pby,pbw*prog,pbh,4);ctx.fill();
    }
    // Counter
    ctx.font='bold 12px sans-serif';ctx.fillStyle='#fff';
    ctx.fillText(`${challengeProgress}/${challenge.need}`,W/2+cbw/2-25,cby+36);
    // Timer
    if(challenge.id==='speedLand'){
      ctx.fillStyle=challengeT<2?'#F44336':'#fff';
      ctx.fillText(`${Math.ceil(challengeT)}с`,cbx+20,cby+36);
    }
    ctx.globalAlpha=1;ctx.restore();
  }

  // === DASH COOLDOWN INDICATOR ===
  if(state===ST.PLAY&&alive){
    ctx.save();
    const dx=W-40,dy=H-60;
    // Dash circle
    ctx.beginPath();ctx.arc(dx,dy,22,0,Math.PI*2);
    ctx.fillStyle=dashReady?'rgba(68,138,255,.3)':'rgba(100,100,100,.2)';ctx.fill();
    ctx.strokeStyle=dashReady?'rgba(68,138,255,.7)':'rgba(100,100,100,.4)';ctx.lineWidth=2;ctx.stroke();
    // Cooldown arc
    if(!dashReady){
      const cdProg=1-dashCooldown/DASH_COOLDOWN;
      ctx.beginPath();ctx.moveTo(dx,dy);
      ctx.arc(dx,dy,22,-Math.PI/2,-Math.PI/2+cdProg*Math.PI*2);ctx.closePath();
      ctx.fillStyle='rgba(68,138,255,.25)';ctx.fill();
    }
    // Icon
    ctx.font=`${dashReady?'18':'14'}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⚡',dx,dy);
    // Ready flash
    if(dashShow>0){
      ctx.strokeStyle=`rgba(68,138,255,${dashShow})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(dx,dy,28,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
  }

  // PERFECT / GOOD text — scaled by combo intensity
  if(perfectShow>0.02){
    ctx.save();
    const pfa=Math.min(perfectShow*2.5,1);
    const pfsc=1+(.2*(1-perfectShow));
    const isFeverPerfect=fever&&perfectText.includes('PERFECT');
    const isGoodText=perfectText==='GOOD';
    ctx.globalAlpha=pfa;
    // Scale font: GOOD=24, single PERFECT=30, combo PERFECT=36-48, fever=48-56
    let fontSize;
    if(isGoodText){fontSize=24}
    else if(isFeverPerfect){fontSize=Math.min(40+perfectCombo*2,56)}
    else if(perfectCombo>=5){fontSize=44}
    else if(perfectCombo>=2){fontSize=36}
    else{fontSize=30}
    ctx.font=`bold ${fontSize*pfsc}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const pfCol=isGoodText?'#FFD54F':isFeverPerfect?'#FFD700':perfectText.includes('⚡')?'#E040FB':'#E040FB';
    ctx.shadowColor=isFeverPerfect?'rgba(255,180,0,.8)':pfCol;
    ctx.shadowBlur=isGoodText?8:isFeverPerfect?30:16;
    ctx.fillStyle=pfCol;
    // Position: GOOD below center, PERFECT higher
    const textY=isGoodText?H*.28:H*.22;
    ctx.fillText(perfectText,W/2,textY);
    if(!isGoodText&&perfectCombo>1){
      const cm=Math.min(perfectCombo,5);
      const comboSize=isFeverPerfect?Math.min(28+cm*3,44):20+cm*3;
      const comboCols=['#FFD54F','#FF9800','#FF5722','#E040FB','#FFD700'];
      const cc=isFeverPerfect?'#FFA000':comboCols[Math.min(cm-1,4)];
      ctx.font=`bold ${comboSize*pfsc}px sans-serif`;
      ctx.shadowColor=cc;ctx.shadowBlur=cm*6;
      ctx.fillStyle=cc;
      ctx.fillText('x'+cm+(cm>=4?' 🔥':''),W/2,textY+34*pfsc);
    }
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
    ctx.restore();
  }
  // === MILESTONE CELEBRATION (compact, top of screen) ===
  if(msShow>0.02){
    ctx.save();
    const msa=Math.min(msShow*4,1);
    ctx.globalAlpha=msa;
    // Compact banner at top
    const mbY=48+12*(1-msShow); // slides up as it fades
    ctx.font='24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(msEmoji,W/2-80,mbY);
    ctx.font='bold 22px sans-serif';
    ctx.shadowColor=msColor;ctx.shadowBlur=12;
    ctx.fillStyle=msColor;
    ctx.fillText(msText,W/2+10,mbY);
    ctx.shadowBlur=0;
    ctx.font='14px sans-serif';ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.fillText(`+${msCoins}🪙`,W/2+90,mbY);
    ctx.globalAlpha=1;ctx.restore();
  }
  // === BIOME NAME ===
  if(biomeT>0.02&&curBiome>0){
    ctx.save();
    const ba=Math.min(biomeT*2,1);
    ctx.globalAlpha=ba*.8;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 18px sans-serif';
    ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=10;
    ctx.fillText('🌿 '+BIOMES[curBiome].name,W/2,H*.15);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    ctx.restore();
  }
  // === CLOSE CALL FLASH ===
  if(closeCallShow>0.02){
    ctx.save();
    const cca=closeCallShow*.15;
    // Red vignette flash
    const ccg=ctx.createRadialGradient(W/2,H/2,W*.2,W/2,H/2,W*.7);
    ccg.addColorStop(0,'rgba(255,0,0,0)');ccg.addColorStop(1,`rgba(255,50,50,${cca})`);
    ctx.fillStyle=ccg;ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // === TUTORIAL OVERLAY (first 2 jumps) ===
  if(!tutorialShown&&tutorialAlpha>0.01){
    ctx.save();
    ctx.globalAlpha=tutorialAlpha*.7;
    ctx.textAlign='center';ctx.textBaseline='middle';
    // Pulsing finger icon
    const pulse=.8+Math.sin(gt*4)*.2;
    ctx.font=`${Math.floor(48*pulse)}px sans-serif`;
    ctx.fillText('👆',W/2,H*.55);
    ctx.font='bold 20px sans-serif';
    ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=8;
    ctx.fillText('Тримай та рухай → щоб цілитися',W/2,H*.63);
    ctx.font='16px sans-serif';ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.fillText('Стрибай по платформах!',W/2,H*.68);
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
    ctx.restore();
  }
  ctx.restore();

  drawHUD();
}

function drawHUD(){
  // Main score
  ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=6;
  ctx.fillText(score,W/2,28);
  ctx.shadowBlur=0;
  // Distance below score
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='bold 13px sans-serif';
  ctx.fillText(Math.floor(dist)+' м',W/2,48);
  ctx.textBaseline='alphabetic';

  const bw=W*.35,bh=4,bx=W/2-bw/2,by=60;
  const prog=clamp(dist/100,0,1);
  ctx.fillStyle='rgba(255,255,255,.15)';rr(bx,by,bw,bh,2);ctx.fill();
  if(prog>0){
    const fw=bw*prog;
    ctx.fillStyle='rgba(255,152,0,.85)';rr(bx,by,fw,bh,2);ctx.fill();
    ctx.shadowColor='rgba(255,152,0,.5)';ctx.shadowBlur=6;rr(bx,by,fw,bh,2);ctx.fill();ctx.shadowBlur=0;
  }
  for(let i=0;i<4;i++){
    const dx=bx+bw*((i+1)/5);
    ctx.fillStyle=prog>=(i+1)/5?'rgba(255,152,0,.9)':'rgba(255,255,255,.25)';
    ctx.save();ctx.translate(dx,by+bh/2);ctx.rotate(Math.PI/4);
    ctx.fillRect(-3,-3,6,6);ctx.restore();
  }

  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='bold 14px sans-serif';ctx.textAlign='right';
  ctx.fillText('🪙 '+runCoins,W-14,28);

  let py=H-60;
  if(shield){ctx.fillStyle='rgba(255,193,7,.5)';rr(10,py,80,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText('🛡️ Щит',16,py+15);py-=24}
  if(magnet){ctx.fillStyle='rgba(244,67,54,.5)';rr(10,py,80,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText('🧲 '+Math.ceil(magnetT)+'с',16,py+15);py-=24}
  if(boost){ctx.fillStyle='rgba(255,235,59,.5)';rr(10,py,80,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText('⚡ '+Math.ceil(boostT)+'с',16,py+15);py-=24}
  if(fever){
    const fp2=.6+.2*Math.sin(gt*5);
    ctx.fillStyle=`rgba(255,215,0,${fp2})`;rr(10,py,100,22,11);ctx.fill();
    ctx.strokeStyle='rgba(255,180,0,.6)';ctx.lineWidth=1.5;rr(10,py,100,22,11);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='left';
    ctx.fillText('🔥 FEVER x2',16,py+16);py-=26;
  }
  if(dist<3&&alive){const ha=Math.max(0,1-dist/3)*(0.5+Math.sin(gt*3)*.2);ctx.globalAlpha=ha;ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='15px sans-serif';ctx.textAlign='center';ctx.fillText('☝️ тримай палець і веди',W/2,H*.88);ctx.globalAlpha=1}
}

// Menu idle animation state
let menuIdleT=0,menuBlinkT=0,menuWaveT=0,menuBreathT=0;
// Menu scene particles (pre-generated for consistency)
let menuParticles=[];
function initMenuParticles(){
  menuParticles=[];
  for(let i=0;i<30;i++) menuParticles.push({
    x:Math.random()*400, y:Math.random()*700, vx:Math.random()*.3-.15, vy:-Math.random()*.4-.1,
    sz:Math.random()*3+1, col:['#FFE082','#FFF9C4','#C8E6C9','#B3E5FC','#F8BBD0'][i%5],

  });

if(!menuParticles.length) initMenuParticles();

function drawMenuBg(){
  // Rich fantasy sky with warm sunset tones
  const sg=ctx.createLinearGradient(0,0,0,H*.4);
  sg.addColorStop(0,'#4A90D9');sg.addColorStop(.3,'#7EC8E3');sg.addColorStop(.6,'#B3E5FC');sg.addColorStop(1,'#E8F5E9');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  // Sun with god rays
  const sunX=W*.72,sunY=H*.08,sunR=W*.1;
  ctx.save();
  // God rays
  for(let i=0;i<12;i++){
    const ang=i*Math.PI/6+Math.sin(gt*.2)*.1;
    const rayLen=H*.35;
    ctx.fillStyle=`rgba(255,245,157,${.03+Math.sin(gt+i)*.015})`;
    ctx.beginPath();ctx.moveTo(sunX,sunY);
    ctx.lineTo(sunX+Math.cos(ang-0.04)*rayLen,sunY+Math.sin(ang-0.04)*rayLen);
    ctx.lineTo(sunX+Math.cos(ang+0.04)*rayLen,sunY+Math.sin(ang+0.04)*rayLen);
    ctx.closePath();ctx.fill();
  }
  // Sun glow
  const sung=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*3);
  sung.addColorStop(0,'rgba(255,255,220,.9)');sung.addColorStop(.15,'rgba(255,245,157,.5)');sung.addColorStop(.4,'rgba(255,235,59,.12)');sung.addColorStop(1,'rgba(255,235,59,0)');
  ctx.fillStyle=sung;ctx.beginPath();ctx.arc(sunX,sunY,sunR*3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,240,.95)';ctx.beginPath();ctx.arc(sunX,sunY,sunR*.5,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Fluffy clouds with detail
  const cloudData=[{x:.15,y:.06,s:1.1},{x:.55,y:.04,s:.8},{x:.88,y:.09,s:.9},{x:.35,y:.12,s:.6}];
  cloudData.forEach((c,i)=>{
    const cx2=c.x*W+Math.sin(gt*.15+i*1.5)*8;
    const cy2=c.y*H;const s=c.s*18;
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.beginPath();ctx.ellipse(cx2,cy2,s*1.8,s*.7,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx2-s*.8,cy2+s*.15,s*1.1,s*.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx2+s*.9,cy2+s*.1,s*1.3,s*.55,0,0,Math.PI*2);ctx.fill();
    // cloud highlight
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.beginPath();ctx.ellipse(cx2-s*.3,cy2-s*.2,s*1.2,s*.35,0,0,Math.PI*2);ctx.fill();
  });

  // Distant mountains (3 layers)
  // Layer 1 — far, blue-ish
  ctx.fillStyle='#7CB8A0';ctx.beginPath();ctx.moveTo(-10,H*.24);
  ctx.quadraticCurveTo(W*.1,H*.14,W*.22,H*.2);
  ctx.quadraticCurveTo(W*.35,H*.11,W*.48,H*.18);
  ctx.quadraticCurveTo(W*.6,H*.12,W*.75,H*.19);
  ctx.quadraticCurveTo(W*.88,H*.13,W+10,H*.21);
  ctx.lineTo(W+10,H*.28);ctx.lineTo(-10,H*.28);ctx.closePath();ctx.fill();
  // Layer 2 — mid, greener
  ctx.fillStyle='#5DA87A';ctx.beginPath();ctx.moveTo(-10,H*.26);
  ctx.quadraticCurveTo(W*.15,H*.2,W*.3,H*.24);
  ctx.quadraticCurveTo(W*.45,H*.17,W*.6,H*.22);
  ctx.quadraticCurveTo(W*.78,H*.19,W+10,H*.25);
  ctx.lineTo(W+10,H*.30);ctx.lineTo(-10,H*.30);ctx.closePath();ctx.fill();
  // Layer 3 — near hills
  ctx.fillStyle='#4CAF50';ctx.beginPath();ctx.moveTo(-10,H*.29);
  ctx.quadraticCurveTo(W*.2,H*.25,W*.35,H*.27);
  ctx.quadraticCurveTo(W*.5,H*.23,W*.7,H*.27);
  ctx.quadraticCurveTo(W*.85,H*.24,W+10,H*.28);
  ctx.lineTo(W+10,H*.32);ctx.lineTo(-10,H*.32);ctx.closePath();ctx.fill();

  // --- WATERFALL on left side ---
  const wfX=W*.12,wfTop=H*.25,wfBot=H*.42,wfW=14;
  // Rock face behind waterfall
  ctx.fillStyle='#5D4037';
  ctx.beginPath();ctx.moveTo(wfX-wfW,wfTop-8);ctx.lineTo(wfX+wfW+4,wfTop-8);
  ctx.lineTo(wfX+wfW+8,wfBot+10);ctx.lineTo(wfX-wfW-4,wfBot+10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#6D4C41';
  ctx.beginPath();ctx.moveTo(wfX-wfW+2,wfTop-5);ctx.lineTo(wfX+wfW+1,wfTop-5);
  ctx.lineTo(wfX+wfW+5,wfBot+6);ctx.lineTo(wfX-wfW-1,wfBot+6);ctx.closePath();ctx.fill();
  // Waterfall streams
  for(let s=0;s<3;s++){
    const sx=wfX-4+s*5;
    const waveOff=Math.sin(gt*4+s*2)*2;
    ctx.fillStyle=`rgba(180,230,255,${.35+s*.1})`;
    ctx.beginPath();
    ctx.moveTo(sx-2+waveOff,wfTop);
    ctx.quadraticCurveTo(sx+waveOff+Math.sin(gt*3+s)*3,(wfTop+wfBot)/2,sx-1+waveOff,wfBot);
    ctx.lineTo(sx+3+waveOff,wfBot);
    ctx.quadraticCurveTo(sx+3+waveOff-Math.sin(gt*3+s)*3,(wfTop+wfBot)/2,sx+4+waveOff,wfTop);
    ctx.closePath();ctx.fill();
  }
  // Splash at bottom
  for(let i=0;i<5;i++){
    const spa=.2+Math.sin(gt*5+i*1.3)*.15;
    const spx=wfX-8+i*5+Math.sin(gt*3+i)*3;
    ctx.fillStyle=`rgba(200,240,255,${spa})`;
    ctx.beginPath();ctx.arc(spx,wfBot+5+Math.sin(gt*4+i)*2,2+Math.sin(gt*6+i),0,Math.PI*2);ctx.fill();
  }
  // Mist from waterfall
  for(let i=0;i<4;i++){
    const ma=.06+Math.sin(gt*1.5+i)*.03;
    const mx2=wfX+Math.sin(gt*.8+i*2)*12;
    const my2=wfBot-10+i*8;
    ctx.fillStyle=`rgba(200,240,255,${ma})`;
    ctx.beginPath();ctx.ellipse(mx2,my2,20+i*5,8+i*2,0,0,Math.PI*2);ctx.fill();
  }

  // --- RIVER flowing from waterfall to right ---
  const rivY=H*.42;
  const rivG=ctx.createLinearGradient(0,rivY-6,0,rivY+16);
  rivG.addColorStop(0,'rgba(100,200,230,.4)');rivG.addColorStop(.5,'rgba(60,170,220,.3)');rivG.addColorStop(1,'rgba(40,140,200,.15)');
  ctx.fillStyle=rivG;
  ctx.beginPath();ctx.moveTo(wfX-5,rivY-4);
  ctx.quadraticCurveTo(W*.25,rivY-8+Math.sin(gt*1.5)*2,W*.45,rivY+Math.sin(gt*1.2)*3);
  ctx.quadraticCurveTo(W*.65,rivY+6+Math.sin(gt*1.8)*2,W*.85,rivY+2);
  ctx.lineTo(W+10,rivY+4);ctx.lineTo(W+10,rivY+14);
  ctx.quadraticCurveTo(W*.65,rivY+18+Math.sin(gt*1.8+1)*2,W*.45,rivY+13+Math.sin(gt*1.2+1)*3);
  ctx.quadraticCurveTo(W*.25,rivY+6+Math.sin(gt*1.5+1)*2,wfX-5,rivY+10);
  ctx.closePath();ctx.fill();
  // River sparkles
  for(let i=0;i<6;i++){
    const rsx=W*.15+i*(W*.7)/6+Math.sin(gt*2+i)*5;
    const rsa=.15+Math.sin(gt*3+i*1.7)*.12;
    ctx.fillStyle=`rgba(255,255,255,${rsa})`;
    ctx.beginPath();ctx.ellipse(rsx,rivY+5+Math.sin(gt*2+i)*2,3,1.5,Math.sin(gt+i)*.3,0,Math.PI*2);ctx.fill();
  }

  // Ground — rich green gradient below hills
  const grdTop=H*.30;
  const grdG=ctx.createLinearGradient(0,grdTop,0,H);
  grdG.addColorStop(0,'#4CAF50');grdG.addColorStop(.15,'#43A047');grdG.addColorStop(.4,'#388E3C');grdG.addColorStop(.7,'#2E7D32');grdG.addColorStop(1,'#1B5E20');
  ctx.fillStyle=grdG;ctx.fillRect(0,grdTop,W,H-grdTop);

  // Grass texture (subtle wavy lines)
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let r=0;r<12;r++){
    const gy=grdTop+20+r*(H-grdTop-20)/12;
    ctx.beginPath();
    for(let x=0;x<=W;x+=6){
      const w=Math.sin(x*.03+gt*.5+r*.8)*2;
      if(x===0)ctx.moveTo(x,gy+w);else ctx.lineTo(x,gy+w);
    }ctx.stroke();
  }

  // --- DECORATIVE TREES (different sizes, multiple layers) ---
  function drawMenuTree(px,py,sc,type){
    ctx.save();ctx.translate(px,py);ctx.scale(sc,sc);
    if(type==='pine'){
      // Pine tree
      ctx.fillStyle='#5D4037';ctx.fillRect(-3,-55,6,55);
      const layers=[{y:-60,w:22},{y:-75,w:17},{y:-88,w:12}];
      layers.forEach((l,i)=>{
        ctx.fillStyle=['#2E7D32','#388E3C','#43A047'][i];
        ctx.beginPath();ctx.moveTo(0,l.y-10);ctx.lineTo(-l.w,l.y+12);ctx.lineTo(l.w,l.y+12);ctx.closePath();ctx.fill();
      });
    } else if(type==='round'){
      // Round bushy tree
      ctx.fillStyle='#6D4C41';ctx.fillRect(-3,-45,6,45);
      ctx.fillStyle='#388E3C';ctx.beginPath();ctx.arc(0,-52,20,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#43A047';ctx.beginPath();ctx.arc(-7,-56,13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4CAF50';ctx.beginPath();ctx.arc(6,-48,11,0,Math.PI*2);ctx.fill();
      // Highlight
      ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(-3,-58,10,0,Math.PI*2);ctx.fill();
    } else {
      // Willow / droopy
      ctx.fillStyle='#5D4037';ctx.fillRect(-4,-50,8,50);
      ctx.fillStyle='#2E7D32';ctx.beginPath();ctx.arc(0,-50,18,0,Math.PI*2);ctx.fill();
      // Hanging branches
      for(let b=-2;b<=2;b++){
        ctx.strokeStyle='rgba(76,175,80,.6)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(b*7,-45);
        ctx.quadraticCurveTo(b*10+Math.sin(gt+b)*3,-25,b*8+Math.sin(gt*.7+b)*4,-15);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Background trees (behind everything)
  drawMenuTree(W*.05,H*.29,.45,'pine');
  drawMenuTree(W*.18,H*.28,.55,'round');
  drawMenuTree(W*.92,H*.28,.5,'pine');
  drawMenuTree(W*.82,H*.27,.6,'round');
  drawMenuTree(W*.97,H*.30,.35,'willow');
  drawMenuTree(W*.02,H*.31,.3,'round');

  // --- BUSHES ---
  function drawBush(px,py,sc,dark){
    ctx.save();ctx.translate(px,py);ctx.scale(sc,sc);
    const c1=dark?'#1B5E20':'#2E7D32';
    const c2=dark?'#2E7D32':'#43A047';
    const c3=dark?'#33691E':'#388E3C';
    ctx.fillStyle=c1;ctx.beginPath();ctx.ellipse(0,0,18,12,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c2;ctx.beginPath();ctx.ellipse(-10,-3,12,9,-.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c3;ctx.beginPath();ctx.ellipse(10,-2,13,10,.15,0,0,Math.PI*2);ctx.fill();
    // Small berries / flowers on some bushes
    if(!dark){
      ctx.fillStyle='#F48FB1';ctx.beginPath();ctx.arc(-8,-8,2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#CE93D8';ctx.beginPath();ctx.arc(6,-7,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(0,-10,1.8,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  drawBush(W*.08,H*.34,.7,false);
  drawBush(W*.28,H*.36,.5,true);
  drawBush(W*.7,H*.35,.6,false);
  drawBush(W*.93,H*.33,.8,true);
  drawBush(W*.5,H*.61,.5,true);
  drawBush(W*.15,H*.58,.4,false);
  drawBush(W*.85,H*.56,.45,false);

  // --- FLOWERS scattered on ground ---
  function drawFlower(px,py,sc,col){
    ctx.save();ctx.translate(px,py);ctx.scale(sc,sc);
    // Stem
    ctx.strokeStyle='#388E3C';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-12);ctx.stroke();
    // Petals
    ctx.fillStyle=col;
    for(let p=0;p<5;p++){
      const a=p*Math.PI*2/5+Math.sin(gt+px)*.1;
      ctx.beginPath();ctx.ellipse(Math.cos(a)*5,-12+Math.sin(a)*5,3.5,2,a,0,Math.PI*2);ctx.fill();
    }
    // Center
    ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(0,-12,2.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  const flowerCols=['#F48FB1','#CE93D8','#90CAF9','#FFAB91','#FFF176','#A5D6A7'];
  const flowerPositions=[{x:.06,y:.38},{x:.22,y:.40},{x:.35,y:.55},{x:.55,y:.38},{x:.65,y:.57},{x:.78,y:.39},{x:.42,y:.63},{x:.88,y:.37},{x:.12,y:.55},{x:.95,y:.40}];
  flowerPositions.forEach((f,i)=>{
    drawFlower(f.x*W,f.y*H,.6+Math.sin(i)*.2,flowerCols[i%flowerCols.length]);
  });

  // --- MUSHROOMS ---
  function drawMushroom(px,py,sc,red){
    ctx.save();ctx.translate(px,py);ctx.scale(sc,sc);
    // Stem
    ctx.fillStyle='#EFEBE9';
    ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-3,-10);ctx.lineTo(3,-10);ctx.lineTo(4,0);ctx.closePath();ctx.fill();
    // Cap
    ctx.fillStyle=red?'#E53935':'#FF8F00';
    ctx.beginPath();ctx.ellipse(0,-12,9,7,0,Math.PI,Math.PI*2);ctx.fill();
    // Spots
    ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.beginPath();ctx.arc(-3,-14,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(3,-12,1.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  drawMushroom(W*.16,H*.42,.7,true);
  drawMushroom(W*.72,H*.40,.6,false);
  drawMushroom(W*.88,H*.43,.5,true);
  drawMushroom(W*.38,H*.60,.55,false);

  // --- BUTTERFLIES (animated, larger) ---
  const bflyData=[
    {sx:.1,sy:.2,col:'#F48FB1',sp:1.2},{sx:.3,sy:.15,col:'#CE93D8',sp:.9},
    {sx:.7,sy:.18,col:'#90CAF9',sp:1.1},{sx:.85,sy:.22,col:'#FFF176',sp:1.0},
    {sx:.5,sy:.25,col:'#A5D6A7',sp:.8},{sx:.2,sy:.32,col:'#FFAB91',sp:1.3},
    {sx:.6,sy:.35,col:'#80DEEA',sp:1.0},{sx:.4,sy:.10,col:'#F8BBD0',sp:.7},
  ];
  bflyData.forEach((b,i)=>{
    const bx=b.sx*W+Math.sin(gt*b.sp+i*2.1)*25;
    const by=b.sy*H+Math.cos(gt*b.sp*.7+i*1.7)*12;
    const wingFlap=Math.sin(gt*8+i*3)*4;
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.ellipse(bx-wingFlap-2,by,Math.abs(wingFlap)+2,4,.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx+wingFlap+2,by,Math.abs(wingFlap)+2,4,-.3,0,Math.PI*2);ctx.fill();
    // Body
    ctx.fillStyle='rgba(80,50,30,.5)';ctx.beginPath();ctx.ellipse(bx,by,1.2,3,0,0,Math.PI*2);ctx.fill();
  });

  // --- ATMOSPHERIC PARTICLES (sparkles, pollen, fireflies) ---
  menuParticles.forEach((p,i)=>{
    p.x+=p.vx+Math.sin(gt*.5+i)*.15;
    p.y+=p.vy;
    p.phase+=.03;
    if(p.y<-10){p.y=H*.7;p.x=Math.random()*W;}
    if(p.x<-10||p.x>W+10)p.x=Math.random()*W;
    const pa=.15+Math.sin(p.phase)*.12;
    ctx.fillStyle=p.col;ctx.globalAlpha=pa;
    if(p.type==='sparkle'){
      // Glowing sparkle
      ctx.shadowColor=p.col;ctx.shadowBlur=4;
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    } else {
      // Leaf / petal — small ellipse with rotation
      ctx.beginPath();ctx.ellipse(p.x,p.y,p.sz*1.5,p.sz*.6,Math.sin(p.phase)*.5,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  });

  // Atmospheric fog at horizon
  const fogG=ctx.createLinearGradient(0,H*.28,0,H*.38);
  fogG.addColorStop(0,'rgba(200,230,255,.12)');fogG.addColorStop(1,'rgba(200,230,255,0)');
  ctx.fillStyle=fogG;ctx.fillRect(0,H*.28,W,H*.1);

  // Foreground grass tufts at very bottom of ground area
  for(let i=0;i<20;i++){
    const gx=i*(W/20)+Math.sin(i*3.7)*8;
    const gy=H*.62+Math.sin(i*2.1)*4;
    ctx.strokeStyle='rgba(76,175,80,.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.quadraticCurveTo(gx-3+Math.sin(gt+i)*2,gy-10,gx-2,gy-14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gx+3,gy);ctx.quadraticCurveTo(gx+5+Math.sin(gt+i+1)*2,gy-8,gx+4,gy-12);ctx.stroke();
  }
}

  ctx.fillStyle=ribG;ctx.fillRect(ribX,ribY,ribW,ribH);

  ctx.fillText('✨ НЕСКІНЧЕННА ПРИГОДА ✨',cx,ribY+ribH/2);

function drawMenuPlatforms(cx,baseY){
  // Rich perspective path — platforms going far into distance, zigzag pattern
  // More platforms, better depth scaling, visible gameplay preview
  const path=[
    {dx:0,   dy:0,   sc:.38, type:'flower', w:1.15},  // hero platform — same style as others
    {dx:-45, dy:-28, sc:.32, type:'normal', w:1.0},
    {dx:40,  dy:-54, sc:.27, type:'moving_h', w:1.0},
    {dx:-30, dy:-76, sc:.23, type:'normal', w:.95},
    {dx:35,  dy:-96, sc:.19, type:'bonus', w:.9},
    {dx:-20, dy:-112,sc:.16, type:'normal', w:.9},
    {dx:25,  dy:-126,sc:.13, type:'moving_h', w:.85},
    {dx:-15, dy:-137,sc:.10, type:'normal', w:.8},
    {dx:20,  dy:-146,sc:.08, type:'bonus', w:.75},
  ];

  // Draw connecting lines (dotted path) between platforms
  ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;
  for(let i=0;i<path.length-1;i++){
    const a=path[i],b=path[i+1];
    ctx.beginPath();ctx.moveTo(cx+a.dx,baseY+a.dy);ctx.lineTo(cx+b.dx,baseY+b.dy);ctx.stroke();
  }
  ctx.setLineDash([]);

  // Draw back to front
  for(let i=path.length-1;i>=0;i--){
    const p=path[i];
    const bob=Math.sin(gt*1.5+i*.9)*2.5*p.sc;
    // Subtle glow under each platform
    if(p.sc>.15){
      ctx.fillStyle=`rgba(255,255,255,${.03*p.sc/.55})`;
      ctx.beginPath();ctx.ellipse(cx+p.dx,baseY+p.dy+bob+8*p.sc,60*p.sc*p.w,12*p.sc,0,0,Math.PI*2);ctx.fill();
    }
    drawPad(cx+p.dx,baseY+p.dy+bob,p.sc,p.type,0,i===0,p.w);
  }
}

// ========== MENU CHARACTER SHOWCASE ANIMATION ==========
const MENU_ANIM={
  // States: idle, prepare, jump, land, bounce
  state:'idle',
  t:0,           // time in current state
  dur:2.0,       // duration of current state
  // Position
  x:0, y:0,      // current world position
  startX:0, startY:0, // jump start
  targetX:0, targetY:0, // jump target
  // Platform indices
  curPlat:0, targetPlat:0,
  // Visual
  rot:0, sqX:1, sqY:1,
  jumpHeight:.3,  // arc height multiplier
  jumpType:0,     // 0-4 animation variant
  eyeLookX:0, eyeLookY:0,
  blinkT:0, nextBlink:2,
  antPhase:0,
  // Trail
  trail:[],
  // Landing particles
  landParts:[],
  // Idle jelly phase
  jellyPhase:0,
  // Initialized
  inited:false
};

function menuAnimGetPlatPos(idx,cx,baseY){
  const path=[
    {dx:0,   dy:0},
    {dx:-45, dy:-28},
    {dx:40,  dy:-54},
    {dx:-30, dy:-76},
    {dx:35,  dy:-96},
  ];
  const p=path[Math.min(idx,path.length-1)];
  return {x:cx+p.dx, y:baseY+p.dy};
}

function menuAnimInit(cx,baseY){
  const p=menuAnimGetPlatPos(0,cx,baseY);
  MENU_ANIM.x=p.x; MENU_ANIM.y=p.y;
  MENU_ANIM.curPlat=0; MENU_ANIM.state='idle';
  MENU_ANIM.t=0; MENU_ANIM.dur=1.5+Math.random();
  MENU_ANIM.sqX=1; MENU_ANIM.sqY=1; MENU_ANIM.rot=0;
  MENU_ANIM.trail=[]; MENU_ANIM.landParts=[];
  MENU_ANIM.inited=true;
}

function easeInOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

function menuAnimUpdate(dt,cx,baseY){
  if(!MENU_ANIM.inited) menuAnimInit(cx,baseY);
  const A=MENU_ANIM;
  A.t+=dt;
  A.jellyPhase+=dt;
  A.antPhase+=dt*4;

  // Blink timer
  A.blinkT+=dt;
  if(A.blinkT>=A.nextBlink){A.blinkT=0;A.nextBlink=1.5+Math.random()*3;}

  // Update trail
  for(let i=A.trail.length-1;i>=0;i--){
    A.trail[i].life-=dt*2.5;
    if(A.trail[i].life<=0) A.trail.splice(i,1);
  }
  // Update landing particles
  for(let i=A.landParts.length-1;i>=0;i--){
    const lp=A.landParts[i];
    lp.x+=lp.vx*dt; lp.y+=lp.vy*dt; lp.vy+=200*dt; lp.life-=dt*2;
    if(lp.life<=0) A.landParts.splice(i,1);
  }

  const progress=Math.min(A.t/A.dur,1);

  if(A.state==='idle'){
    // Jelly breathing + squash/stretch
    A.sqX=1+Math.sin(A.jellyPhase*2.8)*.04;
    A.sqY=1-Math.sin(A.jellyPhase*2.8)*.04;
    A.rot=Math.sin(A.jellyPhase*1.5)*.03;
    // Eye look around slowly
    A.eyeLookX=Math.sin(A.jellyPhase*.7)*3;
    A.eyeLookY=Math.cos(A.jellyPhase*.5)*2;
    // Update position to stay on current platform (it bobs)
    const pp=menuAnimGetPlatPos(A.curPlat,cx,baseY);
    A.x=pp.x; A.y=pp.y+Math.sin(gt*1.5+A.curPlat*.9)*2.5*.38;// match platform bob

    if(progress>=1){
      // Pick next animation
      A.state='prepare';
      A.t=0; A.dur=.25+Math.random()*.1;
      // Choose target platform (not current)
      const neighbors=[];
      for(let i=0;i<5;i++) if(i!==A.curPlat) neighbors.push(i);
      A.targetPlat=neighbors[Math.floor(Math.random()*neighbors.length)];
      const tp=menuAnimGetPlatPos(A.targetPlat,cx,baseY);
      A.startX=A.x; A.startY=A.y;
      A.targetX=tp.x; A.targetY=tp.y;
      // Pick jump type
      A.jumpType=Math.floor(Math.random()*5);
      // Jump height based on distance
      const dist2=Math.sqrt((A.targetX-A.startX)**2+(A.targetY-A.startY)**2);
      A.jumpHeight=.3+dist2/400+Math.random()*.15;
    }
  }
  else if(A.state==='prepare'){
    // Squash down — crouch before jump
    const p=easeInOutCubic(progress);
    A.sqX=1+p*.25;   // wider
    A.sqY=1-p*.2;    // shorter (crouch)
    A.rot=0;
    // Eyes look at target
    A.eyeLookX=(A.targetX-A.x)*.08;
    A.eyeLookY=-2;

    if(progress>=1){
      A.state='jump';
      A.t=0;
      // Duration depends on distance and jump type
      const dist2=Math.sqrt((A.targetX-A.startX)**2+(A.targetY-A.startY)**2);
      A.dur=.4+dist2/350;
      if(A.jumpType===1) A.dur*=1.2; // high jump slower
      if(A.jumpType===2) A.dur*=.75; // speed jump faster
    }
  }
  else if(A.state==='jump'){
    const p=easeInOutCubic(progress);
    // Position — parabolic arc
    A.x=A.startX+(A.targetX-A.startX)*p;
    const arcH=A.jumpHeight*120;
    A.y=A.startY+(A.targetY-A.startY)*p - arcH*Math.sin(p*Math.PI);

    // Rotation: strong lean toward movement direction + forward 360° flip
    const dir=A.targetX>A.startX?1:-1; // +1 right, -1 left
    const lean=dir*.6; // constant tilt in movement direction (~35°)
    const spin=p*Math.PI*2; // full 360° forward rotation
    A.rot=spin+lean;

    // Squash/stretch in air — stretch in direction of movement
    const stretchAmt=.15+Math.abs(Math.cos(p*Math.PI))*.1;
    A.sqX=1-stretchAmt*.5;
    A.sqY=1+stretchAmt;

    // Trail emission
    const speed=Math.sqrt((A.targetX-A.startX)**2+(A.targetY-A.startY)**2)/A.dur;
    if(speed>50&&Math.random()<.6){
      A.trail.push({
        x:A.x+Math.random()*6-3,
        y:A.y+Math.random()*6-3,
        sz:2+Math.random()*4,
        life:1,
        col:Math.random()>.5?'#FFD54F':'#FF8F00',
        type:Math.random()>.7?'spark':'streak'
      });
    }

    if(progress>=1){
      A.state='land';
      A.t=0; A.dur=.15;
      A.curPlat=A.targetPlat;
      // Snap to platform
      const tp=menuAnimGetPlatPos(A.curPlat,cx,baseY);
      A.x=tp.x; A.y=tp.y;
      // Spawn landing particles
      for(let i=0;i<8;i++){
        A.landParts.push({
          x:A.x+Math.random()*16-8,
          y:A.y+Math.random()*4,
          vx:(Math.random()-.5)*80,
          vy:-Math.random()*120-30,
          sz:1.5+Math.random()*2.5,
          life:1,
          col:['#FFD54F','#FFF176','#76FF03','#69F0AE','#fff'][Math.floor(Math.random()*5)]
        });
      }
    }
  }
  else if(A.state==='land'){
    // Impact squash
    const p=progress;
    A.sqX=1+.3*(1-p);  // wide on impact, settle
    A.sqY=1-.25*(1-p); // flat on impact, settle
    A.rot*=(1-p);      // rotation settles

    const tp=menuAnimGetPlatPos(A.curPlat,cx,baseY);
    A.x=tp.x; A.y=tp.y+Math.sin(gt*1.5+A.curPlat*.9)*2.5*.38;

    if(progress>=1){
      A.state='bounce';
      A.t=0; A.dur=.3;
    }
  }
  else if(A.state==='bounce'){
    // Small bounce after landing
    const p=progress;
    const bounceY=-Math.sin(p*Math.PI)*8*(1-p);
    const tp=menuAnimGetPlatPos(A.curPlat,cx,baseY);
    A.x=tp.x; A.y=tp.y+Math.sin(gt*1.5+A.curPlat*.9)*2.5*.38+bounceY;
    A.sqX=1+Math.sin(p*Math.PI*2)*.06;
    A.sqY=1-Math.sin(p*Math.PI*2)*.06;
    A.rot=0;

    if(progress>=1){
      A.state='idle';
      A.t=0;
      A.dur=1.5+Math.random()*1.5; // 1.5-3s idle
      A.sqX=1; A.sqY=1; A.rot=0;
    }
  }
}

function drawMenuCharacter(cx,baseY){
  const dt=.016;
  menuAnimUpdate(dt,cx,baseY);
  const A=MENU_ANIM;

  // --- Draw trail ---
  A.trail.forEach(tr=>{
    ctx.globalAlpha=tr.life*.6;
    if(tr.type==='spark'){
      // Spark — small glowing dot
      ctx.fillStyle=tr.col;
      ctx.shadowColor=tr.col;ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(tr.x,tr.y,tr.sz*tr.life,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    } else {
      // Streak — elongated
      ctx.fillStyle=tr.col;
      ctx.shadowColor=tr.col;ctx.shadowBlur=4;
      ctx.beginPath();ctx.ellipse(tr.x,tr.y,tr.sz*1.5*tr.life,tr.sz*.5*tr.life,A.rot,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  });

  // --- Draw landing particles ---
  A.landParts.forEach(lp=>{
    ctx.globalAlpha=lp.life;
    ctx.fillStyle=lp.col;
    ctx.shadowColor=lp.col;ctx.shadowBlur=3;
    ctx.beginPath();ctx.arc(lp.x,lp.y,lp.sz*lp.life,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
  });

  // --- Landing impact glow ---
  if(A.state==='land'){
    const impactA=.25*(1-A.t/A.dur);
    ctx.fillStyle=`rgba(255,213,79,${impactA})`;
    ctx.beginPath();ctx.ellipse(A.x,A.y+5,30*(1+A.t/A.dur*.5),8,0,0,Math.PI*2);ctx.fill();
  }

  // --- Shadow under character ---
  const shadowScale=A.state==='jump'?.6:1;
  const shadowAlpha=A.state==='jump'?.06:.12;
  ctx.fillStyle=`rgba(0,0,0,${shadowAlpha})`;
  // Shadow stays on the platform the character is heading to during jump
  if(A.state==='jump'){
    const tp=menuAnimGetPlatPos(A.targetPlat,cx,baseY);
    ctx.beginPath();ctx.ellipse(tp.x,tp.y+5+Math.sin(gt*1.5+A.targetPlat*.9)*2.5*.38,18*shadowScale,4*shadowScale,0,0,Math.PI*2);ctx.fill();
  } else {
    ctx.beginPath();ctx.ellipse(A.x,A.y+18,18,4.5,0,0,Math.PI*2);ctx.fill();
  }

  // --- Draw character with appropriate sprite ---
  const isInAir=A.state==='jump';
  let menuSprite=null;
  if(A.state==='idle'||A.state==='bounce') menuSprite='look';
  else if(A.state==='prepare') menuSprite='jumpup';
  else if(A.state==='jump') menuSprite='spin';
  else if(A.state==='land') menuSprite='jumpsplash';
  drawFrog(A.x,A.y,1.05,A.rot,A.sqX,A.sqY,isInAir,0,menuSprite);
}

  const ni=Math.min(ci+1,pads.length-1);
  const np=pads[ni];
  if(np){frogCont=np.gameX;visLane=np.gameX}
  lastIdx=ci;
  state=ST.PLAY;
  sfxPU();shake=.2;
  addFloat('👼 ВОСКРЕСІННЯ!',W/2,H*.35,'#FFD54F',24);
  for(let i=0;i<15;i++){
    const a=rand(0,Math.PI*2);
    addP(W/2,H*.4,Math.cos(a)*.06,Math.sin(a)*.05-.02,
      ['#FFD700','#FFF','#FFE082'][i%3],rand(2,3),.6,'s');
  }
  startMus();
}
function overTap(x,y){
  const showRevive=canRevive();
  const hasAnyRec=newScoreRec||newRec;
  const pw=Math.min(W*.82,320),cx=W/2,rw=pw*.68,rx=cx-rw/2;
  const ph=(hasAnyRec?480:450)+(showRevive?56:0);
  let ty=H/2-ph/2+22; // match drawOver layout
  ty+=38; // title
  if(newScoreRec)ty+=24;
  ty+=42+28; // score + label
  ty+=100; // stats box
  // Revive button
  if(showRevive){
    const rvY=ty+2;
    if(x>=rx&&x<=rx+rw&&y>=rvY&&y<=rvY+44){doRevive();return}
    ty+=44+10;
  }
  // Retry
  const ry=ty+4;
  if(x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+44){startGame();return}
  ty=ry+44+10;
  if(x>=rx&&x<=rx+rw&&y>=ty&&y<=ty+36){sfxClick();state=ST.MENU}
}

// ========== SKINS ==========
function drawSkins(){
  drawBg();drawWater();ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.85)';rr(8,8,W-16,46,14);ctx.fill();
  ctx.strokeStyle='rgba(76,175,80,.3)';ctx.lineWidth=1;rr(8,8,W-16,46,14);ctx.stroke();
  ctx.fillStyle='#333';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('👾 СКІНИ',W/2,38);
  ctx.fillStyle='rgba(76,175,80,.8)';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText('← Назад',22,38);
  ctx.fillStyle='#E65100';ctx.font='bold 12px sans-serif';ctx.textAlign='right';ctx.fillText('🪙 '+coins,W-20,38);
  const cw=Math.min(W-30,280),ch=72,sy=70;
  for(let i=0;i<SKINS.length;i++){
    const s=SKINS[i],cx2=W/2-cw/2,cy=sy+i*(ch+8);
    if(cy<-ch||cy>H)continue;
    ctx.fillStyle=i===curSkin?'rgba(76,175,80,.15)':'rgba(255,255,255,.8)';rr(cx2,cy,cw,ch,14);ctx.fill();
    if(i===curSkin){ctx.strokeStyle='rgba(76,175,80,.6)';ctx.lineWidth=2;rr(cx2,cy,cw,ch,14);ctx.stroke()}
    else{ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=1;rr(cx2,cy,cw,ch,14);ctx.stroke()}
    ctx.save();const os=curSkin;curSkin=i;drawFrog(cx2+38,cy+ch/2,.6,0,1,1,false,0);curSkin=os;ctx.restore();
    ctx.fillStyle='#333';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText(s.n,cx2+70,cy+28);
    if(s.o){ctx.fillStyle=i===curSkin?'#2E7D32':'rgba(120,120,120,.6)';ctx.font='12px sans-serif';ctx.fillText(i===curSkin?'✅ Обрано':'Натисніть',cx2+70,cy+48)}
    else{ctx.fillStyle='#FF9800';ctx.font='bold 12px sans-serif';ctx.fillText('🪙 '+s.p,cx2+70,cy+48)}
  }
}
function skinsTap(x,y){
  if(y<55&&x<90){sfxClick();state=ST.MENU;return}
  const cw=Math.min(W-30,280),ch=72,sy=70;
  for(let i=0;i<SKINS.length;i++){const cx2=W/2-cw/2,cy=sy+i*(ch+8);
    if(x>=cx2&&x<=cx2+cw&&y>=cy&&y<=cy+ch){const s=SKINS[i];
      if(s.o){curSkin=i;sfxClick();saveSkins()}
      else if(coins>=s.p){coins-=s.p;s.o=true;curSkin=i;localStorage.setItem('fCoins',''+coins);sfxPU();saveSkins()}
      else sfxLand();return}}
}

// ========== MAIN LOOP ==========
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.035);lastT=ts;
  ctx.clearRect(0,0,W,H);
  switch(state){
    case ST.MENU:drawMenu();break;
    case ST.PLAY:updateGame(dt);drawGame();break;
    case ST.OVER:drawGame();drawOver();break;
    case ST.SKINS:drawSkins();break;
  }
  requestAnimationFrame(loop);
}
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
initClouds();initBflies();initSideObjects();initAtmo();requestAnimationFrame(loop);
</script>
