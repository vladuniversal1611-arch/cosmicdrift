/* ── HUD ── */

<script>
"use strict";
/* ============================================================
   THE LAST SEED — Останнє Насіння
   Модульна структура:
     DATA    — всі ігрові дані (острови, будівлі, тварини,
               вороги, сюжет, колекція, скіни, квести, досягнення).
               Нові острови/тварини/будівлі додаються ТУТ,
               без зміни логіки.
     SaveSys — збереження (localStorage, автозбереження)
     Isl     — генерація та стан островів (сітка тайлів)
     Game    — основна логіка (очищення, садіння, ріст, ідл)
     Battle  — бої з істотами темряви
     FX      — частинки, погода, день/ніч
     Critters— живність (птахи, метелики, звірі)
     Render  — малювання світу на canvas
     UI      — HUD, вікна, карта, колекція, досягнення
     Quests  — щоденні завдання
     Ach     — досягнення (генеруються з таблиць — 200+)
     Story   — сюжетні глави
     Snd     — прості звуки (WebAudio)
   ============================================================ */
/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n);
const now=()=>Date.now();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];

const GRID={C:7,R:8,T:48,ox:32,oy:150};
let S=null;
function freshState(){return{
 v:1,res:{seed:6,wood:0,water:6,stone:0,dust:25,crystal:0},
 light:75,cur:0,unlocked:1,isl:{},up:{power:0,cap:0,growth:0,luck:0},
 skins:['classic'],skin:'classic',col:[],ach:[],
 stats:{},daily:{d:'',q:[]},story:[],set:{snd:1,mus:1},
 prodAcc:{},t:now(),days:[],bossDown:0,fin:0,adT:0};}
const SaveSys={
 KEY:'lastseed_save',
 save(){S.t=now();try{localStorage.setItem(this.KEY,JSON.stringify(S))}catch(e){}},
 load(){try{const r=localStorage.getItem(this.KEY);return r?JSON.parse(r):null}catch(e){return null}},
 reset(){try{localStorage.removeItem(this.KEY)}catch(e){}},
 has(){try{return!!localStorage.getItem(this.KEY)}catch(e){return false}}
};
function stat(k,n){S.stats[k]=(S.stats[k]||0)+n;Ach.check(k);Quests.prog(k,n);}

/* ================= ISLANDS (сітка) ================= */
const Isl={
 def(){return DATA.islands[S.cur]},
 /* детермінована генерація форми острова */
 gen(i){
  const w=DATA.islands[i],r=mulberry32(i*7919+37),tiles=[];
  const cx=(GRID.C-1)/2,cy=(GRID.R-1)/2;
  /* прірви (потрібен міст) */
  const gapRows=[];for(let g=0;g<(w.gaps||0);g++)gapRows.push(2+Math.floor(r()*3)+g*2);
  /* річка: випадкова колонка-змійка */
  let riv=-1;const rivCol=[];
  if(w.river){riv=2+Math.floor(r()*(GRID.C-4));let c=riv;
   for(let y=0;y<GRID.R;y++){rivCol.push(c);if(r()<.4)c=clamp(c+(r()<.5?-1:1),1,GRID.C-2);}}
  for(let y=0;y<GRID.R;y++)for(let x=0;x<GRID.C;x++){
   const dx=(x-cx)/(cx+.6),dy=(y-cy)/(cy+.6);
   const act=dx*dx+dy*dy+ (r()*.3-.15) < 1.02;
   let t={x,y,a:act?1:0,s:0,o:'',g:0,ts:0,cd:0,gift:0,w:0,gp:0};
   if(act&&gapRows.includes(y)&&x>0&&x<GRID.C-1)t.gp=1;   /* прірва */
   if(act&&!t.gp&&w.river&&rivCol[y]===x)t.w=1;           /* річка */
   if(act&&!t.gp&&!t.w){const q=r();
    if(q<.16)t.o='dead';else if(q<.28)t.o='rock';
    else if(q<.34)t.o='crys';
    else if(q<.34+.24)t.o='enemy:'+pick(r,w.enemies);}
   tiles.push(t);}
  /* стартова галявина внизу по центру */
  const sx=Math.floor(cx),sy=GRID.R-1;
  const st=tiles.find(t=>t.x===sx&&t.y===sy&&t.a)||tiles.filter(t=>t.a&&!t.gp).sort((a,b)=>b.y-a.y)[0];
  [[0,0],[-1,0],[1,0],[0,-1]].forEach(d=>{const t=Isl.at(tiles,st.x+d[0],st.y+d[1]);
   if(t&&t.a&&!t.gp&&!t.w){t.s=1;t.o=d[0]===0&&d[1]===0?'sprout':'';}});
  /* бос-тайл у центрі останнього острова */
  if(w.boss){const bt=Isl.at(tiles,Math.floor(cx),1)||tiles.find(t=>t.a&&t.y<=2&&!t.gp);
   if(bt){bt.w=0;bt.gp=0;bt.o='boss';}}
  return{tiles,done:0,anim:[]};
 },
 at(tiles,x,y){return(x<0||y<0||x>=GRID.C||y>=GRID.R)?null:tiles[y*GRID.C+x]},
 cur(){if(!S.isl[S.cur])S.isl[S.cur]=this.gen(S.cur);return S.isl[S.cur]},
 tile(x,y){return this.at(this.cur().tiles,x,y)},
 /* чи можна дістатись до тайла (сусід очищений або міст) */
 reachable(t){const g=this.cur().tiles;
  return[[0,1],[0,-1],[1,0],[-1,0]].some(d=>{const n=this.at(g,t.x+d[0],t.y+d[1]);
   return n&&n.a&&((n.s===1&&!n.gp)||(n.gp&&n.o==='b:bridge'));});},
 lifePct(i){const isl=S.isl[i];if(!isl)return 0;
  const act=isl.tiles.filter(t=>t.a&&!t.gp);
  const cl=act.filter(t=>t.s===1).length;
  return act.length?cl/act.length:0;},
 complete(i){const isl=S.isl[i];if(!isl)return false;
  if(this.lifePct(i)<1)return false;
  if(DATA.islands[i].boss&&!S.bossDown)return false;
  return true;}
};

const Game={
 mode:'norm',buildSel:null,dirty:true,
 lightMax(){let m=100+S.up.cap*25;m+=this.countB('tower',true)*20;return m},
 lightRegen(){return .4*(1+this.countB('tower',true)*.5)},   /* за секунду */
 dmg(){return 1+S.up.power},
 luck(){return 1+S.up.luck*.15},
 growTime(){return 32*Math.pow(.88,S.up.growth)},           /* сек на стадію */
 countB(key,all){let n=0;const scan=isl=>isl.tiles.forEach(t=>{if(t.o==='b:'+key)n++});
  if(all)for(const i in S.isl)scan(S.isl[i]);else scan(Isl.cur());return n;},
 helpers(){let h=0;for(const i in S.isl){const isl=S.isl[i];
   const houses=isl.tiles.filter(t=>t.o==='b:house').length;
   const anims=isl.anim.filter(a=>['rabbit','squirrel','hedgehog'].includes(a)).length;
   h+=Math.min(houses,anims);}return h;},
 canPay(cost){return Object.keys(cost).every(k=>S.res[k]>=cost[k])},
 pay(cost){for(const k in cost)S.res[k]-=cost[k];UI.hud();},
 gain(g,mul){mul=mul||1;const out={};
  for(const k in g){const v=Math.max(1,Math.round(g[k]*mul));S.res[k]+=v;out[k]=v;
   stat('got'+({seed:'seed',wood:'wood',water:'water',stone:'stone',dust:'dust'}[k]||k),v);}
  UI.hud();return out;},

 /* ── дотик до тайла ── */
 tap(t){const w=Isl.def();
  if(this.mode==='plant')return this.plant(t);
  if(this.mode==='build')return this.place(t);
  if(!t.a)return;
  /* бос */
  if(t.o==='boss'&&t.s===0){if(Isl.lifePct(S.cur)>=.999){Battle.start(t,'heart');}
   else UI.toast('Спершу очисти весь острів! 🖤');return;}
  /* темний тайл */
  if(t.s===0&&!t.gp){
   if(!Isl.reachable(t)){UI.toast('Задалеко! Очищуй землю поруч із зеленою.');return;}
   if(t.o.startsWith('enemy:')){Battle.start(t,t.o.slice(6));return;}
   if(S.light<w.cost){UI.toast('Мало світла ☀️ Зачекай, воно відновиться.');Snd.p('no');return;}
   S.light-=w.cost;stat('lightSpent',w.cost);this.cleanse(t);return;}
  if(t.gp){if(t.o!=='b:bridge')UI.toast('Прірва! Побудуй тут міст 🌉');return;}
  /* очищений тайл: обʼєкти */
  if(t.o==='dead'){t.g++;FX.burst(t,'#caa46a',5);Snd.p('chop');
   if(t.g>=3){t.o='';t.g=0;const got=this.gain({wood:3+Math.floor(Math.random()*3)},this.luck());
    UI.toast('+'+got.wood+' 🪵');this.dirty=true;}return;}
  if(t.o==='rock'){t.g++;FX.burst(t,'#aab0b8',5);Snd.p('chop');
   if(t.g>=4){t.o='';t.g=0;const got=this.gain({stone:3+Math.floor(Math.random()*3)},this.luck());
    UI.toast('+'+got.stone+' 🪨');this.dirty=true;}return;}
  if(t.o==='crys'){t.o='';const got=this.gain({dust:6},this.luck());
   if(Math.random()<.3*this.luck()){S.res.crystal++;stat('gotcrystal',1);UI.toast('+'+got.dust+' ✨ +1 💎!');}
   else UI.toast('+'+got.dust+' ✨');FX.burst(t,'#ffe887',10);Snd.p('gem');this.dirty=true;return;}
  if(t.o==='flower'){t.o='';Game.unlockCol(w.flower.id);this.gain({dust:2});
   FX.burst(t,'#ffb8e0',8);Snd.p('pick');UI.toast(w.flower.em+' '+w.flower.nm+' — до колекції!');this.dirty=true;return;}
  if(t.o==='tree'&&t.gift){t.gift=0;this.treeGift(t);return;}
  if(t.w&&t.s===1){if(now()>t.cd){t.cd=now()+30000;const got=this.gain({water:2},this.luck());
    UI.toast('+'+got.water+' 💧');FX.burst(t,'#7fd0ff',7);Snd.p('water');}
   else UI.toast('Джерело відновлюється… 💧');return;}
  if(t.o.startsWith('b:')){const b=DATA.buildings[t.o.slice(2)];
   UI.toast(b.em+' '+b.nm+(b.prod?' — працює!':''));return;}
  if(t.o==='sprout')UI.toast('🌱 Тут усе почалося…');
 },
 cleanse(t){t.s=1;stat('cleansed',1);
  FX.burst(t,'#8ce87a',14);FX.flash();Snd.p('cleanse');
  const got=this.gain({dust:1+Math.floor(Math.random()*2)},this.luck());
  if(Math.random()<.15*this.luck()){S.res.seed++;stat('gotseed',1);}
  this.dirty=true;this.checkLife();UI.hud();
  if(Isl.lifePct(S.cur)>=1)this.tryComplete();
 },
 plant(t){if(!t.a||t.s!==1||t.o||t.w||t.gp){UI.toast('Потрібна вільна зелена земля 🌱');return;}
  if(S.res.seed<1||S.res.water<2){UI.toast('Треба: 1 🌰 + 2 💧');Snd.p('no');return;}
  S.res.seed--;S.res.water-=2;t.o='tree';t.g=0;t.ts=now();
  stat('planted',1);FX.burst(t,'#7ae06e',10);Snd.p('plant');this.dirty=true;UI.hud();
 },
 place(t){const key=this.buildSel;if(!key)return;const b=DATA.buildings[key];
  if(b.gap){if(!t.gp||t.o){UI.toast('Міст будується лише над прірвою!');return;}}
  else if(!t.a||t.s!==1||t.o||t.w||t.gp){UI.toast('Потрібна вільна зелена земля 🔨');return;}
  if(this.countB(key)>=b.max){UI.toast('Ліміт на цьому острові: '+b.max);return;}
  if(!this.canPay(b.cost)){UI.toast('Не вистачає ресурсів');Snd.p('no');return;}
  this.pay(b.cost);t.o='b:'+key;stat('built',1);stat('built_'+key,1);
  if(key==='bridge')stat('bridges',1);
  FX.burst(t,'#ffd98c',12);Snd.p('build');this.dirty=true;
  UI.toast(b.em+' '+b.nm+' збудовано!');this.setMode('norm');
 },
 treeGift(t){const w=Isl.def();stat('gifts',1);
  const roll=Math.random();let got;
  if(roll<.55)got=this.gain({wood:2},this.luck()),UI.toast('🎁 +'+got.wood+' 🪵');
  else if(roll<.85)got=this.gain({seed:1}),UI.toast('🎁 +1 🌰');
  else got=this.gain({dust:3},this.luck()),UI.toast('🎁 +'+got.dust+' ✨');
  FX.burst(t,'#ffe887',8);Snd.p('gift');this.dirty=true;
 },
 unlockCol(id){if(S.col.includes(id))return;S.col.push(id);
  S.stats.colCount=S.col.length;Ach.check('colCount');
  const c=DATA.collection.find(c=>c.id===id);
  if(c)UI.achPop('📖 Колекція: '+c.em+' '+c.nm);},
 checkLife(){const p=Isl.lifePct(S.cur)*100,isl=Isl.cur();
  DATA.animalStages.forEach(a=>{if(p>=a.p&&!isl.anim.includes(a.id)){
   isl.anim.push(a.id);this.unlockCol('an_'+a.id);
   Critters.spawnKind(a.id);UI.toast(a.em+' '+a.nm+' повертаються!');Snd.p('animal');}});},
 tryComplete(){const i=S.cur;if(S.isl[i].done)return;
  if(!Isl.complete(i))return;
  S.isl[i].done=1;stat('islandsDone',1);
  const w=DATA.islands[i];
  this.unlockCol(w.art.id);this.unlockCol('sp'+i);
  S.res.crystal+=5+i*2;stat('gotcrystal',5+i*2);
  if(S.unlocked<DATA.islands.length&&S.unlocked===i+1){S.unlocked=i+1+1>DATA.islands.length?S.unlocked:i+2;
   if(i+1<DATA.islands.length)this.unlockCol(DATA.islands[i+1].seed.id);}
  SaveSys.save();
  UI.ceremony(w,i);},

 setMode(m,sel){this.mode=m;this.buildSel=sel||null;
  $('bbPlant').classList.toggle('on',m==='plant');
  $('bbBuild').classList.toggle('on',m==='build');
  const h=$('modeHint');
  if(m==='plant'){h.textContent='🌱 Торкнись зеленої землі (1 🌰 + 2 💧)';h.style.opacity=1;}
  else if(m==='build'){const b=DATA.buildings[sel];h.textContent='🔨 Обери місце для: '+b.em+' '+b.nm;h.style.opacity=1;}
  else h.style.opacity=0;},

 /* ── тік ── */
 tick(dt){
  S.light=clamp(S.light+this.lightRegen()*dt,0,this.lightMax());
  const isl=Isl.cur(),gt=this.growTime()*1000;
  let changed=false;
  isl.tiles.forEach(t=>{
   if(t.o==='tree'&&t.g<3&&now()-t.ts>gt){t.g++;t.ts=now();changed=true;
    if(t.g===3){stat('grown',1);this.unlockCol(Isl.def().plant.id);FX.burst(t,'#8ce87a',8);}}
   if(t.o==='tree'&&t.g===3&&!t.gift&&now()-t.ts>75000){t.gift=1;t.ts=now();changed=true;}
   if(t.o==='tree'&&t.gift&&this.helpers()>0&&now()-t.ts>15000){t.gift=0;t.ts=now();this.treeGift(t);}
  });
  /* квіти виростають самі */
  if(Math.random()<dt*.008){const free=isl.tiles.filter(t=>t.a&&t.s===1&&!t.o&&!t.w&&!t.gp);
   if(free.length){pick(Math.random,free) .o='flower';changed=true;}}
  /* виробництво будівель (по всіх островах) */
  for(const i in S.isl)S.isl[i].tiles.forEach(t=>{
   if(!t.o.startsWith('b:'))return;const b=DATA.buildings[t.o.slice(2)];if(!b.prod)return;
   for(const k in b.prod){S.prodAcc[k]=(S.prodAcc[k]||0)+b.prod[k]*dt/60;
    if(S.prodAcc[k]>=1){const n=Math.floor(S.prodAcc[k]);S.prodAcc[k]-=n;S.res[k]+=n;}}});
  if(changed)this.dirty=true;
 },
 /* ── офлайн-прогрес ── */
 offline(){const dt=Math.min((now()-S.t)/1000,8*3600);if(dt<180)return;
  const lightBefore=S.light;
  S.light=clamp(S.light+this.lightRegen()*dt,0,this.lightMax());
  const earned={};
  for(const i in S.isl)S.isl[i].tiles.forEach(t=>{
   if(t.o==='tree'&&t.g<3){const st=Math.floor(dt*1000/(this.growTime()*1000));
    const ng=Math.min(3,t.g+st);if(ng>t.g){if(ng===3)stat('grown',1);t.g=ng;t.ts=now();}}
   if(!t.o.startsWith('b:'))return;const b=DATA.buildings[t.o.slice(2)];if(!b.prod)return;
   for(const k in b.prod){const n=Math.floor(b.prod[k]*dt/60);if(n>0){S.res[k]+=n;earned[k]=(earned[k]||0)+n;}}});
  const em={seed:'🌰',wood:'🪵',water:'💧',stone:'🪨',dust:'✨',crystal:'💎'};
  let txt='Поки тебе не було ('+Math.floor(dt/60)+' хв):<br>☀️ світло відновилося';
  for(const k in earned)txt+='<br>'+em[k]+' +'+earned[k]+' — будівлі працювали';
  txt+='<br>🌳 дерева підросли';
  UI.big('💤','З поверненням!',txt,'Дякую!');this.dirty=true;
 }
};

/* ================= BATTLE ================= */
const Battle={
 on:false,tile:null,key:null,hp:0,hpMax:0,timer:null,shake:0,
 start(tile,key){const e=DATA.enemies[key],w=Isl.def();
  this.on=true;this.tile=tile;this.key=key;
  this.hpMax=Math.round(e.hp*(e.boss?1:w.hpMul));this.hp=this.hpMax;
  $('bName').textContent=(e.boss?'👁 ':'')+e.nm;
  $('battle').classList.add('on');this.draw();this.upd();
  clearInterval(this.timer);
  this.timer=setInterval(()=>this.enemyAtk(),e.boss?2000:2600);Snd.p('battle');},
 hit(){if(!this.on)return;const d=Game.dmg();this.hp-=d;this.shake=6;Snd.p('hit');
  FXb.burst();this.upd();
  if(this.hp<=0)this.win();},
 enemyAtk(){if(!this.on)return;const e=DATA.enemies[this.key],w=Isl.def();
  S.light=Math.max(0,S.light-(e.atk+w.id));this.upd();Snd.p('hurt');
  $('battle').style.background='rgba(60,8,24,.92)';
  setTimeout(()=>$('battle').style.background='',120);
  if(S.light<=0)this.flee(true);},
 win(){const e=DATA.enemies[this.key];this.end();
  stat('defeated',1);if(!e.boss)stat('kill_'+this.key,1);
  const got=Game.gain(e.drop,Game.luck());
  if(e.crys&&Math.random()<e.crys*Game.luck()){S.res.crystal++;stat('gotcrystal',1);}
  Snd.p('win');
  if(e.boss){stat('bossWin',1);S.bossDown=1;this.tile.o='';this.tile.s=1;
   Game.dirty=true;Game.checkLife();Game.tryComplete();return;}
  this.tile.o='';S.light=Math.max(0,S.light-Math.floor(Isl.def().cost/2));
  Game.cleanse(this.tile);
  UI.toast('⚔️ '+e.nm+' переможено!');},
 flee(forced){this.end();Snd.p('no');
  UI.toast(forced?'Світло вичерпано! Відпочинь ☀️':'Ти відступаєш…');},
 end(){this.on=false;clearInterval(this.timer);$('battle').classList.remove('on');},
 upd(){$('bHpFill').style.width=(this.hp/this.hpMax*100)+'%';
  $('bLightFill').style.width=(S.light/Game.lightMax()*100)+'%';UI.hud();},

const FX={
 parts:[],rain:false,rainT:0,rainbow:0,nextRain:now()+60000+Math.random()*90000,drops:[],
 dayT:Math.random()*240,
 burst(t,clr,n){const p=tileCenter(t);for(let i=0;i<n;i++)this.parts.push({
  x:p.x,y:p.y,vx:(Math.random()-.5)*90,vy:(Math.random()-.85)*90,l:.5+Math.random()*.5,c:clr,s:2+Math.random()*3});},
 spark(x,y,clr){this.parts.push({x,y,vx:(Math.random()-.5)*30,vy:-20-Math.random()*30,l:.8,c:clr,s:2});},
 flash(){const f=$('flash');f.style.opacity=.22;setTimeout(()=>f.style.opacity=0,90);},
 heart(x,y){this.parts.push({x,y,vx:(Math.random()-.5)*20,vy:-40,l:1,c:'#ff7aa8',s:4,h:1});},
 tick(dt){
  this.dayT=(this.dayT+dt)%240;
  this.parts=this.parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;p.l-=dt;return p.l>0;});
  FXb.parts=FXb.parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt;return p.l>0;});
  if(!this.rain&&now()>this.nextRain&&!document.hidden){this.rain=true;this.rainT=18;stat('rains',1);
   for(let i=0;i<40;i++)this.drops.push({x:Math.random()*400,y:Math.random()*720,v:380+Math.random()*160});}
  if(this.rain){this.rainT-=dt;this.drops.forEach(d=>{d.y+=d.v*dt;if(d.y>720){d.y=-10;d.x=Math.random()*400;}});
   if(this.rainT<=0){this.rain=false;this.drops=[];this.rainbow=10;this.nextRain=now()+90000+Math.random()*150000;}}
  if(this.rainbow>0)this.rainbow-=dt;
 },
 nightAmt(){const t=this.dayT/240; /* 0..0.5 день, 0.5..1 ніч */
  if(t<.42)return 0;if(t<.5)return(t-.42)/.08;if(t<.92)return 1;return 1-(t-.92)/.08;}
};

const Snd={ctx:null,
 init(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},
 p(kind){if(!S||!S.set.snd||!this.ctx)return;const c=this.ctx;if(c.state==='suspended')c.resume();
  const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
  const T={tap:[520,.05,'sine',.12],cleanse:[440,.35,'sine',.2,880],plant:[330,.25,'triangle',.18,520],
   chop:[180,.08,'square',.1],gem:[880,.3,'sine',.15,1320],water:[600,.2,'sine',.12,300],
   build:[240,.3,'triangle',.2,360],win:[523,.5,'triangle',.25,1046],no:[200,.15,'sawtooth',.08,140],
   hit:[300,.06,'square',.12],hurt:[140,.2,'sawtooth',.1,90],gift:[660,.25,'sine',.15,990],
   pet:[700,.15,'sine',.12,900],animal:[590,.4,'triangle',.2,880],ach:[784,.5,'triangle',.22,1175],battle:[220,.4,'sawtooth',.08,160],pick:[610,.15,'sine',.12]};
  const[f,d,w,v,f2]=T[kind]||T.tap;
  o.type=w;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.start(t);o.stop(t+d);}

/* ================= MUSIC (генеративний ембієнт) =================
   Тиха процедурна музика: повільне пентатонічне арпеджіо + м'який пад.
   Тон залежить від острова, темніє вночі. Без аудіофайлів. */
const Music={
 on:false,timer:null,step:0,master:null,
 /* пентатоніка (напівтони від базової ноти) */
 scale:[0,2,4,7,9,12,14,16],
 start(){if(!S||!S.set.mus||!Snd.ctx)return;if(this.on)return;
  const c=Snd.ctx;if(c.state==='suspended')c.resume();
  this.master=c.createGain();this.master.gain.value=0;this.master.connect(c.destination);
  this.master.gain.linearRampToValueAtTime(.5,c.currentTime+3);
  this.on=true;this.step=0;
  const bpmMs=520;
  this.timer=setInterval(()=>this.tick(),bpmMs);this.tick();},
 stop(){if(!this.on)return;this.on=false;clearInterval(this.timer);
  if(this.master){try{this.master.gain.linearRampToValueAtTime(0,Snd.ctx.currentTime+1.2);
   const m=this.master;setTimeout(()=>{try{m.disconnect()}catch(e){}},1400);}catch(e){}this.master=null;}},
 toggle(v){if(v)this.start();else this.stop();},
 base(){const isl=(S&&S.cur)||0;
  const roots=[57,55,53,50,52,60,48];        /* MIDI-корінь на острів */
  let r=roots[isl%roots.length];
  if(FX&&FX.nightAmt&&FX.nightAmt()>.5)r-=12; /* вночі нижче й спокійніше */
  return r;},
 midi(n){return 440*Math.pow(2,(n-69)/12)},
 note(freq,dur,vol,type){const c=Snd.ctx,t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
  o.frequency.value=freq;o.connect(g);g.connect(this.master);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.04);
  g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.start(t);o.stop(t+dur+.05);},
 tick(){if(!this.on||!this.master)return;
  const root=this.base(),s=this.scale;this.step++;
  /* арпеджіо — одна нота на такт */
  const deg=s[(this.step*3)%s.length];
  this.note(this.midi(root+12+deg),1.4,.16,'triangle');
  /* пад-акорд кожні 8 тактів */
  if(this.step%8===1){[0,4,7].forEach((iv,k)=>
   setTimeout(()=>this.on&&this.master&&this.note(this.midi(root+iv),4.5,.07,'sine'),k*40));}
  /* рідкісна висока «крапля» */
  if(Math.random()<.12)this.note(this.midi(root+24+pick(Math.random,s)),.9,.05,'sine');}
};

const Render={
 cv:null,c:null,st:null,sc:null,DPR:1,fox:{x:200,y:560,tx:200,ty:560,flip:false,blink:0},
 init(){this.cv=$('cv');this.DPR=Math.min(2,window.devicePixelRatio||1);

  this.sc=this.st.getContext('2d');this.sc.scale(this.DPR,this.DPR);},
 /* ── статичний шар: небо + суцільний острів + обʼєкти ──
    Тайли не малюються окремими квадратами: однакові заокруглені
    форми перекриваються й зливаються в один органічний острів. */
 drawStatic(){const c=this.sc,w=Isl.def(),isl=Isl.cur();
  const T=GRID.T,ox=GRID.ox,oy=GRID.oy;
  c.clearRect(0,0,400,720);
  /* небо */
  const g=c.createLinearGradient(0,0,0,720);g.addColorStop(0,w.sky[0]);g.addColorStop(1,w.sky[1]);
  c.fillStyle=g;c.fillRect(0,0,400,720);
  /* мʼякі хмари/пагорби вдалині */
  c.fillStyle='rgba(255,255,255,.12)';
  c.beginPath();c.ellipse(78,132,84,60,0,0,7);c.ellipse(320,116,64,46,0,0,7);c.ellipse(200,90,70,40,0,0,7);c.fill();
  const land=isl.tiles.filter(t=>t.a&&!t.gp);
  const XY=t=>({x:ox+t.x*T,y:oy+t.y*T});
  const key=(x,y)=>x+','+y;
  const landSet=new Set(land.map(t=>key(t.x,t.y)));
  /* заповнити внутрішні тайли суцільним квадратом → прибирає ромбики-шви;
     краєві тайли лишаються заокругленими → мʼякий контур острова */
  const fillInner=(list,inSet)=>list.forEach(t=>{
   if([[1,0],[-1,0],[0,1],[0,-1]].every(d=>inSet.has(key(t.x+d[0],t.y+d[1])))){
    const{x,y}=XY(t);c.fillRect(x-1,y-1,T+2,T+2);}});
  /* «містки» між сусідніми тайлами одного типу — тонкі смуги зливаються */
  const bridgeMerge=(list,inSet)=>list.forEach(t=>{const{x,y}=XY(t);
   if(inSet.has(key(t.x+1,t.y)))c.fillRect(x+T/2,y+4,T,T-8);
   if(inSet.has(key(t.x,t.y+1)))c.fillRect(x+4,y+T/2,T-8,T);});
  const fuse=(list,inSet)=>{bridgeMerge(list,inSet);fillInner(list,inSet);};
  /* 1) мʼяка тінь під островом */
  c.fillStyle='rgba(10,26,14,.20)';
  land.forEach(t=>{const{x,y}=XY(t);rr(c,x-4,y+6,T+8,T+8,22);c.fill();});
  /* 2) берег (світліша облямівка по краю острова) */
  c.fillStyle=w.dirt;
  land.forEach(t=>{const{x,y}=XY(t);rr(c,x-5,y-5,T+10,T+10,22);c.fill();});
  /* 3) суцільна трава: заокруглений контур + суцільна серцевина */
  const gg=c.createLinearGradient(0,oy,0,oy+GRID.R*T);
  gg.addColorStop(0,w.grass);gg.addColorStop(1,w.grass2);
  c.fillStyle=gg;
  land.forEach(t=>{const{x,y}=XY(t);rr(c,x-1,y-1,T+2,T+2,15);c.fill();});
  fuse(land,landSet);
  /* органічна текстура трави: мʼякі світлі й темні плями (детерміновано) */
  land.forEach(t=>{const{x,y}=XY(t);const h=(t.x*73+t.y*131)%100;
   if(h<45){c.fillStyle='rgba(255,255,255,.06)';c.beginPath();
    c.ellipse(x+12+(h%3)*9,y+14+(h%5)*4,10,7,0,0,7);c.fill();}
   if(h>=55){c.fillStyle='rgba(0,0,0,.05)';c.beginPath();
    c.ellipse(x+16+(h%4)*7,y+30-(h%3)*4,11,7,0,0,7);c.fill();}});
  /* 4) річка — суцільна стрічка (лише очищені водні тайли) */
  const water=land.filter(t=>t.w&&t.s===1),waterSet=new Set(water.map(t=>key(t.x,t.y)));
  if(water.length){c.fillStyle=w.water;
   water.forEach(t=>{const{x,y}=XY(t);rr(c,x-2,y-2,T+4,T+4,15);c.fill();});
   fuse(water,waterSet);
   c.fillStyle='rgba(255,255,255,.10)';
   water.forEach(t=>{const{x,y}=XY(t);rr(c,x+2,y+2,T-4,7,4);c.fill();});}
  /* 5) темрява — суцільна мʼяка пляма поверх землі */
  const dark=land.filter(t=>t.s===0),darkSet=new Set(dark.map(t=>key(t.x,t.y)));
  if(dark.length){c.fillStyle=w.dark;
   dark.forEach(t=>{const{x,y}=XY(t);rr(c,x-2,y-2,T+4,T+4,15);c.fill();});
   fuse(dark,darkSet);
   /* легкий фіолетовий туман */
   c.fillStyle='rgba(120,80,200,.16)';
   dark.forEach(t=>{if((t.x+t.y)%2)return;const{x,y}=XY(t);
    c.beginPath();c.ellipse(x+T/2,y+T/2,13,10,0,0,7);c.fill();});
   /* серце боса */
   const bt=dark.find(t=>t.o==='boss');
   if(bt){const{x,y}=XY(bt);c.fillStyle='#c22a5a';c.beginPath();
    c.moveTo(x+24,y+34);c.bezierCurveTo(x+8,y+22,x+14,y+8,x+24,y+18);
    c.bezierCurveTo(x+34,y+8,x+40,y+22,x+24,y+34);c.fill();}}
  /* 6) обʼєкти на очищеній землі */
  land.filter(t=>t.s===1).forEach(t=>{const{x,y}=XY(t);const cx=x+T/2,cy=y+T/2;
   if(t.o==='dead'){c.strokeStyle='#6a5240';c.lineWidth=4;c.lineCap='round';
    c.beginPath();c.moveTo(cx,y+40);c.lineTo(cx,y+14);c.moveTo(cx,y+24);c.lineTo(cx-9,y+15);c.moveTo(cx,y+28);c.lineTo(cx+9,y+18);c.stroke();}
   else if(t.o==='rock'){c.fillStyle='#8a9098';c.beginPath();
    c.moveTo(x+10,y+38);c.lineTo(x+16,y+20);c.lineTo(x+28,y+14);c.lineTo(x+38,y+30);c.lineTo(x+34,y+38);c.fill();
    c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.moveTo(x+18,y+22);c.lineTo(x+26,y+17);c.lineTo(x+28,y+24);c.fill();}
   else if(t.o==='crys'){c.fillStyle='#8ae0ff';
    c.beginPath();c.moveTo(cx,y+10);c.lineTo(cx+8,y+26);c.lineTo(cx,y+40);c.lineTo(cx-8,y+26);c.fill();
    c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.moveTo(cx,y+13);c.lineTo(cx+4,y+24);c.lineTo(cx,y+30);c.fill();}
   else if(t.o==='flower'){this.flower(c,cx,cy,w);}
   else if(t.o==='sprout'){c.strokeStyle='#3d8a3a';c.lineWidth=3;c.lineCap='round';
    c.beginPath();c.moveTo(cx,y+40);c.quadraticCurveTo(cx,y+26,cx-6,y+20);c.stroke();
    c.fillStyle='#7ae06e';c.beginPath();c.ellipse(cx-7,y+18,6,4,-.6,0,7);c.ellipse(cx+4,y+24,6,4,.6,0,7);c.fill();}
   else if(t.o==='tree')this.tree(c,cx,y,t.g,w);
   else if(t.o.startsWith('b:'))this.building(c,x,y,t.o.slice(2));
  });
  /* 7) прірви й мости */
  isl.tiles.filter(t=>t.a&&t.gp).forEach(t=>{const{x,y}=XY(t);

const Quests={
 ensure(){const d=todayStr();if(S.daily.d===d&&S.daily.q.length)return;

  DATA.islands.forEach((w,i)=>{const un=i<S.unlocked,done=S.isl[i]&&S.isl[i].done;
   const p=Math.round(Isl.lifePct(i)*100);
   h+='<div class="isl'+(un?'':' lock')+'" data-isl="'+(un?i:-1)+'"><div class="em">'+(un?w.em:'🔒')+'</div>'+
    '<div><h4>'+w.nm+'</h4><p>'+(un?w.sub:'Відроди попередній острів')+'</p>'+
    (un?'<div class="pr"><i style="width:'+p+'%"></i></div>':'')+'</div>'+
    '<div class="st">'+(done?'🌸':un?(i===S.cur?'📍':''):'')+'</div></div>';});
  h+='</div>';this.modal('🗺️ Карта Світу',h);},
 goIsland(i){if(i<0||i>=S.unlocked)return;
  if(S.cur!==i){S.cur=i;Game.unlockCol(DATA.islands[i].seed.id);
   Game.dirty=true;Critters.reset();
   const st=Isl.cur().tiles.find(t=>t.o==='sprout')||Isl.cur().tiles.find(t=>t.s===1);
   if(st)Render.foxTo(st);SaveSys.save();}
  this.close();this.hud();this.toast(DATA.islands[i].em+' '+DATA.islands[i].nm);},

 /* ── будівництво ── */
 showBuild(){let h='';const w=Isl.def();
  for(const k in DATA.buildings){const b=DATA.buildings[k];
   const cnt=Game.countB(k),can=Game.canPay(b.cost)&&cnt<b.max;
   h+='<div class="card"><div style="display:flex;gap:10px;align-items:center">'+
    '<div style="font-size:28px">'+b.em+'</div><div style="flex:1"><h4>'+b.nm+' <span style="color:#6a9a76;font-size:10px">'+cnt+'/'+b.max+'</span></h4>'+
    '<p>'+b.d+'</p><div class="cost">'+this.costStr(b.cost)+'</div></div>'+
    '<button class="btn'+(can?'':' dis')+'" data-build="'+k+'">Обрати</button></div></div>';}
  this.modal('🔨 Будівництво',h);},

 /* ── квести ── */
 showQuests(){Quests.ensure();let h='<p style="font-size:10px;color:#6a9a76;margin:0 2px 10px">Нові завдання — щодня!</p>';
  S.daily.q.forEach((q,i)=>{const def=DATA.daily.find(d=>d.id===q.id);
   const done=q.cur>=q.goal;
   h+='<div class="card"><div style="display:flex;gap:10px;align-items:center">'+
    '<div style="font-size:24px">'+def.em+'</div><div style="flex:1"><h4>'+def.nm+'</h4>'+
    '<p>'+Math.min(q.cur,q.goal)+' / '+q.goal+'</p></div>'+
    (q.claimed?'<span style="font-size:18px">✅</span>':
     '<button class="btn'+(done?' gold':' dis')+'" data-claim="'+i+'">2💎</button>')+'</div></div>';});
  this.modal('📜 Щоденні завдання',h);},

 /* ── меню-хаб ── */
 showMenu(){const h=['col:📖 Колекція','ach:🏆 Досягнення','tree:🌳 Дерево Життя','story:📚 Історія',
  'skins:🎀 Образи лисички','up:🛠️ Майстерня','set:⚙️ Налаштування'].map(s=>{const[k,nm]=s.split(':');
  return '<div class="card" data-menu="'+k+'" style="cursor:pointer"><h4>'+nm+'</h4></div>';}).join('');
  this.modal('🦊 Меню',h);},

 showCol(cat){cat=cat||'Рослини';const cats=[...new Set(DATA.collection.map(c=>c.cat))];
  const items=DATA.collection.filter(c=>c.cat===cat);
  let h='<div class="grid3">';
  items.forEach(c=>{const got=S.col.includes(c.id);
   h+='<div class="colItem'+(got?'':' lk')+'"><div class="em">'+(got?c.em:'❔')+'</div>'+
    '<div class="nm">'+(got?c.nm:c.hint)+'</div></div>';});
  h+='</div>';
  this.modal('📖 Колекція ('+S.col.length+'/'+DATA.collection.length+')',h,cats);
  this.colCat=cat;},
 showAch(){const got=DATA.ach.filter(a=>S.ach.includes(a.id)).length;
  let h='<p style="font-size:10px;color:#6a9a76;margin:0 2px 10px">Здобуто '+got+' з '+DATA.ach.length+'</p>';
  const sorted=[...DATA.ach].sort((a,b)=>(S.ach.includes(b.id)?1:0)-(S.ach.includes(a.id)?1:0));
  sorted.slice(0,120).forEach(a=>{const has=S.ach.includes(a.id);
   const cur=Math.min(S.stats[a.stat]||0,a.n);
   h+='<div class="achRow'+(has?' got':'')+'"><span class="em">'+(has?a.em:'🔒')+'</span>'+
    '<div><h5>'+a.nm+'</h5><p>'+a.d+' — '+cur+'/'+a.n+'</p></div><span class="rw">+'+a.rw+'💎</span></div>';});
  if(DATA.ach.length>120)h+='<p style="text-align:center;font-size:10px;color:#6a9a76">…і ще '+(DATA.ach.length-120)+' попереду</p>';
  this.modal('🏆 Досягнення',h);},
 showTree(){const done=S.stats.islandsDone||0;
  let br='';
  for(let i=0;i<7;i++){const a=-90+(i-3)*24,on=i<done;
   br+='<g transform="rotate('+a+' 100 150)"><line x1="100" y1="150" x2="100" y2="'+(150-70-i%2*12)+'" stroke="'+(on?'#7a5c3d':'#3a3448')+'" stroke-width="7" stroke-linecap="round"/>'+
   (on?'<circle cx="100" cy="'+(150-76-i%2*12)+'" r="16" fill="'+['#4da03c','#5cb890','#8ac84e','#78c85e','#e8845a','#ffc8ea','#d8b0ff'][i]+'"/>':'')+'</g>';}
  const h='<div style="text-align:center"><svg viewBox="0 0 200 210" style="width:230px">'+
   '<ellipse cx="100" cy="196" rx="60" ry="10" fill="#1a3a24"/>'+
   '<path d="M92 196 Q90 150 100 130 Q110 150 108 196 Z" fill="#7a5c3d"/>'+br+
   (S.fin?'<circle cx="100" cy="70" r="30" fill="#ffe9a0" opacity=".9"/><text x="100" y="80" text-anchor="middle" font-size="28">🌸</text>':'')+
   '</svg><p style="font-size:12px;color:#a9d4b0;line-height:1.6">Гілок оживлено: '+done+' / 7<br>'+
   (S.fin?'Дерево Життя розквітло! Світ врятовано! 🌸':done<7?'Відроджуй острови — і Дерево Життя ростиме.':'')+'</p></div>';
  this.modal('🌳 Дерево Життя',h);},
 showStory(){let h='';const order=['intro','ch0','ch1','ch2','ch3','ch4','ch5','ch6','finale'];
  order.forEach((k,i)=>{const seen=S.story.includes(k);
   h+='<div class="card" '+(seen?'data-story="'+k+'" style="cursor:pointer"':'')+'>'+
    '<h4>'+(seen?DATA.story[k].art+' Глава '+(i===0?'Пролог':i===8?'Фінал':i):'🔒 ???')+'</h4>'+
    '<p>'+(seen?'Торкнись, щоб переглянути':'Продовжуй пригоду, щоб відкрити')+'</p></div>';});
  this.modal('📚 Історія',h);},
 showSkins(){let h='<p style="font-size:10px;color:#6a9a76;margin:0 2px 10px">Косметика. Жодних переваг у грі 💚</p>';
  DATA.skins.forEach(sk=>{const own=S.skins.includes(sk.id),on=S.skin===sk.id;
   h+='<div class="card"><div style="display:flex;gap:10px;align-items:center">'+
    '<div style="width:34px;height:34px;border-radius:50%;background:'+sk.body+';border:3px solid '+sk.belly+'"></div>'+
    '<div style="flex:1"><h4>'+sk.nm+'</h4></div>'+
    (on?'<span style="font-size:16px">✅</span>':own?'<button class="btn" data-wear="'+sk.id+'">Одягти</button>':
     '<button class="btn gold'+(S.res.crystal>=sk.cost?'':' dis')+'" data-buyskin="'+sk.id+'">'+sk.cost+' 💎</button>')+
    '</div></div>';});
  const cd=Math.max(0,180-Math.floor((now()-S.adT)/1000));
  h+='<div class="card"><div style="display:flex;gap:10px;align-items:center"><div style="font-size:24px">🎬</div>'+
   '<div style="flex:1"><h4>Подарунок</h4><p>Переглянь рекламу — отримай кристали</p></div>'+
   '<button class="btn gold'+(cd>0?' dis':'')+'" data-ad="1">'+(cd>0?cd+'с':'+3 💎')+'</button></div></div>';
  this.modal('🎀 Образи',h);},
 showUp(){if(Game.countB('workshop',true)<1){this.modal('🛠️ Майстерня','<div class="card"><h4>Спершу побудуй Майстерню!</h4><p>Знайдеш її в меню будівництва 🔨</p></div>');return;}
  let h='';const em={dust:'✨',water:'💧'};
  for(const k in DATA.upgrades){const u=DATA.upgrades[k],lv=S.up[k];
   const cost=Math.round(u.base*Math.pow(1.6,lv)),maxed=lv>=u.max,can=S.res[u.res]>=cost;
   h+='<div class="card"><div style="display:flex;gap:10px;align-items:center">'+
    '<div style="font-size:24px">'+u.em+'</div><div style="flex:1"><h4>'+u.nm+' <span style="color:#6a9a76;font-size:10px">рів. '+lv+'/'+u.max+'</span></h4>'+
    '<p>'+u.d+'</p></div>'+
    (maxed?'<span style="font-size:14px">МАКС</span>':'<button class="btn'+(can?'':' dis')+'" data-up="'+k+'">'+em[u.res]+cost+'</button>')+'</div></div>';}
  this.modal('🛠️ Майстерня',h);},
 showSet(){const h='<div class="card"><div style="display:flex;align-items:center;gap:10px"><h4 style="flex:1">🔊 Звук</h4>'+
   '<button class="btn'+(S.set.snd?'':' dark')+'" data-snd="1">'+(S.set.snd?'Увімкнено':'Вимкнено')+'</button></div></div>'+
   '<div class="card"><div style="display:flex;align-items:center;gap:10px"><h4 style="flex:1">🎵 Музика</h4>'+
   '<button class="btn'+(S.set.mus?'':' dark')+'" data-mus="1">'+(S.set.mus?'Увімкнено':'Вимкнено')+'</button></div></div>'+
   '<div class="card"><h4>💾 Збереження</h4><p>Гра зберігається автоматично кожні 10 секунд.</p></div>'+
   '<div class="card"><h4>🗑️ Скинути прогрес</h4><p>Почати світ заново. Незворотньо!</p>'+
   '<button class="btn dark" data-reset="1" style="margin-top:8px">Скинути все</button></div>'+
   '<p style="text-align:center;font-size:9px;color:#4c8a5c;letter-spacing:2px;margin-top:14px">ОСТАННЄ НАСІННЯ v1.0</p>';
  this.modal('⚙️ Налаштування',h);},

 /* ── церемонія відродження острова ── */
 ceremony(w,i){FX.rainbow=12;Snd.p('win');
  this.big(w.em+'✨','ОСТРІВ ВІДРОДЖЕНО!',
   '<b>'+w.nm+'</b> знову живий!<br>+'+(5+i*2)+' 💎 · Нова гілка Дерева Життя 🌳<br>'+
   w.art.em+' Знайдено артефакт: <b>'+w.art.nm+'</b>',
   'Продовжити',()=>{Story.play('ch'+i,()=>{
    if(i===6){if(!S.fin)UI.finale();}
    else UI.big('🗺️','Новий шлях відкрито!',DATA.islands[i+1].em+' <b>'+DATA.islands[i+1].nm+'</b> чекає на тебе!','У путь!',()=>UI.showMap());});});},
 finale(){S.fin=1;S.res.crystal+=25;FX.rainbow=20;SaveSys.save();
  Story.play('finale',()=>{
   UI.big('🌸','СВІТ ВРЯТОВАНО!','Зелена хвиля прокотилася планетою.<br>Дерево Життя розквітло. Тварини повернулись додому.<br><br>+25 💎<br><br>Ти — новий Хранитель природи. Гра триває: доглядай свій світ, збирай колекцію та досягнення! 💚','Жити далі!');});},

 /* ── обробник дій у модалках ── */
 act(d){
  if(d.isl!==undefined)return this.goIsland(+d.isl);
  if(d.build){this.close();Game.setMode('build',d.build);return;}
  if(d.claim!==undefined)return Quests.claim(+d.claim);
  if(d.menu){const m=d.menu;
   if(m==='col')return this.showCol();if(m==='ach')return this.showAch();
   if(m==='tree')return this.showTree();if(m==='story')return this.showStory();
   if(m==='skins')return this.showSkins();if(m==='up')return this.showUp();
   if(m==='set')return this.showSet();}
  if(d.tab)return this.showCol(d.tab);
  if(d.story){this.close();Story.play(d.story);return;}
  if(d.wear){S.skin=d.wear;Snd.p('pick');return this.showSkins();}
  if(d.buyskin){const sk=DATA.skins.find(s=>s.id===d.buyskin);
   if(S.res.crystal>=sk.cost){S.res.crystal-=sk.cost;S.skins.push(sk.id);S.skin=sk.id;
    S.stats.skinsOwned=S.skins.length;Ach.check('skinsOwned');Snd.p('gem');this.hud();}
   return this.showSkins();}
  if(d.ad){/* Точка інтеграції реклами (AdMob rewarded):
     заміни setTimeout на показ реального rewarded ad і нараховуй
     винагороду в колбеку onRewarded. */
   if(now()-S.adT<180000)return;S.adT=now();
   this.toast('🎬 Дякуємо за підтримку!');S.res.crystal+=3;stat('gotcrystal',3);this.hud();return this.showSkins();}
  if(d.up){const u=DATA.upgrades[d.up],lv=S.up[d.up];
   const cost=Math.round(u.base*Math.pow(1.6,lv));
   if(lv<u.max&&S.res[u.res]>=cost){S.res[u.res]-=cost;S.up[d.up]++;Snd.p('build');this.hud();}
   return this.showUp();}
  if(d.snd){S.set.snd=S.set.snd?0:1;return this.showSet();}
  if(d.mus){S.set.mus=S.set.mus?0:1;Music.toggle(!!S.set.mus);return this.showSet();}
  if(d.reset){if(this.resetArm){SaveSys.reset();location.reload();}
   else{this.resetArm=true;this.toast('Торкнись ще раз для підтвердження!');setTimeout(()=>this.resetArm=false,3000);}return;}
 }
};

/* ================= INPUT ================= */
function bindInput(){
 $('mBody').addEventListener('click',e=>{const a=e.target.closest('[data-act],[data-isl],[data-build],[data-claim],[data-menu],[data-story],[data-wear],[data-buyskin],[data-ad],[data-up],[data-snd],[data-mus],[data-reset]');
  if(a)UI.act(a.dataset);});
 $('mTabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)UI.act(t.dataset);});
 $('mX').onclick=()=>UI.close();
 $('bbPlant').onclick=()=>{Game.setMode(Game.mode==='plant'?'norm':'plant');Snd.p('tap');};
 $('bbBuild').onclick=()=>{Snd.p('tap');if(Game.mode==='build')Game.setMode('norm');else UI.showBuild();};
 $('bbMap').onclick=()=>{Snd.p('tap');UI.showMap();};
 $('bbQuest').onclick=()=>{Snd.p('tap');UI.showQuests();};
 $('bbMenu').onclick=()=>{Snd.p('tap');UI.showMenu();};
 $('bigBtn').onclick=()=>{$('bigOv').classList.remove('on');const cb=UI.bigCb;UI.bigCb=null;cb&&cb();};
 $('bCvWrap').addEventListener('pointerdown',e=>{e.preventDefault();Battle.hit();});
 $('bFlee').onclick=()=>Battle.flee(false);
 $('cv').addEventListener('pointerdown',e=>{
  const r=$('cv').getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*400,y=(e.clientY-r.top)/r.height*720;
  if(Game.mode==='norm'&&Critters.tapAt(x,y))return;
  const tx=Math.floor((x-GRID.ox)/GRID.T),ty=Math.floor((y-GRID.oy)/GRID.T);
  const t=Isl.tile(tx,ty);
  if(t&&t.a){Render.foxTo(t);Game.tap(t);}});
}

/* ================= MAIN LOOP ================= */
let lastT=performance.now();
function loop(ts){const dt=Math.min(.1,(ts-lastT)/1000);lastT=ts;
 if(S){Game.tick(dt);FX.tick(dt);
  Render.frame(ts/1000);
  if(Battle.on)Battle.draw();
  hudTimer+=dt;if(hudTimer>.5){hudTimer=0;UI.hud();}
  saveTimer+=dt;if(saveTimer>10){saveTimer=0;SaveSys.save();}}
 requestAnimationFrame(loop);}
let hudTimer=0,saveTimer=0;

/* ================= SCALE (під будь-який екран) ================= */
function fitScreen(){const g=$('G');
 const s=Math.min(window.innerWidth/400,window.innerHeight/720);
 g.style.transform='scale('+s+')';g.style.transformOrigin='center';}
window.addEventListener('resize',fitScreen);

/* ================= INIT ================= */
function startGame(fresh){
 if(fresh){SaveSys.reset();S=freshState();}
 else{S=SaveSys.load()||freshState();
  /* міграція старих збережень */
  const f=freshState();for(const k in f)if(S[k]===undefined)S[k]=f[k];}
 $('title').style.display='none';
 Isl.cur();Quests.ensure();
 Game.unlockCol(DATA.islands[S.cur].seed.id);
 Critters.reset();Game.dirty=true;UI.hud();UI.qDot();
 const st=Isl.cur().tiles.find(t=>t.o==='sprout')||Isl.cur().tiles.find(t=>t.s===1);
 if(st){const p=tileCenter(st);Render.fox.x=Render.fox.tx=p.x;Render.fox.y=Render.fox.ty=p.y;}
 if(fresh)Story.play('intro',()=>UI.toast('Торкнись темної землі поруч із зеленою! 🌱'));
 else Game.offline();
 if(S.set.mus)Music.start();
 SaveSys.save();
}
window.addEventListener('load',()=>{
 fitScreen();Render.init();bindInput();Snd.init();
 const has=SaveSys.has();
 $('tPlay').style.display=has?'':'none';
 $('tPlay').onclick=()=>{Snd.p('tap');startGame(false);};
 $('tNew').onclick=()=>{Snd.p('tap');
  if(has&&!UI.newArm){UI.newArm=true;UI.toast('Старе збереження буде втрачено! Торкнись ще раз.');
   setTimeout(()=>UI.newArm=false,3000);return;}
  startGame(true);};
 requestAnimationFrame(loop);});
document.addEventListener('visibilitychange',()=>{if(!S)return;
 if(document.hidden){SaveSys.save();Music.stop();}
 else if(S.set.mus)Music.start();});
window.addEventListener('beforeunload',()=>{if(S)SaveSys.save();});
</script>
