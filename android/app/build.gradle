plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tinykingdom.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.tinykingdom.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Перед публікацією налаштуйте власний signingConfig (див. README)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* Веб-версія гри (index.html, css/, js/ у корені репозиторію) автоматично
   копіюється в assets при кожній збірці — правте гру в одному місці. */
tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'css/**', 'js/**'
    }
    into 'src/main/assets'
}
preBuild.dependsOn 'copyWebAssets'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // Для реальної reward-реклами додайте: implementation 'com.google.android.gms:play-services-ads:23.2.0'
    // Для покупок: implementation 'com.android.billingclient:billing:7.0.0'
}
