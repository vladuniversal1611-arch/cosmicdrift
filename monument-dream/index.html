<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6e2d8">
<title>Монумент — архітектурний сон</title>
<!--
  МОНУМЕНТ — ізометрична головоломка у дусі Monument Valley.
  Один файл, Three.js (r160) з CDN, уся геометрія та «текстури» генеруються кодом.

  Ключові ідеї реалізації:
  • Камера — строго ізометрична OrthographicCamera, напрям погляду (1,1,1) → кут 35.264°.
    Через відсутність перспективи будь-яка точка P і P + k·(1,1,1) збігаються на екрані.
  • Шлях — граф вузлів (верх плитки / сходинки). Кожен вузол має «порти» — середини
    країв його поверхні. Два вузли з'єднані, якщо їхні порти збігаються в ЕКРАННИХ
    координатах (а не у world-space) і дивляться у протилежні боки. Саме так працюють
    оптичні ілюзії: шляхи, далекі в 3D, «склеюються» у проєкції.
  • Обертання / зсув секцій перебудовує граф → відкриває чи закриває проходи.
  • Колір: власний шейдер — пласкі пастельні заливки на 3 видимі грані (верх/ліво/право),
    запечений воксельний ambient occlusion у вершинах, «туман» знизу, що розчиняє
    колони у фоновому градієнті.
-->
<style>
  :root{ --bgTop:#fdeee3; --bgBot:#f2cfc4; --ink:rgba(96,74,84,.78); --fade:#fbf2ec; }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bgBot);}
  body{
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    font-family:"Cormorant Garamond","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  }
  /* небо — ніжний вертикальний градієнт (той самий градієнт повторює туман у шейдері) */
  #sky{position:fixed;inset:0;background:linear-gradient(to bottom,var(--bgTop),var(--bgBot));}
  canvas#c{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;}
  /* дуже легка віньєтка поверх усього: однаково лягає і на небо, і на споруди */
  #veil{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 55%,rgba(60,30,50,.07) 100%);}
  #fade{position:fixed;inset:0;background:var(--fade);opacity:1;pointer-events:none;transition:opacity 1.3s ease;}
  #title{position:fixed;left:0;right:0;top:calc(8% + env(safe-area-inset-top));text-align:center;color:var(--ink);
    opacity:0;transition:opacity 2s ease;pointer-events:none;}
  #title .num{font-size:12px;letter-spacing:.7em;margin-bottom:12px;padding-left:.7em;opacity:.8}
  #title .name{font-size:clamp(20px,4.6vw,30px);letter-spacing:.34em;padding-left:.34em;font-weight:300;font-style:italic}
  #title .line{width:38px;height:1px;background:currentColor;opacity:.45;margin:14px auto 0}
  #end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ink);opacity:0;pointer-events:none;transition:opacity 2.4s ease;}
  #end .big{font-size:clamp(26px,6vw,40px);letter-spacing:.42em;padding-left:.42em;font-weight:300;font-style:italic}
  #end .line{width:46px;height:1px;background:currentColor;opacity:.4;margin:22px auto}
  #end .small{font-size:12px;letter-spacing:.38em;padding-left:.38em;opacity:.65}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--ink);
    letter-spacing:.2em;font-size:14px;padding:24px}
</style>
</head>
<body>
<div id="sky"></div>
<div id="veil"></div>
<div id="title"><div class="num"></div><div class="name"></div><div class="line"></div></div>
<div id="end"><div class="big">завершено</div><div class="line"></div><div class="small">торкніться, щоб почати знову</div></div>
<div id="err">не вдалося завантажити three.js — потрібне з'єднання з мережею</div>
<div id="fade"></div>

<script type="module">
/* =====================================================================
   0. ЗАВАНТАЖЕННЯ THREE.JS (cdnjs, з резервними CDN)
   ===================================================================== */
let THREE = null;
const THREE_SRC = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
  'https://unpkg.com/three@0.160.0/build/three.module.min.js',
];
for (const url of THREE_SRC) {
  try { THREE = await import(url); break; } catch (e) { console.warn('three.js: не вдалося', url); }
}
if (!THREE) {
  document.getElementById('err').style.display = 'flex';
  document.getElementById('fade').style.opacity = 0;
  throw new Error('three.js unavailable');
}

/* Кольори задаються «як є» (hex → екран без гамма-перетворень) — так пастель точно
   відповідає задуманій палітрі. */
THREE.ColorManagement.enabled = false;

const V3 = THREE.Vector3;
const SQ2 = Math.SQRT2, SQ6 = Math.sqrt(6), SQ3 = Math.sqrt(3);
const ISO = new V3(1, 1, 1).normalize();          // напрям «до камери»
const PARAMS = new URLSearchParams(location.search);
const DEBUG = PARAMS.has('debug');

/* Ізометрична проєкція у світових одиницях.
   Камера дивиться вздовж -(1,1,1), up = +Y  ⇒  right = (1,0,-1)/√2, screenUp = (-1,2,-1)/√6.
   Точки P і P + k(1,1,1) мають однакові екранні координати — основа всіх ілюзій. */
function scr(p) { return { x: (p.x - p.z) / SQ2, y: (2 * p.y - p.x - p.z) / SQ6 }; }
function depthOf(p) { return p.x + p.y + p.z; }    // більше = ближче до камери
function scrDist(a, b) { const A = scr(a), B = scr(b); return Math.hypot(A.x - B.x, A.y - B.y); }

/* =====================================================================
   1. РЕНДЕР, КАМЕРА, СПІЛЬНІ УНІФОРМИ
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.domElement.id = 'c';
document.body.insertBefore(renderer.domElement, document.getElementById('veil'));

const scene = new THREE.Scene();
// Ортографічна камера — жодної перспективи
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 400);

// Уніформи, спільні для всіх матеріалів (посилання на ті самі об'єкти {value})
const U = {
  bgTop: { value: new THREE.Color('#fdeee3') },
  bgBot: { value: new THREE.Color('#f2cfc4') },
  res:   { value: new THREE.Vector2(1, 1) },
  fog:   { value: new THREE.Vector2(-1.5, -8) },   // (y, де туман починається; y, де він повний)
  time:  { value: 0 },
};

let view = { cx: 0, cy: 0, hw: 6, hh: 4.5 };
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight, asp = w / h;
  const hh = Math.max(view.hh, view.hw / asp);
  camera.left = -hh * asp; camera.right = hh * asp; camera.top = hh; camera.bottom = -hh;
  camera.updateProjectionMatrix();
  // світова точка на площині y=0, що проєктується в центр кадру
  const T = new V3((view.cx * SQ2 - view.cy * SQ6) / 2, 0, (-view.cx * SQ2 - view.cy * SQ6) / 2);
  camera.position.copy(T).addScaledVector(ISO, 150);
  camera.up.set(0, 1, 0);
  camera.lookAt(T);
  camera.updateMatrixWorld();
}
function onResize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  const b = renderer.getDrawingBufferSize(new THREE.Vector2());
  U.res.value.set(b.x, b.y);
  fitCamera();
}
window.addEventListener('resize', onResize);

/* =====================================================================
   2. МАТЕРІАЛ «МОНУМЕНТ»: пласкі пастельні грані + AO + туман у фон
   ===================================================================== */
const VS = /* glsl */`
  attribute float ao;
  varying float vAo; varying vec3 vN; varying float vY;
  void main(){
    vAo = ao;
    vN  = normalize(mat3(modelMatrix) * normal);   // нормаль у світі (лише обертання)
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vY = wp.y;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const FS = /* glsl */`
  uniform vec3 cTop, cLeft, cRight, bgTop, bgBot;
  uniform vec2 res, fog;
  uniform float glow, opacity, fogOn;
  varying float vAo; varying vec3 vN; varying float vY;
  void main(){
    vec3 n = normalize(vN);
    vec3 w = n * n;                                     // ваги граней (сума = 1)
    // З камери (1,1,1) видно лише +X (праву), +Y (верх), +Z (ліву) грані.
    vec3 c = cTop  * w.y * (n.y > 0.0 ? 1.0 : 0.55)
           + cRight* w.x * (n.x > 0.0 ? 1.0 : 0.80)
           + cLeft * w.z * (n.z > 0.0 ? 1.0 : 0.80);
    c *= vAo;                                           // легкий запечений AO
    c = mix(c, vec3(1.0, 0.99, 0.96), glow);            // світіння ручок/кнопок
    // туман: що нижче — то більше розчиняється у ТОЙ САМИЙ градієнт неба
    float t  = clamp(gl_FragCoord.y / res.y, 0.0, 1.0);
    vec3 bg  = mix(bgBot, bgTop, t);
    float f  = clamp((fog.x - vY) / (fog.x - fog.y), 0.0, 1.0);
    f = f * f * (3.0 - 2.0 * f) * fogOn;
    gl_FragColor = vec4(mix(c, bg, f), opacity);
  }`;

function makeMat(top, left, right, opts = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      cTop: { value: new THREE.Color(top) }, cLeft: { value: new THREE.Color(left) }, cRight: { value: new THREE.Color(right) },
      glow: { value: 0 }, opacity: { value: 1 }, fogOn: { value: opts.noFog ? 0 : 1 },
      bgTop: U.bgTop, bgBot: U.bgBot, res: U.res, fog: U.fog,
    },
    vertexShader: VS, fragmentShader: FS,
    transparent: !!opts.transparent,
    side: opts.side || THREE.FrontSide,
  });
}

// Додає атрибут 'ao' до будь-якої стандартної геометрії (f(x,y,z) → яскравість)
function aoGeom(geo, f) {
  const p = geo.attributes.position, a = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) a[i] = f ? f(p.getX(i), p.getY(i), p.getZ(i)) : 1;
  geo.setAttribute('ao', new THREE.BufferAttribute(a, 1));
  return geo;
}

/* =====================================================================
   3. ГЕНЕРАЦІЯ ГЕОМЕТРІЇ: вокселі з AO, сходи, коробки
   ===================================================================== */
// Грані куба: нормаль n і дотичні t1,t2, такі що t1 × t2 = n (обхід CCW ззовні)
const FACES = [
  { n: [1, 0, 0],  t1: [0, 1, 0], t2: [0, 0, 1] },
  { n: [-1, 0, 0], t1: [0, 0, 1], t2: [0, 1, 0] },
  { n: [0, 1, 0],  t1: [0, 0, 1], t2: [1, 0, 0] },
  { n: [0, -1, 0], t1: [1, 0, 0], t2: [0, 0, 1] },
  { n: [0, 0, 1],  t1: [1, 0, 0], t2: [0, 1, 0] },
  { n: [0, 0, -1], t1: [0, 1, 0], t2: [1, 0, 0] },
];
const CORNERS = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
const AO_LUT = [0.72, 0.82, 0.91, 1.0];        // «легкий» ambient occlusion

class GB {   // простий будівельник BufferGeometry
  constructor() { this.pos = []; this.nor = []; this.ao = []; this.idx = []; }
  quad(v, n, ao) {
    const i = this.pos.length / 3;
    for (let k = 0; k < 4; k++) {
      this.pos.push(v[k][0], v[k][1], v[k][2]);
      this.nor.push(n[0], n[1], n[2]);
      this.ao.push(ao ? ao[k] : 1);
    }
    // розворот діагоналі, щоб AO-градієнт не «ламався»
    if (ao && ao[0] + ao[2] < ao[1] + ao[3]) this.idx.push(i, i + 1, i + 3, i + 1, i + 2, i + 3);
    else this.idx.push(i, i + 1, i + 2, i, i + 2, i + 3);
  }
  // осьова коробка [min,max]; нижні вершини бічних граней трохи темніші (контактна тінь)
  box(min, max, aoBottom = 0.88, skipBottom = true) {
    const c = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
    const h = [(max[0] - min[0]) / 2, (max[1] - min[1]) / 2, (max[2] - min[2]) / 2];
    for (const f of FACES) {
      if (skipBottom && f.n[1] === -1) continue;
      const v = [], ao = [];
      for (const [s1, s2] of CORNERS) {
        const p = [0, 1, 2].map(k => c[k] + h[k] * (f.n[k] + s1 * f.t1[k] + s2 * f.t2[k]));
        v.push(p);
        ao.push(f.n[1] === 0 && p[1] <= min[1] + 1e-6 ? aoBottom : 1);
      }
      this.quad(v, f.n, ao);
    }
  }
  geometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('ao', new THREE.Float32BufferAttribute(this.ao, 1));
    g.setIndex(this.idx);
    g.computeBoundingSphere();
    return g;
  }
}

const DIRS = { '+x': [1, 0, 0], '-x': [-1, 0, 0], '+z': [0, 0, 1], '-z': [0, 0, -1] };
const ckey = (x, y, z) => x + ',' + y + ',' + z;

/* =====================================================================
   4. ЧАСТИНА СПОРУДИ (Part): жорстка група — статична, обертова чи рухома.
      Клітинки задаються у світових координатах «у спокої».
   ===================================================================== */
class Part {
  constructor(lv, pivot = [0, 0, 0]) {
    this.lv = lv;
    this.pivot = new V3(...pivot);
    this.obj = new THREE.Group();
    this.obj.position.copy(this.pivot);
    this.base = this.pivot.clone();      // базова позиція (без зсуву слайдера / появи)
    this.offset = new V3();              // поточний зсув (слайдер, поява з туману)
    this.cells = new Map();
    this.stairs = [];
    this.enabled = true;                 // false — частина ще «не з'явилась»
    this.moving = false;                 // під час руху її вузли непрохідні
    lv.root.add(this.obj);
    lv.parts.push(this);
  }
  box(x, y, z, pal = 'a', walk = false) { this.cells.set(ckey(x, y, z), { x, y, z, pal, walk }); return this; }
  path(x, y, z, pal = 'a') { return this.box(x, y, z, pal, true); }
  col(x, z, y0, y1, pal = 'a') { for (let y = y0; y <= y1; y++) this.box(x, y, z, pal); return this; }
  stair(x, y, z, dir, pal = 'a') { this.stairs.push({ x, y, z, dir: DIRS[dir], pal }); return this; }
  add(mesh, x, y, z) { mesh.position.set(x - this.pivot.x, y - this.pivot.y, z - this.pivot.z); this.obj.add(mesh); return mesh; }
  applyOffset() { this.obj.position.copy(this.base).add(this.offset); }
  yaw() { const v = new V3(1, 0, 0).applyQuaternion(this.obj.quaternion); return Math.atan2(-v.z, v.x); }

  build() {
    const P = this.pivot, lv = this.lv;
    const occ = (x, y, z) => this.cells.has(ckey(x, y, z));
    const stairAt = (x, y, z) => this.stairs.some(s => s.x === x && s.y === y && s.z === z);
    const gbs = {};
    const gb = pal => gbs[pal] || (gbs[pal] = new GB());

    // --- воксельний меш із AO: показуємо лише грані, що не торкаються сусіда
    for (const c of this.cells.values()) {
      for (const f of FACES) {
        const nx = c.x + f.n[0], ny = c.y + f.n[1], nz = c.z + f.n[2];
        if (occ(nx, ny, nz)) continue;
        const v = [], ao = [];
        for (const [s1, s2] of CORNERS) {
          v.push([0, 1, 2].map(k => [c.x, c.y, c.z][k] - [P.x, P.y, P.z][k] + 0.5 * (f.n[k] + s1 * f.t1[k] + s2 * f.t2[k])));
          // класичний воксельний AO: два бокових сусіди + кутовий
          const a = occ(nx + s1 * f.t1[0], ny + s1 * f.t1[1], nz + s1 * f.t1[2]);
          const b = occ(nx + s2 * f.t2[0], ny + s2 * f.t2[1], nz + s2 * f.t2[2]);
          const cc = occ(nx + s1 * f.t1[0] + s2 * f.t2[0], ny + s1 * f.t1[1] + s2 * f.t2[1], nz + s1 * f.t1[2] + s2 * f.t2[2]);
          ao.push(AO_LUT[(a && b) ? 0 : 3 - (a + b + cc)]);
        }
        gb(c.pal).quad(v, f.n, ao);
      }
    }
    // --- сходи: 4 сходинки всередині клітинки, що піднімаються у напрямку dir
    const STEPS = 4;
    for (const s of this.stairs) {
      const cx = s.x - P.x, cy = s.y - P.y, cz = s.z - P.z, d = s.dir;
      for (let i = 0; i < STEPS; i++) {
        const a0 = -0.5 + i / STEPS, a1 = -0.5 + (i + 1) / STEPS;
        let xr = [-0.5, 0.5], zr = [-0.5, 0.5];
        if (d[0] === 1) xr = [a0, a1]; if (d[0] === -1) xr = [-a1, -a0];
        if (d[2] === 1) zr = [a0, a1]; if (d[2] === -1) zr = [-a1, -a0];
        gb(s.pal).box([cx + xr[0], cy - 0.5, cz + zr[0]], [cx + xr[1], cy - 0.5 + (i + 1) / STEPS, cz + zr[1]], 0.86);
      }
    }
    for (const pal in gbs) {
      const m = new THREE.Mesh(gbs[pal].geometry(), lv.mat(pal));
      m.userData.solid = true;
      this.obj.add(m);
      lv.solids.push(m);
    }
    // --- вузли шляху
    for (const c of this.cells.values()) {
      if (c.walk && !occ(c.x, c.y + 1, c.z) && !stairAt(c.x, c.y + 1, c.z)) lv.addNode(this, 'tile', [c.x, c.y + 0.5, c.z]);
    }
    for (const s of this.stairs) lv.addNode(this, 'stair', [s.x, s.y, s.z], s.dir);
  }
}

/* =====================================================================
   5. КЕРОВАНІ ЕЛЕМЕНТИ: обертач (Rotator) і повзун (Slider)
   ===================================================================== */
const wrapPI = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

class Rotator {
  constructor(lv, part, o) {
    this.lv = lv; this.part = part;
    this.axis = new V3(...(o.axis || [0, 1, 0])).normalize();
    this.step = Math.PI / 2;
    this.angle = this.target = (o.start || 0) * this.step;
    this.dragging = false; this.animating = false;
    // базис площини обертання: e2 = axis × e1 (додатний кут — e1 → e2)
    const tmp = Math.abs(this.axis.y) > 0.9 ? new V3(1, 0, 0) : new V3(0, 1, 0);
    this.e1 = tmp.sub(this.axis.clone().multiplyScalar(tmp.dot(this.axis))).normalize();
    this.e2 = new V3().crossVectors(this.axis, this.e1);
    // центр, навколо якого міряємо кут жесту — центр кільця-ручки (лежить на осі)
    this.center = new V3(...(o.handles.center || part.pivot.toArray()));
    this.apply();
    for (const h of o.handles) { h.userData.ctrl = this; lv.handles.push(h); }
    lv.ctrls.push(this);
  }
  apply() { this.part.obj.quaternion.setFromAxisAngle(this.axis, this.angle); }
  get index() { return ((Math.round(this.angle / this.step) % 4) + 4) % 4; }
  // кут вказівника навколо осі: розкладаємо екранний вектор у базисі проєкцій e1,e2
  pointerAngle(s) {
    const c = scr(this.center), a = scr(this.e1), b = scr(this.e2);
    const dx = s.x - c.x, dy = s.y - c.y, det = a.x * b.y - a.y * b.x;
    if (Math.abs(det) < 1e-6) return 0;
    return Math.atan2((a.x * dy - a.y * dx) / det, (dx * b.y - dy * b.x) / det);
  }
  dragStart(s) { this.dragging = true; this.prev = this.pointerAngle(s); this.lv.setMoving(this.part, true); }
  dragMove(s) {
    const a = this.pointerAngle(s);
    this.angle += wrapPI(a - this.prev); this.prev = a; this.target = this.angle; this.apply();
  }
  dragEnd(moved) {
    this.dragging = false;
    this.target = moved ? Math.round(this.angle / this.step) * this.step
                        : (Math.round(this.angle / this.step) + 1) * this.step;   // тап → +90°
    this.animating = true;
  }
  setIndex(i) { this.angle = this.target = i * this.step; this.apply(); this.settle(); }
  update(dt) {
    if (this.dragging || !this.animating) return;
    const d = this.target - this.angle;
    if (Math.abs(d) < 0.0015) { this.angle = this.target; this.apply(); this.animating = false; this.settle(); sfx.snap(); return; }
    this.angle += d * Math.min(1, dt * 9); this.apply();
  }
  settle() {
    // нормалізуємо кут, щоб не накопичувався
    const k = Math.round(this.angle / (2 * Math.PI)); this.angle -= k * 2 * Math.PI; this.target = this.angle; this.apply();
    this.lv.setMoving(this.part, false);
  }
  get busy() { return this.dragging || this.animating; }
}

class Slider {
  constructor(lv, part, o) {
    this.lv = lv; this.part = part;
    this.axis = new V3(...o.axis).normalize();
    this.min = o.min; this.max = o.max;
    this.value = this.target = o.value ?? 0;
    this.dir = 1; this.dragging = false; this.animating = false;
    this.apply();
    for (const h of o.handles) { h.userData.ctrl = this; lv.handles.push(h); }
    lv.ctrls.push(this);
  }
  apply() { this.part.offset.copy(this.axis).multiplyScalar(this.value); this.part.applyOffset(); }
  get index() { return Math.round(this.value); }
  dragStart(s) { this.dragging = true; this.s0 = s; this.v0 = this.value; this.lv.setMoving(this.part, true); }
  dragMove(s) {
    const a = scr(this.axis), dd = a.x * a.x + a.y * a.y;
    let v = this.v0 + ((s.x - this.s0.x) * a.x + (s.y - this.s0.y) * a.y) / dd;
    // м'яка «гумка» за межами діапазону
    if (v < this.min) v = this.min - (1 - Math.exp(-(this.min - v) * 2)) * 0.25;
    if (v > this.max) v = this.max + (1 - Math.exp(-(v - this.max) * 2)) * 0.25;
    this.value = v; this.apply();
  }
  dragEnd(moved) {
    this.dragging = false;
    if (moved) this.target = Math.min(this.max, Math.max(this.min, Math.round(this.value)));
    else {   // тап → крок, на краю розвертаємось
      let t = Math.round(this.value) + this.dir;
      if (t > this.max || t < this.min) { this.dir *= -1; t = Math.round(this.value) + this.dir; }
      this.target = Math.min(this.max, Math.max(this.min, t));
    }
    this.animating = true;
  }
  setValue(v) { this.value = this.target = v; this.apply(); this.settle(); }
  update(dt) {
    if (this.dragging || !this.animating) return;
    const d = this.target - this.value;
    if (Math.abs(d) < 0.001) { this.value = this.target; this.apply(); this.animating = false; this.settle(); sfx.snap(); return; }
    this.value += d * Math.min(1, dt * 8); this.apply();
  }
  settle() { this.lv.setMoving(this.part, false); }
  get busy() { return this.dragging || this.animating; }
}

/* =====================================================================
   6. РІВЕНЬ: збирання, декор, граф шляху
   ===================================================================== */
class Level {
  constructor(def, index) {
    this.def = def; this.index = index;
    this.root = new THREE.Group(); scene.add(this.root);
    this.parts = []; this.nodes = []; this.ctrls = []; this.handles = []; this.solids = [];
    this.anims = []; this.mats = {}; this.extraMats = []; this.pendingButtons = [];
    this.done = false;
    def.build(this);
    for (const p of this.parts) p.build();
    this.root.updateMatrixWorld(true);
    for (const b of this.pendingButtons) this.attachButton(b);
    this.start = this.nodeAt(def.start);
    this.goal = this.nodeAt(def.goal); this.goal.goal = true;
    this.portal(this.goal, def.goalDir);
    this.rebuildGraph();
    this.computeView();
  }
  mat(p) {
    if (!this.mats[p]) { const c = this.def.pals[p] || PAL_COMMON[p]; this.mats[p] = makeMat(c[0], c[1], c[2]); }
    return this.mats[p];
  }
  part(pivot) { return new Part(this, pivot); }
  rotator(part, o) { return new Rotator(this, part, o); }
  slider(part, o) { return new Slider(this, part, o); }

  // ---------- вузли ----------
  addNode(part, type, w, dir) {
    const local = new V3(w[0], w[1], w[2]).sub(part.pivot);
    const ports = [];
    if (type === 'tile') {
      for (const d of Object.values(DIRS)) ports.push({ p: local.clone().add(new V3(d[0] * 0.5, 0, d[2] * 0.5)), d: new V3(...d) });
    } else {   // сходи: нижній порт (−dir, на пів клітинки нижче) і верхній (+dir, вище)
      const d = new V3(...dir);
      ports.push({ p: local.clone().addScaledVector(d, -0.5).add(new V3(0, -0.5, 0)), d: d.clone().negate() });
      ports.push({ p: local.clone().addScaledVector(d, 0.5).add(new V3(0, 0.5, 0)), d: d.clone() });
    }
    const n = { id: this.nodes.length, part, type, local, ports, rest: new V3(...w), world: new V3(), edges: [], walkable: true };
    this.nodes.push(n);
    return n;
  }
  nodeWorld(n, t = new V3()) { return n.part.obj.localToWorld(t.copy(n.local)); }
  nodeAt(c) {   // c — координати клітинки (для плитки) у спокої
    return this.nodes.find(n => n.type === 'tile' && n.rest.x === c[0] && Math.abs(n.rest.y - (c[1] + 0.5)) < 1e-6 && n.rest.z === c[2])
        || this.nodes.find(n => n.rest.x === c[0] && n.rest.y === c[1] && n.rest.z === c[2]);
  }

  /* ГРАФ СУМІЖНОСТІ — серце ілюзій.
     Два вузли з'єднані, якщо їхні порти збігаються У ЕКРАННИХ координатах
     і дивляться у протилежні сторони. 3D-відстань не має значення. */
  rebuildGraph() {
    this.root.updateMatrixWorld(true);
    const occupied = new Set();
    for (const p of this.parts) {
      if (!p.enabled) continue;
      const add = (x, y, z) => {
        const w = p.obj.localToWorld(new V3(x - p.pivot.x, y - p.pivot.y, z - p.pivot.z));
        occupied.add(ckey(Math.round(w.x), Math.round(w.y), Math.round(w.z)));
      };
      for (const c of p.cells.values()) add(c.x, c.y, c.z);
      for (const s of p.stairs) add(s.x, s.y, s.z);
    }
    for (const n of this.nodes) {
      const m = n.part.obj.matrixWorld;
      this.nodeWorld(n, n.world);
      n.wports = n.ports.map(pt => ({ p: pt.p.clone().applyMatrix4(m), d: pt.d.clone().transformDirection(m) }));
      const up = new V3(0, 1, 0).transformDirection(m);
      let ok = n.part.enabled && !n.part.moving && up.y > 0.99;
      if (ok && n.type === 'tile') {
        const a = n.world.clone().add(new V3(0, 0.5, 0));
        if (occupied.has(ckey(Math.round(a.x), Math.round(a.y), Math.round(a.z)))) ok = false;
      }
      n.walkable = ok; n.edges = [];
    }
    const W = this.nodes.filter(n => n.walkable);
    for (let i = 0; i < W.length; i++) for (let j = i + 1; j < W.length; j++) {
      const a = W[i], b = W[j];
      for (const pa of a.wports) for (const pb of b.wports) {
        if (pa.d.dot(pb.d) > -0.99) continue;          // порти мають дивитися назустріч
        if (scrDist(pa.p, pb.p) > 0.05) continue;       // …і збігатися НА ЕКРАНІ
        a.edges.push({ to: b, pa: pa.p.clone(), pb: pb.p.clone() });
        b.edges.push({ to: a, pa: pb.p.clone(), pb: pa.p.clone() });
      }
    }
    if (DEBUG) this.drawDebug();
  }
  findPath(from, to) {     // BFS — найкоротший за кількістю кроків
    if (!from || !to) return null;
    const prev = new Map([[from, null]]), q = [from];
    while (q.length) {
      const n = q.shift();
      if (n === to) break;
      for (const e of n.edges) if (!prev.has(e.to)) { prev.set(e.to, n); q.push(e.to); }
    }
    if (!prev.has(to)) return null;
    const path = []; for (let n = to; n; n = prev.get(n)) path.unshift(n);
    return path;
  }
  setMoving(part, v) { part.moving = v; this.rebuildGraph(); }
  get busy() { return this.ctrls.some(c => c.busy) || this.anims.some(a => a.blocking); }

  // ---------- рамка камери за екранними межами споруди ----------
  computeView() {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    const fogTop = this.def.fog[0];
    const take = (w, padTop) => {
      if (w.y < fogTop - 1.5) return;
      const s = scr(w);
      x0 = Math.min(x0, s.x - 0.75); x1 = Math.max(x1, s.x + 0.75);
      y0 = Math.min(y0, s.y - 0.85); y1 = Math.max(y1, s.y + 0.85 + padTop);
    };
    for (const p of this.parts) {
      const off = p.enabled ? new V3() : p.offset.clone().negate();
      for (const c of p.cells.values()) take(p.obj.localToWorld(new V3(c.x, c.y, c.z).sub(p.pivot)).add(off), c.decorTop || 0);
      for (const s of p.stairs) take(p.obj.localToWorld(new V3(s.x, s.y, s.z).sub(p.pivot)).add(off), 0);
    }
    for (const w of this.viewExtra || []) take(new V3(...w), 0);
    const z = this.def.zoom || 1;
    view = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 + 0.35, hw: ((x1 - x0) / 2 + 1.1) * z, hh: ((y1 - y0) / 2 + 1.5) * z };
  }

  // ---------- декор ----------
  deco(part, geo, pal, x, y, z, solid = true) {
    if (!geo.attributes.ao) aoGeom(geo);
    const m = new THREE.Mesh(geo, this.mat(pal));
    part.add(m, x, y, z);
    if (solid) { m.userData.solid = true; this.solids.push(m); }
    return m;
  }
  viewPoint(x, y, z) { (this.viewExtra ||= []).push([x, y, z]); }
  // купол на барабані поверх клітинки
  dome(part, x, y, z, pal, r = 0.42) {
    const drum = this.deco(part, new THREE.CylinderGeometry(r + 0.03, r + 0.03, 0.14, 32), pal, x, y + 0.57, z);
    const dome = this.deco(part, aoGeom(new THREE.SphereGeometry(r, 32, 14, 0, Math.PI * 2, 0, Math.PI / 2), (px, py) => 0.9 + 0.1 * py / r), pal, x, y + 0.64, z);
    this.deco(part, new THREE.SphereGeometry(0.06, 12, 8), 'h', x, y + 0.66 + r, z);
    this.deco(part, new THREE.ConeGeometry(0.035, 0.32, 8), 'h', x, y + 0.8 + r, z);
    this.viewPoint(x, y + 1.6, z);
    return dome;
  }
  // мінарет: балкон, тонка вежа, купол, шпиль
  minaret(part, x, y, z, pal, pal2, h = 1.0) {
    this.deco(part, new THREE.CylinderGeometry(0.62, 0.55, 0.12, 32), pal2, x, y + 0.56, z);
    this.deco(part, aoGeom(new THREE.CylinderGeometry(0.3, 0.3, h, 28), (px, py) => 0.88 + 0.12 * (py / h + 0.5)), pal, x, y + 0.62 + h / 2, z);
    this.deco(part, new THREE.CylinderGeometry(0.4, 0.4, 0.08, 28), pal2, x, y + 0.62 + h, z);
    this.deco(part, aoGeom(new THREE.SphereGeometry(0.3, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2)), pal2, x, y + 0.66 + h, z);
    this.deco(part, new THREE.ConeGeometry(0.04, 0.42, 8), 'h', x, y + 1.12 + h, z);
    this.viewPoint(x, y + h + 1.6, z);
  }
  // пірамідальний дах
  spire(part, x, y, z, pal, h = 0.9) {
    const g = new THREE.ConeGeometry(0.71, h, 4); g.rotateY(Math.PI / 4);
    const m = this.deco(part, g, pal, x, y + 0.5 + h / 2, z);
    this.viewPoint(x, y + h + 0.6, z);
    return m;
  }
  // плаский візерунок на грані ('+x' — права видима, '+z' — ліва видима)
  onFace(part, mesh, x, y, z, face, dy = 0) {
    const d = DIRS[face];
    if (face === '+x') mesh.rotation.y = Math.PI / 2;
    part.add(mesh, x + d[0] * 0.503, y + dy, z + d[2] * 0.503);
    return mesh;
  }
  // готично-арабське вікно зі стрілчастою аркою
  window(part, x, y, z, face, pal = 'd', w = 0.3, h = 0.56) {
    const s = new THREE.Shape(), hs = h - w * 0.75;
    s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, hs);
    s.quadraticCurveTo(w / 2, hs + (h - hs) * 0.62, 0, h);
    s.quadraticCurveTo(-w / 2, hs + (h - hs) * 0.62, -w / 2, hs); s.closePath();
    const g = aoGeom(new THREE.ShapeGeometry(s, 12), (px, py) => 0.82 + 0.18 * py / h);
    return this.onFace(part, new THREE.Mesh(g, this.mat(pal)), x, y, z, face, -h / 2);
  }
  // священна геометрія: коло, вписаний трикутник / гексаграма, крапка
  symbol(part, x, y, z, face, pal = 'h', kind = 'tri') {
    const g = new THREE.Group();
    const ring = new THREE.Mesh(aoGeom(new THREE.RingGeometry(0.27, 0.305, 48)), this.mat(pal));
    g.add(ring);
    const tri = (rot, r0, r1) => {
      const s = new THREE.Shape(), hole = new THREE.Path();
      for (let i = 0; i < 3; i++) { const a = rot + i * 2 * Math.PI / 3; i ? s.lineTo(Math.cos(a) * r0, Math.sin(a) * r0) : s.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); }
      for (let i = 0; i < 3; i++) { const a = rot - i * 2 * Math.PI / 3; i ? hole.lineTo(Math.cos(a) * r1, Math.sin(a) * r1) : hole.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); }
      s.holes.push(hole);
      g.add(new THREE.Mesh(aoGeom(new THREE.ShapeGeometry(s)), this.mat(pal)));
    };
    tri(Math.PI / 2, 0.27, 0.215);
    if (kind === 'hex') tri(-Math.PI / 2, 0.27, 0.215);
    if (kind === 'eye') g.add(new THREE.Mesh(aoGeom(new THREE.RingGeometry(0.07, 0.1, 32)), this.mat(pal)));
    g.add(new THREE.Mesh(aoGeom(new THREE.CircleGeometry(0.04, 20)), this.mat(pal)));
    return this.onFace(part, g, x, y, z, face);
  }
  // тотем: ширяючий октаедр, що повільно обертається
  totem(part, x, y, z, pal = 'h', s = 0.26) {
    const g = new THREE.OctahedronGeometry(s, 0);
    const m = this.deco(part, g, pal, x, y, z, false);
    const ring = this.deco(part, new THREE.TorusGeometry(s * 1.55, 0.018, 8, 48), pal, x, y, z, false);
    ring.rotation.x = Math.PI / 2;
    const y0 = m.position.y, ph = Math.random() * 6;
    this.anims.push({ update: (t) => {
      m.rotation.y = t * 0.6 + ph; m.position.y = y0 + Math.sin(t * 1.1 + ph) * 0.07;
      ring.position.y = m.position.y; ring.rotation.z = Math.sin(t * 0.5 + ph) * 0.25;
    } });
    this.viewPoint(x, y + 0.5, z);
  }
  // м'які хмари внизу, що повільно дрейфують у тумані
  clouds(n, y, spread) {
    const P = this.part();
    for (let i = 0; i < n; i++) {
      const g = new THREE.Group();
      const k = 2 + Math.floor(Math.random() * 3);
      for (let j = 0; j < k; j++) {
        const r = 0.45 + Math.random() * 0.5;
        const m = new THREE.Mesh(aoGeom(new THREE.SphereGeometry(r, 24, 12)), this.mat('cloud'));
        m.position.set(j * 0.75 - k * 0.35, Math.random() * 0.15, (Math.random() - 0.5) * 0.5);
        m.scale.set(1.5, 0.38, 1.1);
        g.add(m);
      }
      const sx = spread.x0 + Math.random() * (spread.x1 - spread.x0), sz = spread.z0 + Math.random() * (spread.z1 - spread.z0);
      g.position.set(sx, y + Math.random() * 1.5, sz);
      P.obj.add(g);
      const sp = 0.08 + Math.random() * 0.08, range = spread.x1 - spread.x0;
      this.anims.push({ update: (t, dt) => {
        g.position.x += sp * dt; g.position.z -= sp * dt;
        if (g.position.x > spread.x1) { g.position.x -= range; g.position.z += range; }
      } });
    }
  }
  // кільце-ручка навколо осі обертача (горизонтальне «кермо» з 4 кнопками)
  collar(part, x, y, z, pal = 'h', r = 0.85) {
    const ms = [];
    const t = this.deco(part, new THREE.TorusGeometry(r, 0.06, 10, 56), pal, x, y, z, false); t.rotation.x = Math.PI / 2; ms.push(t);
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      const k = this.deco(part, new THREE.SphereGeometry(0.11, 14, 10), pal, x + Math.cos(a) * r, y, z + Math.sin(a) * r, false); ms.push(k);
      const sp = this.deco(part, new THREE.BoxGeometry(r, 0.05, 0.05), pal, x + Math.cos(a) * r / 2, y, z + Math.sin(a) * r / 2, false);
      sp.rotation.y = -a; ms.push(sp);
    }
    const proxy = this.deco(part, new THREE.CylinderGeometry(r + 0.3, r + 0.3, 0.7, 24), pal, x, y, z, false);
    proxy.material = new THREE.MeshBasicMaterial({ visible: false });
    ms.push(proxy);
    ms.center = [x, y, z];
    return ms;
  }
  // ручка-кноб для повзуна (на видимій грані)
  knob(part, x, y, z, face, pal = 'h') {
    const g = new THREE.Group(), d = DIRS[face], ms = [];
    const body = new THREE.Mesh(aoGeom(new THREE.CylinderGeometry(0.17, 0.2, 0.22, 24)), this.mat(pal));
    body.rotation.z = -Math.PI / 2; body.position.x = 0.11; g.add(body); ms.push(body);
    for (let i = 0; i < 2; i++) {
      const r = new THREE.Mesh(aoGeom(new THREE.TorusGeometry(0.175, 0.028, 8, 28)), this.mat(pal));
      r.rotation.y = Math.PI / 2; r.position.x = 0.06 + i * 0.1; g.add(r); ms.push(r);
    }
    const cap = new THREE.Mesh(aoGeom(new THREE.SphereGeometry(0.1, 16, 10)), this.mat(pal)); cap.position.x = 0.24; g.add(cap); ms.push(cap);
    const proxy = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 8), new THREE.MeshBasicMaterial({ visible: false }));
    proxy.position.x = 0.15; g.add(proxy); ms.push(proxy);
    if (face === '+z') g.rotation.y = -Math.PI / 2;
    part.add(g, x + d[0] * 0.5, y, z + d[2] * 0.5);
    return ms;
  }
  // кнопка-плита: коли Іда стає на неї — викликається fn
  button(x, y, z, fn) { this.pendingButtons.push({ x, y, z, fn }); }
  attachButton(b) {
    const n = this.nodeAt([b.x, b.y, b.z]);
    const plate = this.deco(n.part, new THREE.CylinderGeometry(0.3, 0.33, 0.06, 32), 'h', b.x, b.y + 0.53, b.z, false);
    const ring = this.deco(n.part, new THREE.TorusGeometry(0.2, 0.025, 8, 36), 'd', b.x, b.y + 0.565, b.z, false);
    ring.rotation.x = Math.PI / 2;
    const mat = plate.material = makeMat(...(this.def.pals.h || PAL_COMMON.h)); this.extraMats.push(mat);
    n.button = { fn: b.fn, pressed: false, plate, ring, mat };
  }
  pressButton(n) {
    const b = n.button; if (!b || b.pressed) return;
    b.pressed = true; sfx.button();
    const p0 = b.plate.position.y;
    this.anims.push({ t: 0, update(t, dt) { this.t = Math.min(1, this.t + dt * 3); b.plate.position.y = p0 - 0.035 * this.t; b.ring.position.y = p0 + 0.035 - 0.035 * this.t; b.mat.uniforms.glow.value = 0.35 * (1 - this.t); } });
    b.fn();
  }
  // частина з'являється з туману (після натискання кнопки)
  hideUntil(part, off) { part.enabled = false; part.offset.set(...off); part.applyOffset(); }
  revealer(part, dur = 3) {
    const lv = this;
    return () => {
      const o0 = part.offset.clone();
      lv.anims.push({ t: 0, blocking: false, update(t, dt) {
        if (this.dead) return;
        this.t = Math.min(1, this.t + dt / dur);
        const e = this.t < 0.5 ? 4 * this.t ** 3 : 1 - Math.pow(-2 * this.t + 2, 3) / 2;
        part.offset.copy(o0).multiplyScalar(1 - e); part.applyOffset();
        if (this.t >= 1) { this.dead = true; part.enabled = true; lv.rebuildGraph(); sfx.reveal(); }
      } });
    };
  }
  // портал-вихід: стрілчаста арка зі світлом усередині
  portal(node, dir) {
    const d = DIRS[dir], W = node.rest;
    const s = new THREE.Shape();
    s.moveTo(-0.42, 0); s.lineTo(-0.42, 0.98); s.quadraticCurveTo(-0.42, 1.18, 0, 1.32); s.quadraticCurveTo(0.42, 1.18, 0.42, 0.98);
    s.lineTo(0.42, 0); s.lineTo(0.25, 0); s.lineTo(0.25, 0.66); s.quadraticCurveTo(0.25, 0.9, 0, 1.0); s.quadraticCurveTo(-0.25, 0.9, -0.25, 0.66);
    s.lineTo(-0.25, 0); s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth: 0.16, bevelEnabled: false, curveSegments: 14 });
    geo.translate(0, 0, -0.08);
    aoGeom(geo, (px, py) => 0.86 + 0.14 * Math.min(1, py / 0.6));
    const frame = new THREE.Mesh(geo, this.mat('h'));
    const inner = new THREE.Shape();
    inner.moveTo(-0.25, 0); inner.lineTo(0.25, 0); inner.lineTo(0.25, 0.66); inner.quadraticCurveTo(0.25, 0.9, 0, 1.0); inner.quadraticCurveTo(-0.25, 0.9, -0.25, 0.66); inner.closePath();
    const glowMat = new THREE.ShaderMaterial({
      uniforms: { t: U.time, c: { value: new THREE.Color('#fffaf0') } },
      vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `uniform float t; uniform vec3 c; varying vec2 vP;
        void main(){ float a = 0.62 + 0.2 * sin(t * 2.2 - vP.y * 6.0); a *= 0.55 + 0.45 * smoothstep(0.0, 0.8, vP.y);
        gl_FragColor = vec4(c, a); }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
    });
    this.extraMats.push(glowMat);
    const glow = new THREE.Mesh(new THREE.ShapeGeometry(inner, 14), glowMat);
    const g = new THREE.Group(); g.add(frame); g.add(glow);
    if (d[0]) g.rotation.y = Math.PI / 2;
    node.part.add(g, W.x + d[0] * 0.4, W.y, W.z + d[2] * 0.4);
    this.viewPoint(W.x, W.y + 1.4, W.z);
    // світлові порошинки, що здіймаються з порталу
    const motes = [];
    for (let i = 0; i < 7; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
      this.extraMats.push(m.material);
      node.part.add(m, W.x + d[0] * 0.4, W.y, W.z + d[2] * 0.4); motes.push({ m, ph: i / 7, base: m.position.clone() });
    }
    this.anims.push({ update: (t) => {
      for (const o of motes) {
        const k = (t * 0.25 + o.ph) % 1;
        o.m.position.set(o.base.x + Math.sin(o.ph * 40 + t) * 0.15 * (1 - Math.abs(d[0])), o.base.y + 0.1 + k * 1.3, o.base.z + Math.sin(o.ph * 40 + t) * 0.15 * Math.abs(d[0]));
        o.m.material.opacity = Math.sin(k * Math.PI) * 0.8;
      }
    } });
    this.portalDir = new V3(...d);
  }

  // ---------- налагодження: точки вузлів і ребра (?debug) ----------
  drawDebug() {
    if (this.dbg) { this.root.remove(this.dbg); }
    this.dbg = new THREE.Group();
    const pts = [], cols = [];
    for (const n of this.nodes) for (const e of n.edges) if (n.id < e.to.id) {
      pts.push(n.world.x, n.world.y + 0.05, n.world.z, e.pa.x, e.pa.y + 0.05, e.pa.z, e.pb.x, e.pb.y + 0.05, e.pb.z, e.to.world.x, e.to.world.y + 0.05, e.to.world.z);
    }
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    this.dbg.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x2244ff, depthTest: false })));
    for (const n of this.nodes) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), new THREE.MeshBasicMaterial({ color: n.walkable ? 0x00aa55 : 0xdd2222, depthTest: false }));
      m.position.copy(n.world); m.renderOrder = 999; this.dbg.add(m);
    }
    this.dbg.children[0].renderOrder = 998;
    this.root.add(this.dbg);
  }
  dispose() {
    scene.remove(this.root);
    this.root.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    for (const k in this.mats) this.mats[k].dispose();
    for (const m of this.extraMats) m.dispose();
  }
}

/* Маршрут → відрізки руху. Кожне ребро a→b: центр a → порт a, «телепорт» у порт b
   (на екрані — та сама точка), порт b → центр b. Для ілюзорних ребер малюємо Іду
   в системі ближчого до камери вузла, щоб її не перекривала «чужа» геометрія. */
function startPath(path) {
  const segs = [];
  for (let i = 0; i + 1 < path.length; i++) {
    const a = path[i], b = path[i + 1];
    const e = a.edges.find(e => e.to === b);
    const k = e.pb.clone().sub(e.pa);                      // ≈ k·(1,1,1)
    const front = depthOf(k) > 0.01, back = depthOf(k) < -0.01;
    segs.push({ from: a.world.clone(), to: e.pa.clone(), shift: front ? k.clone() : new V3(), end: null });
    segs.push({ from: e.pb.clone(), to: b.world.clone(), shift: back ? k.clone().negate() : new V3(), end: b });
  }
  ida.segs = segs; ida.seg = 0; ida.u = 0; ida.walking = segs.length > 0;
}
function walkTo(target) {
  if (!lv || !ida.node || !target) return false;
  if (ida.walking) { ida.pending = target; return true; }
  const path = lv.findPath(ida.node, target);
  if (!path || path.length < 2) return !!path;
  startPath(path);
  return true;
}
function onArrive(n) {
  ida.node = n;
  if (n.button) lv.pressButton(n);
  if (n.goal && !lv.done) { beginExit(); return true; }
  if (ida.pending) {
    const t = ida.pending; ida.pending = null;
    const path = lv.findPath(n, t);
    if (path && path.length > 1) { startPath(path); return true; }
  }
  return false;
}
function beginExit() {
  lv.done = true; ida.walking = false;
  ida.exiting = { t: 0, from: lv.goal.world.clone(), dir: lv.portalDir.clone() };
  ida.face = Math.atan2(lv.portalDir.x, lv.portalDir.z);
  sfx.portal();
}
const tmpV = new V3();
function updateIda(dt) {
  if (!lv || !ida.node) return;
  const SPEED = 2.1;
  let pos = new V3(), shift = new V3(), moving = false;
  if (ida.exiting) {
    const ex = ida.exiting; ex.t += dt;
    const k = Math.min(1, ex.t / 1.4);
    pos.copy(ex.from).addScaledVector(ex.dir, 0.55 * Math.min(1, ex.t / 0.9));
    setIdaOpacity(1 - k);
    moving = ex.t < 0.9;
    if (ex.t > 1.6 && !ex.fired) { ex.fired = true; levelComplete(); }
  } else if (ida.walking) {
    let left = SPEED * dt;
    while (left > 0 && ida.walking) {
      const s = ida.segs[ida.seg], len = s.from.distanceTo(s.to);
      const remain = (1 - ida.u) * len;
      if (remain > left) { ida.u += left / len; break; }
      // відрізок пройдено
      left -= remain; ida.u = 0; ida.seg++;
      if (ida.seg >= ida.segs.length) ida.walking = false;
      if (s.end) { onArrive(s.end); if (ida.exiting) break; }   // onArrive може почати новий маршрут
    }
    if (ida.walking) {
      const s = ida.segs[ida.seg];
      pos.lerpVectors(s.from, s.to, ida.u); shift.copy(s.shift);
      const dx = s.to.x - s.from.x, dz = s.to.z - s.from.z;
      if (dx * dx + dz * dz > 1e-6) ida.face = Math.atan2(dx, dz);
      moving = true;
    } else if (!ida.exiting) { lv.nodeWorld(ida.node, pos); ida.faceLocal = ida.face - ida.node.part.yaw(); }
    else pos.copy(lv.goal.world);
  } else {
    // стоїть — «їде» разом зі своєю частиною (обертання / ліфт)
    lv.nodeWorld(ida.node, pos);
    ida.face = ida.faceLocal + ida.node.part.yaw();
  }
  // невеликий зсув уздовж (1,1,1): екранне положення те саме, але Іда трохи «ближче»
  IDA.root.position.copy(pos).add(shift).addScalar(0.06);
  // плавний поворот
  const r = IDA.root.rotation.y, d = wrapPI(ida.face - r);
  IDA.root.rotation.y = r + d * Math.min(1, dt * 14);
  // анімація ходьби: крок, похитування
  if (moving) ida.phase += dt * 13; else ida.phase += (Math.round(ida.phase / Math.PI) * Math.PI - ida.phase) * Math.min(1, dt * 10);
  const s = Math.sin(ida.phase);
  IDA.legs[0].position.z = s * 0.04; IDA.legs[1].position.z = -s * 0.04;
  IDA.body.position.y = Math.abs(Math.cos(ida.phase)) * 0.022 * (moving ? 1 : 0);
  IDA.body.rotation.z = s * 0.05 * (moving ? 1 : 0);
  IDA.hat.rotation.x = -0.08 + (moving ? 0.06 : Math.sin(U.time.value * 1.3) * 0.02);
  IDA.body.scale.y = 1 + (moving ? 0 : Math.sin(U.time.value * 2) * 0.012);
}

/* =====================================================================
   9. ЕФЕКТИ: брижі від дотику, звук
   ===================================================================== */
const ripples = [];
function ripple(pos, ok) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.2, 40), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: ok ? 0.85 : 0.35, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.copy(pos).add(new V3(0, 0.02, 0)); scene.add(m);
  ripples.push({ m, t: 0, o: m.material.opacity });
}
function updateRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    const k = r.t / 0.7; r.m.scale.setScalar(1 + k * 1.4); r.m.material.opacity = r.o * (1 - k);
    if (k >= 1) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); ripples.splice(i, 1); }
  }
}

// Тиха процедурна музика взаємодії: м'які синусоїдні дзвіночки з луною
const sfx = (() => {
  let ctx = null, out = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createGain(); out.gain.value = 0.22;
      const dl = ctx.createDelay(); dl.delayTime.value = 0.32;
      const fb = ctx.createGain(); fb.gain.value = 0.35;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      out.connect(ctx.destination); out.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(ctx.destination);
    } catch (e) { ctx = null; }
  }
  function tone(f, at, dur = 1.6, vol = 0.5) {
    if (!ctx) return;
    const t = ctx.currentTime + at;
    for (const [mul, v] of [[1, 1], [2, 0.18], [3.01, 0.06]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f * mul;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / mul);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.1);
    }
  }
  const PENT = [392, 440, 523.25, 587.33, 659.25, 783.99, 880];
  let k = 0;
  return {
    init,
    snap() { tone(PENT[(k++ * 3) % 5], 0, 1.4, 0.35); },
    step() {},
    button() { tone(523.25, 0, 2, 0.4); tone(659.25, 0.08, 2, 0.3); tone(783.99, 0.16, 2.2, 0.28); },
    reveal() { tone(392, 0, 2.6, 0.3); tone(587.33, 0.12, 2.6, 0.25); },
    portal() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * 0.13, 2.4, 0.3)); },
    tap() { tone(1046.5, 0, 0.5, 0.06); },
  };
})();

/* =====================================================================
   10. ВВЕДЕННЯ: тап по шляху → іти, перетягування ручок → крутити/зсувати
   ===================================================================== */
const raycaster = new THREE.Raycaster();
function pointerInfo(e) {
  const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  const w = new V3(ndc.x, ndc.y, 0).unproject(camera);
  return { ndc, s: scr(w) };
}
function controlsFree() { return lv && !lv.done && !ida.walking && !ida.exiting && !loading; }
function pickHandle(ndc) {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(lv.handles, false);
  return hits.length ? hits[0].object.userData.ctrl : null;
}
function pickNode(ndc, s) {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(lv.solids, false);
  if (hits.length) {
    const h = hits[0], nrm = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    let best = null, bd = 1e9;
    for (const n of lv.nodes) {
      const d = h.point.clone().sub(n.world);
      if (n.type === 'tile' && nrm.y > 0.7 && Math.abs(d.x) < 0.56 && Math.abs(d.z) < 0.56 && Math.abs(d.y) < 0.15) return n;
      if (n.type === 'stair' && n.part.obj === findPartObj(h.object) && d.length() < 0.8 && d.length() < bd) { bd = d.length(); best = n; }
    }
    if (best) return best;
  }
  // запасний варіант: суто екранний (ромб верхньої грані), перевага — ближчому до камери
  let best = null, bestDepth = -1e9, near = null, nd = 0.8;
  for (const n of lv.nodes) {
    const c = scr(n.world), dx = s.x - c.x, dy = s.y - c.y;
    const lx = (SQ2 * dx - SQ6 * dy) / 2, lz = (-SQ2 * dx - SQ6 * dy) / 2;   // екран → площина верху
    const inside = n.type === 'tile' ? Math.abs(lx) < 0.55 && Math.abs(lz) < 0.55 : Math.hypot(dx, dy) < 0.55;
    if (inside && depthOf(n.world) > bestDepth) { bestDepth = depthOf(n.world); best = n; }
    const dd = Math.hypot(dx, dy); if (dd < nd) { nd = dd; near = n; }
  }
  return best || near;
}
function findPartObj(o) { while (o && !lv.parts.some(p => p.obj === o)) o = o.parent; return o; }

let drag = null, down = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  sfx.init();
  if (endShown) { restart(); return; }
  if (!lv || loading) return;
  const p = pointerInfo(e);
  const ctrl = controlsFree() && !lv.busy ? pickHandle(p.ndc) : null;
  if (ctrl) {
    drag = { ctrl, x: e.clientX, y: e.clientY, moved: false };
    ctrl.dragStart(p.s);
    cv.setPointerCapture(e.pointerId);
  } else down = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true;
  if (drag.moved) drag.ctrl.dragMove(pointerInfo(e).s);
});
function endPointer(e) {
  if (drag) { drag.ctrl.dragEnd(drag.moved); drag = null; return; }
  if (!down || !lv || lv.done || loading) { down = null; return; }
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 14 || lv.busy) return;
  const p = pointerInfo(e);
  const n = pickNode(p.ndc, p.s);
  if (!n) return;
  const ok = walkTo(n) && n !== ida.node;
  ripple(n.world, ok || ida.walking);
  if (ok) sfx.tap();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', () => { if (drag) { drag.ctrl.dragEnd(true); drag = null; } down = null; });

/* =====================================================================
   11. ПОТІК РІВНІВ: fade-переходи, назва, фінал
   ===================================================================== */
const $fade = document.getElementById('fade'), $title = document.getElementById('title'), $end = document.getElementById('end');
const wait = ms => new Promise(r => setTimeout(r, ms));
let lv = null, cur = 0, loading = false, endShown = false;

async function loadLevel(i, first = false) {
  loading = true;
  $title.style.opacity = 0;
  if (!first) { $fade.style.opacity = 1; await wait(1400); }
  if (lv) lv.dispose();
  ripples.splice(0).forEach(r => scene.remove(r.m));
  const def = LEVELS[i];
  cur = i;
  // фон і туман рівня
  const root = document.documentElement.style;
  root.setProperty('--bgTop', def.bg[0]); root.setProperty('--bgBot', def.bg[1]); root.setProperty('--fade', def.fade);
  document.querySelector('meta[name=theme-color]').content = def.bg[0];
  U.bgTop.value.set(def.bg[0]); U.bgBot.value.set(def.bg[1]); U.fog.value.set(def.fog[0], def.fog[1]);
  lv = new Level(def, i);
  // Іда
  ida.node = lv.start; ida.walking = false; ida.pending = null; ida.exiting = null; ida.segs = [];
  ida.face = ida.faceLocal = Math.PI / 2; IDA.root.rotation.y = ida.face; setIdaOpacity(1);
  onResize();
  $title.querySelector('.num').textContent = def.num;
  $title.querySelector('.name').textContent = def.name;
  await wait(200);
  $fade.style.opacity = 0;
  loading = false;
  await wait(700); $title.style.opacity = 1;
  await wait(3600); if (cur === i) $title.style.opacity = 0;
}
async function levelComplete() {
  if (cur + 1 < LEVELS.length) loadLevel(cur + 1);
  else {
    loading = true;
    $fade.style.opacity = 1; await wait(1500);
    $end.style.opacity = 1; await wait(1500);
    endShown = true;
  }
}
async function restart() {
  endShown = false; $end.style.opacity = 0; await wait(900);
  loadLevel(0);
}

/* =====================================================================
   12. ГОЛОВНИЙ ЦИКЛ (requestAnimationFrame + delta-time)
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  U.time.value += dt;
  if (lv) {
    for (const c of lv.ctrls) c.update(dt);
    for (const a of lv.anims) a.update(U.time.value, dt);
    lv.root.updateMatrixWorld(true);
    updateIda(dt);
    // ручки м'яко «дихають», коли ними можна скористатися
    const g = controlsFree() ? 0.06 + 0.06 * Math.sin(U.time.value * 2.4) : 0;
    if (lv.mats.h) lv.mats.h.uniforms.glow.value = g;
    for (const n of lv.nodes) if (n.button && !n.button.pressed) n.button.mat.uniforms.glow.value = 0.12 + 0.12 * Math.sin(U.time.value * 3);
  }
  updateRipples(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

onResize();
const startIdx = Math.max(0, Math.min(LEVELS.length - 1, (parseInt(PARAMS.get('level')) || 1) - 1));
loadLevel(startIdx, true);
requestAnimationFrame(frame);

// Невеликий API для налагодження / автотестів (не впливає на гру)
window.MV = {
  get level() { return lv; }, get ida() { return ida; }, LEVELS, walkTo, loadLevel,
  node: c => lv.nodeAt(c),
  reach: (a, b) => !!lv.findPath(a ? lv.nodeAt(a) : ida.node, lv.nodeAt(b)),
  setCtrl: (i, v) => { const c = lv.ctrls[i]; c.setIndex ? c.setIndex(v) : c.setValue(v); },
  teleport: c => { ida.node = lv.nodeAt(c); ida.walking = false; },
  // екранні пікселі для світової точки / вузла / ручки
  px: (x, y, z) => { const v = new V3(x, y, z).project(camera); return [(v.x + 1) / 2 * window.innerWidth, (1 - v.y) / 2 * window.innerHeight]; },
  nodePx: c => { const w = lv.nodeAt(c).world; return MV.px(w.x, w.y, w.z); },
  handlePx: i => { const h = lv.handles.find(h => h.userData.ctrl === lv.ctrls[i]); const w = h.getWorldPosition(new V3()); return MV.px(w.x, w.y, w.z); },
  get cur() { return cur; },
};
</script>
</body>
